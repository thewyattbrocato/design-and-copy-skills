<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillwater – 21-day streak</title>
<!--
  Design note: the brief asked for flashing lights and a pulsing screen. To keep this safe for
  people with photosensitive epilepsy (WCAG 2.3.1) and calm for a journaling product, the
  "flash" is delivered as: fireworks bursts spaced well under 3/sec, a slow (~4s) low-contrast
  glow swell instead of strobing, and no full-screen luminance flashes. prefers-reduced-motion
  (or the "Calm mode" button) turns off all motion and shows a static celebration.
-->
<style>
  :root {
    --bg1: #0b1a2b;
    --bg2: #050b14;
    --ink: #f4f7fb;
    --muted: #a9b8cc;
    --accent: #ffd98a;
    --accent2: #7fd6c8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 60%, var(--bg1), var(--bg2) 70%);
    overflow: hidden;
  }
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(127,214,200,.22), rgba(255,217,138,.08) 40%, transparent 65%);
    opacity: .55;
    animation: swell 4s ease-in-out infinite;
  }
  @keyframes swell {
    0%, 100% { opacity: .35; transform: scale(.96); }
    50%      { opacity: .7;  transform: scale(1.04); }
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 8px;
  }
  .eyebrow {
    letter-spacing: .28em; text-transform: uppercase; font-size: 13px; color: var(--accent2);
    opacity: 0; animation: rise .9s .2s ease-out forwards;
  }
  .num {
    font-size: clamp(120px, 28vw, 260px); line-height: 1; font-weight: 800;
    letter-spacing: -.04em; margin: 0;
    background: linear-gradient(180deg, #fff 10%, var(--accent) 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(255,217,138,.35));
    font-variant-numeric: tabular-nums;
    opacity: 0; animation: pop .9s .4s cubic-bezier(.2,1.3,.4,1) forwards;
  }
  h1 {
    margin: 0; font-size: clamp(24px, 4.5vw, 40px); font-weight: 600;
    opacity: 0; animation: rise .9s .9s ease-out forwards;
  }
  p {
    margin: 4px 0 20px; max-width: 34ch; color: var(--muted); font-size: clamp(15px, 2.2vw, 18px); line-height: 1.5;
    opacity: 0; animation: rise .9s 1.2s ease-out forwards;
  }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    opacity: 0; animation: rise .9s 1.5s ease-out forwards; }
  button {
    font: inherit; font-size: 16px; cursor: pointer; border-radius: 999px; padding: 14px 28px;
    border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--ink);
    transition: background .2s, transform .15s;
  }
  button.primary { background: var(--accent); color: #1b1305; border-color: transparent; font-weight: 600; }
  button:hover { transform: translateY(-1px); background: rgba(255,255,255,.08); }
  button.primary:hover { background: #ffe5a8; }
  button:focus-visible { outline: 3px solid var(--accent2); outline-offset: 3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }

  .calm .glow { animation: none; opacity: .5; }
  .calm .eyebrow, .calm .num, .calm h1, .calm p, .calm .actions { animation: none; opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; opacity: .5; }
    .eyebrow, .num, h1, p, .actions { animation: none; opacity: 1; transform: none; }
    button { transition: none; }
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main role="dialog" aria-modal="true" aria-labelledby="title">
  <div class="eyebrow">Streak unlocked</div>
  <div class="num" id="num" aria-hidden="true">21</div>
  <h1 id="title">21 days of writing</h1>
  <p>Three weeks of showing up for yourself, one page at a time. That's a real habit now.</p>
  <div class="actions">
    <button class="primary" id="continue">Continue</button>
    <button id="calm" aria-pressed="false">Calm mode</button>
  </div>
</main>

<script>
(() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  let calm = mq.matches;
  let w, h, dpr, particles = [], last = 0, nextBurst = 0, raf;
  const colors = [[255,217,138],[127,214,200],[255,160,160],[170,190,255],[255,255,255]];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.width = innerWidth * dpr;
    h = canvas.height = innerHeight * dpr;
    if (calm) drawStatic();
  }

  function burst(x, y) {
    const c = colors[(Math.random() * colors.length) | 0];
    const n = 70 + (Math.random() * 40 | 0);
    const speed = (2.5 + Math.random() * 2.5) * dpr;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * .1;
      const s = speed * (.6 + Math.random() * .5);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: .008 + Math.random() * .008, c });
    }
  }

  function frame(t) {
    const dt = Math.min((t - last) / 16.7, 3); last = t;
    // fade trails (no bright flashes: background stays dark)
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';

    // At most one burst per ~0.9s on average: well under the 3 flashes/sec limit
    if (t > nextBurst) {
      burst(w * (.15 + Math.random() * .7), h * (.15 + Math.random() * .4));
      nextBurst = t + 900 + Math.random() * 900;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += .04 * dpr * dt; p.vx *= .985; p.vy *= .985;
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.life * .85})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.8 * dpr * p.life + .4, 0, 7); ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }

  // Static, motion-free celebration: soft frozen bursts
  function drawStatic() {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    const spots = [[.18,.25],[.82,.22],[.12,.7],[.88,.68],[.5,.12]];
    spots.forEach(([fx, fy], k) => {
      const c = colors[k % colors.length], cx = w * fx, cy = h * fy, n = 36;
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2;
        for (let r = 1; r <= 3; r++) {
          const d = r * 22 * dpr;
          ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${.7 - r * .17})`;
          ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, (3.2 - r * .7) * dpr, 0, 7); ctx.fill();
        }
      }
    });
  }

  function start() {
    cancelAnimationFrame(raf);
    particles = [];
    ctx.clearRect(0, 0, w, h);
    if (calm) { drawStatic(); return; }
    last = performance.now(); nextBurst = last + 400;
    raf = requestAnimationFrame(frame);
  }

  function setCalm(v) {
    calm = v;
    document.body.classList.toggle('calm', v);
    const b = document.getElementById('calm');
    b.setAttribute('aria-pressed', String(v));
    b.textContent = v ? 'Bring back the fireworks' : 'Calm mode';
    start();
  }

  document.getElementById('calm').addEventListener('click', () => setCalm(!calm));
  document.getElementById('continue').addEventListener('click', () => {
    cancelAnimationFrame(raf);
    document.querySelector('main').style.display = 'none';
    canvas.style.display = 'none';
    document.querySelector('.glow').style.display = 'none';
  });
  mq.addEventListener && mq.addEventListener('change', e => setCalm(e.matches));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf); else if (!calm) start();
  });
  addEventListener('resize', resize);

  resize();
  setCalm(calm);
  document.getElementById('continue').focus();
})();
</script>
</body>
</html>
