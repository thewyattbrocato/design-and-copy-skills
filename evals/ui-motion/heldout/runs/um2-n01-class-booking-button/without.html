<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnhouse – Saturday Wheel-Throwing</title>
<style>
  :root {
    --clay: #b5573a;
    --clay-dark: #94432b;
    --ink: #2b2420;
    --muted: #6f625a;
    --paper: #faf5ee;
    --card: #fffdf9;
    --line: #e6dccf;
    --ok: #2f6b4a;
    --warn: #a4531a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(43,36,32,.05), 0 8px 24px rgba(43,36,32,.07);
  }
  .studio {
    margin: 0 0 6px;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--clay);
    font-weight: 700;
  }
  h1 { margin: 0 0 16px; font-size: 22px; line-height: 1.25; }
  dl { margin: 0 0 20px; display: grid; gap: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; padding-bottom: 0; }
  dt { color: var(--muted); font-size: 14px; }
  dd { margin: 0; font-weight: 600; text-align: right; }
  .price { font-size: 20px; }
  .seats { transition: color .2s; }
  .seats.low { color: var(--warn); }
  .seats.bump { animation: bump .35s ease; }
  @keyframes bump { 40% { transform: scale(1.2); } }

  button {
    width: 100%;
    min-height: 48px;
    border: 0;
    border-radius: 12px;
    background: var(--clay);
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background .15s, transform .08s;
  }
  button:hover:not(:disabled) { background: var(--clay-dark); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:focus-visible { outline: 3px solid #e9b8a6; outline-offset: 2px; }
  button:disabled { cursor: default; }
  button.pending { background: var(--clay-dark); }
  button.done { background: var(--ok); }
  button.soldout { background: #d9cfc3; color: var(--muted); }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { min-height: 20px; margin: 12px 0 0; font-size: 14px; text-align: center; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: #a62d2d; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 1.5s !important; transition: none !important; }
    .seats.bump { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="studio">Kilnhouse Pottery</p>
    <h1>Saturday Wheel-Throwing</h1>
    <dl>
      <div class="row"><dt>When</dt><dd>Sat, Oct 17 · 10:00 am – 12:30 pm</dd></div>
      <div class="row"><dt>Price</dt><dd class="price">$65</dd></div>
      <div class="row"><dt>Seats left</dt><dd id="seats" class="seats">5</dd></div>
    </dl>
    <button id="reserve" type="button">Reserve a seat</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

<script>
  let seats = 5;
  let reserved = false;
  let pending = false;

  const seatsEl = document.getElementById('seats');
  const btn = document.getElementById('reserve');
  const statusEl = document.getElementById('status');

  function renderSeats(bump) {
    seatsEl.textContent = seats;
    seatsEl.classList.toggle('low', seats <= 3);
    if (bump) {
      seatsEl.classList.remove('bump');
      void seatsEl.offsetWidth;
      seatsEl.classList.add('bump');
    }
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function setButton(state) {
    btn.className = state === 'idle' ? '' : state;
    btn.disabled = state !== 'idle';
    btn.setAttribute('aria-busy', state === 'pending');
    if (state === 'pending') btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Reserving…';
    else if (state === 'done') btn.textContent = '✓ Seat reserved';
    else if (state === 'soldout') btn.textContent = 'Sold out';
    else btn.textContent = 'Reserve a seat';
  }

  // Fake network call: resolves after 1–2 seconds.
  function fakeReserveRequest() {
    return new Promise((resolve) => setTimeout(resolve, 1000 + Math.random() * 1000));
  }

  btn.addEventListener('click', async () => {
    if (pending || reserved || seats < 1) return;
    pending = true;

    // Optimistic update: react instantly, confirm later.
    seats -= 1;
    renderSeats(true);
    setButton('pending');
    setStatus('Holding your seat…');

    try {
      await fakeReserveRequest();
      reserved = true;
      setButton('done');
      setStatus('You\u2019re in! See you Saturday.', 'ok');
    } catch (e) {
      // Roll back if the request fails.
      seats += 1;
      renderSeats(true);
      setButton('idle');
      setStatus('Couldn\u2019t reserve your seat. Please try again.', 'err');
    } finally {
      pending = false;
    }
  });

  renderSeats(false);
  setButton('idle');
</script>
</body>
</html>
