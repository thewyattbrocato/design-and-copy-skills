<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarterly signups by channel</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #fff; color: #1f2933; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  figure { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 20px; line-height: 1.3; margin: 0 0 4px; font-weight: 650; }
  .sub { margin: 0 0 16px; font-size: 14px; color: #52606d; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: inherit; fill: #52606d; font-size: 13px; }
  .cat { fill: #1f2933; font-size: 14px; }
  .val { fill: #1f2933; font-size: 14px; font-weight: 600; }
  .grid { stroke: #e4e7eb; stroke-width: 1; }
  .base { stroke: #7b8794; stroke-width: 1; }
  .bar { fill: #aab4be; }
  .hero { fill: #c2410c; }
  .note { font-size: 12px; color: #52606d; margin: 12px 0 0; }
  table { border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  details summary { font-size: 13px; color: #52606d; cursor: pointer; margin-top: 12px; }
  th, td { text-align: left; padding: 4px 16px 4px 0; border-bottom: 1px solid #e4e7eb; }
  td.n, th.n { text-align: right; }
</style>
</head>
<body>
<figure>
  <h1>Partner webinars drove the most signups this quarter</h1>
  <p class="sub">Signups by channel, in thousands. Partner webinars brought in about 59.5k, roughly 29% more than organic search (46k).</p>

  <svg viewBox="0 0 660 310" role="img" aria-labelledby="t d">
    <title id="t">Signups by channel, in thousands</title>
    <desc id="d">Horizontal bars on a zero baseline: Partner webinars 59.5, Referral program 54.5, Email campaigns 51, Paid social 49.5, Organic search 46.</desc>

    <g>
      <line class="grid" x1="170" y1="10" x2="170" y2="262"/>
      <line class="grid" x1="316.7" y1="10" x2="316.7" y2="262"/>
      <line class="grid" x1="463.3" y1="10" x2="463.3" y2="262"/>
      <line class="grid" x1="610" y1="10" x2="610" y2="262"/>
    </g>
    <line class="base" x1="170" y1="10" x2="170" y2="262"/>

    <g text-anchor="end">
      <text class="cat" x="160" y="43">Partner webinars</text>
      <text class="cat" x="160" y="93">Referral program</text>
      <text class="cat" x="160" y="143">Email campaigns</text>
      <text class="cat" x="160" y="193">Paid social</text>
      <text class="cat" x="160" y="243">Organic search</text>
    </g>

    <!-- scale: 7.333 px per thousand, zero at x=170 -->
    <rect class="hero" x="170" y="20" width="436.3" height="36"/>
    <rect class="bar" x="170" y="70" width="399.7" height="36"/>
    <rect class="bar" x="170" y="120" width="374" height="36"/>
    <rect class="bar" x="170" y="170" width="363" height="36"/>
    <rect class="bar" x="170" y="220" width="337.3" height="36"/>

    <text class="val" x="614" y="43">59.5</text>
    <text class="val" x="577" y="93">54.5</text>
    <text class="val" x="552" y="143">51</text>
    <text class="val" x="541" y="193">49.5</text>
    <text class="val" x="515" y="243">46</text>

    <g text-anchor="middle">
      <text x="170" y="280">0</text>
      <text x="316.7" y="280">20</text>
      <text x="463.3" y="280">40</text>
      <text x="610" y="280">60</text>
    </g>
    <text x="390" y="302" text-anchor="middle">Signups (thousands)</text>
  </svg>

  <p class="note">Bars start at zero. Values are read from the original chart and are approximate (about ±0.5k).</p>

  <details>
    <summary>View data as a table</summary>
    <table>
      <thead><tr><th>Channel</th><th class="n">Signups (thousands)</th></tr></thead>
      <tbody>
        <tr><td>Partner webinars</td><td class="n">59.5</td></tr>
        <tr><td>Referral program</td><td class="n">54.5</td></tr>
        <tr><td>Email campaigns</td><td class="n">51</td></tr>
        <tr><td>Paid social</td><td class="n">49.5</td></tr>
        <tr><td>Organic search</td><td class="n">46</td></tr>
      </tbody>
    </table>
  </details>
</figure>
</body>
</html>
