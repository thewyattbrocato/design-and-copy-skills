<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarterly signups by channel</title>
<style>
  :root {
    --surface: #ffffff;
    --ink: #1a1d23;
    --ink-2: #4b5260;
    --grid: #e3e6eb;
    --bar: #2a6fdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #14171c;
      --ink: #eef0f3;
      --ink-2: #aab0bb;
      --grid: #2d323b;
      --bar: #6ea2f5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--surface);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  figure { margin: 0 auto; max-width: 640px; }
  h1 { font-size: 20px; line-height: 1.3; margin: 0 0 4px; font-weight: 650; }
  p.sub { margin: 0 0 20px; font-size: 14px; color: var(--ink-2); }
  .chart { position: relative; padding-bottom: 28px; }
  .rows { position: relative; z-index: 1; margin: 0; padding: 0; list-style: none; }
  .row {
    display: grid;
    grid-template-columns: 9.5rem 1fr;
    align-items: center;
    height: 44px;
  }
  .name { font-size: 14px; padding-right: 12px; text-align: right; }
  .track { display: flex; align-items: center; height: 100%; }
  .bar {
    height: 26px;
    background: var(--bar);
    border-radius: 0 4px 4px 0;
  }
  .val {
    margin-left: 8px;
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .axis {
    position: absolute;
    left: 9.5rem; right: 0; top: 0; bottom: 0;
  }
  .tick {
    position: absolute; top: 0; bottom: 28px;
    border-left: 1px solid var(--grid);
  }
  .tick.zero { border-left-color: var(--ink-2); }
  .tick span {
    position: absolute; bottom: -22px; left: 0;
    transform: translateX(-50%);
    font-size: 12px; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 12px; color: var(--ink-2); margin: 4px 0 0 9.5rem; }
  @media (max-width: 480px) {
    .row { grid-template-columns: 7rem 1fr; }
    .axis, .unit { left: 7rem; margin-left: 0; }
    .unit { margin-left: 7rem; }
    .name { font-size: 13px; }
  }
</style>
</head>
<body>
<figure>
  <h1>Partner webinars drove the most signups, at 59.5K</h1>
  <p class="sub">Quarterly signups by channel, in thousands. Bars start at zero.</p>

  <div class="chart" role="img" aria-label="Horizontal bar chart of quarterly signups in thousands: Partner webinars 59.5, Referral program 54.5, Email campaigns 51.1, Paid social 49.5, Organic search 46.3.">
    <div class="axis" aria-hidden="true">
      <div class="tick zero" style="left:0"><span>0</span></div>
      <div class="tick" style="left:14.2857%"><span>10</span></div>
      <div class="tick" style="left:28.5714%"><span>20</span></div>
      <div class="tick" style="left:42.8571%"><span>30</span></div>
      <div class="tick" style="left:57.1429%"><span>40</span></div>
      <div class="tick" style="left:71.4286%"><span>50</span></div>
      <div class="tick" style="left:85.7143%"><span>60</span></div>
      <div class="tick" style="left:100%"><span>70</span></div>
    </div>

    <ul class="rows">
      <li class="row"><div class="name">Partner webinars</div><div class="track"><div class="bar" style="width:85%"></div><span class="val">59.5</span></div></li>
      <li class="row"><div class="name">Referral program</div><div class="track"><div class="bar" style="width:77.857%"></div><span class="val">54.5</span></div></li>
      <li class="row"><div class="name">Email campaigns</div><div class="track"><div class="bar" style="width:73%"></div><span class="val">51.1</span></div></li>
      <li class="row"><div class="name">Paid social</div><div class="track"><div class="bar" style="width:70.714%"></div><span class="val">49.5</span></div></li>
      <li class="row"><div class="name">Organic search</div><div class="track"><div class="bar" style="width:66.143%"></div><span class="val">46.3</span></div></li>
    </ul>
  </div>
  <p class="unit">Signups (thousands)</p>
</figure>
</body>
</html>
