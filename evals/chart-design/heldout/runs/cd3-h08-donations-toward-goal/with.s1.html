<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larder Lane Food Bank: progress to $300k goal</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d232b;
    --ink2: #4a5561;
    --muted: #737d88;
    --rule: #d5dae0;
    --c-ind: #2b6cb0;
    --c-biz: #e0962b;
    --c-evt: #7b5ea7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  figure { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; font-weight: 650; }
  .sub { color: var(--ink2); font-size: 15px; margin: 0 0 40px; }
  .sub b { color: var(--ink); }

  .chart { position: relative; padding-top: 52px; padding-bottom: 64px; }
  .bar { position: relative; height: 64px; }
  .seg { position: absolute; top: 0; height: 100%; border-right: 2px solid var(--bg); display: flex; align-items: center; padding-left: 10px; font-weight: 650; font-size: 18px; }
  .seg.ind { left: 0; width: 42%; background: var(--c-ind); color: #fff; border-radius: 4px 0 0 4px; }
  .seg.biz { left: 42%; width: 27%; background: var(--c-biz); color: #1d232b; }
  .seg.evt { left: 69%; width: 16.3333%; background: var(--c-evt); color: #fff; }
  .seg.rem { left: 85.3333%; width: 14.6667%; border: 2px dashed var(--muted); border-left: 0; border-radius: 0 4px 4px 0; background: transparent; color: var(--ink2); font-weight: 600; font-size: 15px; padding-left: 10px; }

  .lbl { position: absolute; top: 0; font-size: 13px; color: var(--ink2); line-height: 1.2; }
  .lbl b { color: var(--ink); font-weight: 600; }
  .lbl .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
  .lbl.l1 { left: 0; } .lbl.l2 { left: 42%; padding-left: 10px; } .lbl.l3 { left: 69%; padding-left: 10px; } .lbl.l4 { left: 85.3333%; padding-left: 10px; }

  .tick { position: absolute; width: 0; border-left: 2px solid var(--ink); }
  .tick.goal { left: 100%; top: 40px; height: 90px; margin-left: -1px; }
  .tick.pace { left: 75%; top: 100px; height: 70px; border-left: 2px dotted var(--ink); }
  .note { position: absolute; font-size: 13px; color: var(--ink2); line-height: 1.3; }
  .note b { color: var(--ink); }
  .note.goal { right: 0; bottom: 0; text-align: right; }
  .note.goal { top: 156px; bottom: auto; }
  .note.pace { left: 75%; top: 156px; transform: translateX(-100%); text-align: right; padding-right: 8px; }
  .axis0 { position: absolute; left: 0; top: 122px; font-size: 12px; color: var(--muted); }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 8px 0 28px; }
  .card { border-top: 4px solid; padding-top: 8px; }
  .card .n { font-size: 26px; font-weight: 650; }
  .card .t { font-size: 14px; color: var(--ink2); }
  .card.ind { border-color: var(--c-ind); } .card.biz { border-color: var(--c-biz); } .card.evt { border-color: var(--c-evt); }

  details { margin-top: 12px; font-size: 14px; }
  summary { cursor: pointer; color: var(--ink2); }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; }
  tfoot td { font-weight: 650; border-top: 2px solid var(--ink2); }
  .src { color: var(--muted); font-size: 12px; margin-top: 16px; }

  @media (max-width: 640px) {
    .seg { font-size: 14px; padding-left: 6px; }
    .lbl { font-size: 11px; }
    .lbl.l2, .lbl.l3, .lbl.l4 { padding-left: 6px; }
    .summary { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<figure>
  <h1>We've raised $256k of our $300k goal, with $44k to go in the last three months</h1>
  <p class="sub">Donations received January–September, in $ thousands, by donor type. Individuals gave the most (<b>$126k</b>); events added <b>$49k</b> from just four events.</p>

  <div class="chart" role="img" aria-label="Stacked bar: individuals $126k, businesses $81k, events $49k, totaling $256k toward a $300k goal. $44k remains. Straight-line pace for the end of September would be $225k.">
    <div class="bar">
      <div class="lbl l1" style="top:-24px"><span class="sw" style="background:var(--c-ind)"></span><b>Individuals</b></div>
      <div class="lbl l2" style="top:-24px"><span class="sw" style="background:var(--c-biz)"></span><b>Businesses</b></div>
      <div class="lbl l3" style="top:-24px"><span class="sw" style="background:var(--c-evt)"></span><b>Events</b></div>
      <div class="lbl l4" style="top:-24px"><b>Still to raise</b></div>
      <div class="seg ind">$126k</div>
      <div class="seg biz">$81k</div>
      <div class="seg evt">$49k</div>
      <div class="seg rem">$44k</div>
    </div>
    <div class="tick goal"></div>
    <div class="tick pace"></div>
    <div class="axis0">$0</div>
    <div class="note pace"><b>Straight-line pace: $225k</b><br>(9 of 12 months) — we're $31k ahead</div>
    <div class="note goal"><b>Goal: $300k</b><br>$256k raised so far (85%)</div>
  </div>

  <div class="summary">
    <div class="card ind"><div class="n">$126k</div><div class="t">Individuals · 49% of raised · $14k a month, steady</div></div>
    <div class="card biz"><div class="n">$81k</div><div class="t">Businesses · 32% of raised · $8k–$11k a month</div></div>
    <div class="card evt"><div class="n">$49k</div><div class="t">Events · 19% of raised · Feb, Apr, Jun, Sep only</div></div>
  </div>

  <details>
    <summary>Show monthly data ($ thousands)</summary>
    <table>
      <thead><tr><th>Month</th><th>Individuals</th><th>Businesses</th><th>Events</th><th>Total</th></tr></thead>
      <tbody>
        <tr><td>Jan</td><td>14</td><td>8</td><td>0</td><td>22</td></tr>
        <tr><td>Feb</td><td>12</td><td>9</td><td>4</td><td>25</td></tr>
        <tr><td>Mar</td><td>15</td><td>7</td><td>0</td><td>22</td></tr>
        <tr><td>Apr</td><td>13</td><td>10</td><td>15</td><td>38</td></tr>
        <tr><td>May</td><td>16</td><td>9</td><td>0</td><td>25</td></tr>
        <tr><td>Jun</td><td>14</td><td>11</td><td>12</td><td>37</td></tr>
        <tr><td>Jul</td><td>12</td><td>8</td><td>0</td><td>20</td></tr>
        <tr><td>Aug</td><td>13</td><td>9</td><td>0</td><td>22</td></tr>
        <tr><td>Sep</td><td>17</td><td>10</td><td>18</td><td>45</td></tr>
      </tbody>
      <tfoot><tr><td>Year to date</td><td>126</td><td>81</td><td>49</td><td>256</td></tr></tfoot>
    </table>
  </details>
  <p class="src">Larder Lane Food Bank donation records, January–September. The bar starts at $0 and ends at the $300k goal. Straight-line pace assumes equal giving each month, which events do not follow.</p>
</figure>
</body>
</html>
