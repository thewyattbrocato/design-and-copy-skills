<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larder Lane Food Bank: progress to $300k goal</title>
<style>
  :root { --ink:#1d2430; --muted:#5b6573; --line:#c9cfd8; --ind:#1f5f8b; --bus:#e3a537; --evt:#6a4c93; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:#fff; color:var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  figure { margin:0 auto; max-width:820px; }
  h1 { font-size:22px; line-height:1.25; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  svg { width:100%; height:auto; display:block; }
  svg text { font-family: inherit; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin:12px 0 0; padding:0; list-style:none; }
  .stats li { flex:1 1 180px; border-top:4px solid; padding:6px 0 0; font-size:14px; }
  .stats b { display:block; font-size:20px; }
  .stats span { color:var(--muted); }
  details { margin-top:16px; font-size:13px; color:var(--muted); }
  summary { cursor:pointer; }
  table { border-collapse:collapse; margin-top:8px; width:100%; font-variant-numeric:tabular-nums; }
  th, td { padding:3px 8px; text-align:right; border-bottom:1px solid #e3e6eb; }
  th:first-child, td:first-child { text-align:left; }
  tfoot td { font-weight:600; color:var(--ink); }
  .note { font-size:12px; color:var(--muted); margin-top:12px; }
</style>
</head>
<body>
<figure>
  <h1>We have raised $256k, 85% of our $300k goal, with $44k to go</h1>
  <p class="sub">Larder Lane Food Bank, donations January–September, by donor type ($ thousands)</p>

  <svg viewBox="0 0 800 210" role="img" aria-labelledby="t d">
    <title id="t">Stacked bar of $256k raised toward a $300k goal</title>
    <desc id="d">Individuals gave $126k, businesses $81k and events $49k, totaling $256k. $44k remains to reach $300k. An even pace for nine of twelve months would be $225k.</desc>

    <!-- axis ticks -->
    <g stroke="#c9cfd8" stroke-width="1">
      <line x1="40" y1="150" x2="40" y2="158"/><line x1="280" y1="150" x2="280" y2="158"/>
      <line x1="520" y1="150" x2="520" y2="158"/><line x1="760" y1="150" x2="760" y2="158"/>
    </g>
    <g font-size="12" fill="#5b6573" text-anchor="middle">
      <text x="40" y="174">$0</text><text x="280" y="174">$100k</text>
      <text x="520" y="174">$200k</text><text x="760" y="174">$300k</text>
    </g>

    <!-- segments, 2.4px per $1k -->
    <rect x="40" y="90" width="302.4" height="60" fill="#1f5f8b"/>
    <rect x="342.4" y="90" width="194.4" height="60" fill="#e3a537"/>
    <rect x="536.8" y="90" width="117.6" height="60" fill="#6a4c93"/>
    <rect x="655.4" y="91" width="103.6" height="58" fill="#fff" stroke="#5b6573" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g stroke="#fff" stroke-width="2"><line x1="342.4" y1="90" x2="342.4" y2="150"/><line x1="536.8" y1="90" x2="536.8" y2="150"/><line x1="654.4" y1="90" x2="654.4" y2="150"/></g>

    <g font-size="13" text-anchor="middle">
      <text x="191" y="116" fill="#fff">Individuals</text>
      <text x="191" y="137" fill="#fff" font-size="16" font-weight="700">$126k</text>
      <text x="440" y="116" fill="#1d2430">Businesses</text>
      <text x="440" y="137" fill="#1d2430" font-size="16" font-weight="700">$81k</text>
      <text x="595.6" y="116" fill="#fff">Events</text>
      <text x="595.6" y="137" fill="#fff" font-size="16" font-weight="700">$49k</text>
      <text x="707" y="116" fill="#5b6573">To go</text>
      <text x="707" y="137" fill="#1d2430" font-size="16" font-weight="700">$44k</text>
    </g>

    <!-- total bracket -->
    <text x="40" y="60" font-size="14" font-weight="700" fill="#1d2430">$256k raised so far</text>
    <line x1="40" y1="70" x2="654.4" y2="70" stroke="#1d2430" stroke-width="1.5"/>
    <line x1="40" y1="66" x2="40" y2="74" stroke="#1d2430" stroke-width="1.5"/>
    <line x1="654.4" y1="66" x2="654.4" y2="74" stroke="#1d2430" stroke-width="1.5"/>

    <!-- even-pace marker -->
    <line x1="580" y1="80" x2="580" y2="190" stroke="#1d2430" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="574" y="190" font-size="12" fill="#1d2430" text-anchor="end">Even pace after 9 of 12 months: $225k</text>

    <!-- goal -->
    <text x="760" y="60" font-size="14" font-weight="700" fill="#1d2430" text-anchor="end">Goal $300k</text>
  </svg>

  <ul class="stats">
    <li style="border-color:var(--ind)"><b>$126k · 49%</b><span>Individuals, $12k–$17k every month</span></li>
    <li style="border-color:var(--bus)"><b>$81k · 32%</b><span>Businesses, $7k–$11k every month</span></li>
    <li style="border-color:var(--evt)"><b>$49k · 19%</b><span>Events, from four months (Feb, Apr, Jun, Sep)</span></li>
  </ul>

  <p class="note">Shares are of the $256k raised to date. The dashed line marks where a perfectly even year would stand at the end of September; it is a reference point, not a forecast.</p>

  <details>
    <summary>Monthly data ($ thousands)</summary>
    <table>
      <thead><tr><th>Month</th><th>Individuals</th><th>Businesses</th><th>Events</th><th>Total</th></tr></thead>
      <tbody>
        <tr><td>Jan</td><td>14</td><td>8</td><td>0</td><td>22</td></tr>
        <tr><td>Feb</td><td>12</td><td>9</td><td>4</td><td>25</td></tr>
        <tr><td>Mar</td><td>15</td><td>7</td><td>0</td><td>22</td></tr>
        <tr><td>Apr</td><td>13</td><td>10</td><td>15</td><td>38</td></tr>
        <tr><td>May</td><td>16</td><td>9</td><td>0</td><td>25</td></tr>
        <tr><td>Jun</td><td>14</td><td>11</td><td>12</td><td>37</td></tr>
        <tr><td>Jul</td><td>12</td><td>8</td><td>0</td><td>20</td></tr>
        <tr><td>Aug</td><td>13</td><td>9</td><td>0</td><td>22</td></tr>
        <tr><td>Sep</td><td>17</td><td>10</td><td>18</td><td>45</td></tr>
      </tbody>
      <tfoot><tr><td>Total</td><td>126</td><td>81</td><td>49</td><td>256</td></tr></tfoot>
    </table>
  </details>
</figure>
</body>
</html>
