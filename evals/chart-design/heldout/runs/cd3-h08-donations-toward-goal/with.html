<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larder Lane Food Bank: progress toward $300k, through September</title>
<style>
  :root { --ink:#1f2933; --muted:#5f6b76; --line:#d5dae0; --ind:#2b6cb0; --bus:#e0a030; --evt:#7a4fa3; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:#fff; }
  figure { margin:0 auto; max-width:960px; }
  h1 { font-size:26px; line-height:1.25; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:15px; margin:0 0 18px; }
  svg { width:100%; height:auto; display:block; }
  svg text { font-family: inherit; fill:var(--ink); }
  .tick { font-size:13px; fill:var(--muted); }
  .note { font-size:13px; fill:var(--muted); }
  table { border-collapse:collapse; width:100%; margin-top:18px; font-size:14px; font-variant-numeric: tabular-nums; }
  th, td { text-align:right; padding:7px 10px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  tfoot td { font-weight:700; border-bottom:none; border-top:2px solid var(--ink); }
  .sw { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:7px; vertical-align:-1px; }
  figcaption { color:var(--muted); font-size:12.5px; margin-top:12px; }
</style>
</head>
<body>
<figure>
  <h1>We've raised $256k of our $300k goal, with $44k to go</h1>
  <p class="sub">Larder Lane Food Bank, January–September: donations by source, $ thousands. Nine months is 75% of the year, and we are at 85% of the goal.</p>

  <svg viewBox="0 0 960 250" role="img" aria-labelledby="t d">
    <title id="t">Stacked bar of $256k raised toward a $300k goal</title>
    <desc id="d">Individuals gave $126k, businesses $81k, and events $49k, for a total of $256k. $44k remains to reach $300k. Straight-line pace for the end of September would be $225k.</desc>

    <!-- goal and pace markers -->
    <text x="930" y="38" text-anchor="end" font-size="15" font-weight="700">Goal: $300k</text>
    <line x1="930" y1="46" x2="930" y2="86" stroke="#1f2933" stroke-width="2"/>
    <text x="705" y="38" text-anchor="middle" class="note">Even pace by end of Sep: $225k</text>
    <line x1="705" y1="46" x2="705" y2="86" stroke="#5f6b76" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- segments: 3px per $1k, origin x=30 -->
    <rect x="30"  y="90" width="378" height="64" fill="#2b6cb0"/>
    <rect x="408" y="90" width="243" height="64" fill="#e0a030"/>
    <rect x="651" y="90" width="147" height="64" fill="#7a4fa3"/>
    <rect x="798.75" y="91" width="130.5" height="62" fill="#fff" stroke="#5f6b76" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="408" y1="90" x2="408" y2="154" stroke="#fff" stroke-width="2"/>
    <line x1="651" y1="90" x2="651" y2="154" stroke="#fff" stroke-width="2"/>
    <line x1="798" y1="90" x2="798" y2="154" stroke="#fff" stroke-width="2"/>

    <!-- direct labels -->
    <g text-anchor="middle">
      <text x="219" y="118" font-size="15" font-weight="600" style="fill:#fff">Individuals</text>
      <text x="219" y="140" font-size="20" font-weight="700" style="fill:#fff">$126k</text>
      <text x="529.5" y="118" font-size="15" font-weight="600">Businesses</text>
      <text x="529.5" y="140" font-size="20" font-weight="700">$81k</text>
      <text x="724.5" y="118" font-size="15" font-weight="600" style="fill:#fff">Events</text>
      <text x="724.5" y="140" font-size="20" font-weight="700" style="fill:#fff">$49k</text>
      <text x="864" y="118" font-size="15" font-weight="600">To go</text>
      <text x="864" y="140" font-size="20" font-weight="700">$44k</text>
    </g>

    <!-- axis -->
    <line x1="30" y1="164" x2="930" y2="164" stroke="#d5dae0"/>
    <g class="tick" text-anchor="middle">
      <line x1="30" y1="164" x2="30" y2="170" stroke="#9aa5b1"/><text x="30" y="187" class="tick">$0</text>
      <line x1="330" y1="164" x2="330" y2="170" stroke="#9aa5b1"/><text x="330" y="187" class="tick">$100k</text>
      <line x1="630" y1="164" x2="630" y2="170" stroke="#9aa5b1"/><text x="630" y="187" class="tick">$200k</text>
      <line x1="930" y1="164" x2="930" y2="170" stroke="#9aa5b1"/><text x="930" y="187" class="tick">$300k</text>
    </g>

    <!-- total bracket -->
    <path d="M30 206 V212 H798 V206" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <text x="414" y="236" text-anchor="middle" font-size="15" font-weight="700">$256k raised so far (85% of goal)</text>
  </svg>

  <table>
    <thead>
      <tr><th>Source</th><th>Raised YTD</th><th>% of $300k goal</th><th>Share of raised</th></tr>
    </thead>
    <tbody>
      <tr><td><span class="sw" style="background:var(--ind)"></span>Individuals</td><td>$126k</td><td>42.0%</td><td>49%</td></tr>
      <tr><td><span class="sw" style="background:var(--bus)"></span>Businesses</td><td>$81k</td><td>27.0%</td><td>32%</td></tr>
      <tr><td><span class="sw" style="background:var(--evt)"></span>Events (Feb, Apr, Jun, Sep)</td><td>$49k</td><td>16.3%</td><td>19%</td></tr>
    </tbody>
    <tfoot>
      <tr><td>Total</td><td>$256k</td><td>85.3%</td><td>100%</td></tr>
    </tfoot>
  </table>

  <figcaption>Source: monthly donation records, January–September (September is included in full). Individual and business giving arrives steadily each month. Event income is lumpy, with $49k from four events, so the remaining $44k depends on whether Q4 has any. Bars start at zero and the scale is linear.</figcaption>
</figure>
</body>
</html>
