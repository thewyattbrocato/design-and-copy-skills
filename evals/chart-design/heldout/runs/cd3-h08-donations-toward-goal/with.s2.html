<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larder Lane Food Bank: progress to $300k, through September</title>
<style>
  :root { --ink:#1f2933; --muted:#5f6b76; --line:#d5dae0; --bg:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  figure { margin:0 auto; max-width:920px; }
  h1 { font-size:22px; line-height:1.3; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  svg { width:100%; height:auto; display:block; }
  svg text { font-family: inherit; fill:var(--ink); }
  .muted { fill:var(--muted); }
  table { border-collapse:collapse; margin-top:14px; font-size:14px; width:100%; max-width:560px; }
  caption { text-align:left; color:var(--muted); font-size:13px; padding-bottom:4px; }
  th, td { text-align:right; padding:5px 8px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  .note { color:var(--muted); font-size:13px; margin-top:12px; max-width:700px; line-height:1.45; }
  .sw { display:inline-block; width:10px; height:10px; margin-right:6px; border-radius:2px; }
</style>
</head>
<body>
<figure>
  <h1>We've raised $256k, 85% of our $300k goal, with one quarter left</h1>
  <p class="sub">Donations received January–September 2026, by donor type ($ thousands)</p>

  <svg viewBox="0 0 900 250" role="img" aria-labelledby="t d">
    <title id="t">Stacked bar of $256 thousand raised toward a $300 thousand goal</title>
    <desc id="d">Individuals gave $126 thousand, businesses $81 thousand and events $49 thousand. $44 thousand remains. An even pace would be $225 thousand by the end of September.</desc>

    <!-- remaining gap -->
    <rect x="739.7" y="110" width="120.3" height="60" fill="none" stroke="#8a949e" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="800" y="144" text-anchor="middle" font-size="14" class="muted">$44k to go</text>

    <!-- segments -->
    <rect x="40" y="110" width="344.4" height="60" fill="#2a6f97"/>
    <rect x="384.4" y="110" width="221.4" height="60" fill="#e8a838"/>
    <rect x="605.8" y="110" width="133.9" height="60" fill="#7b4f9d"/>
    <line x1="384.4" x2="384.4" y1="110" y2="170" stroke="#fff" stroke-width="2"/>
    <line x1="605.8" x2="605.8" y1="110" y2="170" stroke="#fff" stroke-width="2"/>

    <!-- values inside -->
    <text x="212" y="148" text-anchor="middle" font-size="20" font-weight="700" style="fill:#fff">$126k</text>
    <text x="495" y="148" text-anchor="middle" font-size="20" font-weight="700">$81k</text>
    <text x="672.7" y="148" text-anchor="middle" font-size="20" font-weight="700" style="fill:#fff">$49k</text>

    <!-- names above -->
    <text x="40" y="100" font-size="14" font-weight="600">Individuals</text>
    <text x="384.4" y="100" font-size="14" font-weight="600">Businesses</text>
    <text x="605.8" y="100" font-size="14" font-weight="600">Events</text>

    <!-- headline total -->
    <text x="40" y="44" font-size="30" font-weight="700">$256k raised</text>
    <text x="216" y="44" font-size="15" class="muted">of $300k goal</text>

    <!-- goal marker -->
    <line x1="860" x2="860" y1="56" y2="178" stroke="#1f2933" stroke-width="2.5"/>
    <text x="860" y="48" text-anchor="end" font-size="14" font-weight="700">Goal $300k</text>

    <!-- axis -->
    <g stroke="#9aa4ad" stroke-width="1">
      <line x1="40" x2="860" y1="178" y2="178"/>
      <line x1="40" x2="40" y1="178" y2="183"/>
      <line x1="176.7" x2="176.7" y1="178" y2="183"/>
      <line x1="313.3" x2="313.3" y1="178" y2="183"/>
      <line x1="450" x2="450" y1="178" y2="183"/>
      <line x1="586.7" x2="586.7" y1="178" y2="183"/>
      <line x1="723.3" x2="723.3" y1="178" y2="183"/>
      <line x1="860" x2="860" y1="178" y2="183"/>
    </g>
    <g font-size="12" class="muted" text-anchor="middle">
      <text x="40" y="198" class="muted">$0</text>
      <text x="176.7" y="198" class="muted">$50k</text>
      <text x="313.3" y="198" class="muted">$100k</text>
      <text x="450" y="198" class="muted">$150k</text>
      <text x="586.7" y="198" class="muted">$200k</text>
      <text x="723.3" y="198" class="muted">$250k</text>
      <text x="860" y="198" class="muted">$300k</text>
    </g>

    <!-- pace marker -->
    <line x1="655" x2="655" y1="106" y2="214" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="655" y="231" text-anchor="middle" font-size="13" class="muted">Even pace for 9 of 12 months: $225k</text>
  </svg>

  <table>
    <caption>Totals, January–September 2026 ($ thousands)</caption>
    <thead><tr><th>Donor type</th><th>Raised</th><th>Share of raised</th><th>Share of goal</th></tr></thead>
    <tbody>
      <tr><td><span class="sw" style="background:#2a6f97"></span>Individuals</td><td>126</td><td>49%</td><td>42%</td></tr>
      <tr><td><span class="sw" style="background:#e8a838"></span>Businesses</td><td>81</td><td>32%</td><td>27%</td></tr>
      <tr><td><span class="sw" style="background:#7b4f9d"></span>Events</td><td>49</td><td>19%</td><td>16%</td></tr>
      <tr><td><strong>Total</strong></td><td><strong>256</strong></td><td><strong>100%</strong></td><td><strong>85%</strong></td></tr>
    </tbody>
  </table>

  <p class="note">We are $31k ahead of an even monthly pace ($225k), and $44k short of the goal. Individual and business giving is steady at roughly $8–17k per month. Event income is lumpy: $49k came from four events (Feb, Apr, Jun, Sep), so the pace line is only a rough guide.</p>
</figure>
</body>
</html>
