<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders and revenue by month, 2025</title>
<style>
  :root {
    --bg: #ffffff; --ink: #1f2933; --muted: #5f6b76; --grid: #e6e9ec; --band: #f1f4f2;
    --orders: #2a6f97; --revenue: #c46a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191c; --ink: #e8ecef; --muted: #9aa5ae; --grid: #2b3136; --band: #1f2428;
      --orders: #5fa8d3; --revenue: #e9953f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  figure { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 6px; font-weight: 650; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; line-height: 1.45; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: inherit; fill: var(--muted); font-size: 12px; }
  svg .val { fill: var(--ink); font-size: 11.5px; }
  svg .ptitle { font-size: 13px; font-weight: 650; }
  svg .note { font-size: 12px; }
  details { margin-top: 14px; color: var(--muted); font-size: 0.9rem; }
  summary { cursor: pointer; }
  table { border-collapse: collapse; margin-top: 8px; width: 100%; max-width: 480px; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  td { color: var(--ink); }
  .foot { margin-top: 12px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<figure>
  <h1>Spring carries the year: April–June brought 37% of orders and 41% of revenue</h1>
  <p class="sub">Monthly orders and revenue, 2025. Both panels share the same month axis, so you can read straight down from one to the other. Total for the year: 6,370 orders and $274,400 in revenue.</p>

  <svg id="chart" viewBox="0 0 760 520" role="img"
       aria-labelledby="t d">
    <title id="t">Orders and revenue by month, 2025</title>
    <desc id="d">Two aligned bar charts. Orders peak in May at 880 and are lowest in February at 280. Revenue also peaks in May at $44,900 and is lowest in February at $8,900. December revenue is a second high point at $29,300 on 520 orders.</desc>
  </svg>

  <details>
    <summary>View the data as a table</summary>
    <table id="tbl">
      <thead><tr><th>Month</th><th>Orders</th><th>Revenue</th></tr></thead>
      <tbody></tbody>
    </table>
  </details>
  <p class="foot">Revenue is in nominal US dollars. Each panel has its own scale, starting at zero.</p>
</figure>

<script>
(function () {
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var orders = [310,280,420,690,880,760,540,500,610,470,390,520];
  var revenue = [9800,8900,15200,31400,44900,36100,21500,19800,24700,18200,14600,29300];

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("chart");
  function el(name, attrs, text) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  var L = 58, R = 744, W = R - L, band = W / 12, barW = band * 0.64;
  var panels = [
    { title: "Orders per month", data: orders, top: 56, h: 170, max: 1000, step: 250,
      color: "var(--orders)", fmt: function (v) { return v.toLocaleString("en-US"); },
      tick: function (v) { return v.toLocaleString("en-US"); } },
    { title: "Revenue per month", data: revenue, top: 286, h: 170, max: 50000, step: 12500,
      color: "var(--revenue)", fmt: function (v) { return "$" + (v / 1000).toFixed(1) + "k"; },
      tick: function (v) { return "$" + (v / 1000) + "k"; } }
  ];
  panels[1].step = 10000;

  // shaded Apr–Jun band behind both panels
  var bx = L + band * 3;
  el("rect", { x: bx, y: 30, width: band * 3, height: 426, fill: "var(--band)" });
  el("text", { x: bx + band * 1.5, y: 44, "text-anchor": "middle", class: "note" }, "Apr–Jun: peak season");

  panels.forEach(function (p) {
    var base = p.top + p.h;
    el("text", { x: L, y: p.top - 12, class: "ptitle", style: "fill:" + p.color }, p.title);
    for (var v = 0; v <= p.max; v += p.step) {
      var y = base - (v / p.max) * p.h;
      el("line", { x1: L, x2: R, y1: y, y2: y, stroke: v === 0 ? "var(--muted)" : "var(--grid)", "stroke-width": v === 0 ? 1 : 1 });
      el("text", { x: L - 8, y: y + 4, "text-anchor": "end" }, p.tick(v));
    }
    p.data.forEach(function (v, i) {
      var h = (v / p.max) * p.h;
      var x = L + band * i + (band - barW) / 2;
      el("rect", { x: x, y: base - h, width: barW, height: h, fill: p.color, rx: 1.5 });
      el("text", { x: x + barW / 2, y: base - h - 5, "text-anchor": "middle", class: "val" }, p.fmt(v));
    });
  });

  // shared month labels under the lower panel
  months.forEach(function (m, i) {
    el("text", { x: L + band * i + band / 2, y: 478, "text-anchor": "middle" }, m);
  });

  // table
  var tb = document.querySelector("#tbl tbody");
  months.forEach(function (m, i) {
    var tr = document.createElement("tr");
    [m, orders[i].toLocaleString("en-US"), "$" + revenue[i].toLocaleString("en-US")].forEach(function (c) {
      var td = document.createElement("td"); td.textContent = c; tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
})();
</script>
</body>
</html>
