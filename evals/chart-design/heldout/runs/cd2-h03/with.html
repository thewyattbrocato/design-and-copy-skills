<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders and revenue by month, last year</title>
<style>
  :root { --bg:#fff; --ink:#1f2933; --muted:#6b7580; --grid:#e6e9ec; --orders:#2b6a8f; --rev:#2f7d4f; --note:#9a5b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161b20; --ink:#e8ecef; --muted:#9aa5b0; --grid:#2a3239; --orders:#6fb0d6; --rev:#6cc08c; --note:#e0a84a; }
  }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  figure { margin:0 auto; max-width:820px; }
  h1 { font-size:22px; line-height:1.3; margin:0 0 6px; font-weight:650; }
  p.sub { margin:0 0 14px; color:var(--muted); font-size:14px; line-height:1.45; }
  svg { width:100%; height:auto; display:block; }
  svg text { font-family:inherit; fill:var(--ink); }
  .muted { fill:var(--muted) !important; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:var(--muted); stroke-width:1; }
  .ptitle { font-size:13px; font-weight:650; }
  .val { font-size:10.5px; text-anchor:middle; }
  .tick { font-size:11px; text-anchor:end; }
  .mon { font-size:12px; text-anchor:middle; }
  .note { font-size:11.5px; fill:var(--note) !important; font-weight:600; }
  details { margin-top:14px; font-size:13px; color:var(--muted); }
  summary { cursor:pointer; }
  table { border-collapse:collapse; margin-top:8px; width:100%; max-width:420px; }
  th, td { text-align:right; padding:3px 8px; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child { text-align:left; }
  td { color:var(--ink); }
</style>
</head>
<body>
<figure>
  <h1>Both orders and revenue peaked in May; December earned the most per order</h1>
  <p class="sub">Last year: 6,370 orders and $274,400 in revenue. May brought 880 orders and $44,900. December had only 520 orders but $29,300, about $56 per order against $51 in May and $44 across the year.</p>

  <svg id="chart" viewBox="0 0 760 520" role="img"
       aria-label="Two aligned bar charts by month. Orders rise from 310 in January to a peak of 880 in May and fall to 390 in November, then 520 in December. Revenue follows the same shape, peaking at $44,900 in May, with a December rebound to $29,300.">
  </svg>

  <details>
    <summary>View data as a table</summary>
    <table>
      <thead><tr><th>Month</th><th>Orders</th><th>Revenue</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </details>
</figure>

<script>
(function () {
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var orders = [310,280,420,690,880,760,540,500,610,470,390,520];
  var rev = [9800,8900,15200,31400,44900,36100,21500,19800,24700,18200,14600,29300];
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("chart");
  var L = 56, R = 744, band = (R - L) / 12, bw = 34;

  function el(name, attrs, text) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    svg.appendChild(e);
    return e;
  }
  function panel(o) {
    var h = o.bottom - o.top;
    el("text", {x: L, y: o.top - 22, "class": "ptitle"}, o.title);
    o.ticks.forEach(function (t) {
      var y = o.bottom - t / o.max * h;
      el("line", {x1: L, x2: R, y1: y, y2: y, "class": t === 0 ? "base" : "grid"});
      el("text", {x: L - 8, y: y + 4, "class": "tick muted"}, o.fmtTick(t));
    });
    o.data.forEach(function (v, i) {
      var bh = v / o.max * h, x = L + band * i + (band - bw) / 2;
      el("rect", {x: x, y: o.bottom - bh, width: bw, height: bh, rx: 2, fill: o.color,
                  "fill-opacity": i === 4 ? 1 : 0.62});
      el("text", {x: x + bw / 2, y: o.bottom - bh - 5, "class": "val", "font-weight": i === 4 ? 700 : 400}, o.fmtVal(v));
    });
  }

  panel({title: "Orders per month", top: 60, bottom: 220, max: 1000, ticks: [0,250,500,750,1000],
         data: orders, color: getComputedStyle(document.documentElement).getPropertyValue("--orders") || "#2b6a8f",
         fmtTick: function (t) { return t.toLocaleString("en-US"); },
         fmtVal: function (v) { return v; }});
  panel({title: "Revenue per month (US dollars)", top: 290, bottom: 450, max: 50000, ticks: [0,12500,25000,37500,50000],
         data: rev, color: getComputedStyle(document.documentElement).getPropertyValue("--rev") || "#2f7d4f",
         fmtTick: function (t) { return "$" + (t / 1000) + "K"; },
         fmtVal: function (v) { return "$" + (v / 1000).toFixed(1) + "K"; }});

  months.forEach(function (m, i) {
    el("text", {x: L + band * i + band / 2, y: 472, "class": "mon"}, m);
    el("line", {x1: L + band * i + band / 2, x2: L + band * i + band / 2, y1: 220, y2: 226, "class": "base"});
  });
  el("text", {x: L + band * 4 + band / 2, y: 492, "class": "mon muted", "font-size": 11}, "");
  el("text", {x: R, y: 500, "class": "note", "text-anchor": "end"}, "Dec: fewer orders than Sep, yet higher revenue");

  var tb = document.getElementById("rows");
  months.forEach(function (m, i) {
    var tr = document.createElement("tr");
    [m, orders[i].toLocaleString("en-US"), "$" + rev[i].toLocaleString("en-US")].forEach(function (t) {
      var td = document.createElement("td"); td.textContent = t; tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
})();
</script>
</body>
</html>
