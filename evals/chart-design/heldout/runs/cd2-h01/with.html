<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bird species counted at six trail sites, spring</title>
<style>
  :root {
    --surface: #ffffff;
    --ink: #1f2a2e;
    --ink-2: #4a5a60;
    --ink-3: #6b7a80;
    --grid: #e3e8ea;
    --bar: #2a7f8e;
    --bar-hi: #1b5d6a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #161d20;
      --ink: #eef2f3;
      --ink-2: #b5c1c5;
      --ink-3: #8c9ca1;
      --grid: #2c373b;
      --bar: #4fb0c0;
      --bar-hi: #7cc9d6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: #f3f5f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  @media (prefers-color-scheme: dark) { body { background: #0e1315; } }
  figure {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 24px 20px;
    background: var(--surface);
    border-radius: 8px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .sub { margin: 0 0 20px; font-size: 14px; color: var(--ink-2); }
  .chart { display: grid; grid-template-columns: 104px 1fr; row-gap: 10px; align-items: center; }
  .rows { display: contents; margin: 0; padding: 0; list-style: none; }
  .name { font-size: 14px; color: var(--ink); text-align: right; padding-right: 12px; }
  .track {
    position: relative;
    height: 28px;
    background-image: repeating-linear-gradient(to right, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent 25%);
    background-size: calc(100% - 1px) 100%;
    background-repeat: no-repeat;
    border-right: 1px solid var(--grid);
  }
  .bar {
    position: absolute; left: 0; top: 3px; bottom: 3px;
    background: var(--bar);
    border-radius: 0 4px 4px 0;
    display: flex; align-items: center; justify-content: flex-end;
  }
  .bar:hover { background: var(--bar-hi); }
  .val {
    position: absolute; top: 50%; transform: translateY(-50%);
    margin-left: 8px;
    font-size: 14px; font-weight: 600; color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .axis { grid-column: 2; display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .axis-title { grid-column: 2; font-size: 12px; color: var(--ink-3); text-align: center; }
  details { margin-top: 16px; font-size: 13px; color: var(--ink-2); }
  summary { cursor: pointer; }
  table { border-collapse: collapse; margin-top: 8px; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  td:last-child, th:last-child { text-align: right; }
  .note { margin: 14px 0 0; font-size: 12px; color: var(--ink-3); }
  @media (max-width: 420px) {
    figure { padding: 18px 14px; }
    .chart { grid-template-columns: 88px 1fr; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>
<figure>
  <h1>Willow Flats led our spring bird count with 74 species</h1>
  <p class="sub">Bird species recorded at each of six trail sites, last spring. Quarry Loop had the fewest, at 29.</p>

  <div class="chart" role="img" aria-label="Horizontal bar chart of bird species counted per trail site, highest to lowest: Willow Flats 74, Heron Point 67, North Ridge 52, Alder Run 41, Millpond 38, Quarry Loop 29.">
    <ul class="rows" aria-hidden="true">
      <li class="name" style="display:contents">
        <span class="name">Willow Flats</span>
        <span class="track"><span class="bar" style="width:92.5%" title="Willow Flats: 74 species"><span class="val" style="left:100%">74</span></span></span>
      </li>
      <li style="display:contents">
        <span class="name">Heron Point</span>
        <span class="track"><span class="bar" style="width:83.75%" title="Heron Point: 67 species"><span class="val" style="left:100%">67</span></span></span>
      </li>
      <li style="display:contents">
        <span class="name">North Ridge</span>
        <span class="track"><span class="bar" style="width:65%" title="North Ridge: 52 species"><span class="val" style="left:100%">52</span></span></span>
      </li>
      <li style="display:contents">
        <span class="name">Alder Run</span>
        <span class="track"><span class="bar" style="width:51.25%" title="Alder Run: 41 species"><span class="val" style="left:100%">41</span></span></span>
      </li>
      <li style="display:contents">
        <span class="name">Millpond</span>
        <span class="track"><span class="bar" style="width:47.5%" title="Millpond: 38 species"><span class="val" style="left:100%">38</span></span></span>
      </li>
      <li style="display:contents">
        <span class="name">Quarry Loop</span>
        <span class="track"><span class="bar" style="width:36.25%" title="Quarry Loop: 29 species"><span class="val" style="left:100%">29</span></span></span>
      </li>
    </ul>
    <div class="axis" aria-hidden="true"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span></div>
    <div class="axis-title" aria-hidden="true">Species counted</div>
  </div>

  <details>
    <summary>View data as a table</summary>
    <table>
      <thead><tr><th>Trail site</th><th>Species</th></tr></thead>
      <tbody>
        <tr><td>Willow Flats</td><td>74</td></tr>
        <tr><td>Heron Point</td><td>67</td></tr>
        <tr><td>North Ridge</td><td>52</td></tr>
        <tr><td>Alder Run</td><td>41</td></tr>
        <tr><td>Millpond</td><td>38</td></tr>
        <tr><td>Quarry Loop</td><td>29</td></tr>
      </tbody>
    </table>
  </details>

  <p class="note">Source: park volunteer bird counts, spring survey. Sites are sorted by species count.</p>
</figure>
</body>
</html>
