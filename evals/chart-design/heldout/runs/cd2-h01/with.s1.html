<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bird species counted at six trail sites, spring</title>
<style>
  :root {
    --ink: #1f2933;
    --muted: #5f6b76;
    --bar: #b8c2cc;
    --accent: #2f6f5e;
    --rule: #e3e8ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: #fff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  figure {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    line-height: 1.25;
    margin: 0 0 6px;
  }
  .sub {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .row {
    display: grid;
    grid-template-columns: 96px 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .name {
    text-align: right;
    font-size: 0.95rem;
  }
  .track {
    position: relative;
    height: 28px;
    border-left: 1px solid var(--muted);
  }
  .bar {
    height: 100%;
    background: var(--bar);
    border-radius: 0 3px 3px 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .bar.top { background: var(--accent); }
  .val {
    font-weight: 600;
    font-size: 0.95rem;
    padding-right: 8px;
    color: var(--ink);
  }
  .bar.top .val { color: #fff; }
  .axis {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 10px;
    margin-top: 4px;
  }
  .axis span {
    font-size: 0.8rem;
    color: var(--muted);
  }
  table {
    width: 100%;
    margin-top: 24px;
    border-collapse: collapse;
    font-size: 0.85rem;
    color: var(--muted);
  }
  caption { text-align: left; padding-bottom: 4px; }
  th, td { text-align: left; padding: 3px 0; border-top: 1px solid var(--rule); }
  td:last-child, th:last-child { text-align: right; }
  .sr { position: absolute; left: -9999px; }
  @media (max-width: 420px) {
    .row, .axis { grid-template-columns: 82px 1fr; }
    .name { font-size: 0.85rem; }
  }
</style>
</head>
<body>
<figure role="group" aria-labelledby="t">
  <h1 id="t">Willow Flats and Heron Point had the most bird species last spring</h1>
  <p class="sub">Bird species counted at each of six trail sites, spring survey</p>

  <div role="img" aria-label="Horizontal bar chart of bird species counted per site: Willow Flats 74, Heron Point 67, North Ridge 52, Alder Run 41, Millpond 38, Quarry Loop 29.">
    <div class="row"><div class="name">Willow Flats</div><div class="track"><div class="bar top" style="width:100%"><span class="val">74</span></div></div></div>
    <div class="row"><div class="name">Heron Point</div><div class="track"><div class="bar top" style="width:90.5%"><span class="val">67</span></div></div></div>
    <div class="row"><div class="name">North Ridge</div><div class="track"><div class="bar" style="width:70.3%"><span class="val">52</span></div></div></div>
    <div class="row"><div class="name">Alder Run</div><div class="track"><div class="bar" style="width:55.4%"><span class="val">41</span></div></div></div>
    <div class="row"><div class="name">Millpond</div><div class="track"><div class="bar" style="width:51.4%"><span class="val">38</span></div></div></div>
    <div class="row"><div class="name">Quarry Loop</div><div class="track"><div class="bar" style="width:39.2%"><span class="val">29</span></div></div></div>
  </div>

  <div class="axis"><span></span><span>Number of bird species (bars start at zero)</span></div>

  <table>
    <caption class="sr">Bird species counted by site</caption>
    <thead><tr><th>Site</th><th>Species</th></tr></thead>
    <tbody>
      <tr><td>Willow Flats</td><td>74</td></tr>
      <tr><td>Heron Point</td><td>67</td></tr>
      <tr><td>North Ridge</td><td>52</td></tr>
      <tr><td>Alder Run</td><td>41</td></tr>
      <tr><td>Millpond</td><td>38</td></tr>
      <tr><td>Quarry Loop</td><td>29</td></tr>
    </tbody>
  </table>
</figure>
</body>
</html>
