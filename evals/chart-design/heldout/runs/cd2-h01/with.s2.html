<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bird Species Counted at Six Trail Sites, Spring</title>
<style>
  :root {
    --ink: #1f2933;
    --muted: #5f6b76;
    --bar: #b8c2cc;
    --accent: #1f6f5c;
    --rule: #d9dee3;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
  }
  figure { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 22px; }
  .chart { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .row {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    align-items: center;
    gap: 12px;
  }
  .name { text-align: right; font-size: 0.95rem; }
  .track { position: relative; height: 28px; border-left: 1px solid var(--ink); }
  .bar { height: 100%; background: var(--bar); border-radius: 0 3px 3px 0; }
  .row.top .bar { background: var(--accent); }
  .row.top .name { font-weight: 700; }
  .val {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    margin-left: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .axis {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 12px;
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .axis span { grid-column: 2; }
  .note { color: var(--muted); font-size: 0.85rem; margin: 14px 0 0; }
  table { position: absolute; left: -9999px; }
  @media (max-width: 420px) {
    .row, .axis { grid-template-columns: 6rem 1fr; gap: 8px; }
    .name { font-size: 0.85rem; }
  }
</style>
</head>
<body>
<figure role="group" aria-labelledby="t" aria-describedby="d">
  <h1 id="t">Willow Flats led our spring bird count with 74 species</h1>
  <p class="sub" id="d">Bird species counted at each of six trail sites, last spring. Quarry Loop had the fewest, at 29.</p>

  <ul class="chart" aria-label="Bar chart of bird species by trail site, sorted high to low">
    <li class="row top"><div class="name">Willow Flats</div><div class="track"><div class="bar" style="width:74%"></div><span class="val" style="left:74%">74</span></div></li>
    <li class="row"><div class="name">Heron Point</div><div class="track"><div class="bar" style="width:67%"></div><span class="val" style="left:67%">67</span></div></li>
    <li class="row"><div class="name">North Ridge</div><div class="track"><div class="bar" style="width:52%"></div><span class="val" style="left:52%">52</span></div></li>
    <li class="row"><div class="name">Alder Run</div><div class="track"><div class="bar" style="width:41%"></div><span class="val" style="left:41%">41</span></div></li>
    <li class="row"><div class="name">Millpond</div><div class="track"><div class="bar" style="width:38%"></div><span class="val" style="left:38%">38</span></div></li>
    <li class="row"><div class="name">Quarry Loop</div><div class="track"><div class="bar" style="width:29%"></div><span class="val" style="left:29%">29</span></div></li>
  </ul>

  <div class="axis" aria-hidden="true"><span>Number of species (bars start at 0)</span></div>
  <p class="note">Sites sorted by species count. Counts are species observed per site, not individual birds.</p>

  <table>
    <caption>Bird species counted by trail site, spring</caption>
    <thead><tr><th>Site</th><th>Species</th></tr></thead>
    <tbody>
      <tr><td>Willow Flats</td><td>74</td></tr>
      <tr><td>Heron Point</td><td>67</td></tr>
      <tr><td>North Ridge</td><td>52</td></tr>
      <tr><td>Alder Run</td><td>41</td></tr>
      <tr><td>Millpond</td><td>38</td></tr>
      <tr><td>Quarry Loop</td><td>29</td></tr>
    </tbody>
  </table>
</figure>
</body>
</html>
