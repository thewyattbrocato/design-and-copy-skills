<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bird species counted at six trail sites, spring</title>
<style>
  :root {
    --ink: #1f2933;
    --muted: #5b6670;
    --track: #eef1f4;
    --bar-context: #aab4bd;
    --bar-focus: #1f6f5c;
    --rule: #d8dee4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e6ebef;
      --muted: #a3adb6;
      --track: #232b33;
      --bar-context: #6b7782;
      --bar-focus: #5fc1a6;
      --rule: #37414b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: transparent;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
  }
  figure {
    margin: 0;
    max-width: 640px;
  }
  h2 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 20px;
  }
  .chart {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--rule);
  }
  .row {
    display: grid;
    grid-template-columns: 9rem 1fr 3rem;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  .site {
    font-size: 0.95rem;
    text-align: right;
  }
  .track {
    background: var(--track);
    height: 18px;
    border-radius: 2px;
    overflow: hidden;
  }
  .bar {
    display: block;
    height: 100%;
    background: var(--bar-context);
    border-radius: 2px;
  }
  .bar.focus {
    background: var(--bar-focus);
  }
  .value {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .axis {
    display: grid;
    grid-template-columns: 9rem 1fr 3rem;
    gap: 12px;
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
  }
  .axis-scale {
    display: flex;
    justify-content: space-between;
  }
  figcaption {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 16px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<figure>
  <h2>Willow Flats and Heron Point hosted the most bird species</h2>
  <p class="subtitle">Bird species counted at six trail sites, spring</p>

  <ul class="chart" role="img" aria-label="Horizontal bar chart of bird species counted per trail site in spring, sorted high to low: Willow Flats 74, Heron Point 67, North Ridge 52, Alder Run 41, Millpond 38, Quarry Loop 29.">
    <li class="row">
      <span class="site">Willow Flats</span>
      <span class="track"><span class="bar focus" style="width: 92.5%"></span></span>
      <span class="value">74</span>
    </li>
    <li class="row">
      <span class="site">Heron Point</span>
      <span class="track"><span class="bar focus" style="width: 83.75%"></span></span>
      <span class="value">67</span>
    </li>
    <li class="row">
      <span class="site">North Ridge</span>
      <span class="track"><span class="bar" style="width: 65%"></span></span>
      <span class="value">52</span>
    </li>
    <li class="row">
      <span class="site">Alder Run</span>
      <span class="track"><span class="bar" style="width: 51.25%"></span></span>
      <span class="value">41</span>
    </li>
    <li class="row">
      <span class="site">Millpond</span>
      <span class="track"><span class="bar" style="width: 47.5%"></span></span>
      <span class="value">38</span>
    </li>
    <li class="row">
      <span class="site">Quarry Loop</span>
      <span class="track"><span class="bar" style="width: 36.25%"></span></span>
      <span class="value">29</span>
    </li>
  </ul>

  <div class="axis" aria-hidden="true">
    <span></span>
    <span class="axis-scale"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span></span>
    <span></span>
  </div>

  <figcaption>Number of bird species observed at each site. Bars start at zero. Sites sorted from most to fewest species.</figcaption>
</figure>
</body>
</html>
