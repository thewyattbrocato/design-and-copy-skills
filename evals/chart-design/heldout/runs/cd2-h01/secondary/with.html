<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bird species by trail site, spring counts</title>
<style>
  :root {
    --ink: #1f2a24;
    --muted-ink: #5b6660;
    --track: #eef1ee;
    --bar-context: #aab5ae;
    --bar-focus: #2f6b4f;
    --rule: #d9dfdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8eee9;
      --muted-ink: #a9b5ad;
      --track: #222a25;
      --bar-context: #5d6a62;
      --bar-focus: #7fc29f;
      --rule: #343e38;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: transparent;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
  }
  figure {
    margin: 0 auto;
    max-width: 640px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 650;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 0.9rem;
    color: var(--muted-ink);
    margin: 0 0 20px;
  }
  ul.bars {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.bars li {
    display: grid;
    grid-template-columns: 9rem 1fr 3rem;
    align-items: center;
    column-gap: 12px;
    padding: 6px 0;
    border-top: 1px solid var(--rule);
  }
  ul.bars li:last-child {
    border-bottom: 1px solid var(--rule);
  }
  .site {
    font-size: 0.95rem;
    text-align: right;
  }
  .track {
    background: var(--track);
    height: 18px;
    border-radius: 2px;
    overflow: hidden;
  }
  .fill {
    display: block;
    height: 100%;
    background: var(--bar-context);
  }
  .focus .fill {
    background: var(--bar-focus);
  }
  .focus .site {
    font-weight: 650;
  }
  .value {
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    font-weight: 600;
  }
  figcaption {
    margin-top: 14px;
    font-size: 0.82rem;
    color: var(--muted-ink);
  }
</style>
</head>
<body>
<figure role="group" aria-labelledby="chart-title">
  <h1 id="chart-title">Willow Flats recorded the most bird species on our spring trail counts</h1>
  <p class="subtitle">Number of bird species counted at each trail site, spring survey</p>

  <ul class="bars" aria-label="Bird species counts by trail site, sorted from highest to lowest">
    <li class="focus">
      <span class="site">Willow Flats</span>
      <span class="track"><span class="fill" style="width: 92.5%"></span></span>
      <span class="value">74</span>
    </li>
    <li>
      <span class="site">Heron Point</span>
      <span class="track"><span class="fill" style="width: 83.75%"></span></span>
      <span class="value">67</span>
    </li>
    <li>
      <span class="site">North Ridge</span>
      <span class="track"><span class="fill" style="width: 65%"></span></span>
      <span class="value">52</span>
    </li>
    <li>
      <span class="site">Alder Run</span>
      <span class="track"><span class="fill" style="width: 51.25%"></span></span>
      <span class="value">41</span>
    </li>
    <li>
      <span class="site">Millpond</span>
      <span class="track"><span class="fill" style="width: 47.5%"></span></span>
      <span class="value">38</span>
    </li>
    <li>
      <span class="site">Quarry Loop</span>
      <span class="track"><span class="fill" style="width: 36.25%"></span></span>
      <span class="value">29</span>
    </li>
  </ul>

  <figcaption>Bars start at zero. Six sites, 301 species counted in total across sites. Counts are species per site, not individual birds.</figcaption>
</figure>
</body>
</html>
