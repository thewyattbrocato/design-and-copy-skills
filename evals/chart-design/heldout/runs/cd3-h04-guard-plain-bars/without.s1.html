<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernbrook Nursery – Monthly Sales 2025</title>
<style>
  :root {
    --surface: #ffffff;
    --ink: #1f2a24;
    --ink-2: #4a5750;
    --ink-3: #6b776f;
    --grid: #e3e8e4;
    --bar: #2f7d4f;
    --bar-hover: #1f5f3a;
    --tip-bg: #1f2a24;
    --tip-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #161c18;
      --ink: #edf2ee;
      --ink-2: #b6c1ba;
      --ink-3: #8f9b94;
      --grid: #2b342e;
      --bar: #5fb97f;
      --bar-hover: #86d0a1;
      --tip-bg: #edf2ee;
      --tip-ink: #161c18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--surface);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  figure { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--ink-2); font-size: 14px; }
  .chart {
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 0 8px;
  }
  .yaxis {
    position: relative;
    height: 280px;
    font-size: 12px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .yaxis span {
    position: absolute;
    right: 0;
    transform: translateY(50%);
  }
  .plot {
    position: relative;
    height: 280px;
    display: flex;
    gap: 8px;
    align-items: stretch;
    border-bottom: 1px solid var(--ink-3);
  }
  .grid-line {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px solid var(--grid);
    pointer-events: none;
  }
  .col {
    position: relative;
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 1;
    outline: none;
  }
  .bar {
    width: 100%;
    max-width: 36px;
    background: var(--bar);
    border-radius: 4px 4px 0 0;
    transition: background .12s;
  }
  .col:hover .bar, .col:focus .bar { background: var(--bar-hover); }
  .peak-label {
    position: absolute;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    transform: translateY(-4px);
    white-space: nowrap;
  }
  .tip {
    position: absolute;
    bottom: calc(var(--h) + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--tip-bg);
    color: var(--tip-ink);
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .1s;
    z-index: 5;
  }
  .col:hover .tip, .col:focus .tip { opacity: 1; }
  .xaxis {
    grid-column: 2;
    display: flex;
    gap: 8px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-3);
  }
  .xaxis span { flex: 1; text-align: center; }
  .note { margin-top: 16px; font-size: 13px; color: var(--ink-2); }
  details { margin-top: 16px; font-size: 13px; color: var(--ink-2); }
  summary { cursor: pointer; }
  table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 16px 4px 0; text-align: left; border-bottom: 1px solid var(--grid); }
  td:last-child, th:last-child { text-align: right; padding-right: 0; }
  @media (max-width: 480px) {
    .plot, .xaxis { gap: 3px; }
    .xaxis span { font-size: 10px; }
  }
</style>
</head>
<body>
<figure>
  <h1>Fernbrook Nursery: Monthly Sales, 2025</h1>
  <p class="sub">Sales in US dollars. Peak in May at $38,900; $231,200 for the year.</p>

  <div class="chart" role="img" aria-label="Bar chart of Fernbrook Nursery monthly sales in 2025. Sales rise from $8,200 in January to a peak of $38,900 in May, dip to $19,500 in August, rebound to $24,300 in September, then fall to $6,100 in December.">
    <div class="yaxis" aria-hidden="true">
      <span style="bottom:0%">$0</span>
      <span style="bottom:25%">$10k</span>
      <span style="bottom:50%">$20k</span>
      <span style="bottom:75%">$30k</span>
      <span style="bottom:100%">$40k</span>
    </div>
    <div class="plot">
      <div class="grid-line" style="bottom:25%"></div>
      <div class="grid-line" style="bottom:50%"></div>
      <div class="grid-line" style="bottom:75%"></div>
      <div class="grid-line" style="bottom:100%"></div>

      <div class="col" tabindex="0" style="--h:20.5%"><div class="bar" style="height:20.5%"></div><div class="tip">Jan: $8,200</div></div>
      <div class="col" tabindex="0" style="--h:22.75%"><div class="bar" style="height:22.75%"></div><div class="tip">Feb: $9,100</div></div>
      <div class="col" tabindex="0" style="--h:39%"><div class="bar" style="height:39%"></div><div class="tip">Mar: $15,600</div></div>
      <div class="col" tabindex="0" style="--h:68.5%"><div class="bar" style="height:68.5%"></div><div class="tip">Apr: $27,400</div></div>
      <div class="col" tabindex="0" style="--h:97.25%"><div class="bar" style="height:97.25%"></div><div class="tip">May: $38,900</div></div>
      <div class="col" tabindex="0" style="--h:78%"><div class="bar" style="height:78%"></div><div class="tip">Jun: $31,200</div></div>
      <div class="col" tabindex="0" style="--h:57%"><div class="bar" style="height:57%"></div><div class="tip">Jul: $22,800</div></div>
      <div class="col" tabindex="0" style="--h:48.75%"><div class="bar" style="height:48.75%"></div><div class="tip">Aug: $19,500</div></div>
      <div class="col" tabindex="0" style="--h:60.75%"><div class="bar" style="height:60.75%"></div><div class="tip">Sep: $24,300</div></div>
      <div class="col" tabindex="0" style="--h:44.25%"><div class="bar" style="height:44.25%"></div><div class="tip">Oct: $17,700</div></div>
      <div class="col" tabindex="0" style="--h:26%"><div class="bar" style="height:26%"></div><div class="tip">Nov: $10,400</div></div>
      <div class="col" tabindex="0" style="--h:15.25%"><div class="bar" style="height:15.25%"></div><div class="tip">Dec: $6,100</div></div>
    </div>
    <div class="xaxis" aria-hidden="true">
      <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span>
      <span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
    </div>
  </div>

  <details>
    <summary>View as table</summary>
    <table>
      <thead><tr><th>Month</th><th>Sales</th></tr></thead>
      <tbody>
        <tr><td>January</td><td>$8,200</td></tr>
        <tr><td>February</td><td>$9,100</td></tr>
        <tr><td>March</td><td>$15,600</td></tr>
        <tr><td>April</td><td>$27,400</td></tr>
        <tr><td>May</td><td>$38,900</td></tr>
        <tr><td>June</td><td>$31,200</td></tr>
        <tr><td>July</td><td>$22,800</td></tr>
        <tr><td>August</td><td>$19,500</td></tr>
        <tr><td>September</td><td>$24,300</td></tr>
        <tr><td>October</td><td>$17,700</td></tr>
        <tr><td>November</td><td>$10,400</td></tr>
        <tr><td>December</td><td>$6,100</td></tr>
      </tbody>
    </table>
  </details>
</figure>
</body>
</html>
