<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernbrook Nursery – 2025 Monthly Sales</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    background: #fff;
    color: #2b2b2b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  figure { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; }
  p.sub { margin: 0 0 14px; color: #5b5b5b; font-size: 14px; line-height: 1.45; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .grid { stroke: #e6e6e6; stroke-width: 1; }
  .base { stroke: #8a8a8a; stroke-width: 1; }
  .bar { fill: #a9b8a3; }
  .peak { fill: #2f6b3a; }
  .ax { font-size: 12px; fill: #5b5b5b; }
  .val { font-size: 11px; fill: #2b2b2b; text-anchor: middle; }
  .valpeak { font-size: 12px; font-weight: 700; fill: #2f6b3a; text-anchor: middle; }
  .mo { font-size: 12px; fill: #2b2b2b; text-anchor: middle; }
  figcaption { margin-top: 8px; font-size: 12px; color: #6b6b6b; }
</style>
</head>
<body>
<figure>

    <!-- gridlines -->
    <line class="grid" x1="50" x2="710" y1="247.5" y2="247.5"/>

    <line class="grid" x1="50" x2="710" y1="102.5" y2="102.5"/>

    <text class="ax" x="44" y="324" text-anchor="end">$0</text>

    <rect class="bar" x="663.5" y="275.77" width="38" height="44.23"/>

    <line class="base" x1="50" x2="710" y1="320" y2="320"/>

    <text class="mo" x="462.5" y="340">Aug</text>
    <text class="mo" x="517.5" y="340">Sep</text>
    <text class="mo" x="572.5" y="340">Oct</text>
    <text class="mo" x="627.5" y="340">Nov</text>
    <text class="mo" x="682.5" y="340">Dec</text>

  <figcaption>Fernbrook Nursery, January–December 2025. Sales in US dollars, not adjusted.</figcaption>

</body>
</html>
