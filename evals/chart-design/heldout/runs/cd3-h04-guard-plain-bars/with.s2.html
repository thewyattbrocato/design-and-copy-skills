<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernbrook Nursery: 2025 Monthly Sales</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    background: #fff;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  figure { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; line-height: 1.25; }
  .sub { font-size: 14px; color: #555; margin: 0 0 16px; }
  svg { width: 100%; height: auto; display: block; }
  .lbl { font-size: 12px; fill: #555; }
  .val { font-size: 12px; fill: #222; }
  .val.peak { font-weight: 700; }
  .axis { font-size: 12px; fill: #777; }
  .note { font-size: 13px; color: #555; margin: 12px 0 0; }
  table { position: absolute; left: -9999px; }
</style>
</head>
<body>
<figure>
  <h1>Fernbrook Nursery sales peaked in May at $38,900</h1>
  <p class="sub">Monthly sales, 2025, in US dollars</p>

  <svg viewBox="0 0 720 340" role="img" aria-labelledby="t d">
    <title id="t">Bar chart of Fernbrook Nursery monthly sales in 2025</title>
    <desc id="d">Sales rise from $8,200 in January to a peak of $38,900 in May, fall to $19,500 in August, rise again to $24,300 in September, then fall to $6,100 in December.</desc>

    <!-- baseline at y=290, zero; scale: 40,000 -> 250px (6.25px per 1,000) -->
    <g stroke="#e6e6e6" stroke-width="1">
      <line x1="50" x2="710" y1="190" y2="190"/>
      <line x1="50" x2="710" y1="90" y2="90"/>
    </g>
    <text class="axis" x="44" y="294" text-anchor="end">$0</text>
    <text class="axis" x="44" y="194" text-anchor="end">$16k</text>
    <text class="axis" x="44" y="94" text-anchor="end">$32k</text>

    <g fill="#b8c4b8">
      <rect x="58"  y="238.75" width="44" height="51.25"/>
      <rect x="114" y="233.13" width="44" height="56.87"/>
      <rect x="170" y="192.5"  width="44" height="97.5"/>
      <rect x="226" y="118.75" width="44" height="171.25"/>
      <rect x="282" y="46.88"  width="44" height="243.12" fill="#2f6b3a"/>
      <rect x="338" y="95"     width="44" height="195"/>
      <rect x="394" y="147.5"  width="44" height="142.5"/>
      <rect x="450" y="168.13" width="44" height="121.87"/>
      <rect x="506" y="138.13" width="44" height="151.87"/>
      <rect x="562" y="179.38" width="44" height="110.62"/>
      <rect x="618" y="225"    width="44" height="65"/>
      <rect x="674" y="251.88" width="36" height="38.12" transform="translate(-8 0)"/>
    </g>

    <g class="val" text-anchor="middle">
      <text x="80"  y="232">8,200</text>
      <text x="136" y="227">9,100</text>
      <text x="192" y="186">15,600</text>
      <text x="248" y="113">27,400</text>
      <text class="peak" x="304" y="41">38,900</text>
      <text x="360" y="89">31,200</text>
      <text x="416" y="141">22,800</text>
      <text x="472" y="162">19,500</text>
      <text x="528" y="132">24,300</text>
      <text x="584" y="173">17,700</text>
      <text x="640" y="219">10,400</text>
      <text x="688" y="246">6,100</text>
    </g>

    <line x1="50" x2="710" y1="290" y2="290" stroke="#888" stroke-width="1"/>

    <g class="lbl" text-anchor="middle">
      <text x="80"  y="310">Jan</text>
      <text x="136" y="310">Feb</text>
      <text x="192" y="310">Mar</text>
      <text x="248" y="310">Apr</text>
      <text x="304" y="310">May</text>
      <text x="360" y="310">Jun</text>
      <text x="416" y="310">Jul</text>
      <text x="472" y="310">Aug</text>
      <text x="528" y="310">Sep</text>
      <text x="584" y="310">Oct</text>
      <text x="640" y="310">Nov</text>
      <text x="688" y="310">Dec</text>
    </g>
  </svg>

  <p class="note">Sales climb through the spring planting season, dip over the summer, and get a smaller bump in September before winter. Bars start at $0.</p>

  <table>
    <caption>Fernbrook Nursery monthly sales, 2025 (USD)</caption>
    <thead><tr><th>Month</th><th>Sales</th></tr></thead>
    <tbody>
      <tr><td>Jan</td><td>8,200</td></tr>
      <tr><td>Feb</td><td>9,100</td></tr>
      <tr><td>Mar</td><td>15,600</td></tr>
      <tr><td>Apr</td><td>27,400</td></tr>
      <tr><td>May</td><td>38,900</td></tr>
      <tr><td>Jun</td><td>31,200</td></tr>
      <tr><td>Jul</td><td>22,800</td></tr>
      <tr><td>Aug</td><td>19,500</td></tr>
      <tr><td>Sep</td><td>24,300</td></tr>
      <tr><td>Oct</td><td>17,700</td></tr>
      <tr><td>Nov</td><td>10,400</td></tr>
      <tr><td>Dec</td><td>6,100</td></tr>
    </tbody>
  </table>
</figure>
</body>
</html>
