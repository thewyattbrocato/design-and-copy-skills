<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernbrook Nursery – Monthly Sales, 2025</title>
<style>

  svg { width: 100%; height: auto; display: block; }

  .base { stroke: #9aa39e; stroke-width: 1; }

  .val { font-size: 10.5px; fill: #3d4741; text-anchor: middle; }
  .val.peak { font-weight: 700; fill: #1f5c36; }

</head>
