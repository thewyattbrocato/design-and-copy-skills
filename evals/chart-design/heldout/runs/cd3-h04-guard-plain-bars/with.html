<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernbrook Nursery: Monthly Sales, 2025</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #2b2b2b; background: #fff; margin: 0; padding: 24px; }
  figure { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #666; font-size: 14px; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 280px; border-bottom: 1px solid #999; padding-top: 24px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .val { font-size: 12px; margin-bottom: 4px; font-variant-numeric: tabular-nums; color: #444; }
  .bar { width: 100%; background: #b9c8bb; border-radius: 2px 2px 0 0; }
  .col.peak .bar { background: #2f7d4f; }
  .col.peak .val { font-weight: 700; color: #1f5a37; }
  .labels { display: flex; gap: 6px; margin-top: 6px; }
  .labels span { flex: 1; text-align: center; font-size: 13px; color: #555; }
  table { margin-top: 20px; border-collapse: collapse; font-size: 13px; width: 100%; }
  details summary { cursor: pointer; font-size: 13px; color: #555; margin-top: 16px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; }
  td:last-child, th:last-child { text-align: right; }
  @media (max-width: 520px) { .val { font-size: 10px; } .labels span { font-size: 11px; } }
</style>
</head>
<body>
<figure role="group" aria-labelledby="t" aria-describedby="d">
  <h1 id="t">Sales peaked in May at $38,900</h1>
  <p class="sub" id="d">Fernbrook Nursery monthly sales, 2025 (US dollars). Spring drives the year; December was the lowest month at $6,100, with a smaller bump in September.</p>

  <div class="chart" role="img" aria-label="Bar chart of monthly sales in 2025. Values are listed in the table below.">
    <div class="col" style="height:100%"><div class="val">$8.2k</div><div class="bar" style="height:21.1%"></div></div>
    <div class="col"><div class="val">$9.1k</div><div class="bar" style="height:23.4%"></div></div>
    <div class="col"><div class="val">$15.6k</div><div class="bar" style="height:40.1%"></div></div>
    <div class="col"><div class="val">$27.4k</div><div class="bar" style="height:70.4%"></div></div>
    <div class="col peak"><div class="val">$38.9k</div><div class="bar" style="height:100%"></div></div>
    <div class="col"><div class="val">$31.2k</div><div class="bar" style="height:80.2%"></div></div>
    <div class="col"><div class="val">$22.8k</div><div class="bar" style="height:58.6%"></div></div>
    <div class="col"><div class="val">$19.5k</div><div class="bar" style="height:50.1%"></div></div>
    <div class="col"><div class="val">$24.3k</div><div class="bar" style="height:62.5%"></div></div>
    <div class="col"><div class="val">$17.7k</div><div class="bar" style="height:45.5%"></div></div>
    <div class="col"><div class="val">$10.4k</div><div class="bar" style="height:26.7%"></div></div>
    <div class="col"><div class="val">$6.1k</div><div class="bar" style="height:15.7%"></div></div>
  </div>
  <div class="labels" aria-hidden="true">
    <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
  </div>

  <details>
    <summary>View data as a table</summary>
    <table>
      <thead><tr><th>Month</th><th>Sales</th></tr></thead>
      <tbody>
        <tr><td>January</td><td>$8,200</td></tr>
        <tr><td>February</td><td>$9,100</td></tr>
        <tr><td>March</td><td>$15,600</td></tr>
        <tr><td>April</td><td>$27,400</td></tr>
        <tr><td>May</td><td>$38,900</td></tr>
        <tr><td>June</td><td>$31,200</td></tr>
        <tr><td>July</td><td>$22,800</td></tr>
        <tr><td>August</td><td>$19,500</td></tr>
        <tr><td>September</td><td>$24,300</td></tr>
        <tr><td>October</td><td>$17,700</td></tr>
        <tr><td>November</td><td>$10,400</td></tr>
        <tr><td>December</td><td>$6,100</td></tr>
      </tbody>
    </table>
  </details>
</figure>
</body>
</html>
