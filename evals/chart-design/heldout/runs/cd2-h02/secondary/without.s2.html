<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Average Monthly Rent in Fenwick Falls, 2016–2025</title>
<style>
  :root {
    --surface: #ffffff;
    --ink: #1a1a1a;
    --ink-secondary: #4a4a4a;
    --ink-muted: #6b6b6b;
    --grid: #e3e3e3;
    --axis: #9a9a9a;
    --series: #2b5d8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--surface);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .figure {
    max-width: 800px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 650;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 1rem;
    color: var(--ink-secondary);
    margin: 0 0 16px;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .tick {
    font-size: 13px;
    fill: var(--ink-muted);
  }
  .value {
    font-size: 14px;
    font-weight: 600;
    fill: var(--ink);
    text-anchor: middle;
  }
  .bar { fill: var(--series); }
  .bar-group:hover .bar { opacity: 0.85; }
  .note {
    font-size: 0.9rem;
    color: var(--ink-muted);
    margin: 12px 0 0;
  }
</style>
</head>
<body>
<figure class="figure" style="margin: 0;">
  <h1>Average monthly rent in Fenwick Falls</h1>
  <p class="subtitle">Up $565 (+48%) from 2016 to 2025</p>

  <svg viewBox="0 0 800 470" role="img" aria-labelledby="chart-title chart-desc">
    <title id="chart-title">Average monthly rent in Fenwick Falls, 2016 to 2025</title>
    <desc id="chart-desc">Bar chart. Average monthly rent rose from $1,180 in 2016 to $1,745 in 2025.</desc>

    <!-- Gridlines and y-axis labels -->
    <g>
      <line x1="70" y1="420" x2="780" y2="420" stroke="var(--axis)" stroke-width="1"/>
      <line x1="70" y1="335" x2="780" y2="335" stroke="var(--grid)" stroke-width="1"/>
      <line x1="70" y1="250" x2="780" y2="250" stroke="var(--grid)" stroke-width="1"/>
      <line x1="70" y1="165" x2="780" y2="165" stroke="var(--grid)" stroke-width="1"/>
      <line x1="70" y1="80"  x2="780" y2="80"  stroke="var(--grid)" stroke-width="1"/>
      <text class="tick" x="60" y="425" text-anchor="end">$0</text>
      <text class="tick" x="60" y="340" text-anchor="end">$500</text>
      <text class="tick" x="60" y="255" text-anchor="end">$1,000</text>
      <text class="tick" x="60" y="170" text-anchor="end">$1,500</text>
      <text class="tick" x="60" y="85"  text-anchor="end">$2,000</text>
    </g>

    <!-- Bars: zero baseline, 4px rounded data-ends -->
    <g class="bar-group">
      <path class="bar" d="M79.5,223.4 Q79.5,219.4 83.5,219.4 H127.5 Q131.5,219.4 131.5,223.4 V420 H79.5 Z"><title>2016: $1,180</title></path>
      <text class="value" x="105.5" y="211">$1,180</text>
    </g>
    <g class="bar-group">
      <path class="bar" d="M150.5,217.5 Q150.5,213.5 154.5,213.5 H198.5 Q202.5,213.5 202.5,217.5 V420 H150.5 Z"><title>2017: $1,215</title></path>
      <text class="value" x="176.5" y="205">$1,215</text>
    </g>
    <g class="bar-group">
      <path class="bar" d="M221.5,209.8 Q221.5,205.8 225.5,205.8 H269.5 Q273.5,205.8 273.5,209.8 V420 H221.5 Z"><title>2018: $1,260</title></path>
      <text class="value" x="247.5" y="198">$1,260</text>
    </g>
    <g class="bar-group">
      <path class="bar" d="M292.5,201.3 Q292.5,197.3 296.5,197.3 H340.5 Q344.5,197.3 344.5,201.3 V420 H292.5 Z"><title>2019: $1,310</title></path>
      <text class="value" x="318.5" y="189">$1,310</text>
    </g>
    <g class="bar-group">
      <path class="bar" d="M363.5,198.8 Q363.5,194.8 367.5,194.8 H411.5 Q415.5,194.8 415.5,198.8 V420 H363.5 Z"><title>2020: $1,325</title></path>
      <text class="value" x="389.5" y="187">$1,325</text>
    </g>
    <g class="bar-group">
      <path class="bar" d="M434.5,187.7 Q434.5,183.7 438.5,183.7 H482.5 Q486.5,183.7 486.5,187.7 V420 H434.5 Z"><title>2021: $1,390</title></path>
      <text class="value" x="460.5" y="176">$1,390</text>
    </g>
    <g class="bar-group">
      <path class="bar" d="M505.5,163.9 Q505.5,159.9 509.5,159.9 H553.5 Q557.5,159.9 557.5,163.9 V420 H505.5 Z"><title>2022: $1,530</title></path>
      <text class="value" x="531.5" y="152">$1,530</text>
    </g>
    <g class="bar-group">
      <path class="bar" d="M576.5,145.2 Q576.5,141.2 580.5,141.2 H624.5 Q628.5,141.2 628.5,145.2 V420 H576.5 Z"><title>2023: $1,640</title></path>
      <text class="value" x="602.5" y="133">$1,640</text>
    </g>
    <g class="bar-group">
      <path class="bar" d="M647.5,135.0 Q647.5,131.0 651.5,131.0 H695.5 Q699.5,131.0 699.5,135.0 V420 H647.5 Z"><title>2024: $1,700</title></path>
      <text class="value" x="673.5" y="123">$1,700</text>
    </g>
    <g class="bar-group">
      <path class="bar" d="M718.5,127.4 Q718.5,123.4 722.5,123.4 H766.5 Q770.5,123.4 770.5,127.4 V420 H718.5 Z"><title>2025: $1,745</title></path>
      <text class="value" x="744.5" y="115">$1,745</text>
    </g>

    <!-- X-axis year labels -->
    <g>
      <text class="tick" x="105.5" y="442" text-anchor="middle">2016</text>
      <text class="tick" x="176.5" y="442" text-anchor="middle">2017</text>
      <text class="tick" x="247.5" y="442" text-anchor="middle">2018</text>
      <text class="tick" x="318.5" y="442" text-anchor="middle">2019</text>
      <text class="tick" x="389.5" y="442" text-anchor="middle">2020</text>
      <text class="tick" x="460.5" y="442" text-anchor="middle">2021</text>
      <text class="tick" x="531.5" y="442" text-anchor="middle">2022</text>
      <text class="tick" x="602.5" y="442" text-anchor="middle">2023</text>
      <text class="tick" x="673.5" y="442" text-anchor="middle">2024</text>
      <text class="tick" x="744.5" y="442" text-anchor="middle">2025</text>
    </g>
  </svg>

  <p class="note">Average monthly rent by year. Over the same period, the regional price index rose 32.5% (2016 = 100; 2025 = 132.5).</p>
</figure>
</body>
</html>
