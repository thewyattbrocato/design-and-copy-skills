<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Average Monthly Rent in Fenwick Falls, 2016–2025</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    color: #1f2328;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
  }
  figure {
    margin: 0 auto;
    max-width: 760px;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .subtitle {
    margin: 0 0 16px;
    color: #57606a;
    font-size: 0.98rem;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .axis-label {
    font-size: 13px;
    fill: #57606a;
  }
  .value-label {
    font-size: 13px;
    font-weight: 600;
    fill: #1f2328;
    text-anchor: middle;
  }
  .callout-main {
    font-size: 20px;
    font-weight: 700;
    fill: #1f2328;
  }
  .callout-sub {
    font-size: 13px;
    fill: #57606a;
  }
  figcaption {
    margin-top: 12px;
    font-size: 0.88rem;
    color: #57606a;
  }
  details {
    margin-top: 16px;
    font-size: 0.92rem;
  }
  summary {
    cursor: pointer;
    color: #1f4e6b;
  }
  table {
    border-collapse: collapse;
    margin-top: 8px;
  }
  th, td {
    padding: 4px 16px 4px 0;
    text-align: left;
  }
  th {
    font-weight: 600;
    border-bottom: 1px solid #d0d7de;
  }
</style>
</head>
<body>
<figure>
  <h1>Rent in Fenwick Falls is up 48% since 2016</h1>
  <p class="subtitle">Average monthly rent, 2016 to 2025</p>

  <svg viewBox="0 0 720 420" role="img" aria-labelledby="rent-title rent-desc">
    <title id="rent-title">Average monthly rent in Fenwick Falls, 2016 to 2025</title>
    <desc id="rent-desc">Bar chart of average monthly rent rising every year from $1,180 in 2016 to $1,745 in 2025, a 48 percent increase. The y-axis starts at zero. The regional price index rose 32.5 percent over the same period.</desc>

    <!-- Gridlines and y-axis labels (zero baseline at y=370) -->
    <g stroke="#d0d7de" stroke-width="1">
      <line x1="70" y1="287.5" x2="700" y2="287.5"/>
      <line x1="70" y1="205" x2="700" y2="205"/>
      <line x1="70" y1="122.5" x2="700" y2="122.5"/>
      <line x1="70" y1="40" x2="700" y2="40"/>
    </g>
    <g class="axis-label" text-anchor="end">
      <text x="62" y="374">$0</text>
      <text x="62" y="291.5">$500</text>
      <text x="62" y="209">$1,000</text>
      <text x="62" y="126.5">$1,500</text>
      <text x="62" y="44">$2,000</text>
    </g>
    <line x1="70" y1="370" x2="700" y2="370" stroke="#57606a" stroke-width="1"/>

    <!-- Callout -->
    <text class="callout-main" x="80" y="70">+48% since 2016</text>
    <text class="callout-sub" x="80" y="90">Regional prices rose 32.5% over the same years.</text>

    <!-- Bars: height = value × 0.165 (0 to $2,000 maps to 330px) -->
    <g fill="#2b5d7c">
      <rect x="80.5"  y="175.3"  width="42" height="194.7"/>
      <rect x="143.5" y="169.5"  width="42" height="200.5"/>
      <rect x="206.5" y="162.1"  width="42" height="207.9"/>
      <rect x="269.5" y="153.9"  width="42" height="216.1"/>
      <rect x="332.5" y="151.4"  width="42" height="218.6"/>
      <rect x="395.5" y="140.7"  width="42" height="229.3"/>
      <rect x="458.5" y="117.6"  width="42" height="252.4"/>
      <rect x="521.5" y="99.4"   width="42" height="270.6"/>
      <rect x="584.5" y="89.5"   width="42" height="280.5"/>
      <rect x="647.5" y="82.1"   width="42" height="287.9"/>
    </g>

    <!-- Value labels -->
    <g class="value-label">
      <text x="101.5" y="168">$1,180</text>
      <text x="164.5" y="162">$1,215</text>
      <text x="227.5" y="155">$1,260</text>
      <text x="290.5" y="147">$1,310</text>
      <text x="353.5" y="144">$1,325</text>
      <text x="416.5" y="133">$1,390</text>
      <text x="479.5" y="110">$1,530</text>
      <text x="542.5" y="92">$1,640</text>
      <text x="605.5" y="82">$1,700</text>
      <text x="668.5" y="75">$1,745</text>
    </g>

    <!-- Year labels -->
    <g class="axis-label" text-anchor="middle">
      <text x="101.5" y="392">2016</text>
      <text x="164.5" y="392">2017</text>
      <text x="227.5" y="392">2018</text>
      <text x="290.5" y="392">2019</text>
      <text x="353.5" y="392">2020</text>
      <text x="416.5" y="392">2021</text>
      <text x="479.5" y="392">2022</text>
      <text x="542.5" y="392">2023</text>
      <text x="605.5" y="392">2024</text>
      <text x="668.5" y="392">2025</text>
    </g>
  </svg>

  <figcaption>Bars start at $0. Values are average monthly rent in dollars. Regional price index (2016 = 100) reached 132.5 in 2025.</figcaption>

  <details>
    <summary>Show the figures</summary>
    <table>
      <thead>
        <tr><th scope="col">Year</th><th scope="col">Average monthly rent</th></tr>
      </thead>
      <tbody>
        <tr><th scope="row">2016</th><td>$1,180</td></tr>
        <tr><th scope="row">2017</th><td>$1,215</td></tr>
        <tr><th scope="row">2018</th><td>$1,260</td></tr>
        <tr><th scope="row">2019</th><td>$1,310</td></tr>
        <tr><th scope="row">2020</th><td>$1,325</td></tr>
        <tr><th scope="row">2021</th><td>$1,390</td></tr>
        <tr><th scope="row">2022</th><td>$1,530</td></tr>
        <tr><th scope="row">2023</th><td>$1,640</td></tr>
        <tr><th scope="row">2024</th><td>$1,700</td></tr>
        <tr><th scope="row">2025</th><td>$1,745</td></tr>
      </tbody>
    </table>
  </details>
</figure>
</body>
</html>
