<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tallowcast: Light vs Dark</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #888;
    min-height: 100vh;
    padding: 32px 24px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    margin-bottom: 24px;
  }

  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .panel {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }

  .panel-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 20px 0;
    color: var(--muted);
    background: var(--bg);
  }

  /* ---------- Themes ---------- */
  .theme-light {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #1d1b19;
    --muted: #6e6862;
    --accent: #e0492b;
    --accent-text: #ffffff;
    --border: #e8e1d7;
  }

  .theme-dark {
    --bg: #151311;
    --card: #1f1c19;
    --text: #f4efe8;
    --muted: #a8a097;
    --accent: #ff6b4a;
    --accent-text: #151311;
    --border: #352f29;
  }

  /* ---------- Episode list ---------- */
  .screen {
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }

  .screen-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .screen-subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .episode-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .episode {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .episode-info {
    flex: 1;
    min-width: 0;
  }

  .episode-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .episode-meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .play-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .play-btn:hover { filter: brightness(1.08); }

  .play-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .play-btn svg {
    width: 14px;
    height: 14px;
    margin-left: 2px;
    fill: currentColor;
  }

  @media (max-width: 760px) {
    .compare { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<h1>Tallowcast episode list: light vs. dark</h1>

<div class="compare">
  <section class="panel theme-light" aria-label="Light theme">
    <div class="panel-label">Light</div>
    <div class="screen">
      <div class="screen-title">Episodes</div>
      <div class="screen-subtitle">Latest from your subscriptions</div>
      <ul class="episode-list" data-episodes></ul>
    </div>
  </section>

  <section class="panel theme-dark" aria-label="Dark theme">
    <div class="panel-label">Dark</div>
    <div class="screen">
      <div class="screen-title">Episodes</div>
      <div class="screen-subtitle">Latest from your subscriptions</div>
      <ul class="episode-list" data-episodes></ul>
    </div>
  </section>
</div>

<script>
  const episodes = [
    { title: "The Quiet Art of Sourdough Starters", length: "42 min" },
    { title: "Night Shift: Stories from the Lighthouse", length: "28 min" },
    { title: "Why Cities Smell Like Rain", length: "35 min" },
    { title: "Field Notes on Slow Travel", length: "51 min" },
    { title: "Repairing Old Radios with Marta Quinn", length: "1 hr 6 min" }
  ];

  const playIcon = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1.2v11.6c0 .5.6.8 1 .5l9.4-5.8a.6.6 0 0 0 0-1L3 .7c-.4-.3-1 0-1 .5z"/></svg>';

  function renderEpisode(ep) {
    return `
      <li class="episode">
        <div class="episode-info">
          <div class="episode-title">${ep.title}</div>
          <div class="episode-meta">${ep.length}</div>
        </div>
        <button class="play-btn" type="button" aria-label="Play ${ep.title}">${playIcon}</button>
      </li>`;
  }

  document.querySelectorAll("[data-episodes]").forEach(list => {
    list.innerHTML = episodes.map(renderEpisode).join("");
  });
</script>

</body>
</html>
