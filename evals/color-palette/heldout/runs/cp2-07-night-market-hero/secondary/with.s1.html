<!DOCTYPE html>
<!--
  Placeholder hero. The dusk sky is CSS gradients until the photo arrives.
  Note: October 17, 2026 is a Saturday. The copy below follows the brief (Friday to Sunday, October 17 to 19), so confirm the year before publishing.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Row Night Market</title>
  <style>
    :root {
      --ink: #ffffff;
      --accent: #ffd27a;
      --accent-ink: #2a1420;
      --dates: #ffd9a8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: #120c1f;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem;
      text-align: center;
      overflow: hidden;
      /* Dusk sky: deep indigo at the top, fading through plum and rose to a warm horizon */
      background: linear-gradient(
        to bottom,
        #161032 0%,
        #2e1a4a 30%,
        #6a2a57 55%,
        #c4574f 78%,
        #f0a060 92%,
        #ffd08a 100%
      );
    }

    /* Soft lantern glows, placed loosely like string lights */
    .glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 190, 90, 0.55) 0%, rgba(255, 190, 90, 0) 70%);
    }

    .glow-1 {
      width: 28rem;
      height: 28rem;
      top: -6rem;
      left: -8rem;
    }

    .glow-2 {
      width: 22rem;
      height: 22rem;
      top: 15%;
      right: -6rem;
      background: radial-gradient(circle, rgba(255, 140, 110, 0.45) 0%, rgba(255, 140, 110, 0) 70%);
    }

    .glow-3 {
      width: 30rem;
      height: 30rem;
      bottom: -12rem;
      left: 30%;
      background: radial-gradient(circle, rgba(255, 220, 150, 0.5) 0%, rgba(255, 220, 150, 0) 70%);
    }

    /* Dark ground band so the horizon reads as a night market */
    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 16%;
      background: linear-gradient(to top, #120c1f 0%, rgba(18, 12, 31, 0) 100%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 60rem;
    }

    .dates {
      margin: 0 0 1.25rem;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dates);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 7.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
    }

    .tagline {
      margin: 1.5rem auto 2.5rem;
      max-width: 36rem;
      font-size: clamp(1.1rem, 2.4vw, 1.4rem);
      line-height: 1.5;
      color: #fff4e6;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.4);
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    .btn:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <section class="hero" aria-labelledby="hero-title">
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>
    <div class="glow glow-3" aria-hidden="true"></div>

    <div class="hero-content">
      <p class="dates">Friday to Sunday &middot; October 17&ndash;19</p>
      <h1 id="hero-title">Lantern Row<br>Night Market</h1>
      <p class="tagline">Food, crafts and live music after dark</p>
      <a class="btn" href="#tickets">Get tickets</a>
    </div>
  </section>
</body>
</html>
