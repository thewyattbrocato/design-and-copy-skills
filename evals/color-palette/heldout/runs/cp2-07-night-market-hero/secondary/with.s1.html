<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lantern Row Night Market</title>
<!-- Note: October 17, 2026 falls on a Saturday (Oct 16, 2026 is the Friday). The dates below follow the brief as written; confirm the weekday before publishing. -->
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #1a1033;
    color: #fff8ef;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6rem 1.5rem 5rem;
    overflow: hidden;
    /* Placeholder dusk sky until the photo arrives */
    background:
      radial-gradient(ellipse 80% 40% at 50% 100%, rgba(255, 150, 70, 0.85) 0%, rgba(255, 110, 90, 0.4) 45%, transparent 75%),
      radial-gradient(ellipse 60% 25% at 20% 100%, rgba(255, 190, 110, 0.35) 0%, transparent 70%),
      linear-gradient(
        to bottom,
        #0d0a24 0%,
        #1d1447 28%,
        #4a2470 55%,
        #9c3f74 75%,
        #e9736a 90%,
        #ffb366 100%
      );
  }

  /* Soft lantern-like glow dots for atmosphere */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 12% 78%, rgba(255, 214, 140, 0.55) 0 2px, transparent 3px),
      radial-gradient(circle at 28% 84%, rgba(255, 214, 140, 0.45) 0 2px, transparent 3px),
      radial-gradient(circle at 46% 80%, rgba(255, 214, 140, 0.6) 0 2px, transparent 3px),
      radial-gradient(circle at 63% 86%, rgba(255, 214, 140, 0.5) 0 2px, transparent 3px),
      radial-gradient(circle at 81% 79%, rgba(255, 214, 140, 0.55) 0 2px, transparent 3px),
      radial-gradient(circle at 90% 88%, rgba(255, 214, 140, 0.4) 0 2px, transparent 3px);
    pointer-events: none;
  }

  /* Dark overlay keeps the text readable over the bright horizon */
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(13, 10, 36, 0.35), rgba(13, 10, 36, 0.1) 60%, rgba(13, 10, 36, 0.35));
    pointer-events: none;
  }

  .hero__content {
    position: relative;
    z-index: 1;
    max-width: 52rem;
  }

  .hero__eyebrow {
    margin: 0 0 1.25rem;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #ffd08a;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
  }

  .hero__title {
    margin: 0;
    font-size: clamp(3rem, 9vw, 7.5rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
  }

  .hero__dates {
    margin: 1.75rem 0 0;
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  }

  .hero__tagline {
    margin: 0.75rem 0 0;
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    font-weight: 400;
    opacity: 0.92;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  }

  .hero__button {
    display: inline-block;
    margin-top: 2.5rem;
    padding: 1rem 2.5rem;
    border-radius: 999px;
    background: #ffb366;
    color: #2a1234;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 0.02em;
    box-shadow: 0 10px 30px rgba(255, 150, 70, 0.4);
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .hero__button:hover {
    background: #ffc585;
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(255, 150, 70, 0.5);
  }

  .hero__button:focus-visible {
    outline: 3px solid #fff8ef;
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .hero__button {
      transition: none;
    }
    .hero__button:hover {
      transform: none;
    }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero__content">
      <p class="hero__eyebrow">Friday to Sunday</p>
      <h1 class="hero__title">Lantern Row<br>Night Market</h1>
      <p class="hero__dates">October 17 – 19</p>
      <p class="hero__tagline">Food, crafts and live music after dark</p>
      <a class="hero__button" href="#tickets">Get tickets</a>
    </div>
  </header>
</body>
</html>
