<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lantern Row Night Market</title>
  <!-- Note: Oct 17-19 is Fri-Sun in 2025. In 2026 those dates fall on Sat-Sun-Mon, so confirm the year before publishing. -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #1a1030;
      color: #fff8ef;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 1.5rem;
      overflow: hidden;
      /* Placeholder dusk sky: deep indigo at the top, plum in the middle, warm amber at the horizon */
      background:
        radial-gradient(ellipse 60% 25% at 50% 100%, rgba(255, 170, 80, 0.85), rgba(255, 170, 80, 0) 70%),
        radial-gradient(ellipse 40% 15% at 20% 92%, rgba(255, 120, 60, 0.45), rgba(255, 120, 60, 0) 70%),
        radial-gradient(ellipse 35% 12% at 85% 90%, rgba(255, 90, 110, 0.4), rgba(255, 90, 110, 0) 70%),
        linear-gradient(to bottom,
          #0d0a24 0%,
          #1f1447 35%,
          #4a2063 62%,
          #8a3a6a 80%,
          #d9674f 92%,
          #f5a35c 100%);
    }

    /* Faint "lantern" glows scattered over the placeholder sky */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 70%, rgba(255, 214, 140, 0.35) 0, rgba(255, 214, 140, 0) 4%),
        radial-gradient(circle at 28% 80%, rgba(255, 214, 140, 0.3) 0, rgba(255, 214, 140, 0) 3%),
        radial-gradient(circle at 74% 76%, rgba(255, 214, 140, 0.35) 0, rgba(255, 214, 140, 0) 4%),
        radial-gradient(circle at 88% 66%, rgba(255, 214, 140, 0.3) 0, rgba(255, 214, 140, 0) 3%);
    }

    /* Soft darkening behind the text so it stays readable over the bright horizon */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(13, 10, 36, 0.55), rgba(13, 10, 36, 0) 75%);
    }

    .hero__content {
      position: relative;
      z-index: 1;
      max-width: 60rem;
    }

    .hero__eyebrow {
      margin: 0 0 1.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #ffd28a;
    }

    .hero__title {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
      font-size: clamp(3rem, 10vw, 7.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
    }

    .hero__dates {
      margin: 1.75rem 0 0;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #ffe2b5;
    }

    .hero__tagline {
      margin: 0.75rem 0 0;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 400;
      color: #f6e6ff;
      opacity: 0.92;
    }

    .hero__button {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 1rem 2.6rem;
      border-radius: 999px;
      background: #ffb347;
      color: #2a1238;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(255, 150, 60, 0.4);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .hero__button:hover {
      background: #ffc270;
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(255, 150, 60, 0.5);
    }

    .hero__button:focus-visible {
      outline: 3px solid #fff8ef;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__button {
        transition: none;
      }
      .hero__button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero__content">
      <p class="hero__eyebrow">Night Market</p>
      <h1 class="hero__title">Lantern Row<br>Night Market</h1>
      <p class="hero__dates">Friday to Sunday, October 17&ndash;19</p>
      <p class="hero__tagline">Food, crafts and live music after dark</p>
      <a class="hero__button" href="#tickets">Get tickets</a>
    </div>
  </header>
</body>
</html>
