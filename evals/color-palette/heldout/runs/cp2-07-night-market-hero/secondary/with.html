<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lantern Row Night Market</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1b1036;
      color: #fff8f0;
      -webkit-font-smoothing: antialiased;
    }

    /* Placeholder dusk sky until the photo is ready */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 1.5rem;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(255, 160, 80, 0.85) 0%, rgba(255, 110, 90, 0.4) 25%, transparent 55%),
        radial-gradient(circle at 50% 78%, rgba(255, 200, 120, 0.35) 0%, transparent 18%),
        linear-gradient(
          to bottom,
          #0d0826 0%,
          #2a1450 35%,
          #6a2a6e 62%,
          #c2526a 82%,
          #f08a5d 100%
        );
    }

    /* Soft horizon haze */
    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28%;
      background: linear-gradient(to top, rgba(20, 8, 40, 0.55), transparent);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 60rem;
    }

    .eyebrow {
      font-size: clamp(0.8rem, 1.6vw, 1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #ffd9a8;
      margin-bottom: 1.25rem;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
    }

    .title {
      font-size: clamp(3rem, 10vw, 7.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    }

    .dates {
      margin-top: 1.75rem;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 600;
      color: #ffe3c2;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .tagline {
      margin-top: 0.75rem;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      font-weight: 400;
      color: #fbe9dc;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .cta {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 1rem 2.5rem;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #2a0f2e;
      background: #ffc46b;
      border: none;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 150, 60, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .cta:hover {
      background: #ffd488;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 150, 60, 0.55);
    }

    .cta:focus-visible {
      outline: 3px solid #fff8f0;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .cta,
      .cta:hover {
        transition: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <!-- Note: October 17 falls on a Saturday in 2026 (it is a Friday in 2025). Confirm the year before publishing. -->
  <section class="hero">
    <div class="hero-content">
      <p class="eyebrow">Lantern Row</p>
      <h1 class="title">Night Market</h1>
      <p class="dates">Friday to Sunday, October 17&ndash;19</p>
      <p class="tagline">Food, crafts and live music after dark</p>
      <a href="#tickets" class="cta">Get tickets</a>
    </div>
  </section>
</body>
</html>
