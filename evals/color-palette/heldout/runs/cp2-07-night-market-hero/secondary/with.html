<!DOCTYPE html>
<html lang="en">
<!--
  NOTE: October 17 falls on a Saturday in 2026 (Friday is October 16).
  The copy below uses the dates as provided: "Friday to Sunday, October 17 to 19".
  Confirm the year or day names before publishing.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lantern Row Night Market</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff7ec;
      background: #1a1030;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 1.5rem;
      overflow: hidden;
      /* Placeholder dusk sky until the photo is ready */
      background:
        radial-gradient(ellipse 60% 35% at 50% 100%, rgba(255, 170, 80, 0.85), transparent 70%),
        radial-gradient(ellipse 40% 20% at 20% 92%, rgba(255, 120, 60, 0.55), transparent 70%),
        radial-gradient(ellipse 40% 20% at 80% 90%, rgba(255, 140, 90, 0.5), transparent 70%),
        linear-gradient(
          to bottom,
          #0d0b22 0%,
          #241640 35%,
          #5a2a5c 62%,
          #b4505a 82%,
          #f0884f 100%
        );
    }

    /* Soft lantern glows scattered across the lower sky */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 75%, rgba(255, 200, 110, 0.35) 0, transparent 2.5%),
        radial-gradient(circle at 30% 68%, rgba(255, 190, 100, 0.28) 0, transparent 2%),
        radial-gradient(circle at 70% 72%, rgba(255, 210, 120, 0.32) 0, transparent 2.5%),
        radial-gradient(circle at 85% 80%, rgba(255, 180, 90, 0.26) 0, transparent 2%);
      pointer-events: none;
    }

    /* Darkens the sky behind the text for readability */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(10, 6, 24, 0.45), transparent 75%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 60rem;
    }

    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #ffd9a0;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
    }

    .dates {
      margin: 1.75rem 0 0;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 600;
      color: #ffe7c2;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    .tagline {
      margin: 0.75rem 0 0;
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #f7d9cf;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .cta {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.95rem 2.4rem;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #2a1330;
      background: #ffc27a;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .cta:hover,
    .cta:focus-visible {
      background: #ffd49a;
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 3px solid #fff7ec;
      outline-offset: 4px;
    }

    @media (max-width: 480px) {
      .hero {
        padding: 4rem 1.25rem;
      }

      .cta {
        width: 100%;
        padding: 0.9rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <p class="eyebrow">Lantern Row</p>
      <h1>Night Market</h1>
      <p class="dates">Friday to Sunday, October 17 to 19</p>
      <p class="tagline">Food, crafts and live music after dark</p>
      <a class="cta" href="#tickets">Get tickets</a>
    </div>
  </section>
</body>
</html>
