<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Note: October 17–19 falls on Saturday–Monday in 2026 (Friday is the 16th). Confirm the dates before launch. -->
<title>Lantern Row Night Market</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #1a1030;
    color: #fff8ee;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6rem 1.5rem;
    overflow: hidden;
    /* Placeholder dusk sky until the real photo arrives */
    background:
      /* faint stars */
      radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.7) 0 1px, transparent 2px),
      radial-gradient(circle at 78% 12%, rgba(255, 255, 255, 0.6) 0 1px, transparent 2px),
      radial-gradient(circle at 42% 26%, rgba(255, 255, 255, 0.5) 0 1px, transparent 2px),
      radial-gradient(circle at 90% 34%, rgba(255, 255, 255, 0.45) 0 1px, transparent 2px),
      /* warm glow on the horizon */
      radial-gradient(ellipse 80% 45% at 50% 100%, rgba(255, 158, 64, 0.85), transparent 70%),
      /* dark ground silhouette */
      linear-gradient(to top, #0d0717 0%, #0d0717 12%, transparent 22%),
      /* sky bands: indigo to plum to amber */
      linear-gradient(to bottom, #0b1030 0%, #2a1550 35%, #7a2f5c 62%, #d9643f 85%, #ffb05a 100%);
  }

  .hero::after {
    /* soft vignette to keep text readable */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(10, 5, 20, 0.35), rgba(10, 5, 20, 0.6));
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 52rem;
  }

  .eyebrow {
    margin: 0 0 1rem;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #ffd8a0;
  }

  .title {
    margin: 0;
    font-size: clamp(3rem, 10vw, 7.5rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
  }

  .dates {
    margin: 1.5rem 0 0;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #ffe2b8;
  }

  .tagline {
    margin: 0.75rem 0 0;
    font-size: clamp(1rem, 2vw, 1.25rem);
    font-style: italic;
    color: #fff8ee;
    opacity: 0.9;
  }

  .cta {
    display: inline-block;
    margin-top: 2.5rem;
    padding: 0.95rem 2.4rem;
    border-radius: 999px;
    background: #ffb05a;
    color: #2a1020;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(255, 150, 70, 0.35);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .cta:hover,
  .cta:focus-visible {
    background: #ffc27f;
    transform: translateY(-2px);
  }

  .cta:focus-visible {
    outline: 3px solid #fff8ee;
    outline-offset: 4px;
  }

  @media (max-width: 480px) {
    .hero { padding: 4rem 1.25rem; }
    .cta { width: 100%; padding: 0.95rem 1.5rem; }
  }
</style>
</head>
<body>
  <section class="hero" id="top">
    <div class="hero-content">
      <p class="eyebrow">Lantern Row</p>
      <h1 class="title">Lantern Row<br>Night Market</h1>
      <p class="dates">Friday to Sunday, October 17 to 19</p>
      <p class="tagline">Food, crafts and live music after dark</p>
      <a class="cta" href="#tickets">Get tickets</a>
    </div>
  </section>
</body>
</html>
