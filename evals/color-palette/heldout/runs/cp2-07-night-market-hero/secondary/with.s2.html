<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Row Night Market</title>
  <!-- Note: October 17 falls on a Saturday in 2026 (Friday in 2025). Confirm the year before publishing the dates. -->
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: #1b1f4b;
      color: #fff7ec;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 1.5rem 8rem;
      overflow: hidden;
      /* Placeholder dusk sky until the photo arrives */
      background: linear-gradient(
        180deg,
        #141a40 0%,
        #2b2a66 22%,
        #4d3279 42%,
        #8a3f7a 60%,
        #d9605a 76%,
        #f59d5c 88%,
        #ffd08a 100%
      );
    }

    /* Lantern glow near the horizon */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 92%, rgba(255, 214, 140, 0.6), transparent 40%),
        radial-gradient(circle at 16% 80%, rgba(255, 170, 90, 0.4), transparent 28%),
        radial-gradient(circle at 84% 78%, rgba(255, 170, 90, 0.35), transparent 26%),
        radial-gradient(circle at 70% 18%, rgba(255, 255, 255, 0.06), transparent 30%);
    }

    /* Dark ground band to suggest the market below the horizon */
    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14%;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(26, 14, 34, 0) 0%, #1a0e22 100%);
    }

    .hero__content {
      position: relative;
      z-index: 1;
      max-width: 60rem;
    }

    .hero__title {
      margin: 0;
      font-size: clamp(3rem, 10vw, 7.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 24px rgba(20, 8, 30, 0.45);
    }

    .hero__title span {
      display: block;
    }

    .hero__dates {
      margin: 1.75rem 0 0;
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 1px 12px rgba(20, 8, 30, 0.5);
    }

    .hero__tagline {
      margin: 1rem 0 0;
      font-size: clamp(1.1rem, 2.6vw, 1.5rem);
      font-weight: 400;
      text-shadow: 0 1px 12px rgba(20, 8, 30, 0.5);
    }

    .btn {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.95rem 2.4rem;
      border-radius: 999px;
      background: #ffb347;
      color: #2a1433;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(255, 150, 60, 0.35);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .btn:hover {
      background: #ffc170;
      transform: translateY(-2px);
    }

    .btn:focus-visible {
      outline: 3px solid #fff7ec;
      outline-offset: 4px;
    }

    @media (max-width: 480px) {
      .hero {
        padding: 4.5rem 1.25rem 6rem;
      }

      .hero__dates {
        letter-spacing: 0.1em;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__content">
      <h1 class="hero__title">
        <span>Lantern Row</span>
        <span>Night Market</span>
      </h1>
      <p class="hero__dates">Friday to Sunday, October 17&ndash;19</p>
      <p class="hero__tagline">Food, crafts and live music after dark</p>
      <a class="btn" href="#tickets">Get tickets</a>
    </div>
  </section>
</body>
</html>
