<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #120a24;
    color: #fff;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6rem 1.5rem 8rem;
    overflow: hidden;
    isolation: isolate;
    text-align: center;
    background:
      radial-gradient(ellipse 60% 35% at 50% 100%, rgba(255, 150, 70, 0.75) 0%, rgba(255, 110, 80, 0.35) 45%, transparent 75%),
      linear-gradient(180deg,
        #0f0a28 0%,
        #2a1450 28%,
        #61256b 52%,
        #b8466a 72%,
        #f0794f 88%,
        #ffb15c 100%);
  }

  /* faint stars */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0 0 45% 0;
    z-index: -1;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 20%, rgba(255,255,255,.9), transparent 100%),
      radial-gradient(1px 1px at 28% 55%, rgba(255,255,255,.7), transparent 100%),
      radial-gradient(1.5px 1.5px at 44% 15%, rgba(255,255,255,.8), transparent 100%),
      radial-gradient(1px 1px at 61% 40%, rgba(255,255,255,.7), transparent 100%),
      radial-gradient(1.5px 1.5px at 76% 18%, rgba(255,255,255,.9), transparent 100%),
      radial-gradient(1px 1px at 88% 48%, rgba(255,255,255,.6), transparent 100%),
      radial-gradient(1px 1px at 6% 62%, rgba(255,255,255,.5), transparent 100%),
      radial-gradient(1px 1px at 93% 12%, rgba(255,255,255,.7), transparent 100%);
  }

  /* lantern glows along the horizon */
  .hero::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 30%;
    z-index: -1;
    background:
      radial-gradient(circle 70px at 12% 80%, rgba(255, 190, 90, .55), transparent 100%),
      radial-gradient(circle 55px at 30% 90%, rgba(255, 120, 90, .5), transparent 100%),
      radial-gradient(circle 80px at 52% 85%, rgba(255, 200, 100, .5), transparent 100%),
      radial-gradient(circle 60px at 72% 92%, rgba(255, 130, 90, .5), transparent 100%),
      radial-gradient(circle 70px at 90% 82%, rgba(255, 190, 90, .55), transparent 100%),
      linear-gradient(180deg, transparent, rgba(30, 10, 30, .65));
  }

  .content {
    max-width: 52rem;
    text-shadow: 0 2px 24px rgba(20, 5, 40, .55);
  }

  .eyebrow {
    margin: 0 0 1.25rem;
    font-size: clamp(.8rem, 1.6vw, 1rem);
    font-weight: 600;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #ffd9a0;
  }

  h1 {
    margin: 0;
    font-size: clamp(3rem, 12vw, 8rem);
    line-height: .95;
    font-weight: 800;
    letter-spacing: -.02em;
    text-transform: uppercase;
  }
  h1 span {
    display: block;
    color: #ffc46b;
  }

  .tagline {
    margin: 1.75rem 0 2.25rem;
    font-size: clamp(1.1rem, 2.6vw, 1.6rem);
    line-height: 1.4;
    color: #fff4e6;
  }

  .btn {
    display: inline-block;
    padding: 1rem 2.4rem;
    border-radius: 999px;
    background: #ffc46b;
    color: #2a1038;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    text-shadow: none;
    box-shadow: 0 8px 28px rgba(255, 150, 60, .45);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover { background: #ffd48c; transform: translateY(-2px); box-shadow: 0 12px 34px rgba(255, 150, 60, .55); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="content">
      <p class="eyebrow">Friday – Sunday &middot; October 17–19</p>
      <h1>Lantern Row <span>Night Market</span></h1>
      <p class="tagline">Food, crafts and live music after dark</p>
      <a class="btn" href="#tickets">Get tickets</a>
    </div>
  </header>
</body>
</html>
