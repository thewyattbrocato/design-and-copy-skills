<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market · October 17–19</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #120d24;
    color: #fff7ea;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    padding: clamp(24px, 6vw, 96px);
    overflow: hidden;
    isolation: isolate;
    background:
      /* horizon glow */
      radial-gradient(120% 55% at 50% 100%, rgba(255,150,70,.85) 0%, rgba(240,100,80,.55) 35%, rgba(240,100,80,0) 70%),
      /* faint lantern glows */
      radial-gradient(circle at 18% 78%, rgba(255,190,90,.35) 0 6%, transparent 14%),
      radial-gradient(circle at 36% 86%, rgba(255,170,80,.30) 0 5%, transparent 12%),
      radial-gradient(circle at 64% 82%, rgba(255,190,90,.32) 0 6%, transparent 14%),
      radial-gradient(circle at 84% 88%, rgba(255,170,80,.30) 0 5%, transparent 12%),
      /* sky */
      linear-gradient(180deg, #120d24 0%, #2a1a4a 30%, #5b2c6f 55%, #b5476b 78%, #f08a5d 100%);
  }

  /* stars */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0 0 45% 0;
    z-index: -1;
    background:
      radial-gradient(1.5px 1.5px at 12% 20%, #fff, transparent 60%),
      radial-gradient(1px 1px at 27% 8%, #fff, transparent 60%),
      radial-gradient(1.5px 1.5px at 41% 28%, #fff, transparent 60%),
      radial-gradient(1px 1px at 58% 12%, #fff, transparent 60%),
      radial-gradient(1.5px 1.5px at 73% 24%, #fff, transparent 60%),
      radial-gradient(1px 1px at 88% 10%, #fff, transparent 60%),
      radial-gradient(1px 1px at 94% 32%, #fff, transparent 60%),
      radial-gradient(1px 1px at 5% 38%, #fff, transparent 60%);
    opacity: .8;
  }

  /* dark skyline silhouette + legibility scrim */
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(90deg, rgba(18,13,36,.55) 0%, rgba(18,13,36,.25) 55%, rgba(18,13,36,0) 100%),
      linear-gradient(0deg, rgba(18,13,36,.55) 0, rgba(18,13,36,0) 18%);
  }

  .content { max-width: 40rem; }

  .dates {
    margin: 0 0 1rem;
    font-size: clamp(.85rem, 1.6vw, 1rem);
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #ffc978;
  }

  h1 {
    margin: 0;
    font-size: clamp(3rem, 11vw, 7.5rem);
    line-height: .95;
    font-weight: 800;
    letter-spacing: -.02em;
    text-shadow: 0 2px 24px rgba(18,13,36,.55);
  }
  h1 span { display: block; color: #ffc978; }

  .tagline {
    margin: 1.5rem 0 2.25rem;
    font-size: clamp(1.1rem, 2.4vw, 1.5rem);
    line-height: 1.4;
    color: #fff1dc;
    text-shadow: 0 1px 12px rgba(18,13,36,.6);
  }

  .btn {
    display: inline-block;
    padding: 1rem 2.25rem;
    border-radius: 999px;
    background: #ffc978;
    color: #2a1236;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    transition: transform .15s ease, background .15s ease;
  }
  .btn:hover { background: #ffd99c; transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="content">
      <p class="dates">Friday–Sunday · October 17–19</p>
      <h1>Lantern Row <span>Night Market</span></h1>
      <p class="tagline">Food, crafts and live music after dark.</p>
      <a class="btn" href="#tickets">Get tickets</a>
    </div>
  </header>
</body>
</html>
