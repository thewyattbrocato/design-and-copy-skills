<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #120b24;
    color: #fff;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.5rem;
    overflow: hidden;
    isolation: isolate;
    text-align: center;
    /* dusk sky: deep indigo at the top, through violet and rose, to a warm amber horizon */
    background:
      radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255, 176, 92, 0.85), rgba(255, 176, 92, 0) 70%),
      radial-gradient(circle at 18% 78%, rgba(255, 120, 90, 0.35), rgba(255, 120, 90, 0) 40%),
      radial-gradient(circle at 84% 70%, rgba(255, 150, 110, 0.25), rgba(255, 150, 110, 0) 35%),
      linear-gradient(180deg,
        #0f0a26 0%,
        #231445 22%,
        #4b2257 42%,
        #8a3560 60%,
        #d2575a 78%,
        #f59a55 92%,
        #ffc274 100%);
  }

  /* faint stars in the upper sky */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0 0 45% 0;
    z-index: -1;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 20%, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 28% 55%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 41% 12%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 57% 38%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 69% 18%, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 83% 48%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 92% 14%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 6% 62%, rgba(255,255,255,.5), transparent);
  }

  /* silhouetted skyline / stall roofs along the bottom */
  .hero::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 14%;
    z-index: -1;
    background:
      linear-gradient(180deg, rgba(18,11,36,0) 0%, rgba(18,11,36,.85) 70%, #120b24 100%);
  }

  .content {
    max-width: 52rem;
    text-shadow: 0 2px 24px rgba(15, 10, 38, 0.55);
  }

  .eyebrow {
    margin: 0 0 1.25rem;
    font-size: clamp(.8rem, 1.6vw, .95rem);
    font-weight: 600;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #ffd9a3;
  }

  h1 {
    margin: 0;
    font-size: clamp(3.25rem, 11vw, 8rem);
    line-height: .95;
    font-weight: 800;
    letter-spacing: -.03em;
    text-wrap: balance;
  }
  h1 span {
    display: block;
    font-weight: 300;
    font-size: .5em;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-top: .3em;
    color: #ffe2b8;
  }

  .dates {
    margin: 2rem 0 .5rem;
    font-size: clamp(1.25rem, 3.2vw, 2rem);
    font-weight: 600;
  }
  .dates small {
    display: block;
    margin-top: .35rem;
    font-size: .6em;
    font-weight: 400;
    letter-spacing: .08em;
    color: #ffe2b8;
  }

  .tagline {
    margin: 1.25rem 0 2.5rem;
    font-size: clamp(1.05rem, 2.2vw, 1.4rem);
    color: #fff3e0;
  }

  .cta {
    display: inline-block;
    padding: 1rem 2.5rem;
    border-radius: 999px;
    background: #ffb347;
    color: #2a1236;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: .02em;
    text-decoration: none;
    text-shadow: none;
    box-shadow: 0 8px 30px rgba(255, 150, 60, .45);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .cta:hover { background: #ffc46b; transform: translateY(-2px); box-shadow: 0 12px 36px rgba(255, 150, 60, .55); }
  .cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
    .cta:hover { transform: none; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="content">
      <p class="eyebrow">Friday – Sunday &middot; October 17–19</p>
      <h1>Lantern Row <span>Night Market</span></h1>
      <p class="dates">Friday to Sunday, October 17 to 19<small>Doors open at dusk</small></p>
      <p class="tagline">Food, crafts and live music after dark.</p>
      <a class="cta" href="#tickets">Get tickets</a>
    </div>
  </header>
</body>
</html>
