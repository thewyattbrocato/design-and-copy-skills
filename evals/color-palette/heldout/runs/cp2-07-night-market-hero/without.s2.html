<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #fff7ea;
    background: #120a24;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6rem 1.5rem;
    overflow: hidden;
    isolation: isolate;
    background:
      /* horizon glow */
      radial-gradient(ellipse 90% 40% at 50% 100%, rgba(255, 170, 80, 0.85), rgba(255, 120, 70, 0) 70%),
      /* faint moon */
      radial-gradient(circle at 80% 18%, rgba(255, 244, 220, 0.9) 0, rgba(255, 244, 220, 0.9) 1.2%, rgba(255, 244, 220, 0.15) 3.5%, transparent 9%),
      /* dusk sky */
      linear-gradient(180deg, #120a24 0%, #2a1650 28%, #6b2f77 52%, #c4476b 72%, #f48a55 88%, #ffc274 100%);
  }

  /* stars */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0 0 45% 0;
    z-index: -1;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 20%, #fff, transparent),
      radial-gradient(1px 1px at 28% 55%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 41% 14%, #fff, transparent),
      radial-gradient(1px 1px at 57% 40%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 66% 10%, #fff, transparent),
      radial-gradient(1px 1px at 74% 48%, #fff, transparent),
      radial-gradient(1px 1px at 90% 35%, #fff, transparent),
      radial-gradient(1px 1px at 5% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 35% 32%, #fff, transparent);
    opacity: 0.7;
  }

  /* lantern string silhouette along the bottom */
  .hero::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 22%;
    z-index: -1;
    background:
      radial-gradient(circle at 10% 30%, rgba(255, 200, 110, 0.9) 0, rgba(255, 160, 70, 0.5) 6px, transparent 22px),
      radial-gradient(circle at 30% 55%, rgba(255, 200, 110, 0.9) 0, rgba(255, 160, 70, 0.5) 6px, transparent 22px),
      radial-gradient(circle at 50% 25%, rgba(255, 200, 110, 0.9) 0, rgba(255, 160, 70, 0.5) 6px, transparent 22px),
      radial-gradient(circle at 70% 60%, rgba(255, 200, 110, 0.9) 0, rgba(255, 160, 70, 0.5) 6px, transparent 22px),
      radial-gradient(circle at 90% 35%, rgba(255, 200, 110, 0.9) 0, rgba(255, 160, 70, 0.5) 6px, transparent 22px),
      linear-gradient(180deg, transparent, rgba(18, 10, 36, 0.75));
  }

  .content { max-width: 52rem; }

  .eyebrow {
    margin: 0 0 1.25rem;
    font-size: clamp(0.8rem, 1.6vw, 1rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 600;
    color: #ffd9a0;
    text-shadow: 0 1px 8px rgba(18, 10, 36, 0.6);
  }

  h1 {
    margin: 0;
    font-size: clamp(3rem, 11vw, 7.5rem);
    line-height: 0.95;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-wrap: balance;
    text-shadow: 0 2px 24px rgba(18, 10, 36, 0.55), 0 0 60px rgba(255, 170, 80, 0.35);
  }

  .dates {
    margin: 1.75rem 0 0;
    font-size: clamp(1.25rem, 3vw, 1.9rem);
    font-weight: 600;
    text-shadow: 0 1px 12px rgba(18, 10, 36, 0.7);
  }

  .tagline {
    margin: 0.6rem 0 0;
    font-size: clamp(1.05rem, 2.2vw, 1.35rem);
    color: #ffeedd;
    text-shadow: 0 1px 12px rgba(18, 10, 36, 0.7);
  }

  .cta {
    display: inline-block;
    margin-top: 2.5rem;
    padding: 1rem 2.5rem;
    border-radius: 999px;
    background: #ffc274;
    color: #2a1236;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(18, 10, 36, 0.45), 0 0 0 0 rgba(255, 194, 116, 0.6);
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .cta:hover { background: #ffd394; transform: translateY(-2px); }
  .cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
    .cta:hover { transform: none; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="content">
      <p class="eyebrow">Friday – Sunday</p>
      <h1>Lantern Row Night Market</h1>
      <p class="dates">October 17–19</p>
      <p class="tagline">Food, crafts and live music after dark</p>
      <a class="cta" href="#tickets">Get tickets</a>
    </div>
  </header>
</body>
</html>
