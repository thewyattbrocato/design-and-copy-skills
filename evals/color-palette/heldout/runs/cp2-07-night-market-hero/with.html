<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market</title>
<!-- Note: the brief says Friday to Sunday, October 17 to 19. Oct 17-19 falls Fri-Sun in 2025 but Sat-Mon in 2026, so confirm the weekday/date pairing before launch. -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #1a1236;
    color: #fff7ec;
  }

  .hero {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    align-items: center;
    padding: clamp(2rem, 6vw, 5rem) clamp(1.25rem, 6vw, 5rem) clamp(7rem, 16vw, 11rem);
    overflow: hidden;
    /* Stand-in for the photo: a dusk sky, indigo at the top to ember at the horizon */
    background:
      radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255, 170, 70, 0.55), transparent 70%),
      radial-gradient(ellipse 40% 30% at 82% 22%, rgba(255, 120, 150, 0.22), transparent 70%),
      linear-gradient(180deg,
        #140d2e 0%,
        #2a1655 28%,
        #6b2a74 55%,
        #c4476a 76%,
        #f08a4b 92%,
        #ffc46b 100%);
  }

  /* Faint stars in the upper sky */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0 0 45% 0;
    z-index: -2;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.85), transparent),
      radial-gradient(1px 1px at 27% 8%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 41% 24%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 58% 12%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.5px 1.5px at 73% 6%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 89% 16%, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 6% 36%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 94% 34%, rgba(255,255,255,.5), transparent);
  }

  /* Soft scrim behind the text so it stays readable once a real photo replaces the gradient */
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(90deg, rgba(20, 13, 46, 0.55) 0%, rgba(20, 13, 46, 0.15) 60%, transparent 100%);
  }

  /* Horizon: a row of glowing lanterns above a dark stall silhouette */
  .lanterns {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: clamp(5rem, 14vw, 9rem);
    z-index: -1;
    pointer-events: none;
  }
  .lanterns::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 8% 30%, #ffd37a 0 5px, rgba(255,170,70,.45) 6px, transparent 28px),
      radial-gradient(circle at 21% 55%, #ffb25c 0 5px, rgba(255,130,70,.45) 6px, transparent 28px),
      radial-gradient(circle at 35% 25%, #ffd37a 0 5px, rgba(255,170,70,.45) 6px, transparent 28px),
      radial-gradient(circle at 49% 50%, #ff9a5c 0 5px, rgba(255,110,90,.45) 6px, transparent 28px),
      radial-gradient(circle at 63% 28%, #ffd37a 0 5px, rgba(255,170,70,.45) 6px, transparent 28px),
      radial-gradient(circle at 77% 55%, #ffb25c 0 5px, rgba(255,130,70,.45) 6px, transparent 28px),
      radial-gradient(circle at 91% 30%, #ffd37a 0 5px, rgba(255,170,70,.45) 6px, transparent 28px);
  }
  .lanterns::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 55%;
    background: #120a26;
    clip-path: polygon(
      0 60%, 6% 60%, 9% 25%, 12% 60%, 20% 60%, 23% 35%, 26% 60%,
      36% 60%, 39% 15%, 42% 60%, 52% 60%, 55% 30%, 58% 60%,
      68% 60%, 71% 20%, 74% 60%, 84% 60%, 87% 35%, 90% 60%,
      100% 60%, 100% 100%, 0 100%);
  }

  .content {
    max-width: 62rem;
    width: 100%;
    margin: 0 auto;
  }

  .eyebrow {
    margin: 0 0 1.25rem;
    font-size: clamp(0.8rem, 1.6vw, 1rem);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #ffd37a;
  }

  h1 {
    margin: 0;
    font-size: clamp(3.25rem, 11vw, 8.5rem);
    line-height: 0.95;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-wrap: balance;
    text-shadow: 0 2px 30px rgba(20, 13, 46, 0.55);
  }
  h1 span {
    display: block;
    color: #ffc46b;
  }

  .tagline {
    margin: clamp(1.25rem, 3vw, 2rem) 0 0;
    max-width: 30ch;
    font-size: clamp(1.2rem, 2.8vw, 1.9rem);
    line-height: 1.35;
    text-shadow: 0 1px 14px rgba(20, 13, 46, 0.6);
  }

  .actions {
    margin-top: clamp(1.75rem, 4vw, 2.75rem);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem 1.75rem;
  }

  .btn {
    display: inline-block;
    padding: 1rem 2.1rem;
    border-radius: 999px;
    background: #ffc46b;
    color: #1a1236;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-decoration: none;
    box-shadow: 0 8px 28px rgba(255, 170, 70, 0.4);
    transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { background: #ffd48a; transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 170, 70, 0.5); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

  .dates {
    margin: 0;
    font-size: clamp(1rem, 2vw, 1.25rem);
    font-weight: 600;
    line-height: 1.3;
  }
  .dates small {
    display: block;
    margin-top: 0.2rem;
    font-size: 0.85em;
    font-weight: 500;
    color: #ffe2bd;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="content">
      <p class="eyebrow">Friday – Sunday &middot; October 17–19</p>
      <h1>Lantern Row <span>Night Market</span></h1>
      <p class="tagline">Food, crafts and live music after dark.</p>
      <div class="actions">
        <a class="btn" href="#tickets">Get tickets</a>
        <p class="dates">Oct 17 – 19<small>Three nights, lanterns lit at dusk</small></p>
      </div>
    </div>
    <div class="lanterns" aria-hidden="true"></div>
  </header>
</body>
</html>
