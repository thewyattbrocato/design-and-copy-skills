<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market</title>
<!-- Note: Oct 17-19 falls Fri-Sun in 2025 but Sat-Mon in 2026, so no year is shown. Check the dates before launch. -->
<style>
  :root {
    --ink: #fff8ee;
    --amber: #ffb347;
    --amber-deep: #ff8a3d;
    --night: #140f2e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--night);
    color: var(--ink);
  }

  .hero {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    overflow: hidden;
    padding: clamp(24px, 6vw, 96px);
    /* Fake dusk sky: deep indigo to plum to rose to ember at the horizon */
    background:
      radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255, 170, 80, .75), transparent 70%),
      radial-gradient(ellipse 120% 60% at 50% 105%, rgba(255, 110, 90, .55), transparent 70%),
      linear-gradient(180deg,
        #120d2b 0%,
        #231650 28%,
        #4a1f63 52%,
        #9b3a6b 74%,
        #e0605a 90%,
        #ff9a55 100%);
  }

  /* Faint stars in the upper sky */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0 0 45% 0;
    z-index: -2;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 20%, #fff, transparent),
      radial-gradient(1px 1px at 28% 12%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 44% 30%, #fff, transparent),
      radial-gradient(1px 1px at 63% 16%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 26%, #fff, transparent),
      radial-gradient(1px 1px at 90% 10%, #fff, transparent),
      radial-gradient(1px 1px at 8% 44%, #fff, transparent),
      radial-gradient(1px 1px at 55% 6%, #fff, transparent);
    opacity: .7;
  }

  /* Lantern glows and a dark horizon band of stalls */
  .glow {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 12% 78%, rgba(255, 190, 90, .55) 0, transparent 9%),
      radial-gradient(circle at 26% 84%, rgba(255, 120, 80, .5) 0, transparent 8%),
      radial-gradient(circle at 41% 80%, rgba(255, 200, 110, .5) 0, transparent 7%),
      radial-gradient(circle at 58% 85%, rgba(255, 140, 90, .55) 0, transparent 9%),
      radial-gradient(circle at 73% 79%, rgba(255, 190, 90, .5) 0, transparent 8%),
      radial-gradient(circle at 88% 84%, rgba(255, 120, 80, .5) 0, transparent 9%),
      linear-gradient(0deg, rgba(20, 10, 35, .85) 0, rgba(20, 10, 35, .85) 7%, transparent 7.2%);
  }

  /* Scrim to keep text readable over the lighter lower sky */
  .scrim {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(90deg, rgba(14, 9, 34, .55) 0%, rgba(14, 9, 34, .2) 55%, transparent 80%);
  }

  .content {
    max-width: 52rem;
    position: relative;
    margin-bottom: 6vh;
  }

  .eyebrow {
    display: inline-block;
    font-size: clamp(.8rem, 1.6vw, .95rem);
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 1.2rem;
  }

  h1 {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(3.2rem, 11vw, 8.5rem);
    line-height: .95;
    letter-spacing: -.02em;
    text-shadow: 0 2px 30px rgba(20, 10, 40, .55), 0 0 60px rgba(255, 170, 80, .25);
  }
  h1 span {
    display: block;
    font-size: .46em;
    font-weight: 500;
    font-style: italic;
    letter-spacing: .01em;
    color: #ffd9a0;
    margin-top: .15em;
  }

  .dates {
    margin-top: 1.8rem;
    font-size: clamp(1.2rem, 3vw, 1.75rem);
    font-weight: 600;
    text-shadow: 0 1px 14px rgba(20, 10, 40, .7);
  }
  .dates small {
    display: block;
    margin-top: .2rem;
    font-size: .7em;
    font-weight: 500;
    opacity: .9;
    letter-spacing: .04em;
  }

  .tagline {
    margin-top: 1rem;
    max-width: 30rem;
    font-size: clamp(1.05rem, 2.2vw, 1.3rem);
    line-height: 1.5;
    text-shadow: 0 1px 14px rgba(20, 10, 40, .7);
  }

  .cta {
    display: inline-block;
    margin-top: 2.2rem;
    padding: 1rem 2.2rem;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--amber), var(--amber-deep));
    color: #2a1200;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 6px 28px rgba(255, 150, 60, .45), inset 0 1px 0 rgba(255, 255, 255, .5);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(255, 150, 60, .6), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

  @media (max-width: 600px) {
    .scrim { background: linear-gradient(180deg, rgba(14, 9, 34, .45), rgba(14, 9, 34, .25) 70%, transparent); }
    .cta { display: block; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="glow" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>
    <div class="content">
      <span class="eyebrow">Open after dark</span>
      <h1>Lantern Row <span>Night Market</span></h1>
      <p class="dates">Friday to Sunday, October 17&ndash;19</p>
      <p class="tagline">Food, crafts and live music after dark.</p>
      <a class="cta" href="#tickets">Get tickets</a>
    </div>
  </header>
</body>
</html>
