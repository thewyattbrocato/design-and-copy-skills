<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour Street Family Clinic – Welcome</title>
<style>
  :root {
    --bg: #0b2a3a;
    --panel: #12394e;
    --text: #ffffff;
    --muted: #b9d3e0;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    cursor: none;
  }
  .stage {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 3vh;
    padding: 5vh 5vw;
  }
  header { text-align: center; }
  h1 {
    font-size: 8.5vh;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 1.1;
  }
  .sub {
    margin-top: 1.5vh;
    font-size: 4vh;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  main {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 3vw;
    min-height: 0;
  }
  .card {
    background: var(--panel);
    border-radius: 2vh;
    padding: 4vh 3vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }
  .label {
    font-size: 3.6vh;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 3vh;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 2vw;
    padding: 2vh 1.5vw;
    border-radius: 1.2vh;
    font-size: 6vh;
    font-weight: 600;
  }
  .row .time { font-weight: 800; white-space: nowrap; }
  .row.today {
    background: var(--accent);
    color: #0b2a3a;
  }
  .today-note {
    margin-top: 3vh;
    font-size: 4.2vh;
    color: var(--muted);
    min-height: 5vh;
  }
  .today-note strong { color: var(--text); }
  .flu .big {
    font-size: 9vh;
    font-weight: 800;
    line-height: 1.1;
  }
  .flu .big span { color: var(--accent); }
  .flu p {
    margin-top: 3vh;
    font-size: 4.6vh;
    color: var(--muted);
    line-height: 1.3;
  }
  footer {
    background: var(--accent);
    color: #0b2a3a;
    border-radius: 2vh;
    text-align: center;
    padding: 3.5vh 3vw;
    font-size: 7vh;
    font-weight: 800;
    line-height: 1.15;
  }
</style>
</head>
<body>
  <div class="stage">
    <header>
      <h1>Harbour Street Family Clinic</h1>
      <div class="sub">Welcome</div>
    </header>

    <main>
      <section class="card" aria-label="Walk-in hours">
        <div class="label">Walk-in Hours</div>
        <div class="row" id="row-weekday"><span>Monday – Friday</span><span class="time">8:00 – 18:00</span></div>
        <div class="row" id="row-sat"><span>Saturday</span><span class="time">9:00 – 13:00</span></div>
        <div class="today-note" id="today-note"></div>
      </section>

      <section class="card flu" aria-label="Flu clinic">
        <div class="label">Flu Clinic</div>
        <div class="big">Flu clinic is on <span>Level 2</span></div>
        <p>Please use the lift or stairs to Level 2.</p>
      </section>
    </main>

    <footer id="message" aria-live="polite">Please check in at the desk</footer>
  </div>

<script>
  // Highlight today's hours (day taken from the TV's clock).
  (function () {
    var d = new Date().getDay(); // 0 = Sun
    var note = document.getElementById("today-note");
    if (d >= 1 && d <= 5) {
      document.getElementById("row-weekday").classList.add("today");
      note.innerHTML = "<strong>Today:</strong> 8:00 – 18:00";
    } else if (d === 6) {
      document.getElementById("row-sat").classList.add("today");
      note.innerHTML = "<strong>Today:</strong> 9:00 – 13:00";
    }
  })();
</script>
</body>
</html>
