<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnside Ceramics</title>
<style>
  :root {
    --clay: #b5502f;
    --clay-dark: #8a3a20;
    --cream: #f6eddf;
    --ink: #2a1a12;
    --sage: #8c9a7b;
    --sun: #e3a64a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(7rem, 24vw, 40rem);
    grid-template-rows: auto 1fr;
    gap: 0 clamp(1.25rem, 3vw, 4rem);
    padding: clamp(1.25rem, 3vw, 4rem);
    max-width: 2400px;
    margin: 0 auto;
  }
  .eyebrow {
    grid-column: 1 / -1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: clamp(0.75rem, 1vw, 1.25rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--clay-dark);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: clamp(0.75rem, 1.5vw, 2rem);
    border-bottom: 2px solid var(--ink);
  }
  h1 {
    grid-column: 1 / -1;
    grid-row: 2;
    align-self: start;
    font-size: clamp(3.25rem, 15.5vw, 23rem);
    line-height: 0.88;
    letter-spacing: -0.04em;
    font-weight: 900;
    text-transform: uppercase;
    color: var(--clay);
    margin-top: clamp(1rem, 2vw, 3rem);
    position: relative;
    z-index: 2;
    overflow-wrap: normal;
  }
  h1 span { display: block; }
  .content {
    grid-column: 1;
    grid-row: 2;
    align-self: end;
    position: relative;
    z-index: 2;
    max-width: 42rem;
    padding-top: 2rem;
  }
  p.line {
    font-size: clamp(1.25rem, 2.4vw, 3rem);
    line-height: 1.25;
    font-style: italic;
    margin-bottom: clamp(1.25rem, 2vw, 2.5rem);
  }
  .btn {
    display: inline-block;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: clamp(1rem, 1.4vw, 1.9rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-decoration: none;
    color: var(--cream);
    background: var(--ink);
    padding: 1em 2em;
    border-radius: 999px;
    border: 2px solid var(--ink);
    transition: background .2s, color .2s, transform .2s;
  }
  .btn:hover { background: var(--clay); border-color: var(--clay); transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 4px; }

  .art {
    grid-column: 2;
    grid-row: 2;
    position: relative;
    margin-top: clamp(1rem, 2vw, 3rem);
    min-height: 16rem;
    border-radius: 999px 999px 0 0;
    background:
      radial-gradient(circle at 50% 78%, var(--sun) 0 18%, transparent 18.5%),
      linear-gradient(to bottom, var(--sage) 0 38%, var(--clay-dark) 38% 70%, var(--ink) 70%);
    overflow: hidden;
    z-index: 1;
  }
  .art::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0 14px, rgba(246,237,223,.14) 14px 16px);
  }

  @media (max-width: 640px) {
    .hero {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto;
    }
    h1 { font-size: 19vw; grid-row: 2; }
    .art {
      grid-column: 1; grid-row: 3;
      min-height: 0; height: 9rem;
      border-radius: 999px 999px 0 0;
      margin: 1.5rem 0;
    }
    .content { grid-row: 4; padding-top: 0; }
    .eyebrow span:last-child { display: none; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="eyebrow"><span>Handmade pottery studio</span><span>Classes · Open studio · Kiln firing</span></div>
    <h1><span>Kilnside</span><span>Ceramics</span></h1>
    <div class="content">
      <p class="line">Get your hands in the clay and make something that lasts.</p>
      <a class="btn" href="#book">Book a class</a>
    </div>
    <div class="art" aria-hidden="true"></div>
  </main>
</body>
</html>
