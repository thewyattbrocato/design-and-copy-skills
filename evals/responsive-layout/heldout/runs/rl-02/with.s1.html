<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnside Ceramics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --cream: #f6efe4;
    --ink: #2b1d16;
    --clay: #c4513a;
    --glaze: #2f6f6a;
    --straw: #e3a73b;
    --pad: clamp(1.25rem, 4vw, 4rem);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
  }

  .hero {
    min-height: 100vh;
    min-height: 100svh;
    max-width: 110rem;
    margin: 0 auto;
    padding: var(--pad);
    padding-top: max(var(--pad), env(safe-area-inset-top));
    padding-bottom: max(var(--pad), env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.55fr);
    grid-template-rows: auto 1fr;
    gap: clamp(1.5rem, 3vw, 3rem) var(--pad);
  }

  h1 {
    grid-column: 1 / -1;
    margin: 0;
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 900;
    font-size: clamp(3rem, min(17vw, 26vh), 14rem);
    line-height: 0.88;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    overflow-wrap: anywhere;
    color: var(--ink);
  }
  h1 span { display: block; }
  h1 span + span { color: var(--clay); }

  .copy {
    align-self: end;
    max-width: 38rem;
  }

  .copy p {
    margin: 0 0 1.75rem;
    font-size: clamp(1.15rem, 1rem + 0.9vw, 2rem);
    line-height: 1.3;
  }

  .btn {
    display: inline-block;
    padding: 1em 2em;
    background: var(--ink);
    color: var(--cream);
    font-size: clamp(1rem, 0.9rem + 0.4vw, 1.4rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 999px;
    border: 2px solid var(--ink);
    transition: background-color 0.2s, color 0.2s;
  }
  .btn:hover { background: var(--clay); border-color: var(--clay); color: #fff; }
  .btn:focus-visible { outline: 3px solid var(--glaze); outline-offset: 4px; }

  .art {
    position: relative;
    overflow: hidden;
    min-height: 14rem;
    background: var(--clay);
    border-radius: 1.5rem;
  }
  .art::before { /* arch, like a kiln mouth */
    content: "";
    position: absolute;
    left: 14%; right: 14%; bottom: 0;
    height: 78%;
    background: var(--glaze);
    border-radius: 999px 999px 0 0;
  }
  .art::after { /* sun / glazed bowl */
    content: "";
    position: absolute;
    width: 34%;
    aspect-ratio: 1;
    left: 33%;
    top: 14%;
    background: var(--straw);
    border-radius: 50%;
    box-shadow: 0 0 0 0.9rem rgba(246, 239, 228, 0.25);
  }

  @media (max-width: 48rem) {
    .hero {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto auto;
    }
    h1 { font-size: clamp(2.75rem, 19vw, 9rem); }
    .art { min-height: 0; height: clamp(11rem, 50vw, 20rem); }
  }
</style>
</head>
<body>
  <main class="hero">
    <h1><span>Kilnside</span><span>Ceramics</span></h1>

    <div class="copy">
      <p>Hand-built pots, shared tables, and a warm kiln down the lane.</p>
      <a class="btn" href="#book">Book a class</a>
    </div>

    <div class="art" aria-hidden="true"></div>
  </main>
</body>
</html>
