<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnside Ceramics — Pottery classes</title>
<meta name="description" content="Kilnside Ceramics is a pottery studio. Book a class and get your hands in clay.">
<style>
  :root {
    --cream: #f5ecdf;
    --ink: #2a1c15;
    --clay: #c2552d;
    --glaze: #2e6d68;
    --ochre: #e2a63b;
    --blush: #e8b9a0;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--sans);
  }

  .hero {
    min-height: 100vh;
    min-height: 100svh;
    max-width: 2200px;
    margin: 0 auto;
    padding:
      max(clamp(1.25rem, 3.5vw, 4rem), env(safe-area-inset-top))
      max(clamp(1.25rem, 4vw, 5rem), env(safe-area-inset-right))
      max(clamp(1.25rem, 3.5vw, 4rem), env(safe-area-inset-bottom))
      max(clamp(1.25rem, 4vw, 5rem), env(safe-area-inset-left));
    display: grid;
    grid-template-rows: auto 1fr;
    gap: clamp(1.5rem, 3vw, 4rem);
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(2.75rem, min(17vw, 24vh), 22rem);
    line-height: 0.88;
    letter-spacing: -0.035em;
    text-transform: uppercase;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  h1 span { display: block; }
  h1 .second { color: var(--clay); }

  .lower {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: clamp(1.5rem, 4vw, 6rem);
    align-items: stretch;
    min-height: 0;
  }

  .copy {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    gap: clamp(1.25rem, 2.5vw, 2.5rem);
    padding-bottom: 0.25rem;
  }

  .tagline {
    margin: 0;
    max-width: 22ch;
    font-family: var(--serif);
    font-size: clamp(1.4rem, 2.8vw, 3.5rem);
    line-height: 1.2;
    font-weight: 500;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.75em;
    min-height: 3.25rem;
    padding: 0.9em 1.9em;
    background: var(--ink);
    color: var(--cream);
    font-family: var(--sans);
    font-size: clamp(1.05rem, 1.5vw, 1.9rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    text-decoration: none;
    border-radius: 999px;
    border: 3px solid var(--ink);
    transition: background-color .2s ease, color .2s ease, transform .2s ease;
  }
  .btn .arrow { transition: transform .2s ease; }
  .btn:hover { background: var(--clay); border-color: var(--clay); color: #fff; }
  .btn:hover .arrow { transform: translateX(4px); }
  .btn:focus-visible { outline: 4px solid var(--glaze); outline-offset: 4px; }
  .btn:active { transform: translateY(1px); }

  /* Decorative color block */
  .block {
    position: relative;
    overflow: hidden;
    min-height: 14rem;
    background: var(--clay);
    border-radius: 999px 999px 0 0;
    isolation: isolate;
  }
  .block::before { /* glaze bands */
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(var(--glaze) 0 0) 0 62% / 100% 12% no-repeat,
      linear-gradient(var(--ochre) 0 0) 0 78% / 100% 6% no-repeat,
      linear-gradient(var(--blush) 0 0) 0 88% / 100% 3% no-repeat;
    z-index: -1;
  }
  .block::after { /* sun / kiln glow */
    content: "";
    position: absolute;
    width: 46%;
    aspect-ratio: 1;
    left: 27%;
    top: 22%;
    border-radius: 50%;
    background: var(--ochre);
    box-shadow: 0 0 0 clamp(10px, 2vw, 32px) rgba(245, 236, 223, .22);
    z-index: -1;
  }

  @media (max-width: 700px) {
    .lower { grid-template-columns: 1fr; }
    .copy { justify-content: flex-start; }
    .block {
      order: 2;
      min-height: 0;
      height: clamp(11rem, 48vw, 18rem);
      border-radius: 999px 999px 0 0;
    }
  }

  /* Short landscape screens: keep everything on one view */
  @media (max-height: 520px) and (min-width: 701px) {
    .hero { gap: 1rem; }
    .tagline { font-size: clamp(1.1rem, 2.4vw, 1.6rem); }
    .block { min-height: 6rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .btn .arrow { transition: none; }
  }
</style>
</head>
<body>
  <main class="hero">
    <h1><span>Kilnside</span><span class="second">Ceramics</span></h1>

    <div class="lower">
      <div class="copy">
        <p class="tagline">Wheel, hand-build, glaze, and fire. Come make something real.</p>
        <a class="btn" href="#book">Book a class <span class="arrow" aria-hidden="true">→</span></a>
      </div>
      <div class="block" aria-hidden="true"></div>
    </div>
  </main>
</body>
</html>
