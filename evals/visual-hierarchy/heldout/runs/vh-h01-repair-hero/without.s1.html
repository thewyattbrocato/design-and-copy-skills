<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern &amp; Wick — Don't bin it. Bring it in.</title>
<meta name="description" content="Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.">
<style>
  :root {
    --bg: #f6f0e4;
    --ink: #23201b;
    --muted: #5d564b;
    --accent: #c4471d;
    --accent-dark: #9e3414;
    --teal: #1f5d57;
    --line: #d9cfba;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px;
  }
  header { padding: 22px 0; }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: .01em;
    color: var(--ink);
    text-decoration: none;
  }
  .brand svg { width: 30px; height: 30px; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 24px 0 40px;
  }
  .hero {
    display: grid;
    grid-template-columns: 1.25fr .75fr;
    gap: 48px;
    align-items: center;
  }
  h1 {
    margin: 0 0 20px;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 5rem);
    line-height: 1.02;
    letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); display: block; }
  .lead {
    margin: 0 0 32px;
    max-width: 34ch;
    font-size: clamp(1.1rem, 2.2vw, 1.35rem);
    color: var(--muted);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px 28px;
  }
  .btn {
    display: inline-block;
    padding: 16px 30px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.1rem;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 2px 0 var(--accent-dark);
    transition: background .15s, transform .15s;
  }
  .btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .text-link {
    color: var(--teal);
    font-weight: 600;
    font-size: 1.05rem;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
  }
  .text-link:hover { color: var(--ink); }
  a:focus-visible {
    outline: 3px solid var(--teal);
    outline-offset: 4px;
    border-radius: 6px;
  }
  .art { display: flex; justify-content: center; }
  .art svg { width: 100%; max-width: 340px; height: auto; }
  footer {
    border-top: 1px solid var(--line);
    padding: 18px 0 22px;
    color: var(--muted);
    font-size: .95rem;
  }
  footer strong { color: var(--ink); }
  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; gap: 32px; }
    .art { order: -1; }
    .art svg { max-width: 190px; }
    main { align-items: flex-start; padding-top: 8px; }
    .btn { width: 100%; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/" aria-label="Tern &amp; Wick home">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#1f5d57"/>
          <path d="M9 21c3-1 5-4 7-9 2 5 4 8 7 9" fill="none" stroke="#f6f0e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="9" r="2" fill="#f6f0e4"/>
        </svg>
        Tern &amp; Wick
      </a>
    </div>
  </header>

  <main>
    <div class="wrap hero">
      <div>
        <h1>Don't bin it. <span>Bring it in.</span></h1>
        <p class="lead">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>
        <div class="actions">
          <a class="btn" href="/book">Book a slot</a>
          <a class="text-link" href="/how-it-works">How a repair cafe works</a>
        </div>
      </div>
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 340 340">
          <circle cx="170" cy="170" r="160" fill="#eadfc6"/>
          <!-- lamp -->
          <path d="M120 120l50-60 50 60z" fill="#e0a526"/>
          <rect x="165" y="120" width="10" height="110" fill="#23201b"/>
          <ellipse cx="170" cy="240" rx="48" ry="10" fill="#23201b"/>
          <path d="M150 128l-12 40M190 128l12 40" stroke="#f6d77a" stroke-width="4" stroke-linecap="round"/>
          <!-- wrench -->
          <g transform="rotate(-35 250 250)">
            <rect x="244" y="210" width="12" height="90" rx="6" fill="#1f5d57"/>
            <path d="M236 214v-24a20 20 0 0 1 40 0v24h-12v-14h-16v14z" fill="#1f5d57"/>
          </g>
          <!-- tea cup -->
          <path d="M70 250h64v18a28 28 0 0 1-28 28h-8a28 28 0 0 1-28-28z" fill="#c4471d"/>
          <path d="M134 258h8a10 10 0 0 1 0 22h-10" fill="none" stroke="#c4471d" stroke-width="6"/>
          <path d="M92 236c-6-8 6-12 0-20M112 236c-6-8 6-12 0-20" fill="none" stroke="#9a8f78" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <strong>214</strong> cafes in <strong>9</strong> countries, <strong>41,000</strong> things fixed
    </div>
  </footer>
</body>
</html>
