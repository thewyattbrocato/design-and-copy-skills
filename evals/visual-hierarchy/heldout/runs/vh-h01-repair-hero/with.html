<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern &amp; Wick – Book a repair cafe slot</title>
<style>
  :root {
    --paper: #faf5ec;
    --ink: #1f2a26;
    --muted: #55605b;
    --accent: #b8431f;
    --accent-dark: #8f3216;
    --line: #d9cfbd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 28px clamp(24px, 6vw, 96px);
  }
  .brand {
    font-weight: 700;
    font-size: 1.125rem;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-decoration: none;
  }
  .brand span { color: var(--accent); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px clamp(24px, 6vw, 96px) 48px;
    max-width: 1100px;
  }
  h1 {
    margin: 0;
    font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 800;
    font-size: clamp(2.75rem, 9vw, 6.25rem);
    line-height: 1;
    letter-spacing: -0.025em;
    max-width: 11ch;
  }
  .lede {
    margin: 28px 0 0;
    font-size: clamp(1.125rem, 2.2vw, 1.375rem);
    color: var(--muted);
    max-width: 34em;
  }
  .actions {
    margin-top: 40px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px 32px;
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 1.125rem;
    padding: 16px 32px;
    border-radius: 999px;
    text-decoration: none;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent-dark); }
  .link {
    color: var(--ink);
    font-weight: 600;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
    text-decoration-color: var(--line);
  }
  .link:hover { text-decoration-color: var(--accent); }
  .btn:focus-visible, .link:focus-visible, .brand:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 4px;
  }
  footer {
    padding: 20px clamp(24px, 6vw, 96px) 28px;
    border-top: 1px solid var(--line);
    font-size: 0.9375rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <header>
    <a class="brand" href="#">Tern <span>&amp;</span> Wick</a>
  </header>

  <main>
    <h1>Don't bin it. Bring it in.</h1>
    <p class="lede">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>
    <div class="actions">
      <a class="btn" href="#book">Book a slot</a>
      <a class="link" href="#how-it-works">How a repair cafe works</a>
    </div>
  </main>

  <footer>214 cafes in 9 countries, 41,000 things fixed</footer>
</body>
</html>
