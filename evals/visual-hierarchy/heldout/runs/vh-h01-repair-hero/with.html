<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern &amp; Wick: Don't bin it. Bring it in.</title>
<meta name="description" content="Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.">
<style>
  :root {
    --paper: #faf4e8;
    --ink: #2b2420;
    --muted: #6a5f55;
    --accent: #1d5a52;
    --accent-dark: #154740;
    --warm: #e9a23b;
    --line: #e2d7c3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-rounded, "Avenir Next", Avenir, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 48px);
  }
  header { padding-top: clamp(20px, 4vw, 36px); }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-decoration: none;
  }
  .brand svg { display: block; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: clamp(32px, 7vw, 72px) 0;
  }
  main .wrap {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr);
    gap: clamp(24px, 5vw, 64px);
    align-items: center;
  }
  h1 {
    margin: 0;
    font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7.2vw, 5.2rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1 span {
    display: block;
    color: var(--accent);
  }
  .sub {
    margin: clamp(18px, 3vw, 28px) 0 0;
    max-width: 30em;
    font-size: clamp(1.1rem, 2.2vw, 1.35rem);
    color: var(--muted);
    text-wrap: pretty;
  }
  .actions {
    margin-top: clamp(26px, 4vw, 38px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 28px;
  }
  .btn {
    display: inline-block;
    padding: 16px 30px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 2px 0 var(--accent-dark);
    transition: background 0.15s, transform 0.15s;
  }
  .btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .link {
    color: var(--ink);
    font-weight: 600;
    text-decoration: underline;
    text-decoration-color: var(--warm);
    text-decoration-thickness: 3px;
    text-underline-offset: 5px;
  }
  .link:hover { text-decoration-color: var(--ink); }
  .btn:focus-visible, .link:focus-visible, .brand:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 4px;
    border-radius: 6px;
  }
  .btn:focus-visible { border-radius: 999px; }

  .art { justify-self: center; width: 100%; max-width: 340px; }
  .art svg { width: 100%; height: auto; display: block; }

  footer {
    border-top: 1px solid var(--line);
    padding: 18px 0 22px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  footer strong { color: var(--ink); font-weight: 700; }

  @media (max-width: 760px) {
    main .wrap { grid-template-columns: 1fr; }
    .art { max-width: 200px; justify-self: start; order: -1; }
    main { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/" aria-label="Tern &amp; Wick home">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="14" fill="#1d5a52"/>
          <path d="M14 6c2 3 3 5 3 7.5a3 3 0 0 1-6 0C11 11 12.500 9 14 6z" fill="#e9a23b"/>
          <rect x="12.800" y="16" width="2.400" height="6" rx="1.200" fill="#faf4e8"/>
        </svg>
        Tern &amp; Wick
      </a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div>
        <h1>Don't bin it. <span>Bring it in.</span></h1>
        <p class="sub">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>
        <div class="actions">
          <a class="btn" href="#book">Book a slot</a>
          <a class="link" href="#how-it-works">How a repair cafe works</a>
        </div>
      </div>

      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 340 340" role="img" focusable="false">
          <circle cx="170" cy="170" r="160" fill="#f1e5cc"/>
          <!-- lamp -->
          <path d="M120 120 L220 120 L246 190 L94 190 Z" fill="#e9a23b"/>
          <path d="M120 120 L220 120 L228 142 L112 142 Z" fill="#f2bb5f"/>
          <rect x="164" y="190" width="12" height="62" fill="#2b2420"/>
          <ellipse cx="170" cy="258" rx="48" ry="10" fill="#2b2420"/>
          <!-- stitches -->
          <g stroke="#2b2420" stroke-width="4" stroke-linecap="round">
            <path d="M138 160 l8 0"/><path d="M158 160 l8 0"/><path d="M178 160 l8 0"/><path d="M198 160 l8 0"/>
          </g>
          <!-- spark of repair -->
          <g fill="#1d5a52">
            <path d="M262 82 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
            <path d="M82 224 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
          </g>
          <!-- tea steam -->
          <path d="M72 120 q-10 -14 0 -26 q10 -12 0 -24" fill="none" stroke="#1d5a52" stroke-width="4" stroke-linecap="round" opacity=".55"/>
        </svg>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <strong>214</strong> cafes in <strong>9</strong> countries, <strong>41,000</strong> things fixed
    </div>
  </footer>
</body>
</html>
