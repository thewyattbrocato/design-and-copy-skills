<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern & Wick – Book a community repair cafe</title>
<meta name="description" content="Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.">
<style>
  :root {
    --bg: #f6f0e4;
    --ink: #22302b;
    --muted: #4f5d56;
    --accent: #c4501f;
    --accent-dark: #9f3d14;
    --green: #2f5d4c;
    --line: #d9cfba;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(20px, 5vw, 56px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-decoration: none;
  }
  .brand svg { width: 28px; height: 28px; }
  nav a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    padding: 8px 4px;
  }
  nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    align-items: center;
    gap: clamp(24px, 5vw, 72px);
    padding: clamp(16px, 4vw, 48px) clamp(20px, 5vw, 56px);
    max-width: 1180px;
    width: 100%;
    margin: 0 auto;
  }
  .eyebrow {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--green);
    margin: 0 0 16px;
  }
  h1 {
    font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: clamp(2.6rem, 7vw, 5rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 20px;
  }
  h1 span { color: var(--accent); display: block; }
  .sub {
    font-size: clamp(1.1rem, 2vw, 1.3rem);
    color: var(--muted);
    max-width: 32em;
    margin: 0 0 32px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px 28px;
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 16px 30px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 3px 0 var(--accent-dark);
    transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }
  .link {
    color: var(--green);
    font-weight: 600;
    font-size: 1.05rem;
    text-underline-offset: 5px;
    text-decoration-thickness: 2px;
  }
  .link:hover { color: var(--ink); }
  a:focus-visible {
    outline: 3px solid var(--green);
    outline-offset: 3px;
    border-radius: 6px;
  }
  .art {
    display: flex;
    justify-content: center;
  }
  .art svg {
    width: 100%;
    max-width: 380px;
    height: auto;
  }
  footer {
    padding: 20px clamp(20px, 5vw, 56px) 28px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.95rem;
    color: var(--muted);
  }
  footer strong { color: var(--ink); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; align-content: center; }
    .art { order: -1; }
    .art svg { max-width: 190px; }
    .btn { width: 100%; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Tern & Wick home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="#2f5d4c"/>
        <path d="M9 21c3-1 5-4 7-10 2 6 4 9 7 10" fill="none" stroke="#f6f0e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="8.5" r="1.8" fill="#e8a33d"/>
      </svg>
      Tern &amp; Wick
    </a>
    <nav><a href="/cafes">Find a cafe</a></nav>
  </header>

  <main>
    <section>
      <p class="eyebrow">Community repair cafes</p>
      <h1>Don't bin it. <span>Bring it in.</span></h1>
      <p class="sub">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>
      <div class="actions">
        <a class="btn" href="/book">Book a slot</a>
        <a class="link" href="/how-it-works">How a repair cafe works</a>
      </div>
    </section>

    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 380 340">
        <ellipse cx="190" cy="308" rx="150" ry="14" fill="#e6dcc6"/>
        <!-- lamp -->
        <path d="M110 120l36-70h56l36 70z" fill="#e8a33d"/>
        <rect x="172" y="120" width="12" height="150" rx="5" fill="#2f5d4c" transform="translate(12 0)"/>
        <rect x="140" y="270" width="80" height="16" rx="8" fill="#2f5d4c" transform="translate(14 0)"/>
        <path d="M200 52v-22" stroke="#22302b" stroke-width="4" stroke-linecap="round"/>
        <!-- toaster -->
        <rect x="40" y="226" width="110" height="68" rx="18" fill="#c4501f"/>
        <rect x="58" y="214" width="74" height="14" rx="6" fill="#22302b"/>
        <circle cx="128" cy="262" r="7" fill="#f6f0e4"/>
        <!-- wrench -->
        <g transform="rotate(35 290 220)">
          <rect x="282" y="150" width="16" height="140" rx="8" fill="#22302b"/>
          <path d="M270 150a20 20 0 1 1 40 0v-18h-10v10h-20v-10h-10z" fill="#22302b"/>
        </g>
        <!-- steam -->
        <path d="M80 196c-8-10 8-16 0-26M104 196c-8-10 8-16 0-26" fill="none" stroke="#2f5d4c" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
  </main>

  <footer>
    <strong>214</strong> cafes in <strong>9</strong> countries, <strong>41,000</strong> things fixed
  </footer>
</body>
</html>
