<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern &amp; Wick: Book a repair cafe slot</title>
<style>
  :root {
    --paper: #f7f3ec;
    --ink: #1f2a26;
    --muted: #55625d;
    --accent: #2f6b4f;
    --accent-ink: #ffffff;
    --line: #d9d1c4;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--line);
  }

  .wordmark {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration: none;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
  }

  .hero {
    max-width: 640px;
    text-align: center;
  }

  h1 {
    margin: 0 0 20px;
    font-size: clamp(2.25rem, 6vw, 3.5rem);
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .lede {
    margin: 0 auto 36px;
    max-width: 30ch;
    font-size: clamp(1.05rem, 2.4vw, 1.25rem);
    color: var(--muted);
  }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .btn-primary {
    display: inline-block;
    padding: 16px 32px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1.05rem;
    font-weight: 700;
    text-decoration: none;
  }

  .btn-primary:hover { background: #265741; }

  .btn-primary:focus-visible,
  .secondary:focus-visible,
  .wordmark:focus-visible {
    outline: 3px solid #1a4fa0;
    outline-offset: 3px;
  }

  .secondary {
    color: var(--accent);
    font-size: 0.98rem;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .secondary:hover { color: #1f4a37; }

  footer {
    padding: 20px 32px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.92rem;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    header, footer { padding-left: 20px; padding-right: 20px; }
    main { padding: 48px 20px; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <a class="wordmark" href="#">Tern &amp; Wick</a>
  </header>

  <main>
    <section class="hero" aria-labelledby="headline">
      <h1 id="headline">Don't bin it. Bring it in.</h1>
      <p class="lede">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>

      <div class="actions">
        <a class="btn-primary" href="#book">Book a slot</a>
        <a class="secondary" href="#how-it-works">How a repair cafe works</a>
      </div>
    </section>
  </main>

  <footer>
    214 cafes in 9 countries, 41,000 things fixed
  </footer>

</div>
</body>
</html>
