<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tern &amp; Wick</title>
  <meta name="description" content="Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.">
  <style>
    :root {
      --paper: #f7f3ea;
      --ink: #2b2a26;
      --muted: #5f5b52;
      --accent: #b5532a;
      --accent-dark: #8f3f1d;
      --rule: #ddd5c3;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.5rem clamp(1.25rem, 5vw, 3rem);
      border-bottom: 1px solid var(--rule);
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.25rem, 5vw, 3rem);
      max-width: 44rem;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 1.25rem;
      font-weight: 800;
    }

    .lede {
      font-size: clamp(1.1rem, 2.4vw, 1.3rem);
      color: var(--muted);
      max-width: 34rem;
      margin: 0 0 2.25rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
    }

    .btn-primary {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 0.9rem 1.6rem;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .btn-primary:hover { background: var(--accent-dark); }

    .btn-primary:focus-visible,
    .secondary:focus-visible,
    .brand:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .secondary {
      color: var(--ink);
      font-weight: 600;
      text-underline-offset: 0.25em;
      text-decoration-thickness: 2px;
      text-decoration-color: var(--accent);
    }

    .secondary:hover { color: var(--accent-dark); }

    footer {
      padding: 1.25rem clamp(1.25rem, 5vw, 3rem);
      border-top: 1px solid var(--rule);
      font-size: 0.95rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-primary { transition: none; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <a class="brand" href="#">Tern &amp; Wick</a>
    </header>

    <main>
      <h1>Don't bin it. Bring it in.</h1>
      <p class="lede">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>

      <div class="actions">
        <a class="btn-primary" href="#book">Book a slot</a>
        <a class="secondary" href="#how-it-works">How a repair cafe works</a>
      </div>
    </main>

    <footer>
      214 cafes in 9 countries, 41,000 things fixed
    </footer>
  </div>
</body>
</html>
