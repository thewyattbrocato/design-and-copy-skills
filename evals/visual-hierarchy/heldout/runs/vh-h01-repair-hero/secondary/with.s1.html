<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tern &amp; Wick | Book a repair cafe slot</title>
  <style>
    :root {
      --paper: #f6f1e7;
      --ink: #1f2a24;
      --muted: #55625a;
      --moss: #2f5d46;
      --moss-dark: #234a37;
      --ember: #c2582b;
      --line: #d9cfbd;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-decoration: none;
    }

    .brand span {
      color: var(--ember);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .hero {
      max-width: 680px;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0 auto 36px;
      max-width: 540px;
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      line-height: 1.5;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .btn-primary {
      display: inline-block;
      padding: 16px 32px;
      background: var(--moss);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 650;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.15s ease;
    }

    .btn-primary:hover { background: var(--moss-dark); }

    .btn-primary:focus-visible,
    .help-link:focus-visible,
    .brand:focus-visible {
      outline: 3px solid var(--ember);
      outline-offset: 3px;
    }

    .help-link {
      color: var(--moss);
      font-size: 0.98rem;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .help-link:hover { color: var(--moss-dark); }

    footer {
      padding: 20px 32px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      header, footer { padding-left: 20px; padding-right: 20px; }
      .btn-primary { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#">Tern <span>&amp;</span> Wick</a>
  </header>

  <main>
    <section class="hero">
      <h1>Don't bin it. Bring it in.</h1>
      <p class="lede">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>
      <div class="actions">
        <a class="btn-primary" href="#book">Book a slot</a>
        <a class="help-link" href="#how-it-works">How a repair cafe works</a>
      </div>
    </section>
  </main>

  <footer>
    214 cafes in 9 countries, 41,000 things fixed
  </footer>
</body>
</html>
