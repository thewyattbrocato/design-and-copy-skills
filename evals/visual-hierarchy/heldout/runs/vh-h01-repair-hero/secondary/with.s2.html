<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tern & Wick: Repair cafés near you</title>
  <style>
    :root {
      --paper: #f6f1e7;
      --ink: #1f2a24;
      --muted: #56625b;
      --accent: #2f6b4f;
      --accent-ink: #ffffff;
      --rule: #d9d0bd;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      font-family: var(--font);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem clamp(1.25rem, 5vw, 3rem);
      border-bottom: 1px solid var(--rule);
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-decoration: none;
    }

    .brand span { color: var(--accent); }

    .site-header nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .site-header nav a:hover { color: var(--ink); text-decoration: underline; }

    .hero {
      min-height: calc(100% - 4.5rem - 3.5rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 44rem;
      padding: 3rem clamp(1.25rem, 5vw, 3rem);
    }

    .eyebrow {
      margin: 0 0 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0 0 2rem;
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      color: var(--muted);
      max-width: 34rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.25rem 1.75rem;
    }

    .btn-primary {
      display: inline-block;
      padding: 0.95rem 1.6rem;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0.5rem;
    }

    .btn-primary:hover { background: #255540; }

    .btn-primary:focus-visible,
    .learn-link:focus-visible,
    .site-header nav a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .learn-link {
      color: var(--ink);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-color: var(--rule);
      text-underline-offset: 0.25em;
      text-decoration-thickness: 2px;
    }

    .learn-link:hover { text-decoration-color: var(--accent); }

    .stats {
      margin: 0;
      padding: 1.25rem clamp(1.25rem, 5vw, 3rem);
      border-top: 1px solid var(--rule);
      font-size: 0.9rem;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      .site-header nav { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#">Tern <span>&amp;</span> Wick</a>
    <nav aria-label="Primary">
      <a href="#how">How it works</a>
    </nav>
  </header>

  <main class="hero">
    <p class="eyebrow">Community repair cafés</p>
    <h1>Don't bin it. Bring it in.</h1>
    <p class="lede">Book a 30-minute slot at a repair café near you. Volunteers, tools and tea are free.</p>

    <div class="actions">
      <a class="btn-primary" href="#book">Book a slot</a>
      <a class="learn-link" href="#how">How a repair café works</a>
    </div>
  </main>

  <footer class="stats">
    214 cafés in 9 countries, 41,000 things fixed
  </footer>
</body>
</html>
