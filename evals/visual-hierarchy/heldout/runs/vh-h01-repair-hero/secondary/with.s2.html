<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tern &amp; Wick: Don't bin it. Bring it in.</title>
  <style>
    :root {
      --paper: #f7f1e6;
      --ink: #1f2a24;
      --muted: #5a6459;
      --moss: #2f5d4a;
      --moss-dark: #234536;
      --ember: #c8642b;
      --line: #e2d7c3;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem clamp(1.25rem, 5vw, 3rem);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-decoration: none;
    }

    .brand span {
      color: var(--ember);
    }

    .header-link {
      font-size: 0.95rem;
      color: var(--moss);
      text-decoration: none;
      font-weight: 600;
    }

    .header-link:hover,
    .header-link:focus-visible {
      text-decoration: underline;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: clamp(3rem, 8vw, 6rem) clamp(1.25rem, 5vw, 3rem);
    }

    .hero {
      max-width: 44rem;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 1.25rem;
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--moss-dark);
      background: #e6ede7;
      border-radius: 999px;
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(2.5rem, 6vw, 4.25rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    h1 em {
      font-style: normal;
      color: var(--ember);
    }

    .lede {
      margin: 0 0 2.25rem;
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      line-height: 1.55;
      color: var(--muted);
      max-width: 36rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
    }

    .btn-primary {
      display: inline-block;
      padding: 0.95rem 1.6rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--moss);
      border-radius: 0.5rem;
      text-decoration: none;
      box-shadow: 0 2px 0 var(--moss-dark);
    }

    .btn-primary:hover {
      background: var(--moss-dark);
    }

    .btn-primary:focus-visible,
    .btn-secondary:focus-visible,
    .header-link:focus-visible {
      outline: 3px solid var(--ember);
      outline-offset: 3px;
    }

    .btn-secondary {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--ember);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .btn-secondary:hover {
      color: var(--ember);
    }

    footer {
      padding: 1.25rem clamp(1.25rem, 5vw, 3rem);
      border-top: 1px solid var(--line);
      font-size: 0.95rem;
      color: var(--muted);
    }

    footer strong {
      color: var(--ink);
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-primary {
        text-align: center;
      }

      .btn-secondary {
        text-align: center;
        padding: 0.5rem 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#">Tern &amp; <span>Wick</span></a>
    <a class="header-link" href="#book">Book a slot</a>
  </header>

  <main>
    <section class="hero" aria-labelledby="headline">
      <p class="eyebrow">Community repair cafes</p>
      <h1 id="headline">Don't bin it. <em>Bring it in.</em></h1>
      <p class="lede">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>

      <div class="actions">
        <a class="btn-primary" href="#book">Book a 30-minute slot</a>
        <a class="btn-secondary" href="#how-it-works">How a repair cafe works</a>
      </div>
    </section>
  </main>

  <footer>
    <strong>214 cafes in 9 countries, 41,000 things fixed</strong>
  </footer>
</body>
</html>
