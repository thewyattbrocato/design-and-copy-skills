<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tern & Wick: Community Repair Cafes</title>
  <style>
    :root {
      --paper: #f6f1e7;
      --ink: #1f2a24;
      --muted: #56615a;
      --moss: #2f5d46;
      --moss-dark: #234734;
      --wick: #c8643b;
      --line: #d9d0bd;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--paper);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-decoration: none;
    }

    .brand span { color: var(--wick); }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
    }

    nav a:hover { color: var(--ink); text-decoration: underline; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 2rem 1.5rem 3rem;
    }

    .hero {
      max-width: 44rem;
      margin: 0 auto;
      width: 100%;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--moss);
      background: #e4ece5;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      margin: 0 0 1.25rem;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin: 0 0 1.1rem;
      font-weight: 800;
    }

    .lead {
      font-size: clamp(1.1rem, 2.4vw, 1.3rem);
      color: var(--muted);
      max-width: 36rem;
      margin: 0 0 2rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
    }

    .btn {
      display: inline-block;
      background: var(--moss);
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 0.9rem 1.5rem;
      border-radius: 0.6rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--moss-dark);
    }

    .btn:hover { background: var(--moss-dark); }

    .btn:focus-visible,
    .learn:focus-visible,
    .brand:focus-visible,
    nav a:focus-visible {
      outline: 3px solid var(--wick);
      outline-offset: 3px;
    }

    .learn {
      color: var(--moss);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 0.2em;
      text-decoration-thickness: 1px;
    }

    .learn:hover { color: var(--moss-dark); }

    footer {
      border-top: 1px solid var(--line);
      padding: 1rem 1.5rem;
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
    }

    footer strong {
      color: var(--ink);
      font-weight: 700;
    }

    @media (max-width: 480px) {
      header { flex-direction: column; align-items: flex-start; }
      .btn { width: 100%; text-align: center; }
      .actions { flex-direction: column; align-items: stretch; }
      .learn { text-align: center; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .btn { transition: background 0.15s ease; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#">Tern <span>&amp;</span> Wick</a>
    <nav aria-label="Primary">
      <a href="#how-it-works">How it works</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="headline">
      <p class="eyebrow">Repair cafes</p>
      <h1 id="headline">Don't bin it. Bring it in.</h1>
      <p class="lead">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>

      <div class="actions">
        <a class="btn" href="#book">Book a 30-minute slot</a>
        <a class="learn" href="#how-it-works">How a repair cafe works</a>
      </div>
    </section>
  </main>

  <footer>
    <strong>214 cafes in 9 countries</strong>, 41,000 things fixed
  </footer>
</body>
</html>
