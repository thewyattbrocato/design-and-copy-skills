<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern &amp; Wick – Don't bin it. Bring it in.</title>
<meta name="description" content="Book a 30-minute slot at a community repair cafe near you. Volunteers, tools and tea are free.">
<style>
  :root {
    --paper: #f7f0e3;
    --ink: #20292c;
    --muted: #55605f;
    --flame: #b5390a;
    --flame-dark: #8f2c07;
    --glow: #f3c25b;
    --teal: #2f5d5a;
    --line: #dccfb8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 48px);
  }
  header {
    padding: 28px 0 0;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.01em;
  }
  .brand svg { width: 26px; height: 26px; }
  .brand span { color: var(--flame); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    align-items: center;
    gap: clamp(24px, 5vw, 64px);
    padding: clamp(32px, 6vh, 72px) 0;
  }
  h1 {
    margin: 0;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7.2vw, 5.4rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
  }
  h1 em {
    font-style: normal;
    color: var(--flame);
    display: block;
  }
  .lede {
    margin: 24px 0 0;
    max-width: 30em;
    font-size: clamp(1.1rem, 2vw, 1.35rem);
    color: var(--muted);
  }
  .actions {
    margin-top: 36px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px 28px;
  }
  .btn {
    display: inline-block;
    background: var(--flame);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 16px 30px;
    border-radius: 999px;
    box-shadow: 0 2px 0 var(--flame-dark);
    transition: background 0.15s, transform 0.15s;
  }
  .btn:hover { background: var(--flame-dark); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .text-link {
    color: var(--teal);
    font-weight: 600;
    font-size: 1.02rem;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
  }
  .text-link:hover { color: var(--ink); }
  a:focus-visible {
    outline: 3px solid var(--teal);
    outline-offset: 4px;
    border-radius: 6px;
  }
  .btn:focus-visible { outline-offset: 4px; border-radius: 999px; }

  .art { display: flex; justify-content: center; }
  .art svg { width: 100%; max-width: 380px; height: auto; }

  footer {
    border-top: 1px solid var(--line);
    padding: 20px 0 28px;
    color: var(--muted);
    font-size: 0.98rem;
  }
  footer strong { color: var(--ink); font-weight: 700; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .art { order: -1; }
    .art svg { max-width: 190px; }
    main { padding-top: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div class="screen">
  <header>
    <a class="brand" href="/" aria-label="Tern &amp; Wick home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3c3 4 6 7.2 6 11.5a6 6 0 0 1-12 0C10 10.200 13 7 16 3z" fill="#b5390a"/>
        <path d="M16 13c1.500 2 2.600 3.200 2.600 4.800a2.600 2.600 0 0 1-5.200 0c0-1.600 1.100-2.800 2.600-4.800z" fill="#f3c25b"/>
        <rect x="14.800" y="21" width="2.400" height="8" rx="1.200" fill="#20292c"/>
      </svg>
      Tern <span>&amp;</span> Wick
    </a>
  </header>

  <main>
    <section>
      <h1>Don't bin it. <em>Bring it in.</em></h1>
      <p class="lede">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>
      <div class="actions">
        <a class="btn" href="#book">Book a slot</a>
        <a class="text-link" href="#how-it-works">How a repair cafe works</a>
      </div>
    </section>

    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 380 400" role="presentation">
        <circle cx="190" cy="190" r="170" fill="#f3c25b" opacity="0.35"/>
        <circle cx="190" cy="190" r="115" fill="#f3c25b" opacity="0.4"/>
        <!-- lamp shade -->
        <path d="M120 150 L150 60 H230 L260 150 Z" fill="#b5390a"/>
        <!-- stitched patch -->
        <rect x="170" y="90" width="44" height="34" rx="4" fill="#f7f0e3" stroke="#20292c" stroke-width="3" stroke-dasharray="6 5" transform="rotate(-6 192 107)"/>
        <!-- stem -->
        <rect x="181" y="150" width="18" height="120" rx="6" fill="#20292c"/>
        <!-- base -->
        <path d="M130 322 Q130 270 190 270 Q250 270 250 322 Z" fill="#2f5d5a"/>
        <rect x="112" y="320" width="156" height="14" rx="7" fill="#20292c"/>
        <!-- tea cup -->
        <path d="M284 300h56v22a28 28 0 0 1-56 0z" fill="#f7f0e3" stroke="#20292c" stroke-width="4"/>
        <path d="M340 308h10a10 10 0 0 1 0 20h-12" fill="none" stroke="#20292c" stroke-width="4"/>
        <path d="M300 286c-6-8 6-12 0-20M318 286c-6-8 6-12 0-20" fill="none" stroke="#55605f" stroke-width="3" stroke-linecap="round"/>
        <!-- table line -->
        <rect x="40" y="334" width="300" height="6" rx="3" fill="#dccfb8"/>
      </svg>
    </div>
  </main>

  <footer>
    <strong>214</strong> cafes in <strong>9</strong> countries, <strong>41,000</strong> things fixed
  </footer>
</div>
</body>
</html>
