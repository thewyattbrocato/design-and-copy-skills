<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern &amp; Wick – Don't bin it. Bring it in.</title>
<meta name="description" content="Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.">
<style>
  :root {
    --paper: #f8f2e7;
    --ink: #1e2b2d;
    --muted: #4d5b5c;
    --accent: #b23a0f;
    --accent-dark: #8f2d0a;
    --teal: #1b6b66;
    --sun: #f2b84b;
    --line: #dccfb8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible {
    outline: 3px solid var(--teal);
    outline-offset: 3px;
    border-radius: 4px;
  }

  header, main, footer {
    width: 100%;
    max-width: 72rem;
    margin: 0 auto;
    padding-left: clamp(1.25rem, 5vw, 3rem);
    padding-right: clamp(1.25rem, 5vw, 3rem);
  }

  header { padding-top: 1.5rem; }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: .01em;
    text-decoration: none;
  }
  .wordmark svg { width: 1.6rem; height: 1.6rem; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(1.5rem, 5vw, 4rem);
    padding-top: clamp(2rem, 6vh, 4rem);
    padding-bottom: clamp(2rem, 6vh, 4rem);
  }

  h1 {
    margin: 0;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-weight: 800;
    font-size: clamp(2.75rem, 7.5vw, 5.5rem);
    line-height: 1.02;
    letter-spacing: -.02em;
    text-wrap: balance;
  }
  h1 span { display: block; color: var(--accent); }

  .lede {
    margin: 1.5rem 0 0;
    max-width: 30rem;
    font-size: clamp(1.1rem, 2.2vw, 1.35rem);
    color: var(--muted);
    text-wrap: pretty;
  }

  .actions {
    margin-top: 2.25rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1.25rem 2rem;
  }
  .btn {
    display: inline-block;
    padding: 1rem 1.9rem;
    background: var(--accent);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 3px 0 var(--accent-dark);
    transition: background .15s, transform .15s, box-shadow .15s;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }

  .how {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--teal);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
    padding: .5rem 0;
  }
  .how:hover { color: var(--ink); }
  .how .arrow { display: inline-block; transition: transform .15s; }
  .how:hover .arrow { transform: translateX(3px); }

  .art { display: flex; justify-content: center; }
  .art svg { width: 100%; max-width: 26rem; height: auto; }

  footer {
    padding-top: 1.25rem;
    padding-bottom: 1.5rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .98rem;
  }
  footer strong { color: var(--ink); font-weight: 700; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .art { order: -1; }
    .art svg { max-width: 14rem; }
    .btn { width: 100%; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/" aria-label="Tern &amp; Wick home">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="15" fill="#1b6b66"/>
      <path d="M16 6c3 4 4 6.500 4 9a4 4 0 0 1-8 0c0-2.500 1-5 4-9z" fill="#f2b84b"/>
      <rect x="14.800" y="17" width="2.400" height="8" rx="1.200" fill="#f8f2e7"/>
    </svg>
    Tern &amp; Wick
  </a>
</header>

<main>
  <section>
    <h1>Don't bin it. <span>Bring it in.</span></h1>
    <p class="lede">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>
    <div class="actions">
      <a class="btn" href="#book">Book a slot</a>
      <a class="how" href="#how-it-works">How a repair cafe works <span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </section>

  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 400 340" role="presentation">
      <ellipse cx="200" cy="300" rx="150" ry="16" fill="#e8dcc4"/>
      <!-- toaster -->
      <rect x="70" y="130" width="260" height="160" rx="42" fill="#1b6b66"/>
      <rect x="70" y="130" width="260" height="60" rx="30" fill="#237d77"/>
      <rect x="110" y="120" width="180" height="22" rx="11" fill="#12504c"/>
      <rect x="125" y="124" width="150" height="8" rx="4" fill="#0b3a37"/>
      <rect x="318" y="175" width="26" height="14" rx="7" fill="#f2b84b"/>
      <circle cx="120" cy="245" r="14" fill="#f8f2e7"/>
      <rect x="117" y="236" width="6" height="12" rx="3" fill="#1b6b66"/>
      <rect x="150" y="238" width="110" height="14" rx="7" fill="#12504c"/>
      <!-- toast popping up -->
      <path d="M135 126V78a26 26 0 0 1 52-6 26 26 0 0 1 52 6v48z" fill="#e2a65a"/>
      <path d="M147 118V82a16 16 0 0 1 32-4 16 16 0 0 1 32 4v36z" fill="#f3d29b"/>
      <!-- steam / tea -->
      <path d="M335 60c-10 10 10 18 0 30M358 66c-10 10 10 18 0 30" fill="none" stroke="#b23a0f" stroke-width="5" stroke-linecap="round" opacity=".55"/>
      <!-- wrench -->
      <g transform="translate(300 215) rotate(35)">
        <rect x="-7" y="-10" width="14" height="110" rx="7" fill="#b23a0f"/>
        <path d="M-20 -16a22 22 0 1 1 40 0l-9 3h-22z" fill="#b23a0f"/>
        <rect x="-6" y="-34" width="12" height="22" fill="#f8f2e7"/>
      </g>
      <circle cx="58" cy="90" r="6" fill="#f2b84b"/>
      <circle cx="36" cy="118" r="3.500" fill="#b23a0f" opacity=".6"/>
    </svg>
  </div>
</main>

<footer>
  <strong>214 cafes</strong> in 9 countries, <strong>41,000 things</strong> fixed
</footer>

</body>
</html>
