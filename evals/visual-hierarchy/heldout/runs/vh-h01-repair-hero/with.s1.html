<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern &amp; Wick – Don't bin it. Bring it in.</title>
<meta name="description" content="Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.">
<style>
  :root {
    --paper: #faf5ec;
    --ink: #1f2a2e;
    --muted: #4f5b5f;
    --accent: #b8431f;
    --accent-dark: #963517;
    --teal: #0f5c5a;
    --line: #e3d9c6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 4px; }

  header {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 24px 0;
  }
  .brand {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-decoration: none;
    color: var(--ink);
  }
  .brand span { color: var(--accent); }

  main {
    flex: 1;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 48px 24px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 48px;
    align-items: center;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: clamp(2.75rem, 7vw, 5.25rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 24px;
    font-weight: 700;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .lede {
    font-size: clamp(1.1rem, 2vw, 1.35rem);
    color: var(--muted);
    max-width: 30em;
    margin: 0 0 36px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px 28px;
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 700;
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 999px;
    box-shadow: 0 2px 0 var(--accent-dark);
    transition: background 0.15s, transform 0.15s;
  }
  .btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .link {
    color: var(--teal);
    font-weight: 600;
    font-size: 1.05rem;
    text-underline-offset: 4px;
    text-decoration-thickness: 2px;
  }
  .link:hover { color: var(--ink); }

  .art {
    justify-self: center;
    width: 100%;
    max-width: 420px;
  }
  .art svg { width: 100%; height: auto; display: block; }

  footer {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 20px 24px 28px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.95rem;
  }
  footer strong { color: var(--ink); }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; gap: 32px; padding-top: 32px; }
    .art { max-width: 260px; order: -1; justify-self: start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <a class="brand" href="/">Tern <span>&amp;</span> Wick</a>
  </header>

  <main>
    <section>
      <h1>Don't bin it. <em>Bring it in.</em></h1>
      <p class="lede">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>
      <div class="actions">
        <a class="btn" href="#book">Book a slot</a>
        <a class="link" href="#how">How a repair cafe works</a>
      </div>
    </section>

    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg">
        <circle cx="200" cy="190" r="165" fill="#f0e3c8"/>
        <!-- toaster -->
        <rect x="90" y="170" width="190" height="110" rx="26" fill="#0f5c5a"/>
        <rect x="90" y="250" width="190" height="30" rx="14" fill="#0b4644"/>
        <rect x="120" y="156" width="60" height="22" rx="8" fill="#1f2a2e"/>
        <rect x="196" y="156" width="60" height="22" rx="8" fill="#1f2a2e"/>
        <rect x="108" y="196" width="40" height="8" rx="4" fill="#faf5ec" opacity="0.5"/>
        <circle cx="252" cy="222" r="11" fill="#faf5ec"/>
        <rect x="249" y="212" width="6" height="11" rx="3" fill="#b8431f"/>
        <rect x="110" y="280" width="26" height="12" rx="5" fill="#1f2a2e"/>
        <rect x="234" y="280" width="26" height="12" rx="5" fill="#1f2a2e"/>
        <!-- wrench -->
        <g transform="rotate(35 300 130)">
          <rect x="292" y="70" width="16" height="130" rx="8" fill="#b8431f"/>
          <path d="M282 78 a26 26 0 1 1 36 0 l-8 -2 v-14 h-20 v14 z" fill="#b8431f"/>
        </g>
        <!-- tea cup -->
        <path d="M262 290 h82 v10 a38 38 0 0 1 -38 38 h-6 a38 38 0 0 1 -38 -38 z" fill="#faf5ec" stroke="#1f2a2e" stroke-width="5" transform="translate(-6 -30) scale(0.95)"/>
        <path d="M338 276 c22 -2 24 26 0 28" fill="none" stroke="#1f2a2e" stroke-width="5" stroke-linecap="round" transform="translate(-6 -30) scale(0.95)"/>
        <!-- steam -->
        <path d="M288 226 c-8 -10 8 -16 0 -28 M308 226 c-8 -10 8 -16 0 -28" fill="none" stroke="#1f2a2e" stroke-width="4" stroke-linecap="round" opacity="0.45" transform="translate(0 -4)"/>
      </svg>
    </div>
  </main>

  <footer>
    <strong>214</strong> cafes in <strong>9</strong> countries, <strong>41,000</strong> things fixed
  </footer>
</body>
</html>
