<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tern &amp; Wick – Don't bin it. Bring it in.</title>
<meta name="description" content="Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.">
<style>
  :root {
    --paper: #f7f0e4;
    --ink: #2b2118;
    --muted: #5e5043;
    --accent: #b23a0a;
    --accent-dark: #8f2d06;
    --line: #dccfba;
    --sun: #f2b84b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

  header {
    padding: 1.5rem clamp(1.25rem, 5vw, 4rem);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.01em;
    text-decoration: none;
  }
  .brand span { color: var(--accent); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    align-items: center;
    gap: clamp(1.5rem, 5vw, 4rem);
    padding: 1rem clamp(1.25rem, 5vw, 4rem) 2rem;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }
  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(2.6rem, 7vw, 5rem);
    line-height: 1.02;
    letter-spacing: -0.03em;
    font-weight: 800;
    text-wrap: balance;
  }
  h1 em {
    font-style: normal;
    color: var(--accent);
  }
  .lede {
    margin: 0 0 2rem;
    max-width: 30em;
    font-size: clamp(1.1rem, 2.2vw, 1.35rem);
    color: var(--muted);
    text-wrap: pretty;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem 1.75rem;
  }
  .btn {
    display: inline-block;
    padding: 1rem 1.9rem;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.15rem;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 3px 0 var(--accent-dark);
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }
  .link {
    font-weight: 600;
    font-size: 1.05rem;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
    text-decoration-color: var(--line);
    transition: text-decoration-color .12s ease;
  }
  .link:hover { text-decoration-color: var(--accent); }

  .art { display: flex; justify-content: center; }
  .art svg { width: 100%; max-width: 380px; height: auto; }

  footer {
    padding: 1.25rem clamp(1.25rem, 5vw, 4rem);
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.95rem;
    color: var(--muted);
  }
  footer strong { color: var(--ink); font-weight: 700; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; align-content: center; }
    .art { order: -1; }
    .art svg { max-width: 190px; }
    .btn { width: 100%; text-align: center; }
    .actions { flex-direction: column; align-items: stretch; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="/" aria-label="Tern &amp; Wick home">Tern <span>&amp;</span> Wick</a>
</header>

<main>
  <section>
    <h1>Don't bin it.<br><em>Bring it in.</em></h1>
    <p class="lede">Book a 30-minute slot at a repair cafe near you. Volunteers, tools and tea are free.</p>
    <div class="actions">
      <a class="btn" href="#book">Book a slot</a>
      <a class="link" href="#how-it-works">How a repair cafe works</a>
    </div>
  </section>

  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 380 340" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="190" cy="305" rx="150" ry="16" fill="#e6d8c2"/>
      <circle cx="285" cy="75" r="46" fill="#f2b84b"/>
      <!-- toaster -->
      <rect x="62" y="130" width="236" height="150" rx="38" fill="#b23a0a"/>
      <rect x="62" y="130" width="236" height="150" rx="38" fill="none" stroke="#2b2118" stroke-width="5"/>
      <rect x="100" y="146" width="160" height="16" rx="8" fill="#2b2118"/>
      <rect x="86" y="196" width="70" height="10" rx="5" fill="#f7f0e4" opacity=".55"/>
      <circle cx="248" cy="224" r="15" fill="#f7f0e4"/>
      <circle cx="248" cy="224" r="5" fill="#2b2118"/>
      <rect x="94" y="276" width="26" height="14" rx="4" fill="#2b2118"/>
      <rect x="240" y="276" width="26" height="14" rx="4" fill="#2b2118"/>
      <!-- toast -->
      <path d="M118 150 v-34 a22 22 0 0 1 44 0 v34 z" fill="#e8b46a" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"/>
      <path d="M198 150 v-34 a22 22 0 0 1 44 0 v34 z" fill="#e8b46a" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"/>
      <!-- steam / tea cup -->
      <path d="M300 250 h52 v22 a24 24 0 0 1 -24 24 h-4 a24 24 0 0 1 -24 -24 z" fill="#f7f0e4" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"/>
      <path d="M352 258 h8 a10 10 0 0 1 0 20 h-10" fill="none" stroke="#2b2118" stroke-width="5" stroke-linecap="round"/>
      <path d="M314 236 q-6 -10 0 -18 M332 236 q-6 -10 0 -18" fill="none" stroke="#2b2118" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
</main>

<footer>
  <strong>214</strong> cafes in <strong>9</strong> countries, <strong>41,000</strong> things fixed
</footer>

</body>
</html>
