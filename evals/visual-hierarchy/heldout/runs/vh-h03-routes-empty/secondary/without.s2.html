<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spokeline – Saved routes (empty)</title>
<style>
  :root {
    --accent: #0a7f5a;
    --accent-soft: #e4f3ee;
    --ink: #1c1f23;
    --muted: #6b7280;
    --line: #e5e7eb;
    --surface: #ffffff;
    --page: #f5f6f8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #d9dce1;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    height: 844px;
    background: var(--page);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  header {
    padding: 56px 20px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 24px;
  }
  .empty {
    text-align: center;
    padding: 32px 8px 8px;
  }
  .empty-art {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    border-radius: 60px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .empty-art svg { width: 64px; height: 64px; }
  .empty h2 {
    font-size: 20px;
    font-weight: 650;
    margin-bottom: 8px;
  }
  .empty p {
    font-size: 15px;
    line-height: 1.45;
    color: var(--muted);
    margin: 0 auto;
    max-width: 320px;
  }
  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 24px;
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary svg { width: 20px; height: 20px; }
  .hint {
    margin-top: 8px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  .section-title {
    margin: 32px 0 10px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .list {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .route {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 14px;
    background: none;
    border: none;
    border-top: 1px solid var(--line);
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .route:first-child { border-top: none; }
  .route-icon {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .route-icon svg { width: 22px; height: 22px; }
  .route-text { flex: 1; min-width: 0; }
  .route-name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .route-meta {
    margin-top: 2px;
    font-size: 13px;
    color: var(--muted);
  }
  .route-add {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 16px;
    border: 1.5px solid var(--accent);
    background: none;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .route-add svg { width: 16px; height: 16px; }
  nav.tabbar {
    display: flex;
    justify-content: space-around;
    padding: 8px 8px 28px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
    padding: 4px 0;
    background: none;
    border: none;
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="screen">
    <header>
      <h1>Saved routes</h1>
    </header>

    <main>
      <section class="empty" aria-labelledby="empty-title">
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="#0a7f5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 46 C18 30, 26 50, 34 34 S48 18, 54 22"/>
            <circle cx="10" cy="46" r="4" fill="#0a7f5a"/>
            <path d="M54 14 v-2 a0 0 0 0 1 0 0" stroke-width="0"/>
            <path d="M54 22 c-4 -6 -8 -8 -8 -12 a8 8 0 0 1 16 0 c0 4 -4 6 -8 12 z" fill="#ffffff"/>
            <circle cx="54" cy="10" r="2.5" fill="#0a7f5a" stroke="none"/>
          </svg>
        </div>
        <h2 id="empty-title">No saved routes yet</h2>
        <p>Saving a route keeps it available offline and shows it on your watch.</p>

        <button class="btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <path d="M12 16V4M7 9l5-5 5 5"/>
            <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
          </svg>
          Import a route file
        </button>
        <p class="hint">Supports GPX and FIT files</p>
      </section>

      <h3 class="section-title">Popular nearby</h3>
      <div class="list">
        <button class="route" type="button">
          <span class="route-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0a7f5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c4-6 6 2 10-4s4-4 8-2"/></svg>
          </span>
          <span class="route-text">
            <span class="route-name" style="display:block">Riverside Loop</span>
            <span class="route-meta" style="display:block">15.2 mi · 590 ft gain · Flat</span>
          </span>
          <span class="route-add" aria-label="Save Riverside Loop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </span>
        </button>
        <button class="route" type="button">
          <span class="route-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0a7f5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6-10 4 6 2-3 6 7z"/></svg>
          </span>
          <span class="route-text">
            <span class="route-name" style="display:block">Hilltop Out-and-Back</span>
            <span class="route-meta" style="display:block">25.5 mi · 2,260 ft gain · Hard</span>
          </span>
          <span class="route-add" aria-label="Save Hilltop Out-and-Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </span>
        </button>
        <button class="route" type="button">
          <span class="route-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0a7f5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8c3-3 5 3 8 0s5-3 8 0M4 14c3-3 5 3 8 0s5-3 8 0"/></svg>
          </span>
          <span class="route-text">
            <span class="route-name" style="display:block">Lakeshore Easy Spin</span>
            <span class="route-meta" style="display:block">11.2 mi · 120 ft gain · Easy</span>
          </span>
          <span class="route-add" aria-label="Save Lakeshore Easy Spin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </span>
        </button>
      </div>
    </main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        Home
      </button>
      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M4 15V7a3 3 0 0 1 3-3h10"/><path d="M20 9v8a3 3 0 0 1-3 3H8"/></svg>
        Saved routes
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
        Record
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Profile
      </button>
    </nav>
  </div>
</body>
</html>
