<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spokeline – Saved routes (empty)</title>
<style>
  :root {
    --bg: #f5f6f4;
    --surface: #ffffff;
    --text: #1d2420;
    --muted: #5d6762;
    --line: #e1e5e2;
    --accent: #0b7a57;
    --accent-ink: #ffffff;
    --accent-soft: #e4f2ec;
    --record: #d6453d;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: #e7e9e6;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 390px;
    max-width: 100%;
    height: 844px;
    max-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .header {
    padding: 56px 20px 12px;
    background: var(--bg);
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 24px;
  }

  /* Empty state hero */
  .empty {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 20px 22px;
    text-align: center;
  }

  .empty-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }

  .empty-icon svg { width: 30px; height: 30px; }

  .empty h2 {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .empty p {
    font-size: 15px;
    line-height: 1.45;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary svg { width: 20px; height: 20px; }

  .btn-primary:focus-visible,
  .row-add:focus-visible,
  .tab:focus-visible {
    outline: 3px solid #9fd6c1;
    outline-offset: 2px;
  }

  /* Popular nearby */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 28px 4px 10px;
  }

  .routes {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }

  .route-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
  }

  .route-row:first-child { border-top: none; }

  .route-thumb {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .route-thumb svg { width: 22px; height: 22px; }

  .route-info { flex: 1; min-width: 0; }

  .route-name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .route-meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  .row-add {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .row-add svg { width: 18px; height: 18px; }

  .footnote {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-top: 16px;
  }

  /* Tab bar */
  .tabbar {
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 8px 8px 28px;
  }

  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
    background: none;
    border: none;
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    color: #8a938e;
    cursor: pointer;
  }

  .tab svg { width: 24px; height: 24px; }

  .tab.active { color: var(--accent); font-weight: 600; }

  .tab.record .dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #8a938e;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tab.record .dot::after {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--record);
  }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Saved routes</h1>
    </header>

    <main class="content">
      <section class="empty" aria-labelledby="empty-title">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
            <path d="M18 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
            <path d="M6 15l4-7h4l3 4"/>
            <path d="M14 8l1-3h2"/>
          </svg>
        </div>
        <h2 id="empty-title">No saved routes yet</h2>
        <p>Saving a route keeps it available offline and shows it on your watch.</p>
        <button class="btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V3"/>
            <path d="M7 8l5-5 5 5"/>
            <path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
          </svg>
          Import route file
        </button>
      </section>

      <h3 class="section-title">Popular nearby</h3>
      <ul class="routes" role="list">
        <li class="route-row">
          <div class="route-thumb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 17l6-6 4 4 8-8"/>
            </svg>
          </div>
          <div class="route-info">
            <div class="route-name">Ridge Loop</div>
            <div class="route-meta">28 km · 420 m climb</div>
          </div>
          <button class="row-add" type="button" aria-label="Save Ridge Loop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </li>
        <li class="route-row">
          <div class="route-thumb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 17l6-6 4 4 8-8"/>
            </svg>
          </div>
          <div class="route-info">
            <div class="route-name">Riverside 30</div>
            <div class="route-meta">30 km · 60 m climb</div>
          </div>
          <button class="row-add" type="button" aria-label="Save Riverside 30">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </li>
        <li class="route-row">
          <div class="route-thumb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 17l6-6 4 4 8-8"/>
            </svg>
          </div>
          <div class="route-info">
            <div class="route-name">Hilltop Climb Repeats</div>
            <div class="route-meta">12 km · 510 m climb</div>
          </div>
          <button class="row-add" type="button" aria-label="Save Hilltop Climb Repeats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </li>
      </ul>
      <p class="footnote">Tap + to save a route to this list.</p>
    </main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab" type="button" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5L12 3l9 7.5"/>
          <path d="M5 9.5V21h14V9.5"/>
        </svg>
        Home
      </button>
      <button class="tab active" type="button" aria-label="Saved routes" aria-current="page">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>
        </svg>
        Saved routes
      </button>
      <button class="tab record" type="button" aria-label="Record">
        <span class="dot" aria-hidden="true"></span>
        Record
      </button>
      <button class="tab" type="button" aria-label="Profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        Profile
      </button>
    </nav>
  </div>
</body>
</html>
