<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spokeline · Saved routes (empty)</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #14171c;
    --muted: #5b6370;
    --line: #e3e6eb;
    --accent: #0a7f5a;
    --accent-ink: #ffffff;
    --accent-soft: #e4f4ee;
    --tab-inactive: #7a828e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #dfe2e7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    width: 390px;
    max-width: 100%;
    height: 844px;
    max-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 36px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
  }

  .status-bar {
    height: 48px;
    padding: 14px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-size: 15px;
    font-weight: 600;
    background: var(--surface);
    flex-shrink: 0;
  }

  .app-header {
    background: var(--surface);
    padding: 8px 20px 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .app-header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 16px;
  }

  .empty {
    text-align: center;
    padding: 12px 8px 0;
  }

  .empty-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-icon svg {
    width: 36px;
    height: 36px;
  }

  .empty h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .empty p {
    font-size: 15px;
    line-height: 1.45;
    color: var(--muted);
  }

  .btn-primary {
    width: 100%;
    margin-top: 20px;
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary svg {
    width: 18px;
    height: 18px;
  }

  .btn-primary:active {
    opacity: 0.85;
  }

  .hint {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  .section {
    margin-top: 32px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .list {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--line);
    overflow: hidden;
    list-style: none;
  }

  .route-row + .route-row {
    border-top: 1px solid var(--line);
  }

  .route-row button {
    width: 100%;
    background: none;
    border: none;
    font: inherit;
    color: inherit;
    text-align: left;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .route-row button:active {
    background: #f0f2f5;
  }

  .route-info {
    flex: 1;
    min-width: 0;
  }

  .route-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .route-meta {
    font-size: 13px;
    color: var(--muted);
  }

  .route-add {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .route-add svg {
    width: 16px;
    height: 16px;
  }

  .tab-bar {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 8px 8px 24px;
  }

  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 500;
    color: var(--tab-inactive);
    text-decoration: none;
    padding: 4px 0;
  }

  .tab svg {
    width: 24px;
    height: 24px;
  }

  .tab[aria-current="page"] {
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <main class="screen">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span>●●● ▮</span>
    </div>

    <header class="app-header">
      <h1>Saved routes</h1>
    </header>

    <section class="content">
      <div class="empty">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
            <path d="M18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
            <path d="M8 17h6.5a3.5 3.5 0 0 0 0-7H9.5a3.5 3.5 0 0 1 0-7H16"/>
          </svg>
        </div>
        <h2>No saved routes yet</h2>
        <p>Saving a route keeps it for offline use and shows it on your watch.</p>

        <button class="btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V3"/>
            <path d="m7 8 5-5 5 5"/>
            <path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>
          </svg>
          Import a route file
        </button>
        <p class="hint">Supports .gpx and .fit files</p>
      </div>

      <div class="section">
        <h3 class="section-title">Popular nearby</h3>
        <ul class="list">
          <li class="route-row">
            <button type="button">
              <div class="route-info">
                <div class="route-name">Riverside Loop</div>
                <div class="route-meta">24.1 km · 180 m climb</div>
              </div>
              <span class="route-add" aria-label="Save Riverside Loop">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
              </span>
            </button>
          </li>
          <li class="route-row">
            <button type="button">
              <div class="route-info">
                <div class="route-name">Hillcrest Ascent</div>
                <div class="route-meta">38.6 km · 710 m climb</div>
              </div>
              <span class="route-add" aria-label="Save Hillcrest Ascent">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
              </span>
            </button>
          </li>
          <li class="route-row">
            <button type="button">
              <div class="route-info">
                <div class="route-name">Lakeshore Flat Run</div>
                <div class="route-meta">15.3 km · 20 m climb</div>
              </div>
              <span class="route-add" aria-label="Save Lakeshore Flat Run">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
              </span>
            </button>
          </li>
        </ul>
      </div>
    </section>

    <nav class="tab-bar" aria-label="Main">
      <a class="tab" href="#home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"/>
          <path d="M5 9.5V20h14V9.5"/>
        </svg>
        Home
      </a>
      <a class="tab" href="#saved" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
          <path d="M18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
          <path d="M8 17h6.5a3.5 3.5 0 0 0 0-7H9.5a3.5 3.5 0 0 1 0-7H16"/>
        </svg>
        Saved routes
      </a>
      <a class="tab" href="#record">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/>
          <circle cx="12" cy="12" r="3.5" fill="currentColor"/>
        </svg>
        Record
      </a>
      <a class="tab" href="#profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
        Profile
      </a>
    </nav>
  </main>
</body>
</html>
