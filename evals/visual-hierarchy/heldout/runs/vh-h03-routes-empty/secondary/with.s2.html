<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spokeline – Saved routes (empty)</title>
<style>
  :root {
    --accent: #1a6b44;
    --accent-ink: #ffffff;
    --ink: #1c2330;
    --muted: #5b6470;
    --line: #e3e6ea;
    --surface: #ffffff;
    --tint: #eef6f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9ecef;
    color: var(--ink);
  }

  .phone {
    position: relative;
    width: 390px;
    max-width: 100%;
    height: 844px;
    max-height: 100vh;
    background: var(--surface);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    padding: 56px 24px 12px;
  }

  .topbar h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 104px;
  }

  /* Empty state */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px 32px 32px;
  }

  .empty-art {
    width: 120px;
    height: 96px;
    margin-bottom: 20px;
  }

  .empty h2 {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 650;
  }

  .explain {
    margin: 0 0 24px;
    font-size: 15px;
    line-height: 1.45;
    color: var(--muted);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    border-radius: 12px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn.primary {
    width: 100%;
    padding: 0 20px;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
  }

  .btn.primary:focus-visible,
  .save:focus-visible,
  .tab:focus-visible {
    outline: 3px solid #9cc9b0;
    outline-offset: 2px;
  }

  .btn svg,
  .save svg {
    width: 20px;
    height: 20px;
    flex: none;
  }

  /* Popular nearby */
  .popular {
    border-top: 1px solid var(--line);
    padding: 20px 24px 0;
  }

  .popular h3 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .route-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .route {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }

  .route:last-child {
    border-bottom: 0;
  }

  .route-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .route-name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .route-meta {
    font-size: 13px;
    color: var(--muted);
  }

  .save {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 44px;
    padding: 0 14px;
    border: 1.5px solid var(--accent);
    border-radius: 22px;
    background: var(--surface);
    color: var(--accent);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .save:hover {
    background: var(--tint);
  }

  /* Tab bar */
  .tabbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 8px 8px 28px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }

  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-height: 48px;
    padding-top: 4px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }

  .tab svg {
    width: 24px;
    height: 24px;
  }

  .tab.active {
    color: var(--accent);
    font-weight: 650;
  }
</style>
</head>
<body>

<div class="phone">
  <header class="topbar">
    <h1>Saved routes</h1>
  </header>

  <main class="content">
    <section class="empty" aria-labelledby="empty-title">
      <svg class="empty-art" viewBox="0 0 120 96" fill="none" aria-hidden="true">
        <path d="M14 74 C 30 74, 34 30, 52 30 S 78 66, 94 40" stroke="#9cc9b0" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
        <circle cx="14" cy="74" r="7" fill="#1a6b44"/>
        <circle cx="94" cy="40" r="7" fill="#eef6f1" stroke="#1a6b44" stroke-width="3"/>
        <rect x="44" y="8" width="32" height="40" rx="6" fill="#eef6f1"/>
        <path d="M52 8 V 40 L 60 33 L 68 40 V 8" fill="#1a6b44"/>
      </svg>

      <h2 id="empty-title">No saved routes yet</h2>
      <p class="explain">Saving a route keeps it available offline and shows it on your watch.</p>

      <button class="btn primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
        </svg>
        Import a route file
      </button>
    </section>

    <section class="popular" aria-labelledby="popular-title">
      <h3 id="popular-title">Popular nearby</h3>
      <ul class="route-list">
        <li class="route">
          <div class="route-info">
            <span class="route-name">Riverside Loop</span>
            <span class="route-meta">24.1 km · 180 m climb</span>
          </div>
          <button class="save" type="button" aria-label="Save Riverside Loop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Save
          </button>
        </li>
        <li class="route">
          <div class="route-info">
            <span class="route-name">Hawk Point Climb</span>
            <span class="route-meta">11.6 km · 620 m climb</span>
          </div>
          <button class="save" type="button" aria-label="Save Hawk Point Climb">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Save
          </button>
        </li>
        <li class="route">
          <div class="route-info">
            <span class="route-name">Harbor Flats 30K</span>
            <span class="route-meta">30.2 km · 90 m climb</span>
          </div>
          <button class="save" type="button" aria-label="Save Harbor Flats 30K">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Save
          </button>
        </li>
      </ul>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="#home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>
      </svg>
      Home
    </a>
    <a class="tab active" href="#saved" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 19V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14l-6-4-6 4z"/>
      </svg>
      Saved routes
    </a>
    <a class="tab" href="#record">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/>
      </svg>
      Record
    </a>
    <a class="tab" href="#profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Profile
    </a>
  </nav>
</div>

</body>
</html>
