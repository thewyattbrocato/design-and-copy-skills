<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spokeline – Saved routes</title>
<style>
  :root{
    --bg:#f6f4ef;
    --surface:#ffffff;
    --ink:#1b2320;
    --muted:#5d6a64;
    --line:#e3dfd6;
    --accent:#0d6b4f;
    --accent-ink:#ffffff;
    --accent-soft:#e2f0ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#d9d6cd;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;max-width:390px;min-height:100vh;
    background:var(--bg);
    display:flex;flex-direction:column;
    position:relative;
  }
  header{padding:56px 20px 8px}
  header h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
  main{flex:1;overflow-y:auto;padding:8px 20px 24px}

  .empty{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:24px 8px 8px;
  }
  .art{
    width:112px;height:112px;border-radius:32px;
    background:var(--accent-soft);
    display:grid;place-items:center;margin-bottom:20px;
  }
  .empty h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
  .empty p{font-size:15px;line-height:1.45;color:var(--muted);max-width:300px}

  .actions{margin-top:22px;width:100%;display:flex;flex-direction:column;gap:10px}
  .btn{
    font:inherit;font-size:16px;font-weight:600;
    min-height:48px;border-radius:14px;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn:focus-visible,.route:focus-visible,.tab:focus-visible{outline:3px solid #1a8f6b;outline-offset:2px}
  .hint{font-size:13px;color:var(--muted)}

  .nearby{margin-top:30px}
  .nearby-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .nearby-head h3{font-size:17px;font-weight:700}
  .nearby-head span{font-size:13px;color:var(--muted)}
  .list{list-style:none;display:flex;flex-direction:column;gap:10px}
  .route{
    width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:12px;display:flex;align-items:center;gap:12px;min-height:72px;
  }
  .thumb{
    width:48px;height:48px;border-radius:12px;background:var(--accent-soft);
    display:grid;place-items:center;flex:none;
  }
  .info{flex:1;min-width:0}
  .info strong{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .save{
    flex:none;font-size:13px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:7px 12px;
  }

  nav{
    display:flex;background:var(--surface);border-top:1px solid var(--line);
    padding:6px 8px 26px;
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 0;font:inherit;font-size:11px;font-weight:500;
    color:var(--muted);background:none;border:0;border-radius:12px;cursor:pointer;min-height:48px;
  }
  .tab svg{stroke:currentColor}
  .tab[aria-current="page"]{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header><h1>Saved routes</h1></header>

  <main>
    <section class="empty">
      <div class="art" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#0d6b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 50c8 0 8-10 16-10s6 10 14 4 4-18 14-22"/>
          <circle cx="10" cy="50" r="3" fill="#0d6b4f"/>
          <path d="M54 10c-5 0-8 4-8 8 0 6 8 14 8 14s8-8 8-14c0-4-3-8-8-8z" fill="#fff"/>
          <circle cx="54" cy="18" r="2.5" fill="#0d6b4f"/>
        </svg>
      </div>
      <h2>No saved routes yet</h2>
      <p>Saving a route keeps it available offline and shows it on your watch.</p>

      <div class="actions">
        <button class="btn primary" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
          Import a route file
        </button>
        <span class="hint">GPX, TCX or FIT files</span>
      </div>
    </section>

    <section class="nearby" aria-labelledby="nb">
      <div class="nearby-head">
        <h3 id="nb">Popular nearby</h3>
        <span>Tap to save</span>
      </div>
      <ul class="list">
        <li><button class="route" type="button">
          <span class="thumb" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#0d6b4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21c4-1 4-8 9-8s4 6 11-8"/></svg></span>
          <span class="info"><strong>Riverside Loop</strong><small>24 km · 180 m climb · 1.2 km away</small></span>
          <span class="save">Save</span>
        </button></li>
        <li><button class="route" type="button">
          <span class="thumb" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#0d6b4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22l7-12 5 7 3-4 7 9"/></svg></span>
          <span class="info"><strong>Hawk Hill Climb</strong><small>38 km · 620 m climb · 3.4 km away</small></span>
          <span class="save">Save</span>
        </button></li>
        <li><button class="route" type="button">
          <span class="thumb" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#0d6b4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="9"/></svg></span>
          <span class="info"><strong>Park Circuit</strong><small>12 km · 40 m climb · 2.1 km away</small></span>
          <span class="save">Save</span>
        </button></li>
      </ul>
    </section>
  </main>

  <nav aria-label="Main">
    <button class="tab" type="button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home
    </button>
    <button class="tab" type="button" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved routes
    </button>
    <button class="tab" type="button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Record
    </button>
    <button class="tab" type="button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>Profile
    </button>
  </nav>
</div>
</body>
</html>
