<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spokeline – Saved routes</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1b2320; --muted:#5f6b66; --line:#e3e0d7;
    --accent:#0f7a5a; --accent-ink:#ffffff; --accent-soft:#e1f1ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#d9d6cc; color:var(--ink);
    display:flex; justify-content:center; align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px; max-width:100%; height:844px; max-height:100%;
    background:var(--bg); display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  header{padding:28px 20px 8px}
  header h1{font-size:28px; font-weight:750; letter-spacing:-.02em}
  main{flex:1; overflow-y:auto; padding:8px 20px 24px}

  .empty{text-align:center; padding:20px 8px 8px}
  .art{
    width:148px; height:112px; margin:0 auto 20px; display:block;
  }
  .empty h2{font-size:21px; font-weight:700; letter-spacing:-.01em; margin-bottom:8px}
  .empty p{font-size:15.5px; line-height:1.45; color:var(--muted); max-width:30ch; margin:0 auto}

  .actions{display:flex; flex-direction:column; gap:10px; margin-top:24px}
  .btn{
    font:inherit; font-size:16px; font-weight:650; min-height:50px; border-radius:14px;
    border:1.5px solid transparent; display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; width:100%;
  }
  .btn svg{width:20px;height:20px}
  .btn.primary{background:var(--accent); color:var(--accent-ink)}
  .btn.primary:active{background:#0b6048}
  .btn.secondary{background:transparent; color:var(--accent); border-color:var(--accent)}
  .btn.secondary:active{background:var(--accent-soft)}
  .btn:focus-visible,.tab:focus-visible,.route:focus-visible{outline:3px solid #1d6fd6; outline-offset:2px}

  .popular{margin-top:32px}
  .popular-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
  .popular-head h3{font-size:17px; font-weight:700}
  .popular-head span{font-size:13px; color:var(--muted)}
  .route{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px; margin-bottom:8px; font:inherit; color:inherit; cursor:pointer;
  }
  .thumb{
    flex:none; width:52px; height:52px; border-radius:10px; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .thumb svg{width:34px;height:34px}
  .info{flex:1; min-width:0}
  .info strong{display:block; font-size:15.5px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .info small{font-size:13px; color:var(--muted)}
  .save{
    flex:none; font-size:13.5px; font-weight:650; color:var(--accent);
    background:var(--accent-soft); padding:7px 12px; border-radius:999px;
  }

  nav{
    display:flex; background:var(--card); border-top:1px solid var(--line);
    padding:6px 8px calc(10px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1; background:none; border:0; font:inherit; font-size:11.5px; font-weight:600;
    color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0; min-height:52px; cursor:pointer; border-radius:10px;
  }
  .tab svg{width:25px;height:25px}
  .tab[aria-current="page"]{color:var(--accent)}
</style>
</head>
<body>
<div class="screen">
  <header><h1>Saved routes</h1></header>

  <main>
    <section class="empty">
      <svg class="art" viewBox="0 0 148 112" aria-hidden="true">
        <rect x="14" y="10" width="120" height="92" rx="18" fill="#e1f1ea"/>
        <path d="M34 82 C50 82 48 56 66 56 S84 76 100 62 S112 36 116 30" fill="none" stroke="#0f7a5a" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 10"/>
        <circle cx="34" cy="82" r="8" fill="#fff" stroke="#0f7a5a" stroke-width="4"/>
        <path d="M116 14c-7 0-12 5-12 11 0 8 12 20 12 20s12-12 12-20c0-6-5-11-12-11z" fill="#0f7a5a"/>
        <circle cx="116" cy="25" r="4.5" fill="#fff"/>
      </svg>
      <h2>No saved routes yet</h2>
      <p>Saving a route keeps it available offline and shows it on your watch.</p>

      <div class="actions">
        <button class="btn primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
          Import a route file
        </button>
      </div>
    </section>

    <section class="popular" aria-labelledby="pop">
      <div class="popular-head"><h3 id="pop">Popular nearby</h3><span>Or start with one of these</span></div>

      <button class="route" type="button">
        <span class="thumb"><svg viewBox="0 0 34 34" fill="none" stroke="#0f7a5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 26c6 0 4-14 11-14s5 10 10 10 4-12 6-14"/></svg></span>
        <span class="info"><strong>Riverside Loop</strong><small>32 km · 210 m climb</small></span>
        <span class="save">Save</span>
      </button>

      <button class="route" type="button">
        <span class="thumb"><svg viewBox="0 0 34 34" fill="none" stroke="#0f7a5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 28L14 8l6 12 4-6 5 14"/></svg></span>
        <span class="info"><strong>Old Mill Climb</strong><small>47 km · 820 m climb</small></span>
        <span class="save">Save</span>
      </button>

      <button class="route" type="button">
        <span class="thumb"><svg viewBox="0 0 34 34" fill="none" stroke="#0f7a5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="17" r="11"/><path d="M17 6v6"/></svg></span>
        <span class="info"><strong>Harbor Flat Out-and-Back</strong><small>18 km · 40 m climb</small></span>
        <span class="save">Save</span>
      </button>
    </section>
  </main>

  <nav aria-label="Main">
    <button class="tab" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home
    </button>
    <button class="tab" type="button" aria-current="page">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>Saved routes
    </button>
    <button class="tab" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>Record
    </button>
    <button class="tab" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.500 8 6"/></svg>Profile
    </button>
  </nav>
</div>
</body>
</html>
