<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spokeline – Saved routes</title>
<style>
  :root {
    --ink: #17201b;
    --soft: #56605a;
    --line: #e4e8e5;
    --bg: #ffffff;
    --wash: #f4f6f4;
    --accent: #0a6b4d;
    --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--wash);
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .screen {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 440px) {
    body { padding: 24px 0; }
    .screen { min-height: 844px; height: 844px; border-radius: 28px; overflow: hidden; border: 1px solid var(--line); }
  }
  header { padding: 20px 20px 0; }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }

  main { flex: 1; overflow-y: auto; padding: 0 20px 24px; }

  .empty { text-align: center; padding: 40px 12px 32px; }
  .empty svg { display: block; margin: 0 auto 20px; }
  .empty h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
  .empty p { margin: 8px auto 0; font-size: 16px; line-height: 1.45; color: var(--soft); max-width: 300px; }

  .primary {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; margin-top: 24px; height: 52px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 14px;
    font: inherit; font-size: 17px; font-weight: 600;
    cursor: pointer;
  }
  .primary:active { filter: brightness(0.92); }
  .hint { margin-top: 10px; font-size: 13px; color: var(--soft); }

  .nearby h3 { font-size: 17px; font-weight: 600; padding-bottom: 4px; }
  .nearby .sub { font-size: 14px; color: var(--soft); padding-bottom: 8px; }
  .nearby ul { list-style: none; padding: 0; border-top: 1px solid var(--line); }
  .nearby li { border-bottom: 1px solid var(--line); }
  .row {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 14px 0; background: none; border: 0;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .row .txt { flex: 1; min-width: 0; }
  .row .name { display: block; font-size: 16px; font-weight: 600; }
  .row .meta { display: block; margin-top: 2px; font-size: 14px; color: var(--soft); }
  .row svg { flex: none; color: var(--soft); }

  nav {
    display: flex; border-top: 1px solid var(--line);
    background: var(--bg); padding: 8px 4px 22px;
  }
  nav a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 0; text-decoration: none; color: var(--soft);
    font-size: 11px; font-weight: 500;
  }
  nav a[aria-current="page"] { color: var(--accent); font-weight: 700; }
  nav svg { width: 24px; height: 24px; }

  a:focus-visible, button:focus-visible { outline: 3px solid #1d8fe0; outline-offset: 2px; }
</style>
</head>
<body>
<div class="screen">
  <header><h1>Saved routes</h1></header>

  <main>
    <section class="empty">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#0a6b4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="14" cy="50" r="5"/>
        <path d="M19 50h22a8 8 0 0 0 0-16H25a8 8 0 0 1 0-16h14"/>
        <path d="M46 18l-7-0M46 18l-5-5M46 18l-5 5" stroke-width="3"/>
      </svg>
      <h2>No saved routes yet</h2>
      <p>Saving a route keeps it available offline and shows it on your watch.</p>
      <button class="primary" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
        Import a route file
      </button>
      <div class="hint">GPX, TCX or FIT</div>
    </section>

    <section class="nearby" aria-labelledby="nearby-h">
      <h3 id="nearby-h">Popular nearby</h3>
      <div class="sub">Or tap one to save it.</div>
      <ul>
        <li><button class="row" type="button">
          <span class="txt"><span class="name">Riverside Loop</span><span class="meta">32 km · 240 m climb</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button></li>
        <li><button class="row" type="button">
          <span class="txt"><span class="name">Old Quarry Climb</span><span class="meta">48 km · 810 m climb</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button></li>
        <li><button class="row" type="button">
          <span class="txt"><span class="name">Lakeshore Out-and-Back</span><span class="meta">21 km · 90 m climb</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button></li>
      </ul>
    </section>
  </main>

  <nav aria-label="Main">
    <a href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>
      Home
    </a>
    <a href="#" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      Saved routes
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
      Record
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
      Profile
    </a>
  </nav>
</div>
</body>
</html>
