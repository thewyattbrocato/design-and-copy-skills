<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spokeline – Saved routes</title>
<style>
  :root {
    --ink: #14181d;
    --muted: #5b636d;
    --line: #e4e7eb;
    --bg: #ffffff;
    --soft: #f4f5f7;
    --accent: #c4401a;
    --accent-dark: #a63413;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9ebee; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  header {
    padding: 56px 24px 8px;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  main {
    flex: 1;
    padding: 0 24px 24px;
    overflow-y: auto;
  }

  /* Empty state hero */
  .empty {
    text-align: center;
    padding: 28px 0 32px;
  }
  .badge {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--soft);
    display: grid; place-items: center;
    margin: 0 auto 20px;
    color: var(--ink);
  }
  .empty h2 {
    font-size: 26px;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .empty p {
    margin: 10px auto 0;
    max-width: 280px;
    font-size: 15px;
    line-height: 1.45;
    color: var(--muted);
  }
  .primary {
    margin-top: 24px;
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer;
  }
  .primary:hover { background: var(--accent-dark); }
  .hint {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }

  /* Popular nearby */
  .nearby h3 {
    font-size: 17px;
    font-weight: 650;
    font-weight: 600;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .nearby ul { list-style: none; margin-top: 4px; }
  .nearby li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .nearby li:last-child { border-bottom: 0; }
  .route { flex: 1; min-width: 0; }
  .route b {
    display: block;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .route span {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    color: var(--muted);
  }
  .save {
    min-width: 64px; height: 44px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid #c9ced4;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .save:hover { background: var(--soft); }

  /* Tab bar */
  nav {
    position: sticky; bottom: 0;
    display: flex;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 8px 4px calc(10px + env(safe-area-inset-bottom));
  }
  nav a {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 4px 0;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
  }
  nav a[aria-current="page"] {
    color: var(--accent);
    font-weight: 700;
  }
  nav svg { display: block; }
  :focus-visible { outline: 3px solid #1b6ef3; outline-offset: 2px; }
</style>
</head>
<body>
<div class="screen">
  <header><h1>Saved routes</h1></header>

  <main>
    <section class="empty" aria-labelledby="empty-title">
      <div class="badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
      </div>
      <h2 id="empty-title">No saved routes yet</h2>
      <p>Saving a route keeps it available offline and shows it on your watch.</p>
      <button class="primary" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
        Import a route file
      </button>
      <div class="hint">GPX, TCX or FIT</div>
    </section>

    <section class="nearby" aria-labelledby="nearby-title">
      <h3 id="nearby-title">Popular nearby</h3>
      <ul>
        <li>
          <div class="route"><b>Riverside Loop</b><span>32 km · 240 m climb</span></div>
          <button class="save" type="button" aria-label="Save Riverside Loop">Save</button>
        </li>
        <li>
          <div class="route"><b>Hawk Hill Climb</b><span>18 km · 610 m climb</span></div>
          <button class="save" type="button" aria-label="Save Hawk Hill Climb">Save</button>
        </li>
        <li>
          <div class="route"><b>Old Mill Gravel</b><span>54 km · 480 m climb</span></div>
          <button class="save" type="button" aria-label="Save Old Mill Gravel">Save</button>
        </li>
      </ul>
    </section>
  </main>

  <nav aria-label="Main">
    <a href="#">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="#" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
      Saved routes
    </a>
    <a href="#">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
      Record
    </a>
    <a href="#">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6"/></svg>
      Profile
    </a>
  </nav>
</div>
</body>
</html>
