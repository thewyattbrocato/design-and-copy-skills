<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --ink: #1b1d21;
    --ink-2: #555b66;
    --line: #e4e4e0;
    --accent: #2f4fd8;
    --accent-dark: #2340b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
  }
  nav {
    width: 224px;
    flex: none;
    padding: 24px 16px;
    border-right: 1px solid var(--line);
    background: var(--surface);
  }
  nav .brand { font-weight: 700; font-size: 16px; padding: 0 12px 24px; }
  nav a {
    display: block;
    padding: 8px 12px;
    margin-bottom: 2px;
    border-radius: 6px;
    color: var(--ink-2);
    text-decoration: none;
    font-size: 14px;
  }
  nav a[aria-current="page"] { background: #eef0f6; color: var(--ink); font-weight: 600; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 24px 48px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px 96px;
    text-align: center;
  }
  .empty-inner { max-width: 440px; }
  .empty h2 {
    margin: 0 0 12px;
    font-size: 32px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .empty p {
    margin: 0 0 32px;
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink-2);
  }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:focus-visible, .help:focus-visible { outline: 3px solid #9db0ff; outline-offset: 3px; }
  .help-row { margin-top: 24px; font-size: 14px; color: var(--ink-2); }
  .help { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 720px) { nav { display: none; } header { padding: 20px 24px; } }
</style>
</head>
<body>
  <nav aria-label="Main">
    <div class="brand">Tasks</div>
    <a href="#">Inbox</a>
    <a href="#">Today</a>
    <a href="#" aria-current="page">Projects</a>
    <a href="#">Settings</a>
  </nav>
  <main>
    <header><h1>Projects</h1></header>
    <section class="empty" aria-labelledby="empty-title">
      <div class="empty-inner">
        <h2 id="empty-title">Start your first project</h2>
        <p>A project groups related tasks in one place, like a launch, a trip or a home renovation, so you can see what's done and what's next.</p>
        <button class="btn" type="button">Create project</button>
        <div class="help-row">New to projects? <a class="help" href="#guide">Read the guide</a></div>
      </div>
    </section>
  </main>
</body>
</html>
