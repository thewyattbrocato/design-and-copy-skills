<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidewater Coffee: Milk Steaming Quiz</title>
<style>
  :root {
    --bg: #f7f3ee;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #6e5f52;
    --accent: #6b4226;
    --accent-ink: #ffffff;
    --good: #2e7d4f;
    --good-bg: #e6f4ec;
    --bad: #a33a2b;
    --bad-bg: #f9e7e4;
    --line: #e2d8cc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  header h1 { font-size: 1.4rem; margin: 0 0 4px; color: var(--accent); }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(43, 33, 24, 0.06);
  }
  .progress {
    height: 8px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }
  .counter { font-size: 0.9rem; color: var(--muted); margin-bottom: 16px; }
  .question { font-size: 1.2rem; font-weight: 600; margin: 0 0 20px; }
  .options { display: grid; gap: 10px; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    min-height: 56px;
    cursor: pointer;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:focus-visible, .btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .option:disabled { cursor: default; }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback p { margin: 0; color: var(--ink); }
  .actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  .btn {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    min-height: 48px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .result { text-align: center; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); margin: 8px 0; }
  .result .verdict { font-size: 1.1rem; margin: 0 0 8px; }
  .result .note { color: var(--muted); margin: 0 0 24px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tidewater Coffee: Milk Steaming Quiz</h1>
    <p>Complete this after your milk steaming half-day.</p>
  </header>

  <main class="card">
    <section id="quiz">
      <div class="progress" aria-hidden="true"><div class="progress-bar" id="bar"></div></div>
      <div class="counter" id="counter"></div>
      <h2 class="question" id="question"></h2>
      <div class="options" id="options" role="group" aria-labelledby="question"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite">
        <strong id="fbTitle"></strong>
        <p id="fbText"></p>
      </div>
      <div class="actions">
        <button class="btn" id="nextBtn" disabled>Next</button>
      </div>
    </section>

    <section id="result" class="result hidden">
      <p class="verdict" id="verdict"></p>
      <div class="score" id="score"></div>
      <p class="note" id="note"></p>
      <button class="btn" id="restartBtn">Take it again</button>
    </section>
  </main>
</div>

<script>
  const questions = [
    {
      q: "What is the target milk temperature range?",
      options: ["40 to 50 C", "55 to 65 C", "70 to 80 C", "85 to 95 C"],
      answer: 1,
      explain: "The target is 55 to 65 C. Stop there so the milk stays sweet and is at a good drinking temperature."
    },
    {
      q: "What happens if milk goes over 70 C?",
      options: [
        "The foam gets thicker",
        "The milk scalds and loses its sweetness",
        "Nothing, hotter milk is always better",
        "The milk becomes sweeter"
      ],
      answer: 1,
      explain: "Anything over 70 C scalds the milk and kills the sweetness. Pull the pitcher before it gets there."
    },
    {
      q: "When do you add air to the milk?",
      options: [
        "Late, once the milk is already hot",
        "Early, while the milk is still cold",
        "Never. Only heat the milk.",
        "Only after you have lowered the tip"
      ],
      answer: 1,
      explain: "Add air early, while the milk is still cold. Air goes in during the first stage of steaming."
    },
    {
      q: "Once you have added air, what do you do with the steam tip?",
      options: [
        "Keep it at the surface and keep stretching",
        "Lower the tip so the milk rolls",
        "Pull the pitcher away from the wand",
        "Turn the steam off right away"
      ],
      answer: 1,
      explain: "Lower the tip and let the milk roll. This folds the foam into the milk and heats it evenly."
    },
    {
      q: "When should you wipe the steam wand?",
      options: [
        "Before steaming only",
        "Right after steaming",
        "Never. The wand cleans itself.",
        "Only at the end of the shift"
      ],
      answer: 1,
      explain: "Wipe the wand right after every steam so milk does not dry and bake onto it."
    },
    {
      q: "When do you purge the steam wand?",
      options: [
        "Before steaming only",
        "After steaming only",
        "Before and after steaming",
        "Neither. Purging is optional."
      ],
      answer: 2,
      explain: "Purge the wand before and after every steam to clear out any milk and water."
    },
    {
      q: "How does oat milk compare to dairy when steaming?",
      options: [
        "It heats slower, and the foam holds longer",
        "It heats faster, and the foam falls apart sooner",
        "It behaves exactly like dairy",
        "It cannot be steamed"
      ],
      answer: 1,
      explain: "Oat milk heats faster than dairy and its foam falls apart sooner. Watch the temperature and pour quickly."
    }
  ];

  const state = { index: 0, score: 0, answered: false };

  const el = {
    quiz: document.getElementById("quiz"),
    result: document.getElementById("result"),
    bar: document.getElementById("bar"),
    counter: document.getElementById("counter"),
    question: document.getElementById("question"),
    options: document.getElementById("options"),
    feedback: document.getElementById("feedback"),
    fbTitle: document.getElementById("fbTitle"),
    fbText: document.getElementById("fbText"),
    nextBtn: document.getElementById("nextBtn"),
    verdict: document.getElementById("verdict"),
    score: document.getElementById("score"),
    note: document.getElementById("note"),
    restartBtn: document.getElementById("restartBtn")
  };

  function render() {
    const item = questions[state.index];
    state.answered = false;
    el.bar.style.width = (state.index / questions.length) * 100 + "%";
    el.counter.textContent = "Question " + (state.index + 1) + " of " + questions.length;
    el.question.textContent = item.q;
    el.options.innerHTML = "";
    item.options.forEach(function (text, i) {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.type = "button";
      btn.textContent = text;
      btn.addEventListener("click", function () { choose(i); });
      el.options.appendChild(btn);
    });
    el.feedback.classList.remove("show", "good", "bad");
    el.nextBtn.disabled = true;
    el.nextBtn.textContent = state.index === questions.length - 1 ? "See result" : "Next";
    el.options.querySelector(".option").focus();
  }

  function choose(i) {
    if (state.answered) return;
    state.answered = true;
    const item = questions[state.index];
    const buttons = el.options.querySelectorAll(".option");
    buttons.forEach(function (b) { b.disabled = true; });
    buttons[item.answer].classList.add("correct");

    const correct = i === item.answer;
    if (correct) {
      state.score++;
    } else {
      buttons[i].classList.add("wrong");
    }

    el.feedback.classList.add("show", correct ? "good" : "bad");
    el.fbTitle.textContent = correct ? "Correct" : "Not quite";
    el.fbText.textContent = item.explain;
    el.nextBtn.disabled = false;
    el.nextBtn.focus();
  }

  function next() {
    if (!state.answered) return;
    state.index++;
    if (state.index < questions.length) {
      render();
    } else {
      showResult();
    }
  }

  function showResult() {
    el.bar.style.width = "100%";
    el.quiz.classList.add("hidden");
    el.result.classList.remove("hidden");
    const total = questions.length;
    const pct = Math.round((state.score / total) * 100);
    el.score.textContent = state.score + " / " + total;
    if (pct === 100) {
      el.verdict.textContent = "Perfect score. You are ready for the counter.";
      el.note.textContent = "Nice work. Keep the milk between 55 and 65 C.";
    } else if (pct >= 70) {
      el.verdict.textContent = "Good work. Review the questions you missed.";
      el.note.textContent = "Take it again to lock in the points you missed.";
    } else {
      el.verdict.textContent = "Keep practicing. Ask your shift lead to walk through it with you.";
      el.note.textContent = "Review the temperature range, the wand routine, and the oat milk notes, then retake the quiz.";
    }
    el.restartBtn.focus();
  }

  function restart() {
    state.index = 0;
    state.score = 0;
    el.result.classList.add("hidden");
    el.quiz.classList.remove("hidden");
    render();
  }

  el.nextBtn.addEventListener("click", next);
  el.restartBtn.addEventListener("click", restart);
  render();
</script>
</body>
</html>
