<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Tidewater Coffee · Milk Steaming Quiz</title>
<style>
  :root {
    --bg: #f6f1ea;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #6e6358;
    --accent: #2f5d62;
    --good: #2e7d4f;
    --good-bg: #e8f4ec;
    --bad: #b03a2e;
    --bad-bg: #f8e7e5;
    --line: #e2d8cb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  header, main { width: 100%; max-width: 720px; }
  .brand {
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  h1 { font-size: 28px; margin: 6px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(43, 33, 24, 0.05);
  }
  .progress {
    height: 8px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress > div {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .count { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .question { font-size: 20px; line-height: 1.4; font-weight: 600; margin: 0 0 18px; }
  .options { display: grid; gap: 10px; }
  .option {
    font: inherit;
    font-size: 18px;
    text-align: left;
    min-height: 56px;
    padding: 16px 18px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:disabled { cursor: default; }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .feedback {
    display: none;
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 16px;
    line-height: 1.45;
  }
  .feedback.good { display: block; background: var(--good-bg); color: #1f5a36; }
  .feedback.bad { display: block; background: var(--bad-bg); color: #7a2a20; }
  .actions { margin-top: 18px; display: flex; justify-content: flex-end; }
  .primary {
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    min-height: 52px;
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .score { font-size: 56px; font-weight: 700; color: var(--accent); margin: 8px 0 4px; }
  .verdict { font-size: 18px; margin: 0 0 18px; }
  h2 { font-size: 18px; margin: 24px 0 10px; }
  ul.review { padding-left: 20px; margin: 0; }
  ul.review li { margin-bottom: 10px; line-height: 1.4; }
  .ans { color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="brand">Tidewater Coffee</div>
  <h1>Milk Steaming Quiz</h1>
  <p class="sub">Answer each question. You'll see the reason after every answer.</p>
</header>

<main>
  <section id="quiz" class="card">
    <div class="progress"><div id="progressBar"></div></div>
    <div class="count" id="count"></div>
    <p class="question" id="question"></p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="actions">
      <button class="primary" id="next" type="button" disabled>Next</button>
    </div>
  </section>

  <section id="results" class="card hidden">
    <div class="brand">Your result</div>
    <div class="score" id="score"></div>
    <p class="verdict" id="verdict"></p>
    <div id="reviewBlock" class="hidden">
      <h2>To review</h2>
      <ul class="review" id="reviewList"></ul>
    </div>
    <div class="actions">
      <button class="primary" id="retake" type="button">Take it again</button>
    </div>
  </section>
</main>

<script>
  // Share of questions that must be right to pass.
  const PASS_MARK = 0.8;

  const QUESTIONS = [
    {
      q: "What is the target temperature range for steamed milk?",
      options: ["40 to 50 C", "55 to 65 C", "70 to 80 C", "85 to 95 C"],
      answer: 1,
      explain: "The target is 55 to 65 C. Above 70 C the milk scalds and loses its sweetness."
    },
    {
      q: "The milk has gone over 70 C. What's the problem?",
      options: [
        "Nothing, it's just hotter",
        "It scalds and loses its sweetness",
        "The foam gets too thick to pour",
        "It's fine as long as it stays under 80 C"
      ],
      answer: 1,
      explain: "Anything over 70 C scalds the milk and kills the sweetness."
    },
    {
      q: "When do you add air to the milk?",
      options: [
        "Right at the end, once it's hot",
        "Early, while the milk is still cold",
        "Only after you lower the tip",
        "Halfway through, once it's warm"
      ],
      answer: 1,
      explain: "Add air early while the milk is still cold. Then lower the tip and let it roll."
    },
    {
      q: "Once you've added air, what do you do next?",
      options: [
        "Keep the tip at the surface and add more air",
        "Lower the tip so the milk rolls",
        "Raise the tip above the milk",
        "Turn off the steam and walk away"
      ],
      answer: 1,
      explain: "Lower the tip and let the milk roll."
    },
    {
      q: "When should you wipe the steam wand?",
      options: [
        "Only before you start steaming",
        "Right after steaming",
        "At the end of the shift",
        "Only when it looks dirty"
      ],
      answer: 1,
      explain: "Wipe the wand right after every steam so milk doesn't dry on it."
    },
    {
      q: "When should you purge the steam wand?",
      options: [
        "Only at the end of the shift",
        "Before and after steaming",
        "Only before steaming",
        "Only after steaming"
      ],
      answer: 1,
      explain: "Purge the wand before and after every steam."
    },
    {
      q: "Compared with dairy, how does oat milk behave?",
      options: [
        "It heats slower and holds its foam longer",
        "It heats faster and its foam falls apart sooner",
        "It heats at the same rate and foams the same way",
        "It doesn't need to be watched on the thermometer"
      ],
      answer: 1,
      explain: "Oat milk heats faster than dairy, so watch the thermometer closely. Its foam also breaks down sooner, so don't let it sit."
    },
    {
      q: "You're steaming a pitcher for a latte and the thermometer reads 72 C. What do you do?",
      options: [
        "Serve it, 72 is close enough",
        "Don't serve it. It's past 70 C and has scalded",
        "Add cold milk to bring the temperature down",
        "Keep steaming until it reaches 80 C"
      ],
      answer: 1,
      explain: "Milk over 70 C has scalded and lost its sweetness, so don't serve it."
    }
  ];

  let current = 0;
  let score = 0;
  let missed = [];
  let answered = false;

  const $ = id => document.getElementById(id);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function showQuestion() {
    const item = QUESTIONS[current];
    answered = false;

    $('progressBar').style.width = (current / QUESTIONS.length * 100) + '%';
    $('count').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
    $('question').textContent = item.q;

    const box = $('options');
    box.textContent = '';
    item.options.forEach((text, i) => {
      const button = el('button', 'option', text);
      button.type = 'button';
      button.addEventListener('click', () => choose(i));
      box.appendChild(button);
    });

    const feedback = $('feedback');
    feedback.className = 'feedback';
    feedback.textContent = '';

    const next = $('next');
    next.disabled = true;
    next.textContent = current === QUESTIONS.length - 1 ? 'See results' : 'Next';
  }

  function choose(index) {
    if (answered) return;
    answered = true;

    const item = QUESTIONS[current];
    const buttons = Array.from($('options').children);
    buttons.forEach(b => { b.disabled = true; });
    buttons[item.answer].classList.add('correct');

    const correct = index === item.answer;
    if (correct) {
      score++;
    } else {
      buttons[index].classList.add('wrong');
      missed.push(current);
    }

    const feedback = $('feedback');
    feedback.className = 'feedback ' + (correct ? 'good' : 'bad');
    feedback.textContent = (correct ? 'Correct. ' : 'Not quite. ') + item.explain;

    $('next').disabled = false;
  }

  function nextQuestion() {
    current++;
    if (current < QUESTIONS.length) {
      showQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    $('quiz').classList.add('hidden');
    $('results').classList.remove('hidden');
    $('progressBar').style.width = '100%';

    const passed = score / QUESTIONS.length >= PASS_MARK;
    $('score').textContent = `${score} / ${QUESTIONS.length}`;
    $('verdict').textContent = passed
      ? "Passed. Nice work on the basics."
      : "Not yet. Go over the questions below and try again.";

    const block = $('reviewBlock');
    const list = $('reviewList');
    list.textContent = '';
    if (missed.length) {
      missed.forEach(i => {
        const item = QUESTIONS[i];
        const li = el('li');
        li.appendChild(el('div', '', item.q));
        li.appendChild(el('div', 'ans', 'Answer: ' + item.options[item.answer]));
        list.appendChild(li);
      });
      block.classList.remove('hidden');
    } else {
      block.classList.add('hidden');
    }
  }

  function restart() {
    current = 0;
    score = 0;
    missed = [];
    $('results').classList.add('hidden');
    $('quiz').classList.remove('hidden');
    showQuestion();
  }

  $('next').addEventListener('click', nextQuestion);
  $('retake').addEventListener('click', restart);

  showQuestion();
</script>
</body>
</html>
