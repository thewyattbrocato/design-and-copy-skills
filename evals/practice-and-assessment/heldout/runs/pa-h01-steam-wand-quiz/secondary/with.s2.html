<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidewater Coffee: Milk Steaming Quiz</title>
<style>
  :root {
    --bg: #f7f3ee;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #6e6257;
    --accent: #7a4a2b;
    --accent-ink: #ffffff;
    --good: #2e6b3a;
    --good-bg: #e4f2e6;
    --bad: #9a2e25;
    --bad-bg: #f8e3e0;
    --border: #d9cfc4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 680px; }
  header h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--accent); }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(43, 33, 24, 0.06);
  }
  .progress {
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .question {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0 0 18px;
  }
  .options { display: grid; gap: 10px; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    min-height: 52px;
    cursor: pointer;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:focus-visible, .btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .option:disabled { cursor: default; }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback .explain { color: var(--ink); font-size: 0.97rem; }
  .actions { margin-top: 20px; display: flex; justify-content: flex-end; }
  .btn {
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    min-height: 48px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .result { text-align: center; padding: 12px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); margin: 8px 0; }
  .result .verdict { font-size: 1.1rem; margin: 0 0 16px; }
  .review { text-align: left; margin: 20px 0; padding: 0; list-style: none; }
  .review li {
    padding: 10px 0;
    border-top: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .review li:first-child { border-top: none; }
  .review .mark { font-weight: 700; }
  .review .mark.ok { color: var(--good); }
  .review .mark.no { color: var(--bad); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tidewater Coffee: Milk Steaming Quiz</h1>
    <p>Complete this after your milk steaming half-day. Tap an answer to see the explanation.</p>
  </header>

  <main class="card">
    <section id="quiz">
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="meta">
        <span id="counter"></span>
        <span id="running"></span>
      </div>
      <h2 class="question" id="question"></h2>
      <div class="options" id="options" role="group" aria-labelledby="question"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite">
        <strong id="fb-title"></strong>
        <div class="explain" id="fb-text"></div>
      </div>
      <div class="actions">
        <button class="btn" id="next" disabled>Next</button>
      </div>
    </section>

    <section id="result" class="result hidden">
      <p>Your score</p>
      <div class="score" id="final-score"></div>
      <p class="verdict" id="verdict"></p>
      <ul class="review" id="review"></ul>
      <button class="btn" id="restart">Take it again</button>
    </section>
  </main>
</div>

<script>
  const questions = [
    {
      q: "What is the target milk temperature when you steam?",
      options: ["40 to 50 C", "55 to 65 C", "70 to 80 C", "85 to 95 C"],
      answer: 1,
      explain: "Aim for 55 to 65 C. Above 70 C the milk scalds and loses its sweetness."
    },
    {
      q: "The milk in the pitcher reads 74 C. What is wrong?",
      options: [
        "Nothing, it is within a safe range",
        "It is too cold to texture properly",
        "It has scalded and lost its sweetness",
        "It needs more air"
      ],
      answer: 2,
      explain: "Anything over 70 C scalds the milk and kills the sweetness. Pull it before it gets there."
    },
    {
      q: "When do you introduce air into the milk?",
      options: [
        "Late, once the milk is hot",
        "Early, while the milk is still cold",
        "Never, air comes from the tip alone",
        "Only after the milk has started to roll"
      ],
      answer: 1,
      explain: "Add air early while the milk is still cold. Once the milk is hot, you should not be adding air."
    },
    {
      q: "After you have added air, what do you do with the steam wand?",
      options: [
        "Raise the tip out of the milk",
        "Lower the tip so the milk rolls",
        "Turn the steam off completely",
        "Move the pitcher away from the wand"
      ],
      answer: 1,
      explain: "Lower the tip so the milk rolls. This builds the texture and keeps the foam integrated."
    },
    {
      q: "When should you wipe the steam wand?",
      options: [
        "Only at the end of the shift",
        "Only when it looks dirty",
        "Right after steaming",
        "Before you steam, never after"
      ],
      answer: 2,
      explain: "Wipe the wand right after every steam, while the milk residue is still soft."
    },
    {
      q: "When should you purge the steam wand?",
      options: [
        "Only before steaming",
        "Only after steaming",
        "Neither, purging wastes steam",
        "Both before and after steaming"
      ],
      answer: 3,
      explain: "Purge before and after every steam to clear out any milk and keep the wand clean."
    },
    {
      q: "How does oat milk compare to dairy when steaming?",
      options: [
        "It heats more slowly and holds foam longer",
        "It heats faster and its foam falls apart sooner",
        "It heats at the same rate and foams the same way",
        "It cannot be steamed at all"
      ],
      answer: 1,
      explain: "Oat milk heats faster than dairy and its foam falls apart sooner. Watch it closely."
    },
    {
      q: "Because oat milk heats faster than dairy, what does that mean for you?",
      options: [
        "You have more time before it scalds",
        "You have less margin before it passes 70 C",
        "You can skip checking the temperature",
        "You should add more air at the end"
      ],
      answer: 1,
      explain: "Oat milk reaches 70 C sooner, so you have less margin. Keep an eye on the pitcher and stop in the 55 to 65 C range."
    }
  ];

  let current = 0;
  let score = 0;
  let answered = false;
  const log = [];

  const $ = id => document.getElementById(id);

  function render() {
    const item = questions[current];
    answered = false;
    $("counter").textContent = `Question ${current + 1} of ${questions.length}`;
    $("running").textContent = `Score: ${score}`;
    $("bar").style.width = `${(current / questions.length) * 100}%`;
    $("question").textContent = item.q;
    $("feedback").className = "feedback";
    $("fb-title").textContent = "";
    $("fb-text").textContent = "";
    $("next").disabled = true;
    $("next").textContent = current === questions.length - 1 ? "See results" : "Next";

    const wrap = $("options");
    wrap.textContent = "";
    item.options.forEach((text, i) => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.type = "button";
      btn.textContent = text;
      btn.addEventListener("click", () => choose(i));
      wrap.appendChild(btn);
    });
  }

  function choose(index) {
    if (answered) return;
    answered = true;
    const item = questions[current];
    const buttons = document.querySelectorAll(".option");
    buttons.forEach(b => b.disabled = true);

    const correct = index === item.answer;
    if (correct) score++;
    log.push(correct);

    buttons[item.answer].classList.add("correct");
    if (!correct) buttons[index].classList.add("wrong");

    const fb = $("feedback");
    fb.classList.add("show", correct ? "good" : "bad");
    $("fb-title").textContent = correct ? "Correct" : "Not quite";
    $("fb-text").textContent = item.explain;
    $("running").textContent = `Score: ${score}`;
    $("next").disabled = false;
    $("next").focus();
  }

  function finish() {
    $("quiz").classList.add("hidden");
    $("result").classList.remove("hidden");
    $("final-score").textContent = `${score} / ${questions.length}`;

    const pct = score / questions.length;
    let verdict;
    if (pct === 1) verdict = "Perfect. You are ready for the counter.";
    else if (pct >= 0.75) verdict = "Solid work. Review the misses below before your first shift.";
    else verdict = "Go over the steaming notes again and retake the quiz with your trainer.";
    $("verdict").textContent = verdict;

    const list = $("review");
    list.textContent = "";
    questions.forEach((item, i) => {
      const li = document.createElement("li");
      const mark = document.createElement("span");
      mark.className = `mark ${log[i] ? "ok" : "no"}`;
      mark.textContent = log[i] ? "Correct: " : "Missed: ";
      li.appendChild(mark);
      li.appendChild(document.createTextNode(item.q));
      list.appendChild(li);
    });
    $("bar").style.width = "100%";
    $("restart").focus();
  }

  $("next").addEventListener("click", () => {
    if (current < questions.length - 1) {
      current++;
      render();
    } else {
      finish();
    }
  });

  $("restart").addEventListener("click", () => {
    current = 0;
    score = 0;
    log.length = 0;
    $("result").classList.add("hidden");
    $("quiz").classList.remove("hidden");
    render();
  });

  render();
</script>
</body>
</html>
