<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidewater Coffee: Milk Steaming Quiz</title>
<style>
  :root {
    --bg: #f7f3ee;
    --card: #ffffff;
    --ink: #2b211b;
    --muted: #6e6259;
    --accent: #7a4a2b;
    --accent-ink: #ffffff;
    --good: #2f6b3a;
    --good-bg: #e4f2e6;
    --bad: #8a2a22;
    --bad-bg: #f7e3e0;
    --line: #e2d8cc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.45;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 680px; }
  header { margin-bottom: 16px; }
  header h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--accent); }
  header p { margin: 0; color: var(--muted); }
  .progress {
    height: 8px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin: 16px 0 20px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(43, 33, 27, 0.06);
  }
  .meta { font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; }
  .question { font-size: 1.25rem; font-weight: 600; margin: 0 0 18px; }
  .options { display: grid; gap: 10px; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    min-height: 56px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .option:disabled { cursor default; }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback p { margin: 0; color: var(--ink); }
  .actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  .btn {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    min-height: 52px;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btn[hidden] { display: none; }
  .result { text-align: center; padding: 16px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); margin: 8px 0; }
  .result p { color: var(--muted); margin: 6px 0 20px; }
  .result .btn { margin: 0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tidewater Coffee: Milk Steaming Quiz</h1>
    <p>Check what you learned in your milk steaming half-day.</p>
  </header>

  <div class="progress" aria-hidden="true"><div class="progress-bar" id="bar"></div></div>

  <main class="card" id="app" aria-live="polite"></main>
</div>

<script>
  const questions = [
    {
      q: "What is the target milk temperature range?",
      options: ["40 to 50 C", "55 to 65 C", "70 to 80 C", "85 to 95 C"],
      answer: 1,
      explain: "Aim for 55 to 65 C. That range keeps the milk sweet and textured."
    },
    {
      q: "What happens if milk goes over 70 C?",
      options: [
        "The foam gets finer",
        "Nothing noticeable",
        "It scalds the milk and kills the sweetness",
        "It thickens the milk"
      ],
      answer: 2,
      explain: "Above 70 C the milk scalds and loses its sweetness. Pull the pitcher before it gets there."
    },
    {
      q: "When do you add air to the milk?",
      options: [
        "At the very end, once the milk is hot",
        "Early, while the milk is still cold",
        "Never. Steam only heats the milk.",
        "Only after the milk passes 70 C"
      ],
      answer: 1,
      explain: "Add air early while the milk is cold. Then lower the tip and let the milk roll."
    },
    {
      q: "After you add air, what should you do with the steam wand?",
      options: [
        "Keep it at the surface and keep stretching",
        "Pull it out of the milk entirely",
        "Lower the tip so the milk rolls",
        "Turn the steam off and let the milk sit"
      ],
      answer: 2,
      explain: "Lower the tip so the milk rolls in a whirlpool. This blends the foam into the milk."
    },
    {
      q: "When should you wipe the steam wand?",
      options: [
        "Before you start steaming",
        "Only at closing time",
        "Right after steaming",
        "Never. Wiping dulls the wand."
      ],
      answer: 2,
      explain: "Wipe the wand right after every steam so milk does not dry and bake onto it."
    },
    {
      q: "When should you purge the steam wand?",
      options: [
        "Only at the end of the shift",
        "Before and after steaming",
        "Only before steaming",
        "Never. Purging wastes steam."
      ],
      answer: 1,
      explain: "Purge before and after each steam to clear out milk and water in the wand."
    },
    {
      q: "How does oat milk compare to dairy when steaming?",
      options: [
        "It heats slower and holds its foam longer",
        "It heats faster and its foam falls apart sooner",
        "It behaves exactly like dairy",
        "It cannot be steamed"
      ],
      answer: 1,
      explain: "Oat milk heats faster than dairy, and its foam falls apart sooner. Watch the temperature closely and pour promptly."
    }
  ];

  const app = document.getElementById("app");
  const bar = document.getElementById("bar");
  let index = 0;
  let score = 0;

  function setProgress(done) {
    bar.style.width = (done / questions.length * 100) + "%";
  }

  function renderQuestion() {
    const item = questions[index];
    setProgress(index);
    app.textContent = "";

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "Question " + (index + 1) + " of " + questions.length;

    const q = document.createElement("h2");
    q.className = "question";
    q.textContent = item.q;

    const list = document.createElement("div");
    list.className = "options";

    const feedback = document.createElement("div");
    feedback.className = "feedback";
    feedback.setAttribute("role", "status");

    const actions = document.createElement("div");
    actions.className = "actions";
    const next = document.createElement("button");
    next.className = "btn";
    next.hidden = true;
    next.textContent = index === questions.length - 1 ? "See results" : "Next";
    actions.appendChild(next);

    const buttons = item.options.map((text, i) => {
      const b = document.createElement("button");
      b.className = "option";
      b.textContent = text;
      b.addEventListener("click", () => choose(i, buttons, item, feedback, next));
      list.appendChild(b);
      return b;
    });

    next.addEventListener("click", () => {
      index++;
      if (index < questions.length) {
        renderQuestion();
      } else {
        renderResult();
      }
    });

    app.append(meta, q, list, feedback, actions);
  }

  function choose(i, buttons, item, feedback, next) {
    buttons.forEach(b => b.disabled = true);
    const correct = i === item.answer;
    if (correct) {
      score++;
      buttons[i].classList.add("correct");
    } else {
      buttons[i].classList.add("wrong");
      buttons[item.answer].classList.add("correct");
    }

    feedback.className = "feedback show " + (correct ? "good" : "bad");
    feedback.textContent = "";
    const head = document.createElement("strong");
    head.textContent = correct ? "Correct" : "Not quite";
    const body = document.createElement("p");
    body.textContent = item.explain;
    feedback.append(head, body);

    next.hidden = false;
    next.focus();
  }

  function renderResult() {
    setProgress(questions.length);
    app.textContent = "";

    const wrap = document.createElement("div");
    wrap.className = "result";

    const title = document.createElement("h2");
    title.className = "question";
    title.textContent = "Quiz complete";

    const big = document.createElement("div");
    big.className = "score";
    big.textContent = score + " / " + questions.length;

    const msg = document.createElement("p");
    if (score === questions.length) {
      msg.textContent = "Perfect score. You are ready for the bar.";
    } else if (score >= Math.ceil(questions.length * 0.7)) {
      msg.textContent = "Good work. Review any questions you missed with your trainer.";
    } else {
      msg.textContent = "Review the half-day material and try again with your trainer.";
    }

    const restart = document.createElement("button");
    restart.className = "btn";
    restart.textContent = "Take it again";
    restart.addEventListener("click", () => {
      index = 0;
      score = 0;
      renderQuestion();
    });

    wrap.append(title, big, msg, restart);
    app.appendChild(wrap);
  }

  renderQuestion();
</script>
</body>
</html>
