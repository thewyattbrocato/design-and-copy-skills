<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidewater Coffee: Milk Steaming Quiz</title>
<style>
  :root {
    --bg: #f7f3ee;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #6e6257;
    --accent: #7a4a2b;
    --accent-ink: #ffffff;
    --good: #2e7d4f;
    --bad: #b03a2e;
    --line: #e3d9cd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 20px;
    line-height: 1.4;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  header h1 { margin: 0 0 4px; font-size: 1.1em; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 0.85em; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 2px 10px rgba(43, 33, 24, 0.06);
  }
  .progress {
    height: 8px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar { height: 100%; width: 0; background: var(--accent); transition: width 0.3s ease; }
  .count { font-size: 0.8em; color: var(--muted); margin-bottom: 18px; }
  .question { font-size: 1.25em; font-weight: 600; margin: 0 0 20px; }
  .options { display: grid; gap: 12px; }
  button.option {
    font: inherit;
    text-align: left;
    padding: 16px 18px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    min-height: 56px;
  }
  button.option:hover:not(:disabled) { border-color: var(--accent); }
  button.option:focus-visible, button.primary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.option:disabled { cursor: default; }
  button.option.correct { border-color: var(--good); background: #e8f4ec; }
  button.option.wrong { border-color: var(--bad); background: #f8e7e5; }
  .feedback {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 12px;
    background: var(--bg);
    display: none;
  }
  .feedback.show { display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback.good strong { color: var(--good); }
  .feedback.bad strong { color: var(--bad); }
  .actions { margin-top: 22px; display: flex; justify-content: flex-end; }
  button.primary {
    font: inherit;
    font-weight: 600;
    padding: 14px 26px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    min-height: 52px;
    display: none;
  }
  button.primary.show { display: inline-block; }
  .result { text-align: center; }
  .result .score { font-size: 3em; font-weight: 700; color: var(--accent); margin: 8px 0; }
  .result p { color: var(--muted); margin: 8px 0 24px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tidewater Coffee</h1>
    <p>Milk steaming check, after your half-day session</p>
  </header>

  <main class="card" id="app">
    <div id="quiz">
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="count" id="count"></div>
      <h2 class="question" id="question"></h2>
      <div class="options" id="options" role="group" aria-label="Answer options"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite">
        <strong id="fbTitle"></strong>
        <span id="fbText"></span>
      </div>
      <div class="actions">
        <button class="primary" id="nextBtn" type="button">Next</button>
      </div>
    </div>

    <div id="result" class="result hidden">
      <h2>Quiz complete</h2>
      <div class="score" id="score"></div>
      <p id="resultMsg"></p>
      <button class="primary show" id="restartBtn" type="button">Take it again</button>
    </div>
  </main>
</div>

<script>
  var QUESTIONS = [
    {
      q: "What is the target milk temperature when steaming?",
      options: ["40 to 50 C", "55 to 65 C", "70 to 80 C", "85 to 95 C"],
      answer: 1,
      why: "Aim for 55 to 65 C. That range keeps the milk sweet and textured."
    },
    {
      q: "What happens if milk goes over 70 C?",
      options: ["It gets thicker and sweeter", "It scalds and loses its sweetness", "The foam becomes finer", "Nothing noticeable changes"],
      answer: 1,
      why: "Anything over 70 C scalds the milk and kills the sweetness. Pull the pitcher before it gets there."
    },
    {
      q: "When do you add air to the milk?",
      options: ["Right after the milk hits 70 C", "Only at the very end", "Early, while the milk is still cold", "Never, the wand only heats"],
      answer: 2,
      why: "Add air early while the milk is still cold. Then lower the tip and let the milk roll."
    },
    {
      q: "Once you have added air, what should you do?",
      options: ["Keep the tip at the surface and add more air", "Lower the tip so the milk rolls", "Pull the wand out of the milk right away", "Turn the steam off and wait"],
      answer: 1,
      why: "After the early air, lower the tip and let the milk roll. This blends the foam into the milk."
    },
    {
      q: "What do you do with the steam wand right after steaming?",
      options: ["Leave it to cool on its own", "Dunk it in cold water", "Wipe it down right away", "Wipe it at the end of the shift"],
      answer: 2,
      why: "Wipe the wand right after steaming so milk does not dry and bake onto it."
    },
    {
      q: "When should you purge the steam wand?",
      options: ["Only before steaming", "Only after steaming", "Before and after steaming", "Never, purging wastes steam"],
      answer: 2,
      why: "Purge before and after every steam to clear milk out of the wand."
    },
    {
      q: "How does oat milk compare to dairy when steaming?",
      options: ["It heats slower and holds foam longer", "It heats faster and its foam falls apart sooner", "It behaves exactly like dairy", "It needs no air at all"],
      answer: 1,
      why: "Oat milk heats faster than dairy, and its foam falls apart sooner. Watch the temperature and serve it promptly."
    }
  ];

  var state = { index: 0, score: 0, answered: false };

  var els = {
    quiz: document.getElementById("quiz"),
    result: document.getElementById("result"),
    bar: document.getElementById("bar"),
    count: document.getElementById("count"),
    question: document.getElementById("question"),
    options: document.getElementById("options"),
    feedback: document.getElementById("feedback"),
    fbTitle: document.getElementById("fbTitle"),
    fbText: document.getElementById("fbText"),
    nextBtn: document.getElementById("nextBtn"),
    score: document.getElementById("score"),
    resultMsg: document.getElementById("resultMsg"),
    restartBtn: document.getElementById("restartBtn")
  };

  function render() {
    var item = QUESTIONS[state.index];
    state.answered = false;
    els.bar.style.width = (state.index / QUESTIONS.length * 100) + "%";
    els.count.textContent = "Question " + (state.index + 1) + " of " + QUESTIONS.length;
    els.question.textContent = item.q;
    els.options.innerHTML = "";
    item.options.forEach(function (text, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      btn.textContent = text;
      btn.addEventListener("click", function () { choose(i); });
      els.options.appendChild(btn);
    });
    els.feedback.className = "feedback";
    els.nextBtn.classList.remove("show");
    els.nextBtn.textContent = state.index === QUESTIONS.length - 1 ? "See result" : "Next";
  }

  function choose(i) {
    if (state.answered) return;
    state.answered = true;
    var item = QUESTIONS[state.index];
    var buttons = els.options.querySelectorAll("button.option");
    buttons.forEach(function (b) { b.disabled = true; });
    var correct = i === item.answer;
    if (correct) state.score++;
    buttons[item.answer].classList.add("correct");
    if (!correct) buttons[i].classList.add("wrong");

    els.feedback.className = "feedback show " + (correct ? "good" : "bad");
    els.fbTitle.textContent = correct ? "Correct" : "Not quite";
    els.fbText.textContent = item.why;
    els.nextBtn.classList.add("show");
    els.nextBtn.focus();
  }

  function next() {
    state.index++;
    if (state.index < QUESTIONS.length) {
      render();
    } else {
      showResult();
    }
  }

  function showResult() {
    els.bar.style.width = "100%";
    els.quiz.classList.add("hidden");
    els.result.classList.remove("hidden");
    els.score.textContent = state.score + " / " + QUESTIONS.length;
    var pct = state.score / QUESTIONS.length;
    var msg;
    if (pct === 1) {
      msg = "Every answer right. Go steam some milk.";
    } else if (pct >= 0.7) {
      msg = "Solid work. Review the ones you missed with your trainer before your first shift.";
    } else {
      msg = "Go over the session notes again, then retake the quiz with your trainer.";
    }
    els.resultMsg.textContent = msg;
    els.restartBtn.focus();
  }

  function restart() {
    state.index = 0;
    state.score = 0;
    els.result.classList.add("hidden");
    els.quiz.classList.remove("hidden");
    render();
  }

  els.nextBtn.addEventListener("click", next);
  els.restartBtn.addEventListener("click", restart);

  render();
</script>
</body>
</html>
