<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater Coffee: Milk Steaming Quiz</title>
<style>
  :root {
    --bg: #f6f1ea;
    --card: #ffffff;
    --ink: #2b211b;
    --muted: #6e5f55;
    --accent: #7a4a2b;
    --good: #2e7d4f;
    --good-bg: #e6f4ea;
    --bad: #b23a2e;
    --bad-bg: #fbe9e7;
    --line: #e2d7cb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 20px;
    line-height: 1.4;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 720px; }
  header { margin-bottom: 20px; }
  header h1 { font-size: 1.4em; margin: 0 0 4px; color: var(--accent); }
  header p { margin: 0; color: var(--muted); font-size: 0.9em; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  }
  .card p { margin: 0 0 16px; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
  .count { color: var(--muted); font-size: 0.85em; margin-bottom: 16px; }
  h2 { font-size: 1.25em; margin: 0 0 18px; }
  .options { display: grid; gap: 10px; }
  button { font: inherit; cursor: pointer; }
  .option {
    text-align: left;
    min-height: 56px;
    padding: 16px 18px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:disabled { cursor: default; }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .feedback { display: none; margin-top: 18px; padding: 16px; border-radius: 12px; }
  .feedback.show { display: block; }
  .feedback.right { background: var(--good-bg); }
  .feedback.wrong { background: var(--bad-bg); }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback p { margin: 0; }
  .btn {
    display: inline-block;
    margin-top: 18px;
    min-height: 56px;
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .hidden { display: none !important; }
  .score { font-size: 2.5em; font-weight: 700; color: var(--accent); margin: 8px 0 12px; }
  .review { padding-left: 1.4em; margin: 16px 0 0; }
  .review li { margin-bottom: 14px; }
  .review .mark { font-weight: 700; }
  .review .mark.right { color: var(--good); }
  .review .mark.wrong { color: var(--bad); }
  .review .answer { color: var(--muted); font-size: 0.9em; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tidewater Coffee</h1>
    <p>Milk steaming check, 8 questions</p>
  </header>

  <section id="start" class="card">
    <h2>Milk steaming quiz</h2>
    <p>Answer each question and read the explanation before you move on. Your answers are reviewed at the end.</p>
    <button class="btn" id="startBtn" type="button">Start quiz</button>
  </section>

  <section id="quiz" class="card hidden">
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <div class="count" id="count"></div>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" role="status"></div>
    <button class="btn hidden" id="nextBtn" type="button">Next</button>
  </section>

  <section id="result" class="card hidden">
    <h2>Your score</h2>
    <div class="score" id="score"></div>
    <p id="summary"></p>
    <ol class="review" id="review"></ol>
    <button class="btn" id="restartBtn" type="button">Take it again</button>
  </section>
</main>

<script>
  const QUESTIONS = [
    {
      q: "What is the target temperature range for steamed milk?",
      options: ["40 to 50 °C", "55 to 65 °C", "70 to 80 °C", "85 to 95 °C"],
      answer: 1,
      explain: "Aim for 55 to 65 °C. Anything over 70 °C scalds the milk and kills its sweetness."
    },
    {
      q: "Above which temperature does milk scald and lose its sweetness?",
      options: ["55 °C", "65 °C", "70 °C", "80 °C"],
      answer: 2,
      explain: "Over 70 °C the milk scalds and the sweetness is gone. Your target tops out at 65 °C."
    },
    {
      q: "The thermometer reads 74 °C. What is the problem?",
      options: [
        "It is right in the target range.",
        "It is over 70 °C, so the milk is scalded and will taste less sweet.",
        "The milk is still cold, so add more air.",
        "Oat milk runs hotter, so this reading is normal."
      ],
      answer: 1,
      explain: "74 °C is above 70 °C. The milk has scalded and lost its sweetness, so it should not be served."
    },
    {
      q: "When do you add air to the milk?",
      options: [
        "Once the milk has reached 65 °C",
        "Early, while the milk is still cold",
        "After the milk has started to roll",
        "Only when steaming oat milk"
      ],
      answer: 1,
      explain: "Add air early while the milk is still cold. Then lower the tip and let the milk roll."
    },
    {
      q: "After you add air, what do you do with the steam wand?",
      options: [
        "Raise the tip out of the milk",
        "Lower the tip so the milk rolls",
        "Keep the tip where it is and turn off the steam",
        "Tap the pitcher on the counter"
      ],
      answer: 1,
      explain: "Once the air is in, lower the tip so the milk rolls. Raising it or stopping early skips that step."
    },
    {
      q: "When should you wipe the steam wand?",
      options: [
        "Only before you start steaming",
        "Right after steaming",
        "Only at the end of the shift",
        "Only when you can see milk on it"
      ],
      answer: 1,
      explain: "Wipe the wand right after every steam, before the milk dries on it."
    },
    {
      q: "When should you purge the steam wand?",
      options: [
        "Before steaming only",
        "After steaming only",
        "Before and after steaming",
        "Only at close"
      ],
      answer: 2,
      explain: "Purge the wand both before and after you steam."
    },
    {
      q: "Compared with dairy, what does oat milk do when steamed?",
      options: [
        "It heats more slowly and holds its foam longer.",
        "It heats faster and its foam falls apart sooner.",
        "It heats at the same rate and foams the same way.",
        "It cannot be steamed."
      ],
      answer: 1,
      explain: "Oat milk heats faster than dairy, and its foam breaks down sooner. Watch the thermometer and the foam closely."
    }
  ];

  let current = 0;
  let score = 0;
  let results = [];

  const $ = id => document.getElementById(id);

  function show(id) {
    ['start', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  }

  function startQuiz() {
    current = 0;
    score = 0;
    results = [];
    show('quiz');
    renderQuestion();
  }

  function renderQuestion() {
    const item = QUESTIONS[current];
    $('bar').style.width = (current / QUESTIONS.length * 100) + '%';
    $('count').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
    $('question').textContent = item.q;

    const box = $('options');
    box.textContent = '';
    item.options.forEach((text, i) => {
      const b = document.createElement('button');
      b.className = 'option';
      b.type = 'button';
      b.textContent = text;
      b.addEventListener('click', () => choose(i));
      box.appendChild(b);
    });

    const fb = $('feedback');
    fb.className = 'feedback';
    fb.textContent = '';

    const next = $('nextBtn');
    next.classList.add('hidden');
    next.textContent = current === QUESTIONS.length - 1 ? 'See results' : 'Next';
  }

  function choose(i) {
    if (results[current] !== undefined) return;

    const item = QUESTIONS[current];
    const correct = i === item.answer;
    results[current] = { chosen: i, correct };
    if (correct) score++;

    [...$('options').children].forEach((b, j) => {
      b.disabled = true;
      if (j === item.answer) b.classList.add('correct');
      else if (j === i) b.classList.add('wrong');
    });

    const fb = $('feedback');
    fb.className = 'feedback show ' + (correct ? 'right' : 'wrong');
    fb.textContent = '';
    const strong = document.createElement('strong');
    strong.textContent = correct ? 'Correct.' : 'Not quite.';
    const p = document.createElement('p');
    p.textContent = item.explain;
    fb.append(strong, p);

    $('nextBtn').classList.remove('hidden');
  }

  function showResults() {
    show('result');
    $('bar').style.width = '100%';
    $('score').textContent = `${score} / ${QUESTIONS.length}`;

    let summary;
    if (score === QUESTIONS.length) summary = 'Every answer is correct. Nice work.';
    else if (score >= 6) summary = 'Solid work. Go over the questions you missed with your trainer.';
    else summary = 'Review the milk steaming basics below and try again.';
    $('summary').textContent = summary;

    const list = $('review');
    list.textContent = '';
    QUESTIONS.forEach((item, i) => {
      const r = results[i];
      const li = document.createElement('li');

      const mark = document.createElement('span');
      mark.className = 'mark ' + (r.correct ? 'right' : 'wrong');
      mark.textContent = r.correct ? 'Correct: ' : 'Missed: ';

      li.append(mark, document.createTextNode(item.q));

      if (!r.correct) {
        const ans = document.createElement('div');
        ans.className = 'answer';
        ans.textContent = 'Answer: ' + item.options[item.answer];
        li.appendChild(ans);
      }
      list.appendChild(li);
    });
  }

  $('startBtn').addEventListener('click', startQuiz);
  $('restartBtn').addEventListener('click', startQuiz);
  $('nextBtn').addEventListener('click', () => {
    current++;
    if (current < QUESTIONS.length) renderQuestion();
    else showResults();
  });
</script>
</body>
</html>
