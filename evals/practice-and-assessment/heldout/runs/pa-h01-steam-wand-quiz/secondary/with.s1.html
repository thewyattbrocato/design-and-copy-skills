<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater Coffee: Milk Steaming Quiz</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f3ee;
  --card: #ffffff;
  --ink: #2b2119;
  --muted: #6e5d4f;
  --accent: #7a4a2a;
  --good: #2e7d4f;
  --bad: #b03a2e;
  --line: #e2d8cc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1814;
    --card: #2a221c;
    --ink: #f3ebe2;
    --muted: #b9a897;
    --accent: #d9a273;
    --good: #6fcf97;
    --bad: #ff8a7a;
    --line: #4a3d33;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  line-height: 1.4;
  display: flex;
  justify-content: center;
  padding: 24px 16px;
}
main { width: 100%; max-width: 640px; }
header h1 { font-size: 1.5rem; margin: 0 0 4px; }
header p { margin: 0 0 20px; color: var(--muted); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
}
.progress {
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 16px;
}
.progress div {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.2s;
}
.count { font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; }
h2 { font-size: 1.25rem; margin: 0 0 16px; }
.options { display: grid; gap: 10px; }
button.opt {
  font: inherit;
  text-align: left;
  min-height: 52px;
  padding: 14px 16px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
button.opt:hover:not(:disabled) { border-color: var(--accent); }
button.opt:disabled { cursor: default; }
button.opt.correct {
  border-color: var(--good);
  background: color-mix(in srgb, var(--good) 15%, transparent);
}
button.opt.wrong {
  border-color: var(--bad);
  background: color-mix(in srgb, var(--bad) 15%, transparent);
}
.feedback {
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
}
.feedback.right { border-color: var(--good); }
.feedback.wrong { border-color: var(--bad); }
.feedback strong { display: block; margin-bottom: 4px; }
.actions { margin-top: 18px; display: flex; justify-content: flex-end; }
.primary {
  font: inherit;
  font-weight: 600;
  padding: 12px 20px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: var(--card);
  cursor: pointer;
}
.score { font-size: 2.5rem; font-weight: 700; margin: 8px 0 16px; }
.missed { padding-left: 20px; margin: 0 0 16px; }
.missed li { margin-bottom: 14px; }
.missed .why { color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Milk Steaming Quiz</h1>
    <p>Tidewater Coffee: complete this after your milk steaming half-day.</p>
  </header>

  <section class="card" id="quiz">
    <div class="progress"><div id="bar"></div></div>
    <div class="count" id="count"></div>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite" hidden></div>
    <div class="actions">
      <button class="primary" id="next" hidden>Next</button>
    </div>
  </section>

  <section class="card" id="results" hidden>
    <h2>Your result</h2>
    <div class="score" id="score"></div>
    <div id="missedWrap">
      <h2>Review these</h2>
      <ol class="missed" id="missed"></ol>
    </div>
    <div class="actions">
      <button class="primary" id="restart">Take it again</button>
    </div>
  </section>
</main>

<script>
const QUESTIONS = [
  {
    q: "What is the target temperature range for steamed milk?",
    options: ["40 to 50 C", "55 to 65 C", "70 to 80 C", "85 to 95 C"],
    answer: 1,
    why: "The target is 55 to 65 C. Stop in that range for sweet, well-textured milk."
  },
  {
    q: "What happens if milk goes over 70 C?",
    options: [
      "The foam gets thicker and lasts longer",
      "The milk scalds and loses its sweetness",
      "The milk is pasteurized more thoroughly",
      "Nothing noticeable changes"
    ],
    answer: 1,
    why: "Anything over 70 C scalds the milk and kills the sweetness. Watch the pitcher temperature closely."
  },
  {
    q: "When do you introduce air into the milk?",
    options: [
      "After the milk is already hot",
      "Only at the very end of steaming",
      "Early, while the milk is still cold",
      "Never. Air is added before you start steaming."
    ],
    answer: 2,
    why: "Add air early while the milk is still cold. Then lower the tip so the milk rolls."
  },
  {
    q: "After you add air, what should you do with the steam wand tip?",
    options: [
      "Raise it above the surface of the milk",
      "Lower it so the milk rolls",
      "Keep it fully submerged in one spot",
      "Turn off the steam right away"
    ],
    answer: 1,
    why: "Lower the tip after adding air so the milk rolls and integrates into a smooth texture."
  },
  {
    q: "When should you wipe the steam wand?",
    options: [
      "Only at the end of your shift",
      "Right after steaming",
      "Only before you start steaming",
      "Never. Wiping damages the wand."
    ],
    answer: 1,
    why: "Wipe the wand right after every steaming. Milk left on it dries and gets hard to clean."
  },
  {
    q: "When should you purge the steam wand?",
    options: [
      "Only after steaming",
      "Only before steaming",
      "Before and after steaming",
      "Never"
    ],
    answer: 2,
    why: "Purge the wand both before and after steaming to clear out condensation and milk residue."
  },
  {
    q: "How does oat milk compare to dairy when steaming?",
    options: [
      "It heats slower and holds its foam longer",
      "It heats faster and its foam falls apart sooner",
      "It heats and foams exactly like dairy",
      "It does not foam at all"
    ],
    answer: 1,
    why: "Oat milk heats faster than dairy and its foam falls apart sooner. Watch the temperature and pour promptly."
  },
  {
    q: "You are steaming oat milk and you use the same timing you use for dairy. What should you change?",
    options: [
      "Steam for longer to build more foam",
      "Stop earlier to hit the target range and pour quickly",
      "Let it sit in the pitcher before pouring",
      "Skip the purge because oat milk is thinner"
    ],
    answer: 1,
    why: "Oat milk heats faster and its foam breaks down sooner. Watch the temperature closely, stop in the 55 to 65 C range, and pour quickly."
  }
];

const quizEl = document.getElementById("quiz");
const resultsEl = document.getElementById("results");
const countEl = document.getElementById("count");
const barEl = document.getElementById("bar");
const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("next");

let index = 0;
let score = 0;
let missed = [];
let answered = false;

function render() {
  const total = QUESTIONS.length;
  const current = QUESTIONS[index];
  answered = false;

  countEl.textContent = "Question " + (index + 1) + " of " + total;
  barEl.style.width = (index / total) * 100 + "%";
  questionEl.textContent = current.q;

  optionsEl.textContent = "";
  current.options.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.textContent = text;
    btn.addEventListener("click", () => choose(i));
    optionsEl.appendChild(btn);
  });

  feedbackEl.hidden = true;
  feedbackEl.className = "feedback";
  feedbackEl.textContent = "";
  nextBtn.hidden = true;
  nextBtn.textContent = index === total - 1 ? "See results" : "Next";
}

function choose(i) {
  if (answered) return;
  answered = true;

  const current = QUESTIONS[index];
  const buttons = optionsEl.querySelectorAll("button.opt");
  buttons.forEach((btn) => (btn.disabled = true));

  const correct = i === current.answer;
  if (correct) {
    score++;
    buttons[i].classList.add("correct");
  } else {
    missed.push(index);
    buttons[i].classList.add("wrong");
    buttons[current.answer].classList.add("correct");
  }

  const heading = document.createElement("strong");
  heading.textContent = correct ? "Correct" : "Not quite";
  const body = document.createElement("span");
  body.textContent = current.why;

  feedbackEl.textContent = "";
  feedbackEl.appendChild(heading);
  feedbackEl.appendChild(body);
  feedbackEl.className = "feedback show " + (correct ? "right" : "wrong");
  feedbackEl.hidden = false;
  nextBtn.hidden = false;
}

function showResults() {
  quizEl.hidden = true;
  resultsEl.hidden = false;
  barEl.style.width = "100%";

  document.getElementById("score").textContent =
    score + " / " + QUESTIONS.length;

  const list = document.getElementById("missed");
  list.textContent = "";
  document.getElementById("missedWrap").hidden = missed.length === 0;

  missed.forEach((qi) => {
    const item = QUESTIONS[qi];
    const li = document.createElement("li");
    const q = document.createElement("div");
    q.textContent = item.q;
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = item.why;
    li.appendChild(q);
    li.appendChild(why);
    list.appendChild(li);
  });
}

function restart() {
  index = 0;
  score = 0;
  missed = [];
  resultsEl.hidden = true;
  quizEl.hidden = false;
  render();
}

nextBtn.addEventListener("click", () => {
  index++;
  if (index < QUESTIONS.length) {
    render();
  } else {
    showResults();
  }
});

document.getElementById("restart").addEventListener("click", restart);

render();
</script>
</body>
</html>
