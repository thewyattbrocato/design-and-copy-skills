<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidewater Coffee · Milk Steaming Check</title>
<style>
:root {
  --bg: #f6f1ea;
  --card: #fffdf9;
  --ink: #2b211a;
  --muted: #7a6a5d;
  --accent: #6b4a2f;
  --ok: #2e7d4f;
  --bad: #b03a2e;
  --line: #e2d7c9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1914;
    --card: #2a221b;
    --ink: #f3ebe1;
    --muted: #b5a596;
    --accent: #d4a574;
    --ok: #6fbf8a;
    --bad: #e07a6e;
    --line: #3d3229;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  justify-content: center;
  padding: 24px 16px;
}
.wrap { width: 100%; max-width: 640px; }
header h1 { font-size: 1.4rem; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); }
.progress { height: 8px; background: var(--line); border-radius: 4px; margin: 20px 0; overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
.count { color: var(--muted); font-size: 0.9rem; margin: 0 0 8px; }
h2 { font-size: 1.25rem; line-height: 1.35; margin: 0 0 16px; }
.options { display: grid; gap: 10px; }
button { font: inherit; cursor: pointer; }
.opt {
  text-align: left;
  padding: 16px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
  color: var(--ink);
  font-size: 1.05rem;
  min-height: 56px;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, var(--card)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, var(--card)); }
.feedback { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--bg); display: none; }
.feedback.show { display: block; }
.feedback strong { display: block; margin-bottom: 4px; }
.btn {
  margin-top: 18px;
  padding: 14px 22px;
  border: none;
  border-radius: 12px;
  background: var(--accent);
  color: var(--card);
  font-size: 1.05rem;
  font-weight: 600;
  min-height: 52px;
  display: none;
}
.btn.show { display: inline-block; }
.result { text-align: center; }
.score { font-size: 3rem; font-weight: 700; color: var(--accent); margin: 8px 0; }
.result p { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Milk Steaming Check</h1>
    <p>Tidewater Coffee · Half-day review</p>
  </header>

  <div class="progress"><div id="progress"></div></div>

  <main id="quiz" class="card">
    <p class="count" id="count"></p>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn" id="next">Next</button>
  </main>

  <section id="result" class="card result" hidden>
    <h2>Your score</h2>
    <div class="score" id="score"></div>
    <p>Go over any questions you missed with your trainer before your first shift at the bar.</p>
    <button class="btn show" id="restart">Take it again</button>
  </section>
</div>

<script>
const QUESTIONS = [
  {
    q: "What is the target milk temperature when steaming?",
    options: ["40 to 50 °C", "55 to 65 °C", "70 to 80 °C", "85 to 95 °C"],
    answer: 1,
    explain: "Aim for 55 to 65 °C. Past 70 °C the milk scalds and loses its sweetness."
  },
  {
    q: "The milk goes over 70 °C. What happens?",
    options: [
      "It gets sweeter and the foam gets denser",
      "It scalds and loses its sweetness",
      "Nothing, anything under 80 °C is fine",
      "It separates, but the taste is unchanged"
    ],
    answer: 1,
    explain: "Anything over 70 °C scalds the milk and kills the sweetness. Keep the milk in the 55 to 65 °C range."
  },
  {
    q: "When do you add air to the milk?",
    options: [
      "Only after the milk reaches 65 °C",
      "Early, while the milk is still cold",
      "Once the milk is fully heated, at the end",
      "Whenever the foam looks thin"
    ],
    answer: 1,
    explain: "Add air early while the milk is still cold. Then lower the tip and let it roll."
  },
  {
    q: "Once you have added enough air, what do you do with the wand?",
    options: [
      "Keep it at the surface until the milk is hot",
      "Lower the tip so the milk rolls",
      "Pull the wand out completely and stop",
      "Raise it above the milk and keep steaming"
    ],
    answer: 1,
    explain: "Lower the tip so the milk rolls. The rolling motion folds the foam in while the milk heats."
  },
  {
    q: "What do you do to the steam wand right after steaming?",
    options: [
      "Leave it; it will cool on its own",
      "Wipe it right away",
      "Wipe it only at the end of the shift",
      "Dip it in the cold milk to cool it"
    ],
    answer: 1,
    explain: "Wipe the wand right after every steam so milk does not dry on it."
  },
  {
    q: "When should you purge the wand?",
    options: [
      "Only before steaming",
      "Only after steaming",
      "Before and after steaming",
      "Never; purging wastes steam"
    ],
    answer: 2,
    explain: "Purge the wand before and after every steam."
  },
  {
    q: "How does oat milk compare with dairy?",
    options: [
      "It heats slower and holds foam longer",
      "It heats faster and its foam falls apart sooner",
      "It heats at the same rate and foams the same",
      "It heats faster and holds foam longer"
    ],
    answer: 1,
    explain: "Oat milk heats faster than dairy, and its foam falls apart sooner. Watch the temperature closely."
  }
];

let current = 0;
let score = 0;

const $ = id => document.getElementById(id);

function render() {
  const total = QUESTIONS.length;
  $('progress').style.width = (current / total * 100) + '%';

  const item = QUESTIONS[current];
  $('count').textContent = `Question ${current + 1} of ${total}`;
  $('question').textContent = item.q;

  const options = $('options');
  options.textContent = '';
  item.options.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.addEventListener('click', () => choose(i));
    options.appendChild(b);
  });

  $('feedback').className = 'feedback';
  $('next').className = 'btn';
  $('next').textContent = current === total - 1 ? 'See my score' : 'Next';
}

function choose(i) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  if (correct) score++;

  Array.from($('options').children).forEach((b, j) => {
    b.disabled = true;
    if (j === item.answer) b.classList.add('correct');
    else if (j === i) b.classList.add('wrong');
  });

  const fb = $('feedback');
  fb.textContent = '';
  const label = document.createElement('strong');
  label.textContent = correct ? 'Correct.' : 'Not quite.';
  fb.appendChild(label);
  fb.appendChild(document.createTextNode(item.explain));
  fb.className = 'feedback show';

  $('next').className = 'btn show';
}

function showResult() {
  $('quiz').hidden = true;
  $('result').hidden = false;
  $('progress').style.width = '100%';
  $('score').textContent = `${score} / ${QUESTIONS.length}`;
}

function restart() {
  current = 0;
  score = 0;
  $('result').hidden = true;
  $('quiz').hidden = false;
  render();
}

$('next').addEventListener('click', () => {
  current++;
  if (current >= QUESTIONS.length) showResult();
  else render();
});
$('restart').addEventListener('click', restart);

render();
</script>
</body>
</html>
