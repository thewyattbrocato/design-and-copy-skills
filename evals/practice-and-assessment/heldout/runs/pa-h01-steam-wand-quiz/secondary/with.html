<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater Coffee · Milk Steaming Check</title>
<style>
  :root {
    --bg: #f7f3ee;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #6e6257;
    --line: #d9cfc4;
    --accent: #6b4226;
    --good: #2e6b3a;
    --good-bg: #e6f2e8;
    --bad: #9b2c2c;
    --bad-bg: #f8e5e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  header { background: var(--accent); color: #fff; padding: 18px 24px; }
  header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
  header p { margin: 4px 0 0; font-size: 0.95rem; opacity: 0.85; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
  .count { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .question { font-size: 1.2rem; font-weight: 600; margin: 0 0 20px; }
  .options { display: grid; gap: 10px; }
  .option {
    width: 100%;
    min-height: 56px;
    padding: 14px 18px;
    text-align: left;
    font: inherit;
    font-size: 1.05rem;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  .btn {
    min-height: 52px;
    padding: 14px 24px;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
  .score { font-size: 2.5rem; font-weight: 700; margin: 0; color: var(--accent); }
  .score-label { color: var(--muted); margin: 0 0 20px; }
  .review-title { font-size: 1.1rem; margin: 24px 0 12px; }
  .review { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .review li { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; }
  .review strong { display: block; margin-bottom: 6px; }
  .muted { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Tidewater Coffee · Milk Steaming Check</h1>
  <p>Answer each question, then read the note before moving on.</p>
</header>
<main>
  <div id="app"></div>
</main>
<script>
  const QUESTIONS = [
    {
      q: "What is the target temperature range for steamed milk?",
      options: ["40 to 50 C", "55 to 65 C", "70 to 80 C", "85 to 95 C"],
      answer: 1,
      why: "The target is 55 to 65 C. Anything over 70 C scalds the milk and kills the sweetness."
    },
    {
      q: "The milk has gone over 70 C. What has happened?",
      options: [
        "It is sweeter and ready to serve",
        "It has scalded and lost its sweetness",
        "The foam has thickened",
        "Nothing, 70 C is still in range"
      ],
      answer: 1,
      why: "Over 70 C the milk scalds and the sweetness is gone."
    },
    {
      q: "When do you add air (stretch the milk)?",
      options: [
        "Once the milk is already hot",
        "Early, while the milk is still cold",
        "Only at the very end",
        "Throughout, with the tip deep in the milk"
      ],
      answer: 1,
      why: "Add air early while the milk is still cold. Then lower the tip and let the milk roll."
    },
    {
      q: "The air is in. What comes next?",
      options: [
        "Keep the tip at the surface",
        "Lower the tip and let the milk roll",
        "Pull the pitcher off the wand right away",
        "Turn the steam up to full"
      ],
      answer: 1,
      why: "Lower the tip and let the milk roll as it heats."
    },
    {
      q: "When do you wipe the steam wand?",
      options: [
        "Before you start steaming",
        "Right after steaming",
        "Only at the end of the shift",
        "Never, the wand cleans itself"
      ],
      answer: 1,
      why: "Wipe the wand right after every steaming."
    },
    {
      q: "When do you purge the steam wand?",
      options: [
        "Only before steaming",
        "Only after steaming",
        "Before and after steaming",
        "Neither, purging is optional"
      ],
      answer: 2,
      why: "Purge the wand both before and after steaming."
    },
    {
      q: "How does oat milk compare with dairy when steaming?",
      options: [
        "Oat milk heats slower than dairy",
        "Oat milk heats faster and its foam falls apart sooner",
        "Oat milk holds its foam longer than dairy",
        "Oat milk and dairy behave the same"
      ],
      answer: 1,
      why: "Oat milk heats faster than dairy, and its foam falls apart sooner."
    }
  ];

  const app = document.getElementById("app");
  let current = 0;
  let answers = [];

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function choose(i) {
    answers[current] = i;
    render();
  }

  function renderQuestion() {
    const item = QUESTIONS[current];
    const answered = answers[current] !== undefined;

    const bar = el("div", "progress");
    const fill = el("div", "progress-bar");
    fill.style.width = (current / QUESTIONS.length * 100) + "%";
    bar.appendChild(fill);

    const card = el("section", "card");
    card.appendChild(el("h2", "question", item.q));

    const list = el("div", "options");
    item.options.forEach((text, i) => {
      const btn = el("button", "option", text);
      btn.type = "button";
      if (answered) {
        btn.disabled = true;
        if (i === item.answer) btn.classList.add("correct");
        else if (i === answers[current]) btn.classList.add("wrong");
      } else {
        btn.addEventListener("click", () => choose(i));
      }
      list.appendChild(btn);
    });
    card.appendChild(list);

    if (answered) {
      const ok = answers[current] === item.answer;
      const fb = el("div", "feedback " + (ok ? "good" : "bad"));
      fb.appendChild(el("strong", "", ok ? "Correct." : "Not quite."));
      fb.appendChild(document.createTextNode(" " + item.why));
      card.appendChild(fb);

      const actions = el("div", "actions");
      const isLast = current + 1 === QUESTIONS.length;
      const next = el("button", "btn", isLast ? "See results" : "Next");
      next.type = "button";
      next.addEventListener("click", () => {
        current++;
        render();
      });
      actions.appendChild(next);
      card.appendChild(actions);
    }

    app.appendChild(bar);
    app.appendChild(el("p", "count", "Question " + (current + 1) + " of " + QUESTIONS.length));
    app.appendChild(card);
  }

  function renderResults() {
    const total = QUESTIONS.length;
    const correct = QUESTIONS.filter((item, i) => answers[i] === item.answer).length;

    const bar = el("div", "progress");
    const fill = el("div", "progress-bar");
    fill.style.width = "100%";
    bar.appendChild(fill);

    const card = el("section", "card");
    card.appendChild(el("p", "score", correct + " of " + total));
    card.appendChild(el("p", "score-label", "correct"));

    const missed = QUESTIONS.filter((item, i) => answers[i] !== item.answer);
    if (missed.length === 0) {
      card.appendChild(el("p", "", "Every answer was correct."));
    } else {
      card.appendChild(el("h2", "review-title", "Review these"));
      const ul = el("ul", "review");
      missed.forEach(item => {
        const li = el("li");
        li.appendChild(el("strong", "", item.q));
        li.appendChild(el("div", "", "Answer: " + item.options[item.answer]));
        li.appendChild(el("div", "muted", item.why));
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }

    const actions = el("div", "actions");
    const restart = el("button", "btn", "Start over");
    restart.type = "button";
    restart.addEventListener("click", () => {
      current = 0;
      answers = [];
      render();
    });
    actions.appendChild(restart);
    card.appendChild(actions);

    app.appendChild(bar);
    app.appendChild(card);
  }

  function render() {
    app.replaceChildren();
    if (current < QUESTIONS.length) renderQuestion();
    else renderResults();
  }

  render();
</script>
</body>
</html>
