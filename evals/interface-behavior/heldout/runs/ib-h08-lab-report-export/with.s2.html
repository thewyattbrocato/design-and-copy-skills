<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season reports · Lakeshore Water Quality Lab</title>
<style>
  :root {
    --bg: #f4f7f9; --card: #fff; --ink: #14262f; --muted: #5a6e78; --line: #dbe4e9;
    --accent: #0b6e8a; --accent-ink: #fff; --ok: #1d7a46; --ok-bg: #e7f5ec;
    --warn: #8a5a00; --warn-bg: #fff3d9; --err: #a32626; --err-bg: #fdeaea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a20; --card: #16252d; --ink: #e6eff3; --muted: #94a9b3; --line: #2a3d47;
      --accent: #4cb8d6; --accent-ink: #06222b; --ok: #6fd39a; --ok-bg: #12301f;
      --warn: #f0c36a; --warn-bg: #33270c; --err: #ff9a9a; --err-bg: #381616;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center; }
  header strong { font-size: 16px; }
  header span { color: var(--muted); font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 22px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 220px; }
  .grow h2 { font-size: 16px; margin: 0; }
  .grow p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  button { font: inherit; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid transparent; }
  .primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; min-width: 190px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .primary[aria-disabled="true"] { opacity: .75; cursor: progress; }
  .ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor;
    border-right-color: transparent; animation: spin .8s linear infinite; display: none; }
  .busy .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #status { margin-top: 16px; display: none; border-radius: 8px; padding: 12px 14px; border: 1px solid var(--line); }
  #status.show { display: block; }
  #status.working { background: var(--warn-bg); border-color: transparent; }
  #status.done { background: var(--ok-bg); border-color: transparent; }
  #status.failed { background: var(--err-bg); border-color: transparent; }
  .msg { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
  .msg b { display: block; }
  .msg small { color: var(--muted); }
  .elapsed { font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 20%, transparent);
    margin-top: 10px; overflow: hidden; position: relative; }
  .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; background: var(--accent);
    border-radius: 3px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { left: -35%; } 100% { left: 100%; } }
  #status:not(.working) .bar { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    .bar::after { animation: none; width: 100%; opacity: .5; }
  }
  .dl { background: var(--ok); color: var(--card); font-weight: 600; text-decoration: none; padding: 9px 16px; border-radius: 8px; }
  @media (prefers-color-scheme: dark) { .dl { color: #06220f; } }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  caption { text-align: left; font-weight: 600; font-size: 16px; padding-bottom: 10px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .tag.pass { background: var(--ok-bg); color: var(--ok); }
  .tag.review { background: var(--warn-bg); color: var(--warn); }
  .tablewrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <strong>Lakeshore Water Quality Lab</strong>
  <span>Client portal</span>
</header>

<main>
  <h1>Reports</h1>
  <p class="sub">Season 2026 · 4 sites · last sample logged 26 Oct</p>

  <section class="card" aria-labelledby="exp-h">
    <div class="row">
      <div class="grow">
        <h2 id="exp-h">Season report</h2>
        <p>All results for the 2026 season as a single CSV file. Large seasons take about 25 seconds to prepare.</p>
      </div>
      <button id="exportBtn" class="primary" type="button">
        <span class="spinner" aria-hidden="true"></span>
        <span id="btnLabel">Export season report</span>
      </button>
    </div>

    <div id="status" role="status" aria-live="polite">
      <div class="msg">
        <div>
          <b id="statusTitle"></b>
          <small id="statusDetail"></small>
        </div>
        <div class="row">
          <span id="elapsed" class="elapsed" aria-hidden="true"></span>
          <button id="cancelBtn" class="ghost" type="button">Cancel</button>
          <a id="dlLink" class="dl" href="#" download hidden>Download report</a>
          <button id="retryBtn" class="ghost" type="button" hidden>Try again</button>
        </div>
      </div>
      <div class="bar" aria-hidden="true"></div>
    </div>
  </section>

  <section class="card">
    <div class="tablewrap">
      <table id="samples">
        <caption>Recent samples</caption>
        <thead>
          <tr><th>Sample</th><th>Site</th><th>Collected</th><th class="n">pH</th><th class="n">Turbidity (NTU)</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script>
(function () {
  var DURATION = 25000; // simulated server time

  var samples = [
    ["WQ-2614", "North Inlet",   "2026-10-26", 7.4, 1.8, "Pass"],
    ["WQ-2613", "Mill Creek",    "2026-10-26", 7.1, 3.2, "Pass"],
    ["WQ-2612", "East Reservoir","2026-10-24", 8.6, 5.9, "Review"],
    ["WQ-2611", "South Outfall", "2026-10-24", 6.9, 2.4, "Pass"],
    ["WQ-2610", "North Inlet",   "2026-10-19", 7.5, 1.6, "Pass"],
    ["WQ-2609", "Mill Creek",    "2026-10-19", 7.0, 4.1, "Pass"]
  ];
  var tbody = document.querySelector("#samples tbody");
  samples.forEach(function (s) {
    var tr = document.createElement("tr");
    s.forEach(function (v, i) {
      var td = document.createElement("td");
      if (i === 3) { td.className = "n"; td.textContent = v.toFixed(1); }
      else if (i === 4) { td.className = "n"; td.textContent = v.toFixed(1); }
      else if (i === 5) {
        var t = document.createElement("span");
        t.className = "tag " + (v === "Pass" ? "pass" : "review");
        t.textContent = v === "Pass" ? "Pass" : "Needs review";
        td.appendChild(t);
      } else td.textContent = v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  var btn = document.getElementById("exportBtn"),
      label = document.getElementById("btnLabel"),
      box = document.getElementById("status"),
      title = document.getElementById("statusTitle"),
      detail = document.getElementById("statusDetail"),
      elapsedEl = document.getElementById("elapsed"),
      cancelBtn = document.getElementById("cancelBtn"),
      retryBtn = document.getElementById("retryBtn"),
      dl = document.getElementById("dlLink");

  var timer = null, startedAt = 0, blobUrl = null, baseTitle = document.title;

  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    return "0:" + (s < 10 ? "0" : "") + s;
  }

  function setState(state) {
    box.className = "show " + state;
    var working = state === "working";
    btn.classList.toggle("busy", working);
    btn.setAttribute("aria-disabled", working ? "true" : "false");
    label.textContent = working ? "Preparing report…" : "Export season report";
    cancelBtn.hidden = !working;
    elapsedEl.hidden = !working;
    dl.hidden = state !== "done";
    retryBtn.hidden = state !== "failed";
  }

  function buildFile() {
    var rows = [["sample_id","site","collected","ph","turbidity_ntu","status"]]
      .concat(samples.map(function (s) { return s.slice(); }));
    var csv = rows.map(function (r) { return r.join(","); }).join("\n");
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    return blobUrl;
  }

  function start() {
    if (timer) return; // already running; ignore repeat clicks
    startedAt = Date.now();
    setState("working");
    title.textContent = "Export started. Preparing your season report.";
    detail.textContent = "This usually takes about 25 seconds. You can stay on this page; the download link will appear here.";
    elapsedEl.textContent = "Elapsed 0:00";
    document.title = "Preparing… · " + baseTitle;
    timer = setInterval(tick, 250);
  }

  function tick() {
    var ms = Date.now() - startedAt;
    elapsedEl.textContent = "Elapsed " + fmt(ms);
    if (ms >= DURATION) finish();
  }

  function stop() { clearInterval(timer); timer = null; }

  function finish() {
    stop();
    dl.href = buildFile();
    dl.download = "season-2026-report.csv";
    setState("done");
    title.textContent = "Your season report is ready.";
    detail.textContent = "Prepared in " + Math.round((Date.now() - startedAt) / 1000) + " seconds · season-2026-report.csv";
    document.title = "Report ready · " + baseTitle;
    dl.focus();
  }

  function cancel() {
    stop();
    box.className = "";
    setState("idle");
    box.classList.remove("show");
    document.title = baseTitle;
    btn.focus();
  }

  btn.addEventListener("click", function () {
    if (btn.getAttribute("aria-disabled") === "true") return;
    start();
  });
  cancelBtn.addEventListener("click", cancel);
  retryBtn.addEventListener("click", start);
  dl.addEventListener("click", function () { document.title = baseTitle; });
})();
</script>
</body>
</html>
