<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samples · Water Quality Lab Portal</title>
<style>
  :root {
    --bg: #f5f7f9; --surface: #fff; --text: #17242d; --muted: #5b6b76;
    --line: #dde3e8; --accent: #0b6e8f; --accent-text: #fff; --accent-soft: #e3f1f6;
    --ok: #1d7a46; --ok-soft: #e4f4EA; --warn: #8a5a00; --warn-soft: #fbefd5;
    --focus: #0b6e8f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11181d; --surface: #182128; --text: #e6edf1; --muted: #98a8b3;
      --line: #2b3841; --accent: #4cb4d6; --accent-text: #08202a; --accent-soft: #19323d;
      --ok: #5fcb8c; --ok-soft: #1a3326; --warn: #e8b84f; --warn-soft: #3a2f14;
      --focus: #4cb4d6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header.top {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 12px 24px; display: flex; gap: 24px; align-items: center;
  }
  header.top strong { font-size: 16px; }
  header.top nav { display: flex; gap: 16px; color: var(--muted); font-size: 14px; }
  header.top nav .on { color: var(--text); font-weight: 600; }
  main { max-width: 880px; margin: 0 auto; padding: 28px 24px 56px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0; }
  button {
    font: inherit; cursor: pointer; border-radius: 6px; padding: 9px 16px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); font-weight: 600;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; font-weight: 500; text-decoration: underline; }
  button:disabled { cursor: progress; opacity: .75; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  #exportPanel { margin: 20px 0 0; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px;
  }
  .card.running { border-color: var(--accent); background: var(--accent-soft); }
  .card.done { border-color: var(--ok); background: var(--ok-soft); }
  .card.cancelled { background: var(--warn-soft); border-color: var(--warn); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); margin: 12px 0 8px; overflow: hidden; position: relative; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .3s linear; }
  .bar.over > i { width: 35% !important; position: absolute; animation: slide 1.4s ease-in-out infinite alternate; transition: none; }
  @keyframes slide { from { left: 0; } to { left: 65%; } }
  .spin {
    display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%;
    animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spin, .bar.over > i { animation: none; }
    .bar.over > i { left: 0; width: 100% !important; opacity: .5; }
  }

  h2 { font-size: 16px; margin: 32px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; background: var(--bg); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .tag.pass { background: var(--ok-soft); color: var(--ok); }
  .tag.review { background: var(--warn-soft); color: var(--warn); }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<header class="top">
  <strong>AquaLab Portal</strong>
  <nav><span>Dashboard</span><span class="on">Samples</span><span>Sites</span><span>Reports</span></nav>
</header>

<main>
  <div class="head">
    <div>
      <h1>Samples</h1>
      <p class="sub">2026 season · 6 most recent shown</p>
    </div>
    <button id="exportBtn" type="button">Export season report</button>
  </div>

  <div id="exportPanel" aria-live="polite" hidden></div>

  <h2>Recent samples</h2>
  <div class="table-wrap">
    <table id="samples">
      <thead>
        <tr><th>Sample ID</th><th>Site</th><th>Collected</th><th class="num">pH</th><th class="num">Turbidity (NTU)</th><th>Status</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script>
(function () {
  var EXPECTED = 25;      // seconds, typical server time
  var samples = [
    ["WQ-26-0412", "Miller Creek upstream", "2026-10-26", 7.4, 1.8, "Pass"],
    ["WQ-26-0411", "Miller Creek outfall", "2026-10-26", 6.9, 4.2, "Review"],
    ["WQ-26-0410", "Harbor Reservoir", "2026-10-25", 7.8, 0.9, "Pass"],
    ["WQ-26-0409", "North Well 3", "2026-10-24", 7.1, 0.4, "Pass"],
    ["WQ-26-0408", "Cedar Pond inlet", "2026-10-23", 8.6, 6.7, "Review"],
    ["WQ-26-0407", "Harbor Reservoir", "2026-10-22", 7.7, 1.1, "Pass"]
  ];

  var tbody = document.querySelector("#samples tbody");
  samples.forEach(function (s) {
    var tr = document.createElement("tr");
    var cls = s[5] === "Pass" ? "pass" : "review";
    tr.innerHTML = "<td>" + s[0] + "</td><td>" + s[1] + "</td><td>" + s[2] +
      '</td><td class="num">' + s[3].toFixed(1) + '</td><td class="num">' + s[4].toFixed(1) +
      '</td><td><span class="tag ' + cls + '">' + s[5] + "</span></td>";
    tbody.appendChild(tr);
  });

  var btn = document.getElementById("exportBtn");
  var panel = document.getElementById("exportPanel");
  var baseTitle = document.title;
  var timer = null, startedAt = 0, announced = 0;

  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function csv() {
    var lines = [["Sample ID", "Site", "Collected", "pH", "Turbidity NTU", "Status"].join(",")];
    samples.forEach(function (s) {
      lines.push(['"' + s[0] + '"', '"' + s[1] + '"', s[2], s[3], s[4], s[5]].join(","));
    });
    return lines.join("\n");
  }

  function start() {
    btn.disabled = true;
    btn.textContent = "Exporting…";
    startedAt = Date.now();
    announced = 0;
    panel.hidden = false;
    panel.innerHTML =
      '<div class="card running">' +
        '<div class="row"><div class="title"><span class="spin" aria-hidden="true"></span>Preparing your season report</div>' +
        '<button type="button" class="link" id="cancelBtn">Cancel</button></div>' +
        '<div class="bar" id="bar" role="progressbar" aria-label="Export progress estimate" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>' +
        '<div class="meta"><span id="elapsed">0:00</span> elapsed · usually takes about ' + EXPECTED + ' seconds. You can keep using this page; the download will appear here.</div>' +
        '<div class="meta" id="late" hidden>Taking a little longer than usual. It’s still working.</div>' +
      "</div>";
    document.getElementById("cancelBtn").addEventListener("click", cancel);
    timer = setInterval(tick, 250);
    tick();
    window.addEventListener("beforeunload", warn);
  }

  function tick() {
    var secs = (Date.now() - startedAt) / 1000;
    var bar = document.getElementById("bar");
    var fill = document.getElementById("fill");
    document.getElementById("elapsed").textContent = fmt(Math.floor(secs));
    document.title = "Exporting… " + fmt(Math.floor(secs)) + " · " + baseTitle;
    if (secs >= EXPECTED + 1) {
      bar.classList.add("over");
      bar.removeAttribute("aria-valuenow");
      document.getElementById("late").hidden = false;
    } else {
      var pct = Math.min(95, secs / EXPECTED * 95);
      fill.style.width = pct + "%";
      bar.setAttribute("aria-valuenow", Math.round(pct));
    }
    if (secs >= EXPECTED) finish();
  }

  function stop() {
    clearInterval(timer); timer = null;
    window.removeEventListener("beforeunload", warn);
    document.title = baseTitle;
    btn.disabled = false;
  }

  function warn(e) { e.preventDefault(); e.returnValue = ""; }

  function finish() {
    stop();
    var name = "season-report-2026.csv";
    var url = URL.createObjectURL(new Blob([csv()], { type: "text/csv" }));
    btn.textContent = "Export again";
    panel.innerHTML =
      '<div class="card done"><div class="row">' +
        '<div><div class="title">✓ Season report ready</div>' +
        '<div class="meta">' + name + " · took " + fmt(Math.round((Date.now() - startedAt) / 1000)) + "</div></div>" +
        '<a id="dl" href="' + url + '" download="' + name + '" style="text-decoration:none"><button type="button">Download report</button></a>' +
      "</div></div>";
    document.querySelector("#dl button").focus();
  }

  function cancel() {
    stop();
    btn.textContent = "Export season report";
    panel.innerHTML =
      '<div class="card cancelled"><div class="row"><div class="title">Export cancelled</div>' +
      '<button type="button" class="secondary" id="retry">Start again</button></div></div>';
    document.getElementById("retry").addEventListener("click", start);
    btn.focus();
  }

  btn.addEventListener("click", function () { if (!btn.disabled) start(); });
})();
</script>
</body>
</html>
