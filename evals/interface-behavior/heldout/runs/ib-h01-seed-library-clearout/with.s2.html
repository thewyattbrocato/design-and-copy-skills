<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed Library – Volunteer Desk</title>
<style>
  :root {
    --bg: #f6f4ee; --card: #ffffff; --ink: #1f2a22; --muted: #5d6b61;
    --line: #dcd8cc; --accent: #2f6b3f; --accent-ink: #ffffff;
    --warn-bg: #fdf0d8; --warn-ink: #7a4a00; --warn-line: #e8c98a;
    --danger: #a3341f; --focus: #1a5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a16; --card: #1e2520; --ink: #e8ece7; --muted: #a0ada4;
      --line: #35403a; --accent: #6fbf86; --accent-ink: #0d1a11;
      --warn-bg: #3a2f17; --warn-ink: #f0cf8e; --warn-line: #6b5527;
      --danger: #ff9d88; --focus: #8ab8ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 0; }
  .sub { color: var(--muted); font-size: .9rem; }
  button, input, select {
    font: inherit; color: inherit; min-height: 44px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 0 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .link { border: 0; background: none; color: var(--muted); text-decoration: underline; min-height: 36px; padding: 0 6px; }

  .cleanup {
    margin: 18px 0; padding: 14px 16px; background: var(--warn-bg); color: var(--warn-ink);
    border: 1px solid var(--warn-line); border-radius: 12px;
  }
  .cleanup.none { background: var(--card); color: var(--muted); border-color: var(--line); }
  .cleanup h2 { margin: 0 0 8px; font-size: 1rem; }
  .rules { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 12px; }
  .rules label { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; }
  .rules input[type=checkbox] { min-height: 0; width: 20px; height: 20px; accent-color: var(--accent); }
  .rules input[type=number] { width: 84px; min-height: 36px; }
  .cleanup .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .cleanup .row span { flex: 1 1 240px; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tools input[type=search] { flex: 1 1 200px; }

  #addForm { display: none; gap: 8px; flex-wrap: wrap; padding: 12px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  #addForm.open { display: flex; }
  #addForm input[name=name] { flex: 2 1 200px; }
  #addForm input[type=number] { width: 100px; }

  .tablewrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; white-space: nowrap; }
  th button { border: 0; background: none; min-height: 36px; padding: 0; text-transform: inherit; letter-spacing: inherit; font-weight: inherit; color: inherit; }
  th button[aria-pressed=true] { color: var(--ink); }
  td.num, th.num { text-align: right; }
  tr.flag td { background: var(--warn-bg); }
  .name { font-weight: 600; }
  .tag { display: inline-block; margin: 2px 6px 0 0; padding: 1px 8px; border-radius: 99px; font-size: .75rem; background: var(--warn-line); color: #3a2600; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .tag { color: #1a1204; } }
  .tag.kept { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .count { display: inline-flex; align-items: center; gap: 4px; }
  .count button { width: 44px; padding: 0; font-size: 1.2rem; }
  .count output { min-width: 2.2em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .count output.zero { color: var(--danger); }
  .empty { padding: 28px; text-align: center; color: var(--muted); }

  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 10px;
    display: none; align-items: center; gap: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.3); max-width: calc(100% - 24px);
  }
  #toast.show { display: flex; }
  #toast button { background: transparent; color: inherit; border-color: currentColor; }
  .foot { margin-top: 16px; display: flex; justify-content: space-between; flex-wrap: wrap; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🌱 Seed Library – Volunteer Desk</h1>
    <div class="sub" id="summary"></div>
  </header>

  <section class="cleanup" id="cleanup" aria-live="polite">
    <h2>End-of-season clear-out</h2>
    <div class="rules">
      <label><input type="checkbox" id="ruleEmpty" checked> Flag empty packets</label>
      <label><input type="checkbox" id="ruleOld" checked> Flag packed before
        <input type="number" id="cutoff" min="1990" max="2100" aria-label="Flag packets packed before this year"></label>
    </div>
    <div class="row">
      <span id="cleanupMsg"></span>
      <button class="primary" id="clearBtn">Remove flagged</button>
    </div>
  </section>

  <div class="tools">
    <input type="search" id="search" placeholder="Search seeds…" aria-label="Search seeds">
    <select id="typeFilter" aria-label="Filter by type"></select>
    <button id="addToggle" aria-expanded="false" aria-controls="addForm">+ Add packet</button>
  </div>

  <form id="addForm">
    <input name="name" placeholder="Seed name" required aria-label="Seed name">
    <select name="type" aria-label="Type"></select>
    <input name="year" type="number" min="1990" max="2100" required aria-label="Year packed">
    <input name="left" type="number" min="0" value="10" required aria-label="Number left">
    <button class="primary" type="submit">Add</button>
  </form>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th><button data-sort="name" aria-pressed="false">Name</button></th>
          <th><button data-sort="type" aria-pressed="false">Type</button></th>
          <th class="num"><button data-sort="year" aria-pressed="false">Packed</button></th>
          <th class="num"><button data-sort="left" aria-pressed="false">Left</button></th>
          <th><span class="sr" style="position:absolute;left:-9999px">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="none" hidden>No packets match.</div>
  </div>

  <div class="foot">
    <span>Changes save automatically in this browser.</span>
    <button class="link" id="reset">Reset to sample data</button>
  </div>
</main>

<div id="toast" role="status"><span id="toastMsg"></span><button id="undoBtn">Undo</button><button id="dismissBtn" aria-label="Dismiss">✕</button></div>

<script>
(function () {
  var TYPES = ["Vegetable", "Herb", "Flower", "Native"];
  var KEY = "seedlib-desk-v1";
  var YEAR = new Date().getFullYear();

  function sample() {
    var d = [
      ["Cherokee Purple Tomato","Vegetable",2025,14],["Detroit Dark Red Beet","Vegetable",2023,6],
      ["Genovese Basil","Herb",2025,22],["Calendula 'Pacific Beauty'","Flower",2024,9],
      ["Lacinato Kale","Vegetable",2022,3],["Blue Lake Bush Bean","Vegetable",2025,0],
      ["Cilantro 'Santo'","Herb",2023,11],["Zinnia 'State Fair Mix'","Flower",2024,0],
      ["Black-Eyed Susan","Native",2025,17],["Sugar Snap Pea","Vegetable",2024,8],
      ["Marigold 'Crackerjack'","Flower",2021,5],["Butternut Squash","Vegetable",2025,12],
      ["Purple Coneflower","Native",2022,0],["Dill 'Bouquet'","Herb",2024,15],
      ["Rainbow Chard","Vegetable",2023,7]
    ];
    return d.map(function (r, i) { return { id: i + 1, name: r[0], type: r[1], year: r[2], left: r[3] }; });
  }

  var state = load();
  var ui = { search: "", type: "All", sort: "name", dir: 1, lastRemoved: null };

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.items)) {
        s.keep = s.keep || []; return s;
      }
    } catch (e) {}
    return fresh();
  }
  function fresh() {
    return { items: sample(), nextId: 100, ruleEmpty: true, ruleOld: true, cutoff: YEAR - 2, keep: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function reasons(it) {
    var r = [];
    if (state.ruleEmpty && it.left === 0) r.push("Empty");
    if (state.ruleOld && it.year < state.cutoff) r.push("Packed " + it.year);
    return r;
  }
  function isKept(it) { return state.keep.indexOf(it.id) > -1; }
  function flagged() { return state.items.filter(function (it) { return reasons(it).length && !isKept(it); }); }

  function visible() {
    var q = ui.search.trim().toLowerCase();
    var list = state.items.filter(function (it) {
      return (ui.type === "All" || it.type === ui.type) && (!q || it.name.toLowerCase().indexOf(q) > -1);
    });
    var k = ui.sort;
    list.sort(function (a, b) {
      var x = a[k], y = b[k];
      var c = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
      return (c || a.name.localeCompare(b.name)) * ui.dir;
    });
    return list;
  }

  function render() {
    $("ruleEmpty").checked = state.ruleEmpty;
    $("ruleOld").checked = state.ruleOld;
    if (document.activeElement !== $("cutoff")) $("cutoff").value = state.cutoff;

    var total = state.items.reduce(function (n, it) { return n + it.left; }, 0);
    $("summary").textContent = state.items.length + " varieties · " + total + " packets on the shelf";

    var f = flagged();
    var box = $("cleanup");
    box.classList.toggle("none", !f.length);
    $("clearBtn").disabled = !f.length;
    $("clearBtn").textContent = f.length ? "Remove " + f.length + " flagged" : "Nothing to remove";
    $("cleanupMsg").textContent = f.length
      ? f.length + " of " + state.items.length + " varieties are flagged (highlighted below). Use “Keep” on any you want to hold onto."
      : "Nothing is flagged right now.";

    var list = visible();
    $("rows").innerHTML = list.map(function (it) {
      var r = reasons(it), kept = isKept(it), fl = r.length && !kept;
      var tags = r.map(function (t) { return '<span class="tag' + (kept ? ' kept' : '') + '">' + esc(t) + '</span>'; }).join("");
      if (kept) tags += '<span class="tag kept">Kept</span>';
      var keepBtn = r.length
        ? '<button data-act="keep" data-id="' + it.id + '">' + (kept ? "Flag again" : "Keep") + '</button>' : "";
      return '<tr class="' + (fl ? "flag" : "") + '">' +
        '<td><div class="name">' + esc(it.name) + '</div>' + (tags ? '<div>' + tags + '</div>' : '') + '</td>' +
        '<td>' + esc(it.type) + '</td>' +
        '<td class="num">' + it.year + '</td>' +
        '<td class="num"><span class="count">' +
          '<button data-act="dec" data-id="' + it.id + '" aria-label="One fewer ' + esc(it.name) + '">−</button>' +
          '<output class="' + (it.left === 0 ? "zero" : "") + '">' + it.left + '</output>' +
          '<button data-act="inc" data-id="' + it.id + '" aria-label="One more ' + esc(it.name) + '">+</button>' +
        '</span></td>' +
        '<td>' + keepBtn + '</td></tr>';
    }).join("");
    $("none").hidden = list.length > 0;

    document.querySelectorAll("th [data-sort]").forEach(function (b) {
      var on = b.dataset.sort === ui.sort;
      b.setAttribute("aria-pressed", on);
      b.textContent = b.textContent.replace(/ [▲▼]$/, "") + (on ? (ui.dir > 0 ? " ▲" : " ▼") : "");
    });
  }

  function toast(msg, canUndo) {
    $("toastMsg").textContent = msg;
    $("undoBtn").style.display = canUndo ? "" : "none";
    $("toast").classList.add("show");
  }
  function hideToast() { $("toast").classList.remove("show"); ui.lastRemoved = null; }

  function commit() { save(); render(); }

  // Setup
  var opts = TYPES.map(function (t) { return '<option>' + t + '</option>'; }).join("");
  $("typeFilter").innerHTML = '<option value="All">All types</option>' + opts;
  document.querySelector("#addForm select").innerHTML = opts;
  document.querySelector("#addForm [name=year]").value = YEAR;

  $("search").addEventListener("input", function (e) { ui.search = e.target.value; render(); });
  $("typeFilter").addEventListener("change", function (e) { ui.type = e.target.value; render(); });
  $("ruleEmpty").addEventListener("change", function (e) { state.ruleEmpty = e.target.checked; commit(); });
  $("ruleOld").addEventListener("change", function (e) { state.ruleOld = e.target.checked; commit(); });
  $("cutoff").addEventListener("input", function (e) {
    var v = parseInt(e.target.value, 10);
    if (v > 1900 && v < 2200) { state.cutoff = v; save(); render(); }
  });
  $("cutoff").addEventListener("blur", render);

  document.querySelector("thead").addEventListener("click", function (e) {
    var b = e.target.closest("[data-sort]"); if (!b) return;
    if (ui.sort === b.dataset.sort) ui.dir *= -1; else { ui.sort = b.dataset.sort; ui.dir = 1; }
    render();
  });

  $("rows").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var id = +b.dataset.id, it = state.items.filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    var act = b.dataset.act;
    if (act === "inc") it.left++;
    else if (act === "dec") it.left = Math.max(0, it.left - 1);
    else if (act === "keep") {
      var i = state.keep.indexOf(id);
      if (i > -1) state.keep.splice(i, 1); else state.keep.push(id);
    }
    commit();
    var again = document.querySelector('button[data-act="' + act + '"][data-id="' + id + '"]');
    if (again) again.focus();
  });

  $("clearBtn").addEventListener("click", function () {
    var f = flagged(); if (!f.length) return;
    var ids = f.map(function (x) { return x.id; });
    ui.lastRemoved = { items: state.items.slice(), keep: state.keep.slice() };
    state.items = state.items.filter(function (x) { return ids.indexOf(x.id) < 0; });
    state.keep = state.keep.filter(function (id) { return ids.indexOf(id) < 0; });
    commit();
    toast("Removed " + f.length + " packet" + (f.length === 1 ? "" : "s") + ".", true);
  });
  $("undoBtn").addEventListener("click", function () {
    if (!ui.lastRemoved) return;
    state.items = ui.lastRemoved.items; state.keep = ui.lastRemoved.keep;
    commit(); hideToast();
    toast("Restored.", false);
    setTimeout(function () { if ($("toastMsg").textContent === "Restored.") hideToast(); }, 2500);
  });
  $("dismissBtn").addEventListener("click", hideToast);

  $("addToggle").addEventListener("click", function () {
    var open = $("addForm").classList.toggle("open");
    this.setAttribute("aria-expanded", open);
    if (open) document.querySelector("#addForm [name=name]").focus();
  });
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, name = f.name.value.trim(); if (!name) return;
    state.items.push({ id: state.nextId++, name: name, type: f.type.value, year: parseInt(f.year.value, 10), left: Math.max(0, parseInt(f.left.value, 10) || 0) });
    f.name.value = ""; f.left.value = 10; f.name.focus();
    commit(); toast("Added " + name + ".", false);
    setTimeout(function () { if ($("toastMsg").textContent === "Added " + name + ".") hideToast(); }, 2500);
  });

  $("reset").addEventListener("click", function () {
    ui.lastRemoved = { items: state.items.slice(), keep: state.keep.slice() };
    var prev = state; state = fresh(); commit();
    toast("Sample data restored.", true);
  });

  render();
})();
</script>
</body>
</html>
