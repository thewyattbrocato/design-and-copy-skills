<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed Library – Volunteer Desk</title>
<style>
  :root {
    --bg: #f6f4ee; --card: #ffffff; --ink: #1f2a22; --muted: #5d6b61;
    --line: #dcd8ca; --accent: #2f6b3f; --accent-ink: #ffffff;
    --warn-bg: #fbeed0; --warn-ink: #6b4a00; --empty-bg: #f6dcd6; --empty-ink: #7a2415;
    --sel: #e8f1e6; --focus: #1b5fb8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a16; --card: #1e251f; --ink: #e8ece6; --muted: #9aa89d;
      --line: #34403a; --accent: #6fbf80; --accent-ink: #0e1a11;
      --warn-bg: #4a3b12; --warn-ink: #f3d889; --empty-bg: #55231a; --empty-ink: #f5b9ac;
      --sel: #25352a; --focus: #7db3f5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 110px;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button { cursor: pointer; }

  .banner {
    background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--accent);
    border-radius: 8px; padding: 14px 16px; display: flex; gap: 12px 16px;
    align-items: center; flex-wrap: wrap; margin-bottom: 16px;
  }
  .banner.clean { border-left-color: var(--line); }
  .banner .msg { flex: 1 1 260px; }
  .banner strong { font-size: 1.05rem; }
  .banner small { display: block; color: var(--muted); }
  .btn {
    border: 1px solid var(--line); background: var(--card); border-radius: 6px;
    padding: 8px 14px; min-height: 40px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.danger { background: #a3321f; color: #fff; border-color: #a3321f; font-weight: 600; }
  .btn:hover { filter: brightness(0.96); }

  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .tools input[type=search] {
    flex: 1 1 180px; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card);
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; min-height: 36px; }
  .chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .tablewrap { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
  th button { background: none; border: 0; padding: 4px 0; text-transform: inherit; letter-spacing: inherit; font-size: inherit; color: inherit; font-weight: 700; }
  th button::after { content: " ↕"; opacity: .35; }
  th[aria-sort=ascending] button::after { content: " ↑"; opacity: 1; }
  th[aria-sort=descending] button::after { content: " ↓"; opacity: 1; }
  td.num, th.num { text-align: right; }
  tr.sel td { background: var(--sel); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  .name { font-weight: 600; }
  .tag { display: inline-block; font-size: .75rem; font-weight: 600; border-radius: 4px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .tag.old { background: var(--warn-bg); color: var(--warn-ink); }
  .tag.empty { background: var(--empty-bg); color: var(--empty-ink); }
  .stepper { display: inline-flex; align-items: center; gap: 6px; }
  .stepper button { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); font-size: 1.1rem; line-height: 1; }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper output { min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .emptyrow td { text-align: center; color: var(--muted); padding: 28px; }

  details { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; }
  summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
  form.add { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; padding: 10px 0 6px; }
  label { display: grid; gap: 3px; font-size: .85rem; color: var(--muted); }
  label input, label select { min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .settings { margin-top: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
  .settings input { width: 4.5rem; min-height: 36px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  .linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--line); padding: 12px 16px; display: none; z-index: 5;
    box-shadow: 0 -4px 14px rgba(0,0,0,.12);
  }
  .bar.show { display: block; }
  .bar div { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar span { flex: 1 1 200px; font-weight: 600; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; background: #25302a; color: #fff;
    padding: 10px 14px; border-radius: 8px; display: none; gap: 14px; align-items: center; z-index: 10;
    max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  .toast.show { display: flex; }
  .toast button { background: none; border: 0; color: #9fe0ad; font-weight: 700; text-decoration: underline; padding: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <h1>Seed Library – Volunteer Desk</h1>
  <p class="sub">Sample data for <span id="year"></span>. Changes are saved in this browser.</p>

  <section class="banner" id="banner" aria-live="polite"></section>

  <div class="tools">
    <input type="search" id="q" placeholder="Search by name or type" aria-label="Search packets">
    <div class="chips" id="chips" role="group" aria-label="Filter"></div>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th style="width:44px"><input type="checkbox" id="all" aria-label="Select all shown"></th>
          <th data-k="name"><button type="button">Name</button></th>
          <th data-k="type"><button type="button">Type</button></th>
          <th data-k="year" class="num"><button type="button">Year packed</button></th>
          <th data-k="left" class="num"><button type="button">Left</button></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="settings">
    <label style="display:flex;flex-direction:row;align-items:center;gap:8px;color:inherit;font-size:inherit">
      Count a packet as old after
      <input type="number" id="age" min="1" max="20" aria-label="Years before a packet counts as old">
      years
    </label>
    <span id="cutoffNote"></span>
    <button class="linkbtn" type="button" id="reset">Reset sample data</button>
  </div>

  <details id="addbox">
    <summary>Add a packet</summary>
    <form class="add" id="add">
      <label>Name <input name="name" required maxlength="60"></label>
      <label>Type
        <select name="type"><option>Vegetable</option><option>Herb</option><option>Flower</option><option>Bean &amp; pea</option></select>
      </label>
      <label>Year packed <input name="year" type="number" required min="2000" max="2100"></label>
      <label>How many <input name="left" type="number" required min="0" max="999" value="10"></label>
      <button class="btn primary" type="submit">Add packet</button>
    </form>
  </details>
</main>

<div class="bar" id="bar"><div>
  <span id="barCount"></span>
  <button class="btn" type="button" id="clearSel">Deselect</button>
  <button class="btn danger" type="button" id="removeSel"></button>
</div></div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="undo">Undo</button></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function () {
  var NOW = new Date().getFullYear();
  var KEY = "seedlib.desk.v1";
  var SAMPLE = [
    ["Cherokee Purple Tomato","Vegetable",NOW-1,14],
    ["Genovese Basil","Herb",NOW,9],
    ["Blue Lake Bush Bean","Bean & pea",NOW-3,6],
    ["Zinnia 'State Fair'","Flower",NOW-1,0],
    ["Lacinato Kale","Vegetable",NOW-2,11],
    ["Sugar Snap Pea","Bean & pea",NOW,18],
    ["Calendula","Flower",NOW-4,4],
    ["Chives","Herb",NOW-2,7],
    ["Detroit Dark Red Beet","Vegetable",NOW-3,0],
    ["Cilantro 'Slow Bolt'","Herb",NOW-1,2],
    ["Scarlet Runner Bean","Bean & pea",NOW-1,12],
    ["Marigold 'Naughty Marie'","Flower",NOW,22],
    ["Danvers Carrot","Vegetable",NOW-5,8],
    ["Dill 'Bouquet'","Herb",NOW-2,0],
    ["Cosmos 'Sensation'","Flower",NOW-1,5]
  ];
  function fresh() {
    return { next: SAMPLE.length + 1, age: 3, items: SAMPLE.map(function (r, i) {
      return { id: i + 1, name: r[0], type: r[1], year: r[2], left: r[3] };
    })};
  }
  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!S || !Array.isArray(S.items)) S = fresh();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var sel = {}, filter = "all", query = "", sortK = "name", sortDir = 1, lastRemoved = null, toastTimer;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function isOld(p) { return NOW - p.year >= S.age; }
  function isEmpty(p) { return p.left <= 0; }
  function needs(p) { return isOld(p) || isEmpty(p); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  $("year").textContent = NOW;
  var FILTERS = [["all","All"],["needs","Needs clearing"],["empty","Empty"],["old","Old"]];
  $("chips").innerHTML = FILTERS.map(function (f) {
    return '<button type="button" class="chip" data-f="' + f[0] + '" aria-pressed="' + (f[0] === filter) + '"></button>';
  }).join("");

  function visible() {
    var q = query.trim().toLowerCase();
    var list = S.items.filter(function (p) {
      if (filter === "needs" && !needs(p)) return false;
      if (filter === "empty" && !isEmpty(p)) return false;
      if (filter === "old" && !isOld(p)) return false;
      return !q || (p.name + " " + p.type).toLowerCase().indexOf(q) > -1;
    });
    list.sort(function (a, b) {
      var x = a[sortK], y = b[sortK];
      var c = typeof x === "number" ? x - y : String(x).localeCompare(String(y), undefined, {sensitivity: "base"});
      return (c || a.name.localeCompare(b.name)) * sortDir;
    });
    return list;
  }

  function render() {
    var nOld = S.items.filter(isOld).length, nEmpty = S.items.filter(isEmpty).length, nNeeds = S.items.filter(needs).length;
    var counts = { all: S.items.length, needs: nNeeds, empty: nEmpty, old: nOld };
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (b) {
      var f = b.getAttribute("data-f");
      b.textContent = FILTERS.filter(function (x) { return x[0] === f; })[0][1] + " (" + counts[f] + ")";
      b.setAttribute("aria-pressed", f === filter);
    });
    $("age").value = S.age;
    $("cutoffNote").textContent = "(packed " + (NOW - S.age) + " or earlier)";

    var b = $("banner");
    if (nNeeds) {
      b.className = "banner";
      b.innerHTML = '<div class="msg"><strong>' + plural(nNeeds, "packet") + ' ready to clear out</strong>' +
        '<small>' + nEmpty + ' empty, ' + nOld + ' old (packed ' + (NOW - S.age) + ' or earlier). Some are both.</small></div>' +
        '<button class="btn primary" type="button" id="pick">Select these ' + nNeeds + '</button>';
      $("pick").onclick = function () {
        S.items.forEach(function (p) { if (needs(p)) sel[p.id] = true; });
        filter = "needs"; render();
        $("live").textContent = nNeeds + " packets selected. Review, then remove.";
      };
    } else {
      b.className = "banner clean";
      b.innerHTML = '<div class="msg"><strong>Nothing to clear out</strong><small>No empty or old packets right now.</small></div>';
    }

    var list = visible();
    $("rows").innerHTML = list.length ? list.map(function (p) {
      var tags = (isEmpty(p) ? '<span class="tag empty">Empty</span>' : "") + (isOld(p) ? '<span class="tag old">Old</span>' : "");
      return '<tr class="' + (sel[p.id] ? "sel" : "") + '" data-id="' + p.id + '">' +
        '<td><input type="checkbox" class="pick" aria-label="Select ' + esc(p.name) + '"' + (sel[p.id] ? " checked" : "") + '></td>' +
        '<td><span class="name">' + esc(p.name) + '</span>' + tags + '</td>' +
        '<td>' + esc(p.type) + '</td>' +
        '<td class="num">' + p.year + '</td>' +
        '<td class="num"><span class="stepper">' +
          '<button type="button" class="dec" aria-label="Take one packet of ' + esc(p.name) + '"' + (p.left <= 0 ? " disabled" : "") + '>−</button>' +
          '<output>' + p.left + '</output>' +
          '<button type="button" class="inc" aria-label="Add one packet of ' + esc(p.name) + '">+</button></span></td></tr>';
    }).join("") : '<tr class="emptyrow"><td colspan="5">No packets match.</td></tr>';

    Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"), function (th) {
      th.setAttribute("aria-sort", th.getAttribute("data-k") === sortK ? (sortDir > 0 ? "ascending" : "descending") : "none");
    });

    var shownSel = list.filter(function (p) { return sel[p.id]; }).length;
    var all = $("all");
    all.checked = list.length > 0 && shownSel === list.length;
    all.indeterminate = shownSel > 0 && shownSel < list.length;

    var n = S.items.filter(function (p) { return sel[p.id]; }).length;
    $("bar").className = "bar" + (n ? " show" : "");
    $("barCount").textContent = n + " selected";
    $("removeSel").textContent = "Remove " + plural(n, "packet");
  }

  $("rows").addEventListener("click", function (e) {
    var tr = e.target.closest("tr[data-id]"); if (!tr) return;
    var p = S.items.filter(function (x) { return x.id === +tr.getAttribute("data-id"); })[0];
    if (e.target.classList.contains("pick")) { if (e.target.checked) sel[p.id] = true; else delete sel[p.id]; render(); }
    else if (e.target.classList.contains("dec")) { p.left = Math.max(0, p.left - 1); save(); render(); }
    else if (e.target.classList.contains("inc")) { p.left += 1; save(); render(); }
  });
  $("all").onchange = function () {
    var on = this.checked;
    visible().forEach(function (p) { if (on) sel[p.id] = true; else delete sel[p.id]; });
    render();
  };
  $("chips").onclick = function (e) { var f = e.target.getAttribute("data-f"); if (f) { filter = f; render(); } };
  $("q").oninput = function () { query = this.value; render(); };
  document.querySelector("thead").onclick = function (e) {
    var th = e.target.closest("th[data-k]"); if (!th) return;
    var k = th.getAttribute("data-k");
    if (k === sortK) sortDir = -sortDir; else { sortK = k; sortDir = 1; }
    render();
  };
  $("age").onchange = function () {
    var v = Math.max(1, Math.min(20, parseInt(this.value, 10) || 3));
    S.age = v; save(); render();
  };
  $("clearSel").onclick = function () { sel = {}; render(); };

  function showToast(msg, canUndo) {
    $("toastMsg").textContent = msg;
    $("undo").style.display = canUndo ? "" : "none";
    $("toast").className = "toast show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").className = "toast"; lastRemoved = null; }, 15000);
    $("live").textContent = msg;
  }
  $("removeSel").onclick = function () {
    var gone = S.items.filter(function (p) { return sel[p.id]; });
    if (!gone.length) return;
    lastRemoved = gone;
    S.items = S.items.filter(function (p) { return !sel[p.id]; });
    sel = {}; save(); render();
    showToast("Removed " + plural(gone.length, "packet") + ".", true);
  };
  $("undo").onclick = function () {
    if (!lastRemoved) return;
    S.items = S.items.concat(lastRemoved);
    lastRemoved.forEach(function (p) { sel[p.id] = true; });
    var n = lastRemoved.length; lastRemoved = null;
    save(); render();
    showToast("Restored " + plural(n, "packet") + ".", false);
  };
  $("add").onsubmit = function (e) {
    e.preventDefault();
    var f = this.elements;
    S.items.push({ id: S.next++, name: f.name.value.trim(), type: f.type.value, year: +f.year.value, left: +f.left.value });
    save(); this.reset(); f.year.value = NOW; f.left.value = 10; render();
    showToast("Added packet.", false);
    f.name.focus();
  };
  $("add").elements.year.value = NOW;
  $("reset").onclick = function () {
    lastRemoved = null; sel = {}; S = fresh(); save(); render();
    showToast("Sample data restored.", false);
  };
  render();
})();
</script>
</body>
</html>
