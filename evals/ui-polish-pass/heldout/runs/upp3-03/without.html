<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Plants – Get our care tips</title>
<style>
  :root {
    --bg: #eef2e8;
    --card: #ffffff;
    --ink: #1f2a22;
    --muted: #5c6b60;
    --accent: #2f6b44;
    --accent-dark: #245536;
    --border: #cfd8c9;
    --ring: rgba(47, 107, 68, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a15;
      --card: #1b261f;
      --ink: #e8efe9;
      --muted: #9fb0a4;
      --accent: #5fb383;
      --accent-dark: #7cc79b;
      --border: #2e3d33;
      --ring: rgba(95, 179, 131, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(95,179,131,0.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(47,107,68,0.14), transparent 45%),
      var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px 32px;
    box-shadow: 0 20px 40px -20px rgba(31,42,34,0.25);
    text-align: center;
  }
  .icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 16px;
    border-radius: 14px;
    background: var(--accent);
    display: grid;
    place-items: center;
  }
  .icon svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  p { margin: 0 0 24px; color: var(--muted); }
  form { display: flex; flex-direction: column; gap: 12px; }
  input {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--muted); opacity: .8; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  @media (prefers-color-scheme: dark) { button { color: #0e1611; } }
  button:hover { background: var(--accent-dark); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring); }
  .note { margin: 14px 0 0; font-size: .8rem; }
  .thanks { display: none; color: var(--accent); font-weight: 600; margin: 0; }
  .done form, .done .note, .done .lead { display: none; }
  .done .thanks { display: block; }
  @media (min-width: 480px) {
    form { flex-direction: row; }
    input { flex: 1; min-width: 0; }
    button { white-space: nowrap; }
  }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 15c0-3-2-5-6-5 0 4 2 6 6 5z"/></svg>
  </div>
  <h1>Fernwick Plants</h1>
  <p class="lead">Get our care tips</p>
  <form onsubmit="event.preventDefault(); document.getElementById('card').classList.add('done');">
    <input type="email" name="email" placeholder="you@example.com" aria-label="Email address" autocomplete="email" required>
    <button type="submit">Subscribe</button>
  </form>
  <p class="note">Seasonal watering, light and repotting advice. No spam.</p>
  <p class="thanks" role="status">Thanks! Your first care tips are on the way.</p>
</main>
</body>
</html>
