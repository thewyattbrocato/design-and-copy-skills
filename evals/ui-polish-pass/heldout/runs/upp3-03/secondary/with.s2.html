<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Plants: Care Tips</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f7f2;
    --card: #ffffff;
    --text: #1d2b20;
    --muted: #55655a;
    --accent: #2f7d4f;
    --accent-hover: #256740;
    --accent-text: #ffffff;
    --border: #b9c7bc;
    --focus: #1a5fb4;
    --error: #b42318;
    --success: #1e6b3a;
    --radius: 12px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a14;
      --card: #1b2820;
      --text: #e6efe8;
      --muted: #a6b6aa;
      --accent: #5fb383;
      --accent-hover: #74c496;
      --accent-text: #0f1a12;
      --border: #3d5245;
      --focus: #8ab4f8;
      --error: #ff8a80;
      --success: #7fd69b;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 40px 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
  }

  .brand {
    margin: 0 0 8px;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .lede {
    margin: 0 0 28px;
    color: var(--muted);
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    font-size: 0.9rem;
    font-weight: 600;
  }

  input[type="email"] {
    width: 100%;
    margin-top: 6px;
    padding: 12px 14px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="email"]::placeholder {
    color: var(--muted);
    opacity: 0.8;
  }

  input[type="email"][aria-invalid="true"] {
    border-color: var(--error);
  }

  input[type="email"]:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  input[type="email"]:focus-visible {
    outline-offset: 0;
    border-color: var(--focus);
  }

  button {
    padding: 12px 18px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  button:hover { background: var(--accent-hover); }

  button:disabled {
    opacity: 0.6;
    cursor: progress;
  }

  .message {
    min-height: 1.5em;
    margin: 0;
    font-size: 0.9rem;
  }

  .message.error { color: var(--error); }
  .message.success { color: var(--success); }

  .hint {
    margin: 20px 0 0;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .brand { font-size: 1.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <h1 class="brand">Fernwick Plants</h1>
    <p class="lede">Get our care tips delivered to your inbox.</p>

    <form id="signup" novalidate>
      <div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="message">
      </div>
      <button type="submit" id="submit">Get care tips</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <p class="hint">No spam. Unsubscribe anytime.</p>
  </main>

  <script>
    (function () {
      var form = document.getElementById('signup');
      var input = document.getElementById('email');
      var button = document.getElementById('submit');
      var message = document.getElementById('message');

      var pattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

      function setMessage(text, type) {
        message.textContent = text;
        message.className = 'message ' + (type || '');
      }

      input.addEventListener('input', function () {
        if (input.getAttribute('aria-invalid') === 'true' && pattern.test(input.value.trim())) {
          input.removeAttribute('aria-invalid');
          setMessage('');
        }
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var value = input.value.trim();

        if (!value) {
          input.setAttribute('aria-invalid', 'true');
          setMessage('Please enter your email address.', 'error');
          input.focus();
          return;
        }

        if (!pattern.test(value)) {
          input.setAttribute('aria-invalid', 'true');
          setMessage('That email address doesn\u2019t look right. Please check it.', 'error');
          input.focus();
          return;
        }

        input.removeAttribute('aria-invalid');
        button.disabled = true;
        setMessage('Subscribing\u2026');

        // Placeholder for a real request; no external calls are made here.
        setTimeout(function () {
          button.disabled = false;
          input.value = '';
          setMessage('Thanks! Your first care tips are on the way.', 'success');
        }, 600);
      });
    })();
  </script>
</body>
</html>
