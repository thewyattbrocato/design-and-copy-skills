<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Plants – Care tips</title>
<style>
  :root {
    --bg: #eef3ec;
    --card: #ffffff;
    --ink: #1e2b22;
    --muted: #51604f;
    --accent: #2f6b45;
    --accent-dark: #245436;
    --border: #7b8a79;
    --error: #a3261f;
    --ring: #1b5fd1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 1px 2px rgba(30,43,34,.08), 0 12px 32px rgba(30,43,34,.10);
  }
  .leaf {
    width: 40px; height: 40px;
    border-radius: 12px 12px 12px 4px;
    background: var(--accent);
    display: grid; place-items: center;
    margin-bottom: 16px;
  }
  .leaf svg { width: 22px; height: 22px; }
  h2 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    line-height: 1.2;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .sub { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  input {
    width: 100%;
    font: inherit;
    padding: 11px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
  }
  input::placeholder { color: #6b786a; }
  input[aria-invalid="true"] { border-color: var(--error); }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 2px;
  }
  button {
    width: 100%;
    margin-top: 12px;
    font: inherit;
    font-weight: 600;
    padding: 12px 16px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button[aria-disabled="true"] { opacity: .7; cursor: progress; }
  .msg { margin: 10px 0 0; font-size: .9rem; min-height: 1.4em; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--accent-dark); font-weight: 600; }
  .fine { margin: 14px 0 0; font-size: .8rem; color: var(--muted); }
  @media (max-width: 360px) { .card { padding: 24px 18px; } }
  @media (prefers-reduced-motion: no-preference) {
    input, button { transition: border-color .15s, background-color .15s; }
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="leaf" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/></svg>
    </div>
    <h2>Fernwick Plants</h2>
    <p class="sub" id="sub">Get our care tips</p>

    <form id="form" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
             placeholder="you@example.com" required aria-describedby="msg">
      <button type="submit" id="btn">Go</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="fine">You can unsubscribe at any time.</p>
  </div>
</main>

<script>
  const form = document.getElementById('form');
  const email = document.getElementById('email');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  let busy = false;

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + kind;
  }

  email.addEventListener('input', () => {
    if (email.getAttribute('aria-invalid')) {
      email.removeAttribute('aria-invalid');
      show('', '');
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (busy) return;
    const value = email.value.trim();
    if (!value) {
      email.setAttribute('aria-invalid', 'true');
      show('Enter your email address to get care tips.', 'error');
      email.focus();
      return;
    }
    if (!email.checkValidity()) {
      email.setAttribute('aria-invalid', 'true');
      show('That doesn\u2019t look like an email address. Check for a missing @ or domain.', 'error');
      email.focus();
      return;
    }
    busy = true;
    btn.setAttribute('aria-disabled', 'true');
    btn.textContent = 'Signing up\u2026';
    // Demo only: replace with a real request to your signup endpoint.
    setTimeout(() => {
      busy = false;
      btn.removeAttribute('aria-disabled');
      btn.textContent = 'Go';
      show('Thanks! Care tips are on their way to ' + value + '.', 'ok');
      form.reset();
    }, 600);
  });
</script>
</body>
</html>
