<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front desk · Neighborhood Tool Library</title>
<style>
  :root{
    --bg:#f5f2ea; --panel:#fffdf8; --ink:#231f1a; --muted:#5e564b; --line:#cfc6b4;
    --accent:#1f5f4a; --accent-ink:#fff; --accent-soft:#e0efe8;
    --warn:#8a3b00; --warn-soft:#fde9d4; --late:#9b1c1c; --late-soft:#fbe0e0;
    --ok-soft:#e0efe8;
  }
  *{box-sizing:border-box}
  html{font-size:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .skip{position:absolute;left:.5rem;top:-4rem;background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:6px;z-index:10}
  .skip:focus{top:.5rem}
  header{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:baseline;justify-content:space-between;
    padding:1rem 1.5rem;background:var(--accent);color:var(--accent-ink)}
  header h1{margin:0;font-size:1.35rem}
  header p{margin:0;font-size:.95rem}
  main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:1.25rem;padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto}
  @media (max-width:820px){main{grid-template-columns:1fr;padding:1rem}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.1rem}
  h2{margin:0 0 .8rem;font-size:1.2rem}
  label,.lbl{display:block;font-weight:600;margin:0 0 .3rem}
  .field{margin-bottom:1rem}
  input[type=text],input[type=search],input[type=date]{
    width:100%;min-height:44px;padding:.5rem .7rem;font:inherit;color:var(--ink);
    background:#fff;border:2px solid #7a705f;border-radius:6px}
  button{font:inherit;min-height:44px;padding:.45rem 1rem;border-radius:6px;border:2px solid var(--accent);
    background:#fff;color:var(--accent);font-weight:600;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-ink)}
  button:disabled{background:#e6e0d3;border-color:#bdb4a2;color:#5e564b;cursor:not-allowed}
  :focus-visible{outline:3px solid #0b57d0;outline-offset:2px}
  .hint{color:var(--muted);font-size:.92rem;margin:.35rem 0 0}
  .results{list-style:none;margin:.4rem 0 0;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;max-height:15rem;overflow:auto}
  .results li+li{border-top:1px solid var(--line)}
  .results button,.results .na{display:block;width:100%;text-align:left;border:0;border-radius:0;min-height:48px;padding:.5rem .75rem;color:var(--ink);background:transparent;font-weight:500}
  .results button:hover{background:var(--accent-soft)}
  .results .na{color:var(--muted)}
  .sub{display:block;color:var(--muted);font-size:.9rem;font-weight:400}
  .wrap{overflow-wrap:anywhere}
  .chip{display:flex;gap:.5rem;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid #9cc3b3;border-radius:8px;padding:.5rem .5rem .5rem .8rem}
  .chip button{min-height:44px;padding:.3rem .7rem;font-size:.92rem}
  .cart{list-style:none;margin:.4rem 0 0;padding:0;display:grid;gap:.4rem}
  .status{margin:.9rem 0 0;padding:.7rem .85rem;border-radius:8px;background:var(--ok-soft);border:1px solid #9cc3b3}
  .status[hidden]{display:none}
  .loans{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.6rem}
  .loan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem .8rem;align-items:center;
    border:1px solid var(--line);border-radius:8px;padding:.7rem .8rem;background:#fff}
  .loan strong{font-size:1.02rem}
  .badge{display:inline-block;font-size:.85rem;font-weight:700;padding:.1rem .55rem;border-radius:99px;margin-top:.25rem;border:1px solid}
  .badge.late{background:var(--late-soft);color:var(--late);border-color:#e0a3a3}
  .badge.today{background:var(--warn-soft);color:var(--warn);border-color:#e6bb92}
  .badge.ok{background:#eef2ee;color:#2d4a3c;border-color:#c3d2c8}
  .empty{border:2px dashed var(--line);border-radius:8px;padding:1.2rem;color:var(--muted);margin-top:.8rem}
  .empty strong{display:block;color:var(--ink);margin-bottom:.2rem}
  .undo{position:sticky;bottom:0;margin:0;display:flex;gap:1rem;align-items:center;justify-content:space-between;
    background:var(--ink);color:#fff;padding:.7rem 1rem;border-radius:8px;margin-top:1rem}
  .undo[hidden]{display:none}
  .undo button{background:#fff;color:var(--ink);border-color:#fff}
  @media (max-width:420px){.loan{grid-template-columns:1fr}.loan button{width:100%}}
</style>
</head>
<body>
<a class="skip" href="#lend-h">Skip to lending</a>
<header>
  <h1>Tool Library · Front desk</h1>
  <p><span id="today"></span> · <span id="counts"></span></p>
</header>

<main>
  <section aria-labelledby="lend-h">
    <h2 id="lend-h" tabindex="-1">Lend tools</h2>

    <div class="field" id="member-field">
      <label for="member-q">1. Who is borrowing?</label>
      <div id="member-pick">
        <input type="search" id="member-q" autocomplete="off" placeholder="Name or member number" aria-describedby="member-hint">
        <p class="hint" id="member-hint">Try “Dev” or “M-0412”.</p>
        <ul class="results" id="member-results" aria-label="Matching members" hidden></ul>
      </div>
      <div id="member-chosen" hidden></div>
    </div>

    <div class="field">
      <label for="tool-q">2. Which tools?</label>
      <input type="search" id="tool-q" autocomplete="off" placeholder="Tool name or tag number" aria-describedby="tool-hint">
      <p class="hint" id="tool-hint">Search by name (“drill”) or the tag on the tool (“T-014”).</p>
      <ul class="results" id="tool-results" aria-label="Matching tools" hidden></ul>
      <ul class="cart" id="cart" aria-label="Tools to lend"></ul>
    </div>

    <div class="field">
      <label for="due">3. Due back</label>
      <input type="date" id="due">
    </div>

    <button class="primary" id="lend-btn" type="button" aria-describedby="lend-why" style="width:100%">Lend</button>
    <p class="hint" id="lend-why"></p>
    <p class="status" id="lend-status" role="status" hidden></p>
  </section>

  <section aria-labelledby="out-h">
    <h2 id="out-h" tabindex="-1">Out now</h2>
    <label for="out-q" class="lbl">Find a loan</label>
    <input type="search" id="out-q" autocomplete="off" placeholder="Borrower or tool">
    <p class="status" id="return-status" role="status" hidden></p>
    <ul class="loans" id="loans"></ul>
    <div id="out-empty"></div>
    <p class="undo" id="undo" hidden><span id="undo-msg"></span><button type="button" id="undo-btn">Undo</button></p>
  </section>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const DAY = 86400000;
  const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
  const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  const today = new Date(); today.setHours(0,0,0,0);
  const plus = n => iso(new Date(today.getTime()+n*DAY));
  const fmt = s => parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const members = [
    {id:'M-0412',name:'Maria Okonkwo'},
    {id:'M-0388',name:'Dev Patel'},
    {id:'M-0507',name:'Anneliese Vandenberghe-Hutchinson-Rodriguez'},
    {id:'M-0291',name:'Tom Reyes'},
    {id:'M-0463',name:'Priya Raman'}
  ];
  const tools = [
    {id:'T-005',name:'Wheelbarrow'},
    {id:'T-008',name:'Hedge trimmer'},
    {id:'T-014',name:'Cordless drill'},
    {id:'T-017',name:'Pressure washer'},
    {id:'T-021',name:'Extension ladder'},
    {id:'T-029',name:'Orbital sander'},
    {id:'T-033',name:'Wet/dry shop vac'},
    {id:'T-040',name:'Tile saw'},
    {id:'T-052',name:'Post-hole digger'},
    {id:'T-061',name:'Socket set, metric and SAE, 94 pieces'}
  ];
  let loans = [
    {tool:'T-014',member:'M-0388',due:plus(-2)},
    {tool:'T-008',member:'M-0412',due:plus(3)},
    {tool:'T-021',member:'M-0507',due:plus(0)},
    {tool:'T-017',member:'M-0291',due:plus(5)},
    {tool:'T-040',member:'M-0463',due:plus(-6)}
  ];
  const mById = id => members.find(m=>m.id===id);
  const tById = id => tools.find(t=>t.id===id);
  const loanOf = id => loans.find(l=>l.tool===id);

  let chosen = null, cart = [], undoFn = null, undoTimer = null;

  $('today').textContent = today.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('due').min = plus(0);
  $('due').value = plus(7);

  /* ---------- member pick ---------- */
  function renderMemberResults(){
    const q = $('member-q').value.trim().toLowerCase();
    const ul = $('member-results');
    if(!q){ ul.hidden = true; ul.innerHTML=''; return; }
    const hits = members.filter(m => m.name.toLowerCase().includes(q) || m.id.toLowerCase().includes(q));
    ul.hidden = false;
    ul.innerHTML = hits.length
      ? hits.map(m=>`<li><button type="button" data-member="${m.id}"><span class="wrap">${esc(m.name)}</span><span class="sub">${m.id}</span></button></li>`).join('')
      : `<li><span class="na">No member matches “${esc($('member-q').value.trim())}”. Check the spelling or try the member number.</span></li>`;
  }
  function renderChosen(){
    const box = $('member-chosen');
    $('member-pick').hidden = !!chosen;
    box.hidden = !chosen;
    if(chosen){
      const n = loans.filter(l=>l.member===chosen.id).length;
      box.innerHTML = `<div class="chip"><div class="wrap"><strong>${esc(chosen.name)}</strong><span class="sub">${chosen.id} · ${n} ${n===1?'tool':'tools'} out now</span></div>
        <button type="button" id="member-change" aria-label="Change borrower, currently ${esc(chosen.name)}">Change</button></div>`;
    }
  }
  $('member-q').addEventListener('input', renderMemberResults);
  $('member-q').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); const b=$('member-results').querySelector('button'); if(b) b.click(); }
    if(e.key==='ArrowDown'){ const b=$('member-results').querySelector('button'); if(b){ e.preventDefault(); b.focus(); } }
  });
  $('member-results').addEventListener('click', e=>{
    const b = e.target.closest('button[data-member]'); if(!b) return;
    chosen = mById(b.dataset.member);
    $('member-q').value=''; renderMemberResults(); renderChosen(); renderLendState();
    $('tool-q').focus();
  });
  $('member-chosen').addEventListener('click', e=>{
    if(e.target.id==='member-change'){ chosen=null; renderChosen(); renderLendState(); $('member-q').focus(); }
  });

  /* ---------- tool pick ---------- */
  function renderToolResults(){
    const raw = $('tool-q').value.trim(), q = raw.toLowerCase();
    const ul = $('tool-results');
    if(!q){ ul.hidden = true; ul.innerHTML=''; return; }
    const hits = tools.filter(t => t.name.toLowerCase().includes(q) || t.id.toLowerCase().includes(q));
    ul.hidden = false;
    if(!hits.length){ ul.innerHTML = `<li><span class="na">No tool matches “${esc(raw)}”. Try fewer letters or the tag number.</span></li>`; return; }
    ul.innerHTML = hits.map(t=>{
      const l = loanOf(t.id);
      if(l){ const m=mById(l.member); return `<li><span class="na"><span class="wrap">${esc(t.name)}</span><span class="sub">${t.id} · Not available: out with ${esc(m.name)}, due ${fmt(l.due)}</span></span></li>`; }
      if(cart.includes(t.id)) return `<li><span class="na"><span class="wrap">${esc(t.name)}</span><span class="sub">${t.id} · Already added</span></span></li>`;
      return `<li><button type="button" data-tool="${t.id}"><span class="wrap">${esc(t.name)}</span><span class="sub">${t.id} · Available</span></button></li>`;
    }).join('');
  }
  function renderCart(){
    $('cart').innerHTML = cart.map(id=>{
      const t=tById(id);
      return `<li class="chip"><div class="wrap"><strong>${esc(t.name)}</strong><span class="sub">${t.id}</span></div>
        <button type="button" data-remove="${id}" aria-label="Remove ${esc(t.name)} from this loan">Remove</button></li>`;
    }).join('');
  }
  $('tool-q').addEventListener('input', renderToolResults);
  $('tool-q').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); const b=$('tool-results').querySelector('button'); if(b) b.click(); }
    if(e.key==='ArrowDown'){ const b=$('tool-results').querySelector('button'); if(b){ e.preventDefault(); b.focus(); } }
  });
  $('tool-results').addEventListener('click', e=>{
    const b=e.target.closest('button[data-tool]'); if(!b) return;
    cart.push(b.dataset.tool);
    $('tool-q').value=''; renderToolResults(); renderCart(); renderLendState();
    $('tool-q').focus();
  });
  $('cart').addEventListener('click', e=>{
    const b=e.target.closest('button[data-remove]'); if(!b) return;
    const i = cart.indexOf(b.dataset.remove);
    cart.splice(i,1); renderCart(); renderLendState();
    const next = $('cart').querySelectorAll('button')[Math.min(i,cart.length-1)];
    (next||$('tool-q')).focus();
  });

  /* ---------- lend ---------- */
  function renderLendState(){
    const due = $('due').value;
    let why = '';
    if(!chosen) why = 'Choose who is borrowing first.';
    else if(!cart.length) why = 'Add at least one tool.';
    else if(!due || due < plus(0)) why = 'Pick a due date that is today or later.';
    const btn = $('lend-btn');
    btn.disabled = !!why;
    btn.textContent = (chosen && cart.length) ? `Lend ${cart.length} ${cart.length===1?'tool':'tools'} to ${chosen.name}` : 'Lend';
    $('lend-why').textContent = why;
  }
  $('due').addEventListener('input', renderLendState);
  $('lend-btn').addEventListener('click', ()=>{
    if($('lend-btn').disabled) return;
    const due = $('due').value, m = chosen, ids = cart.slice();
    const added = ids.map(t=>({tool:t,member:m.id,due}));
    loans = loans.concat(added);
    const names = ids.map(id=>tById(id).name).join(', ');
    chosen=null; cart=[]; $('member-q').value=''; $('tool-q').value='';
    renderMemberResults(); renderToolResults(); renderChosen(); renderCart(); renderLendState(); renderOut();
    const s=$('lend-status'); s.hidden=false;
    s.textContent = `Lent to ${m.name}: ${names}. Due back ${fmt(due)}.`;
    $('return-status').hidden = true;
    showUndo(`Loan recorded for ${m.name}.`, ()=>{
      loans = loans.filter(l=>!added.includes(l));
      s.hidden=true; renderOut(); renderChosen();
    });
    $('member-q').focus();
  });

  /* ---------- out now ---------- */
  function dueInfo(due){
    const diff = Math.round((parse(due)-today)/DAY);
    if(diff<0) return {cls:'late', text:`Overdue by ${-diff} ${diff===-1?'day':'days'} · was due ${fmt(due)}`};
    if(diff===0) return {cls:'today', text:'Due back today'};
    return {cls:'ok', text:`Due ${fmt(due)} · in ${diff} ${diff===1?'day':'days'}`};
  }
  function renderOut(focusIdx){
    const q = $('out-q').value.trim().toLowerCase();
    const sorted = loans.slice().sort((a,b)=>a.due.localeCompare(b.due));
    const list = sorted.filter(l=>{
      if(!q) return true;
      return tById(l.tool).name.toLowerCase().includes(q) || l.tool.toLowerCase().includes(q) ||
             mById(l.member).name.toLowerCase().includes(q) || l.member.toLowerCase().includes(q);
    });
    const late = loans.filter(l=>l.due<plus(0)).length;
    $('counts').textContent = `${loans.length} out${late?`, ${late} overdue`:''}`;
    $('loans').innerHTML = list.map(l=>{
      const t=tById(l.tool), m=mById(l.member), d=dueInfo(l.due);
      return `<li class="loan"><div style="min-width:0">
        <strong class="wrap">${esc(t.name)}</strong> <span class="sub" style="display:inline">${t.id}</span>
        <div class="wrap">${esc(m.name)} <span class="sub" style="display:inline">${m.id}</span></div>
        <span class="badge ${d.cls}">${d.text}</span></div>
        <button type="button" class="primary" data-return="${l.tool}" aria-label="Take back ${esc(t.name)} from ${esc(m.name)}">Take back</button></li>`;
    }).join('');
    const e = $('out-empty');
    if(!loans.length){
      e.innerHTML = `<div class="empty"><strong>Nothing is out right now.</strong>Every tool is on the shelf. Loans you record on the left will show up here.</div>`;
    } else if(!list.length){
      e.innerHTML = `<div class="empty"><strong>No loans match “${esc($('out-q').value.trim())}”.</strong>Check the spelling, or <button type="button" id="clear-q" style="min-height:44px">Show all ${loans.length} loans</button></div>`;
    } else e.innerHTML='';
    if(focusIdx!==undefined){
      const bs=$('loans').querySelectorAll('button');
      (bs[focusIdx]||bs[focusIdx-1]||$('out-q')).focus();
    }
  }
  $('out-q').addEventListener('input', ()=>renderOut());
  $('out-empty').addEventListener('click', e=>{ if(e.target.id==='clear-q'){ $('out-q').value=''; renderOut(); $('out-q').focus(); } });
  $('loans').addEventListener('click', e=>{
    const b=e.target.closest('button[data-return]'); if(!b) return;
    const idx=[...$('loans').querySelectorAll('button')].indexOf(b);
    const loan=loanOf(b.dataset.return), t=tById(loan.tool), m=mById(loan.member);
    loans = loans.filter(l=>l!==loan);
    renderOut(idx);
    const s=$('return-status'); s.hidden=false;
    s.textContent = `${t.name} is back from ${m.name} and ready to lend again.`;
    $('lend-status').hidden = true;
    showUndo(`Took back ${t.name}.`, ()=>{ loans.push(loan); s.hidden=true; renderOut(); renderChosen(); });
  });

  /* ---------- undo ---------- */
  function showUndo(msg, fn){
    clearTimeout(undoTimer);
    undoFn = fn; $('undo-msg').textContent = msg; $('undo').hidden = false;
    undoTimer = setTimeout(hideUndo, 10000);
  }
  function hideUndo(){ $('undo').hidden = true; undoFn = null; }
  $('undo-btn').addEventListener('click', ()=>{
    const fn=undoFn; hideUndo(); if(fn) fn();
    $('out-q').focus();
  });

  renderChosen(); renderCart(); renderLendState(); renderOut();
})();
</script>
</body>
</html>
