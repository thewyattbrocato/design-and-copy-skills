<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front desk · Neighborhood Tool Library</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fff; --ink:#1f2421; --muted:#5a625d; --line:#cfc9bb;
  --accent:#1f5a3a; --accent-ink:#fff; --accent-soft:#e3efe7;
  --warn:#9a2a14; --warn-soft:#fbe9e4; --amber:#7a5200; --amber-soft:#fff1d0;
  --radius:10px;
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #0a4fb3;outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:1rem 1rem 7rem}
header{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:baseline;justify-content:space-between;padding:.5rem 0 1rem}
h1{font-size:1.35rem;margin:0}
header p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tab{flex:1;min-height:3.25rem;border:2px solid var(--line);background:var(--card);border-radius:var(--radius);
  font-weight:650;font-size:1.1rem;cursor:pointer;padding:.5rem 1rem}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .n{font-weight:500;opacity:.9}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:1rem}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
h2{font-size:1.05rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.5rem}
h2 .step{background:var(--ink);color:#fff;border-radius:50%;min-width:1.6rem;height:1.6rem;display:inline-grid;place-items:center;font-size:.9rem}
label.lbl{display:block;font-weight:600;margin-bottom:.25rem}
input[type=search],input[type=date]{width:100%;min-height:2.75rem;border:1.5px solid #77716a;border-radius:8px;padding:.4rem .7rem;background:#fff}
ul{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.4rem}
.row{display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap;
  border:1.5px solid var(--line);border-radius:8px;padding:.55rem .75rem;background:#fff;min-width:0}
.row .main{min-width:0;flex:1 1 12rem}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .sub{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.row.sel{border-color:var(--accent);background:var(--accent-soft)}
.row.over{border-color:var(--warn)}
button.pick{all:unset;box-sizing:border-box;display:flex;width:100%;gap:.75rem;align-items:center;justify-content:space-between;cursor:pointer;min-height:2.5rem}
button.pick:focus-visible,label.pick:focus-within{outline:3px solid #0a4fb3;outline-offset:4px;border-radius:4px}
label.pick{display:flex;gap:.75rem;align-items:center;width:100%;cursor:pointer;min-height:2.5rem}
label.pick input{width:1.4rem;height:1.4rem;accent-color:var(--accent);flex:none}
.row.na{background:#f0eee8;border-style:dashed}
.badge{display:inline-block;font-size:.8rem;font-weight:700;border-radius:99px;padding:.1rem .6rem;white-space:nowrap}
.b-ok{background:var(--accent-soft);color:var(--accent)}
.b-over{background:var(--warn-soft);color:var(--warn)}
.b-out{background:#e8e6df;color:#3d423f}
.b-fix{background:var(--amber-soft);color:var(--amber)}
.btn{min-height:2.75rem;padding:.4rem 1.1rem;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:650;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent)}
.btn:disabled{background:#e6e3da;border-color:#e6e3da;color:#5a5750;cursor:not-allowed}
.notice{margin:.6rem 0 0;padding:.55rem .75rem;border-radius:8px;background:var(--amber-soft);color:#4d3500;border:1px solid #e2c36b}
.empty{margin:.6rem 0 0;padding:1.1rem;border:2px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--ink);margin-bottom:.2rem}
.empty button{margin-top:.6rem}
.chk{display:flex;gap:.4rem;align-items:center;font-size:.9rem;min-height:2.75rem;cursor:pointer}
.chk input{width:1.2rem;height:1.2rem;accent-color:var(--amber)}
.actions{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:.7rem 1rem;z-index:5}
.bar .in{max-width:1100px;margin:0 auto;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar .why{color:var(--muted);flex:1 1 14rem;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;max-width:min(36rem,calc(100% - 2rem));
  background:var(--ink);color:#fff;border-radius:10px;padding:.6rem .6rem .6rem 1rem;display:flex;gap:.75rem;align-items:center;z-index:9}
.toast[hidden]{display:none}
.toast button{background:#fff;color:var(--ink);border:0;border-radius:6px;min-height:2.5rem;padding:0 .9rem;font-weight:700;cursor:pointer}
.toast button.x{background:transparent;color:#fff;font-size:1.2rem;padding:0 .6rem}
#status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}
@media(prefers-reduced-motion:no-preference){.row{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tool Library · Front desk</h1>
    <p id="today"></p>
  </header>

  <div class="tabs" role="tablist" aria-label="What are you doing?">
    <button class="tab" role="tab" id="tab-lend" aria-controls="panel-lend" aria-selected="true">Lend tools</button>
    <button class="tab" role="tab" id="tab-back" aria-controls="panel-back" aria-selected="false" tabindex="-1">Take tools back <span class="n" id="outCount"></span></button>
  </div>

  <div id="panel-lend" role="tabpanel" aria-labelledby="tab-lend" class="grid">
    <section class="card" aria-labelledby="h-member">
      <h2 id="h-member"><span class="step" aria-hidden="true">1</span>Who is borrowing?</h2>
      <label class="lbl" for="memberQ">Member name or number</label>
      <input type="search" id="memberQ" autocomplete="off" placeholder="e.g. Okafor or 1042">
      <ul id="members"></ul>
      <div id="memberNote" aria-live="polite"></div>
    </section>

    <section class="card" aria-labelledby="h-tools">
      <h2 id="h-tools"><span class="step" aria-hidden="true">2</span>Which tools?</h2>
      <label class="lbl" for="toolQ">Tool name or tag number</label>
      <input type="search" id="toolQ" autocomplete="off" placeholder="e.g. drill, ladder, T-014">
      <ul id="tools"></ul>
      <div style="margin-top:1rem;max-width:14rem">
        <label class="lbl" for="due">Due back</label>
        <input type="date" id="due">
      </div>
    </section>
  </div>

  <div id="panel-back" role="tabpanel" aria-labelledby="tab-back" class="hidden">
    <section class="card" aria-labelledby="h-out">
      <h2 id="h-out">Tools currently out</h2>
      <label class="lbl" for="backQ">Search by tool, tag number or member</label>
      <input type="search" id="backQ" autocomplete="off" placeholder="e.g. tile saw or Maya">
      <ul id="loans" tabindex="-1"></ul>
    </section>
  </div>
</div>

<div class="bar" id="lendBar">
  <div class="in">
    <div class="why" id="why"></div>
    <button class="btn" id="lendBtn" aria-describedby="why">Lend</button>
  </div>
</div>

<div class="toast" id="toast" hidden>
  <span id="toastMsg"></span>
  <button id="undoBtn">Undo</button>
  <button class="x" id="toastX" aria-label="Dismiss message">×</button>
</div>
<div id="status" role="status" aria-live="polite"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var DAY=864e5;
  function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
  function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  var today=new Date();today.setHours(0,0,0,0);
  function plus(n){return iso(new Date(today.getTime()+n*DAY))}
  function fmt(s){return parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
  function daysLate(s){return Math.round((today-parse(s))/DAY)}

  var members=[
    {id:1,name:'Maya Okafor',num:'1042'},{id:2,name:'Tomás Rivera',num:'1007'},
    {id:3,name:'Dee Whitaker',num:'1113'},{id:4,name:'Priya Nair',num:'1088'},
    {id:5,name:'Jonas Lindqvist-Abernathy',num:'1130'},{id:6,name:'Ruth Eastman',num:'0991'}
  ];
  var tools=[
    {id:1,name:'Cordless drill',tag:'T-001',st:'in'},{id:2,name:'Extension ladder, 24 ft',tag:'T-004',st:'out'},
    {id:3,name:'Wet tile saw',tag:'T-009',st:'out'},{id:4,name:'Orbital sander',tag:'T-012',st:'in'},
    {id:5,name:'Pressure washer',tag:'T-014',st:'repair'},{id:6,name:'Post-hole digger',tag:'T-017',st:'in'},
    {id:7,name:'Hedge trimmer',tag:'T-021',st:'in'},{id:8,name:'Socket set, metric and SAE',tag:'T-025',st:'in'},
    {id:9,name:'Wheelbarrow',tag:'T-030',st:'out'},{id:10,name:'Circular saw',tag:'T-033',st:'in'}
  ];
  var loans=[
    {id:1,tool:2,member:3,due:plus(-3)},
    {id:2,tool:3,member:1,due:plus(2)},
    {id:3,tool:9,member:6,due:plus(5)}
  ];
  var nextLoan=10;

  var S={tab:'lend',member:null,picked:{},mq:'',tq:'',bq:'',repair:{}};
  $('today').textContent=today.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('due').value=plus(7);$('due').min=plus(0);

  function tool(id){return tools.filter(function(t){return t.id===id})[0]}
  function member(id){return members.filter(function(m){return m.id===id})[0]}
  function loanOf(tid){return loans.filter(function(l){return l.tool===tid})[0]}
  function overdueCount(mid){return loans.filter(function(l){return l.member===mid&&daysLate(l.due)>0}).length}
  function pickedIds(){return Object.keys(S.picked).filter(function(k){return S.picked[k]}).map(Number)}
  function say(msg){$('status').textContent='';setTimeout(function(){$('status').textContent=msg},30)}
  function match(q,arr){q=q.trim().toLowerCase();if(!q)return true;return arr.join(' ').toLowerCase().indexOf(q)>-1}

  /* ---- Lend ---- */
  function renderMembers(){
    var list=members.filter(function(m){return match(S.mq,[m.name,m.num])});
    var h='';
    list.forEach(function(m){
      var sel=S.member===m.id,od=overdueCount(m.id);
      h+='<li><div class="row'+(sel?' sel':'')+'"><button class="pick" data-m="'+m.id+'" aria-pressed="'+sel+'">'
        +'<span class="main"><span class="name">'+esc(m.name)+'</span><br><span class="sub">Member '+m.num+'</span></span>'
        +(od?'<span class="badge b-over">'+od+' overdue</span>':'')
        +(sel?'<span class="badge b-ok">Selected</span>':'')
        +'</button></div></li>';
    });
    if(!list.length)h='<li class="empty"><strong>No member matches “'+esc(S.mq.trim())+'”</strong>Check the spelling or try the number on their card.<br><button class="btn ghost" data-clear="mq">Clear search</button></li>';
    $('members').innerHTML=h;
    var n='';
    if(S.member&&overdueCount(S.member))n='<p class="notice"><strong>'+esc(member(S.member).name)+'</strong> still has '+overdueCount(S.member)+' overdue tool'+(overdueCount(S.member)>1?'s':'')+'. You can still lend, but ask about the return first.</p>';
    $('memberNote').innerHTML=n;
  }
  function renderTools(){
    var list=tools.filter(function(t){return match(S.tq,[t.name,t.tag])});
    var h='';
    list.forEach(function(t){
      var l=loanOf(t.id);
      if(t.st==='in'){
        var on=!!S.picked[t.id];
        h+='<li><div class="row'+(on?' sel':'')+'"><label class="pick"><input type="checkbox" data-t="'+t.id+'"'+(on?' checked':'')+'>'
          +'<span class="main"><span class="name">'+esc(t.name)+'</span><br><span class="sub">'+t.tag+'</span></span>'
          +'<span class="badge b-ok">On the shelf</span></label></div></li>';
      }else{
        var why=t.st==='repair'?'In the repair queue':'Out until '+fmt(l.due)+(daysLate(l.due)>0?' (overdue)':'');
        h+='<li><div class="row na"><span class="main"><span class="name">'+esc(t.name)+'</span><br><span class="sub">'+t.tag+' · '+why+'</span></span>'
          +'<span class="badge '+(t.st==='repair'?'b-fix':'b-out')+'">'+(t.st==='repair'?'Needs repair':'Not available')+'</span></div></li>';
      }
    });
    if(!list.length)h='<li class="empty"><strong>No tool matches “'+esc(S.tq.trim())+'”</strong>Try part of the name, or the tag number on the handle.<br><button class="btn ghost" data-clear="tq">Clear search</button></li>';
    $('tools').innerHTML=h;
  }
  function renderBar(){
    var ids=pickedIds(),m=S.member?member(S.member):null,btn=$('lendBtn'),why=$('why');
    if(S.tab!=='lend'){$('lendBar').classList.add('hidden');return}
    $('lendBar').classList.remove('hidden');
    if(!m&&!ids.length){btn.disabled=true;btn.textContent='Lend';why.textContent='Pick a member and at least one tool.'}
    else if(!m){btn.disabled=true;btn.textContent='Lend';why.textContent='Pick who is borrowing. '+ids.length+' tool'+(ids.length>1?'s':'')+' chosen.'}
    else if(!ids.length){btn.disabled=true;btn.textContent='Lend';why.textContent='Pick at least one tool for '+m.name+'.'}
    else if(!$('due').value){btn.disabled=true;btn.textContent='Lend';why.textContent='Choose a due date.'}
    else{btn.disabled=false;btn.textContent='Lend '+ids.length+' tool'+(ids.length>1?'s':'')+' to '+m.name.split(' ')[0];
      why.textContent=ids.map(function(i){return tool(i).name}).join(', ')+' · due '+fmt($('due').value)}
  }

  /* ---- Take back ---- */
  function renderLoans(){
    $('outCount').textContent='('+loans.length+' out)';
    var list=loans.filter(function(l){var t=tool(l.tool),m=member(l.member);return match(S.bq,[t.name,t.tag,m.name,m.num])});
    list.sort(function(a,b){return parse(a.due)-parse(b.due)});
    var h='';
    list.forEach(function(l){
      var t=tool(l.tool),m=member(l.member),late=daysLate(l.due),od=late>0;
      h+='<li><div class="row'+(od?' over':'')+'"><div class="main"><div class="name">'+esc(t.name)+' <span class="sub">'+t.tag+'</span></div>'
        +'<div class="sub">'+esc(m.name)+' · due '+fmt(l.due)+'</div></div>'
        +(od?'<span class="badge b-over">Overdue '+late+' day'+(late>1?'s':'')+'</span>':'<span class="badge b-out">'+(late===0?'Due today':'On loan')+'</span>')
        +'<label class="chk"><input type="checkbox" data-r="'+l.id+'"'+(S.repair[l.id]?' checked':'')+'> Needs repair</label>'
        +'<button class="btn" data-back="'+l.id+'" aria-label="Take back '+esc(t.name)+' from '+esc(m.name)+'">Take back</button></div></li>';
    });
    if(!loans.length)h='<li class="empty"><strong>Every tool is back on the shelf</strong>Nothing is out right now.<br><button class="btn ghost" data-tab="lend">Lend a tool</button></li>';
    else if(!list.length)h='<li class="empty"><strong>Nothing out matches “'+esc(S.bq.trim())+'”</strong>The tool may already be back, or try the member’s name.<br><button class="btn ghost" data-clear="bq">Clear search</button></li>';
    $('loans').innerHTML=h;
  }

  function renderAll(){renderMembers();renderTools();renderLoans();renderBar()}

  /* ---- Undo toast ---- */
  var undoFn=null,timer=null;
  function toast(msg,undo){
    clearTimeout(timer);undoFn=undo;
    $('toastMsg').textContent=msg;$('undoBtn').hidden=!undo;$('toast').hidden=false;say(msg);
    timer=setTimeout(hideToast,10000);
  }
  function hideToast(){$('toast').hidden=true;undoFn=null}
  $('toastX').onclick=hideToast;
  $('undoBtn').onclick=function(){var f=undoFn;hideToast();if(f)f()};

  /* ---- Actions ---- */
  function doLend(){
    var ids=pickedIds(),m=member(S.member),due=$('due').value,made=[];
    ids.forEach(function(i){var l={id:nextLoan++,tool:i,member:m.id,due:due};loans.push(l);tool(i).st='out';made.push(l.id)});
    var names=ids.length+' tool'+(ids.length>1?'s':'');
    S.picked={};S.tq='';$('toolQ').value='';
    renderAll();
    toast('Lent '+names+' to '+m.name+', due '+fmt(due)+'.',function(){
      loans=loans.filter(function(l){return made.indexOf(l.id)<0});
      ids.forEach(function(i){tool(i).st='in'});
      renderAll();say('Loan undone. '+names+' back on the shelf.');
    });
    $('memberQ').focus();
  }
  function doBack(id){
    var l=loans.filter(function(x){return x.id===id})[0];if(!l)return;
    var t=tool(l.tool),m=member(l.member),fix=!!S.repair[id];
    loans=loans.filter(function(x){return x.id!==id});
    t.st=fix?'repair':'in';delete S.repair[id];
    renderAll();
    toast(t.name+' taken back from '+m.name+(fix?' and set aside for repair.':'.'),function(){
      loans.push(l);t.st='out';if(fix)S.repair[id]=true;renderAll();say(t.name+' is on loan to '+m.name+' again.');
      var b=document.querySelector('[data-back="'+id+'"]');if(b)b.focus();
    });
    var nb=document.querySelector('[data-back]');(nb||$('backQ')).focus();
  }

  /* ---- Events ---- */
  function setTab(t,focus){
    S.tab=t;
    ['lend','back'].forEach(function(k){
      var on=k===t;$('tab-'+k).setAttribute('aria-selected',on);$('tab-'+k).tabIndex=on?0:-1;
      $('panel-'+k).classList.toggle('hidden',!on);
    });
    renderBar();if(focus)$('tab-'+t).focus();
  }
  $('tab-lend').onclick=function(){setTab('lend')};
  $('tab-back').onclick=function(){setTab('back')};
  document.querySelector('.tabs').addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Home'||e.key==='End'){
      e.preventDefault();setTab(e.key==='ArrowLeft'||e.key==='Home'?'lend':'back',true);
    }
  });
  $('memberQ').oninput=function(){S.mq=this.value;renderMembers()};
  $('toolQ').oninput=function(){S.tq=this.value;renderTools()};
  $('backQ').oninput=function(){S.bq=this.value;renderLoans()};
  $('due').oninput=renderBar;
  $('lendBtn').onclick=function(){if(!this.disabled)doLend()};

  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.m){var id=+b.dataset.m;S.member=S.member===id?null:id;renderMembers();renderBar();
      var again=document.querySelector('[data-m="'+id+'"]');if(again)again.focus()}
    else if(b.dataset.back)doBack(+b.dataset.back);
    else if(b.dataset.clear){var k=b.dataset.clear,inp={mq:'memberQ',tq:'toolQ',bq:'backQ'}[k];S[k]='';$(inp).value='';renderAll();$(inp).focus()}
    else if(b.dataset.tab)setTab(b.dataset.tab,true);
  });
  document.addEventListener('change',function(e){
    var i=e.target;
    if(i.dataset.t){S.picked[i.dataset.t]=i.checked;renderTools();renderBar();
      var again=document.querySelector('[data-t="'+i.dataset.t+'"]');if(again)again.focus()}
    else if(i.dataset.r)S.repair[i.dataset.r]=i.checked;
  });

  renderAll();
})();
</script>
</body>
</html>
