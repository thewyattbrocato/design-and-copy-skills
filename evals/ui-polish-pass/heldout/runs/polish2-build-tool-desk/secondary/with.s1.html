<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Library · Front Desk</title>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --text:#1c1d1f; --muted:#5d6068; --border:#d4d2ca;
  --accent:#1f5e4a; --accent-text:#ffffff; --accent-soft:#e2efe9;
  --warn:#7a5000; --warn-soft:#fdf1d6;
  --danger:#a1281f; --danger-soft:#fbe4e1;
  --focus:#0b57d0;
  --radius:10px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --surface:#202226; --text:#eceae4; --muted:#a9acb4; --border:#3a3d44;
    --accent:#6cc4a1; --accent-text:#0f1f19; --accent-soft:#1f3a31;
    --warn:#f0c15a; --warn-soft:#3d3118;
    --danger:#ff9d94; --danger-soft:#4a221f;
    --focus:#8ab4ff;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font)}
.app{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0;line-height:1.2}
h2{font-size:1.1rem;margin:0 0 14px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--mono);font-size:.92em;white-space:nowrap}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top .muted{margin-top:4px}
.tabs{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px 16px;min-height:40px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;flex-direction:column}
.stat-n{font-size:1.8rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-l{color:var(--muted);font-size:.9rem}
.stat-danger{border-color:var(--danger)}
.stat-danger .stat-n{color:var(--danger)}

.flash{border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;border:1px solid}
.flash-ok{background:var(--accent-soft);border-color:var(--accent)}
.flash-err{background:var(--danger-soft);border-color:var(--danger)}

.desk{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card.wide{grid-column:1 / -1}

.field{margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:0;resize:vertical}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.error{color:var(--danger);font-size:.9rem;font-weight:600;margin-top:6px}

.btn{appearance:none;font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 16px;min-height:44px;cursor:pointer}
.btn.primary{width:100%;background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.small{min-height:34px;padding:4px 10px;font-size:.9rem}

.summary-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.summary-box dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.summary-box dt{color:var(--muted);font-size:.85rem}
.summary-box dd{margin:0;font-weight:600}
.notice{margin:0}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:.85rem;color:var(--muted);font-weight:600}
.right{text-align:right}
.empty{color:var(--muted);text-align:center;padding:24px}

.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:600;white-space:nowrap}
.badge-ok{background:var(--accent-soft);color:var(--accent)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}

.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.list li:last-child{border-bottom:0}

.tools-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.search{margin-bottom:12px}
.foot{color:var(--muted);font-size:.85rem;margin-top:18px}

@media (max-width:800px){
  .desk,.tools-grid{grid-template-columns:1fr}
  .card.wide{grid-column:auto}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div>
      <h1>Tool Library</h1>
      <p class="muted" id="today"></p>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button type="button" class="tab" data-view="desk" aria-pressed="true">Desk</button>
      <button type="button" class="tab" data-view="loans" aria-pressed="false">On loan</button>
      <button type="button" class="tab" data-view="tools" aria-pressed="false">Tools</button>
    </nav>
  </header>

  <section class="stats" id="stats" aria-label="Library at a glance"></section>

  <div id="flash" class="flash" role="status" hidden></div>

  <main>

    <!-- DESK: lend and return -->
    <section data-panel="desk" class="desk">
      <div class="card">
        <h2>Lend a tool</h2>
        <form id="lend-form" novalidate>
          <div class="field">
            <label for="lend-member">Member card number</label>
            <input id="lend-member" autocomplete="off" aria-required="true">
            <p class="error" id="lend-member-err" hidden></p>
          </div>
          <div class="field">
            <label for="lend-name">Member name <span class="muted">(optional)</span></label>
            <input id="lend-name" autocomplete="off">
          </div>
          <div class="field">
            <label for="lend-tool">Tool ID</label>
            <input id="lend-tool" list="tool-options" autocomplete="off" placeholder="Scan or type, e.g. T-001" aria-required="true">
            <datalist id="tool-options"></datalist>
            <p class="error" id="lend-tool-err" hidden></p>
          </div>
          <div class="field">
            <label for="lend-due">Return by</label>
            <input id="lend-due" type="date" aria-required="true">
            <p class="error" id="lend-due-err" hidden></p>
          </div>
          <button class="btn primary" type="submit">Lend tool</button>
        </form>
      </div>

      <div class="card">
        <h2>Return a tool</h2>
        <form id="return-form" novalidate>
          <div class="field">
            <label for="ret-tool">Tool ID</label>
            <input id="ret-tool" autocomplete="off" placeholder="Scan or type, e.g. T-001" aria-required="true">
            <p class="error" id="ret-tool-err" hidden></p>
          </div>
          <div id="ret-summary" class="summary-box" aria-live="polite" hidden></div>
          <div class="field">
            <label for="ret-condition">Condition</label>
            <select id="ret-condition">
              <option value="ok">Good, ready to lend</option>
              <option value="cleaning">Needs cleaning</option>
              <option value="damaged">Damaged, needs repair</option>
            </select>
          </div>
          <div class="field">
            <label for="ret-notes">Notes <span class="muted">(required if damaged)</span></label>
            <textarea id="ret-notes" rows="2"></textarea>
            <p class="error" id="ret-notes-err" hidden></p>
          </div>
          <button class="btn primary" type="submit">Check in tool</button>
        </form>
      </div>

      <div class="card wide">
        <h2>Recently checked in</h2>
        <ul id="recent" class="list"></ul>
      </div>
    </section>

    <!-- LOANS -->
    <section data-panel="loans" hidden>
      <div class="card">
        <h2>Currently on loan</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Tool</th>
                <th scope="col">Member</th>
                <th scope="col">Out since</th>
                <th scope="col">Return by</th>
                <th scope="col"><span class="sr-only">Action</span></th>
              </tr>
            </thead>
            <tbody id="loans-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- TOOLS -->
    <section data-panel="tools" hidden>
      <div class="tools-grid">
        <div class="card">
          <h2>All tools</h2>
          <div class="field search">
            <label for="tool-filter" class="sr-only">Search tools</label>
            <input id="tool-filter" type="search" placeholder="Search by ID, name or category" autocomplete="off">
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Tool</th>
                  <th scope="col">Status</th>
                  <th scope="col"><span class="sr-only">Action</span></th>
                </tr>
              </thead>
              <tbody id="tools-body"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h2>Add a tool</h2>
          <form id="add-form" novalidate>
            <div class="field">
              <label for="add-id">Tag ID</label>
              <input id="add-id" autocomplete="off">
              <p class="error" id="add-id-err" hidden></p>
            </div>
            <div class="field">
              <label for="add-name">Name</label>
              <input id="add-name" autocomplete="off">
              <p class="error" id="add-name-err" hidden></p>
            </div>
            <div class="field">
              <label for="add-category">Category <span class="muted">(optional)</span></label>
              <input id="add-category" autocomplete="off">
            </div>
            <button class="btn primary" type="submit">Add tool</button>
          </form>
        </div>
      </div>
    </section>

  </main>

  <p class="foot">Data is saved in this browser only.</p>
</div>

<script>
const KEY = "tool-library-desk-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const dayDiff = (a, b) => Math.round((parse(a) - parse(b)) / 86400000); // a minus b, in days
const pretty = s => parse(s).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const conditionLabel = c => ({ok:"Good", cleaning:"Needs cleaning", damaged:"Damaged"})[c] || "Good";

function seedState(){
  const tools = [
    ["T-001","Cordless drill","Power tools"],
    ["T-002","Circular saw","Power tools"],
    ["T-003","Orbital sander","Power tools"],
    ["T-004","Stepladder, 6 ft","Access"],
    ["T-005","Wheelbarrow","Garden"],
    ["T-006","Hedge trimmer","Garden"],
    ["T-007","Post-hole digger","Garden"],
    ["T-008","Pressure washer","Cleaning"],
    ["T-009","Socket set","Hand tools"],
    ["T-010","Tile cutter","Hand tools"],
    ["T-011","Garden tiller","Garden"],
    ["T-012","Stud finder","Hand tools"]
  ].map(([id, name, category]) => ({id, name, category, status:"available", condition:"ok", note:""}));
  return {tools, loans:[], history:[]};
}

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.tools) && Array.isArray(s.loans)) return {history:[], ...s};
    }
  }catch(e){}
  return seedState();
}
let state = loadState();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const findTool = id => state.tools.find(t => t.id.toLowerCase() === String(id).trim().toLowerCase());
const activeLoan = toolId => state.loans.find(l => l.toolId === toolId);
const statusOf = t => activeLoan(t.id) ? "out" : t.status; // "available" | "maintenance" | "out"
const nextId = () => {
  const n = Math.max(0, ...state.tools.map(t => parseInt(t.id.replace(/\D/g, ""), 10) || 0));
  return "T-" + String(n + 1).padStart(3, "0");
};

function dueLabel(due){
  const diff = dayDiff(due, today());
  if(diff < 0) return {text:`Overdue ${-diff} day${-diff === 1 ? "" : "s"}`, cls:"badge-danger"};
  if(diff === 0) return {text:"Due today", cls:"badge-warn"};
  return {text:"On time", cls:"badge-ok"};
}

function announce(msg, type = "ok"){
  const f = $("#flash");
  f.textContent = msg;
  f.className = "flash flash-" + type;
  f.hidden = false;
}

function setErr(inputId, errId, msg){
  const input = $("#" + inputId), err = $("#" + errId);
  err.textContent = msg || "";
  err.hidden = !msg;
  input.setAttribute("aria-invalid", msg ? "true" : "false");
  if(msg) input.setAttribute("aria-describedby", errId);
  else input.removeAttribute("aria-describedby");
}

/* ---------- Rendering ---------- */

function renderStats(){
  const counts = {available:0, out:0, maintenance:0};
  state.tools.forEach(t => counts[statusOf(t)]++);
  const overdue = state.loans.filter(l => l.due < today()).length;
  const tiles = [
    ["Available", counts.available, ""],
    ["On loan", counts.out, ""],
    ["Overdue", overdue, overdue ? "stat-danger" : ""],
    ["In maintenance", counts.maintenance, ""]
  ];
  $("#stats").innerHTML = tiles.map(([label, n, cls]) =>
    `<div class="stat ${cls}"><span class="stat-n">${n}</span><span class="stat-l">${label}</span></div>`
  ).join("");
}

function renderDatalist(){
  $("#tool-options").innerHTML = state.tools
    .filter(t => statusOf(t) === "available")
    .map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
}

function renderLoans(){
  const rows = [...state.loans].sort((a, b) => a.due.localeCompare(b.due));
  $("#loans-body").innerHTML = rows.length ? rows.map(l => {
    const tool = findTool(l.toolId);
    const d = dueLabel(l.due);
    return `<tr>
      <td><span class="mono">${esc(l.toolId)}</span><br>${esc(tool ? tool.name : "")}</td>
      <td>Member ${esc(l.member)}${l.name ? `<br><span class="muted small">${esc(l.name)}</span>` : ""}</td>
      <td>${pretty(l.out)}</td>
      <td>${pretty(l.due)}<br><span class="badge ${d.cls}">${d.text}</span></td>
      <td class="right"><button class="btn small" type="button" data-return="${esc(l.toolId)}">Check in</button></td>
    </tr>`;
  }).join("") : `<tr><td colspan="5" class="empty">Nothing is checked out right now.</td></tr>`;
}

function statusCell(t){
  const s = statusOf(t);
  if(s === "out"){
    const l = activeLoan(t.id);
    return `<span class="badge badge-ok">On loan · member ${esc(l.member)}</span>`;
  }
  if(s === "maintenance") return `<span class="badge badge-danger">Maintenance</span>`;
  return t.condition === "cleaning"
    ? `<span class="badge badge-warn">Available · needs cleaning</span>`
    : `<span class="badge badge-ok">Available</span>`;
}

let toolFilter = "";
function renderTools(){
  const q = toolFilter.trim().toLowerCase();
  const rows = state.tools.filter(t =>
    !q || [t.id, t.name, t.category].some(v => v.toLowerCase().includes(q)));
  $("#tools-body").innerHTML = rows.length ? rows.map(t => {
    const s = statusOf(t);
    const needsReady = s !== "out" && (t.status === "maintenance" || t.condition === "cleaning");
    return `<tr>
      <td><span class="mono">${esc(t.id)}</span></td>
      <td><strong>${esc(t.name)}</strong><div class="muted small">${esc(t.category)}</div></td>
      <td>${statusCell(t)}${t.note ? `<div class="muted small">${esc(t.note)}</div>` : ""}</td>
      <td class="right">${needsReady ? `<button class="btn small" type="button" data-ready="${esc(t.id)}">Mark ready</button>` : ""}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">${state.tools.length ? "No tools match that search." : "No tools yet. Add one on the right."}</td></tr>`;
}

function renderRecent(){
  $("#recent").innerHTML = state.history.length ? state.history.slice(0, 5).map(h => `
    <li>
      <span><strong>${esc(h.toolName)}</strong> <span class="mono">${esc(h.toolId)}</span>
        <span class="muted">· member ${esc(h.member)}</span>
        ${h.notes ? `<div class="muted small">${esc(h.notes)}</div>` : ""}</span>
      <span class="muted small">${conditionLabel(h.condition)} · ${pretty(h.returned)}</span>
    </li>`).join("") : `<li class="muted">Check-ins will show up here.</li>`;
}

function renderReturnLookup(){
  const raw = $("#ret-tool").value.trim();
  const box = $("#ret-summary");
  if(!raw){ box.hidden = true; box.innerHTML = ""; return; }
  const tool = findTool(raw);
  box.hidden = false;
  if(!tool){
    box.innerHTML = `<p class="notice error">No tool with ID “${esc(raw)}”.</p>`;
    return;
  }
  const l = activeLoan(tool.id);
  if(!l){
    box.innerHTML = `<p class="notice muted">${esc(tool.name)} isn’t checked out right now.${tool.status === "maintenance" ? " It’s in maintenance." : ""}</p>`;
    return;
  }
  const d = dueLabel(l.due);
  box.innerHTML = `<dl>
      <div><dt>Tool</dt><dd>${esc(tool.name)} <span class="mono">${esc(tool.id)}</span></dd></div>
      <div><dt>Borrowed by</dt><dd>Member ${esc(l.member)}${l.name ? ` · ${esc(l.name)}` : ""}</dd></div>
      <div><dt>Out since</dt><dd>${pretty(l.out)}</dd></div>
      <div><dt>Return by</dt><dd>${pretty(l.due)} <span class="badge ${d.cls}">${d.text}</span></dd></div>
    </dl>`;
}

function render(){
  $("#today").textContent = pretty(today());
  renderStats();
  renderDatalist();
  renderLoans();
  renderTools();
  renderRecent();
  renderReturnLookup();
}

function showView(name){
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== name);
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
}

/* ---------- Lend ---------- */

$("#lend-form").addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target;
  const memberNo = $("#lend-member").value.trim();
  const name = $("#lend-name").value.trim();
  const toolInput = $("#lend-tool").value.trim();
  const due = $("#lend-due").value;

  setErr("lend-member", "lend-member-err", memberNo ? "" : "Enter the member’s card number.");

  const tool = findTool(toolInput);
  let toolMsg = "";
  if(!toolInput) toolMsg = "Scan or type the tool’s ID.";
  else if(!tool) toolMsg = `No tool with ID “${toolInput}”. Check the tag on the tool.`;
  else if(statusOf(tool) === "out"){
    const l = activeLoan(tool.id);
    toolMsg = `${tool.id} is already on loan (return by ${pretty(l.due)}).`;
  }
  else if(statusOf(tool) === "maintenance") toolMsg = `${tool.id} is out for maintenance.`;
  setErr("lend-tool", "lend-tool-err", toolMsg);

  let dueMsg = "";
  if(!due) dueMsg = "Choose a return date.";
  else if(dayDiff(due, today()) < 0) dueMsg = "The return date can’t be in the past.";
  setErr("lend-due", "lend-due-err", dueMsg);

  const firstBad = form.querySelector('[aria-invalid="true"]');
  if(!memberNo || toolMsg || dueMsg){
    if(firstBad) firstBad.focus();
    announce("Please fix the highlighted fields.", "err");
    return;
  }

  state.loans.push({id: uid(), toolId: tool.id, member: memberNo, name, out: today(), due});
  save();
  form.reset();
  $("#lend-due").value = addDays(today(), 7);
  render();
  announce(`Lent ${tool.name} (${tool.id}) to member ${memberNo}. Return by ${pretty(due)}.`);
  $("#lend-member").focus();
});

/* ---------- Return ---------- */

$("#ret-tool").addEventListener("input", renderReturnLookup);

$("#return-form").addEventListener("submit", e => {
  e.preventDefault();
  const raw = $("#ret-tool").value.trim();
  const tool = findTool(raw);
  const loan = tool ? activeLoan(tool.id) : null;
  const cond = $("#ret-condition").value;
  const notes = $("#ret-notes").value.trim();

  let toolMsg = "";
  if(!raw) toolMsg = "Scan or type the tool’s ID.";
  else if(!tool) toolMsg = `No tool with ID “${raw}”.`;
  else if(!loan) toolMsg = `${tool.id} isn’t checked out, so there’s nothing to return.`;
  setErr("ret-tool", "ret-tool-err", toolMsg);

  const notesMsg = !toolMsg && cond === "damaged" && !notes
    ? "Describe the damage so whoever repairs it knows what to look at." : "";
  setErr("ret-notes", "ret-notes-err", notesMsg);

  if(toolMsg || notesMsg){
    ($("#ret-tool").getAttribute("aria-invalid") === "true" ? $("#ret-tool") : $("#ret-notes")).focus();
    announce(toolMsg || notesMsg, "err");
    return;
  }

  const lateDays = dayDiff(today(), loan.due);
  state.loans = state.loans.filter(x => x !== loan);
  state.history.unshift({
    id: uid(), toolId: tool.id, toolName: tool.name, member: loan.member,
    returned: today(), condition: cond, notes
  });
  state.history = state.history.slice(0, 20);

  tool.condition = cond;
  tool.status = cond === "damaged" ? "maintenance" : "available";
  tool.note = cond === "ok" ? "" : notes;

  save();
  e.target.reset();
  render();

  let msg = `Checked in ${tool.name} (${tool.id}).`;
  if(lateDays > 0) msg += ` It was ${lateDays} day${lateDays === 1 ? "" : "s"} late.`;
  if(cond === "damaged") msg += " Moved to maintenance.";
  else if(cond === "cleaning") msg += " Flagged as needing cleaning.";
  announce(msg);
  $("#ret-tool").focus();
});

/* ---------- Tools ---------- */

$("#tool-filter").addEventListener("input", e => { toolFilter = e.target.value; renderTools(); });

$("#add-form").addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target;
  const id = $("#add-id").value.trim().toUpperCase();
  const name = $("#add-name").value.trim();
  const category = $("#add-category").value.trim() || "Uncategorized";

  let idMsg = "";
  if(!id) idMsg = "Enter the ID printed on the tool tag.";
  else if(findTool(id)) idMsg = `${id} is already in the library.`;
  setErr("add-id", "add-id-err", idMsg);
  setErr("add-name", "add-name-err", name ? "" : "Enter the tool’s name.");

  const nameMsg = name ? "" : "Enter the tool’s name.";
  if(idMsg || nameMsg){
    const firstBad = form.querySelector('[aria-invalid="true"]');
    if(firstBad) firstBad.focus();
    announce("Please fix the highlighted fields.", "err");
    return;
  }

  state.tools.push({id, name, category, status:"available", condition:"ok", note:""});
  state.tools.sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric:true}));
  save();
  form.reset();
  $("#add-id").placeholder = nextId();
  render();
  announce(`Added ${name} (${id}).`);
  $("#add-id").focus();
});

/* ---------- Navigation and row actions ---------- */

document.addEventListener("click", e => {
  const view = e.target.closest("[data-view]");
  if(view){ showView(view.dataset.view); return; }

  const ret = e.target.closest("[data-return]");
  if(ret){
    showView("desk");
    $("#ret-tool").value = ret.dataset.return;
    render();
    $("#ret-condition").focus();
    return;
  }

  const ready = e.target.closest("[data-ready]");
  if(ready){
    const tool = findTool(ready.dataset.ready);
    if(tool){
      tool.status = "available";
      tool.condition = "ok";
      tool.note = "";
      save();
      render();
      announce(`${tool.id} marked ready to lend.`);
    }
  }
});

/* ---------- Init ---------- */

$("#lend-due").value = addDays(today(), 7);
$("#add-id").placeholder = nextId();
render();
showView("desk");
$("#lend-member").focus();
</script>
</body>
</html>
