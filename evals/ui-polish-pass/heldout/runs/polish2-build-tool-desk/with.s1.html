<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front desk · Maple Street Tool Library</title>
<style>
  :root {
    --bg: #f3f0e8;
    --card: #fffdf8;
    --ink: #1d2823;
    --muted: #55625b;
    --line: #8d978f;
    --soft: #dcd8cc;
    --accent: #1b6445;
    --accent-ink: #ffffff;
    --accent-soft: #e0efe6;
    --warn: #9a2b1c;
    --warn-soft: #fbe6e1;
    --amber: #7a4f00;
    --amber-soft: #fbefcf;
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 1.0625rem; line-height: 1.45;
  }
  .skip {
    position: absolute; left: 8px; top: -60px; background: var(--ink); color: #fff;
    padding: 10px 14px; border-radius: 6px; z-index: 10;
  }
  .skip:focus { top: 8px; }
  :focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
  header.top {
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between;
    padding: 14px clamp(14px, 3vw, 32px); background: var(--ink); color: #f6f3ea;
  }
  header.top h1 { font-size: 1.25rem; margin: 0; letter-spacing: .01em; }
  header.top h1 span { display: block; font-size: .85rem; font-weight: 400; opacity: .8; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .stats li { background: rgba(255,255,255,.1); border-radius: 8px; padding: 6px 12px; font-size: .9rem; }
  .stats b { font-size: 1.15rem; margin-right: 4px; }
  .stats .od b { color: #ffb9ab; }

  main { max-width: 1100px; margin: 0 auto; padding: 18px clamp(14px, 3vw, 32px) 120px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    flex: 1 1 0; min-height: 56px; font: inherit; font-weight: 700; font-size: 1.1rem;
    border: 2px solid var(--ink); background: var(--card); color: var(--ink);
    border-radius: var(--radius); cursor: pointer; padding: 8px 14px;
  }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
  .tabs .count { font-weight: 400; opacity: .85; margin-left: 6px; }

  .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--soft); border-radius: var(--radius); padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 1.15rem; }
  label, .lbl { display: block; font-weight: 600; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
  input[type=text], input[type=search], input[type=date] {
    width: 100%; min-height: 48px; font: inherit; color: var(--ink); background: #fff;
    border: 2px solid var(--line); border-radius: 8px; padding: 8px 12px;
  }
  input[aria-invalid="true"] { border-color: var(--warn); }
  .err { color: var(--warn); font-weight: 600; margin: 4px 0 0; font-size: .95rem; }
  .err::before { content: "⚠ "; }
  .field { margin-bottom: 14px; }

  button.btn {
    font: inherit; font-weight: 700; min-height: 48px; padding: 8px 18px; border-radius: 8px;
    border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button.btn.sec { background: transparent; color: var(--accent); }
  button.btn.big { min-height: 56px; width: 100%; font-size: 1.1rem; }
  button.btn:hover { filter: brightness(1.08); }
  button.btn:disabled { background: var(--soft); border-color: var(--soft); color: #4a524d; cursor: not-allowed; filter: none; }
  button.link {
    font: inherit; background: none; border: 0; color: var(--accent); text-decoration: underline;
    cursor: pointer; padding: 8px 4px; min-height: 44px;
  }

  ul.list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  ul.list li {
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    border: 1px solid var(--soft); border-radius: 8px; padding: 10px 12px; background: #fff;
  }
  .info { min-width: 0; flex: 1; }
  .name { font-weight: 700; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
  .tag {
    display: inline-block; font-size: .85rem; font-weight: 700; padding: 2px 8px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); margin-top: 4px;
  }
  .tag.over { background: var(--warn-soft); color: var(--warn); }
  .tag.today { background: var(--amber-soft); color: var(--amber); }
  li.is-over { border-left: 6px solid var(--warn); }
  li.is-today { border-left: 6px solid var(--amber); }

  .empty { text-align: center; padding: 28px 12px; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }

  .why { color: var(--muted); font-size: .92rem; margin: 8px 0 0; min-height: 1.3em; }

  #toast {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px clamp(14px, 3vw, 32px);
    pointer-events: none; display: flex; justify-content: center;
  }
  #toast .bar {
    pointer-events: auto; background: var(--ink); color: #fff; border-radius: 10px; padding: 8px 8px 8px 16px;
    display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; max-width: 720px; width: 100%;
    box-shadow: 0 6px 24px rgba(0,0,0,.3);
  }
  #toast .bar span { flex: 1 1 220px; overflow-wrap: anywhere; }
  #toast .bar button { font: inherit; font-weight: 700; color: #fff; background: transparent; border: 2px solid #fff;
    border-radius: 8px; min-height: 44px; padding: 4px 14px; cursor: pointer; }
  #toast .bar button.quiet { border-color: transparent; text-decoration: underline; font-weight: 400; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    #toast .bar { animation: up .18s ease-out; }
    @keyframes up { from { transform: translateY(12px); opacity: 0; } }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<header class="top">
  <h1>Maple Street Tool Library <span>Front desk · <span id="today" style="display:inline"></span></span></h1>
  <ul class="stats" aria-label="Library status">
    <li><b id="sOn">0</b>on the shelf</li>
    <li><b id="sOut">0</b>out</li>
    <li class="od"><b id="sOver">0</b>overdue</li>
  </ul>
</header>

<main id="main" tabindex="-1">
  <div class="tabs" role="tablist" aria-label="Desk task">
    <button role="tab" id="tab-lend" aria-selected="true" aria-controls="panel-lend">Lend out</button>
    <button role="tab" id="tab-back" aria-selected="false" aria-controls="panel-back" tabindex="-1">Take back <span class="count" id="backCount"></span></button>
  </div>

  <!-- LEND -->
  <section id="panel-lend" role="tabpanel" aria-labelledby="tab-lend">
    <div class="grid">
      <div class="card">
        <h2>1. Pick tools from the shelf</h2>
        <label for="toolSearch">Find a tool</label>
        <input type="search" id="toolSearch" placeholder="Name or type, e.g. drill" autocomplete="off">
        <p class="hint" id="toolResultNote" aria-live="polite"></p>
        <ul class="list" id="toolList" aria-label="Tools on the shelf"></ul>
      </div>

      <form class="card" id="lendForm" novalidate>
        <h2>2. Who is borrowing?</h2>
        <div class="field">
          <label for="member">Member name</label>
          <input type="text" id="member" list="memberList" autocomplete="off" placeholder="Start typing a name" aria-describedby="memberHint memberErr">
          <datalist id="memberList"></datalist>
          <p class="hint" id="memberHint">Choose from the suggestions so the loan goes on the right card.</p>
          <p class="err" id="memberErr" hidden></p>
        </div>
        <div class="field">
          <label for="due">Due back</label>
          <input type="date" id="due" aria-describedby="dueErr">
          <p class="err" id="dueErr" hidden></p>
        </div>
        <div class="lbl" id="cartLbl">Lending now</div>
        <ul class="list" id="cart" aria-labelledby="cartLbl"></ul>
        <p class="err" id="cartErr" hidden></p>
        <div style="margin-top:14px">
          <button class="btn big" type="submit" id="lendBtn">Lend tools</button>
          <p class="why" id="lendWhy"></p>
        </div>
      </form>
    </div>
  </section>

  <!-- TAKE BACK -->
  <section id="panel-back" role="tabpanel" aria-labelledby="tab-back" hidden>
    <div class="card">
      <h2>Tools currently out</h2>
      <label for="loanSearch">Find a loan</label>
      <input type="search" id="loanSearch" placeholder="Tool or member name" autocomplete="off">
      <p class="hint" id="loanNote" aria-live="polite"></p>
      <ul class="list" id="loanList" aria-label="Tools currently out"></ul>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var DAY = 864e5;
  function midnight(d) { var x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); }
  var today = midnight(new Date());
  function addDays(n) { return today + n * DAY; }
  function fmt(t) { return new Date(t).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
  function iso(t) { var d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  var members = ["Maria Okafor","Dev Patel","Linh Tran","Samuel Whitaker-Alvarez","Ruth Eliasson","Tomás Herrera","Priya Raman","Joan Beaumont-Featherstonehaugh","Ahmed Yusuf","Chloe Dubois"];
  var tools = [
    ["T-001","Cordless drill","Power tools"],["T-002","Circular saw","Power tools"],["T-003","Orbital sander","Power tools"],
    ["T-004","Extension ladder, 24 ft","Ladders"],["T-005","Step ladder, 6 ft","Ladders"],["T-006","Wet/dry vacuum","Cleaning"],
    ["T-007","Pressure washer","Cleaning"],["T-008","Post-hole digger","Garden"],["T-009","Hedge trimmer","Garden"],
    ["T-010","Wheelbarrow","Garden"],["T-011","Socket set, metric and imperial","Hand tools"],["T-012","Tile cutter","Hand tools"],
    ["T-013","Stud finder","Hand tools"],["T-014","Pipe wrench, 18 in","Hand tools"]
  ].map(function (t) { return { id: t[0], name: t[1], cat: t[2], loan: null }; });
  function byId(id) { return tools.filter(function (t) { return t.id === id; })[0]; }
  byId("T-002").loan = { member: "Dev Patel", due: addDays(-3) };
  byId("T-005").loan = { member: "Linh Tran", due: addDays(0) };
  byId("T-007").loan = { member: "Joan Beaumont-Featherstonehaugh", due: addDays(4) };
  byId("T-009").loan = { member: "Ruth Eliasson", due: addDays(-1) };
  byId("T-012").loan = { member: "Tomás Herrera", due: addDays(2) };

  var cart = [];
  var $ = function (id) { return document.getElementById(id); };
  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) el.appendChild(arguments[i]);
    return el;
  }
  function norm(s) { return s.trim().toLowerCase(); }

  function status(due) {
    var d = Math.round((due - today) / DAY);
    if (d < 0) return { cls: "over", text: "Overdue by " + plural(-d, "day") + " · was due " + fmt(due) };
    if (d === 0) return { cls: "today", text: "Due back today" };
    return { cls: "", text: "Due " + fmt(due) + " · " + plural(d, "day") + " left" };
  }

  /* ---------- header / tabs ---------- */
  $("today").textContent = new Date(today).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  members.forEach(function (m) { $("memberList").appendChild(h("option", { value: m })); });
  $("due").value = iso(addDays(7));
  $("due").min = iso(today);

  function stats() {
    var out = tools.filter(function (t) { return t.loan; });
    $("sOut").textContent = out.length;
    $("sOn").textContent = tools.length - out.length;
    $("sOver").textContent = out.filter(function (t) { return t.loan.due < today; }).length;
    $("backCount").textContent = "(" + out.length + ")";
  }

  var tabs = [$("tab-lend"), $("tab-back")], panels = [$("panel-lend"), $("panel-back")];
  function selectTab(i, focus) {
    tabs.forEach(function (t, j) {
      t.setAttribute("aria-selected", j === i);
      t.tabIndex = j === i ? 0 : -1;
      panels[j].hidden = j !== i;
    });
    if (focus) tabs[i].focus();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener("click", function () { selectTab(i); });
    t.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); selectTab(1 - i, true); }
    });
  });

  /* ---------- lend: tool picker ---------- */
  function renderTools() {
    var q = norm($("toolSearch").value), ul = $("toolList");
    ul.textContent = "";
    var shelf = tools.filter(function (t) { return !t.loan; });
    var hits = shelf.filter(function (t) { return !q || norm(t.name + " " + t.cat).indexOf(q) > -1; });
    $("toolResultNote").textContent = q ? plural(hits.length, "tool") + " on the shelf match “" + $("toolSearch").value.trim() + "”" : "";
    if (!shelf.length) {
      ul.appendChild(h("li", { class: "empty", style: "display:block" }, h("strong", { text: "The shelves are empty" }), document.createTextNode("Every tool is out. Use Take back when something returns.")));
      return;
    }
    if (!hits.length) {
      var li = h("li", { class: "empty", style: "display:block" }, h("strong", { text: "No tool on the shelf matches “" + $("toolSearch").value.trim() + "”" }),
        document.createTextNode("It may be out on loan. "));
      var c = h("button", { class: "link", type: "button", text: "Clear search" });
      c.onclick = function () { $("toolSearch").value = ""; renderTools(); $("toolSearch").focus(); };
      li.appendChild(c); ul.appendChild(li); return;
    }
    hits.forEach(function (t) {
      var added = cart.indexOf(t.id) > -1;
      var b = h("button", { class: "btn" + (added ? " sec" : ""), type: "button", text: added ? "Added ✓" : "Add", "aria-label": (added ? "Added: " : "Add ") + t.name });
      if (added) b.disabled = true;
      b.onclick = function () { cart.push(t.id); renderTools(); renderCart(); clearErr("cartErr"); announceNext(t.name + " added to this loan."); };
      ul.appendChild(h("li", {}, h("div", { class: "info" }, h("div", { class: "name", text: t.name }), h("div", { class: "meta", text: t.cat + " · " + t.id })), b));
    });
  }
  var quiet = $("toolResultNote");
  function announceNext(msg) { quiet.textContent = msg; }

  /* ---------- lend: cart ---------- */
  function renderCart() {
    var ul = $("cart"); ul.textContent = "";
    if (!cart.length) {
      ul.appendChild(h("li", { class: "empty", style: "display:block;border-style:dashed" }, h("strong", { text: "No tools added yet" }), document.createTextNode("Pick tools from the list and they appear here.")));
    }
    cart.forEach(function (id) {
      var t = byId(id);
      var b = h("button", { class: "btn sec", type: "button", text: "Remove", "aria-label": "Remove " + t.name + " from this loan" });
      b.onclick = function () {
        cart = cart.filter(function (x) { return x !== id; });
        renderTools(); renderCart(); announceNext(t.name + " removed.");
        $("toolSearch").focus();
      };
      ul.appendChild(h("li", {}, h("div", { class: "info" }, h("div", { class: "name", text: t.name }), h("div", { class: "meta", text: t.id })), b));
    });
    $("lendBtn").textContent = cart.length ? "Lend " + plural(cart.length, "tool") : "Lend tools";
    $("lendWhy").textContent = cart.length ? "" : "Add at least one tool to lend.";
  }

  function setErr(id, msg, input) {
    var e = $(id); e.textContent = msg; e.hidden = false;
    if (input) input.setAttribute("aria-invalid", "true");
  }
  function clearErr(id, input) {
    var e = $(id); e.hidden = true; e.textContent = "";
    if (input) input.removeAttribute("aria-invalid");
  }
  $("member").addEventListener("input", function () { clearErr("memberErr", $("member")); });
  $("due").addEventListener("input", function () { clearErr("dueErr", $("due")); });

  $("lendForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var first = null;
    var mem = members.filter(function (m) { return norm(m) === norm($("member").value); })[0];
    var dueVal = $("due").value, dueT = dueVal ? midnight(dueVal + "T00:00") : NaN;
    clearErr("memberErr", $("member")); clearErr("dueErr", $("due")); clearErr("cartErr");
    if (!$("member").value.trim()) { setErr("memberErr", "Enter who is borrowing.", $("member")); first = first || $("member"); }
    else if (!mem) { setErr("memberErr", "“" + $("member").value.trim() + "” isn’t on the member list. Check the spelling, or pick a name from the suggestions.", $("member")); first = first || $("member"); }
    if (isNaN(dueT)) { setErr("dueErr", "Choose the date the tools are due back.", $("due")); first = first || $("due"); }
    else if (dueT < today) { setErr("dueErr", "The due date is in the past. Choose today or later.", $("due")); first = first || $("due"); }
    if (!cart.length) { setErr("cartErr", "No tools added. Pick at least one from the shelf list."); first = first || $("toolSearch"); }
    if (first) { first.focus(); return; }

    var ids = cart.slice();
    ids.forEach(function (id) { byId(id).loan = { member: mem, due: dueT }; });
    cart = []; $("member").value = ""; $("due").value = iso(addDays(7)); $("toolSearch").value = "";
    refresh();
    toast("Lent " + plural(ids.length, "tool") + " to " + mem + ", due " + fmt(dueT) + ".", function () {
      ids.forEach(function (id) { byId(id).loan = null; });
      refresh(); $("member").focus();
      toast("Loan undone. " + plural(ids.length, "tool") + " back on the shelf.");
    });
    $("member").focus();
  });

  /* ---------- take back ---------- */
  function renderLoans() {
    var q = norm($("loanSearch").value), ul = $("loanList"); ul.textContent = "";
    var out = tools.filter(function (t) { return t.loan; }).sort(function (a, b) { return a.loan.due - b.loan.due; });
    var hits = out.filter(function (t) { return !q || norm(t.name + " " + t.loan.member).indexOf(q) > -1; });
    $("loanNote").textContent = q ? plural(hits.length, "loan") + " match “" + $("loanSearch").value.trim() + "”" : (out.length ? "Overdue loans are listed first." : "");
    if (!out.length) {
      ul.appendChild(h("li", { class: "empty", style: "display:block" }, h("strong", { text: "Nothing is out right now" }), document.createTextNode("Every tool is on the shelf.")));
      return;
    }
    if (!hits.length) {
      var li = h("li", { class: "empty", style: "display:block" }, h("strong", { text: "No loan matches “" + $("loanSearch").value.trim() + "”" }), document.createTextNode("Check the spelling, or try just part of the name. "));
      var c = h("button", { class: "link", type: "button", text: "Clear search" });
      c.onclick = function () { $("loanSearch").value = ""; renderLoans(); $("loanSearch").focus(); };
      li.appendChild(c); ul.appendChild(li); return;
    }
    hits.forEach(function (t) {
      var s = status(t.loan.due);
      var b = h("button", { class: "btn", type: "button", text: "Take back", "aria-label": "Take back " + t.name + " from " + t.loan.member });
      b.onclick = function () {
        var prev = t.loan; t.loan = null; refresh();
        toast(t.name + " is back on the shelf (returned by " + prev.member + ").", function () {
          t.loan = prev; refresh(); toast("Return undone. " + t.name + " is out to " + prev.member + " again.");
        });
        $("loanSearch").focus();
      };
      ul.appendChild(h("li", { class: s.cls ? "is-" + s.cls : "" },
        h("div", { class: "info" },
          h("div", { class: "name", text: t.name }),
          h("div", { class: "meta", text: "With " + t.loan.member + " · " + t.id }),
          h("span", { class: "tag " + s.cls, text: s.text })),
        b));
    });
  }

  /* ---------- toast with undo ---------- */
  var timer;
  function toast(msg, undo) {
    clearTimeout(timer);
    var box = $("toast"); box.textContent = "";
    var bar = h("div", { class: "bar" }, h("span", { text: msg }));
    if (undo) {
      var u = h("button", { type: "button", text: "Undo" });
      u.onclick = function () { clearTimeout(timer); box.textContent = ""; undo(); };
      bar.appendChild(u);
    }
    var d = h("button", { type: "button", class: "quiet", text: "Dismiss" });
    d.onclick = function () { box.textContent = ""; };
    bar.appendChild(d);
    box.appendChild(bar);
    timer = setTimeout(function () { box.textContent = ""; }, undo ? 12000 : 6000);
  }

  function refresh() { stats(); renderTools(); renderCart(); renderLoans(); }
  $("toolSearch").addEventListener("input", renderTools);
  $("loanSearch").addEventListener("input", renderLoans);
  refresh();
})();
</script>
</body>
</html>
