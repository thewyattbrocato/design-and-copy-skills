<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive Inspection Log</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbf7ee;
    --surface: #ffffff;
    --text: #2b2418;
    --muted: #6b5e48;
    --border: #d9cba9;
    --accent: #e0a533;
    --accent-strong: #8a5a10;
    --danger: #b42318;
    --focus: #1d4ed8;
    --chip: #f3e7c4;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1810;
      --surface: #2a241a;
      --text: #f3ead2;
      --muted: #b8a88a;
      --border: #4a3f2a;
      --accent: #e0a533;
      --accent-strong: #f0bb55;
      --danger: #f97066;
      --focus: #93c5fd;
      --chip: #3d3420;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.45;
  }
  header {
    padding: 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: .25rem 0 0; color: var(--muted); font-size: .9rem; }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 1rem;
    display: grid;
    gap: 1.25rem;
  }
  @media (min-width: 860px) {
    main { grid-template-columns: 1.1fr 1fr; align-items: start; }
  }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
  }
  h2 { margin: 0 0 .75rem; font-size: 1.1rem; }
  .grid {
    display: grid;
    gap: .75rem;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .wide { grid-column: 1 / -1; }
  label, legend {
    display: block;
    font-weight: 600;
    font-size: .9rem;
    margin-bottom: .25rem;
  }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  input, select, textarea {
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .5rem .6rem;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible,
  button:focus-visible, input[type="checkbox"]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .checks { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-top: .25rem; }
  .checks label {
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: .35rem;
    margin: 0;
    cursor: pointer;
  }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
  button {
    font: inherit;
    font-weight: 600;
    padding: .55rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--accent-strong);
    background: var(--accent);
    color: #1a1206;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  button.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
    padding: .3rem .6rem;
    font-size: .85rem;
    font-weight: 500;
  }
  .status { min-height: 1.3em; color: var(--muted); font-size: .9rem; margin: .5rem 0 0; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    align-items: end;
    justify-content: space-between;
    margin-bottom: .75rem;
  }
  .toolbar .pick { min-width: 160px; flex: 1 1 160px; }
  .toolbar .pick label { margin-bottom: .25rem; }
  .count { color: var(--muted); font-size: .85rem; margin: 0 0 .5rem; }
  .entry {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .75rem;
    margin-bottom: .6rem;
  }
  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .entry h3 { margin: 0; font-size: 1rem; }
  .meta { color: var(--muted); font-size: .85rem; margin: .35rem 0 0; }
  .note { margin: .4rem 0 0; white-space: pre-wrap; font-size: .95rem; }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: .3rem;
    list-style: none;
    margin: .5rem 0 0;
    padding: 0;
  }
  .tags li {
    background: var(--chip);
    border-radius: 999px;
    padding: .15rem .6rem;
    font-size: .8rem;
  }
  .tags li.alert { background: var(--danger); color: #fff; }
  .empty { color: var(--muted); font-style: italic; }
  @media (prefers-reduced-motion: no-preference) {
    .entry { transition: border-color .15s ease; }
    .entry:hover { border-color: var(--accent); }
  }
</style>
</head>
<body>
<header>
  <h1>Hive Inspection Log</h1>
  <p>Record what you saw each time you open a hive. Entries are saved in this browser.</p>
</header>

<main>
  <section aria-labelledby="new-title">
    <h2 id="new-title">New inspection</h2>
    <form id="form" autocomplete="off">
      <div class="grid">
        <div>
          <label for="when">Date and time</label>
          <input id="when" name="when" type="datetime-local" required>
        </div>
        <div>
          <label for="hive">Hive number</label>
          <input id="hive" name="hive" type="number" min="1" max="99" step="1" required>
        </div>
        <div>
          <label for="queen">Queen</label>
          <select id="queen" name="queen">
            <option value="">Not recorded</option>
            <option value="seen">Seen</option>
            <option value="not-seen">Not seen</option>
            <option value="not-checked">Not checked</option>
          </select>
        </div>
        <div>
          <label for="eggs">Eggs</label>
          <select id="eggs" name="eggs">
            <option value="">Not recorded</option>
            <option value="seen">Seen</option>
            <option value="not-seen">Not seen</option>
            <option value="not-checked">Not checked</option>
          </select>
        </div>
        <div>
          <label for="brood">Brood frames</label>
          <input id="brood" name="brood" type="number" min="0" step="0.5" inputmode="decimal">
        </div>
        <div>
          <label for="bees">Frames of bees</label>
          <input id="bees" name="bees" type="number" min="0" step="0.5" inputmode="decimal">
        </div>
        <div>
          <label for="stores">Honey stores</label>
          <select id="stores" name="stores">
            <option value="">Not recorded</option>
            <option value="none">None</option>
            <option value="light">Light</option>
            <option value="adequate">Adequate</option>
            <option value="heavy">Heavy</option>
          </select>
        </div>
        <div>
          <label for="pollen">Pollen</label>
          <select id="pollen" name="pollen">
            <option value="">Not recorded</option>
            <option value="none">None</option>
            <option value="light">Light</option>
            <option value="adequate">Adequate</option>
            <option value="heavy">Heavy</option>
          </select>
        </div>
        <div>
          <label for="temper">Temperament</label>
          <select id="temper" name="temper">
            <option value="">Not recorded</option>
            <option value="calm">Calm</option>
            <option value="busy">Busy</option>
            <option value="defensive">Defensive</option>
            <option value="aggressive">Aggressive</option>
          </select>
        </div>
        <div>
          <label for="next">Next inspection</label>
          <input id="next" name="next" type="date">
        </div>
        <div>
          <label for="weather">Weather</label>
          <input id="weather" name="weather" type="text" placeholder="e.g. 68°F, sunny, light wind">
        </div>
        <fieldset class="wide" id="checks-group">
          <legend>Observations</legend>
          <div class="checks" id="checks"></div>
        </fieldset>
        <div class="wide">
          <label for="actions">Actions taken</label>
          <input id="actions" name="actions" type="text" placeholder="e.g. added super, treated for mites">
        </div>
        <div class="wide">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" placeholder="Anything else worth remembering"></textarea>
        </div>
      </div>
      <div class="actions">
        <button type="submit">Save inspection</button>
        <button type="reset" class="secondary" id="reset">Clear form</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section aria-labelledby="log-title">
    <h2 id="log-title">Inspection log</h2>
    <div class="toolbar">
      <div class="pick">
        <label for="filter">Show hive</label>
        <select id="filter">
          <option value="all">All hives</option>
        </select>
      </div>
      <button type="button" class="secondary" id="export">Export JSON</button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div id="log"></div>
  </section>
</main>

<script>
(function () {
  'use strict';

  const KEY = 'apiary-inspections-v1';

  const CHECKS = [
    { v: 'varroa', l: 'Varroa signs', alert: true },
    { v: 'foulbrood', l: 'Suspected foulbrood', alert: true },
    { v: 'robbing', l: 'Robbing', alert: true },
    { v: 'swarm-cells', l: 'Swarm cells', alert: true },
    { v: 'queen-cells', l: 'Queen cells' },
    { v: 'beetles', l: 'Small hive beetle' },
    { v: 'wax-moth', l: 'Wax moth' },
    { v: 'chalkbrood', l: 'Chalkbrood' },
    { v: 'dead-bees', l: 'Dead bees at entrance' }
  ];
  const checkDef = Object.fromEntries(CHECKS.map(c => [c.v, c]));

  const $ = id => document.getElementById(id);

  // Build elements safely: text is always set via text nodes, never innerHTML.
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
    for (const c of children) node.append(c);
    return node;
  }

  function cap(s) {
    return s ? s.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase()) : '';
  }

  function nowLocal() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  function fmtDate(when) {
    const d = new Date(when);
    return isNaN(d) ? when : d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  }

  let entries = load();

  function load() {
    try {
      const v = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(v) ? v : [];
    } catch (err) {
      return [];
    }
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(entries));
      return true;
    } catch (err) {
      $('status').textContent = 'Could not save: browser storage is unavailable.';
      return false;
    }
  }

  // Build observation checkboxes from the CHECKS definition
  function buildChecks() {
    const box = $('checks');
    for (const c of CHECKS) {
      const input = el('input', { type: 'checkbox', name: 'checks', value: c.v });
      box.append(el('label', {}, input, c.l));
    }
  }

  function renderFilter() {
    const sel = $('filter');
    const current = sel.value;
    const hives = [...new Set(entries.map(e => e.hive))].sort((a, b) => a - b);
    sel.replaceChildren(
      el('option', { value: 'all' }, 'All hives'),
      ...hives.map(h => el('option', { value: String(h) }, `Hive ${h}`))
    );
    sel.value = hives.map(String).includes(current) ? current : 'all';
  }

  function renderEntry(e) {
    const summary = [
      e.queen && `Queen: ${cap(e.queen)}`,
      e.eggs && `Eggs: ${cap(e.eggs)}`,
      e.brood && `Brood frames: ${e.brood}`,
      e.bees && `Frames of bees: ${e.bees}`,
      e.stores && `Honey: ${cap(e.stores)}`,
      e.pollen && `Pollen: ${cap(e.pollen)}`,
      e.temper && `Temper: ${cap(e.temper)}`,
      e.next && `Next visit: ${e.next}`,
      e.weather && `Weather: ${e.weather}`
    ].filter(Boolean);

    const head = el('div', { class: 'entry-head' },
      el('h3', {}, `Hive ${e.hive}`),
      el('span', { class: 'meta' }, fmtDate(e.when))
    );

    const card = el('article', { class: 'entry' }, head);

    card.append(el('p', { class: 'meta' }, summary.length ? summary.join(' · ') : 'No details recorded'));

    if (e.checks && e.checks.length) {
      const tags = el('ul', { class: 'tags', 'aria-label': 'Observations' });
      for (const v of e.checks) {
        const def = checkDef[v];
        const li = el('li', def && def.alert ? { class: 'alert' } : {}, def ? def.l : v);
        tags.append(li);
      }
      card.append(tags);
    }

    if (e.actions) card.append(el('p', { class: 'note' }, `Actions: ${e.actions}`));
    if (e.notes) card.append(el('p', { class: 'note' }, e.notes));

    const del = el('button', {
      type: 'button',
      class: 'danger',
      'aria-label': `Delete inspection of hive ${e.hive} on ${fmtDate(e.when)}`
    }, 'Delete');
    del.addEventListener('click', () => {
      if (!confirm(`Delete the inspection of hive ${e.hive} from ${fmtDate(e.when)}?`)) return;
      entries = entries.filter(x => x.id !== e.id);
      persist();
      renderFilter();
      renderLog();
    });
    head.append(del);

    return card;
  }

  function renderLog() {
    const filter = $('filter').value;
    const list = $('log');
    const shown = entries
      .filter(e => filter === 'all' || String(e.hive) === filter)
      .sort((a, b) => b.when.localeCompare(a.when));

    $('count').textContent = `${shown.length} of ${entries.length} ${entries.length === 1 ? 'entry' : 'entries'} shown`;
    list.replaceChildren();

    if (!shown.length) {
      list.append(el('p', { class: 'empty' },
        entries.length ? 'No inspections recorded for this hive yet.' : 'No inspections logged yet.'));
      return;
    }
    for (const e of shown) list.append(renderEntry(e));
  }

  $('form').addEventListener('submit', event => {
    event.preventDefault();
    const form = event.currentTarget;
    const fd = new FormData(form);
    const hive = Number(fd.get('hive'));
    if (!Number.isInteger(hive) || hive < 1) {
      $('status').textContent = 'Please enter a hive number.';
      $('hive').focus();
      return;
    }

    const str = k => (fd.get(k) || '').toString().trim();

    entries.push({
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      when: str('when') || nowLocal(),
      hive,
      queen: str('queen'),
      eggs: str('eggs'),
      brood: str('brood'),
      bees: str('bees'),
      stores: str('stores'),
      pollen: str('pollen'),
      temper: str('temper'),
      checks: fd.getAll('checks'),
      next: str('next'),
      weather: str('weather'),
      actions: str('actions'),
      notes: str('notes')
    });

    if (!persist()) {
      entries.pop();
      return;
    }

    // Reset the form but keep the hive number, since you often log several visits in a row
    form.reset();
    $('when').value = nowLocal();
    $('hive').value = hive;
    $('status').textContent = `Saved inspection for hive ${hive}.`;

    renderFilter();
    renderLog();
  });

  $('reset').addEventListener('click', () => {
    // Runs after the form's native reset, so restore the default date
    setTimeout(() => {
      $('when').value = nowLocal();
      $('status').textContent = '';
    }, 0);
  });

  $('filter').addEventListener('change', renderLog);

  $('export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', {
      href: url,
      download: `hive-inspections-${new Date().toISOString().slice(0, 10)}.json`
    });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  // Init
  buildChecks();
  $('when').value = nowLocal();
  renderFilter();
  renderLog();
})();
</script>
</body>
</html>
