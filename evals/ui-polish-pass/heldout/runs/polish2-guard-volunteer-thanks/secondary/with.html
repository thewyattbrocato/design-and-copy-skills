<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're signed up to volunteer | Lantern Festival</title>
  <style>
    :root {
      --bg: #fdf8f0;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #6b5d4f;
      --accent: #b45309;
      --accent-text: #ffffff;
      --accent-soft: #fef3c7;
      --border: #e7dccd;
      --focus: #1d4ed8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1510;
        --card: #241d16;
        --text: #f5ede2;
        --muted: #b8a994;
        --accent: #f59e0b;
        --accent-text: #1a1510;
        --accent-soft: #3a2c12;
        --border: #3d3226;
        --focus: #93c5fd;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
      line-height: 1.25;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
    }

    .next {
      margin: 24px 0 0;
      padding: 16px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--text);
      text-align: left;
      font-size: 0.95rem;
    }

    .next strong {
      display: block;
      margin-bottom: 4px;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    a.button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      font-weight: 600;
    }

    a.button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    @media (max-width: 420px) {
      main { padding: 32px 20px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">✦</div>
    <h1>Thanks for volunteering!</h1>
    <p>You're signed up to help with the Lantern Festival. We're glad to have you.</p>

    <div class="next">
      <strong>What happens next</strong>
      We'll email you your shift details and a short orientation guide. Check your inbox (and spam folder) in the next few days.
    </div>

    <div class="actions">
      <a class="button" href="#">View my shifts</a>
      <a class="button secondary" href="#">Back to festival home</a>
    </div>
  </main>
</body>
</html>
