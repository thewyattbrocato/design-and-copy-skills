<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --bg: #f6efe6;
    --card: #fffdf9;
    --ink: #2b211c;
    --muted: #5e4f46;
    --line: #7a6a5e;
    --accent: #9a4a2a;
    --accent-dark: #7c3a20;
    --error: #a3200f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 30rem;
    margin: 0 auto;
    background: var(--card);
    border-radius: 14px;
    padding: 2rem 1.75rem;
    box-shadow: 0 1px 2px rgba(60, 40, 25, .08), 0 8px 24px rgba(60, 40, 25, .08);
    border-top: 5px solid var(--accent);
  }
  h1 {
    margin: 0 0 .25rem;
    font: 700 1.75rem/1.2 Georgia, "Times New Roman", serif;
    overflow-wrap: anywhere;
  }
  .lede { margin: 0 0 1.5rem; color: var(--muted); }
  .field { margin-bottom: 1.1rem; }
  label, .label {
    display: block;
    margin-bottom: .3rem;
    font-weight: 600;
    font-size: .95rem;
  }
  input[type="text"], input[type="email"], input[type="number"], select {
    width: 100%;
    min-height: 2.75rem;
    padding: .55rem .75rem;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 8px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid #1f5fbf;
    outline-offset: 2px;
  }
  input:user-invalid { border-color: var(--error); }
  .error {
    display: none;
    margin: .3rem 0 0;
    font-size: .875rem;
    color: var(--error);
  }
  input:user-invalid ~ .error { display: block; }
  .row { display: grid; grid-template-columns: 1fr 7rem; gap: 1rem; }
  .check {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin: .25rem 0 1.5rem;
    font-weight: 400;
    cursor: pointer;
  }
  .check input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); margin: 0; flex: none; }
  button {
    width: 100%;
    min-height: 3rem;
    padding: .7rem 1rem;
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color .15s;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: translateY(1px); }
  .policy {
    margin: 1.25rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid #e3d8cb;
    font-size: .875rem;
    color: var(--muted);
  }
  @media (max-width: 30rem) {
    main { padding: 1.5rem 1.15rem; }
    .row { grid-template-columns: 1fr; gap: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Kilnworks Weekend Classes</h1>
  <p class="lede">Pick a class and save your spot.</p>
  <form>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required>
      <p class="error">Please enter your name.</p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <p class="error">Please enter a valid email address, like name@example.com.</p>
    </div>
    <div class="row">
      <div class="field">
        <label for="class">Class</label>
        <select id="class" name="class">
          <option>Wheel basics (Sat 10am)</option>
          <option>Hand-building (Sat 2pm)</option>
          <option>Glazing day (Sun 11am)</option>
        </select>
      </div>
      <div class="field">
        <label for="guests">Guests</label>
        <input type="number" id="guests" name="guests" value="1" min="1" step="1" inputmode="numeric" required>
        <p class="error">Enter at least 1.</p>
      </div>
    </div>
    <label class="check">
      <input type="checkbox" name="news">
      <span>Send me studio news</span>
    </label>
    <button type="submit">Reserve</button>
  </form>
  <p class="policy">Cancel up to 48 hours before class for a full refund.</p>
</main>
</body>
</html>
