<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --clay: #b5573a;
    --clay-dark: #8f4029;
    --ink: #2b2420;
    --muted: #6e625a;
    --paper: #f6f0e8;
    --card: #fffdf9;
    --line: #dccfc1;
    --focus: #1f6f8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 480px;
  }
  .brand {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--clay);
    margin: 0 0 6px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 2rem;
    line-height: 1.15;
    margin: 0 0 8px;
  }
  .lede {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 1.05rem;
  }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 4px solid var(--clay);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 6px 20px rgba(60, 40, 25, 0.08);
  }
  .field { margin-bottom: 18px; }
  label, .legend {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 6px;
  }
  input[type="text"],
  input[type="email"],
  input[type="number"],
  select {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 38px;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }
  input:hover, select:hover { border-color: #c4b3a1; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(31, 111, 139, 0.28);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 120px;
    gap: 16px;
    align-items: start;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 5px 0 0;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    font-weight: 400;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .check input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--clay);
    cursor: pointer;
  }
  button {
    width: 100%;
    padding: 13px 16px;
    font: inherit;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    background: var(--clay);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: var(--clay-dark); }
  button:active { transform: translateY(1px); }
  .policy {
    margin: 18px 4px 0;
    padding-left: 12px;
    border-left: 3px solid var(--line);
    font-size: 0.88rem;
    color: var(--muted);
  }
  @media (max-width: 420px) {
    body { padding: 20px 12px; }
    form { padding: 18px; }
    .row { grid-template-columns: 1fr; gap: 0; }
    h1 { font-size: 1.7rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <p class="brand">Kilnworks</p>
  <h1>Weekend Classes</h1>
  <p class="lede">Pick a class and save your spot.</p>

  <form>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name">
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" inputmode="email">
    </div>

    <div class="row">
      <div class="field">
        <label for="class">Class</label>
        <select id="class" name="class">
          <option>Wheel basics (Sat 10am)</option>
          <option>Hand-building (Sat 2pm)</option>
          <option>Glazing day (Sun 11am)</option>
        </select>
      </div>
      <div class="field">
        <label for="guests">Guests</label>
        <input type="number" id="guests" name="guests" value="1" min="1" inputmode="numeric">
      </div>
    </div>

    <label class="check">
      <input type="checkbox" name="news">
      Send me studio news
    </label>

    <button type="submit">Reserve</button>
  </form>

  <p class="policy">Cancel up to 48 hours before class for a full refund.</p>
</main>
</body>
</html>
