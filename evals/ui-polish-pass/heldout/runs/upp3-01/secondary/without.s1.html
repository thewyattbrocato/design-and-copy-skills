<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --clay: #b5562f;
    --clay-dark: #8f3f1f;
    --cream: #faf6f0;
    --paper: #ffffff;
    --ink: #2b2521;
    --muted: #6f655d;
    --line: #e4dbd0;
    --focus: #e0894f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px;
  }

  main {
    width: 100%;
    max-width: 520px;
  }

  header {
    margin-bottom: 24px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 1.9rem;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .intro {
    margin: 0;
    color: var(--muted);
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 1px 2px rgba(43, 37, 33, 0.04), 0 8px 24px rgba(43, 37, 33, 0.06);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 18px;
  }

  label,
  .label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid #cfc4b7;
    border-radius: 8px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }

  input:focus,
  select:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(224, 137, 79, 0.25);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 96px;
    gap: 16px;
  }

  .checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 24px;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: pointer;
  }

  .checkbox input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--clay);
    cursor: pointer;
  }

  button {
    width: 100%;
    padding: 13px 16px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--clay);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.05s ease;
  }

  button:hover { background: var(--clay-dark); }
  button:active { transform: translateY(1px); }
  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(224, 137, 79, 0.45);
  }

  .policy {
    margin: 20px 0 0;
    font-size: 0.875rem;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 480px) {
    body { padding: 24px 12px; }
    .card { padding: 22px; }
    h1 { font-size: 1.6rem; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kilnworks Weekend Classes</h1>
    <p class="intro">Pick a class and save your spot.</p>
  </header>

  <form class="card">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="text" id="email" name="email">
    </div>

    <div class="field">
      <label for="class">Class</label>
      <select id="class" name="class">
        <option>Wheel basics (Sat 10am)</option>
        <option>Hand-building (Sat 2pm)</option>
        <option>Glazing day (Sun 11am)</option>
      </select>
    </div>

    <div class="field">
      <label for="guests">Guests</label>
      <input type="number" id="guests" name="guests" value="1" min="1">
    </div>

    <label class="checkbox">
      <input type="checkbox" name="news">
      Send me studio news
    </label>

    <button type="submit">Reserve</button>
  </form>

  <p class="policy">Cancel up to 48 hours before class for a full refund.</p>
</main>
</body>
</html>
