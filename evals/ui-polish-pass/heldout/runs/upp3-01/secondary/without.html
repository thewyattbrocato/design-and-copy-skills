<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --text: #2b2622;
    --muted: #6f655c;
    --border: #d9d1c7;
    --accent: #a4502f;
    --accent-hover: #8a4226;
    --focus: rgba(164, 80, 47, 0.25);
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --card: #26221f;
      --text: #f2ece6;
      --muted: #a79b90;
      --border: #3f3832;
      --accent: #e08a62;
      --accent-hover: #f0a07c;
      --focus: rgba(224, 138, 98, 0.3);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px;
  }

  main {
    width: 100%;
    max-width: 480px;
  }

  header h1 {
    margin: 0 0 6px;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0 0 24px;
    color: var(--muted);
  }

  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
  }

  .field {
    display: block;
    margin-bottom: 18px;
  }

  .field > span {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="email"],
  input[type="number"],
  select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    appearance: auto;
  }

  input:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus);
  }

  .checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 24px;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .checkbox input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
  }

  button {
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--accent-hover); }

  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--focus);
  }

  .policy {
    margin: 20px 4px 0;
    font-size: 0.875rem;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 420px) {
    body { padding: 24px 12px; }
    form { padding: 20px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kilnworks Weekend Classes</h1>
    <p>Pick a class and save your spot.</p>
  </header>

  <form>
    <label class="field">
      <span>Name</span>
      <input type="text" name="name" autocomplete="name">
    </label>

    <label class="field">
      <span>Email</span>
      <input type="text" name="email" autocomplete="email">
    </label>

    <label class="field">
      <span>Class</span>
      <select name="class">
        <option>Wheel basics (Sat 10am)</option>
        <option>Hand-building (Sat 2pm)</option>
        <option>Glazing day (Sun 11am)</option>
      </select>
    </label>

    <label class="field">
      <span>Guests</span>
      <input type="number" name="guests" value="1" min="1">
    </label>

    <label class="checkbox">
      <input type="checkbox" name="news">
      <span>Send me studio news</span>
    </label>

    <button type="submit">Reserve</button>
  </form>

  <p class="policy">Cancel up to 48 hours before class for a full refund.</p>
</main>
</body>
</html>
