<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --clay: #b8562f;
    --clay-dark: #8f3f20;
    --cream: #faf5ee;
    --paper: #ffffff;
    --ink: #2b2420;
    --muted: #7a6c63;
    --line: #e6dccf;
    --focus: #e0a04a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 36px 32px 28px;
    box-shadow: 0 1px 2px rgba(43, 36, 32, 0.04), 0 8px 24px rgba(43, 36, 32, 0.06);
  }

  .eyebrow {
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--clay);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .lede {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 15px;
  }

  .field {
    display: block;
    margin-bottom: 18px;
  }

  .field > span {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }

  input:focus,
  select:focus {
    outline: none;
    border-color: var(--clay);
    box-shadow: 0 0 0 3px rgba(184, 86, 47, 0.18);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 110px;
    gap: 14px;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 24px;
    font-size: 14px;
    cursor: pointer;
  }

  .check input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--clay);
    cursor: pointer;
  }

  button {
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--clay);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }

  button:hover { background: var(--clay-dark); }
  button:active { transform: translateY(1px); }
  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--focus);
  }

  .policy {
    margin: 22px 0 0;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    body { padding: 24px 12px; }
    .card { padding: 26px 20px 22px; }
    h1 { font-size: 24px; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Kilnworks Studio</p>
    <h1>Weekend Classes</h1>
    <p class="lede">Pick a class and save your spot.</p>

    <form>
      <label class="field">
        <span>Name</span>
        <input type="text" name="name" autocomplete="name">
      </label>

      <label class="field">
        <span>Email</span>
        <input type="text" name="email" autocomplete="email">
      </label>

      <div class="row">
        <label class="field">
          <span>Class</span>
          <select name="class">
            <option>Wheel basics (Sat 10am)</option>
            <option>Hand-building (Sat 2pm)</option>
            <option>Glazing day (Sun 11am)</option>
          </select>
        </label>

        <label class="field">
          <span>Guests</span>
          <input type="number" name="guests" value="1" min="1">
        </label>
      </div>

      <label class="check">
        <input type="checkbox" name="news">
        <span>Send me studio news</span>
      </label>

      <button type="submit">Reserve</button>
    </form>

    <p class="policy">Cancel up to 48 hours before class for a full refund.</p>
  </main>
</body>
</html>
