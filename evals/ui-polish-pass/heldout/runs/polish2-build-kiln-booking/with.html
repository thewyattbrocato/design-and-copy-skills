<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a kiln – Pottery studio</title>
<style>
  :root {
    --bg: #f6f1ea;
    --card: #ffffff;
    --ink: #2a2320;
    --muted: #5e544d;
    --line: #d9cfc4;
    --field: #857869;
    --accent: #9a4a2a;
    --accent-ink: #ffffff;
    --accent-soft: #f6e4da;
    --ok: #1f6b3a;
    --ok-soft: #e4f2e8;
    --bad: #a3231b;
    --bad-soft: #fbe9e7;
    --focus: #1f5fbf;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .skip { position: absolute; left: 8px; top: -60px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 6px; z-index: 10; }
  .skip:focus { top: 8px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.125rem; margin: 0 0 12px; }
  .lede { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }
  .layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  fieldset { border: 0; margin: 0 0 22px; padding: 0; min-width: 0; }
  legend, .label { font-weight: 600; padding: 0; margin-bottom: 8px; display: block; }
  .hint { color: var(--muted); font-size: .875rem; font-weight: 400; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { position: relative; display: block; }
  .opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .opt span {
    display: block; min-height: 44px; padding: 8px 14px; border: 1.5px solid var(--field);
    border-radius: 8px; background: #fff; overflow-wrap: anywhere;
  }
  .opt small { display: block; color: var(--muted); font-size: .8125rem; }
  .opt input:checked + span { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
  .opt input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .opt input:disabled { cursor: not-allowed; }
  .opt input:disabled + span { background: #efeae4; border-color: var(--line); border-style: dashed; color: var(--muted); }
  .opt input:disabled + span small { color: var(--muted); }
  .days .opt span { text-align: center; min-width: 74px; padding: 6px 8px; }
  .days .opt b { display: block; font-weight: 600; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .kilns { display: grid; gap: 8px; }
  .kilns .opt span { display: flex; flex-direction: column; }
  input[type=text], input[type=email], textarea {
    width: 100%; font: inherit; color: inherit; padding: 10px 12px; min-height: 44px;
    border: 1.5px solid var(--field); border-radius: 8px; background: #fff;
  }
  textarea { min-height: 76px; resize: vertical; }
  [aria-invalid="true"] { border-color: var(--bad) !important; }
  .field { margin-bottom: 18px; }
  .err { color: var(--bad); font-size: .9rem; margin: 6px 0 0; display: flex; gap: 6px; }
  .err::before { content: "Error:"; font-weight: 700; }
  .err[hidden] { display: none; }
  .empty { border: 1.5px dashed var(--field); border-radius: 8px; padding: 16px; background: #faf7f3; }
  .empty p { margin: 0 0 10px; }
  .empty p:last-child { margin: 0; }
  button { font: inherit; cursor: pointer; }
  .btn { min-height: 46px; padding: 10px 20px; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn:hover { background: #823d22; }
  .btn[aria-disabled="true"] { opacity: .75; cursor: progress; }
  .btn.ghost { background: #fff; color: var(--accent); }
  .btn.ghost:hover { background: var(--accent-soft); }
  .btn.small { min-height: 40px; padding: 6px 12px; font-weight: 500; }
  .summary { margin: 0 0 12px; padding: 10px 12px; background: #faf7f3; border-radius: 8px; border: 1px solid var(--line); overflow-wrap: anywhere; }
  .banner { border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; border: 1.5px solid; overflow-wrap: anywhere; }
  .banner h3 { margin: 0 0 4px; font-size: 1rem; }
  .banner p { margin: 0 0 8px; }
  .banner p:last-child { margin-bottom: 0; }
  .banner.bad { background: var(--bad-soft); border-color: var(--bad); }
  .banner.good { background: var(--ok-soft); border-color: var(--ok); }
  .banner[hidden] { display: none; }
  .banner:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
  ul.bookings { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  ul.bookings li { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
  .bk-main { min-width: 0; flex: 1 1 140px; overflow-wrap: anywhere; }
  .bk-main strong { display: block; }
  .bk-main span { color: var(--muted); font-size: .9rem; display: block; }
  .toast {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(440px, calc(100% - 24px)); background: var(--ink); color: #fff;
    border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; z-index: 20;
  }
  .toast[hidden] { display: none; }
  .toast button { background: #fff; color: var(--ink); border: 0; border-radius: 6px; padding: 8px 14px; min-height: 40px; font-weight: 600; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) {
    .opt span, .btn { transition: background-color .12s, border-color .12s; }
  }
  @media (forced-colors: active) {
    .opt input:checked + span { outline: 3px solid Highlight; }
  }
</style>
</head>
<body>
<a class="skip" href="#book-form">Skip to booking form</a>
<main>
  <h1>Book a kiln</h1>
  <p class="lede">Pick a kiln, a firing type and a load window. Booked windows are greyed out and labelled.</p>

  <div class="layout">
    <section class="card" aria-labelledby="form-h">
      <h2 id="form-h">New booking</h2>

      <div id="confirm" class="banner good" tabindex="-1" hidden></div>
      <div id="fail" class="banner bad" role="alert" hidden></div>

      <form id="book-form" novalidate>
        <fieldset>
          <legend>1. Kiln</legend>
          <div class="kilns" id="kilns"></div>
        </fieldset>

        <fieldset>
          <legend>2. Firing type</legend>
          <div class="opts" id="firings"></div>
        </fieldset>

        <fieldset>
          <legend>3. Day <span class="hint">(next 14 days)</span></legend>
          <div class="opts days" id="days"></div>
        </fieldset>

        <fieldset id="slot-set" aria-describedby="slot-err">
          <legend>4. Load window <span class="hint" id="slot-hint"></span></legend>
          <div id="slots" class="slots"></div>
          <div id="slot-empty" class="empty" hidden></div>
          <p class="err" id="slot-err" hidden></p>
        </fieldset>

        <div class="field">
          <label class="label" for="name">Your name</label>
          <input type="text" id="name" autocomplete="name" aria-describedby="name-err" required>
          <p class="err" id="name-err" hidden></p>
        </div>
        <div class="field">
          <label class="label" for="email">Email <span class="hint">for your booking confirmation</span></label>
          <input type="email" id="email" autocomplete="email" aria-describedby="email-err" required>
          <p class="err" id="email-err" hidden></p>
        </div>
        <div class="field">
          <label class="label" for="notes">Notes for the studio <span class="hint">(optional)</span></label>
          <textarea id="notes" placeholder="e.g. two tall vases, one large platter"></textarea>
        </div>

        <p class="summary" id="summary" aria-live="polite"></p>
        <button class="btn" type="submit" id="submit">Book this window</button>
      </form>
    </section>

    <section class="card" aria-labelledby="mine-h">
      <h2 id="mine-h" tabindex="-1">Your upcoming bookings</h2>
      <div id="mine"></div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-msg"></span>
  <button type="button" id="toast-undo">Undo</button>
</div>

<script>
(function () {
  // ---- Sample schedule: replace with the studio's real kilns, firing types and open days. ----
  var KILNS = [
    { id: "large",  name: "Large electric kiln", note: "Good for full loads",           firings: ["Bisque (cone 04)", "Glaze (cone 6)"], days: [1,2,3,4,5,6] },
    { id: "test",   name: "Small test kiln",     note: "Test tiles and small pieces",   firings: ["Bisque (cone 04)", "Glaze (cone 6)", "Test tiles"], days: [1,2,3,4,5,6,0] },
    { id: "gas",    name: "Gas kiln",            note: "Reduction firings",             firings: ["Glaze reduction (cone 10)"], days: [2,4,6] }
  ];
  var WINDOWS = [8, 10, 12, 14, 16, 18]; // each window is two hours

  var $ = function (id) { return document.getElementById(id); };
  var state = { kiln: KILNS[0].id, firing: KILNS[0].firings[0], day: null, slot: null, busy: false };
  var bookings = [];
  try { bookings = JSON.parse(localStorage.getItem("kiln-bookings") || "[]"); } catch (e) {}
  var lastRemoved = null, toastTimer = null;

  function save() { try { localStorage.setItem("kiln-bookings", JSON.stringify(bookings)); } catch (e) {} }
  function kilnById(id) { return KILNS.filter(function (k) { return k.id === id; })[0]; }
  function dkey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayLong(k) { return parseKey(k).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }); }
  function dayShort(k) { return parseKey(k).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); }
  function hh(h) { return h + ":00"; }
  function range(i) { return hh(WINDOWS[i]) + "–" + hh(WINDOWS[i] + 2); }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  var today = new Date(); today.setHours(0, 0, 0, 0);
  var DAYS = [];
  for (var i = 0; i < 14; i++) { var d = new Date(today); d.setDate(today.getDate() + i); DAYS.push(dkey(d)); }
  state.day = DAYS[0];

  function mineAt(kiln, day, idx) {
    return bookings.some(function (b) { return b.kiln === kiln && b.day === day && b.idx === idx; });
  }
  function slotStatus(kiln, day, idx) {
    if (mineAt(kiln, day, idx)) return "yours";
    var start = parseKey(day); start.setHours(WINDOWS[idx]);
    if (start <= new Date()) return "passed";
    if (hash(kiln + day + idx) % 3 === 0) return "booked"; // sample availability
    return "open";
  }

  // ---- Rendering ----
  function radio(name, value, checked, html, disabled) {
    return '<label class="opt"><input type="radio" name="' + name + '" value="' + esc(value) + '"' +
      (checked ? " checked" : "") + (disabled ? " disabled" : "") + '><span>' + html + '</span></label>';
  }
  function renderKilns() {
    $("kilns").setAttribute("role", "radiogroup");
    $("kilns").setAttribute("aria-label", "Kiln");
    $("kilns").innerHTML = KILNS.map(function (k) {
      return radio("kiln", k.id, k.id === state.kiln, esc(k.name) + "<small>" + esc(k.note) + "</small>");
    }).join("");
  }
  function renderFirings() {
    var k = kilnById(state.kiln);
    $("firings").setAttribute("role", "radiogroup");
    $("firings").setAttribute("aria-label", "Firing type");
    $("firings").innerHTML = k.firings.map(function (f) {
      return radio("firing", f, f === state.firing, esc(f));
    }).join("");
  }
  function renderDays() {
    var k = kilnById(state.kiln);
    $("days").setAttribute("role", "radiogroup");
    $("days").setAttribute("aria-label", "Day");
    $("days").innerHTML = DAYS.map(function (key) {
      var dt = parseKey(key), open = k.days.indexOf(dt.getDay()) > -1;
      var wd = dt.toLocaleDateString(undefined, { weekday: "short" });
      var dm = dt.toLocaleDateString(undefined, { day: "numeric", month: "short" });
      return radio("day", key, key === state.day,
        "<b>" + esc(wd) + "</b>" + esc(dm) + (open ? "" : "<small>No windows</small>"));
    }).join("");
  }
  function renderSlots() {
    var k = kilnById(state.kiln), dt = parseKey(state.day);
    var dayOpen = k.days.indexOf(dt.getDay()) > -1;
    var items = dayOpen ? WINDOWS.map(function (_, i) { return { i: i, s: slotStatus(state.kiln, state.day, i) }; }) : [];
    var anyOpen = items.some(function (x) { return x.s === "open"; });
    if (state.slot !== null && !items.some(function (x) { return x.i === state.slot && x.s === "open"; })) state.slot = null;

    $("slot-hint").textContent = "– " + dayLong(state.day);
    var box = $("slots"), empty = $("slot-empty");
    box.setAttribute("role", "radiogroup");
    box.setAttribute("aria-label", "Load window on " + dayLong(state.day));

    if (!dayOpen) {
      box.hidden = true; empty.hidden = false;
      empty.innerHTML = "<p><strong>The " + esc(k.name) + " has no load windows on " + esc(dt.toLocaleDateString(undefined, { weekday: "long" })) + "s.</strong></p>" +
        '<p><button type="button" class="btn ghost small" id="next-open">Show the next day with windows</button></p>';
    } else if (!anyOpen) {
      box.hidden = false; empty.hidden = false;
      empty.innerHTML = "<p><strong>Nothing left to book on " + esc(dayShort(state.day)) + " for the " + esc(k.name) + ".</strong></p>" +
        '<p><button type="button" class="btn ghost small" id="next-open">Show the next day with open windows</button></p>';
    } else { empty.hidden = true; box.hidden = false; }

    box.innerHTML = items.map(function (x) {
      var label = { open: "Open", booked: "Booked", yours: "Yours", passed: "Passed" }[x.s];
      return radio("slot", x.i, state.slot === x.i, esc(range(x.i)) + "<small>" + label + "</small>", x.s !== "open");
    }).join("");
    if (!dayOpen) box.innerHTML = "";
    updateSummary();
  }
  function updateSummary() {
    var k = kilnById(state.kiln);
    $("summary").textContent = state.slot === null
      ? "Choose a load window to continue."
      : k.name + " · " + state.firing + " · " + dayShort(state.day) + ", " + range(state.slot);
  }
  function renderMine() {
    var list = bookings.slice().sort(function (a, b) { return (a.day + a.idx).localeCompare(b.day + b.idx, undefined, { numeric: true }); });
    if (!list.length) {
      $("mine").innerHTML = '<div class="empty"><p><strong>No upcoming bookings.</strong></p><p>Once you book a window it will appear here, and you can cancel it from this list.</p></div>';
      return;
    }
    $("mine").innerHTML = '<ul class="bookings">' + list.map(function (b) {
      var k = kilnById(b.kiln), when = dayShort(b.day) + ", " + range(b.idx);
      return '<li data-id="' + b.id + '"><div class="bk-main"><strong>' + esc(k.name) + "</strong><span>" + esc(b.firing) + "</span><span>" + esc(when) + "</span></div>" +
        '<button type="button" class="btn ghost small" data-cancel="' + b.id + '" aria-label="Cancel booking: ' + esc(k.name + ", " + when) + '">Cancel</button></li>';
    }).join("") + "</ul>";
  }

  function renderAll() { renderKilns(); renderFirings(); renderDays(); renderSlots(); renderMine(); }

  // ---- Changes ----
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.name === "kiln") {
      state.kiln = t.value; state.firing = kilnById(t.value).firings[0]; state.slot = null;
      renderFirings(); renderDays(); renderSlots();
    } else if (t.name === "firing") { state.firing = t.value; updateSummary(); }
    else if (t.name === "day") { state.day = t.value; state.slot = null; renderSlots(); }
    else if (t.name === "slot") { state.slot = +t.value; clearErr("slot"); updateSummary(); }
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.id === "next-open") {
      var k = kilnById(state.kiln), from = DAYS.indexOf(state.day);
      for (var i = from + 1; i < DAYS.length; i++) {
        if (k.days.indexOf(parseKey(DAYS[i]).getDay()) > -1 &&
            WINDOWS.some(function (_, j) { return slotStatus(state.kiln, DAYS[i], j) === "open"; })) {
          state.day = DAYS[i]; state.slot = null; renderDays(); renderSlots();
          var chk = document.querySelector('input[name="day"]:checked'); if (chk) chk.focus();
          return;
        }
      }
      $("slot-empty").innerHTML = "<p><strong>No open windows in the next 14 days for the " + esc(k.name) + ".</strong></p><p>Try a different kiln above.</p>";
    } else if (t.dataset.cancel) cancelBooking(t.dataset.cancel);
    else if (t.id === "retry") submit();
  });

  // ---- Validation ----
  function setErr(id, msg, inputId) {
    var p = $(id + "-err"); p.textContent = msg; p.hidden = false;
    if (inputId) $(inputId).setAttribute("aria-invalid", "true");
  }
  function clearErr(id, inputId) {
    var p = $(id + "-err"); p.hidden = true; p.textContent = "";
    if (inputId) $(inputId).removeAttribute("aria-invalid");
  }
  $("name").addEventListener("input", function () { if (this.value.trim()) clearErr("name", "name"); });
  $("email").addEventListener("input", function () { if (/^\S+@\S+\.\S+$/.test(this.value.trim())) clearErr("email", "email"); });

  function validate() {
    var first = null;
    if (state.slot === null) {
      setErr("slot", "Choose an open load window before booking.");
      first = first || document.querySelector('input[name="slot"]:not(:disabled)') || $("next-open") || $("slot-set");
    } else clearErr("slot");
    if (!$("name").value.trim()) { setErr("name", "Enter your name so the studio knows whose firing this is.", "name"); first = first || $("name"); } else clearErr("name", "name");
    var em = $("email").value.trim();
    if (!em) { setErr("email", "Enter your email address.", "email"); first = first || $("email"); }
    else if (!/^\S+@\S+\.\S+$/.test(em)) { setErr("email", "That doesn't look like an email address. Check for a missing @ or domain.", "email"); first = first || $("email"); }
    else clearErr("email", "email");
    if (first) { first.focus(); return false; }
    return true;
  }

  // ---- Submit ----
  // Replace saveBooking with a real request to your booking backend.
  function saveBooking(b) {
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        if (!navigator.onLine) return reject(new Error("offline"));
        if (slotStatus(b.kiln, b.day, b.idx) !== "open") return reject(new Error("taken"));
        resolve(b);
      }, 700);
    });
  }
  $("book-form").addEventListener("submit", function (e) { e.preventDefault(); submit(); });

  function submit() {
    if (state.busy) return;
    $("confirm").hidden = true; $("fail").hidden = true;
    if (!validate()) return;
    var btn = $("submit");
    state.busy = true; btn.setAttribute("aria-disabled", "true"); btn.textContent = "Booking…";
    var b = { id: String(Date.now()), kiln: state.kiln, firing: state.firing, day: state.day, idx: state.slot,
              name: $("name").value.trim(), email: $("email").value.trim(), notes: $("notes").value.trim() };
    saveBooking(b).then(function () {
      bookings.push(b); save();
      state.slot = null;
      renderSlots(); renderMine();
      var k = kilnById(b.kiln), c = $("confirm");
      c.innerHTML = "<h3>Booked: " + esc(k.name) + "</h3><p>" + esc(b.firing) + " · " + esc(dayLong(b.day)) + ", " + esc(range(b.idx)) +
        "</p><p>A confirmation will be sent to " + esc(b.email) + ".</p>";
      c.hidden = false; c.focus();
    }).catch(function (err) {
      var f = $("fail"), msg;
      if (err && err.message === "taken") {
        renderSlots();
        msg = "<h3>That window was just taken</h3><p>Someone else booked it first. Your details are still filled in; pick another window and book again.</p>";
      } else if (err && err.message === "offline") {
        msg = "<h3>Your booking wasn't saved</h3><p>You appear to be offline, so nothing was booked. Your details are still here.</p><p><button type=\"button\" class=\"btn small\" id=\"retry\">Try again</button></p>";
      } else {
        msg = "<h3>Your booking wasn't saved</h3><p>The booking couldn't be completed and nothing was reserved. Your details are still here.</p><p><button type=\"button\" class=\"btn small\" id=\"retry\">Try again</button></p>";
      }
      f.innerHTML = msg; f.hidden = false;
    }).then(function () {
      state.busy = false; btn.removeAttribute("aria-disabled"); btn.textContent = "Book this window";
    });
  }

  // ---- Cancel with undo ----
  function showToast(msg) {
    $("toast-msg").textContent = msg; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $("toast").hidden = true; lastRemoved = null; }, 8000);
  }
  function cancelBooking(id) {
    var idx = bookings.findIndex(function (b) { return b.id === id; });
    if (idx < 0) return;
    lastRemoved = { b: bookings[idx], at: idx };
    bookings.splice(idx, 1); save();
    renderSlots(); renderMine();
    var next = document.querySelector("[data-cancel]");
    (next || $("mine-h")).focus();
    var k = kilnById(lastRemoved.b.kiln);
    showToast("Cancelled " + k.name + ", " + dayShort(lastRemoved.b.day) + " " + range(lastRemoved.b.idx) + ".");
  }
  $("toast-undo").addEventListener("click", function () {
    if (!lastRemoved) return;
    var r = lastRemoved; lastRemoved = null;
    if (slotStatus(r.b.kiln, r.b.day, r.b.idx) === "booked") { showToast("Couldn't restore it: someone else booked that window."); return; }
    bookings.splice(Math.min(r.at, bookings.length), 0, r.b); save();
    $("toast").hidden = true; clearTimeout(toastTimer);
    renderSlots(); renderMine();
    var again = document.querySelector('[data-cancel="' + r.b.id + '"]'); if (again) again.focus();
  });

  renderAll();
})();
</script>
</body>
</html>
