<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a kiln – Studio kiln booking</title>
<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#2b2420; --muted:#665b52;
  --line:#d9cfc3; --field:#8a7d72; --accent:#9a3f1d; --accent-d:#7a2f14;
  --ok:#1f5f3a; --okbg:#e6f2ea; --err:#a3201a; --errbg:#fbebe9; --sel:#f7e4d9;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--font)}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:6px;z-index:10}
.skip:focus{top:.5rem}
main{max-width:68rem;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font-size:1.75rem;line-height:1.2;margin:.5rem 0 .25rem}
.lede{margin:0 0 1.5rem;color:var(--muted);max-width:40rem}
.grid{display:grid;gap:1.5rem;grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
@media (max-width:52rem){.grid{grid-template-columns:minmax(0,1fr)}}
section.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem}
h2{font-size:1.2rem;margin:0 0 1rem}
fieldset{border:0;margin:0 0 1.25rem;padding:0;min-width:0}
legend,label.l{font-weight:600;display:block;margin:0 0 .4rem;padding:0}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 .5rem}
input[type=text],input[type=date],textarea{
  width:100%;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--field);
  border-radius:8px;padding:.6rem .7rem;min-height:2.75rem}
textarea{resize:vertical;min-height:4.5rem}
:focus-visible{outline:3px solid #1a5fb4;outline-offset:2px}
.opts{display:grid;gap:.6rem}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .box{display:block;border:1.5px solid var(--field);border-radius:10px;background:#fff;padding:.7rem .85rem;min-height:2.75rem}
.opt input:checked + .box{background:var(--sel);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input:focus-visible + .box{outline:3px solid #1a5fb4;outline-offset:2px}
.opt input:disabled{cursor:not-allowed}
.opt input:disabled + .box{background:#efe9e1;border-color:var(--line);color:var(--muted)}
.opt b{display:block}
.opt small{color:var(--muted);font-size:.88rem}
.opt input:checked + .box small{color:var(--ink)}
.slots{grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr))}
.tag{display:inline-block;font-size:.8rem;font-weight:600;border:1px solid currentColor;border-radius:99px;padding:0 .5rem;margin-top:.2rem}
.err{color:var(--err);font-weight:600;font-size:.92rem;margin:.4rem 0 0}
.err::before{content:"⚠ "}
[aria-invalid=true]{border-color:var(--err)!important;border-width:2px}
.summary{background:var(--errbg);border:1.5px solid var(--err);border-radius:10px;padding:.75rem 1rem;margin:0 0 1.25rem}
.summary p{margin:0 0 .25rem;font-weight:700;color:var(--err)}
.summary ul{margin:0;padding-left:1.2rem}
.summary a{color:var(--err)}
.btn{font:inherit;font-weight:600;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;padding:.65rem 1.25rem;min-height:2.75rem;cursor:pointer}
.btn:hover{background:var(--accent-d)}
.btn[aria-disabled=true]{opacity:.75;cursor:progress}
.btn.sec{background:transparent;color:var(--accent)}
.btn.sec:hover{background:var(--sel)}
.btn.sm{padding:.35rem .8rem;min-height:2.5rem}
.status{border-radius:10px;padding:.75rem 1rem;margin:0 0 1rem;display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--ok);font-weight:600}
.status.ok .btn{color:var(--ok);border-color:var(--ok)}
.status[hidden]{display:none}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
ul.list li{border:1px solid var(--line);border-radius:10px;padding:.8rem;background:#fff;display:flex;gap:.75rem;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
ul.list .info{min-width:0;flex:1 1 12rem;overflow-wrap:anywhere}
ul.list .info b{display:block}
.note{color:var(--muted);font-size:.92rem;margin-top:.2rem}
.empty{border:1.5px dashed var(--field);border-radius:10px;padding:1.25rem;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:.25rem}
.slotempty{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.opt .box{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<a class="skip" href="#form">Skip to booking form</a>
<main>
  <h1>Book kiln time</h1>
  <p class="lede">Reserve a loading slot in one of the shared kilns. Pick a kiln, a day and a slot, and tell us what you're firing.</p>

  <div id="status" class="status ok" role="status" hidden tabindex="-1">
    <span id="statusText"></span>
    <button type="button" class="btn sec sm" id="undoBtn" hidden>Undo</button>
  </div>

  <div class="grid">
    <section class="card" aria-labelledby="formH">
      <h2 id="formH">New booking</h2>
      <form id="form" novalidate>
        <div id="summary" class="summary" role="alert" tabindex="-1" hidden></div>

        <div style="margin-bottom:1.25rem">
          <label class="l" for="name">Your name</label>
          <input type="text" id="name" name="name" autocomplete="name" aria-describedby="nameErr">
          <p class="err" id="nameErr" hidden></p>
        </div>

        <fieldset id="kilnSet" aria-describedby="kilnErr">
          <legend>Kiln</legend>
          <div class="opts" id="kilns"></div>
          <p class="err" id="kilnErr" hidden></p>
        </fieldset>

        <div style="margin-bottom:1.25rem">
          <label class="l" for="date">Day</label>
          <input type="date" id="date" name="date" aria-describedby="dateErr">
          <p class="err" id="dateErr" hidden></p>
        </div>

        <fieldset id="slotSet" aria-describedby="slotErr">
          <legend>Loading slot</legend>
          <p class="slotempty" id="slotPrompt">Choose a kiln and a day to see which slots are open.</p>
          <div class="opts slots" id="slots" hidden></div>
          <p class="err" id="slotErr" hidden></p>
        </fieldset>

        <div style="margin-bottom:1.25rem">
          <label class="l" for="notes">What are you firing? <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
          <textarea id="notes" name="notes" maxlength="300" placeholder="e.g. 6 mugs and a large platter, cone 6 glaze"></textarea>
        </div>

        <button class="btn" type="submit" id="submit">Book this slot</button>
      </form>
    </section>

    <section class="card" aria-labelledby="mineH">
      <h2 id="mineH">Your upcoming bookings</h2>
      <div id="mine" tabindex="-1"></div>
    </section>
  </div>
</main>

<script>
/* Edit these lists to match the studio's real kilns and loading windows. */
const KILNS = [
  {id:'electric', name:'Large electric kiln', detail:'Bisque and glaze firings up to cone 6'},
  {id:'test',     name:'Small test kiln',     detail:'Test tiles and small loads'},
  {id:'gas',      name:'Gas kiln',            detail:'Reduction glaze firings'}
];
const SLOTS = [
  {id:'am',  label:'Morning',   time:'9:00 am – 12:00 pm'},
  {id:'pm',  label:'Afternoon', time:'12:00 – 4:00 pm'},
  {id:'eve', label:'Evening',   time:'4:00 – 8:00 pm'}
];
/* Other members' bookings are not connected here; a few slots are marked taken as placeholders. */
const KEY='kilnBookings';
const $=id=>document.getElementById(id);
const form=$('form'), nameI=$('name'), dateI=$('date'), notes=$('notes');
let bookings=[], lastRemoved=null, undoTimer=null;

try{bookings=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){bookings=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(bookings))}catch(e){}}

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=iso(new Date());
dateI.min=todayISO;
function fmtDate(s){const[y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
const kilnOf=id=>KILNS.find(k=>k.id===id), slotOf=id=>SLOTS.find(s=>s.id===id);

function takenByOthers(k,d,s){ // stable placeholder pattern
  let h=0;const str=k+d+s;for(const c of str)h=(h*31+c.charCodeAt(0))>>>0;
  return h%4===0;
}
function takenByMe(k,d,s){return bookings.some(b=>b.kiln===k&&b.date===d&&b.slot===s)}

/* Kilns */
$('kilns').innerHTML=KILNS.map(k=>`
  <label class="opt"><input type="radio" name="kiln" value="${k.id}">
  <span class="box"><b>${k.name}</b><small>${k.detail}</small></span></label>`).join('');

function selected(name){const el=form.querySelector(`input[name=${name}]:checked`);return el?el.value:''}

function renderSlots(){
  const k=selected('kiln'), d=dateI.value, prev=selected('slot');
  const box=$('slots'), prompt=$('slotPrompt');
  if(!k||!d||d<todayISO){
    box.hidden=true;prompt.hidden=false;
    prompt.textContent=(d&&d<todayISO)?'That day has passed. Choose today or a later day.':'Choose a kiln and a day to see which slots are open.';
    return;
  }
  prompt.hidden=true;box.hidden=false;
  box.innerHTML=SLOTS.map(s=>{
    const mine=takenByMe(k,d,s.id), other=takenByOthers(k,d,s.id);
    const off=mine||other;
    return `<label class="opt"><input type="radio" name="slot" value="${s.id}" ${off?'disabled':''} ${(!off&&prev===s.id)?'checked':''}>
      <span class="box"><b>${s.label}</b><small>${s.time}</small>
      ${off?`<span class="tag">${mine?'You booked this':'Already booked'}</span>`:''}</span></label>`;
  }).join('');
  if(SLOTS.every(s=>takenByMe(k,d,s.id)||takenByOthers(k,d,s.id))){
    box.insertAdjacentHTML('beforeend',`<p class="slotempty" style="grid-column:1/-1">Every slot on ${fmtDate(d)} is taken for the ${kilnOf(k).name.toLowerCase()}. Try another day or kiln.</p>`);
  }
}
form.addEventListener('change',e=>{
  if(e.target.name==='kiln'||e.target.id==='date')renderSlots();
  clearErr(e.target);
});
nameI.addEventListener('input',()=>clearErr(nameI));

/* Errors */
const errMap={name:['name','nameErr'],kiln:['kilnSet','kilnErr'],date:['date','dateErr'],slot:['slotSet','slotErr']};
function setErr(key,msg){
  const[f,e]=errMap[key];$(e).textContent=msg;$(e).hidden=false;
  const el=$(f);if(el.tagName==='INPUT')el.setAttribute('aria-invalid','true');
}
function clearErr(el){
  const key=el.name||el.id;if(!errMap[key])return;
  const[f,e]=errMap[key];$(e).hidden=true;
  if($(f).tagName==='INPUT')$(f).removeAttribute('aria-invalid');
  if(!form.querySelector('.err:not([hidden])'))$('summary').hidden=true;
}
function clearAll(){
  Object.values(errMap).forEach(([f,e])=>{$(e).hidden=true;$(f).removeAttribute('aria-invalid')});
  $('summary').hidden=true;
}

function validate(){
  clearAll();const errs=[];
  if(!nameI.value.trim())errs.push(['name','Enter your name so the studio knows who the booking is for.','name']);
  if(!selected('kiln'))errs.push(['kiln','Choose a kiln.','kilnSet']);
  if(!dateI.value)errs.push(['date','Choose a day.','date']);
  else if(dateI.value<todayISO)errs.push(['date','That day has passed. Choose today or a later day.','date']);
  if(!selected('slot'))errs.push(['slot',selected('kiln')&&dateI.value?'Choose one of the open slots.':'Choose a kiln and day first, then pick a slot.','slotSet']);
  errs.forEach(([k,m])=>setErr(k,m));
  if(errs.length){
    const s=$('summary');
    s.innerHTML=`<p>${errs.length===1?'1 thing needs fixing':errs.length+' things need fixing'} before booking:</p><ul>`+
      errs.map(([k,m,t])=>`<li><a href="#${t}" data-t="${t}">${m}</a></li>`).join('')+'</ul>';
    s.hidden=false;s.focus();
  }
  return !errs.length;
}
$('summary').addEventListener('click',e=>{
  const a=e.target.closest('a');if(!a)return;e.preventDefault();
  const t=$(a.dataset.t);
  (t.tagName==='FIELDSET'?t.querySelector('input:not(:disabled)')||t:t).focus();
});

/* Status / undo */
function showStatus(msg,undo){
  clearTimeout(undoTimer);
  $('statusText').textContent=msg;
  $('undoBtn').hidden=!undo;
  $('status').hidden=false;
  if(undo)undoTimer=setTimeout(()=>{lastRemoved=null;$('undoBtn').hidden=true},10000);
}

/* Submit */
form.addEventListener('submit',e=>{
  e.preventDefault();
  const btn=$('submit');
  if(btn.getAttribute('aria-disabled')==='true')return;
  if(!validate())return;
  btn.setAttribute('aria-disabled','true');btn.textContent='Booking…';
  setTimeout(()=>{
    const b={id:Date.now()+Math.random().toString(16).slice(2),name:nameI.value.trim(),
      kiln:selected('kiln'),date:dateI.value,slot:selected('slot'),notes:notes.value.trim()};
    bookings.push(b);save();
    btn.removeAttribute('aria-disabled');btn.textContent='Book this slot';
    lastRemoved=null;
    showStatus(`Booked: ${kilnOf(b.kiln).name}, ${fmtDate(b.date)}, ${slotOf(b.slot).label.toLowerCase()} (${slotOf(b.slot).time}).`,false);
    notes.value='';
    renderSlots();renderMine();
    $('status').focus();
  },450);
});

/* My bookings */
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderMine(){
  const up=bookings.filter(b=>b.date>=todayISO).sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
  const box=$('mine');
  if(!up.length){
    box.innerHTML=`<div class="empty"><strong>No kiln time booked yet</strong>Once you book a slot it will show up here, and you can cancel it if your plans change.</div>`;
    return;
  }
  box.innerHTML='<ul class="list">'+up.map(b=>{
    const lab=`${kilnOf(b.kiln).name}, ${fmtDate(b.date)}, ${slotOf(b.slot).label.toLowerCase()}`;
    return `<li><div class="info"><b>${fmtDate(b.date)}</b>
      ${kilnOf(b.kiln).name}<br>${slotOf(b.slot).label}, ${slotOf(b.slot).time}
      <div class="note">For ${esc(b.name)}${b.notes?' · '+esc(b.notes):''}</div></div>
      <button type="button" class="btn sec sm" data-cancel="${b.id}" aria-label="Cancel booking: ${lab}">Cancel</button></li>`;
  }).join('')+'</ul>';
}
$('mine').addEventListener('click',e=>{
  const btn=e.target.closest('[data-cancel]');if(!btn)return;
  const i=bookings.findIndex(b=>b.id===btn.dataset.cancel);if(i<0)return;
  const [b]=bookings.splice(i,1);lastRemoved=b;save();
  renderSlots();renderMine();
  showStatus(`Cancelled: ${kilnOf(b.kiln).name}, ${fmtDate(b.date)}, ${slotOf(b.slot).label.toLowerCase()}. The slot is open again.`,true);
  $('undoBtn').focus();
});
$('undoBtn').addEventListener('click',()=>{
  if(!lastRemoved)return;
  const b=lastRemoved;lastRemoved=null;
  if(takenByMe(b.kiln,b.date,b.slot)){showStatus('That slot was already booked again, so nothing was restored.',false);return}
  bookings.push(b);save();renderSlots();renderMine();
  showStatus(`Restored: ${kilnOf(b.kiln).name}, ${fmtDate(b.date)}, ${slotOf(b.slot).label.toLowerCase()}.`,false);
  $('status').focus();
});

renderMine();
</script>
</body>
</html>
