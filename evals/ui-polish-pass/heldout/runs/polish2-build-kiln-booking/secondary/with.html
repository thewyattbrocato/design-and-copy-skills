<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln Booking</title>
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light dark;
  --bg: #f6f3ee;
  --surface: #ffffff;
  --text: #2a2622;
  --muted: #6b635a;
  --border: #d9d1c5;
  --track: #ece6dc;
  --accent: #9a4f2b;
  --accent-text: #ffffff;
  --booked: #c98a5e;
  --danger: #a4262c;
  --ok: #2e6b3a;
  --focus: #1f5fbf;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1916;
    --surface: #26231f;
    --text: #f1ebe2;
    --muted: #b3aa9d;
    --border: #3d3832;
    --track: #322e29;
    --accent: #d8875a;
    --accent-text: #1b1916;
    --booked: #b96d43;
    --danger: #ff8a85;
    --ok: #8fd19e;
    --focus: #8fb8ff;
  }
}

html { background: var(--bg); }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  background: var(--bg);
  color: var(--text);
}

.wrap { max-width: 1040px; margin: 0 auto; padding: 2rem 1rem 3rem; }
h1 { font-size: 1.75rem; margin: 0 0 .25rem; }
h2 { font-size: 1.1rem; margin: 0 0 1rem; }
h3 { font-size: .95rem; margin: 1.25rem 0 .5rem; }
.lede { margin: 0 0 1.25rem; color: var(--muted); }
.muted { color: var(--muted); font-weight: 400; }

.status { min-height: 1.4rem; margin: 0 0 1rem; color: var(--ok); }
.status.is-error { color: var(--danger); }

.banner {
  background: var(--surface);
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: 8px;
  padding: .75rem 1rem;
  margin: 0 0 1rem;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
  gap: 1.25rem;
  align-items: start;
}
.stack { display: grid; gap: 1.25rem; min-width: 0; }
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.25rem;
  min-width: 0;
}

label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: .3rem; }

input, select, textarea {
  width: 100%;
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .55rem .65rem;
}
textarea { resize: vertical; }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.field { margin-bottom: 1rem; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }

.error { color: var(--danger); font-size: .875rem; margin: .3rem 0 0; }

.primary {
  width: 100%;
  font: inherit;
  font-weight: 600;
  background: var(--accent);
  color: var(--accent-text);
  border: 0;
  border-radius: 8px;
  padding: .7rem 1rem;
  cursor: pointer;
}
.primary:hover { filter: brightness(1.08); }

.timeline-row {
  display: grid;
  grid-template-columns: 8.5rem minmax(0, 1fr);
  gap: .75rem;
  align-items: center;
  min-width: 0;
}
.axis { padding: 0 .5rem; margin-bottom: .25rem; }
.axis-track { position: relative; height: 1.2rem; font-size: .75rem; color: var(--muted); }
.axis-track span { position: absolute; top: 0; white-space: nowrap; }

.kiln-row {
  padding: .5rem;
  border-radius: 8px;
  border: 1px solid transparent;
  margin-bottom: .4rem;
}
.kiln-row.is-selected { border-color: var(--accent); }
.kiln-label { font-weight: 600; font-size: .92rem; }
.kiln-label small { display: block; font-weight: 400; color: var(--muted); }

.track {
  position: relative;
  height: 2.25rem;
  background: var(--track);
  border-radius: 6px;
  overflow: hidden;
}
.seg {
  position: absolute;
  top: 0;
  bottom: 0;
  background: var(--booked);
  border-right: 2px solid var(--surface);
}

.list { list-style: none; margin: 0; padding: 0; }
.list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
  padding: .6rem 0;
  border-bottom: 1px solid var(--border);
}
.list li:last-child { border-bottom: 0; }

.cancel {
  font: inherit;
  font-size: .85rem;
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: 6px;
  padding: .3rem .6rem;
  cursor: pointer;
}
.cancel:hover { background: var(--danger); color: var(--surface); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Kiln booking</h1>
    <p class="lede">Reserve a shared kiln for your firing. Kilns are open 08:00 to 22:00, and bookings start on the half hour.</p>
  </header>

  <p id="storage-warning" class="banner" role="alert" hidden>This browser can't save bookings. Anything you book will be lost when you reload.</p>
  <p id="status" class="status" role="status" aria-live="polite"></p>

  <div class="layout">
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">New booking</h2>
      <form id="booking-form" novalidate>
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="80" aria-describedby="err-name">
          <p class="error" id="err-name" hidden></p>
        </div>

        <div class="field">
          <label for="kiln">Kiln</label>
          <select id="kiln" name="kiln"></select>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" aria-describedby="err-date">
          <p class="error" id="err-date" hidden></p>
        </div>

        <div class="row">
          <div class="field">
            <label for="start">Start</label>
            <select id="start" aria-describedby="err-start"></select>
            <p class="error" id="err-start" hidden></p>
          </div>
          <div class="field">
            <label for="duration">Length</label>
            <select id="duration" aria-describedby="err-duration"></select>
            <p class="error" id="err-duration" hidden></p>
          </div>
        </div>

        <div class="field">
          <label for="firing">Firing type</label>
          <select id="firing"></select>
        </div>

        <div class="field">
          <label for="notes">Notes <span class="muted">(optional)</span></label>
          <textarea id="notes" rows="3" maxlength="300"></textarea>
        </div>

        <button type="submit" class="primary">Book kiln</button>
      </form>
    </section>

    <div class="stack">
      <section class="card" aria-labelledby="day-title">
        <h2 id="day-title">Availability: <span id="day-label"></span></h2>
        <div id="timeline"></div>

        <h3>Bookings this day</h3>
        <ul id="day-list" class="list"></ul>
      </section>

      <section class="card" aria-labelledby="up-title">
        <h2 id="up-title">Upcoming bookings</h2>
        <ul id="upcoming" class="list"></ul>
      </section>
    </div>
  </div>
</main>

<script>
'use strict';

// Edit these to match your studio.
const KILNS = [
  { id: 'large-electric', name: 'Large electric' },
  { id: 'small-electric', name: 'Small electric' },
  { id: 'gas-raku', name: 'Gas raku' },
];
const FIRING_TYPES = ['Bisque', 'Glaze', 'Test tile', 'Raku', 'Other'];
const LENGTH_HOURS = [1, 2, 3, 4, 6, 8];

const OPEN = 8 * 60;      // 08:00 in minutes
const CLOSE = 22 * 60;    // 22:00 in minutes
const STEP = 30;          // start times on the half hour
const STORE_KEY = 'kiln-bookings-v1';
const FIELD_IDS = ['name', 'date', 'start', 'duration'];

const $ = id => document.getElementById(id);
const form = $('booking-form');
const el = {
  name: $('name'),
  kiln: $('kiln'),
  date: $('date'),
  start: $('start'),
  duration: $('duration'),
  firing: $('firing'),
  notes: $('notes'),
};

let bookings = [];
let storageOk = true;

const pad = n => String(n).padStart(2, '0');
const fmtTime = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const nowMin = () => {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const fmtDate = ds => {
  const [y, m, d] = ds.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
  });
};
const kilnName = id => (KILNS.find(k => k.id === id) || { name: id }).name;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pct = m => ((m - OPEN) / (CLOSE - OPEN)) * 100;

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const data = raw ? JSON.parse(raw) : [];
    bookings = Array.isArray(data) ? data : [];
  } catch (e) {
    bookings = [];
    storageOk = false;
  }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(bookings));
    return true;
  } catch (e) {
    storageOk = false;
    $('storage-warning').hidden = false;
    return false;
  }
}

function showStatus(msg, isError) {
  const s = $('status');
  s.textContent = msg;
  s.classList.toggle('is-error', !!isError);
}

function init() {
  el.kiln.innerHTML = KILNS
    .map(k => `<option value="${esc(k.id)}">${esc(k.name)}</option>`).join('');

  let starts = '';
  for (let m = OPEN; m < CLOSE; m += STEP) {
    starts += `<option value="${m}">${fmtTime(m)}</option>`;
  }
  el.start.innerHTML = starts;

  el.duration.innerHTML = LENGTH_HOURS
    .map(h => `<option value="${h * 60}">${h} hour${h > 1 ? 's' : ''}</option>`).join('');

  el.firing.innerHTML = FIRING_TYPES
    .map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join('');

  el.date.min = todayStr();
  el.date.value = todayStr();
  el.start.value = String(10 * 60);
  el.duration.value = String(2 * 60);
}

function renderDay() {
  const date = el.date.value;
  $('day-label').textContent = date ? fmtDate(date) : 'choose a date';

  const dayBookings = bookings
    .filter(b => b.date === date)
    .sort((a, b) => a.start - b.start);

  let axis = '';
  for (let h = 8; h < 22; h += 2) {
    axis += `<span style="left:${pct(h * 60)}%">${pad(h)}:00</span>`;
  }

  const rows = KILNS.map(k => {
    const mine = dayBookings.filter(b => b.kiln === k.id);
    const segs = mine.map(b =>
      `<div class="seg" style="left:${pct(b.start)}%;width:${pct(b.end) - pct(b.start)}%" ` +
      `title="${esc(b.name)}, ${fmtTime(b.start)}-${fmtTime(b.end)}"></div>`
    ).join('');
    const count = mine.length;
    const summary = count ? `${count} booking${count > 1 ? 's' : ''}` : 'No bookings';
    const selected = k.id === el.kiln.value ? ' is-selected' : '';
    return `<div class="kiln-row timeline-row${selected}">` +
      `<div class="kiln-label">${esc(k.name)}<small>${summary}</small></div>` +
      `<div class="track" aria-hidden="true">${segs}</div>` +
      `</div>`;
  }).join('');

  $('timeline').innerHTML =
    `<div class="axis timeline-row"><div></div><div class="axis-track">${axis}</div></div>` + rows;

  $('day-list').innerHTML = dayBookings.length
    ? dayBookings.map(b =>
        `<li><span><strong>${esc(b.name)}</strong>, ${esc(kilnName(b.kiln))}</span>` +
        `<span class="muted">${fmtTime(b.start)}-${fmtTime(b.end)} &middot; ${esc(b.firing)}</span></li>`
      ).join('')
    : '<li class="muted">Nothing booked on this day yet.</li>';
}

function renderUpcoming() {
  const t = todayStr();
  const list = bookings
    .filter(b => b.date >= t)
    .sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start);

  $('upcoming').innerHTML = list.length
    ? list.map(b =>
        `<li><span><strong>${esc(fmtDate(b.date))}</strong>, ${fmtTime(b.start)}-${fmtTime(b.end)}` +
        `<br><span class="muted">${esc(kilnName(b.kiln))} &middot; ${esc(b.name)} &middot; ${esc(b.firing)}</span></span>` +
        `<button type="button" class="cancel" data-id="${esc(b.id)}" ` +
        `aria-label="Cancel ${esc(b.name)}'s booking on ${esc(fmtDate(b.date))} at ${fmtTime(b.start)}">Cancel</button></li>`
      ).join('')
    : '<li class="muted">No upcoming bookings.</li>';
}

function renderAll() {
  renderDay();
  renderUpcoming();
}

function readForm() {
  return {
    name: el.name.value.trim(),
    kiln: el.kiln.value,
    date: el.date.value,
    start: Number(el.start.value),
    length: Number(el.duration.value),
  };
}

function validate(v) {
  const errs = {};

  if (!v.name) {
    errs.name = 'Enter your name so the studio knows whose booking this is.';
  }

  if (!v.date) {
    errs.date = 'Choose a date.';
  } else if (v.date < todayStr()) {
    errs.date = 'Choose today or a later date.';
  }

  if (!errs.date && v.date === todayStr() && v.start < nowMin()) {
    errs.start = 'That start time has already passed today.';
  }

  const end = v.start + v.length;
  if (end > CLOSE) {
    errs.duration = `That length runs past closing at ${fmtTime(CLOSE)}. Pick an earlier start or a shorter length.`;
  }

  if (!errs.date && !errs.start) {
    const clash = bookings.find(b =>
      b.kiln === v.kiln && b.date === v.date && v.start < b.end && end > b.start
    );
    if (clash) {
      errs.start = `${kilnName(v.kiln)} is already booked from ${fmtTime(clash.start)} to ${fmtTime(clash.end)}. Try another start time or kiln.`;
    }
  }

  return errs;
}

function showErrors(errs) {
  for (const f of FIELD_IDS) {
    const msg = errs[f];
    const errEl = $('err-' + f);
    errEl.textContent = msg || '';
    errEl.hidden = !msg;
    el[f].setAttribute('aria-invalid', msg ? 'true' : 'false');
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const v = readForm();
  const errs = validate(v);
  showErrors(errs);

  const firstBad = FIELD_IDS.find(f => errs[f]);
  if (firstBad) {
    el[firstBad].focus();
    showStatus('Please fix the highlighted fields.', true);
    return;
  }

  const end = v.start + v.length;
  bookings.push({
    id: newId(),
    kiln: v.kiln,
    date: v.date,
    start: v.start,
    end,
    name: v.name,
    firing: el.firing.value,
    notes: el.notes.value.trim(),
    created: new Date().toISOString(),
  });

  if (save()) {
    showStatus(`Booked ${kilnName(v.kiln)} on ${fmtDate(v.date)}, ${fmtTime(v.start)}-${fmtTime(end)}.`);
  } else {
    showStatus('Booked for this page only. This browser could not save it, so it will be lost on reload.', true);
  }

  el.notes.value = '';
  renderAll();
});

el.date.addEventListener('change', renderDay);
el.kiln.addEventListener('change', renderDay);

$('upcoming').addEventListener('click', e => {
  const btn = e.target.closest('button[data-id]');
  if (!btn) return;
  const b = bookings.find(x => x.id === btn.dataset.id);
  if (!b) return;

  const ok = confirm(
    `Cancel ${b.name}'s booking for ${fmtDate(b.date)}, ${fmtTime(b.start)}-${fmtTime(b.end)}?`
  );
  if (!ok) return;

  bookings = bookings.filter(x => x.id !== b.id);
  if (save()) {
    showStatus('Booking cancelled.');
  } else {
    showStatus('Booking removed from this page, but the change could not be saved.', true);
  }
  renderAll();
});

init();
load();
if (!storageOk) $('storage-warning').hidden = false;
renderAll();
</script>
</body>
</html>
