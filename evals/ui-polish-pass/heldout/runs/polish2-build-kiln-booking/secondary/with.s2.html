<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln Booking</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f2;
    --surface: #ffffff;
    --text: #1f1b17;
    --muted: #5f5750;
    --border: #d9d2ca;
    --accent: #9a4a2b;
    --accent-hover: #7f3b21;
    --accent-text: #ffffff;
    --danger: #a12626;
    --ok: #2e6b34;
    --focus: #1a5fb4;
    --block: #e9d3c3;
    --block-text: #4a2414;
    --radius: 10px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171412;
      --surface: #221e1b;
      --text: #f2ece6;
      --muted: #b9aea4;
      --border: #3d3530;
      --accent: #d9825c;
      --accent-hover: #e89a78;
      --accent-text: #1a0f0a;
      --danger: #ff8a8a;
      --ok: #8fd19a;
      --focus: #7fb2ff;
      --block: #5a3424;
      --block-text: #f6e3d7;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }

  header, main { max-width: 1100px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
  header { padding-top: 24px; }
  h1 { font-size: 1.6rem; margin: 0; }
  h2 { font-size: 1.1rem; margin: 0 0 4px; }
  .sub, .hint { color: var(--muted); }
  .sub { margin: 4px 0 0; }
  .hint { font-size: .85rem; font-weight: 400; }

  main {
    display: grid;
    gap: 20px;
    grid-template-columns: minmax(0, 1fr);
    padding-top: 16px;
    padding-bottom: 48px;
  }
  @media (min-width: 860px) {
    main { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); align-items: start; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  label { font-weight: 600; font-size: .92rem; }
  .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }

  input, select, textarea {
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    width: 100%;
    min-height: 42px;
  }
  textarea { min-height: 80px; resize: vertical; }
  input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .error { color: var(--danger); font-size: .85rem; }

  button {
    font: inherit;
    font-weight: 600;
    min-height: 44px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color .15s, border-color .15s;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); width: 100%; margin-top: 4px; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost {
    background: transparent;
    color: var(--danger);
    border-color: var(--border);
    min-height: 36px;
    padding: 6px 12px;
    font-size: .9rem;
    flex-shrink: 0;
  }
  .btn-ghost:hover { border-color: var(--danger); }

  .status { min-height: 1.5em; margin: 12px 0 0; font-size: .92rem; }
  .status.ok { color: var(--ok); }
  .status.error { color: var(--danger); }

  .timeline-wrap { display: grid; grid-template-columns: 56px 1fr; margin-top: 16px; }
  .ticks { position: relative; height: 560px; }
  .ticks span {
    position: absolute;
    right: 8px;
    transform: translateY(-50%);
    font-size: .75rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .lane {
    position: relative;
    height: 560px;
    border-left: 1px solid var(--border);
    background: repeating-linear-gradient(to bottom, var(--border) 0 1px, transparent 1px 40px);
  }
  .block {
    position: absolute;
    left: 4px;
    right: 4px;
    background: var(--block);
    color: var(--block-text);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: .8rem;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .bookings { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
  .booking {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .empty { color: var(--muted); padding: 12px 0; }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Kiln booking</h1>
  <p class="sub">Reserve a shared kiln for your firing. The studio closes at 10:00 PM.</p>
</header>

<main>
  <section class="card" aria-labelledby="book-heading">
    <h2 id="book-heading">Book a firing</h2>
    <form id="booking-form" novalidate>
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" aria-describedby="name-error">
        <div class="error" id="name-error"></div>
      </div>

      <div class="field">
        <label for="kiln">Kiln</label>
        <select id="kiln" name="kiln"></select>
      </div>

      <div class="row">
        <div class="field">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" aria-describedby="date-error">
          <div class="error" id="date-error"></div>
        </div>
        <div class="field">
          <label for="start">Start time</label>
          <select id="start" name="start" aria-describedby="start-error"></select>
          <div class="error" id="start-error"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="duration">Length</label>
          <select id="duration" name="duration" aria-describedby="duration-error"></select>
          <div class="error" id="duration-error"></div>
        </div>
        <div class="field">
          <label for="firing">Firing type</label>
          <select id="firing" name="firing"></select>
        </div>
      </div>

      <div class="field">
        <label for="notes">Notes <span class="hint">(optional)</span></label>
        <textarea id="notes" name="notes" rows="3"></textarea>
      </div>

      <button type="submit" class="btn-primary">Book kiln</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <section class="card" aria-labelledby="sched-heading">
    <h2 id="sched-heading">Schedule</h2>
    <p class="hint" id="sched-sub"></p>

    <div class="timeline-wrap" aria-hidden="true">
      <div class="ticks" id="ticks"></div>
      <div class="lane" id="lane"></div>
    </div>

    <ul class="bookings" id="bookings"></ul>
  </section>
</main>

<script>
(() => {
  // Replace with your studio's kilns. Bookings are stored in localStorage;
  // to share them across members, swap loadBookings/saveBookings for your backend.
  const KILNS = [
    { id: 'large', name: 'Large electric' },
    { id: 'small', name: 'Small electric' },
    { id: 'gas', name: 'Gas reduction' },
  ];
  const OPEN = 8 * 60;   // 8:00 AM, in minutes after midnight
  const CLOSE = 22 * 60; // 10:00 PM
  const HOUR_PX = 40;
  const DURATIONS = [60, 90, 120, 180, 240, 300, 360, 480];
  const FIRING_TYPES = ['Bisque', 'Glaze', 'Raku', 'Test', 'Other'];
  const FIELDS = ['name', 'date', 'start', 'duration'];
  const STORE_KEY = 'kiln-bookings-v1';

  const $ = id => document.getElementById(id);
  const form = $('booking-form');
  const kilnSel = $('kiln');
  const dateIn = $('date');
  const startSel = $('start');
  const durSel = $('duration');
  const firingSel = $('firing');

  const pad = n => String(n).padStart(2, '0');
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const nowMin = () => {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  };
  const clock = m => {
    const h = Math.floor(m / 60);
    return `${h % 12 || 12}:${pad(m % 60)} ${h < 12 ? 'AM' : 'PM'}`;
  };
  const durLabel = m => {
    const h = Math.floor(m / 60), mm = m % 60;
    return [h && `${h} hr`, mm && `${mm} min`].filter(Boolean).join(' ');
  };
  const dateLabel = s => {
    const [y, mo, d] = s.split('-').map(Number);
    return new Date(y, mo - 1, d).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  };
  const kilnName = id => KILNS.find(k => k.id === id)?.name ?? id;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function loadBookings() {
    try {
      return { ok: true, items: JSON.parse(localStorage.getItem(STORE_KEY) || '[]') };
    } catch {
      return { ok: false, items: [] };
    }
  }
  function saveBookings(items) {
    localStorage.setItem(STORE_KEY, JSON.stringify(items));
  }

  function validate(b, all) {
    const errors = {};
    if (!b.name) errors.name = 'Please enter your name.';
    if (!b.date) errors.date = 'Please choose a date.';
    else if (b.date < todayStr()) errors.date = 'That date has already passed.';
    if (b.date === todayStr() && b.start < nowMin()) errors.start = 'That start time has already passed.';
    const end = b.start + b.duration;
    if (end > CLOSE) errors.duration = `Ends after closing at ${clock(CLOSE)}. Choose an earlier start or a shorter length.`;
    const clash = all.find(x => x.kiln === b.kiln && x.date === b.date && b.start < x.start + x.duration && x.start < end);
    if (clash && !errors.start) errors.start = `Overlaps ${clash.name}’s booking, ${clock(clash.start)} – ${clock(clash.start + clash.duration)}.`;
    return errors;
  }

  function showErrors(errors) {
    FIELDS.forEach(f => {
      const msg = errors[f] || '';
      $(f).setAttribute('aria-invalid', msg ? 'true' : 'false');
      $(f + '-error').textContent = msg;
    });
  }

  function setStatus(msg, type = '') {
    const el = $('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  function render() {
    const kiln = kilnSel.value;
    const date = dateIn.value;
    const { ok, items } = loadBookings();
    const day = ok && date
      ? items.filter(b => b.kiln === kiln && b.date === date).sort((a, b) => a.start - b.start)
      : [];

    $('sched-sub').textContent = date ? `${kilnName(kiln)} · ${dateLabel(date)}` : kilnName(kiln);
    $('lane').innerHTML = day.map(b => {
      const top = (b.start - OPEN) / 60 * HOUR_PX;
      const height = b.duration / 60 * HOUR_PX;
      return `<div class="block" style="top:${top}px;height:${height}px" title="${esc(b.name)}">${esc(b.name)} · ${esc(b.firing)}</div>`;
    }).join('');

    const list = $('bookings');
    if (!ok) {
      list.innerHTML = '<li class="empty">Bookings could not be loaded. Local storage may be turned off in this browser.</li>';
    } else if (!date) {
      list.innerHTML = '<li class="empty">Choose a date to see bookings.</li>';
    } else if (!day.length) {
      list.innerHTML = '<li class="empty">No bookings for this kiln on this day.</li>';
    } else {
      list.innerHTML = day.map(b => `
        <li class="booking">
          <div>
            <strong>${esc(b.name)}</strong> <span class="hint">· ${esc(b.firing)}</span>
            <div>${clock(b.start)} – ${clock(b.start + b.duration)}</div>
            ${b.notes ? `<div class="hint">${esc(b.notes)}</div>` : ''}
          </div>
          <button type="button" class="btn-ghost" data-id="${esc(b.id)}" aria-label="Cancel ${esc(b.name)}’s booking at ${clock(b.start)}">Cancel</button>
        </li>`).join('');
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const store = loadBookings();
    if (!store.ok) {
      setStatus('Could not read existing bookings, so nothing was saved.', 'error');
      return;
    }

    const booking = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name: $('name').value.trim(),
      kiln: kilnSel.value,
      date: dateIn.value,
      start: Number(startSel.value),
      duration: Number(durSel.value),
      firing: firingSel.value,
      notes: $('notes').value.trim(),
    };

    const errors = validate(booking, store.items);
    showErrors(errors);
    const first = FIELDS.find(f => errors[f]);
    if (first) {
      $(first).focus();
      setStatus('Please fix the highlighted fields.', 'error');
      return;
    }

    try {
      saveBookings([...store.items, booking]);
    } catch {
      setStatus('Could not save your booking. Local storage may be full or turned off.', 'error');
      return;
    }

    const end = booking.start + booking.duration;
    setStatus(`Booked ${kilnName(booking.kiln)} on ${dateLabel(booking.date)}, ${clock(booking.start)} – ${clock(end)}.`, 'ok');
    $('notes').value = '';
    render();
  });

  $('bookings').addEventListener('click', e => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const { items } = loadBookings();
    const target = items.find(b => b.id === btn.dataset.id);
    if (!target || !confirm(`Cancel ${target.name}’s booking at ${clock(target.start)}?`)) return;
    saveBookings(items.filter(b => b !== target));
    setStatus('Booking cancelled.');
    render();
  });

  [kilnSel, dateIn].forEach(el => el.addEventListener('change', render));

  // Setup
  KILNS.forEach(k => kilnSel.add(new Option(k.name, k.id)));
  for (let t = OPEN; t < CLOSE; t += 30) startSel.add(new Option(clock(t), t));
  startSel.value = String(9 * 60);
  DURATIONS.forEach(d => durSel.add(new Option(durLabel(d), d)));
  durSel.value = '120';
  FIRING_TYPES.forEach(f => firingSel.add(new Option(f, f)));
  dateIn.min = todayStr();
  dateIn.value = todayStr();
  $('ticks').innerHTML = Array.from(
    { length: (CLOSE - OPEN) / 60 },
    (_, i) => `<span style="top:${i * HOUR_PX}px">${clock(OPEN + i * 60)}</span>`
  ).join('');

  render();
})();
</script>
</body>
</html>
