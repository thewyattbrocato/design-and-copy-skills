<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Kiln</title>
<!--
  Standalone kiln booking page. Bookings are saved in this browser's localStorage,
  so they are per-device until this is wired to a shared backend. Replace load()/save()
  with server calls to share bookings across members.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f4f1;
    --surface: #ffffff;
    --text: #22201d;
    --muted: #6b655d;
    --border: #d9d3ca;
    --accent: #7a3e1d;
    --accent-text: #ffffff;
    --booked: #ecd3c1;
    --booked-border: #b9704a;
    --danger: #a4262c;
    --focus: #1a5fb4;
    --ok-bg: #e6f4ea;
    --ok-text: #1e5e2e;
    --err-bg: #fbe9e9;
    --err-text: #8a1c1c;
    --radius: 10px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161412;
      --surface: #211e1b;
      --text: #efebe6;
      --muted: #b3aca2;
      --border: #3d3832;
      --accent: #e09a6e;
      --accent-text: #1c1714;
      --booked: #5a3b2a;
      --booked-border: #c97a4f;
      --danger: #ff8a80;
      --focus: #8ab4ff;
      --ok-bg: #1d3323;
      --ok-text: #b5e3c0;
      --err-bg: #3a1e1e;
      --err-text: #f6b8b8;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  h2:focus { outline: none; }

  .sub { color: var(--muted); margin: 0 0 24px; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }

  .grid {
    display: grid;
    gap: 20px;
    grid-template-columns: 1fr;
  }

  @media (min-width: 760px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    min-width: 0;
  }

  .card.wide { grid-column: 1 / -1; }

  label {
    display: block;
    font-weight: 600;
    font-size: .9rem;
    margin-bottom: 4px;
  }

  .field { margin-bottom: 14px; }

  input, select, textarea {
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
  }

  textarea {
    min-height: 70px;
    resize: vertical;
  }

  .row2 {
    display: grid;
    gap: 14px;
    grid-template-columns: 1fr;
  }

  @media (min-width: 480px) {
    .row2 { grid-template-columns: 1fr 1fr; }
  }

  .error {
    font-size: .85rem;
    color: var(--err-text);
    margin: 4px 0 0;
  }

  .error:empty { display: none; }

  .hint {
    font-size: .85rem;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .hint.free { color: var(--ok-text); }
  .hint.conflict { color: var(--err-text); }

  [aria-invalid="true"] { border-color: var(--danger); }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  button {
    font: inherit;
    border-radius: 8px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: 600;
  }

  button.danger { color: var(--danger); }

  button:hover { filter: brightness(0.97); }

  .status {
    border-radius: 8px;
    padding: 10px 12px;
    margin: 14px 0 0;
    font-size: .92rem;
  }

  .status:empty { display: none; }
  .status.ok { background: var(--ok-bg); color: var(--ok-text); }
  .status.err { background: var(--err-bg); color: var(--err-text); }

  .timeline {
    position: relative;
    height: 48px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    overflow: hidden;
  }

  .block {
    position: absolute;
    top: 4px;
    bottom: 4px;
    padding: 2px 6px;
    background: var(--booked);
    border-left: 3px solid var(--booked-border);
    border-radius: 6px;
    font-size: .78rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .axis {
    position: relative;
    height: 18px;
    margin-top: 6px;
    font-size: .75rem;
    color: var(--muted);
  }

  .tick {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
  }

  .tick.first { transform: none; }
  .tick.last { transform: translateX(-100%); }

  .list {
    list-style: none;
    margin: 12px 0 0;
    padding: 0;
  }

  .item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }

  .item:first-child { border-top: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Book a kiln</h1>
  <p class="sub">Shared studio kilns. Open 7:00 am to 10:00 pm. Bookings must finish by closing time.</p>

  <p id="storage-note" class="status err" hidden>
    Bookings can't be saved in this browser, so they will be lost when the page closes.
  </p>

  <div class="grid">
    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">New booking</h2>
      <form id="booking-form" novalidate>
        <div class="field">
          <label for="member">Your name</label>
          <input id="member" name="member" autocomplete="name" aria-describedby="member-error">
          <p class="error" id="member-error"></p>
        </div>

        <div class="row2">
          <div class="field">
            <label for="kiln">Kiln</label>
            <select id="kiln"></select>
          </div>
          <div class="field">
            <label for="firing">Firing type</label>
            <select id="firing"></select>
          </div>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" aria-describedby="date-error">
          <p class="error" id="date-error"></p>
        </div>

        <div class="row2">
          <div class="field">
            <label for="start">Start time</label>
            <select id="start" aria-describedby="start-error"></select>
            <p class="error" id="start-error"></p>
          </div>
          <div class="field">
            <label for="duration">Length</label>
            <select id="duration"></select>
          </div>
        </div>

        <div class="field">
          <label for="notes">Notes <span class="muted">(optional)</span></label>
          <textarea id="notes" placeholder="Cone target, shelf count, anything the kiln monitor should know"></textarea>
        </div>

        <p id="availability" class="hint" aria-live="polite"></p>

        <button type="submit" class="primary">Book kiln</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="day-title">
      <h2 id="day-title">Day schedule</h2>
      <div class="timeline" id="track" aria-hidden="true"></div>
      <div class="axis" id="axis" aria-hidden="true"></div>
      <ul class="list" id="day-list"></ul>
    </section>

    <section class="card wide" aria-labelledby="upcoming-heading">
      <h2 id="upcoming-heading" tabindex="-1">Upcoming bookings</h2>
      <ul class="list" id="upcoming"></ul>
    </section>
  </div>
</main>

<script>
  const OPEN = 7 * 60;
  const CLOSE = 22 * 60;
  const STORE_KEY = 'kiln-bookings-v1';
  const FIELDS = ['member', 'date', 'start'];

  const KILNS = [
    { id: 'large', name: 'Large electric kiln' },
    { id: 'medium', name: 'Medium electric kiln' },
    { id: 'test', name: 'Test kiln' }
  ];
  const FIRING = ['Bisque', 'Glaze', 'Raku', 'Test tiles', 'Other'];
  const DURATIONS = [
    [60, '1 hour'], [120, '2 hours'], [180, '3 hours'], [240, '4 hours'],
    [360, '6 hours'], [480, '8 hours'], [600, '10 hours'], [720, '12 hours']
  ];

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  function fmtTime(min) {
    const h = Math.floor(min / 60);
    const m = min % 60;
    return `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'am' : 'pm'}`;
  }

  function fmtDate(iso, opts = { weekday: 'short', month: 'short', day: 'numeric' }) {
    const [y, mo, d] = iso.split('-').map(Number);
    return new Date(y, mo - 1, d).toLocaleDateString(undefined, opts);
  }

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function nowMinutes() {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }

  const kilnName = id => KILNS.find(k => k.id === id)?.name ?? 'Unknown kiln';

  let memoryOnly = false;

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY)) || [];
    } catch {
      memoryOnly = true;
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(bookings));
    } catch {
      memoryOnly = true;
    }
    $('storage-note').hidden = !memoryOnly;
  }

  let bookings = load();

  function findConflict(kilnId, date, start, end, ignoreId) {
    return bookings.find(b =>
      b.id !== ignoreId &&
      b.kilnId === kilnId &&
      b.date === date &&
      start < b.start + b.duration &&
      end > b.start
    ) || null;
  }

  function getForm() {
    return {
      member: $('member').value.trim(),
      kilnId: $('kiln').value,
      date: $('date').value,
      start: Number($('start').value),
      duration: Number($('duration').value),
      firing: $('firing').value,
      notes: $('notes').value.trim()
    };
  }

  function validate(f) {
    const errs = {};
    if (!f.member) errs.member = 'Enter your name so the studio knows who booked.';

    if (!f.date) {
      errs.date = 'Pick a date.';
    } else if (f.date < todayISO()) {
      errs.date = 'Pick today or a later date.';
    }

    const end = f.start + f.duration;
    if (end > CLOSE) {
      errs.start = 'That runs past closing (10:00 pm). Choose an earlier start or a shorter length.';
    } else if (f.date === todayISO() && f.start < nowMinutes()) {
      errs.start = 'That start time has already passed today.';
    } else if (f.date && findConflict(f.kilnId, f.date, f.start, end)) {
      errs.start = 'That overlaps an existing booking. See the day schedule.';
    }
    return errs;
  }

  function setErrors(errs) {
    FIELDS.forEach(id => {
      const msg = errs[id] || '';
      $(id).setAttribute('aria-invalid', String(Boolean(msg)));
      $(`${id}-error`).textContent = msg;
    });
  }

  function clearError(id) {
    $(id).setAttribute('aria-invalid', 'false');
    $(`${id}-error`).textContent = '';
  }

  function setStatus(msg, type = '') {
    const el = $('status');
    el.textContent = msg;
    el.className = `status ${type}`.trim();
  }

  function fillSelect(sel, pairs) {
    pairs.forEach(([value, label]) => {
      const o = document.createElement('option');
      o.value = value;
      o.textContent = label;
      sel.append(o);
    });
  }

  function refreshStartOptions() {
    const dur = Number($('duration').value);
    const startSel = $('start');
    const opts = [...startSel.options];
    opts.forEach(o => { o.disabled = Number(o.value) + dur > CLOSE; });
    const current = startSel.selectedOptions[0];
    if (current && current.disabled) {
      const firstOk = opts.find(o => !o.disabled);
      if (firstOk) startSel.value = firstOk.value;
    }
  }

  function renderDay(f) {
    const track = $('track');
    track.querySelectorAll('.block').forEach(n => n.remove());

    $('day-title').textContent = f.date
      ? `${kilnName(f.kilnId)}, ${fmtDate(f.date, { weekday: 'long', month: 'long', day: 'numeric' })}`
      : 'Day schedule';

    const day = f.date
      ? bookings
          .filter(b => b.kilnId === f.kilnId && b.date === f.date)
          .sort((a, b) => a.start - b.start)
      : [];

    const span = CLOSE - OPEN;
    day.forEach(b => {
      const div = document.createElement('div');
      div.className = 'block';
      div.style.left = `${((b.start - OPEN) / span) * 100}%`;
      div.style.width = `${(b.duration / span) * 100}%`;
      div.textContent = b.member;
      div.title = `${b.member}: ${fmtTime(b.start)} to ${fmtTime(b.start + b.duration)}`;
      track.append(div);
    });

    const list = $('day-list');
    list.replaceChildren();
    if (!f.date) {
      const li = document.createElement('li');
      li.className = 'muted';
      li.textContent = 'Pick a date to see bookings.';
      list.append(li);
      return;
    }
    if (!day.length) {
      const li = document.createElement('li');
      li.className = 'muted';
      li.textContent = 'No bookings for this kiln on this day. The whole day is open.';
      list.append(li);
      return;
    }
    day.forEach(b => {
      const li = document.createElement('li');
      li.className = 'item';
      const who = document.createElement('span');
      who.textContent = `${fmtTime(b.start)} to ${fmtTime(b.start + b.duration)}, ${b.member}`;
      const what = document.createElement('span');
      what.className = 'muted small';
      what.textContent = b.firing;
      li.append(who, what);
      list.append(li);
    });
  }

  function checkAvailability(f) {
    const el = $('availability');
    if (!f.date) {
      el.textContent = '';
      el.className = 'hint';
      return;
    }
    const end = f.start + f.duration;
    if (end > CLOSE) {
      el.textContent = 'This runs past closing time.';
      el.className = 'hint conflict';
      return;
    }
    const c = findConflict(f.kilnId, f.date, f.start, end);
    if (c) {
      el.textContent = `Overlaps ${c.member}, ${fmtTime(c.start)} to ${fmtTime(c.start + c.duration)}.`;
      el.className = 'hint conflict';
    } else {
      el.textContent = 'Free for this time.';
      el.className = 'hint free';
    }
  }

  function renderUpcoming() {
    const today = todayISO();
    const list = $('upcoming');
    list.replaceChildren();

    const upcoming = bookings
      .filter(b => b.date >= today)
      .sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start);

    if (!upcoming.length) {
      const li = document.createElement('li');
      li.className = 'muted';
      li.textContent = 'No upcoming bookings.';
      list.append(li);
      return;
    }

    upcoming.forEach(b => {
      const li = document.createElement('li');
      li.className = 'item';

      const info = document.createElement('div');
      const title = document.createElement('strong');
      title.textContent = b.member;
      const meta = document.createElement('div');
      meta.className = 'muted small';
      meta.textContent = `${fmtDate(b.date)}, ${fmtTime(b.start)} to ${fmtTime(b.start + b.duration)}, ${kilnName(b.kilnId)}, ${b.firing}`;
      info.append(title, meta);
      if (b.notes) {
        const notes = document.createElement('div');
        notes.className = 'small';
        notes.textContent = b.notes;
        info.append(notes);
      }

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'danger';
      btn.dataset.id = b.id;
      btn.textContent = 'Cancel';
      btn.setAttribute('aria-label', `Cancel ${b.member}'s booking on ${fmtDate(b.date)} at ${fmtTime(b.start)}`);

      li.append(info, btn);
      list.append(li);
    });
  }

  function refresh() {
    refreshStartOptions();
    const f = getForm();
    renderDay(f);
    checkAvailability(f);
    renderUpcoming();
  }

  $('booking-form').addEventListener('submit', e => {
    e.preventDefault();
    const f = getForm();
    const errs = validate(f);
    setErrors(errs);

    const firstBad = FIELDS.find(id => errs[id]);
    if (firstBad) {
      setStatus('Please fix the highlighted fields.', 'err');
      $(firstBad).focus();
      return;
    }

    bookings.push({
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      kilnId: f.kilnId,
      member: f.member,
      firing: f.firing,
      notes: f.notes,
      date: f.date,
      start: f.start,
      duration: f.duration
    });
    save();

    setStatus(
      `Booked ${kilnName(f.kilnId)} for ${fmtDate(f.date, { weekday: 'long', month: 'long', day: 'numeric' })}, ${fmtTime(f.start)} to ${fmtTime(f.start + f.duration)}.`,
      'ok'
    );
    $('notes').value = '';
    refresh();
  });

  $('upcoming').addEventListener('click', e => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const b = bookings.find(x => x.id === btn.dataset.id);
    if (!b) return;
    if (!confirm(`Cancel ${b.member}'s booking on ${fmtDate(b.date)} at ${fmtTime(b.start)}?`)) return;

    bookings = bookings.filter(x => x.id !== b.id);
    save();
    setStatus('Booking cancelled.', 'ok');
    refresh();
    $('upcoming-heading').focus();
  });

  $('member').addEventListener('input', () => clearError('member'));
  ['member', 'date', 'start', 'duration', 'kiln'].forEach(id => {
    $(id).addEventListener('change', () => {
      if (FIELDS.includes(id)) clearError(id);
      refresh();
    });
  });

  // Init
  fillSelect($('kiln'), KILNS.map(k => [k.id, k.name]));
  fillSelect($('firing'), FIRING.map(f => [f, f]));
  fillSelect($('duration'), DURATIONS);
  const startPairs = [];
  for (let m = OPEN; m < CLOSE; m += 30) startPairs.push([m, fmtTime(m)]);
  fillSelect($('start'), startPairs);

  $('duration').value = '120';
  $('start').value = '540';
  $('date').min = todayISO();
  $('date').value = todayISO();

  const axis = $('axis');
  const ticks = [7, 10, 13, 16, 19, 22];
  ticks.forEach((h, i) => {
    const t = document.createElement('span');
    t.className = 'tick';
    if (i === 0) t.classList.add('first');
    if (i === ticks.length - 1) t.classList.add('last');
    t.style.left = `${((h * 60 - OPEN) / (CLOSE - OPEN)) * 100}%`;
    t.textContent = fmtTime(h * 60).replace(':00', '');
    axis.append(t);
  });

  $('storage-note').hidden = !memoryOnly;
  refresh();
</script>
</body>
</html>
