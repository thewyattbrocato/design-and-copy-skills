<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Kiln booking · Studio</title>
<!--
  Kiln booking page. Self-contained: inline CSS and JS, system fonts, no network requests.
  Storage: bookings are kept in this browser's localStorage. For one shared studio calendar,
  replace load() and save() with calls to a shared backend.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --surface: #ffffff;
    --text: #2b2622;
    --muted: #6b625a;
    --border: #d9d0c4;
    --accent: #9a4a2a;
    --accent-text: #ffffff;
    --accent-soft: #f3e4da;
    --ok: #2f6b3a;
    --ok-soft: #e3f1e5;
    --err: #a3262b;
    --err-soft: #fbe6e6;
    --taken: #efeae3;
    --radius: 10px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1815;
      --surface: #26221e;
      --text: #f1ebe3;
      --muted: #b5aba0;
      --border: #4a423a;
      --accent: #e0956c;
      --accent-text: #1b1815;
      --accent-soft: #3d2c22;
      --ok: #8fd19e;
      --ok-soft: #1f3326;
      --err: #ff9b9b;
      --err-soft: #3d2121;
      --taken: #302b26;
    }
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  h2:focus { outline: none; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }

  .grid { display: grid; gap: 20px; grid-template-columns: 1fr; margin-top: 20px; }
  @media (min-width: 820px) { .grid { grid-template-columns: 1.25fr 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }

  fieldset { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
  legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
  .field { margin: 0 0 14px; }
  .lbl { display: block; font-weight: 600; margin-bottom: 4px; }

  input, select, textarea {
    font: inherit; color: inherit; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; width: 100%;
  }
  input[type="radio"] { width: auto; }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  [aria-invalid="true"] { border-color: var(--err); }

  .error { color: var(--err); font-size: .9rem; margin-top: 4px; }
  .error[hidden] { display: none; }

  .kilns { display: grid; gap: 8px; }
  .option {
    display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
  .option input { margin-top: 5px; }
  .option small { color: var(--muted); display: block; font-size: .9rem; }
  .option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .option:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  .slots { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .slot {
    position: relative; display: block; cursor: pointer; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  }
  .slot input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .slot .time { display: block; font-weight: 600; }
  .slot .state { display: block; font-size: .85rem; color: var(--muted); }
  .slot:not(.is-off):hover { border-color: var(--accent); }
  .slot:has(input:checked) { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
  .slot:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .slot.is-off { background: var(--taken); color: var(--muted); cursor: not-allowed; }

  button {
    font: inherit; border-radius: 8px; padding: 10px 16px; cursor: pointer;
    border: 1px solid transparent;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-text); font-weight: 600; width: 100%; }
  .btn-danger { background: transparent; color: var(--err); border-color: var(--err); padding: 6px 12px; white-space: nowrap; }

  .banner { padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
  .banner.show { display: block; }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner.err { background: var(--err-soft); color: var(--err); }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .list li {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .empty { color: var(--muted); font-style: italic; }
  .kiln-note { margin-top: 6px; }

  footer { margin-top: 24px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kiln booking</h1>
    <p class="muted">Reserve a 2-hour firing window. Pick a kiln, a date and a window, then add your details.</p>
  </header>

  <div id="status" class="banner" role="status" aria-live="polite"></div>

  <div class="grid">
    <section class="card" aria-labelledby="book-h">
      <h2 id="book-h" tabindex="-1">New booking</h2>
      <form id="form" novalidate>
        <fieldset>
          <legend>Kiln</legend>
          <div class="kilns" id="kilns"></div>
        </fieldset>

        <div class="field">
          <label class="lbl" for="date">Date</label>
          <input id="date" type="date" aria-describedby="dateError">
          <div class="error" id="dateError" hidden></div>
        </div>

        <fieldset>
          <legend>Time window</legend>
          <div class="slots" id="slots"></div>
          <div class="error" id="slotError" hidden></div>
        </fieldset>

        <div class="field">
          <label class="lbl" for="name">Your name</label>
          <input id="name" type="text" autocomplete="name" maxlength="60" aria-describedby="nameError">
          <div class="error" id="nameError" hidden></div>
        </div>

        <div class="field">
          <label class="lbl" for="firing">Firing type</label>
          <select id="firing" aria-describedby="firingError">
            <option value="">Choose…</option>
            <option>Bisque</option>
            <option>Glaze</option>
            <option>Test tile</option>
            <option>Raku</option>
          </select>
          <div class="error" id="firingError" hidden></div>
        </div>

        <div class="field">
          <label class="lbl" for="notes">Notes <span class="muted">(optional)</span></label>
          <textarea id="notes" rows="3" maxlength="300" placeholder="Target cone, shelf count, anything the next person should know"></textarea>
        </div>

        <button class="btn-primary" type="submit">Book this window</button>
      </form>
    </section>

    <section class="card" aria-labelledby="up-h">
      <h2 id="up-h" tabindex="-1">Upcoming bookings</h2>
      <div id="upcoming"></div>
    </section>
  </div>

  <footer>
    <p class="muted small">Bookings are saved in this browser only, so they won't show on other devices until a shared calendar is connected.</p>
  </footer>
</div>

<script>
(function () {
  var KEY = 'kiln-bookings-v1';
  var SLOTS = [8, 10, 12, 14, 16, 18];
  var KILNS = [
    { id: 'large', name: 'Large electric', desc: 'Cone 6 · 120 L · bisque, glaze and test tiles', types: ['Bisque', 'Glaze', 'Test tile'] },
    { id: 'small', name: 'Small electric', desc: 'Cone 6 · 40 L · test tiles and small work', types: ['Bisque', 'Glaze', 'Test tile'] },
    { id: 'raku', name: 'Raku kiln', desc: 'Gas · outdoor pit · raku firings only', types: ['Raku'] }
  ];

  var state = { kiln: 'large', slot: null };
  var bookings = load();

  var $ = function (id) { return document.getElementById(id); };
  var form = $('form'), kilnsEl = $('kilns'), slotsEl = $('slots'), dateEl = $('date'), upcomingEl = $('upcoming');

  function pad(n) { return String(n).padStart(2, '0'); }
  function hourLabel(h) { return pad(h) + ':00'; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function slotStart(date, h) { return new Date(date + 'T' + pad(h) + ':00'); }
  function slotEnd(date, h) { return new Date(date + 'T' + pad(h + 2) + ':00'); }
  function fmtDate(date) {
    return new Date(date + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function kilnById(id) { return KILNS.find(function (k) { return k.id === id; }); }
  function findBooking(kiln, date, h) {
    return bookings.find(function (b) { return b.kiln === kiln && b.date === date && b.hour === h; });
  }

  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(v) ? v.filter(function (b) { return b && b.kiln && b.date && Number.isInteger(b.hour); }) : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(bookings)); return true; }
    catch (e) { return false; }
  }

  function showBanner(type, msg) {
    var el = $('status');
    el.className = 'banner show ' + type;
    el.textContent = msg;
  }

  function renderKilns() {
    kilnsEl.innerHTML = KILNS.map(function (k) {
      return '<label class="option"><input type="radio" name="kiln" value="' + k.id + '"' +
        (k.id === state.kiln ? ' checked' : '') + '><span><strong>' + esc(k.name) +
        '</strong><small>' + esc(k.desc) + '</small></span></label>';
    }).join('');
  }

  function renderSlots() {
    var date = dateEl.value;
    var now = new Date();
    slotsEl.innerHTML = SLOTS.map(function (h) {
      var past = !date || slotStart(date, h) <= now;
      var booked = date ? !!findBooking(state.kiln, date, h) : false;
      var off = past || booked;
      if (off && state.slot === h) state.slot = null;
      var text = !date ? 'Pick a date' : past ? 'Passed' : booked ? 'Booked' : 'Available';
      var checked = state.slot === h;
      return '<label class="slot' + (off ? ' is-off' : '') + '">' +
        '<input type="radio" name="slot" value="' + h + '"' +
        (off ? ' disabled' : '') + (checked ? ' checked' : '') + '>' +
        '<span class="time">' + hourLabel(h) + '–' + hourLabel(h + 2) + '</span>' +
        '<span class="state">' + text + '</span></label>';
    }).join('');
  }

  function renderUpcoming() {
    var now = new Date();
    var items = bookings
      .filter(function (b) { return slotEnd(b.date, b.hour) > now; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.hour - b.hour; });

    if (!items.length) {
      upcomingEl.innerHTML = '<p class="empty">No upcoming bookings yet. Your first booking will appear here.</p>';
      return;
    }
    upcomingEl.innerHTML = '<ul class="list">' + items.map(function (b) {
      var k = kilnById(b.kiln);
      var when = fmtDate(b.date) + ' · ' + hourLabel(b.hour) + '–' + hourLabel(b.hour + 2);
      return '<li><div><strong>' + esc(when) + '</strong><br>' +
        '<span class="muted">' + esc(k ? k.name : b.kiln) + ' · ' + esc(b.firing) + ' · ' + esc(b.name) + '</span>' +
        (b.notes ? '<br><span class="muted small">' + esc(b.notes) + '</span>' : '') +
        '</div><button class="btn-danger" type="button" data-cancel="' + esc(b.id) + '" aria-label="Cancel booking for ' +
        esc(when) + ' on ' + esc(fmtDate(b.date)) + '">Cancel</button></li>';
    }).join('') + '</ul>';
  }

  function clearErrors() {
    ['date', 'slot', 'name', 'firing'].forEach(function (k) {
      var el = $(k + 'Error');
      el.textContent = '';
      el.hidden = true;
    });
    ['date', 'name', 'firing'].forEach(function (id) { $(id).removeAttribute('aria-invalid'); });
  }

  // Events
  kilnsEl.addEventListener('change', function (e) {
    if (e.target.name !== 'kiln') return;
    state.kiln = e.target.value;
    state.slot = null;
    clearErrors();
    renderSlots();
  });

  dateEl.addEventListener('change', function () {
    state.slot = null;
    clearErrors();
    renderSlots();
  });

  slotsEl.addEventListener('change', function (e) {
    if (e.target.name !== 'slot') return;
    state.slot = Number(e.target.value);
    $('slotError').hidden = true;
    $('slotError').textContent = '';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var date = dateEl.value;
    var name = $('name').value.trim();
    var firing = $('firing').value;
    var notes = $('notes').value.trim().slice(0, 300);
    var kiln = kilnById(state.kiln);
    var h = state.slot;
    var now = new Date();

    var fields = {
      date: !date ? 'Choose a date.' : date < todayStr() ? 'Choose today or a later date.' : '',
      slot: h == null ? 'Choose a time window.'
        : !date ? ''
        : slotStart(date, h) <= now ? 'That window has already started.'
        : findBooking(kiln.id, date, h) ? 'That window was just booked. Choose another.'
        : '',
      name: name ? '' : 'Enter your name.',
      firing: !firing ? 'Choose a firing type.'
        : kiln.types.indexOf(firing) === -1 ? kiln.name + " can't take " + firing.toLowerCase() + ' firings. Pick another kiln or firing type.'
        : ''
    };

    ['date', 'slot', 'name', 'firing'].forEach(function (k) {
      var el = $(k + 'Error');
      el.textContent = fields[k];
      el.hidden = !fields[k];
    });
    $('date').setAttribute('aria-invalid', String(!!fields.date));
    $('name').setAttribute('aria-invalid', String(!!fields.name));
    $('firing').setAttribute('aria-invalid', String(!!fields.firing));

    var firstBad = ['date', 'slot', 'name', 'firing'].filter(function (k) { return fields[k]; })[0];
    if (firstBad) {
      showBanner('err', 'Please fix the highlighted fields.');
      if (firstBad === 'date') dateEl.focus();
      else if (firstBad === 'slot') (slotsEl.querySelector('input:checked') || slotsEl.querySelector('input:not(:disabled)') || dateEl).focus();
      else if (firstBad === 'name') $('name').focus();
      else $('firing').focus();
      return;
    }

    var booking = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      kiln: kiln.id,
      date: date,
      hour: h,
      name: name.slice(0, 60),
      firing: firing,
      notes: notes,
      created: Date.now()
    };
    bookings.push(booking);
    if (!save()) {
      bookings.pop();
      showBanner('err', "Couldn't save the booking in this browser. Check that storage is allowed, then try again.");
      return;
    }

    // Reset the parts that belong to this booking; keep kiln, date and name for the next one.
    $('firing').value = '';
    $('notes').value = '';
    state.slot = null;
    clearErrors();
    renderSlots();
    renderUpcoming();
    showBanner('ok', 'Booked ' + kiln.name + ', ' + fmtDate(date) + ', ' + hourLabel(h) + '–' + hourLabel(h + 2) + '.');
  });

  upcomingEl.addEventListener('click', function (e) {
    var id = e.target.getAttribute && e.target.getAttribute('data-cancel');
    if (!id) return;
    var b = bookings.find(function (x) { return x.id === id; });
    if (!b) return;
    var k = kilnById(b.kiln);
    if (!window.confirm('Cancel ' + (k ? k.name : b.kiln) + ' on ' + fmtDate(b.date) + ' at ' + hourLabel(b.hour) + '?')) return;

    var previous = bookings;
    bookings = bookings.filter(function (x) { return x.id !== id; });
    if (!save()) {
      bookings = previous;
      showBanner('err', "Couldn't update bookings in this browser. Try again.");
      return;
    }
    renderSlots();
    renderUpcoming();
    showBanner('ok', 'Booking cancelled.');
    $('up-h').focus();
  });

  // Init
  dateEl.value = todayStr();
  dateEl.min = todayStr();
  renderKilns();
  renderSlots();
  renderUpcoming();
})();
</script>
</body>
</html>
