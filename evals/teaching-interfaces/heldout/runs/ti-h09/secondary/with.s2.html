<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #5b6475;
    --border: #d5dae3;
    --accent: #1f6feb;
    --ok: #1a7f37;
    --ok-bg: #e6f4ea;
    --bad: #b42318;
    --bad-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
  }
  .intro {
    color: var(--muted);
    margin: 0 0 20px;
  }
  .question {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .question.correct { border-color: var(--ok); background: var(--ok-bg); }
  .question.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .question h2 {
    font-size: 1.05rem;
    margin: 0 0 12px;
  }
  .options label {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 6px;
  }
  .options label:hover { background: #eef3fb; }
  .options input { margin-right: 8px; }
  .options input:disabled + span { cursor: default; }
  .feedback {
    margin-top: 10px;
    font-size: 0.95rem;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback strong { font-weight: 600; }
  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  button {
    font: inherit;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.95); }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .warning { color: var(--bad); font-size: 0.95rem; }
  #result {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
    text-align: center;
  }
  #result.show { display: block; }
  #score {
    font-size: 2.2rem;
    font-weight: 700;
    margin: 6px 0;
  }
  #summary { color: var(--muted); margin: 0 0 12px; }
  #wrongList { text-align: left; margin: 12px 0 0; padding-left: 20px; }
  #wrongList li { margin-bottom: 10px; }
</style>
</head>
<body>
<main>
  <h1>Forklift Safety Check</h1>
  <p class="intro">Answer all five questions, then submit to see your score.</p>

  <form id="quiz" novalidate>
    <div id="questions"></div>

    <div class="actions">
      <button type="submit" id="submitBtn">Submit</button>
      <span class="warning" id="warning" hidden>Please answer every question before submitting.</span>
    </div>
  </form>

  <section id="result" aria-live="polite">
    <div>Your score</div>
    <div id="score"></div>
    <p id="summary"></p>
    <ul id="wrongList"></ul>
    <button type="button" class="secondary" id="retakeBtn">Retake quiz</button>
  </section>
</main>

<script>
  const QUESTIONS = [
    {
      text: "Before lifting a load, what should you check on the data plate?",
      options: [
        "The truck's color and model year",
        "The rated capacity, which applies at a specific load center distance",
        "The number of forks on the truck only",
        "The operator's certification expiration date"
      ],
      answer: 1,
      explanation: "The rated capacity is only valid for the stated load center. Loads that are farther out from the mast than the rating allows can tip the truck even if the weight seems within limits."
    },
    {
      text: "A pedestrian is walking in the aisle ahead of your forklift. What should you do?",
      options: [
        "Speed up so they can see you pass",
        "Sound the horn and stop until they are clear of the path",
        "Drive around them on the same aisle at a close distance",
        "Honk once and keep moving at the same speed"
      ],
      answer: 1,
      explanation: "Pedestrians always have the right of way. Stop, sound the horn, and wait until they are clear. Make eye contact before moving again."
    },
    {
      text: "What is the correct speed for a forklift inside the warehouse?",
      options: [
        "As fast as the truck can go on a flat surface",
        "The posted speed limit, slowed further at corners, intersections, and blind spots",
        "Whatever speed keeps up with other trucks",
        "Full speed on straight aisles, since visibility is good"
      ],
      answer: 1,
      explanation: "Follow the posted speed limit and slow down at corners, intersections, doorways, and anywhere your view is blocked. Reduce speed further when carrying a load or on uneven surfaces."
    },
    {
      text: "You need to park the forklift and step away. Which sequence is correct?",
      options: [
        "Leave the engine running and walk away to save time",
        "Lower the forks fully to the ground, set the parking brake, put the controls in neutral, and turn the key off",
        "Leave the forks raised so others can see the load",
        "Set the parking brake only and leave the key in"
      ],
      answer: 1,
      explanation: "Lower the forks to the floor, neutralize the controls, set the parking brake, and turn off the truck. Never leave a truck unattended with the forks raised or the engine running."
    },
    {
      text: "When traveling with a load, how should you position the load?",
      options: [
        "Raised high so you can see over it when moving",
        "Low and tilted back against the mast, as close to the ground as safely possible",
        "Tilted forward so it stays balanced",
        "Raised fully on one side to make turns easier"
      ],
      answer: 1,
      explanation: "Keep the load low and tilted back for stability. Raising the load high or tilting forward raises the center of gravity and increases tip-over risk."
    }
  ];

  const form = document.getElementById("quiz");
  const questionsEl = document.getElementById("questions");
  const submitBtn = document.getElementById("submitBtn");
  const warningEl = document.getElementById("warning");
  const resultEl = document.getElementById("result");
  const scoreEl = document.getElementById("score");
  const summaryEl = document.getElementById("summary");
  const wrongListEl = document.getElementById("wrongList");
  const retakeBtn = document.getElementById("retakeBtn");

  function renderQuestions() {
    questionsEl.innerHTML = "";
    QUESTIONS.forEach((q, qi) => {
      const card = document.createElement("fieldset");
      card.className = "question";
      card.id = "q" + qi;
      card.style.margin = "0 0 14px";
      card.style.padding = "18px 20px";

      const legend = document.createElement("legend");
      legend.style.padding = "0";
      legend.innerHTML = "";
      const title = document.createElement("h2");
      title.textContent = (qi + 1) + ". " + q.text;
      legend.appendChild(title);
      card.appendChild(legend);

      const opts = document.createElement("div");
      opts.className = "options";
      q.options.forEach((opt, oi) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = "q" + qi;
        input.value = oi;
        const span = document.createElement("span");
        span.textContent = opt;
        label.appendChild(input);
        label.appendChild(span);
        opts.appendChild(label);
      });
      card.appendChild(opts);

      const feedback = document.createElement("div");
      feedback.className = "feedback";
      feedback.id = "fb" + qi;
      card.appendChild(feedback);

      questionsEl.appendChild(card);
    });
  }

  function getSelected(qi) {
    const checked = form.querySelector('input[name="q' + qi + '"]:checked');
    return checked ? Number(checked.value) : null;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const unanswered = QUESTIONS.some((_, qi) => getSelected(qi) === null);
    if (unanswered) {
      warningEl.hidden = false;
      return;
    }
    warningEl.hidden = true;

    let score = 0;
    wrongListEl.innerHTML = "";

    QUESTIONS.forEach((q, qi) => {
      const selected = getSelected(qi);
      const card = document.getElementById("q" + qi);
      const fb = document.getElementById("fb" + qi);
      const isRight = selected === q.answer;

      form.querySelectorAll('input[name="q' + qi + '"]').forEach(i => i.disabled = true);
      card.classList.add(isRight ? "correct" : "wrong");

      if (isRight) {
        score++;
        fb.innerHTML = "<strong>Correct.</strong> " + q.explanation;
      } else {
        fb.innerHTML = "<strong>Incorrect.</strong> The right answer is: " +
          escapeHtml(q.options[q.answer]) + ". " + q.explanation;

        const li = document.createElement("li");
        li.innerHTML = "<strong>" + escapeHtml(q.text) + "</strong><br>Correct answer: " +
          escapeHtml(q.options[q.answer]);
        wrongListEl.appendChild(li);
      }
      fb.classList.add("show");
    });

    scoreEl.textContent = score + " / " + QUESTIONS.length;
    summaryEl.textContent = score === QUESTIONS.length
      ? "Perfect score. You are ready for the floor."
      : (QUESTIONS.length - score) + " missed. Review the questions below before operating a forklift.";
    if (score === QUESTIONS.length) {
      wrongListEl.innerHTML = "";
    } else {
      wrongListEl.insertAdjacentHTML("beforebegin", "");
    }
    resultEl.classList.add("show");
    submitBtn.disabled = true;
    resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  retakeBtn.addEventListener("click", () => {
    resultEl.classList.remove("show");
    submitBtn.disabled = false;
    warningEl.hidden = true;
    renderQuestions();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  renderQuestions();
</script>
</body>
</html>
