<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forklift Safety Check</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    color: #1d1f23;
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  .container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    padding: 28px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  h1 {
    margin-top: 0;
    font-size: 1.6rem;
  }
  .intro {
    color: #555;
    margin-bottom: 24px;
  }
  fieldset {
    border: 1px solid #d8dbe0;
    border-radius: 8px;
    margin: 0 0 16px;
    padding: 14px 16px;
  }
  legend {
    font-weight: 600;
    padding: 0 6px;
  }
  label {
    display: block;
    padding: 6px 4px;
    cursor: pointer;
  }
  input[type="radio"] {
    margin-right: 8px;
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #1f6feb;
    color: #fff;
    cursor: pointer;
  }
  button:hover {
    background: #1859c0;
  }
  button.secondary {
    background: #e4e7ec;
    color: #1d1f23;
  }
  button.secondary:hover {
    background: #d3d8df;
  }
  .error {
    color: #b42318;
    font-weight: 600;
    margin: 12px 0 0;
  }
  #results {
    display: none;
  }
  .score {
    font-size: 2rem;
    font-weight: 700;
    margin: 8px 0 4px;
  }
  .summary {
    color: #555;
    margin-bottom: 20px;
  }
  .review {
    border-left: 4px solid #b42318;
    background: #fdf1f0;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .review.correct {
    border-left-color: #137333;
    background: #eef8f1;
  }
  .review p {
    margin: 4px 0;
  }
  .label {
    font-weight: 600;
  }
  .actions {
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Forklift Safety Check</h1>
  <p class="intro">Answer all five questions, then submit to see your score.</p>

  <form id="quiz" novalidate>
    <div id="questions"></div>
    <p id="error" class="error" hidden>Please answer every question before submitting.</p>
    <div class="actions">
      <button type="submit">Submit</button>
    </div>
  </form>

  <div id="results">
    <div class="score" id="score"></div>
    <p class="summary" id="summary"></p>
    <div id="review"></div>
    <div class="actions">
      <button type="button" class="secondary" id="retry">Try again</button>
    </div>
  </div>
</div>

<script>
  const questions = [
    {
      text: "What should you check on a forklift's data plate before lifting a load?",
      options: [
        "Only the truck's color and model year",
        "The rated load capacity, which must not be exceeded",
        "The name of the driver who last used it",
        "The number of hours until the next service"
      ],
      answer: 1,
      explanation: "The data plate lists the rated capacity. Never lift a load heavier than that rating, and remember that capacity drops as the load center moves farther out from the forks."
    },
    {
      text: "You are approaching an intersection or blind corner in the warehouse. What should you do?",
      options: [
        "Speed up so you clear it quickly",
        "Slow down, sound your horn, and watch for pedestrians",
        "Honk only if you see someone in front of you",
        "Keep your speed and rely on warning mirrors alone"
      ],
      answer: 1,
      explanation: "Blind corners and intersections are high-risk spots. Slow down, sound the horn, and be ready to stop for pedestrians who may step into your path without warning."
    },
    {
      text: "Which speed is appropriate for a forklift inside the warehouse?",
      options: [
        "As fast as the truck will go, as long as no one is nearby",
        "Whatever speed keeps you on schedule, even in busy aisles",
        "The posted speed limit, and no faster than a safe walking pace in crowded areas",
        "Full speed on straight aisles and slow speed only on turns"
      ],
      answer: 2,
      explanation: "Follow the posted speed limit. In busy or crowded areas, keep to a safe walking pace, and slow down on turns and in congested spaces."
    },
    {
      text: "You are done with the forklift and need to park it. Which sequence is correct?",
      options: [
        "Turn off the truck, leave the forks raised, and walk away",
        "Lower the forks fully to the floor, set the parking brake, turn off the truck, and remove the key",
        "Leave the truck running and set the parking brake",
        "Lower the forks halfway, then park in the nearest aisle"
      ],
      answer: 1,
      explanation: "Lower the forks fully to the ground, set the parking brake, turn off the power, and remove the key. Never park on an incline or block aisles, fire exits, or equipment."
    },
    {
      text: "How should you travel with an empty or loaded forklift?",
      options: [
        "With the forks raised as high as possible for visibility",
        "With the forks lowered to about 4 to 6 inches above the floor",
        "With the forks resting on the floor",
        "With the forks at the height of the nearest pallet"
      ],
      answer: 1,
      explanation: "Travel with the forks low, about 4 to 6 inches off the floor. This keeps the load stable and reduces the chance of hitting people or objects."
    }
  ];

  const form = document.getElementById("quiz");
  const questionsEl = document.getElementById("questions");
  const errorEl = document.getElementById("error");
  const resultsEl = document.getElementById("results");
  const scoreEl = document.getElementById("score");
  const summaryEl = document.getElementById("summary");
  const reviewEl = document.getElementById("review");

  function renderQuestions() {
    questionsEl.textContent = "";
    questions.forEach((q, qIndex) => {
      const fieldset = document.createElement("fieldset");
      const legend = document.createElement("legend");
      legend.textContent = `${qIndex + 1}. ${q.text}`;
      fieldset.appendChild(legend);

      q.options.forEach((opt, oIndex) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q${qIndex}`;
        input.value = String(oIndex);
        label.appendChild(input);
        label.appendChild(document.createTextNode(opt));
        fieldset.appendChild(label);
      });

      questionsEl.appendChild(fieldset);
    });
  }

  function getSelected(qIndex) {
    const checked = form.querySelector(`input[name="q${qIndex}"]:checked`);
    return checked ? Number(checked.value) : null;
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();

    const selections = questions.map((_, i) => getSelected(i));
    if (selections.some((s) => s === null)) {
      errorEl.hidden = false;
      return;
    }
    errorEl.hidden = true;

    let score = 0;
    reviewEl.textContent = "";

    questions.forEach((q, i) => {
      const correct = selections[i] === q.answer;
      if (correct) {
        score++;
        return;
      }

      const box = document.createElement("div");
      box.className = "review";

      const title = document.createElement("p");
      title.className = "label";
      title.textContent = `Question ${i + 1}: incorrect`;

      const yours = document.createElement("p");
      yours.textContent = `Your answer: ${q.options[selections[i]]}`;

      const right = document.createElement("p");
      right.textContent = `Correct answer: ${q.options[q.answer]}`;

      const why = document.createElement("p");
      why.textContent = q.explanation;

      box.append(title, yours, right, why);
      reviewEl.appendChild(box);
    });

    if (score === questions.length) {
      const perfect = document.createElement("div");
      perfect.className = "review correct";
      const p = document.createElement("p");
      p.textContent = "All answers correct. Nice work.";
      perfect.appendChild(p);
      reviewEl.appendChild(perfect);
    }

    scoreEl.textContent = `Score: ${score} of ${questions.length}`;
    summaryEl.textContent = score === questions.length
      ? "You answered every question correctly."
      : `You missed ${questions.length - score}. Review the answers below.`;

    form.hidden = true;
    resultsEl.style.display = "block";
    resultsEl.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  document.getElementById("retry").addEventListener("click", () => {
    resultsEl.style.display = "none";
    reviewEl.textContent = "";
    form.reset();
    errorEl.hidden = true;
    form.hidden = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  renderQuestions();
</script>
</body>
</html>
