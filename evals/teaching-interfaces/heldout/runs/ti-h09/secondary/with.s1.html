<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d232b;
    --muted: #5b6573;
    --border: #d5dae1;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --good: #1a7f37;
    --good-bg: #e6f4ea;
    --bad: #b42318;
    --bad-bg: #fdecea;
    --warn: #9a6700;
    --warn-bg: #fff8e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13171c;
      --card: #1c2229;
      --text: #e6eaf0;
      --muted: #9aa5b1;
      --border: #2e3741;
      --accent: #4c8dff;
      --accent-text: #0b1220;
      --good: #4cc772;
      --good-bg: #173322;
      --bad: #ff7b72;
      --bad-bg: #3a1c1c;
      --warn: #e3b341;
      --warn-bg: #3a300f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
  }
  .intro {
    color: var(--muted);
    margin: 0 0 20px;
  }
  .question {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .question fieldset {
    border: 0;
    margin: 0;
    padding: 0;
  }
  .question legend {
    font-weight: 600;
    padding: 0;
    margin-bottom: 10px;
  }
  .qnum {
    color: var(--muted);
    font-size: 0.85rem;
    display: block;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .option:hover { border-color: var(--accent); }
  .option input { margin-top: 4px; }
  .option.selected { border-color: var(--accent); }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .feedback {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .feedback strong { color: inherit; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 6px;
    border: 0;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .notice {
    color: var(--warn);
    background: var(--warn-bg);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.92rem;
    display: none;
  }
  .notice.show { display: block; }
  #result {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
  }
  #result.show { display: block; }
  .score {
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .verdict { margin: 0 0 16px; color: var(--muted); }
  .wrong-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .wrong-list li {
    border-left: 4px solid var(--bad);
    background: var(--bad-bg);
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .wrong-list .q { font-weight: 600; margin-bottom: 4px; }
  .wrong-list .line { font-size: 0.92rem; }
  .perfect {
    border-left: 4px solid var(--good);
    background: var(--good-bg);
    color: var(--good);
    padding: 10px 12px;
    border-radius: 6px;
  }
</style>
</head>
<body>
<main>
  <h1>Forklift Safety Check</h1>
  <p class="intro">Five questions on the basics you need before operating a forklift in the warehouse. Pick one answer for each question, then submit.</p>

  <form id="quiz" novalidate>
    <div id="questions"></div>

    <div class="actions">
      <button type="submit" id="submit">Submit</button>
      <span class="notice" id="notice">Please answer every question before submitting.</span>
    </div>
  </form>

  <section id="result" aria-live="polite">
    <p class="score" id="score"></p>
    <p class="verdict" id="verdict"></p>
    <ul class="wrong-list" id="wrongList"></ul>
    <div class="actions">
      <button type="button" class="secondary" id="retry">Try again</button>
    </div>
  </section>
</main>

<script>
  const QUESTIONS = [
    {
      prompt: "Before lifting a load, where do you find the truck's maximum rated capacity?",
      options: [
        "On the capacity data plate on the truck",
        "Estimate it from the size of the forks",
        "Ask the last operator who used the truck",
        "It is printed on the warehouse floor plan"
      ],
      answer: 0,
      explain: "The data plate lists the rated capacity and load center. Never exceed it, and remember that a load carried farther forward than the load center reduces what the truck can safely lift."
    },
    {
      prompt: "You are approaching a blind corner or intersection in the aisle. What should you do?",
      options: [
        "Speed up so you clear the intersection quickly",
        "Sound the horn, slow down, and be ready to stop for pedestrians",
        "Assume pedestrians will see you and keep going",
        "Honk only if someone is directly in your path"
      ],
      answer: 1,
      explain: "Sound the horn at blind corners and intersections, slow down, and be ready to stop. Pedestrians may not see or hear the truck coming."
    },
    {
      prompt: "How fast should you travel in a warehouse aisle, especially while carrying a load?",
      options: [
        "As fast as the truck allows, since the posted limit is the maximum",
        "At a speed that lets you stop safely, generally no faster than a brisk walk indoors",
        "Faster when the load is heavy, to keep the truck stable",
        "Speed does not matter as long as you stay in your lane"
      ],
      answer: 1,
      explain: "Always travel at a speed that lets you stop safely and follow the posted limit. Indoors that is generally no faster than a walking pace, and slower on turns, ramps, and busy aisles."
    },
    {
      prompt: "When you park the forklift and leave it, what is the correct procedure?",
      options: [
        "Leave the forks raised so the next operator can start lifting right away",
        "Park on the ramp so the truck is out of the way",
        "Lower the forks fully to the floor, put the controls in neutral, set the parking brake, and turn the key off",
        "Leave the engine running and step away briefly"
      ],
      answer: 2,
      explain: "Lower the forks flat to the floor, place the controls in neutral, set the parking brake, and turn the truck off. Do not park on a ramp or incline, and do not block aisles, exits, or fire equipment."
    },
    {
      prompt: "While traveling with a load, how should the forks be positioned?",
      options: [
        "Raised high so they clear obstacles on the floor",
        "Tilted forward so the load can be pushed off easily",
        "Low to the ground and tilted back toward the mast",
        "Level with the top of the load so it is evenly balanced"
      ],
      answer: 2,
      explain: "Keep the load low, generally a few inches off the floor, and tilt it back. This keeps the load stable and the center of gravity as close to the truck as possible."
    }
  ];

  const form = document.getElementById("quiz");
  const questionsEl = document.getElementById("questions");
  const submitBtn = document.getElementById("submit");
  const notice = document.getElementById("notice");
  const resultEl = document.getElementById("result");
  const scoreEl = document.getElementById("score");
  const verdictEl = document.getElementById("verdict");
  const wrongList = document.getElementById("wrongList");
  const retryBtn = document.getElementById("retry");

  function buildQuiz() {
    questionsEl.textContent = "";
    QUESTIONS.forEach((q, qi) => {
      const card = document.createElement("div");
      card.className = "question";
      card.id = `q${qi}`;

      const fieldset = document.createElement("fieldset");
      const legend = document.createElement("legend");

      const num = document.createElement("span");
      num.className = "qnum";
      num.textContent = `Question ${qi + 1} of ${QUESTIONS.length}`;
      legend.appendChild(num);
      legend.appendChild(document.createTextNode(q.prompt));
      fieldset.appendChild(legend);

      q.options.forEach((text, oi) => {
        const label = document.createElement("label");
        label.className = "option";

        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q${qi}`;
        input.value = String(oi);
        input.addEventListener("change", () => {
          notice.classList.remove("show");
          card.querySelectorAll(".option").forEach(l => l.classList.remove("selected"));
          label.classList.add("selected");
        });

        const span = document.createElement("span");
        span.textContent = text;

        label.appendChild(input);
        label.appendChild(span);
        fieldset.appendChild(label);
      });

      card.appendChild(fieldset);
      questionsEl.appendChild(card);
    });
  }

  function getSelected(qi) {
    const checked = form.querySelector(`input[name="q${qi}"]:checked`);
    return checked ? Number(checked.value) : null;
  }

  function showResults() {
    let correctCount = 0;
    wrongList.textContent = "";

    QUESTIONS.forEach((q, qi) => {
      const selected = getSelected(qi);
      const card = document.getElementById(`q${qi}`);
      const labels = card.querySelectorAll(".option");
      const inputs = card.querySelectorAll("input");

      inputs.forEach(i => { i.disabled = true; });
      labels.forEach((label, oi) => {
        if (oi === q.answer) label.classList.add("correct");
        if (oi === selected && selected !== q.answer) label.classList.add("wrong");
      });

      const feedback = document.createElement("div");
      feedback.className = "feedback " + (selected === q.answer ? "good" : "bad");
      if (selected === q.answer) {
        feedback.textContent = "Correct.";
        correctCount++;
      } else {
        feedback.textContent = "";
        const strong = document.createElement("strong");
        strong.textContent = "Not quite. ";
        feedback.appendChild(strong);
        feedback.appendChild(document.createTextNode(q.explain));
      }
      card.appendChild(feedback);

      if (selected !== q.answer) {
        const li = document.createElement("li");
        const qEl = document.createElement("div");
        qEl.className = "q";
        qEl.textContent = `Q${qi + 1}. ${q.prompt}`;

        const yours = document.createElement("div");
        yours.className = "line";
        yours.textContent = `Your answer: ${q.options[selected]}`;

        const right = document.createElement("div");
        right.className = "line";
        right.textContent = `Correct answer: ${q.options[q.answer]}`;

        li.appendChild(qEl);
        li.appendChild(yours);
        li.appendChild(right);
        wrongList.appendChild(li);
      }
    });

    const total = QUESTIONS.length;
    scoreEl.textContent = `You scored ${correctCount} out of ${total}`;

    if (correctCount === total) {
      verdictEl.textContent = "";
      const perfect = document.createElement("div");
      perfect.className = "perfect";
      perfect.textContent = "All correct. Nice work.";
      wrongList.appendChild(perfect);
    } else {
      verdictEl.textContent = "Review the questions below, then retake the check. Ask your supervisor if anything is unclear.";
    }

    resultEl.classList.add("show");
    submitBtn.disabled = true;
    resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const unanswered = QUESTIONS.findIndex((_, qi) => getSelected(qi) === null);
    if (unanswered !== -1) {
      notice.classList.add("show");
      document.getElementById(`q${unanswered}`).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    showResults();
  });

  retryBtn.addEventListener("click", () => {
    resultEl.classList.remove("show");
    submitBtn.disabled = false;
    notice.classList.remove("show");
    buildQuiz();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  buildQuiz();
</script>
</body>
</html>
