<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #5b6475;
    --border: #d5d9e0;
    --accent: #1f6feb;
    --ok: #1a7f37;
    --ok-bg: #e6f6ec;
    --bad: #b42318;
    --bad-bg: #fdecea;
    --warn: #9a6700;
    --warn-bg: #fff8e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0 0 20px; color: var(--muted); }
  .question {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .question legend {
    font-weight: 600;
    font-size: 1.02rem;
    padding: 0;
    margin-bottom: 10px;
  }
  .question fieldset { border: 0; margin: 0; padding: 0; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .option:hover { background: #f0f5ff; }
  .option input { margin-top: 4px; }
  .option.correct { background: var(--ok-bg); }
  .option.wrong-pick { background: var(--bad-bg); }
  .feedback {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  .feedback.ok { background: var(--ok-bg); color: var(--ok); }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  button {
    font: inherit;
    padding: 10px 20px;
    border-radius: 6px;
    border: 0;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { filter: brightness(0.95); }
  button.secondary { background: #e6e9ef; color: var(--text); }
  .notice { color: var(--warn); background: var(--warn-bg); padding: 8px 12px; border-radius: 6px; display: none; }
  .result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
    display: none;
  }
  .result .score { font-size: 2.4rem; font-weight: 700; margin: 0; }
  .result .verdict { font-size: 1.05rem; margin: 6px 0 0; }
  .result.pass .score, .result.pass .verdict { color: var(--ok); }
  .result.fail .score, .result.fail .verdict { color: var(--bad); }
  .missed-list { margin-top: 14px; text-align: left; }
  .missed-list h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .missed-list ul { margin: 0; padding-left: 20px; }
  .missed-list li { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Forklift Safety Check</h1>
    <p>New hire knowledge check. Answer all 5 questions, then submit.</p>
  </header>

  <div id="result" class="result" role="status" aria-live="polite">
    <p class="score" id="scoreText"></p>
    <p class="verdict" id="verdictText"></p>
    <div id="missed" class="missed-list"></div>
    <div class="actions" style="justify-content:center;">
      <button type="button" class="secondary" id="retryBtn">Try again</button>
    </div>
  </div>

  <form id="quiz" novalidate>
    <div id="questions"></div>
    <div class="notice" id="notice">Please answer every question before submitting.</div>
    <div class="actions">
      <button type="submit" id="submitBtn">Submit</button>
    </div>
  </form>
</div>

<script>
  var QUESTIONS = [
    {
      prompt: "Before lifting a load, what must you check?",
      options: [
        "Only that the load looks roughly even",
        "The truck's capacity plate and that the load is within rated capacity for its load center",
        "That the forks are at their highest position",
        "Nothing, if the load is under 500 lbs"
      ],
      answer: 1,
      explanation: "Never exceed the rated capacity on the data plate. Capacity drops as the load center moves farther from the mast, so check the load center too."
    },
    {
      prompt: "A pedestrian is walking in the aisle ahead of your forklift. What should you do?",
      options: [
        "Speed up to get past them before they move",
        "Sound the horn and drive around them at the same speed",
        "Stop, sound the horn if needed, and wait until they are clear of the path",
        "Honk once and continue, since they should move out of the way"
      ],
      answer: 2,
      explanation: "Pedestrians always have the right of way. Stop, alert them, and do not move until they are clear."
    },
    {
      prompt: "What is the correct speed when operating in a busy warehouse?",
      options: [
        "As fast as the truck will go, as long as you stay in your lane",
        "A safe speed that never exceeds the posted limit, and slow down at intersections and blind corners",
        "Full speed on straight aisles, since you can see far ahead",
        "Whatever speed keeps your load from shifting, even in crowded areas"
      ],
      answer: 1,
      explanation: "Follow posted speed limits and slow down well before intersections, doorways, and blind corners. Keep speed low enough to stop safely."
    },
    {
      prompt: "When you park a forklift and leave it, which steps are correct?",
      options: [
        "Leave the forks raised so others can see the load, then walk away",
        "Lower the forks fully to the floor, set the parking brake, neutralize the controls, and turn off the truck and remove the key",
        "Leave the engine running and set the forks at waist height",
        "Park on a slight incline to help the brakes hold, and leave the key in the ignition"
      ],
      answer: 1,
      explanation: "Lower the forks flat to the ground, set the brake, turn off the engine, and remove the key. Never park on an incline or block an exit or aisle."
    },
    {
      prompt: "When traveling with a load, how should you carry it?",
      options: [
        "High and tilted forward so you can see over it",
        "As low as possible with the mast tilted back",
        "Raised to the top of the rack so it clears the floor",
        "Tilted forward with the forks pointed up"
      ],
      answer: 1,
      explanation: "Keep the load low and tilted back for stability. Traveling with a high or forward-tilted load raises the risk of tipping and load loss."
    }
  ];

  var form = document.getElementById("quiz");
  var questionsEl = document.getElementById("questions");
  var noticeEl = document.getElementById("notice");
  var submitBtn = document.getElementById("submitBtn");
  var resultEl = document.getElementById("result");
  var scoreText = document.getElementById("scoreText");
  var verdictText = document.getElementById("verdictText");
  var missedEl = document.getElementById("missed");
  var retryBtn = document.getElementById("retryBtn");

  var PASS_MARK = 4;

  function buildQuiz() {
    questionsEl.textContent = "";
    QUESTIONS.forEach(function (q, qi) {
      var card = document.createElement("div");
      card.className = "question";
      card.id = "q" + qi;

      var fieldset = document.createElement("fieldset");
      var legend = document.createElement("legend");
      legend.textContent = (qi + 1) + ". " + q.prompt;
      fieldset.appendChild(legend);

      q.options.forEach(function (opt, oi) {
        var label = document.createElement("label");
        label.className = "option";

        var input = document.createElement("input");
        input.type = "radio";
        input.name = "q" + qi;
        input.value = String(oi);

        var span = document.createElement("span");
        span.textContent = opt;

        label.appendChild(input);
        label.appendChild(span);
        fieldset.appendChild(label);
      });

      card.appendChild(fieldset);
      questionsEl.appendChild(card);
    });
  }

  function clearMarks() {
    document.querySelectorAll(".option").forEach(function (el) {
      el.classList.remove("correct", "wrong-pick");
    });
    document.querySelectorAll(".feedback").forEach(function (el) {
      el.remove();
    });
  }

  function gradeQuiz() {
    var unanswered = [];
    var score = 0;
    var missed = [];

    clearMarks();

    QUESTIONS.forEach(function (q, qi) {
      var checked = form.querySelector('input[name="q' + qi + '"]:checked');
      var card = document.getElementById("q" + qi);
      var options = card.querySelectorAll(".option");

      if (!checked) {
        unanswered.push(qi + 1);
        return;
      }

      var picked = parseInt(checked.value, 10);
      options[q.answer].classList.add("correct");

      var feedback = document.createElement("div");
      feedback.className = "feedback";

      if (picked === q.answer) {
        score++;
        feedback.classList.add("ok");
        feedback.textContent = "Correct. " + q.explanation;
      } else {
        options[picked].classList.add("wrong-pick");
        feedback.classList.add("bad");
        feedback.textContent = "Incorrect. The right answer is: " + q.options[q.answer] + ". " + q.explanation;
        missed.push({ number: qi + 1, prompt: q.prompt, correct: q.options[q.answer] });
      }

      card.appendChild(feedback);
    });

    return { unanswered: unanswered, score: score, missed: missed };
  }

  function showResult(score, missed) {
    var passed = score >= PASS_MARK;
    resultEl.classList.remove("pass", "fail");
    resultEl.classList.add(passed ? "pass" : "fail");
    resultEl.style.display = "block";

    scoreText.textContent = "Score: " + score + " / " + QUESTIONS.length;
    verdictText.textContent = passed
      ? "Passed. Review any missed items below."
      : "Not passed. Review the safety points below and try again.";

    missedEl.textContent = "";
    if (missed.length) {
      var h = document.createElement("h2");
      h.textContent = "Questions to review";
      missedEl.appendChild(h);

      var ul = document.createElement("ul");
      missed.forEach(function (m) {
        var li = document.createElement("li");
        var strong = document.createElement("strong");
        strong.textContent = "Q" + m.number + ": ";
        li.appendChild(strong);
        li.appendChild(document.createTextNode(m.prompt + " Correct answer: " + m.correct));
        ul.appendChild(li);
      });
      missedEl.appendChild(ul);
    } else {
      var all = document.createElement("p");
      all.textContent = "Every answer was correct.";
      missedEl.appendChild(all);
    }

    resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    noticeEl.style.display = "none";

    var graded = gradeQuiz();
    if (graded.unanswered.length) {
      clearMarks();
      noticeEl.textContent = "Please answer every question before submitting. Unanswered: " + graded.unanswered.join(", ") + ".";
      noticeEl.style.display = "block";
      var first = document.getElementById("q" + (graded.unanswered[0] - 1));
      if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    submitBtn.disabled = true;
    form.querySelectorAll("input").forEach(function (input) { input.disabled = true; });
    showResult(graded.score, graded.missed);
  });

  retryBtn.addEventListener("click", function () {
    resultEl.style.display = "none";
    noticeEl.style.display = "none";
    submitBtn.disabled = false;
    buildQuiz();
    form.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  buildQuiz();
</script>
</body>
</html>
