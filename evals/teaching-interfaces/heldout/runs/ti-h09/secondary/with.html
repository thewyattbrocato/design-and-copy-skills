<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --border: #d9dee5;
    --accent: #1d6fd1;
    --accent-hover: #155aab;
    --ok: #1e7b43;
    --ok-bg: #e7f5ec;
    --bad: #b42318;
    --bad-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  .container { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 24px; }
  .question {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .question.correct { border-color: var(--ok); background: var(--ok-bg); }
  .question.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .q-title { font-weight: 600; margin: 0 0 12px; }
  .options { list-style: none; padding: 0; margin: 0; }
  .options li { margin-bottom: 8px; }
  .options label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    background: var(--card);
  }
  .options label:hover { border-color: var(--accent); }
  .options input { margin-top: 4px; }
  .options li.is-correct label { border-color: var(--ok); font-weight: 600; }
  .options li.is-picked-wrong label { border-color: var(--bad); }
  .feedback { margin: 12px 0 0; font-size: 0.95rem; }
  .feedback.wrong-text { color: var(--bad); }
  .feedback.correct-text { color: var(--ok); }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
  button {
    font: inherit;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #9aa5b1; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.secondary:hover { background: #eef5fd; }
  .warning { color: var(--bad); font-size: 0.95rem; }
  .result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .score { font-size: 2rem; font-weight: 700; margin: 0 0 4px; }
  .pass { color: var(--ok); }
  .fail { color: var(--bad); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Forklift Safety Check</h1>
  <p class="subtitle">Answer all five questions, then submit to see your score.</p>

  <div id="quiz"></div>

  <div class="actions" id="submit-row">
    <button id="submit-btn" type="button">Submit</button>
    <span class="warning hidden" id="warning">Please answer every question before submitting.</span>
  </div>

  <div id="results" class="hidden">
    <div class="result">
      <p class="score" id="score"></p>
      <p id="score-msg"></p>
      <div class="actions">
        <button class="secondary" id="retry-btn" type="button">Try again</button>
      </div>
    </div>
    <div id="review"></div>
  </div>
</div>

<script>
  const QUESTIONS = [
    {
      prompt: "Before lifting a load, what should you check on the forklift's data plate?",
      options: [
        "Nothing; the rated capacity is the same for every load.",
        "The rated capacity, which drops as the load center moves farther out from the forks.",
        "Only the tire pressure, since that determines the lifting limit.",
        "The truck's top speed, which sets the maximum load weight."
      ],
      answer: 1,
      explanation: "The rated capacity applies only at a specified load center. Moving the load farther forward reduces what the truck can safely lift, so never exceed the plate rating."
    },
    {
      prompt: "You are approaching a blind corner or intersection in the warehouse aisle. What should you do?",
      options: [
        "Speed up so you clear the intersection quickly.",
        "Sound the horn, slow down, and be ready to stop for pedestrians.",
        "Honk only if you see someone directly in front of you.",
        "Keep your eyes on the load and rely on the mirrors alone."
      ],
      answer: 1,
      explanation: "Blind corners and intersections are where pedestrians are most likely to appear unseen. Sound the horn, slow down, and be ready to stop."
    },
    {
      prompt: "What is the correct way to control your speed inside the warehouse?",
      options: [
        "Drive at the top speed the truck can reach, as long as no one is in the way.",
        "Obey posted speed limits and drive slowly enough to stop safely at any time.",
        "Drive fast on straight aisles and slow down only at turns.",
        "Match the speed of other forklifts in the area, even if it is faster than walking pace."
      ],
      answer: 1,
      explanation: "Always obey posted limits and drive at a speed that lets you stop safely. In congested areas, walking pace is typical."
    },
    {
      prompt: "When you park the forklift, what should you do with the forks?",
      options: [
        "Leave them raised so the next operator can start working right away.",
        "Lower them fully to the floor before you leave the truck.",
        "Hold them about halfway up so they stay out of the way.",
        "Tilt them forward so they rest on the ground."
      ],
      answer: 1,
      explanation: "Lower the forks fully to the floor so they cannot fall or cause injury. Then neutralize the controls, set the parking brake, and turn off the truck."
    },
    {
      prompt: "How should the mast and forks be positioned when you are traveling with a load?",
      options: [
        "Mast tilted forward with the load raised high for better visibility.",
        "Mast tilted back with the load as low as possible.",
        "Mast upright with the load raised to shoulder height.",
        "Forks tilted forward with the load held at mid-height."
      ],
      answer: 1,
      explanation: "Keep the load tilted back and as low as possible while traveling. This keeps the load stable and secure, and reduces the risk of tipping."
    }
  ];

  const quizEl = document.getElementById("quiz");
  const submitBtn = document.getElementById("submit-btn");
  const warningEl = document.getElementById("warning");
  const resultsEl = document.getElementById("results");
  const scoreEl = document.getElementById("score");
  const scoreMsgEl = document.getElementById("score-msg");
  const reviewEl = document.getElementById("review");
  const retryBtn = document.getElementById("retry-btn");

  function renderQuiz() {
    quizEl.innerHTML = "";
    QUESTIONS.forEach((q, i) => {
      const card = document.createElement("div");
      card.className = "question";
      card.id = "q" + i;

      const title = document.createElement("p");
      title.className = "q-title";
      title.textContent = (i + 1) + ". " + q.prompt;
      card.appendChild(title);

      const list = document.createElement("ul");
      list.className = "options";
      q.options.forEach((opt, j) => {
        const li = document.createElement("li");
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = "q" + i;
        input.value = j;
        label.appendChild(input);
        label.appendChild(document.createTextNode(" " + opt));
        li.appendChild(label);
        list.appendChild(li);
      });
      card.appendChild(list);
      quizEl.appendChild(card);
    });
  }

  function getSelected(i) {
    const checked = document.querySelector('input[name="q' + i + '"]:checked');
    return checked ? Number(checked.value) : null;
  }

  function submitQuiz() {
    const answers = QUESTIONS.map((_, i) => getSelected(i));
    if (answers.some(a => a === null)) {
      warningEl.classList.remove("hidden");
      return;
    }
    warningEl.classList.add("hidden");

    let score = 0;
    const wrongItems = [];

    QUESTIONS.forEach((q, i) => {
      const card = document.getElementById("q" + i);
      const picked = answers[i];
      const items = card.querySelectorAll(".options li");
      items.forEach((li, j) => {
        const input = li.querySelector("input");
        input.disabled = true;
        if (j === q.answer) li.classList.add("is-correct");
        if (j === picked && picked !== q.answer) li.classList.add("is-picked-wrong");
      });

      if (picked === q.answer) {
        score++;
        card.classList.add("correct");
      } else {
        card.classList.add("wrong");
        wrongItems.push({ number: i + 1, prompt: q.prompt, yourAnswer: q.options[picked], correct: q.options[q.answer], explanation: q.explanation });
      }
    });

    submitBtn.disabled = true;
    showResults(score, wrongItems);
  }

  function showResults(score, wrongItems) {
    const total = QUESTIONS.length;
    scoreEl.textContent = "You scored " + score + " out of " + total;
    scoreEl.className = "score " + (score === total ? "pass" : (score >= Math.ceil(total * 0.8) ? "pass" : "fail"));

    if (score === total) {
      scoreMsgEl.textContent = "Perfect score. You are ready for the warehouse floor.";
    } else if (wrongItems.length === 0) {
      scoreMsgEl.textContent = "";
    } else {
      scoreMsgEl.textContent = "Review the questions you missed below before you operate a forklift.";
    }

    reviewEl.innerHTML = "";
    if (wrongItems.length > 0) {
      const heading = document.createElement("h2");
      heading.style.fontSize = "1.1rem";
      heading.textContent = "Questions you missed";
      reviewEl.appendChild(heading);

      wrongItems.forEach(item => {
        const box = document.createElement("div");
        box.className = "result";

        const q = document.createElement("p");
        q.className = "q-title";
        q.textContent = item.number + ". " + item.prompt;
        box.appendChild(q);

        const yours = document.createElement("p");
        yours.className = "feedback wrong-text";
        yours.textContent = "Your answer: " + item.yourAnswer;
        box.appendChild(yours);

        const right = document.createElement("p");
        right.className = "feedback correct-text";
        right.textContent = "Correct answer: " + item.correct;
        box.appendChild(right);

        const why = document.createElement("p");
        why.className = "feedback";
        why.textContent = item.explanation;
        box.appendChild(why);

        reviewEl.appendChild(box);
      });
    }

    resultsEl.classList.remove("hidden");
    resultsEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function resetQuiz() {
    resultsEl.classList.add("hidden");
    reviewEl.innerHTML = "";
    submitBtn.disabled = false;
    warningEl.classList.add("hidden");
    renderQuiz();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  submitBtn.addEventListener("click", submitQuiz);
  retryBtn.addEventListener("click", resetQuiz);
  renderQuiz();
</script>
</body>
</html>
