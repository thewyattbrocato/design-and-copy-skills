<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1d1d1b;
    --muted: #5c5a54;
    --line: #d6d1c4;
    --accent: #b45309;
    --accent-ink: #ffffff;
    --good: #166534;
    --good-bg: #e7f4ea;
    --bad: #991b1b;
    --bad-bg: #fbeaea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17160f;
      --card: #23211a;
      --ink: #f2efe6;
      --muted: #b5b0a0;
      --line: #3d3a2e;
      --accent: #f59e0b;
      --accent-ink: #1d1d1b;
      --good: #86efac;
      --good-bg: #16301d;
      --bad: #fca5a5;
      --bad-bg: #3a1c1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
  header { border-left: 8px solid var(--accent); padding-left: 14px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 4px 0 0; color: var(--muted); }
  fieldset {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 0 0 16px;
    padding: 16px;
  }
  fieldset.missing { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad); }
  legend { font-weight: 700; padding: 0 6px; font-size: 1.05rem; }
  .qnum { color: var(--accent); }
  label {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  label:hover { border-color: var(--accent); }
  label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  input[type=radio] { margin-top: 5px; accent-color: var(--accent); flex: none; width: 18px; height: 18px; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit;
    font-weight: 700;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 8px;
    padding: 12px 24px;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  #error { color: var(--bad); font-weight: 600; margin: 0 0 12px; min-height: 1.5em; }
  #results[hidden], #quiz[hidden] { display: none; }
  .score {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .score .big { font-size: 3rem; font-weight: 800; line-height: 1.1; color: var(--accent); }
  .score p { margin: 6px 0 0; color: var(--muted); }
  .review {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 8px solid var(--bad);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .review h3 { margin: 0 0 8px; font-size: 1rem; }
  .ans { padding: 8px 10px; border-radius: 6px; margin-top: 6px; }
  .ans.wrong { background: var(--bad-bg); color: var(--bad); }
  .ans.right { background: var(--good-bg); color: var(--good); }
  .ans b { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .why { color: var(--muted); margin: 8px 0 0; font-size: .95rem; }
  .allgood { border-left-color: var(--good); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Forklift Safety Check</h1>
    <p>5 questions for new hires. Pick one answer for each, then submit.</p>
  </header>

  <form id="quiz" novalidate></form>

  <section id="results" hidden aria-live="polite" tabindex="-1"></section>
</main>

<script>
const QUESTIONS = [
  {
    q: "Where do you find the maximum load a forklift can safely lift?",
    options: [
      "On the capacity data plate attached to the truck",
      "In the pallet's shipping paperwork",
      "It is the same for every forklift in the warehouse",
      "Ask the person who loaded the pallet"
    ],
    answer: 0,
    why: "Each truck has its own rated capacity, shown on its data plate. Never exceed it, and remember attachments or a high load center can reduce it."
  },
  {
    q: "A pedestrian steps into your path while you are driving. What do you do?",
    options: [
      "Honk and keep going so they know to move",
      "Speed up and go around them",
      "Stop, make eye contact, and wait until they have clearly moved out of the way",
      "Flash your lights and continue slowly"
    ],
    answer: 2,
    why: "Pedestrians always have the right of way. Stop completely and proceed only when you are sure they have seen you and are clear."
  },
  {
    q: "How fast should you drive the forklift?",
    options: [
      "As fast as needed to keep up with orders",
      "At a speed that lets you stop safely, and slower on wet floors, corners and in busy areas",
      "Full speed when the aisle is empty",
      "Fast when empty, slow only when carrying a load"
    ],
    answer: 1,
    why: "Forklifts can tip when turning too fast and take longer to stop than you expect. Obey posted limits and slow down for hazards, corners and blind spots."
  },
  {
    q: "You are finished and need to park the forklift. What is the correct procedure?",
    options: [
      "Leave the forks raised so they are ready for the next driver",
      "Stop in the aisle, keep the engine running, and walk away briefly",
      "Park on a slope so it is easy to roll away",
      "Fully lower the forks to the floor, put it in neutral, set the parking brake, and turn it off"
    ],
    answer: 3,
    why: "Raised forks are a trip and collision hazard. Park only in a designated area, never blocking exits, aisles or fire equipment."
  },
  {
    q: "When driving with a load, where should the forks be?",
    options: [
      "Raised high so you can see under the load",
      "Low, just above the floor (about 4 to 6 inches), with the mast tilted slightly back",
      "At chest height so pedestrians can see the load",
      "It doesn't matter if you are driving slowly"
    ],
    answer: 1,
    why: "A low, tilted-back load keeps the center of gravity low and stable. If the load blocks your view, drive in reverse or use a spotter."
  }
];

const form = document.getElementById("quiz");
const results = document.getElementById("results");

function build() {
  form.innerHTML = "";
  QUESTIONS.forEach((item, i) => {
    const fs = document.createElement("fieldset");
    fs.id = "q" + i;
    const lg = document.createElement("legend");
    lg.innerHTML = '<span class="qnum">Q' + (i + 1) + '.</span> ';
    lg.appendChild(document.createTextNode(item.q));
    fs.appendChild(lg);
    item.options.forEach((opt, j) => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "q" + i;
      input.value = j;
      input.addEventListener("change", () => {
        fs.classList.remove("missing");
        document.getElementById("error").textContent = "";
      });
      const span = document.createElement("span");
      span.textContent = opt;
      label.append(input, span);
      fs.appendChild(label);
    });
    form.appendChild(fs);
  });
  const err = document.createElement("p");
  err.id = "error";
  err.setAttribute("role", "alert");
  const btn = document.createElement("button");
  btn.type = "submit";
  btn.textContent = "Submit answers";
  form.append(err, btn);
}

function review(i, chosen) {
  const item = QUESTIONS[i];
  const div = document.createElement("div");
  div.className = "review";
  const h = document.createElement("h3");
  h.textContent = "Q" + (i + 1) + ". " + item.q;
  const mine = document.createElement("div");
  mine.className = "ans wrong";
  mine.innerHTML = "<b>Your answer</b>";
  mine.appendChild(document.createTextNode(item.options[chosen]));
  const right = document.createElement("div");
  right.className = "ans right";
  right.innerHTML = "<b>Correct answer</b>";
  right.appendChild(document.createTextNode(item.options[item.answer]));
  const why = document.createElement("p");
  why.className = "why";
  why.textContent = item.why;
  div.append(h, mine, right, why);
  return div;
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const picks = QUESTIONS.map((_, i) => {
    const el = form.querySelector('input[name="q' + i + '"]:checked');
    return el ? Number(el.value) : null;
  });
  const unanswered = picks.map((p, i) => (p === null ? i : -1)).filter(i => i >= 0);
  QUESTIONS.forEach((_, i) => document.getElementById("q" + i).classList.toggle("missing", unanswered.includes(i)));
  if (unanswered.length) {
    document.getElementById("error").textContent =
      "Please answer question" + (unanswered.length > 1 ? "s " : " ") +
      unanswered.map(i => i + 1).join(", ") + " before submitting.";
    document.getElementById("q" + unanswered[0]).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  const wrong = picks.map((p, i) => (p !== QUESTIONS[i].answer ? i : -1)).filter(i => i >= 0);
  const score = QUESTIONS.length - wrong.length;

  results.innerHTML = "";
  const box = document.createElement("div");
  box.className = "score";
  box.innerHTML = '<div class="big">' + score + " / " + QUESTIONS.length + "</div>";
  const msg = document.createElement("p");
  msg.textContent = wrong.length === 0
    ? "Perfect score. Nice work."
    : "Review the " + (wrong.length === 1 ? "question" : "questions") + " you missed below. Ask your supervisor if anything is unclear.";
  box.appendChild(msg);
  results.appendChild(box);

  if (wrong.length === 0) {
    const ok = document.createElement("div");
    ok.className = "review allgood";
    ok.textContent = "You answered every question correctly.";
    results.appendChild(ok);
  } else {
    wrong.forEach(i => results.appendChild(review(i, picks[i])));
  }

  const again = document.createElement("button");
  again.type = "button";
  again.className = "secondary";
  again.textContent = "Retake quiz";
  again.addEventListener("click", () => {
    build();
    results.hidden = true;
    form.hidden = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  results.appendChild(again);

  form.hidden = true;
  results.hidden = false;
  results.focus();
  window.scrollTo({ top: 0 });
});

build();
</script>
</body>
</html>
