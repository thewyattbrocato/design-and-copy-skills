<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #5b6370;
    --line: #d9d4c7;
    --accent: #b45309;
    --accent-ink: #ffffff;
    --good: #166534;
    --good-bg: #e7f5ec;
    --bad: #991b1b;
    --bad-bg: #fdecec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
  header { border-left: 8px solid var(--accent); padding-left: 14px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .q {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin: 0 0 16px;
  }
  .q legend { font-weight: 700; padding: 0 6px; margin-left: -6px; }
  .q.wrong { border-color: var(--bad); }
  .q.right { border-color: var(--good); }
  .opt {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .opt:hover { background: #faf7f0; }
  .opt input { margin-top: 4px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
  .opt:focus-within { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  .locked .opt { cursor: default; }
  .locked .opt:hover { background: transparent; }
  .opt.correct { background: var(--good-bg); border-color: var(--good); }
  .opt.incorrect { background: var(--bad-bg); border-color: var(--bad); }
  .tag { font-weight: 700; font-size: 0.85rem; }
  .feedback { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; }
  .feedback.bad { background: var(--bad-bg); color: var(--bad); }
  .feedback.good { background: var(--good-bg); color: var(--good); }
  .feedback.bad span { color: var(--ink); }
  button {
    font: inherit;
    font-weight: 700;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 8px;
    padding: 12px 24px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  button.secondary { background: transparent; color: var(--ink); border: 2px solid var(--ink); margin-left: 8px; }
  #msg { color: var(--bad); font-weight: 600; margin: 0 0 12px; min-height: 1.5em; }
  #result {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  #result h2 { margin: 0 0 4px; font-size: 1.4rem; }
  #result p { margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Forklift Safety Check</h1>
    <p>5 questions for new hires. Choose one answer for each, then submit.</p>
  </header>

  <div id="result" role="status" tabindex="-1" hidden></div>

  <form id="quiz" novalidate></form>

  <p id="msg" role="alert"></p>
  <div>
    <button type="submit" form="quiz" id="submit">Submit answers</button>
    <button type="button" class="secondary" id="retry" hidden>Try again</button>
  </div>
</div>

<script>
(function () {
  var QUESTIONS = [
    {
      q: "Where do you find your forklift's maximum safe load?",
      opts: [
        "On the capacity data plate on the truck",
        "Ask a coworker how much they usually carry",
        "It's the same for every forklift",
        "Whatever the forks can physically lift"
      ],
      a: 0,
      why: "The capacity plate lists the rated load for that specific truck and attachment. Never exceed it."
    },
    {
      q: "A pedestrian is walking across your path. What do you do?",
      opts: [
        "Sound the horn and keep going so they hurry up",
        "Stop, make eye contact, and wait until they signal or clear the path",
        "Speed up to pass in front of them",
        "Flash the lights and steer around them"
      ],
      a: 1,
      why: "Pedestrians always have the right of way. Stop and be sure they have seen you before moving."
    },
    {
      q: "How should you drive when carrying a load?",
      opts: [
        "As fast as the floor allows to save time",
        "Fast on straight aisles, slow only at corners",
        "At a slow, controlled speed, with the load low and tilted back",
        "With the forks raised for a better view"
      ],
      a: 2,
      why: "Travel within posted limits with forks 4 to 6 inches off the floor and the mast tilted back. Slow down at corners, wet floors and doorways."
    },
    {
      q: "You are finished and need to park the forklift. What is correct?",
      opts: [
        "Leave it in an aisle with the forks raised so it's ready",
        "Park in a designated area, lower forks flat to the floor, neutralize controls, set the brake and turn it off",
        "Park by an exit so it can be moved quickly",
        "Leave the engine running if you'll be back soon"
      ],
      a: 1,
      why: "Park only in designated areas, never blocking aisles, exits or fire equipment. Lower the forks fully, set the brake and shut off the truck."
    },
    {
      q: "A load blocks your view straight ahead. What should you do?",
      opts: [
        "Drive forward slowly and rely on the horn",
        "Lean out and look around the side while moving forward",
        "Travel in reverse, looking in the direction of travel",
        "Raise the load higher to see underneath it"
      ],
      a: 2,
      why: "If the load blocks your view, drive in reverse while looking where you are going (unless going up a ramp, where the load should face uphill). Use a spotter if needed."
    }
  ];

  var form = document.getElementById("quiz");
  var msg = document.getElementById("msg");
  var result = document.getElementById("result");
  var submitBtn = document.getElementById("submit");
  var retryBtn = document.getElementById("retry");
  var LETTERS = ["A", "B", "C", "D"];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function build() {
    form.innerHTML = "";
    form.classList.remove("locked");
    QUESTIONS.forEach(function (item, i) {
      var fs = el("fieldset", "q");
      fs.id = "q" + i;
      fs.appendChild(el("legend", null, (i + 1) + ". " + item.q));
      item.opts.forEach(function (text, j) {
        var label = el("label", "opt");
        var input = document.createElement("input");
        input.type = "radio";
        input.name = "q" + i;
        input.value = j;
        label.appendChild(input);
        var span = el("span");
        span.appendChild(document.createTextNode(LETTERS[j] + ". " + text));
        label.appendChild(span);
        fs.appendChild(label);
      });
      form.appendChild(fs);
    });
  }

  function selected(i) {
    var c = form.querySelector('input[name="q' + i + '"]:checked');
    return c ? parseInt(c.value, 10) : -1;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var missing = [];
    QUESTIONS.forEach(function (_, i) { if (selected(i) < 0) missing.push(i + 1); });
    if (missing.length) {
      msg.textContent = "Please answer question" + (missing.length > 1 ? "s " : " ") + missing.join(", ") + " before submitting.";
      document.getElementById("q" + (missing[0] - 1)).querySelector("input").focus();
      return;
    }
    msg.textContent = "";
    var score = 0;
    QUESTIONS.forEach(function (item, i) {
      var pick = selected(i);
      var fs = document.getElementById("q" + i);
      var labels = fs.querySelectorAll(".opt");
      var ok = pick === item.a;
      if (ok) score++;
      fs.classList.add(ok ? "right" : "wrong");
      labels[item.a].classList.add("correct");
      labels[item.a].querySelector("span").appendChild(el("strong", "tag", " (correct answer)"));
      if (!ok) {
        labels[pick].classList.add("incorrect");
        labels[pick].querySelector("span").appendChild(el("strong", "tag", " (your answer)"));
      }
      var fb = el("div", "feedback " + (ok ? "good" : "bad"));
      if (ok) {
        fb.appendChild(el("strong", null, "Correct. "));
      } else {
        fb.appendChild(el("strong", null, "Incorrect. "));
        fb.appendChild(el("strong", null, "Right answer: " + LETTERS[item.a] + ". " + item.opts[item.a] + " "));
      }
      fb.appendChild(el("span", null, item.why));
      fs.appendChild(fb);
      fs.querySelectorAll("input").forEach(function (inp) { inp.disabled = true; });
    });
    form.classList.add("locked");

    var wrong = QUESTIONS.length - score;
    result.innerHTML = "";
    result.appendChild(el("h2", null, "Score: " + score + " / " + QUESTIONS.length));
    result.appendChild(el("p", null, wrong === 0
      ? "Perfect. You're ready to move on."
      : "You missed " + wrong + ". Review the corrections below, then try again. Ask your supervisor if anything is unclear."));
    result.hidden = false;
    submitBtn.hidden = true;
    retryBtn.hidden = false;
    result.focus();
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  retryBtn.addEventListener("click", function () {
    build();
    result.hidden = true;
    submitBtn.hidden = false;
    retryBtn.hidden = true;
    msg.textContent = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  build();
})();
</script>
</body>
</html>
