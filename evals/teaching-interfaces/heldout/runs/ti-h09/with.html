<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f4f2ec;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #5c5a53;
    --line: #d8d4c8;
    --accent: #b45309;
    --accent-text: #ffffff;
    --good: #166534;
    --good-bg: #e3f4e8;
    --bad: #9f1239;
    --bad-bg: #fde8ec;
    --focus: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513;
      --card: #201f1c;
      --text: #f1efe8;
      --muted: #b0ada2;
      --line: #3b3932;
      --accent: #f59e0b;
      --accent-text: #1a1200;
      --good: #86efac;
      --good-bg: #12301c;
      --bad: #fda4af;
      --bad-bg: #3a1620;
      --focus: #93c5fd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  header { border-left: 8px solid var(--accent); padding-left: 14px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.7rem; }
  header p { margin: 4px 0 0; color: var(--muted); }
  fieldset.q {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 0 0 16px;
    padding: 16px;
  }
  legend { padding: 0 6px; font-weight: 700; font-size: 1.05rem; }
  .num { color: var(--accent); }
  .topic { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px; margin-top: 8px;
    border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt input { margin-top: 4px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  fieldset.missing { border-color: var(--bad); }
  button {
    font: inherit; font-weight: 700;
    background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 8px; padding: 12px 24px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  button.secondary { background: transparent; color: var(--text); border: 2px solid var(--line); }
  #warn { color: var(--bad); font-weight: 600; margin: 0 0 12px; }
  #results { margin-top: 24px; }
  .score {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; margin-bottom: 14px;
  }
  .score strong { font-size: 2rem; display: block; }
  .item { border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; background: var(--bad-bg); border: 1px solid var(--bad); }
  .item h3 { margin: 0 0 8px; font-size: 1rem; }
  .item p { margin: 4px 0; }
  .wrong { color: var(--bad); font-weight: 600; }
  .right { color: var(--good); font-weight: 600; }
  .perfect { background: var(--good-bg); border: 1px solid var(--good); border-radius: 10px; padding: 14px 16px; color: var(--good); font-weight: 600; }
  .why { color: var(--muted); font-size: .95rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Forklift Safety Check</h1>
    <p>5 questions for new hires. Choose one answer for each, then submit.</p>
  </header>

  <form id="quiz" novalidate>
    <div id="questions"></div>
    <p id="warn" role="alert" hidden></p>
    <button type="submit">Submit answers</button>
  </form>

  <section id="results" aria-live="polite" tabindex="-1" hidden></section>
</main>

<script>
(function () {
  var QUESTIONS = [
    {
      topic: "Load limits",
      q: "Where do you find the maximum weight your forklift can safely lift?",
      options: [
        "On the pallet or the shipping label",
        "Ask the person who loaded the pallet",
        "On the capacity data plate attached to the truck",
        "It is the same for every forklift in the building"
      ],
      answer: 2,
      why: "Capacity depends on the specific truck and attachments, so always read its data plate. Never lift a load that exceeds it."
    },
    {
      topic: "Pedestrians",
      q: "A coworker on foot steps into your path while you are driving. What should you do?",
      options: [
        "Stop, and wait until they are clear and have seen you",
        "Honk and keep going so they move out of the way",
        "Steer around them at the same speed",
        "Flash your lights and speed up to pass quickly"
      ],
      answer: 0,
      why: "Pedestrians always have the right of way. Stop and make eye contact before moving again."
    },
    {
      topic: "Speed",
      q: "You are approaching a blind corner or an intersection. What is the correct action?",
      options: [
        "Keep your speed so traffic keeps flowing",
        "Speed up to clear the intersection quickly",
        "Coast through with the engine off",
        "Slow down, sound the horn, and look before you proceed"
      ],
      answer: 3,
      why: "Slow down and warn others at blind spots, doorways and intersections. Always stay within the posted speed limit."
    },
    {
      topic: "Parking",
      q: "When you park the forklift and leave it, what must you do?",
      options: [
        "Leave the forks raised so they are ready for the next load",
        "Lower the forks flat to the floor, set the brake, and turn the power off",
        "Park in the aisle with the engine running for a quick return",
        "Park next to a fire exit so it is easy to reach"
      ],
      answer: 1,
      why: "Forks down, controls neutral, parking brake set, and key out or power off. Never block aisles, exits or fire equipment."
    },
    {
      topic: "Driving with a load",
      q: "How should you carry a load while traveling?",
      options: [
        "Raised high so you can see over the pallet",
        "Level with your head for easy balance",
        "Low to the ground, with the mast tilted slightly back",
        "Tilted forward to keep the load from sliding backward"
      ],
      answer: 2,
      why: "Carry the load a few inches off the floor with the mast tilted back. This keeps the truck stable and the load secure."
    }
  ];

  var form = document.getElementById("quiz");
  var box = document.getElementById("questions");
  var warn = document.getElementById("warn");
  var results = document.getElementById("results");
  var LETTERS = ["A", "B", "C", "D"];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function build() {
    box.textContent = "";
    QUESTIONS.forEach(function (item, i) {
      var fs = el("fieldset", "q");
      fs.id = "q" + i;
      var lg = el("legend");
      var topic = el("span", "topic", item.topic);
      var title = el("span");
      var n = el("span", "num", (i + 1) + ". ");
      title.appendChild(n);
      title.appendChild(document.createTextNode(item.q));
      lg.appendChild(topic);
      lg.appendChild(title);
      fs.appendChild(lg);
      item.options.forEach(function (text, j) {
        var label = el("label", "opt");
        var input = document.createElement("input");
        input.type = "radio";
        input.name = "q" + i;
        input.value = j;
        label.appendChild(input);
        label.appendChild(el("span", null, text));
        fs.appendChild(label);
      });
      box.appendChild(fs);
    });
  }

  function selected(i) {
    var c = form.querySelector('input[name="q' + i + '"]:checked');
    return c ? Number(c.value) : -1;
  }

  form.addEventListener("change", function (e) {
    var fs = e.target.closest("fieldset");
    if (fs) fs.classList.remove("missing");
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var missing = [];
    QUESTIONS.forEach(function (_, i) {
      var fs = document.getElementById("q" + i);
      var none = selected(i) < 0;
      fs.classList.toggle("missing", none);
      if (none) missing.push(i);
    });
    if (missing.length) {
      warn.hidden = false;
      warn.textContent = missing.length === 1
        ? "Please answer question " + (missing[0] + 1) + " before submitting."
        : "Please answer all questions. Unanswered: " + missing.map(function (m) { return m + 1; }).join(", ") + ".";
      var first = document.querySelector("#q" + missing[0] + " input");
      if (first) first.focus();
      return;
    }
    warn.hidden = true;
    showResults();
  });

  function showResults() {
    var score = 0, wrong = [];
    QUESTIONS.forEach(function (item, i) {
      var pick = selected(i);
      if (pick === item.answer) score++;
      else wrong.push({ i: i, pick: pick });
    });

    results.textContent = "";
    var s = el("div", "score");
    s.appendChild(el("strong", null, "Score: " + score + " / " + QUESTIONS.length));
    s.appendChild(el("span", null,
      score === QUESTIONS.length ? "Great work. You got every question right." :
      score >= 4 ? "Almost there. Review the question you missed below." :
      "Please review the answers below and retake the check."));
    results.appendChild(s);

    if (!wrong.length) {
      results.appendChild(el("div", "perfect", "No missed questions. Stay safe out there."));
    } else {
      results.appendChild(el("h2", null, "Questions to review"));
      wrong.forEach(function (w) {
        var item = QUESTIONS[w.i];
        var card = el("div", "item");
        card.appendChild(el("h3", null, (w.i + 1) + ". " + item.q));
        var yours = el("p");
        yours.appendChild(el("span", "wrong", "Your answer: "));
        yours.appendChild(document.createTextNode(LETTERS[w.pick] + ". " + item.options[w.pick]));
        var right = el("p");
        right.appendChild(el("span", "right", "Correct answer: "));
        right.appendChild(document.createTextNode(LETTERS[item.answer] + ". " + item.options[item.answer]));
        card.appendChild(yours);
        card.appendChild(right);
        card.appendChild(el("p", "why", item.why));
        results.appendChild(card);
      });
    }

    var again = el("button", "secondary", "Retake the check");
    again.type = "button";
    again.addEventListener("click", function () {
      form.reset();
      build();
      results.hidden = true;
      form.hidden = false;
      window.scrollTo(0, 0);
    });
    results.appendChild(again);

    form.hidden = true;
    results.hidden = false;
    results.focus();
    window.scrollTo(0, 0);
  }

  build();
})();
</script>
</body>
</html>
