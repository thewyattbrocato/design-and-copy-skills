<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f5f4f0;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #5c5c57;
    --border: #d6d4cc;
    --accent: #b45309;
    --accent-text: #ffffff;
    --good: #166534;
    --good-bg: #e7f5ec;
    --bad: #b91c1c;
    --bad-bg: #fcebea;
    --focus: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --card: #211f1c;
      --text: #f1efe8;
      --muted: #b3b0a6;
      --border: #3d3a34;
      --accent: #f59e0b;
      --accent-text: #1a1203;
      --good: #6ee7a0;
      --good-bg: #12301e;
      --bad: #fca5a5;
      --bad-bg: #3a1716;
      --focus: #93c5fd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  header { border-left: 8px solid var(--accent); padding-left: 14px; margin-bottom: 24px; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  header p { margin: 0; color: var(--muted); }
  fieldset {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    margin: 0 0 16px;
    padding: 16px 18px 12px;
  }
  fieldset.correct { border-color: var(--good); }
  fieldset.wrong { border-color: var(--bad); }
  legend { font-weight: 700; padding: 0 6px; font-size: 1.05rem; max-width: 100%; }
  .qnum { color: var(--accent); }
  label {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    min-height: 44px;
  }
  label:hover { border-color: var(--accent); }
  input[type=radio] { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .locked label { cursor: default; }
  .locked label:hover { border-color: var(--border); }
  label.is-right { background: var(--good-bg); border-color: var(--good); }
  label.is-wrong { background: var(--bad-bg); border-color: var(--bad); }
  .tag { font-weight: 700; font-size: .85rem; margin-left: auto; padding-left: 8px; white-space: nowrap; }
  label.is-right .tag { color: var(--good); }
  label.is-wrong .tag { color: var(--bad); }
  .feedback { margin: 8px 0 4px; font-size: .95rem; }
  .feedback.ok { color: var(--good); }
  .feedback.no { color: var(--bad); }
  .why { color: var(--muted); }
  button {
    font: inherit;
    font-weight: 700;
    background: var(--accent);
    color: var(--accent-text);
    border: 0;
    border-radius: 8px;
    padding: 12px 28px;
    min-height: 44px;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 2px solid var(--border); }
  #warn { color: var(--bad); font-weight: 600; margin: 10px 0 0; min-height: 1.5em; }
  #result {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  #result h2 { margin: 0 0 4px; font-size: 1.4rem; }
  #result p { margin: 4px 0; }
  .score { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
  .hidden { display: none; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Forklift Safety Check</h1>
    <p>5 questions for new hires. Choose one answer for each, then submit.</p>
  </header>

  <div id="result" class="hidden" role="status" tabindex="-1"></div>

  <form id="quiz" novalidate></form>

  <div class="actions">
    <button type="submit" id="submit" form="quiz">Submit answers</button>
    <button type="button" id="retry" class="secondary hidden">Try again</button>
  </div>
  <p id="warn" role="alert"></p>
</main>

<script>
(function () {
  var QUESTIONS = [
    {
      q: "How do you find out the most weight your forklift can safely lift?",
      options: [
        "Ask a coworker what they usually carry",
        "Read the capacity data plate on the truck",
        "If the forks lift it, it is within the limit",
        "Use the same limit as the last truck you drove"
      ],
      answer: 1,
      why: "Every truck has a data plate with its rated capacity. Attachments and a raised or off-center load can change it, so never guess."
    },
    {
      q: "A pedestrian is walking toward your path in the aisle. What should you do?",
      options: [
        "Sound the horn and keep going so they know to move",
        "Speed up to get past before they reach you",
        "Stop, make eye contact, and let them go by or wave you on",
        "Steer around them as close as you can"
      ],
      answer: 2,
      why: "Pedestrians have the right of way. Stop and make sure they have seen you before you move."
    },
    {
      q: "What is the right way to travel when you are carrying a load?",
      options: [
        "Forks a few inches off the floor, load tilted back, at a slow controlled speed",
        "Forks raised high for a better view under the load",
        "Full speed on straight aisles, slowing only at corners",
        "Forks level with your head so the load clears obstacles"
      ],
      answer: 0,
      why: "Keep the load low and tilted back for stability. A raised load makes the truck far more likely to tip."
    },
    {
      q: "You are approaching a blind corner or a doorway. What should you do?",
      options: [
        "Maintain your speed so you clear the corner quickly",
        "Turn off the horn so you do not startle anyone",
        "Slow down, sound the horn, and look before you proceed",
        "Cut the corner wide to save time"
      ],
      answer: 2,
      why: "Slow down and warn others at blind spots, intersections and doorways. You may not be able to see anyone coming."
    },
    {
      q: "You are done and are leaving the forklift parked. What must you do?",
      options: [
        "Leave the forks slightly raised so they are easy to restart with",
        "Lower the forks fully to the floor, set the parking brake, and turn the truck off",
        "Park in the aisle with the key in, as you will be right back",
        "Leave the engine running so it stays warm"
      ],
      answer: 1,
      why: "Forks go all the way down, the brake is set, and the truck is off with the key removed if required. Park in a designated area, never blocking aisles, exits or fire equipment."
    }
  ];

  var form = document.getElementById("quiz");
  var submitBtn = document.getElementById("submit");
  var retryBtn = document.getElementById("retry");
  var warn = document.getElementById("warn");
  var result = document.getElementById("result");
  var letters = ["A", "B", "C", "D"];

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function build() {
    var html = "";
    QUESTIONS.forEach(function (item, i) {
      html += '<fieldset id="f' + i + '"><legend><span class="qnum">Q' + (i + 1) + '.</span> ' + esc(item.q) + '</legend>';
      item.options.forEach(function (opt, j) {
        html += '<label><input type="radio" name="q' + i + '" value="' + j + '">' +
                '<span><strong>' + letters[j] + '.</strong> ' + esc(opt) + '</span></label>';
      });
      html += '<div class="feedback hidden" aria-live="polite"></div></fieldset>';
    });
    form.innerHTML = html;
    form.classList.remove("locked");
    result.classList.add("hidden");
    result.innerHTML = "";
    warn.textContent = "";
    submitBtn.classList.remove("hidden");
    retryBtn.classList.add("hidden");
  }

  function grade(e) {
    e.preventDefault();
    var picks = [];
    var firstMissing = -1;
    QUESTIONS.forEach(function (item, i) {
      var checked = form.querySelector('input[name="q' + i + '"]:checked');
      picks.push(checked ? Number(checked.value) : null);
      if (!checked && firstMissing < 0) firstMissing = i;
    });

    if (firstMissing >= 0) {
      var missing = picks.filter(function (p) { return p === null; }).length;
      warn.textContent = "Please answer all questions (" + missing + " left).";
      form.querySelector('input[name="q' + firstMissing + '"]').focus();
      return;
    }
    warn.textContent = "";

    var score = 0;
    var wrongList = [];
    QUESTIONS.forEach(function (item, i) {
      var fs = document.getElementById("f" + i);
      var labels = fs.querySelectorAll("label");
      var fb = fs.querySelector(".feedback");
      var ok = picks[i] === item.answer;
      if (ok) score++; else wrongList.push(i + 1);

      fs.classList.add(ok ? "correct" : "wrong");
      labels.forEach(function (lab, j) {
        lab.querySelector("input").disabled = true;
        if (j === item.answer) {
          lab.classList.add("is-right");
          lab.insertAdjacentHTML("beforeend", '<span class="tag">' + (ok ? "✓ Your answer" : "✓ Correct answer") + '</span>');
        } else if (j === picks[i]) {
          lab.classList.add("is-wrong");
          lab.insertAdjacentHTML("beforeend", '<span class="tag">✗ Your answer</span>');
        }
      });
      fb.classList.remove("hidden");
      fb.classList.add(ok ? "ok" : "no");
      fb.innerHTML = (ok ? "<strong>Correct.</strong> " :
        "<strong>Incorrect.</strong> The right answer is " + letters[item.answer] + ". ") +
        '<span class="why">' + esc(item.why) + "</span>";
    });

    form.classList.add("locked");
    var msg = score === QUESTIONS.length
      ? "Perfect score. You are ready to go."
      : "Review the questions marked incorrect below (" + wrongList.map(function (n) { return "Q" + n; }).join(", ") +
        ") and talk to your supervisor if anything is unclear.";
    result.innerHTML = '<h2>Your result</h2><div class="score">' + score + " / " + QUESTIONS.length + "</div><p>" + esc(msg) + "</p>";
    result.classList.remove("hidden");
    result.focus();
    result.scrollIntoView({ behavior: "smooth", block: "start" });

    submitBtn.classList.add("hidden");
    retryBtn.classList.remove("hidden");
  }

  form.addEventListener("submit", grade);
  form.addEventListener("change", function () { warn.textContent = ""; });
  retryBtn.addEventListener("click", function () {
    build();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  build();
})();
</script>
</body>
</html>
