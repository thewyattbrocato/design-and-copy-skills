<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f4f2ec;
    --card: #ffffff;
    --ink: #1c1c1a;
    --muted: #5d5b54;
    --line: #d8d4c8;
    --accent: #b45309;
    --accent-ink: #ffffff;
    --good: #166534;
    --good-bg: #e7f4ea;
    --bad: #9f1d1d;
    --bad-bg: #fbeaea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171715;
      --bg: #171715;
      --card: #222220;
      --ink: #f1efe8;
      --muted: #b0ada2;
      --line: #3a3935;
      --accent: #f59e0b;
      --accent-ink: #1c1c1a;
      --good: #86d99a;
      --good-bg: #17301e;
      --bad: #f3a1a1;
      --bad-bg: #3a1c1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
  header { border-bottom: 6px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  header p { margin: 0; color: var(--muted); }
  fieldset {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 0 0 16px;
    padding: 16px 18px 12px;
  }
  legend { font-weight: 700; padding: 0 6px; margin-left: -6px; }
  .q-text { font-weight: 600; margin: 0 0 10px; }
  label {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  label:hover { border-color: var(--accent); }
  label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  input[type="radio"] { margin-top: 5px; accent-color: var(--accent); }
  button {
    font: inherit;
    font-weight: 700;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 8px;
    padding: 12px 26px;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button.secondary { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  #error { color: var(--bad); font-weight: 600; margin: 12px 0 0; min-height: 1.5em; }
  #results[hidden], #quiz[hidden] { display: none; }
  .score {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 8px solid var(--accent);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .score h2 { margin: 0; font-size: 2rem; }
  .score p { margin: 4px 0 0; color: var(--muted); }
  .review {
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 14px;
    border: 1px solid;
  }
  .review.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .review h3 { margin: 0 0 8px; font-size: 1rem; }
  .review p { margin: 4px 0; }
  .tag { font-weight: 700; }
  .your .tag { color: var(--bad); }
  .right .tag { color: var(--good); }
  .why { color: var(--muted); font-size: 0.95rem; margin-top: 8px; }
  .actions { margin-top: 20px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Forklift Safety Check</h1>
    <p>New hire quiz &middot; 5 questions &middot; choose one answer for each</p>
  </header>

  <form id="quiz" novalidate></form>

  <section id="results" hidden aria-live="polite" tabindex="-1"></section>
</main>

<script>
(function () {
  var questions = [
    {
      q: "What is the maximum load you may lift with your forklift?",
      options: [
        "Whatever the load looks like it can handle, if you go slowly",
        "The rated capacity shown on the truck's data plate",
        "10% over the rated capacity, because of the safety margin",
        "Any load, as long as the forks are fully under it"
      ],
      answer: 1,
      why: "The data plate lists the rated capacity. Never exceed it, and remember that attachments and a load center farther out can lower it."
    },
    {
      q: "A pedestrian is crossing your path at an aisle intersection. What do you do?",
      options: [
        "Sound the horn and keep going, since they know you are coming",
        "Speed up and pass before they reach you",
        "Stop, make eye contact, and let them cross first",
        "Flash the lights and drive around them"
      ],
      answer: 2,
      why: "Pedestrians have the right of way. Stop, confirm they see you, and proceed only when they are clear."
    },
    {
      q: "How fast should you drive in a busy area with pedestrians and blind corners?",
      options: [
        "At the posted limit, slowing at corners, doorways, and wet floors",
        "As fast as the truck will go, to clear the area quickly",
        "Full speed on straight stretches and slow only when you see someone",
        "Speed does not matter if the horn works"
      ],
      answer: 0,
      why: "Obey posted limits and slow down at corners, doorways, intersections, and wet or uneven floors. Keep a speed at which you can stop safely."
    },
    {
      q: "You are traveling with a load. Where should the forks be?",
      options: [
        "Raised high so you clear any obstacles on the floor",
        "At eye level so you can see the load",
        "Raised just high enough to see under the load, with the mast tilted back",
        "Low, about 4 to 6 inches off the floor, with the mast tilted back slightly"
      ],
      answer: 3,
      why: "Carry the load low (about 4 to 6 inches) and tilted back. A high load makes the truck unstable and can cause a tip-over."
    },
    {
      q: "You are done and parking the forklift. What is the correct way to do it?",
      options: [
        "Leave the forks slightly raised so they are out of the way of the next driver",
        "Park in an aisle for quick access, with the engine running",
        "Stop on a slope so gravity helps hold the truck",
        "Lower the forks flat to the floor, neutralize the controls, set the parking brake, and turn it off"
      ],
      answer: 3,
      why: "Forks flat on the floor, controls in neutral, parking brake set, power off. Park in a designated area, not blocking aisles, exits, or equipment."
    }
  ];

  var form = document.getElementById("quiz");
  var results = document.getElementById("results");
  var letters = ["A", "B", "C", "D"];

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function build() {
    form.textContent = "";
    questions.forEach(function (item, i) {
      var fs = el("fieldset");
      fs.appendChild(el("legend", null, "Question " + (i + 1) + " of " + questions.length));
      fs.appendChild(el("p", { "class": "q-text" }, item.q));
      item.options.forEach(function (opt, j) {
        var label = el("label");
        var input = el("input", { type: "radio", name: "q" + i, value: String(j) });
        label.appendChild(input);
        label.appendChild(el("span", null, letters[j] + ". " + opt));
        fs.appendChild(label);
      });
      form.appendChild(fs);
    });
    var submit = el("button", { type: "submit" }, "Submit answers");
    form.appendChild(submit);
    form.appendChild(el("p", { id: "error", role: "alert" }));
  }

  function selected(i) {
    var checked = form.querySelector('input[name="q' + i + '"]:checked');
    return checked ? Number(checked.value) : null;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var picks = questions.map(function (_, i) { return selected(i); });
    var firstMissing = picks.indexOf(null);
    var error = document.getElementById("error");
    if (firstMissing !== -1) {
      var missing = picks.filter(function (p) { return p === null; }).length;
      error.textContent = "Please answer all questions (" + missing + " left).";
      form.querySelector('input[name="q' + firstMissing + '"]').focus();
      return;
    }
    showResults(picks);
  });

  function showResults(picks) {
    var score = 0;
    questions.forEach(function (item, i) { if (picks[i] === item.answer) score++; });

    results.textContent = "";
    var box = el("div", { "class": "score" });
    box.appendChild(el("h2", null, "Score: " + score + " / " + questions.length));
    var msg = score === questions.length
      ? "Perfect. You got every question right."
      : "Review the " + (questions.length - score) + " missed question" +
        (questions.length - score === 1 ? "" : "s") + " below before operating a forklift.";
    box.appendChild(el("p", null, msg));
    results.appendChild(box);

    questions.forEach(function (item, i) {
      if (picks[i] === item.answer) return;
      var r = el("div", { "class": "review wrong" });
      r.appendChild(el("h3", null, "Question " + (i + 1) + ": " + item.q));
      var yours = el("p", { "class": "your" });
      yours.appendChild(el("span", { "class": "tag" }, "Your answer: "));
      yours.appendChild(document.createTextNode(letters[picks[i]] + ". " + item.options[picks[i]]));
      var right = el("p", { "class": "right" });
      right.appendChild(el("span", { "class": "tag" }, "Correct answer: "));
      right.appendChild(document.createTextNode(letters[item.answer] + ". " + item.options[item.answer]));
      r.appendChild(yours);
      r.appendChild(right);
      r.appendChild(el("p", { "class": "why" }, item.why));
      results.appendChild(r);
    });

    var actions = el("div", { "class": "actions" });
    var retry = el("button", { type: "button", "class": "secondary" }, "Retake quiz");
    retry.addEventListener("click", function () {
      results.hidden = true;
      form.hidden = false;
      build();
      window.scrollTo(0, 0);
      form.querySelector("input").focus();
    });
    actions.appendChild(retry);
    results.appendChild(actions);

    form.hidden = true;
    results.hidden = false;
    window.scrollTo(0, 0);
    results.focus();
  }

  build();
})();
</script>
</body>
</html>
