<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forklift Safety Check</title>
<style>
  :root {
    --bg: #f5f4f0; --card: #ffffff; --ink: #1c1c1a; --muted: #5d5d57;
    --line: #d8d6cf; --accent: #b45309; --accent-ink: #ffffff;
    --good: #166534; --good-bg: #e6f4ea; --bad: #9f1239; --bad-bg: #fdecef;
    --focus: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #212120; --ink: #f1f0ec; --muted: #a9a8a0;
      --line: #3a3a37; --accent: #f59e0b; --accent-ink: #1c1c1a;
      --good: #86efac; --good-bg: #14301f; --bad: #fda4af; --bad-bg: #3a1620;
      --focus: #93c5fd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  fieldset {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    margin: 0 0 16px; padding: 16px 18px 12px;
  }
  legend { font-weight: 650; padding: 0 6px; margin-left: -6px; }
  .qnum { color: var(--accent); }
  label {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px; margin: 6px 0; border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer;
  }
  label:hover { border-color: var(--accent); }
  label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  input[type=radio] { margin-top: 4px; accent-color: var(--accent); flex: none; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 650; cursor: pointer; border-radius: 8px;
    padding: 12px 22px; border: 0; background: var(--accent); color: var(--accent-ink);
  }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .error { color: var(--bad); font-weight: 600; margin: 12px 0 0; min-height: 1.5em; }
  #results { display: none; }
  .score {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-bottom: 16px; text-align: center;
  }
  .score .big { font-size: 2.6rem; font-weight: 750; line-height: 1.1; }
  .miss {
    background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--bad);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 14px;
  }
  .miss h3 { margin: 0 0 8px; font-size: 1rem; }
  .row { padding: 8px 10px; border-radius: 6px; margin: 6px 0; }
  .row.wrong { background: var(--bad-bg); color: var(--bad); }
  .row.right { background: var(--good-bg); color: var(--good); }
  .row b { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  .perfect { background: var(--good-bg); color: var(--good); padding: 14px 18px; border-radius: 10px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Forklift Safety Check</h1>
  <p class="sub">5 questions for new hires. Pick one answer for each, then submit.</p>

  <form id="quiz" novalidate>
    <div id="questions"></div>
    <button type="submit">Submit answers</button>
    <p class="error" id="error" role="alert"></p>
  </form>

  <section id="results" aria-live="polite" tabindex="-1">
    <div class="score">
      <div class="big" id="scoreText"></div>
      <div id="scoreMsg"></div>
    </div>
    <div id="missed"></div>
    <button type="button" class="secondary" id="retry">Retake quiz</button>
  </section>
</main>

<script>
const QUESTIONS = [
  {
    q: "Where do you find the maximum load a forklift can safely lift?",
    options: [
      "On the data plate (capacity plate) on the truck",
      "On the shipping label of the load",
      "It is the same for every forklift",
      "Ask a coworker what they usually lift"
    ],
    answer: 0
  },
  {
    q: "A pedestrian steps into your travel path. What should you do?",
    options: [
      "Sound the horn and keep going so you don't lose time",
      "Stop and wait until they are clear and aware of you",
      "Speed up to get past them quickly",
      "Steer around them as close as you can"
    ],
    answer: 1
  },
  {
    q: "You are approaching a blind corner in the aisle. What is correct?",
    options: [
      "Keep your speed and rely on others to get out of the way",
      "Slow down, sound the horn, and look in the direction you are travelling",
      "Take the corner fast to clear the intersection sooner",
      "Turn off the horn so you don't startle people"
    ],
    answer: 1
  },
  {
    q: "When carrying a load, how should the forks be positioned for travel?",
    options: [
      "Raised high so the load clears obstacles",
      "Level with your eyes for better visibility",
      "Low, about 4–6 inches off the floor, with the mast tilted back",
      "Anywhere, as long as the load is wrapped"
    ],
    answer: 2
  },
  {
    q: "You are finished and leaving the forklift parked. What must you do?",
    options: [
      "Leave the forks slightly raised so they're ready for the next person",
      "Park in the aisle, since it's only for a minute",
      "Lower forks fully to the floor, neutralize controls, set the parking brake, and turn it off",
      "Leave the engine running so it doesn't need restarting"
    ],
    answer: 2
  }
];

const form = document.getElementById("quiz");
const qBox = document.getElementById("questions");
const errBox = document.getElementById("error");
const results = document.getElementById("results");

function build() {
  qBox.innerHTML = "";
  QUESTIONS.forEach((item, i) => {
    const fs = document.createElement("fieldset");
    const lg = document.createElement("legend");
    const num = document.createElement("span");
    num.className = "qnum";
    num.textContent = (i + 1) + ". ";
    lg.append(num, item.q);
    fs.appendChild(lg);
    item.options.forEach((opt, j) => {
      const lab = document.createElement("label");
      const inp = document.createElement("input");
      inp.type = "radio"; inp.name = "q" + i; inp.value = j;
      const span = document.createElement("span");
      span.textContent = opt;
      lab.append(inp, span);
      fs.appendChild(lab);
    });
    qBox.appendChild(fs);
  });
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const picks = QUESTIONS.map((_, i) => {
    const c = form.querySelector('input[name="q' + i + '"]:checked');
    return c ? Number(c.value) : null;
  });
  const first = picks.indexOf(null);
  if (first !== -1) {
    const n = picks.filter(p => p === null).length;
    errBox.textContent = n === 1
      ? "Question " + (first + 1) + " still needs an answer."
      : n + " questions still need an answer (first: question " + (first + 1) + ").";
    qBox.children[first].querySelector("input").focus();
    return;
  }
  errBox.textContent = "";
  showResults(picks);
});

function showResults(picks) {
  let score = 0;
  const missed = document.getElementById("missed");
  missed.innerHTML = "";

  QUESTIONS.forEach((item, i) => {
    if (picks[i] === item.answer) { score++; return; }
    const box = document.createElement("div");
    box.className = "miss";
    const h = document.createElement("h3");
    h.textContent = (i + 1) + ". " + item.q;
    const wrong = document.createElement("div");
    wrong.className = "row wrong";
    const wl = document.createElement("b"); wl.textContent = "Your answer";
    wrong.append(wl, item.options[picks[i]]);
    const right = document.createElement("div");
    right.className = "row right";
    const rl = document.createElement("b"); rl.textContent = "Correct answer";
    right.append(rl, item.options[item.answer]);
    box.append(h, wrong, right);
    missed.appendChild(box);
  });

  document.getElementById("scoreText").textContent = score + " / " + QUESTIONS.length;
  document.getElementById("scoreMsg").textContent = score === QUESTIONS.length
    ? "Perfect score."
    : "Review the " + (QUESTIONS.length - score) + " missed question" + (QUESTIONS.length - score > 1 ? "s" : "") + " below.";
  if (score === QUESTIONS.length) {
    const p = document.createElement("div");
    p.className = "perfect";
    p.textContent = "You got every question right. Nice work.";
    missed.appendChild(p);
  }

  form.style.display = "none";
  results.style.display = "block";
  results.focus();
  window.scrollTo(0, 0);
}

document.getElementById("retry").addEventListener("click", () => {
  results.style.display = "none";
  form.style.display = "block";
  build();
  window.scrollTo(0, 0);
});

build();
</script>
</body>
</html>
