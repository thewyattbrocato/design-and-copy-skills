<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Kilnbook</title>
<style>
  :root{
    --bg:#f6f2ec; --card:#fffdf9; --ink:#2a2420; --muted:#6b5f56; --line:#ddd2c5;
    --accent:#a8472a; --accent-ink:#fff; --soft:#f3e4dc; --ok:#2f6b4a; --okbg:#e4f1e9;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1c1816; --card:#262120; --ink:#f1e9e0; --muted:#b2a499; --line:#40372f;
      --accent:#e0805f; --accent-ink:#1c1816; --soft:#3a2a24; --ok:#8fd0a9; --okbg:#22332a;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;
    max-width:760px;margin:0 auto;padding:18px 20px}
  .brand{font-weight:700;letter-spacing:.2px}
  .skip{color:var(--muted);font-size:14px}
  main{max-width:760px;margin:0 auto;padding:8px 20px 56px}
  h1{font-size:clamp(26px,5vw,34px);line-height:1.15;margin:12px 0 8px}
  .lede{color:var(--muted);margin:0 0 28px;max-width:56ch}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600}
  fieldset{border:0;padding:0;margin:0 0 28px}
  legend{padding:0}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.choices{grid-template-columns:1fr}}
  .opt{position:relative}
  .opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;width:100%;height:100%}
  .opt .box{display:block;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px;height:100%}
  .opt input:checked + .box{border-color:var(--accent);background:var(--soft)}
  .opt input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
  .box strong{display:block;font-size:18px;margin-bottom:4px}
  .box span{display:block;color:var(--muted);font-size:15px}
  .box em{display:block;font-style:normal;font-size:14px;margin-top:10px}
  .step[hidden]{display:none}
  .sample{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);
    border:1px dashed var(--muted);border-radius:99px;padding:1px 9px;margin-left:8px;
    text-transform:none;letter-spacing:0;vertical-align:1px}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .slot{position:relative}
  .slot input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
  .slot .box{padding:12px 14px}
  .slot .box strong{font-size:15px;margin:0}
  .slot .box span{font-size:14px}
  .actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 20px;
    background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .hint{color:var(--muted);font-size:14px}
  .done{background:var(--okbg);color:var(--ink);border-left:5px solid var(--ok);
    border-radius:10px;padding:18px 20px}
  .done h2{color:var(--ok);margin-bottom:6px}
  .done p{margin:4px 0}
  a{color:var(--accent)}
  .next{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="brand">Kilnbook</div>
  <a class="skip" href="#dashboard" id="skip">Skip, go to my dashboard</a>
</header>

<main>
  <h1>Book your first session at Riverbend Clay Studio</h1>
  <p class="lede">Two things get booked here. Pick one, choose a time, and it's held for you. It takes about a minute.</p>

  <div id="flow">
    <fieldset>
      <legend><h2>1. What do you want to do?</h2></legend>
      <div class="choices">
        <label class="opt">
          <input type="radio" name="kind" value="wheel">
          <span class="box"><strong>Use a wheel</strong>
            <span>A pottery wheel station for a block of time, for shaping clay.</span>
            <em>Good if you want to start making something.</em></span>
        </label>
        <label class="opt">
          <input type="radio" name="kind" value="kiln">
          <span class="box"><strong>Reserve kiln space</strong>
            <span>A spot in a firing for pieces you've already made and dried.</span>
            <em>Good if you have work ready to fire.</em></span>
        </label>
      </div>
    </fieldset>

    <fieldset class="step" id="step2" hidden>
      <legend><h2>2. Pick a time <span class="sample">Sample times</span></h2></legend>
      <div class="slots" id="slots"></div>
    </fieldset>

    <div class="step" id="step3" hidden>
      <div class="actions">
        <button type="button" id="book" disabled>Book this time</button>
        <span class="hint" id="hint">Choose a time above.</span>
      </div>
    </div>
  </div>

  <div class="done" id="done" role="status" aria-live="polite" hidden></div>
  <div id="dashboard"></div>
</main>

<script>
  var data = {
    wheel: [
      {t:"Thu, 6:00–8:00 pm", d:"Wheel 3"},
      {t:"Fri, 10:00 am–12:00 pm", d:"Wheel 1"},
      {t:"Sat, 1:00–3:00 pm", d:"Wheel 5"},
      {t:"Sun, 9:00–11:00 am", d:"Wheel 2"}
    ],
    kiln: [
      {t:"Fri firing, load by 5:00 pm", d:"Bisque, shelf space"},
      {t:"Mon firing, load by noon", d:"Glaze, shelf space"},
      {t:"Wed firing, load by 5:00 pm", d:"Bisque, shelf space"}
    ]
  };
  var names = {wheel:"wheel session", kiln:"kiln slot"};
  var kind = null, picked = null;
  var $ = function(id){return document.getElementById(id)};

  function renderSlots(){
    var h = "";
    data[kind].forEach(function(s,i){
      h += '<label class="opt slot"><input type="radio" name="slot" value="'+i+'">' +
           '<span class="box"><strong>'+s.t+'</strong><span>'+s.d+'</span></span></label>';
    });
    $("slots").innerHTML = h;
    picked = null;
    $("book").disabled = true;
    $("hint").textContent = "Choose a time above.";
  }

  document.querySelectorAll('input[name=kind]').forEach(function(r){
    r.addEventListener("change", function(){
      kind = r.value;
      renderSlots();
      $("step2").hidden = false;
      $("step3").hidden = false;
    });
  });

  $("slots").addEventListener("change", function(e){
    if(e.target.name !== "slot") return;
    picked = data[kind][+e.target.value];
    $("book").disabled = false;
    $("hint").textContent = "You can review it before leaving this page.";
  });

  $("book").addEventListener("click", function(){
    $("flow").hidden = true;
    var d = $("done");
    d.hidden = false;
    d.innerHTML =
      '<h2>Booked</h2>' +
      '<p><strong>' + picked.t + '</strong> · ' + picked.d + '</p>' +
      '<p>Your ' + names[kind] + ' is held under your name. It now shows on your dashboard, which is where you\'ll book the next one.</p>' +
      '<div class="next"><a href="#dashboard">Go to my dashboard</a>' +
      '<a href="#" id="again">Book the other kind too</a></div>';
    $("again").addEventListener("click", function(e){
      e.preventDefault();
      d.hidden = true; $("flow").hidden = false;
      document.querySelectorAll('input[name=kind]').forEach(function(r){r.checked=false});
      $("step2").hidden = true; $("step3").hidden = true;
      kind = null; picked = null;
    });
    d.focus && d.setAttribute("tabindex","-1");
    d.focus();
  });
</script>
</body>
</html>
