<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelpie themes</title>
<style>
  /* Each theme only sets tokens. Components below read tokens and never mention a theme. */
  [data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f4f6f5;
    --text: #111412;
    --text-muted: #5a625d;
    --border: #dfe4e1;
    --border-w: 1px;
    --primary: #1f7a4d;
    --on-primary: #ffffff;
    --gain: #1f7a4d;
    --spend: #b3412f;
    --focus: #1f7a4d;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #121412;
    --surface: #1c211e;
    --text: #e8ece9;
    --text-muted: #a3ada6;
    --border: #2f3732;
    --border-w: 1px;
    --primary: #3fae78;
    --on-primary: #0b120d;
    --gain: #5fcf93;
    --spend: #ef7d66;
    --focus: #7fdcab;
  }

  [data-theme="high-contrast"] {
    color-scheme: dark;
    --bg: #000000;
    --surface: #000000;
    --text: #ffffff;
    --text-muted: #e0e0e0;
    --border: #ffffff;
    --border-w: 2px;
    --primary: #4ff0a0;
    --on-primary: #000000;
    --gain: #4ff0a0;
    --spend: #ff8a75;
    --focus: #ffd60a;
  }

  /* Page chrome uses fixed neutrals so it does not change with the themes below. */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 20px;
    background: #eceeed;
    color: #111412;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
  }

  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .intro { margin: 0 0 24px; color: #4d5550; font-size: 0.95rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
    align-items: start;
  }

  .panel figcaption {
    font-size: 0.85rem;
    font-weight: 600;
    color: #4d5550;
    margin-bottom: 8px;
  }

  /* Themed screen. Everything inside reads tokens only. */
  .screen {
    background: var(--bg);
    color: var(--text);
    border: var(--border-w) solid var(--border);
    border-radius: 16px;
    padding: 20px;
    font-family: inherit;
  }

  .screen-title {
    margin: 0 0 14px;
    font-size: 1rem;
    font-weight: 700;
  }

  .summary {
    background: var(--surface);
    border: var(--border-w) solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .eyebrow {
    margin: 0;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .balance {
    margin: 4px 0 6px;
    font-size: 2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .delta {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--gain);
  }

  .tx-heading {
    margin: 18px 0 4px;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .tx {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .tx li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: var(--border-w) solid var(--border);
  }

  .tx li:last-child { border-bottom: 0; }

  .tx-name { font-weight: 600; }

  .tx-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .amount {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .amount.pos { color: var(--gain); }
  .amount.neg { color: var(--spend); }

  .btn {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 12px 16px;
    font: inherit;
    font-weight: 600;
    color: var(--on-primary);
    background: var(--primary);
    border: var(--border-w) solid var(--primary);
    border-radius: 10px;
    cursor: pointer;
  }

  .btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<h1>Kelpie themes</h1>
<p class="intro">Light, dark, and high-contrast rendered from the same components. Each theme only changes the tokens defined at the top of the stylesheet.</p>

<div class="grid">

  <figure class="panel" style="margin:0">
    <figcaption>Light</figcaption>
    <div class="screen" data-theme="light">
      <h2 class="screen-title">Kelpie</h2>
      <div class="summary">
        <p class="eyebrow">Available balance</p>
        <p class="balance">$4,812.40</p>
        <p class="delta">+$612.15 this month</p>
      </div>
      <p class="tx-heading">Recent transactions</p>
      <ul class="tx">
        <li>
          <div><div class="tx-name">Paycheck</div><div class="tx-meta">Mar 1 · Income</div></div>
          <span class="amount pos">+$2,400.00</span>
        </li>
        <li>
          <div><div class="tx-name">Rent</div><div class="tx-meta">Mar 1 · Housing</div></div>
          <span class="amount neg">&minus;$1,450.00</span>
        </li>
        <li>
          <div><div class="tx-name">Groceries</div><div class="tx-meta">Mar 3 · Food</div></div>
          <span class="amount neg">&minus;$86.42</span>
        </li>
        <li>
          <div><div class="tx-name">Refund</div><div class="tx-meta">Mar 4 · Returns</div></div>
          <span class="amount pos">+$32.10</span>
        </li>
      </ul>
      <button class="btn" type="button">Add transaction</button>
    </div>
  </figure>

  <figure class="panel" style="margin:0">
    <figcaption>Dark</figcaption>
    <div class="screen" data-theme="dark">
      <h2 class="screen-title">Kelpie</h2>
      <div class="summary">
        <p class="eyebrow">Available balance</p>
        <p class="balance">$4,812.40</p>
        <p class="delta">+$612.15 this month</p>
      </div>
      <p class="tx-heading">Recent transactions</p>
      <ul class="tx">
        <li>
          <div><div class="tx-name">Paycheck</div><div class="tx-meta">Mar 1 · Income</div></div>
          <span class="amount pos">+$2,400.00</span>
        </li>
        <li>
          <div><div class="tx-name">Rent</div><div class="tx-meta">Mar 1 · Housing</div></div>
          <span class="amount neg">&minus;$1,450.00</span>
        </li>
        <li>
          <div><div class="tx-name">Groceries</div><div class="tx-meta">Mar 3 · Food</div></div>
          <span class="amount neg">&minus;$86.42</span>
        </li>
        <li>
          <div><div class="tx-name">Refund</div><div class="tx-meta">Mar 4 · Returns</div></div>
          <span class="amount pos">+$32.10</span>
        </li>
      </ul>
      <button class="btn" type="button">Add transaction</button>
    </div>
  </figure>

  <figure class="panel" style="margin:0">
    <figcaption>High contrast</figcaption>
    <div class="screen" data-theme="high-contrast">
      <h2 class="screen-title">Kelpie</h2>
      <div class="summary">
        <p class="eyebrow">Available balance</p>
        <p class="balance">$4,812.40</p>
        <p class="delta">+$612.15 this month</p>
      </div>
      <p class="tx-heading">Recent transactions</p>
      <ul class="tx">
        <li>
          <div><div class="tx-name">Paycheck</div><div class="tx-meta">Mar 1 · Income</div></div>
          <span class="amount pos">+$2,400.00</span>
        </li>
        <li>
          <div><div class="tx-name">Rent</div><div class="tx-meta">Mar 1 · Housing</div></div>
          <span class="amount neg">&minus;$1,450.00</span>
        </li>
        <li>
          <div><div class="tx-name">Groceries</div><div class="tx-meta">Mar 3 · Food</div></div>
          <span class="amount neg">&minus;$86.42</span>
        </li>
        <li>
          <div><div class="tx-name">Refund</div><div class="tx-meta">Mar 4 · Returns</div></div>
          <span class="amount pos">+$32.10</span>
        </li>
      </ul>
      <button class="btn" type="button">Add transaction</button>
    </div>
  </figure>

</div>

</body>
</html>
