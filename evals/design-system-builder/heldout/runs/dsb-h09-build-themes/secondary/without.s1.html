<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelpie themes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  /* Page chrome stays neutral. Only .theme panels read tokens. */
  body {
    margin: 0;
    padding: 24px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #6b6f6d;
    color: #ffffff;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
  .gallery figure { margin: 0; }
  .gallery figcaption { font-size: 13px; margin-bottom: 8px; }

  /* Tokens. Every theme defines the same set; components below only read these. */
  .theme {
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #141414;
    --muted: #5b6360;
    --border: #e1e4e2;
    --border-w: 1px;
    --primary: #1f7a4d;
    --on-primary: #ffffff;
    --gain: #1f7a4d;
    --spend: #b3412f;
    --focus: #1f7a4d;
    --radius: 12px;

    color-scheme: light;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    border-radius: 16px;
  }
  .theme-dark {
    --bg: #111513;
    --surface: #1a1f1c;
    --text: #e8ece9;
    --muted: #9aa39e;
    --border: #2c3530;
    --primary: #3aa270;
    --on-primary: #0c120e;
    --gain: #5fcf93;
    --spend: #f08a75;
    --focus: #8fe3b5;

    color-scheme: dark;
  }
  .theme-contrast {
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #000000;
    --muted: #2b2b2b;
    --border: #000000;
    --border-w: 2px;
    --primary: #0f5c39;
    --on-primary: #ffffff;
    --gain: #0f5c39;
    --spend: #8f2e20;
    --focus: #000000;

    color-scheme: light;
  }

  /* Components. No theme-specific selectors past this point. */
  .card {
    background: var(--surface);
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .label { font-size: 13px; color: var(--muted); margin: 0; }
  .balance {
    font-size: 32px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    margin: 4px 0 2px;
  }
  .delta {
    font-size: 14px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--gain);
    margin: 0 0 16px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: var(--primary);
    color: var(--on-primary);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .txns { list-style: none; margin: 16px 0 0; padding: 0; }
  .txns li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 12px 0;
    border-top: var(--border-w) solid var(--border);
    font-size: 15px;
  }
  .txns li:first-child { border-top: 0; }
  .txn-name small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .amt.gain { color: var(--gain); }
  .amt.spend { color: var(--spend); }
</style>
</head>
<body>
  <h1>Kelpie themes</h1>
  <div class="gallery">

    <figure>
      <figcaption>Light</figcaption>
      <div class="theme theme-light">
        <section class="card">
          <p class="label">Total balance</p>
          <p class="balance">$4,286.40</p>
          <p class="delta">+$312.00 this month</p>
          <button class="btn" type="button">Add transaction</button>
          <ul class="txns">
            <li><span class="txn-name">Paycheck<small>Mar 14</small></span><span class="amt gain">+$2,150.00</span></li>
            <li><span class="txn-name">Groceries<small>Mar 13</small></span><span class="amt spend">&minus;$84.12</span></li>
            <li><span class="txn-name">Coffee<small>Mar 12</small></span><span class="amt spend">&minus;$6.75</span></li>
            <li><span class="txn-name">Interest<small>Mar 1</small></span><span class="amt gain">+$3.18</span></li>
          </ul>
        </section>
      </div>
    </figure>

    <figure>
      <figcaption>Dark</figcaption>
      <div class="theme theme-dark">
        <section class="card">
          <p class="label">Total balance</p>
          <p class="balance">$4,286.40</p>
          <p class="delta">+$312.00 this month</p>
          <button class="btn" type="button">Add transaction</button>
          <ul class="txns">
            <li><span class="txn-name">Paycheck<small>Mar 14</small></span><span class="amt gain">+$2,150.00</span></li>
            <li><span class="txn-name">Groceries<small>Mar 13</small></span><span class="amt spend">&minus;$84.12</span></li>
            <li><span class="txn-name">Coffee<small>Mar 12</small></span><span class="amt spend">&minus;$6.75</span></li>
            <li><span class="txn-name">Interest<small>Mar 1</small></span><span class="amt gain">+$3.18</span></li>
          </ul>
        </section>
      </div>
    </figure>

    <figure>
      <figcaption>High contrast</figcaption>
      <div class="theme theme-contrast">
        <section class="card">
          <p class="label">Total balance</p>
          <p class="balance">$4,286.40</p>
          <p class="delta">+$312.00 this month</p>
          <button class="btn" type="button">Add transaction</button>
          <ul class="txns">
            <li><span class="txn-name">Paycheck<small>Mar 14</small></span><span class="amt gain">+$2,150.00</span></li>
            <li><span class="txn-name">Groceries<small>Mar 13</small></span><span class="amt spend">&minus;$84.12</span></li>
            <li><span class="txn-name">Coffee<small>Mar 12</small></span><span class="amt spend">&minus;$6.75</span></li>
            <li><span class="txn-name">Interest<small>Mar 1</small></span><span class="amt gain">+$3.18</span></li>
          </ul>
        </section>
      </div>
    </figure>

  </div>
</body>
</html>
