<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Lantern Sessions — The Harbour Quartet</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#07142b;
    color:#f4e9d0;
    font-family:Georgia,"Times New Roman",serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .poster{
    position:relative;
    width:100%;
    max-width:1180px;
    min-height:740px;
    background:
      radial-gradient(circle at 78% 38%, rgba(88,170,255,.35) 0, rgba(88,170,255,.12) 22%, transparent 45%),
      linear-gradient(160deg,#0c2347 0%,#08172f 55%,#050d1e 100%);
    border:2px solid #e0a96d;
    outline:1px solid rgba(224,169,109,.5);
    outline-offset:-12px;
    display:grid;
    grid-template-columns:1.25fr .75fr;
    gap:24px;
    padding:48px 56px;
    overflow:hidden;
  }
  .left{display:flex;flex-direction:column;justify-content:space-between;z-index:1}
  .kicker{
    font-family:"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.5em;
    text-transform:uppercase;
    font-size:14px;
    color:#e0a96d;
  }
  h1{
    font-weight:400;
    line-height:.88;
    text-transform:uppercase;
    margin-top:18px;
  }
  h1 .blue{
    display:block;
    font-size:132px;
    letter-spacing:-.02em;
    color:#7cc0ff;
    text-shadow:0 0 28px rgba(124,192,255,.55);
  }
  h1 .lantern{
    display:block;
    font-size:132px;
    letter-spacing:-.02em;
    font-style:italic;
    color:#f4e9d0;
  }
  h1 .sessions{
    display:block;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:40px;
    letter-spacing:.42em;
    margin-top:18px;
    color:#e0a96d;
  }
  .band{margin-top:28px}
  .band small{
    display:block;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:#9fb6d6;
    margin-bottom:6px;
  }
  .band strong{font-size:44px;font-weight:400;font-style:italic;color:#fff}
  .info{
    border-top:1px solid rgba(224,169,109,.6);
    margin-top:28px;
    padding-top:20px;
    display:grid;
    grid-template-columns:repeat(3,auto);
    gap:32px;
    justify-content:start;
  }
  .info div{font-size:22px;line-height:1.3}
  .info span{
    display:block;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:#e0a96d;
    margin-bottom:6px;
  }
  .right{display:flex;align-items:center;justify-content:center;z-index:1}
  .lantern-art{width:100%;max-width:340px;height:auto;filter:drop-shadow(0 0 40px rgba(124,192,255,.5))}
  .price{
    position:absolute;
    right:48px;
    bottom:44px;
    width:150px;height:150px;
    border-radius:50%;
    background:#e0a96d;
    color:#07142b;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-8deg);
    font-family:"Helvetica Neue",Arial,sans-serif;
    text-align:center;
    z-index:2;
  }
  .price b{font-size:46px;line-height:1;font-family:Georgia,serif}
  .price span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-top:4px}
  @media (max-width:860px){
    .poster{grid-template-columns:1fr;padding:32px 24px}
    h1 .blue,h1 .lantern{font-size:80px}
    .info{grid-template-columns:1fr}
    .price{position:static;margin:16px auto 0}
  }
</style>
</head>
<body>
<main class="poster">
  <section class="left">
    <div>
      <p class="kicker">Live Jazz · One Night Only</p>
      <h1>
        <span class="blue">Blue</span>
        <span class="lantern">Lantern</span>
        <span class="sessions">Sessions</span>
      </h1>
      <div class="band">
        <small>Featuring</small>
        <strong>The Harbour Quartet</strong>
      </div>
    </div>
    <div class="info">
      <div><span>Date</span>Friday<br>14 November</div>
      <div><span>Venue</span>The Copper Room<br>22 Mill Street</div>
      <div><span>Tickets</span>$15<br>at the door</div>
    </div>
  </section>
  <section class="right" aria-hidden="true">
    <svg class="lantern-art" viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#e8f5ff"/>
          <stop offset=".45" stop-color="#7cc0ff"/>
          <stop offset="1" stop-color="#1c4f9a"/>
        </radialGradient>
      </defs>
      <path d="M100 8 v34" stroke="#e0a96d" stroke-width="4" fill="none"/>
      <circle cx="100" cy="10" r="6" fill="none" stroke="#e0a96d" stroke-width="3"/>
      <path d="M62 56 h76 l-10 -14 h-56 z" fill="#e0a96d"/>
      <path d="M62 56 h76 l14 40 v100 l-14 40 h-76 l-14 -40 v-100 z" fill="url(#g)" stroke="#e0a96d" stroke-width="4"/>
      <path d="M100 56 v180 M74 56 l-10 180 M126 56 l10 180" stroke="#07142b" stroke-opacity=".45" stroke-width="3"/>
      <path d="M48 120 h104 M48 176 h104" stroke="#07142b" stroke-opacity=".45" stroke-width="3"/>
      <ellipse cx="100" cy="146" rx="18" ry="30" fill="#fff" opacity=".85"/>
      <path d="M62 236 h76 l10 14 h-96 z" fill="#e0a96d"/>
      <rect x="56" y="250" width="88" height="12" rx="3" fill="#b9854e"/>
    </svg>
  </section>
  <div class="price" aria-label="Tickets $15 at the door"><b>$15</b><span>at the door</span></div>
</main>
</body>
</html>
