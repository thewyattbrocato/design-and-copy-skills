<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Lantern Sessions — The Harbour Quartet</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0b1a2e;
    color:#f3e9d2;
    font-family:Georgia,"Times New Roman",serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .poster{
    position:relative;
    width:100%;
    max-width:1180px;
    min-height:700px;
    display:grid;
    grid-template-columns:1fr 360px;
    gap:48px;
    padding:48px 56px;
    border:2px solid #d9a441;
    outline:1px solid #d9a441;
    outline-offset:-12px;
    background:
      radial-gradient(circle at 82% 38%, rgba(94,170,255,.38) 0, rgba(94,170,255,.12) 28%, transparent 55%),
      linear-gradient(160deg,#10294a 0%,#0b1a2e 60%,#07111f 100%);
    overflow:hidden;
  }
  .main{display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2}
  .kicker{
    font-family:"Helvetica Neue",Arial,sans-serif;
    text-transform:uppercase;
    letter-spacing:.4em;
    font-size:15px;
    color:#d9a441;
  }
  h1{
    font-weight:400;
    font-style:italic;
    line-height:.88;
    font-size:clamp(72px,11vw,148px);
    letter-spacing:-.02em;
    margin:20px 0 0;
  }
  h1 span{display:block;color:#7cc0ff;text-shadow:0 0 40px rgba(94,170,255,.55)}
  h1 em{
    display:block;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-style:normal;
    font-weight:300;
    text-transform:uppercase;
    letter-spacing:.5em;
    font-size:clamp(22px,3.2vw,40px);
    margin-top:18px;
    color:#f3e9d2;
  }
  .band{margin-top:36px}
  .band small{
    display:block;
    font-family:"Helvetica Neue",Arial,sans-serif;
    text-transform:uppercase;
    letter-spacing:.3em;
    font-size:13px;
    color:#d9a441;
    margin-bottom:6px;
  }
  .band strong{font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.05}
  .rule{height:1px;background:#d9a441;opacity:.7;margin:32px 0}
  .details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:28px;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .details dt{
    text-transform:uppercase;
    letter-spacing:.25em;
    font-size:12px;
    color:#d9a441;
    margin-bottom:6px;
  }
  .details dd{font-size:24px;line-height:1.25;font-family:Georgia,serif}
  .details dd b{font-weight:700}
  .art{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .lantern{width:100%;max-width:300px;height:auto;filter:drop-shadow(0 0 40px rgba(124,192,255,.6))}
  .price{
    margin-top:24px;
    width:170px;height:170px;
    border-radius:50%;
    background:#d9a441;
    color:#0b1a2e;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    font-family:"Helvetica Neue",Arial,sans-serif;
    transform:rotate(-8deg);
    box-shadow:0 0 0 4px #0b1a2e,0 0 0 6px #d9a441;
  }
  .price .amt{font-family:Georgia,serif;font-weight:700;font-size:56px;line-height:1}
  .price .at{font-size:13px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;margin-top:6px}
  @media (max-width:860px){
    .poster{grid-template-columns:1fr;padding:36px 28px}
    .art{flex-direction:row;gap:24px}
    .lantern{max-width:140px}
    .details{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<main class="poster">
  <section class="main">
    <div>
      <p class="kicker">Live Jazz · One Night Only</p>
      <h1><span>Blue Lantern</span><em>Sessions</em></h1>
      <div class="band">
        <small>Featuring</small>
        <strong>The Harbour Quartet</strong>
      </div>
    </div>
    <div>
      <div class="rule"></div>
      <dl class="details">
        <div>
          <dt>When</dt>
          <dd><b>Friday 14 November</b></dd>
        </div>
        <div>
          <dt>Where</dt>
          <dd><b>The Copper Room</b><br>22 Mill Street</dd>
        </div>
      </dl>
    </div>
  </section>

  <aside class="art" aria-label="Illustration of a glowing blue lantern">
    <svg class="lantern" viewBox="0 0 200 320" role="img" aria-hidden="true">
      <defs>
        <radialGradient id="g" cx="50%" cy="50%" r="55%">
          <stop offset="0" stop-color="#e6f4ff"/>
          <stop offset=".45" stop-color="#7cc0ff"/>
          <stop offset="1" stop-color="#1d5fa8"/>
        </radialGradient>
      </defs>
      <path d="M100 4v34" stroke="#d9a441" stroke-width="4" fill="none"/>
      <circle cx="100" cy="10" r="8" fill="none" stroke="#d9a441" stroke-width="4"/>
      <path d="M60 60q40-34 80 0l8 14H52z" fill="#d9a441"/>
      <rect x="48" y="74" width="104" height="14" rx="3" fill="#b8822a"/>
      <path d="M56 88h88q10 70 0 140H56q-10-70 0-140z" fill="url(#g)" stroke="#d9a441" stroke-width="4"/>
      <path d="M100 88v140M78 88q-6 70 0 140M122 88q6 70 0 140" stroke="#0b1a2e" stroke-opacity=".45" stroke-width="3" fill="none"/>
      <ellipse cx="100" cy="170" rx="16" ry="30" fill="#fff" opacity=".85"/>
      <rect x="48" y="228" width="104" height="16" rx="3" fill="#b8822a"/>
      <path d="M58 244h84l10 26H48z" fill="#d9a441"/>
    </svg>
    <div class="price">
      <span class="amt">$15</span>
      <span class="at">at the door</span>
    </div>
  </aside>
</main>
</body>
</html>
