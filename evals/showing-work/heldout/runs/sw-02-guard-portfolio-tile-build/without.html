<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernleaf – Portfolio Tile</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 24px;
    background: #f4f4f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1d2320;
  }

  /* Wrapper only to approximate one column of a 3-column grid */
  .demo-cell {
    max-width: 360px;
    margin: 0 auto;
  }

  .tile {
    display: block;
    color: inherit;
    text-decoration: none;
  }

  .tile-image {
    aspect-ratio: 4 / 3;
    width: 100%;
    background: #cfe0d3;
    border-radius: 10px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .tile-title {
    margin: 14px 0 4px;
    font-size: 1.125rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .tile-desc {
    margin: 0 0 6px;
    font-size: 0.9375rem;
    line-height: 1.4;
    color: #4a534e;
  }

  .tile-year {
    margin: 0;
    font-size: 0.8125rem;
    color: #6b746f;
    font-variant-numeric: tabular-nums;
  }

  .tile:hover .tile-image,
  .tile:focus-visible .tile-image {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(29, 35, 32, 0.12);
  }

  .tile:focus-visible {
    outline: 2px solid #2f6b4a;
    outline-offset: 4px;
    border-radius: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tile-image { transition: none; }
  }
</style>
</head>
<body>
  <div class="demo-cell">
    <a class="tile" href="#">
      <div class="tile-image" role="img" aria-label="Placeholder for Fernleaf app screenshot"></div>
      <h3 class="tile-title">Fernleaf</h3>
      <p class="tile-desc">An iOS plant-watering reminder app, designed solo.</p>
      <p class="tile-year">2024</p>
    </a>
  </div>
</body>
</html>
