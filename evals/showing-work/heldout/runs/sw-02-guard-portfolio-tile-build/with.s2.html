<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernleaf tile</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 24px;
    background: #f3f2ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1f2421;
  }
  .tile {
    display: block;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    color: inherit;
    text-decoration: none;
  }
  .thumb {
    aspect-ratio: 4 / 3;
    width: 100%;
    border-radius: 12px;
    background: #cfdcd0;
    border: 1px solid #b9cabb;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .tile:hover .thumb,
  .tile:focus-visible .thumb {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(31, 36, 33, .12);
  }
  .tile:focus-visible { outline: 2px solid #2f6b4a; outline-offset: 4px; border-radius: 12px; }
  .meta { padding: 12px 2px 0; }
  .title {
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .desc {
    margin: 4px 0 0;
    font-size: .9375rem;
    line-height: 1.4;
    color: #4a524d;
  }
  .year {
    margin: 8px 0 0;
    font-size: .8125rem;
    color: #5f6762;
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-reduced-motion: reduce) {
    .thumb { transition: none; }
    .tile:hover .thumb, .tile:focus-visible .thumb { transform: none; }
  }
</style>
</head>
<body>
  <a class="tile" href="#">
    <div class="thumb" role="img" aria-label="Placeholder for a Fernleaf app screenshot"></div>
    <div class="meta">
      <h3 class="title">Fernleaf</h3>
      <p class="desc">An iOS app that reminds you when each houseplant needs water.</p>
      <p class="year">2024</p>
    </div>
  </a>
</body>
</html>
