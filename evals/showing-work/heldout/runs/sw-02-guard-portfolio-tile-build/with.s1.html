<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernleaf – Portfolio Tile</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 24px;
    background: #f4f4f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1c1f1d;
  }
  .tile {
    display: block;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    color: inherit;
    text-decoration: none;
  }
  .tile-image {
    aspect-ratio: 4 / 3;
    width: 100%;
    background: #cfe0d2;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5d7a64;
    font-size: 13px;
    letter-spacing: 0.04em;
    transition: transform 0.2s ease;
  }
  .tile:hover .tile-image,
  .tile:focus-visible .tile-image { transform: translateY(-2px); }
  .tile:focus-visible { outline: 2px solid #3f6b4b; outline-offset: 4px; border-radius: 10px; }
  .tile-body { padding: 14px 2px 0; }
  .tile-title {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.25;
  }
  .tile-desc {
    margin: 4px 0 0;
    font-size: 14px;
    line-height: 1.4;
    color: #4a504c;
  }
  .tile-year {
    margin: 10px 0 0;
    font-size: 12px;
    color: #6b716d;
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-reduced-motion: reduce) {
    .tile-image { transition: none; }
    .tile:hover .tile-image { transform: none; }
  }
</style>
</head>
<body>
  <a class="tile" href="#">
    <div class="tile-image" role="img" aria-label="Placeholder for Fernleaf app screenshot">Screenshot placeholder</div>
    <div class="tile-body">
      <h2 class="tile-title">Fernleaf</h2>
      <p class="tile-desc">An iOS app that reminds you when each houseplant needs water.</p>
      <p class="tile-year">2024</p>
    </div>
  </a>
</body>
</html>
