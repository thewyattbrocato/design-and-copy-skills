<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernleaf tile</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 24px;
    background: #f2f1ed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1d1f1c;
  }
  .tile {
    display: block;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    color: inherit;
    text-decoration: none;
  }
  .thumb {
    aspect-ratio: 4 / 3;
    width: 100%;
    background: #cfe0cf;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5f7a5f;
    font-size: 13px;
    letter-spacing: 0.04em;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .tile:hover .thumb,
  .tile:focus-visible .thumb {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(40, 60, 40, 0.15);
  }
  .tile:focus-visible { outline: 2px solid #3b6b46; outline-offset: 4px; border-radius: 12px; }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-top: 12px;
  }
  h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .year { font-size: 14px; color: #6b6e68; font-variant-numeric: tabular-nums; }
  p { margin: 4px 0 0; font-size: 14px; line-height: 1.4; color: #4a4d47; }
  @media (prefers-reduced-motion: reduce) {
    .thumb { transition: none; }
    .tile:hover .thumb { transform: none; }
  }
</style>
</head>
<body>
  <a class="tile" href="#">
    <div class="thumb" role="img" aria-label="Placeholder for Fernleaf app screenshot">Screenshot placeholder</div>
    <div class="meta">
      <h3>Fernleaf</h3>
      <span class="year">2024</span>
    </div>
    <p>An iOS app that reminds you when each houseplant needs watering.</p>
  </a>
</body>
</html>
