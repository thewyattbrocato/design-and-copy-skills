<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernleaf – Portfolio Tile</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px;
    background: #f4f4f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1c1c1a;
  }
  .tile {
    display: block;
    width: 100%;
    max-width: 360px;
    color: inherit;
    text-decoration: none;
  }
  .tile-image {
    aspect-ratio: 4 / 3;
    width: 100%;
    background: #cfe0cf;
    border-radius: 12px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .tile:hover .tile-image,
  .tile:focus-visible .tile-image {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  }
  .tile:focus-visible {
    outline: 2px solid #2f6b3f;
    outline-offset: 4px;
    border-radius: 12px;
  }
  .tile-title {
    margin: 14px 0 4px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
  }
  .tile-desc {
    margin: 0 0 8px;
    font-size: 14px;
    line-height: 1.4;
    color: #55554f;
  }
  .tile-year {
    margin: 0;
    font-size: 13px;
    color: #6f6f68;
  }
</style>
</head>
<body>
  <a class="tile" href="#">
    <div class="tile-image" role="img" aria-label="Fernleaf screenshot placeholder"></div>
    <h3 class="tile-title">Fernleaf</h3>
    <p class="tile-desc">An iOS plant-watering reminder app, designed solo.</p>
    <p class="tile-year">2024</p>
  </a>
</body>
</html>
