<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernleaf – Portfolio Tile</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px;
    background: #f2f2f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1d1f1c;
  }
  .tile {
    display: block;
    max-width: 360px;
    text-decoration: none;
    color: inherit;
  }
  .tile-image {
    aspect-ratio: 4 / 3;
    width: 100%;
    background: #cfe0cf;
    border-radius: 10px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .tile:hover .tile-image,
  .tile:focus-visible .tile-image {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
  }
  .tile:focus-visible {
    outline: 2px solid #3f6b49;
    outline-offset: 4px;
    border-radius: 10px;
  }
  .tile-title {
    margin: 14px 0 4px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
  }
  .tile-desc {
    margin: 0 0 6px;
    font-size: 14px;
    line-height: 1.4;
    color: #4a4d48;
  }
  .tile-year {
    margin: 0;
    font-size: 13px;
    color: #6b6e69;
  }
  @media (prefers-reduced-motion: reduce) {
    .tile-image { transition: none; }
  }
</style>
</head>
<body>
  <a class="tile" href="#">
    <div class="tile-image" role="img" aria-label="Placeholder for Fernleaf app screenshot"></div>
    <h3 class="tile-title">Fernleaf</h3>
    <p class="tile-desc">An iOS app that reminds you when to water your plants.</p>
    <p class="tile-year">2024</p>
  </a>
</body>
</html>
