<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quokka wordmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: #14302b; --accent: #e0702f; --paper: #ffffff; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #f3f5f4;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 48px; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #5b6b67; margin: 28px 0 8px; font-weight: 600; }
  .panel { border-radius: 10px; padding: 40px 24px; display: flex; align-items: center; justify-content: center; }
  .light { background: var(--paper); border: 1px solid #dde3e1; }
  .dark { background: var(--ink); color: #fff; --accent: #f08a4b; }
  .mono { background: var(--paper); border: 1px solid #dde3e1; color: #000; --accent: #000; }

  /* The wordmark: heavy system sans, tight tracking, one custom letter (the Q's tail is a smile). */
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    font-weight: 800;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.025em;
    color: inherit;
    white-space: nowrap;
  }
  .wordmark svg {
    width: .8em; height: 1em;
    margin-right: .02em;
    vertical-align: baseline;
    transform: translateY(.28em);
    flex: none;
    overflow: visible;
  }
  .wordmark .ring { fill: none; stroke: currentColor; stroke-width: 13; }
  .wordmark .smile { fill: none; stroke: var(--accent); stroke-width: 11; stroke-linecap: round; }

  .sm { font-size: 22px; }
  .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; justify-content: center; }

  /* Wiki header usage */
  .bar { display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: var(--paper); border: 1px solid #dde3e1; border-radius: 10px; }
  .bar .wordmark { font-size: 26px; }
  .bar span.t { color: #5b6b67; font-size: 14px; border-left: 1px solid #dde3e1; padding-left: 16px; }
</style>
</head>
<body>
<div class="wrap">

  <h2>Login page</h2>
  <div class="panel light">
    <div class="wordmark" role="img" aria-label="Quokka">
      <svg viewBox="0 0 80 100" aria-hidden="true">
        <circle class="ring" cx="38" cy="36" r="29"/>
        <path class="smile" d="M42 64 Q58 86 76 68"/>
      </svg>uokka
    </div>
  </div>

  <h2>Wiki header</h2>
  <div class="bar">
    <div class="wordmark" role="img" aria-label="Quokka">
      <svg viewBox="0 0 80 100" aria-hidden="true">
        <circle class="ring" cx="38" cy="36" r="29"/>
        <path class="smile" d="M42 64 Q58 86 76 68"/>
      </svg>uokka
    </div>
    <span class="t">Team analytics wiki</span>
  </div>

  <h2>Reversed and one-color</h2>
  <div class="row">
    <div class="panel dark" style="flex:1; min-width:240px">
      <div class="wordmark sm" style="font-size:40px" role="img" aria-label="Quokka">
        <svg viewBox="0 0 80 100" aria-hidden="true">
          <circle class="ring" cx="38" cy="36" r="29"/>
          <path class="smile" d="M42 64 Q58 86 76 68"/>
        </svg>uokka
      </div>
    </div>
    <div class="panel mono" style="flex:1; min-width:240px">
      <div class="wordmark" style="font-size:40px" role="img" aria-label="Quokka">
        <svg viewBox="0 0 80 100" aria-hidden="true">
          <circle class="ring" cx="38" cy="36" r="29"/>
          <path class="smile" d="M42 64 Q58 86 76 68"/>
        </svg>uokka
      </div>
    </div>
  </div>

</div>
</body>
</html>
