<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quokka wordmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#1d2a33; --paper:#fbf8f3; --accent:#b4572b; }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:40px 24px;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background:#eceae6; color:var(--ink);
  }
  .wrap { max-width:720px; margin:0 auto; display:grid; gap:20px; }
  .panel { border-radius:10px; padding:44px 32px; display:flex; align-items:center; justify-content:center; gap:40px; flex-wrap:wrap; }
  .light { background:var(--paper); color:var(--ink); }
  .dark  { background:var(--ink);   color:var(--paper); }
  .mono  { background:#fff; color:#000; }
  .label { font-size:12px; letter-spacing:.06em; text-transform:uppercase; opacity:.55; margin:0 0 -8px; }

  /* the wordmark */
  .wm {
    display:inline-flex; align-items:baseline;
    font-weight:750; letter-spacing:-.035em; line-height:1;
    font-size:56px; white-space:nowrap; color:currentColor;
  }
  .wm svg { width:.57em; height:.57em; margin:0 .015em 0 .01em; fill:currentColor; flex:none; position:relative; top:.012em; }
  .wm .o-accent { fill:var(--accent); }
  .sm  { font-size:20px; }
  .xs  { font-size:14px; }
  .lg  { font-size:84px; }
</style>
</head>
<body>
<div class="wrap">

  <p class="label">Login / wiki header</p>
  <div class="panel light">
    <span class="wm lg" role="img" aria-label="quokka">quok<!--
    --><svg viewBox="0 0 100 100" aria-hidden="true"><path fill-rule="evenodd" d="M50 0a50 50 0 1 0 0 100A50 50 0 0 0 50 0zm0 22a26 26 0 1 1 0 52 26 26 0 0 1 0-52z" class="o-accent"/></svg><!--
    -->ka</span>
  </div>

  <p class="label">Reversed</p>
  <div class="panel dark">
    <span class="wm" role="img" aria-label="quokka">quok<svg viewBox="0 0 100 100" aria-hidden="true"><path fill-rule="evenodd" d="M50 0a50 50 0 1 0 0 100A50 50 0 0 0 50 0zm0 22a26 26 0 1 1 0 52 26 26 0 0 1 0-52z"/></svg>ka</span>
  </div>

  <p class="label">One color, small sizes</p>
  <div class="panel mono">
    <span class="wm" role="img" aria-label="quokka">quok<svg viewBox="0 0 100 100" aria-hidden="true"><path fill-rule="evenodd" d="M50 0a50 50 0 1 0 0 100A50 50 0 0 0 50 0zm0 22a26 26 0 1 1 0 52 26 26 0 0 1 0-52z"/></svg>ka</span>
    <span class="wm sm" role="img" aria-label="quokka">quok<svg viewBox="0 0 100 100" aria-hidden="true"><path fill-rule="evenodd" d="M50 0a50 50 0 1 0 0 100A50 50 0 0 0 50 0zm0 22a26 26 0 1 1 0 52 26 26 0 0 1 0-52z"/></svg>ka</span>
    <span class="wm xs" role="img" aria-label="quokka">quok<svg viewBox="0 0 100 100" aria-hidden="true"><path fill-rule="evenodd" d="M50 0a50 50 0 1 0 0 100A50 50 0 0 0 50 0zm0 22a26 26 0 1 1 0 52 26 26 0 0 1 0-52z"/></svg>ka</span>
  </div>

</div>
</body>
</html>
