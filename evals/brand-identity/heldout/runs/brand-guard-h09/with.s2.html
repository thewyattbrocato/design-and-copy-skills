<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quokka wordmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: #1f2937; --paper: #ffffff; --accent: #c2410c; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #f3f4f6;
  }
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 800;
    font-size: 48px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    white-space: nowrap;
  }
  .wordmark svg {
    width: 0.86em;
    height: 0.86em;
    margin-right: 0.02em;
    transform: translateY(0.1em);
    overflow: visible;
  }
  .wordmark .ring { stroke: currentColor; }
  .wordmark .smile { stroke: var(--accent); }

  .sheet { max-width: 760px; margin: 0 auto; padding: 32px 20px 48px; }
  .panel {
    background: var(--paper);
    border-radius: 10px;
    padding: 40px 24px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .panel.dark { background: #111827; --ink: #f9fafb; --accent: #fb923c; }
  .panel.dark .wordmark { color: #f9fafb; }
  .panel.row { gap: 32px; justify-content: flex-start; }
  .panel.row .wordmark { font-size: 24px; }
  .panel.row .wordmark.sm { font-size: 16px; }
  .note { font-size: 13px; color: #6b7280; margin: 8px 4px 0; }
</style>
</head>
<body>
<div class="sheet">

  <div class="panel" aria-label="Login page header">
    <span class="wordmark" role="img" aria-label="Quokka">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring" cx="50" cy="46" r="34" fill="none" stroke-width="15"/>
        <path class="smile" d="M52 68 Q68 82 88 76" fill="none" stroke-width="15" stroke-linecap="round"/>
      </svg><span aria-hidden="true">uokka</span>
    </span>
  </div>

  <div class="panel dark" aria-label="Reversed">
    <span class="wordmark" role="img" aria-label="Quokka">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring" cx="50" cy="46" r="34" fill="none" stroke-width="15"/>
        <path class="smile" d="M52 68 Q68 82 88 76" fill="none" stroke-width="15" stroke-linecap="round"/>
      </svg><span aria-hidden="true">uokka</span>
    </span>
  </div>

  <div class="panel row" aria-label="Small sizes">
    <span class="wordmark" role="img" aria-label="Quokka">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring" cx="50" cy="46" r="34" fill="none" stroke-width="15"/>
        <path class="smile" d="M52 68 Q68 82 88 76" fill="none" stroke-width="15" stroke-linecap="round"/>
      </svg><span aria-hidden="true">uokka</span>
    </span>
    <span class="wordmark sm" role="img" aria-label="Quokka">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring" cx="50" cy="46" r="34" fill="none" stroke-width="15"/>
        <path class="smile" d="M52 68 Q68 82 88 76" fill="none" stroke-width="15" stroke-linecap="round"/>
      </svg><span aria-hidden="true">uokka</span>
    </span>
  </div>

  <p class="note">Idea: the Q's tail is a quokka's smile. To reuse, copy the .wordmark span and its CSS. Set --ink and --accent for light or dark backgrounds; at one color, set both to the same value.</p>
</div>
</body>
</html>
