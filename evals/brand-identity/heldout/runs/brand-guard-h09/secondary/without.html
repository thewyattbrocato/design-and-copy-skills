<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quokka</title>
  <style>
    :root {
      --fg: #1f2328;
      --accent: #2f6f4e;
      --bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6e8eb;
        --accent: #6fbf94;
        --bg: #16181c;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wordmark {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      margin: 0;
      user-select: none;
    }
    .wordmark span {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1 class="wordmark">Quokka<span>.</span></h1>
</body>
</html>
