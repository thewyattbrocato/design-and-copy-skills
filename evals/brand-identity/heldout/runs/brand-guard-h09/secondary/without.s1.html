<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quokka</title>
<style>
  :root {
    color-scheme: light dark;
    --wordmark-color: #1f2328;
    --accent: #c2410c;
    --bg: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --wordmark-color: #e6edf3;
      --accent: #fb923c;
      --bg: #0d1117;
    }
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .wordmark {
    margin: 0;
    font-size: 2.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--wordmark-color);
    line-height: 1;
    display: inline-flex;
    align-items: baseline;
    gap: 0.15em;
    user-select: none;
  }

  .wordmark .dot {
    display: inline-block;
    width: 0.3em;
    height: 0.3em;
    border-radius: 50%;
    background: var(--accent);
    transform: translateY(-0.1em);
  }
</style>
</head>
<body>
  <h1 class="wordmark" aria-label="Quokka">Quokka<span class="dot" aria-hidden="true"></span></h1>
</body>
</html>
