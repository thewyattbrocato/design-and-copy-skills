<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka</title>
<style>
  :root {
    --ink: #1d2433;
    --paper: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2f4f8;
      --paper: #14171f;
    }
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
  }
  body {
    display: grid;
    place-items: center;
  }
  .wordmark {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--ink);
    white-space: nowrap;
  }
  /* One custom adjustment: the Q's tail is a short bar set at an angle */
  .q {
    position: relative;
    display: inline-block;
  }
  .q::after {
    content: "";
    position: absolute;
    right: -0.06em;
    bottom: -0.12em;
    width: 0.32em;
    height: 0.09em;
    background: var(--ink);
    transform: rotate(-35deg);
    border-radius: 0.05em;
  }
</style>
</head>
<body>
  <h1 class="wordmark" aria-label="Quokka"><span class="q">Q</span>uokka</h1>
</body>
</html>
