<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #ffffff;
    --accent: #1a1a1a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2f2f2;
      --paper: #121212;
      --accent: #f2f2f2;
    }
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .wordmark {
    margin: 0;
    font-size: 2.25rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    text-transform: lowercase;
    user-select: none;
  }

  .wordmark .dot {
    color: var(--accent);
  }

  /* Compact header variant for the wiki page */
  .wordmark.header {
    font-size: 1.25rem;
    letter-spacing: -0.02em;
  }
</style>
</head>
<body>
  <h1 class="wordmark" aria-label="Quokka">quokka<span class="dot">.</span></h1>
</body>
</html>
