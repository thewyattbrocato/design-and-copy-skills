<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quokka</title>
  <style>
    :root {
      --ink: #1f2430;
      --accent: #c2410c;
      --bg: #ffffff;
      --muted: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f3f4f6;
        --accent: #fb923c;
        --bg: #111418;
        --muted: #9ca3af;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: var(--ink);
    }
    .wordmark svg {
      width: 1.6em;
      height: 1.6em;
      flex: none;
    }
    .wordmark__text {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .wordmark__text span {
      color: var(--accent);
    }
    .stage {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .stage p {
      margin: 0;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="stage">
    <a class="wordmark" href="#" aria-label="Quokka">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="17" r="11" fill="var(--ink)"/>
        <circle cx="11" cy="8" r="4" fill="var(--ink)"/>
        <circle cx="21" cy="8" r="4" fill="var(--ink)"/>
        <circle cx="12" cy="16" r="1.6" fill="var(--bg)"/>
        <circle cx="20" cy="16" r="1.6" fill="var(--bg)"/>
        <ellipse cx="16" cy="21" rx="2.4" ry="1.6" fill="var(--accent)"/>
      </svg>
      <span class="wordmark__text">Quokk<span>a</span></span>
    </a>
    <p>Internal analytics</p>
  </main>
</body>
</html>
