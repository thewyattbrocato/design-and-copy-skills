<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka</title>
<style>
  :root {
    --ink: #1f2430;
    --paper: #ffffff;
    --accent: #2f7d6d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eef1f5;
      --paper: #14171c;
      --accent: #5fbfa8;
    }
  }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    gap: 0.04em;
    color: var(--ink);
    font-size: 32px;
    line-height: 1;
    user-select: none;
  }
  .wordmark .q {
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .wordmark .rest {
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .wordmark .dot {
    display: inline-block;
    width: 0.28em;
    height: 0.28em;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 0.06em;
    align-self: center;
    transform: translateY(-0.02em);
  }
</style>
</head>
<body>
  <div class="wordmark" role="img" aria-label="Quokka">
    <span class="q">Q</span><span class="rest">uokka</span><span class="dot" aria-hidden="true"></span>
  </div>
</body>
</html>
