<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka</title>
<style>
  :root {
    --ink: #1f2933;
    --muted: #6b7785;
    --accent: #2f7d6d;
    --bg: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e6ebf0;
      --muted: #9aa6b2;
      --accent: #5fb8a6;
      --bg: #14181d;
    }
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    color: var(--ink);
    text-decoration: none;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .wordmark svg {
    width: 1.1em;
    height: 1.1em;
    flex-shrink: 0;
  }

  .wordmark .dot {
    color: var(--accent);
  }

  /* Compact variant for the top of the wiki page */
  .wordmark.compact {
    font-size: 1.1rem;
  }
</style>
</head>
<body>
  <a class="wordmark" href="#" aria-label="Quokka">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="var(--accent)"/>
      <circle cx="9" cy="10.5" r="1.4" fill="var(--bg)"/>
      <circle cx="15" cy="10.5" r="1.4" fill="var(--bg)"/>
      <path d="M8.5 15c1.1 1.2 2.2 1.8 3.5 1.8s2.4-.6 3.5-1.8" fill="none" stroke="var(--bg)" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <span>Quokka<span class="dot">.</span></span>
  </a>
</body>
</html>
