<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka</title>
<style>
  :root {
    --ink: #1f2328;
    --paper: #ffffff;
    --accent: #2f6f5e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2f4f5;
      --paper: #16191c;
      --accent: #6fc2a9;
    }
  }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wordmark {
    margin: 0;
    font-size: 2.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    user-select: none;
  }
  .wordmark .dot {
    color: var(--accent);
  }
  .wordmark.small {
    font-size: 1.25rem;
  }
  .demo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
  }
  .demo .header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
    width: 22rem;
  }
</style>
</head>
<body>
  <div class="demo">
    <h1 class="wordmark">Quokka<span class="dot">.</span></h1>
    <div class="header">
      <span class="wordmark small">Quokka<span class="dot">.</span></span>
    </div>
  </div>
</body>
</html>
