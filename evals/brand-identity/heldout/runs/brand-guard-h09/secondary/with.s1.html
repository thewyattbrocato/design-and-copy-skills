<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka</title>
<style>
  :root {
    --ink: #1f2328;
    --paper: #ffffff;
    --accent: #2f6f5e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2f4f7;
      --paper: #16181c;
      --accent: #6fc2aa;
    }
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    gap: 0.02em;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    text-decoration: none;
    color: var(--ink);
  }
  .wordmark .dot {
    width: 0.32em;
    height: 0.32em;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 0.08em;
    align-self: center;
    transform: translateY(-0.04em);
  }
  .demo {
    display: flex;
    flex-direction: column;
    gap: 32px;
    padding: 32px;
    max-width: 560px;
  }
  .demo .bar {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
  }
  .demo .card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    padding: 32px;
    border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="demo">
    <div class="card">
      <span class="wordmark" aria-label="Quokka">Quokka<span class="dot" aria-hidden="true"></span></span>
    </div>
    <div class="bar">
      <span class="wordmark" aria-label="Quokka">Quokka<span class="dot" aria-hidden="true"></span></span>
    </div>
  </div>
</body>
</html>
