<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quokka</title>
<style>
  :root {
    --ink: #1f2933;
    --accent: #c2410c;
    --paper: #fbf8f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 0.35em;
    color: var(--ink);
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    user-select: none;
  }

  .wordmark .dot {
    width: 0.42em;
    height: 0.42em;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .wordmark .name {
    text-transform: lowercase;
  }
</style>
</head>
<body>
  <div class="wordmark" role="img" aria-label="Quokka">
    <span class="dot" aria-hidden="true"></span>
    <span class="name">quokka</span>
  </div>
</body>
</html>
