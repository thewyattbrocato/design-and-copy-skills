<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka</title>
<style>
  :root {
    --fg: #1d1d1f;
    --accent: #2f7d6d;
    --bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f2f2f2;
      --accent: #5fc2ad;
      --bg: #161718;
    }
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wordmark {
    margin: 0;
    font-size: 2.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--fg);
    line-height: 1;
  }
  .wordmark span {
    color: var(--accent);
  }
</style>
</head>
<body>
  <h1 class="wordmark" aria-label="Quokka">Quo<span>kka</span></h1>
</body>
</html>
