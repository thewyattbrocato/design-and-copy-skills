<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f5f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    gap: 0;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #2b2118;
    line-height: 1;
  }
  .wordmark .dot {
    display: inline-block;
    width: 0.16em;
    height: 0.16em;
    margin-left: 0.06em;
    border-radius: 50%;
    background: #c8693a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1815; }
    .wordmark { color: #f3ece4; }
    .wordmark .dot { background: #e08a5a; }
  }
</style>
</head>
<body>
  <div class="wordmark" role="img" aria-label="Quokka">Quokka<span class="dot"></span></div>
</body>
</html>
