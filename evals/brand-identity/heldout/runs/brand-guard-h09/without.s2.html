<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka</title>
<style>
  :root {
    --ink: #1f2a37;
    --accent: #d9822b;
    --bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f3f4f6; --accent: #f0a04b; --bg: #111827; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1;
    text-decoration: none;
  }
  .wordmark svg { width: 0.9em; height: 0.9em; flex: none; }
  .wordmark .dot { color: var(--accent); }
</style>
</head>
<body>
  <div class="wordmark" role="img" aria-label="Quokka">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="16" fill="#d9822b"/>
      <circle cx="11" cy="13" r="2" fill="#1f2a37"/>
      <circle cx="21" cy="13" r="2" fill="#1f2a37"/>
      <path d="M9 19c2 4.5 12 4.5 14 0" fill="none" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span>Quokka<span class="dot">.</span></span>
  </div>
</body>
</html>
