<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka wordmark</title>
<style>
  :root {
    --ink: #1f2a37;
    --paper: #ffffff;
    --accent: #0f766e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #f3f4f6;
  }

  /* The wordmark: one idea, a quiet smile under "kka" (the quokka's famous grin). */
  .wordmark {
    display: inline-block;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1;
    color: inherit;
    text-decoration: none;
    white-space: nowrap;
    padding-bottom: 0.2em;
  }
  .wordmark .smile {
    position: relative;
    display: inline-block;
  }
  .wordmark .smile::after {
    content: "";
    position: absolute;
    left: 0.1em;
    right: 0.1em;
    bottom: -0.14em;
    height: 0.13em;
    border-bottom: 0.065em solid var(--accent);
    border-radius: 0 0 100% 100% / 0 0 100% 100%;
  }
  .wordmark.mono .smile::after { border-bottom-color: currentColor; }

  .stage { max-width: 960px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
  .card { background: var(--paper); border-radius: 10px; border: 1px solid #e5e7eb; overflow: hidden; }
  .label { font-size: 12px; color: #6b7280; padding: 10px 16px 0; text-transform: uppercase; letter-spacing: 0.06em; }

  /* Login page */
  .login { display: grid; place-items: center; gap: 28px; padding: 56px 24px 64px; }
  .login .wordmark { font-size: 64px; }
  .login form { display: grid; gap: 10px; width: 260px; }
  .login input, .login button {
    font: inherit; font-size: 14px; padding: 10px 12px; border-radius: 6px; border: 1px solid #d1d5db;
  }
  .login button { background: var(--ink); color: #fff; border-color: var(--ink); cursor: pointer; }

  /* Wiki header */
  .wiki-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #e5e7eb; }
  .wiki-head .wordmark { font-size: 26px; padding-bottom: 0.18em; }
  .wiki-head nav { display: flex; gap: 18px; font-size: 14px; color: #4b5563; }
  .wiki-body { padding: 20px; font-size: 14px; color: #4b5563; }

  /* Reversed and small */
  .row { display: grid; grid-template-columns: 1fr 1fr; }
  .dark { background: var(--ink); color: #fff; display: grid; place-items: center; padding: 36px 16px; }
  .dark .wordmark { font-size: 40px; }
  .dark { --accent: #5eead4; }
  .small { display: grid; place-items: center; padding: 36px 16px; }
  .small .wordmark { font-size: 16px; }
</style>
</head>
<body>
<div class="stage">

  <div class="card">
    <div class="label">Login page</div>
    <div class="login">
      <span class="wordmark" role="img" aria-label="Quokka">Quo<span class="smile">kka</span></span>
      <form onsubmit="return false">
        <input type="email" placeholder="Email" aria-label="Email">
        <input type="password" placeholder="Password" aria-label="Password">
        <button type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="label">Wiki header</div>
    <div class="wiki-head">
      <a class="wordmark" href="#" aria-label="Quokka">Quo<span class="smile">kka</span></a>
      <nav><span>Dashboards</span><span>Metrics</span><span>Docs</span></nav>
    </div>
    <div class="wiki-body">Quokka analytics wiki: how we define, query and share numbers.</div>
  </div>

  <div class="card row">
    <div class="dark"><span class="wordmark" role="img" aria-label="Quokka, reversed">Quo<span class="smile">kka</span></span></div>
    <div class="small"><span class="wordmark mono" role="img" aria-label="Quokka, one color, small">Quo<span class="smile">kka</span></span></div>
  </div>

</div>
</body>
</html>
