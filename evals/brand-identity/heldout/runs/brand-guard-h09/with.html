<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quokka wordmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: #1f2a37; --accent: #d9692b; --paper: #faf8f5; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #eceae6;
    color: var(--ink);
  }
  .wordmark {
    display: inline-block;
    position: relative;
    font-weight: 800;
    font-size: 48px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--ink);
    padding-bottom: 0.3em;
    text-decoration: none;
  }
  /* the one idea: a quokka's smile, set under the name */
  .wordmark::after {
    content: "";
    position: absolute;
    left: 18%;
    right: 18%;
    bottom: 0.02em;
    height: 0.2em;
    border-bottom: 0.075em solid var(--accent);
    border-radius: 0 0 100% 100% / 0 0 100% 100%;
  }
  .wordmark.sm { font-size: 22px; }
  .wordmark.lg { font-size: 72px; }
  .wordmark.mono, .wordmark.mono::after { color: #000; border-color: #000; }
  .wordmark.rev { color: #fff; }
  .wordmark.rev::after { border-color: #fff; }

  .panel { padding: 40px; display: flex; align-items: center; justify-content: center; }
  .login { background: var(--paper); min-height: 240px; flex-direction: column; gap: 20px; }
  .login .box { width: 260px; height: 36px; border: 1px solid #cfcac3; border-radius: 6px; background: #fff; }
  .login .btn { width: 260px; height: 36px; border-radius: 6px; background: var(--ink); }
  .wiki { background: #fff; justify-content: flex-start; border-bottom: 1px solid #ddd; padding: 20px 40px 8px; }
  .row { display: flex; gap: 0; flex-wrap: wrap; }
  .row > .panel { flex: 1 1 280px; }
  .dark { background: var(--ink); }
  .light { background: #fff; }
  .label { font-size: 12px; color: #777; padding: 8px 40px; background: #fff; }
</style>
</head>
<body>

<div class="panel login">
  <span class="wordmark lg">Quokka</span>
  <div class="box"></div>
  <div class="box"></div>
  <div class="btn"></div>
</div>

<div class="label">Wiki header</div>
<div class="panel wiki"><span class="wordmark sm">Quokka</span></div>

<div class="row">
  <div class="panel dark"><span class="wordmark rev">Quokka</span></div>
  <div class="panel light"><span class="wordmark mono">Quokka</span></div>
</div>

</body>
</html>
