<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quokka wordmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: #16202b; --paper: #ffffff; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    color: var(--ink);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px; display: grid; gap: 20px; }
  .panel { border-radius: 10px; padding: 48px 24px; display: flex; align-items: center; justify-content: center; }
  .light { background: var(--paper); color: var(--ink); border: 1px solid #e1e4e8; }
  .dark { background: var(--ink); color: #fff; }
  .row { display: flex; align-items: baseline; gap: 28px; }
  .label { font-size: 12px; opacity: .6; margin: 0 0 8px; }

  /* Wordmark: bold system sans, tight tracking, the "o" is a ring with a small smile. */
  .wordmark {
    font-weight: 750;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -0.03em;
    white-space: nowrap;
    display: inline-flex;
    align-items: baseline;
  }
  .wordmark .o {
    position: relative;
    display: inline-block;
    width: .56em;
    height: .56em;
    margin: 0 .03em 0 .02em;
    border: .115em solid currentColor;
    border-radius: 50%;
    vertical-align: baseline;
  }
  .wordmark .o::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: .17em;
    height: .08em;
    transform: translate(-50%, -35%);
    border-bottom: .05em solid currentColor;
    border-radius: 0 0 .2em .2em;
  }
  .sm { font-size: 28px; }
  .xs { font-size: 18px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel light">
      <span class="wordmark" role="img" aria-label="Quokka">Qu<span class="o" aria-hidden="true"></span>kka</span>
    </div>
    <div class="panel dark">
      <span class="wordmark" role="img" aria-label="Quokka">Qu<span class="o" aria-hidden="true"></span>kka</span>
    </div>
    <div class="panel light">
      <div>
        <p class="label">Login page / wiki header sizes</p>
        <div class="row">
          <span class="wordmark sm" role="img" aria-label="Quokka">Qu<span class="o" aria-hidden="true"></span>kka</span>
          <span class="wordmark xs" role="img" aria-label="Quokka">Qu<span class="o" aria-hidden="true"></span>kka</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
