<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quokka wordmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: #1f2937; --smile: #e8743b; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #f6f5f2;
  }
  .panel {
    display: flex; align-items: center; justify-content: center;
    padding: 64px 24px;
  }
  .panel.dark { background: #111827; --ink: #f9fafb; color: var(--ink); }
  .panel.small { padding: 24px; }

  .wordmark {
    display: inline-block;
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 800;
    font-size: 72px;
    line-height: 1;
    letter-spacing: -0.035em;
    color: var(--ink);
    text-transform: lowercase;
    white-space: nowrap;
  }
  /* The "o" is a ring; its lower arc is the quokka's smile. */
  .wordmark .o {
    display: inline-block;
    width: 0.58em; height: 0.58em;
    margin: 0 0.035em 0 0.02em;
    border: 0.14em solid var(--ink);
    border-bottom-color: var(--smile);
    border-radius: 50%;
    vertical-align: baseline;
    transform: translateY(0.01em);
  }
  .s-36 { font-size: 36px; }
  .s-24 { font-size: 24px; }
  .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  .mono .o { border-color: var(--ink); }
  .mono { --smile: currentColor; }
</style>
</head>
<body>
  <div class="panel">
    <span class="wordmark" role="img" aria-label="Quokka">quokk<span class="o" aria-hidden="true"></span></span>
  </div>
</body>
</html>
