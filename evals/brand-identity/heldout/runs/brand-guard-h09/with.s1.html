<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka wordmark</title>
<style>
  :root {
    --ink: #1f2a37;
    --accent: #c2410c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f4f4f5;
    color: var(--ink);
  }
  .panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 72px 24px;
  }
  .panel.light { background: #ffffff; }
  .panel.dark  { background: #111827; --ink: #f9fafb; --accent: #fb923c; }
  .panel.small { padding: 20px 24px; justify-content: flex-start; border-top: 1px solid #e5e7eb; }

  .wordmark {
    display: inline-block;
    position: relative;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--ink);
    padding-bottom: 0.2em;
    text-decoration: none;
  }
  .wordmark svg {
    position: absolute;
    left: 0.04em;
    bottom: 0;
    width: 2.1em;
    height: 0.2em;
    overflow: visible;
  }
  .wordmark svg path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 5;
    stroke-linecap: round;
  }
  .wordmark.sm { font-size: 24px; }
  .wordmark.sm svg path { stroke-width: 7; }
</style>
</head>
<body>

  <div class="panel light">
    <span class="wordmark" role="img" aria-label="Quokka">Quokka
      <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M3 3 Q50 14 97 3"/></svg>
    </span>
  </div>

  <div class="panel dark">
    <span class="wordmark" role="img" aria-label="Quokka">Quokka
      <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M3 3 Q50 14 97 3"/></svg>
    </span>
  </div>

  <div class="panel light small">
    <span class="wordmark sm" role="img" aria-label="Quokka">Quokka
      <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M3 3 Q50 14 97 3"/></svg>
    </span>
  </div>

</body>
</html>
