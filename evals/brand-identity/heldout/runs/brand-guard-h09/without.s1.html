<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quokka wordmark</title>
<style>
  :root {
    --ink: #1f2a37;
    --accent: #d9732b;
    --bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f1f5f9; --accent: #f0914d; --bg: #111827; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 0.45em;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1;
    text-decoration: none;
  }
  .mark {
    width: 0.8em;
    height: 0.8em;
    flex: none;
  }
  .wordmark .dot { color: var(--accent); }
</style>
</head>
<body>
  <a class="wordmark" href="#" aria-label="Quokka">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="20" fill="#d9732b"/>
      <path d="M9 22 Q20 33 31 22" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="14" cy="15" r="2.5" fill="#fff"/>
      <circle cx="26" cy="15" r="2.5" fill="#fff"/>
    </svg>
    <span>Quokka</span>
  </a>
</body>
</html>
