<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling: Logo</title>
<style>
  :root{
    --ink:#14323f;
    --water:#2a8fbd;
    --clay:#c8641e;
    --paper:#f6f1e7;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:40px 24px 64px;
    background:#e9e4d8;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  main{max-width:960px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .card{
    border-radius:10px;padding:32px 24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    min-height:220px;
  }
  .hero{grid-column:1/-1;background:var(--paper);min-height:340px}
  .light{background:#fff}
  .dark{background:var(--ink);color:var(--paper)}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;align-self:flex-start;margin-top:auto}
  .card.hero .label,.card .label{margin-top:0}

  /* lockups */
  .lockup{display:flex;align-items:center;gap:20px;color:var(--ink)}
  .dark .lockup{color:var(--paper)}
  .word{display:flex;flex-direction:column;line-height:1}
  .name{
    font-weight:900;font-size:44px;letter-spacing:.02em;text-transform:uppercase;
    font-family:"Arial Black","Helvetica Neue",Impact,Arial,sans-serif;
  }
  .name span{display:block}
  .sub{
    margin-top:10px;font-weight:700;font-size:15px;letter-spacing:.62em;text-transform:uppercase;
    display:flex;align-items:center;gap:12px;
  }
  .sub::before{content:"";height:3px;width:34px;background:var(--clay);flex:none}
  .mono .sub::before{background:currentColor}
  .stack{flex-direction:column;text-align:center;gap:14px}
  .stack .word{align-items:center}
  .stack .name{font-size:34px}
  .stack .sub{font-size:12px;margin-top:8px;letter-spacing:.5em;padding-left:.5em}
  .stack .sub::before{display:none}

  /* small sizes */
  .sizes{display:flex;align-items:flex-end;gap:28px}
  .sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;opacity:.9}
  .tile{background:var(--ink);border-radius:22%;display:grid;place-items:center}

  /* truck */
  .truck{background:#fff;width:100%;max-width:360px;border-radius:6px;padding:14px 18px;display:flex;align-items:center;gap:12px;border:2px solid var(--ink)}
  .truck .name{font-size:22px}
  .truck .sub{font-size:8px;margin-top:5px}
  .truck .sub::before{width:16px;height:2px}
</style>
</head>
<body>
<main>

<!-- Shared symbol: a borehole shaft cut into the earth, reaching water. Flat shapes, no effects. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Full symbol: cut shaft, water bulb filled -->
    <symbol id="mark" viewBox="0 0 100 100">
      <mask id="cut">
        <rect width="100" height="100" fill="#fff"/>
        <rect x="41" y="-2" width="18" height="62" fill="#000"/>
        <circle cx="50" cy="64" r="17" fill="#000"/>
      </mask>
      <circle cx="50" cy="50" r="48" fill="currentColor" mask="url(#cut)"/>
    </symbol>
    <!-- Drop that sits inside the cut (colour version only) -->
    <symbol id="markwater" viewBox="0 0 100 100">
      <mask id="cut2">
        <rect width="100" height="100" fill="#fff"/>
        <rect x="41" y="-2" width="18" height="62" fill="#000"/>
        <circle cx="50" cy="64" r="17" fill="#000"/>
      </mask>
      <circle cx="50" cy="50" r="48" fill="var(--ink)" mask="url(#cut2)"/>
      <circle cx="50" cy="64" r="11" fill="var(--water)"/>
    </symbol>
    <!-- Small-size redraw: heavier shaft, bigger bulb, no fine detail -->
    <symbol id="marksmall" viewBox="0 0 100 100">
      <mask id="cut3">
        <rect width="100" height="100" fill="#fff"/>
        <rect x="36" y="-2" width="28" height="58" fill="#000"/>
        <circle cx="50" cy="64" r="24" fill="#000"/>
      </mask>
      <circle cx="50" cy="50" r="49" fill="currentColor" mask="url(#cut3)"/>
    </symbol>
  </defs>
</svg>

<div class="grid">

  <!-- Primary lockup -->
  <section class="card hero">
    <div class="lockup" role="img" aria-label="Harrow Creek Drilling logo">
      <svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true"><use href="#markwater"/></svg>
      <div class="word">
        <div class="name"><span>Harrow</span><span>Creek</span></div>
        <div class="sub">Drilling</div>
      </div>
    </div>
    <div class="label">Primary lockup, full colour</div>
  </section>

  <!-- One colour on white -->
  <section class="card light">
    <div class="lockup mono" role="img" aria-label="Harrow Creek Drilling, one colour" style="color:#000;transform:scale(.72)">
      <svg width="130" height="130" viewBox="0 0 100 100" aria-hidden="true" style="color:#000"><use href="#mark"/></svg>
      <div class="word">
        <div class="name"><span>Harrow</span><span>Creek</span></div>
        <div class="sub">Drilling</div>
      </div>
    </div>
    <div class="label">Solid black</div>
  </section>

  <!-- Reversed -->
  <section class="card dark">
    <div class="lockup mono" role="img" aria-label="Harrow Creek Drilling, reversed" style="transform:scale(.72)">
      <svg width="130" height="130" viewBox="0 0 100 100" aria-hidden="true" style="color:var(--paper)"><use href="#mark"/></svg>
      <div class="word">
        <div class="name"><span>Harrow</span><span>Creek</span></div>
        <div class="sub">Drilling</div>
      </div>
    </div>
    <div class="label">Reversed</div>
  </section>

  <!-- Stacked -->
  <section class="card light">
    <div class="lockup stack" role="img" aria-label="Harrow Creek Drilling, stacked">
      <svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true"><use href="#markwater"/></svg>
      <div class="word">
        <div class="name"><span>Harrow Creek</span></div>
        <div class="sub">Drilling</div>
      </div>
    </div>
    <div class="label">Stacked</div>
  </section>

  <!-- Symbol alone -->
  <section class="card light">
    <svg width="150" height="150" viewBox="0 0 100 100" role="img" aria-label="Harrow Creek Drilling symbol"><use href="#markwater"/></svg>
    <div class="label">Symbol only</div>
  </section>

  <!-- Small sizes -->
  <section class="card dark">
    <div class="sizes">
      <figure>
        <div class="tile" style="width:96px;height:96px;background:var(--paper)"><svg width="72" height="72" viewBox="0 0 100 100" style="color:var(--ink)" aria-hidden="true"><use href="#marksmall"/></svg></div>96
      </figure>
      <figure>
        <div class="tile" style="width:48px;height:48px;background:var(--paper)"><svg width="36" height="36" viewBox="0 0 100 100" style="color:var(--ink)" aria-hidden="true"><use href="#marksmall"/></svg></div>48
      </figure>
      <figure>
        <div class="tile" style="width:32px;height:32px;background:var(--paper)"><svg width="24" height="24" viewBox="0 0 100 100" style="color:var(--ink)" aria-hidden="true"><use href="#marksmall"/></svg></div>32
      </figure>
      <figure>
        <div class="tile" style="width:16px;height:16px;background:var(--paper);border-radius:3px"><svg width="14" height="14" viewBox="0 0 100 100" style="color:var(--ink)" aria-hidden="true"><use href="#marksmall"/></svg></div>16
      </figure>
    </div>
    <div class="label">App icon and favicon sizes (heavier redraw)</div>
  </section>

  <!-- Truck door -->
  <section class="card" style="background:#d8d2c3">
    <div class="truck" role="img" aria-label="Logo on a truck door">
      <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><use href="#markwater"/></svg>
      <div class="word" style="color:var(--ink)">
        <div class="name"><span style="display:inline">Harrow Creek</span></div>
        <div class="sub">Drilling</div>
      </div>
    </div>
    <div class="label">On a truck door</div>
  </section>

</div>
</main>
</body>
</html>
