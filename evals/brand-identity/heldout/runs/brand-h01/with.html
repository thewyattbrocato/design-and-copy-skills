<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling – Logo</title>
<style>
  :root{
    --earth:#2E2219;
    --water:#2A7BA6;
    --water-lt:#6BB6DB;
    --paper:#F4EFE6;
    --font:"Helvetica Neue","Arial Black",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--earth);font-family:var(--font);padding:40px 24px 64px}
  main{max-width:960px;margin:0 auto}
  h1{font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 28px;font-weight:700;color:#6b5d50}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a6c5f;margin:0 0 10px;font-weight:600}
  .on-dark .label{color:#b9ab9c}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
  .panel{border:1px solid #e3dbcf;border-radius:6px;padding:28px;display:flex;flex-direction:column}
  .panel .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:170px}
  .wide{grid-column:1/-1}
  .paper{background:var(--paper)}
  .white{background:#fff}
  .on-dark{background:var(--earth);border-color:var(--earth);color:var(--paper)}

  /* lockups */
  .lockup{display:flex;align-items:center;gap:22px}
  .lockup svg{width:96px;height:96px;flex:none}
  .word{display:flex;flex-direction:column;line-height:1}
  .word .name{font-weight:900;font-size:40px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
  .word .sub{display:flex;align-items:center;gap:12px;margin-top:10px;font-weight:700;font-size:15px;letter-spacing:.5em;text-transform:uppercase}
  .word .sub::before,.word .sub::after{content:"";height:3px;background:currentColor;flex:1}
  .word .sub span{margin-right:-.5em}

  .stacked{flex-direction:column;gap:16px;text-align:center}
  .stacked svg{width:110px;height:110px}
  .stacked .word{align-items:stretch}
  .stacked .name{font-size:30px}
  .stacked .sub{font-size:13px}

  .mono{color:#000;--m:#000;--w:none}
  .full{--m:var(--earth);--w:var(--water)}
  .rev{--m:var(--paper);--w:var(--water-lt)}
  .sizes{display:flex;align-items:flex-end;gap:28px}
  .sizes svg{display:block}
  .sizes figure{margin:0;text-align:center;font-size:10px;letter-spacing:.1em;color:#7a6c5f}
  .sizes figcaption{margin-top:8px}

  /* truck door */
  .truck{background:#d9d2c4;border-radius:4px;padding:26px 30px;width:100%;max-width:420px;border:1px solid #bfb6a6}
  .truck .lockup svg{width:64px;height:64px}
  .truck .name{font-size:24px}
  .truck .sub{font-size:10px;margin-top:7px}
  @media (max-width:760px){
    .grid{grid-template-columns:1fr}
    .word .name{font-size:26px}
    .lockup svg{width:68px;height:68px}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Idea: a bore drilled from the surface down to water. Flat shapes, no gradients. -->
    <symbol id="mark" viewBox="0 0 100 100">
      <path fill="var(--m)" d="M12 4H43V44C37 51 32 58 32 66A18 18 0 0 0 68 66C68 58 63 51 57 44V4H88Q96 4 96 12V88Q96 96 88 96H12Q4 96 4 88V12Q4 4 12 4Z"/>
      <path fill="var(--w)" d="M43 44C37 51 32 58 32 66A18 18 0 0 0 68 66C68 58 63 51 57 44Z"/>
    </symbol>
    <!-- Small-size redraw: wider shaft, larger drop -->
    <symbol id="mark-sm" viewBox="0 0 100 100">
      <path fill="var(--m)" d="M12 2H40V38C32 46 27 54 27 64A23 23 0 0 0 73 64C73 54 68 46 60 38V2H88Q98 2 98 12V88Q98 98 88 98H12Q2 98 2 88V12Q2 2 12 2Z"/>
      <path fill="var(--w)" d="M40 38C32 46 27 54 27 64A23 23 0 0 0 73 64C73 54 68 46 60 38Z"/>
    </symbol>
  </defs>
</svg>

<main>
  <h1>Harrow Creek Drilling · Logo</h1>

  <section class="panel paper wide">
    <p class="label">Primary · horizontal</p>
    <div class="stage">
      <div class="lockup full">
        <svg role="img" aria-label="Harrow Creek Drilling mark"><title>Harrow Creek Drilling mark</title><use href="#mark"/></svg>
        <div class="word">
          <span class="name">Harrow Creek</span>
          <span class="sub"><span>Drilling</span></span>
        </div>
      </div>
    </div>
  </section>

  <div class="grid">
    <section class="panel paper">
      <p class="label">Stacked</p>
      <div class="stage">
        <div class="lockup stacked full">
          <svg aria-hidden="true"><use href="#mark"/></svg>
          <div class="word">
            <span class="name">Harrow Creek</span>
            <span class="sub"><span>Drilling</span></span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel on-dark">
      <p class="label">Reversed</p>
      <div class="stage">
        <div class="lockup rev">
          <svg aria-hidden="true"><use href="#mark"/></svg>
          <div class="word">
            <span class="name" style="font-size:26px">Harrow Creek</span>
            <span class="sub" style="font-size:11px"><span>Drilling</span></span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel white">
      <p class="label">One color · black</p>
      <div class="stage">
        <div class="lockup mono">
          <svg aria-hidden="true"><use href="#mark"/></svg>
          <div class="word">
            <span class="name" style="font-size:26px">Harrow Creek</span>
            <span class="sub" style="font-size:11px"><span>Drilling</span></span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel white">
      <p class="label">Symbol alone · icon sizes (small sizes redrawn)</p>
      <div class="stage">
        <div class="sizes">
          <figure class="full"><svg width="96" height="96" role="img" aria-label="Symbol"><title>Symbol</title><use href="#mark"/></svg><figcaption>96</figcaption></figure>
          <figure class="full"><svg width="48" height="48" aria-hidden="true"><use href="#mark-sm"/></svg><figcaption>48</figcaption></figure>
          <figure class="full"><svg width="32" height="32" aria-hidden="true"><use href="#mark-sm"/></svg><figcaption>32</figcaption></figure>
          <figure class="full"><svg width="16" height="16" aria-hidden="true"><use href="#mark-sm"/></svg><figcaption>16</figcaption></figure>
          <figure class="mono"><svg width="32" height="32" aria-hidden="true"><use href="#mark-sm"/></svg><figcaption>32 mono</figcaption></figure>
        </div>
      </div>
    </section>

    <section class="panel paper wide">
      <p class="label">On a truck door (mock)</p>
      <div class="stage">
        <div class="truck">
          <div class="lockup full">
            <svg aria-hidden="true"><use href="#mark"/></svg>
            <div class="word">
              <span class="name">Harrow Creek</span>
              <span class="sub"><span>Drilling</span></span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
</body>
</html>
