<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling – Logo</title>
<style>
  :root{
    --earth:#2f2a24;
    --water:#1f7a99;
    --water-lt:#5bb6d3;
    --paper:#f4efe6;
    --night:#1e1b17;
    --display:"Haettenschweiler","Arial Narrow","Helvetica Neue Condensed Bold",Impact,"Franklin Gothic Medium",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--earth);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
  main{max-width:980px;margin:0 auto;padding:40px 24px 64px}
  h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0 0 24px;color:#6b645a}
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin:0 0 12px;color:#8a8277}
  section{margin-bottom:36px}
  .panel{border-radius:6px;display:flex;align-items:center;justify-content:center;padding:48px 24px}
  .light{background:var(--paper);--g:var(--earth);--w:var(--water);color:var(--earth)}
  .white{background:#fff;border:1px solid #ddd6c9;--g:#000;--w:#000;color:#000}
  .dark{background:var(--night);--g:var(--paper);--w:var(--water-lt);color:var(--paper)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:700px){.grid{grid-template-columns:1fr}}

  /* lockup */
  .lockup{display:flex;align-items:center;gap:22px}
  .lockup svg{width:96px;height:96px;color:var(--g);flex:none}
  .word{font-family:var(--display);text-transform:uppercase;line-height:.9;color:var(--g)}
  .word .a{display:block;font-size:56px;letter-spacing:.04em;font-weight:700}
  .word .b{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:23px;letter-spacing:.42em;font-weight:700}
  .word .b::before{content:"";height:3px;width:28px;background:var(--g);flex:none}
  /* the I of DRILLING echoes the borehole */
  .word .b i{font-style:normal;color:var(--w)}
  .lockup.sm svg{width:56px;height:56px}
  .lockup.sm .a{font-size:32px}
  .lockup.sm .b{font-size:13px;margin-top:5px}
  .lockup.sm .b::before{width:16px;height:2px}

  .stack{flex-direction:column;text-align:center;gap:14px}
  .stack .b{justify-content:center}
  .stack .b::before{display:none}

  .sizes{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}
  .sizes figure{margin:0;text-align:center;font-size:11px;color:#8a8277}
  .sizes svg{display:block;margin:0 auto 6px;color:var(--g)}
  .dark .sizes figure{color:#a79f93}

  /* truck door */
  .truck{background:#c9382c;border-radius:6px;padding:36px 24px;display:flex;justify-content:center;--g:#fff;--w:#fff;color:#fff}
  .door{background:#e8e2d6;border-radius:4px;padding:26px 34px;--g:var(--earth);--w:var(--water)}
</style>
</head>
<body>
<main>
  <h1>Harrow Creek Drilling · Logo</h1>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- Master mark: a borehole cut down through the ground to water -->
      <symbol id="mark" viewBox="0 0 120 120">
        <path fill="currentColor" d="M12.63 44H51V84a9 9 0 0 0 18 0V44H107.37A50 50 0 1 1 12.63 44Z"/>
        <path style="fill:var(--w,currentColor)" d="M54 72V84a6 6 0 0 0 12 0V72Z"/>
      </symbol>
      <!-- Small-size drawing: wider borehole, heavier water, no fine gaps -->
      <symbol id="mark-sm" viewBox="0 0 120 120">
        <path fill="currentColor" d="M12.63 44H48V86a12 12 0 0 0 24 0V44H107.37A50 50 0 1 1 12.63 44Z"/>
        <path style="fill:var(--w,currentColor)" d="M53 70V86a7 7 0 0 0 14 0V70Z"/>
      </symbol>
    </defs>
  </svg>

  <section>
    <h2>Primary lockup</h2>
    <div class="panel light">
      <div class="lockup">
        <svg viewBox="0 0 120 120" role="img" aria-label="Harrow Creek Drilling mark: a borehole cut down through the ground to water"><title>Harrow Creek Drilling</title><use href="#mark"/></svg>
        <div class="word"><span class="a">Harrow Creek</span><span class="b">Dr<i>I</i>lling</span></div>
      </div>
    </div>
  </section>

  <section class="grid">
    <div>
      <h2>One color</h2>
      <div class="panel white">
        <div class="lockup sm">
          <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#mark"/></svg>
          <div class="word"><span class="a">Harrow Creek</span><span class="b">Dr<i>I</i>lling</span></div>
        </div>
      </div>
    </div>
    <div>
      <h2>Reversed</h2>
      <div class="panel dark">
        <div class="lockup sm">
          <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#mark"/></svg>
          <div class="word"><span class="a">Harrow Creek</span><span class="b">Dr<i>I</i>lling</span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="grid">
    <div>
      <h2>Stacked</h2>
      <div class="panel light">
        <div class="lockup stack">
          <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#mark"/></svg>
          <div class="word"><span class="a">Harrow Creek</span><span class="b">Dr<i>I</i>lling</span></div>
        </div>
      </div>
    </div>
    <div>
      <h2>Symbol only · large and small sizes</h2>
      <div class="panel light">
        <div class="sizes">
          <figure><svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><use href="#mark"/></svg>master</figure>
          <figure><svg width="48" height="48" viewBox="0 0 120 120" aria-hidden="true"><use href="#mark-sm"/></svg>48</figure>
          <figure><svg width="32" height="32" viewBox="0 0 120 120" aria-hidden="true"><use href="#mark-sm"/></svg>32</figure>
          <figure><svg width="16" height="16" viewBox="0 0 120 120" aria-hidden="true"><use href="#mark-sm"/></svg>16</figure>
        </div>
      </div>
    </div>
  </section>

  <section class="grid">
    <div>
      <h2>Truck door (one color, white on paint)</h2>
      <div class="truck">
        <div class="lockup sm">
          <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#mark"/></svg>
          <div class="word"><span class="a">Harrow Creek</span><span class="b">Dr<i>I</i>lling</span></div>
        </div>
      </div>
    </div>
    <div>
      <h2>App icon / avatar</h2>
      <div class="panel dark" style="gap:20px">
        <svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="App icon" style="--g:var(--paper);--w:var(--water-lt)">
          <rect width="96" height="96" rx="22" fill="#2f2a24"/>
          <svg x="18" y="18" width="60" height="60" viewBox="0 0 120 120" style="color:var(--paper)"><use href="#mark-sm"/></svg>
        </svg>
        <svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Round avatar" style="--w:#fff">
          <circle cx="48" cy="48" r="48" fill="#1f7a99"/>
          <svg x="20" y="20" width="56" height="56" viewBox="0 0 120 120" style="color:#fff"><use href="#mark-sm"/></svg>
        </svg>
      </div>
    </div>
  </section>
</main>
</body>
</html>
