<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling – Logo</title>
<style>
  :root { --ink:#16424f; --earth:#b8661d; --paper:#ffffff; --sand:#f4efe6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--sand); color:var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 24px; font-weight: 700; }
  .grid { display:grid; gap:16px; grid-template-columns: repeat(6, 1fr); }
  .card { background:var(--paper); border-radius:6px; padding:24px; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:14px; }
  .card small { font-size:12px; letter-spacing:.06em; text-transform:uppercase; opacity:.65; align-self:flex-start; }
  .wide { grid-column: span 6; }
  .half { grid-column: span 3; }
  .third { grid-column: span 2; }
  .dark { background:var(--ink); color:#fff; }
  .dark small { opacity:.75; }
  .mono { color:#000; }
  .truck { background:#d9d4c8; }
  .door { background:#e9e6df; border:2px solid #b9b3a4; border-radius:8px; padding:22px 26px; width:100%; max-width:360px; }
  .sizes { display:flex; align-items:flex-end; gap:22px; }
  .tile { background:var(--ink); color:#fff; border-radius:22%; display:grid; place-items:center; }
  svg { display:block; }
  .lock { --accent: var(--earth); }
  .mono .lock, .dark .lock { --accent: currentColor; }
  @media (max-width:700px){ .half,.third{ grid-column: span 6; } }
</style>
</head>
<body>
<main>
  <h1>Harrow Creek Drilling — Logo</h1>

  <!-- Shared symbol definitions. Idea: a borehole drilled down through the ground into a drop of water. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- Full mark: shaft and ground line cut out as negative space -->
      <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
        <rect width="100" height="100" fill="#fff"/>
        <rect x="45" y="0" width="10" height="62" fill="#000"/>
        <rect x="0" y="34" width="100" height="5" fill="#000"/>
      </mask>
      <!-- Small mark: heavier shaft, no ground line, for 16–32 px -->
      <mask id="cut-sm" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
        <rect width="100" height="100" fill="#fff"/>
        <rect x="42" y="0" width="16" height="64" fill="#000"/>
      </mask>
      <symbol id="mark" viewBox="0 0 100 100">
        <path mask="url(#cut)" fill="currentColor"
              d="M50 4C50 4 17 40 17 63a33 33 0 0 0 66 0C83 40 50 4 50 4Z"/>
      </symbol>
      <symbol id="mark-sm" viewBox="0 0 100 100">
        <path mask="url(#cut-sm)" fill="currentColor"
              d="M50 2C50 2 12 40 12 64a38 38 0 0 0 76 0C88 40 50 2 50 2Z"/>
      </symbol>
    </defs>
  </svg>

  <div class="grid">

    <!-- Primary horizontal lockup -->
    <div class="card wide">
      <small>Primary · horizontal</small>
      <!-- Wordmark is live text: font stack system-ui, heavy weight. Convert to outlines for production. -->
      <svg class="lock" viewBox="0 0 420 110" width="520" style="max-width:100%;height:auto" role="img">
        <title>Harrow Creek Drilling</title>
        <use href="#mark" x="0" y="5" width="100" height="100" style="color:var(--ink)"/>
        <text x="118" y="60" font-size="40" font-weight="800" fill="#16424f"
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              textLength="290" lengthAdjust="spacing">HARROW CREEK</text>
        <rect x="118" y="72" width="290" height="3" fill="var(--accent)"/>
        <text x="118" y="102" font-size="21" font-weight="700" fill="var(--accent)"
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              textLength="290" lengthAdjust="spacing">DRILLING</text>
      </svg>
    </div>

    <!-- Stacked -->
    <div class="card third">
      <small>Stacked</small>
      <svg class="lock" viewBox="0 0 300 200" width="240" style="max-width:100%;height:auto" role="img">
        <title>Harrow Creek Drilling</title>
        <use href="#mark" x="100" y="0" width="100" height="100" style="color:var(--ink)"/>
        <text x="10" y="144" font-size="33" font-weight="800" fill="#16424f"
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              textLength="280" lengthAdjust="spacing">HARROW CREEK</text>
        <text x="10" y="180" font-size="19" font-weight="700" fill="var(--accent)"
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              textLength="280" lengthAdjust="spacing">DRILLING</text>
      </svg>
    </div>

    <!-- One color -->
    <div class="card third mono">
      <small>One color · black</small>
      <svg class="lock" viewBox="0 0 300 200" width="240" style="max-width:100%;height:auto" role="img">
        <title>Harrow Creek Drilling, one color</title>
        <use href="#mark" x="100" y="0" width="100" height="100" style="color:currentColor"/>
        <text x="10" y="144" font-size="33" font-weight="800" fill="currentColor"
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              textLength="280" lengthAdjust="spacing">HARROW CREEK</text>
        <text x="10" y="180" font-size="19" font-weight="700" fill="currentColor"
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              textLength="280" lengthAdjust="spacing">DRILLING</text>
      </svg>
    </div>

    <!-- Reversed -->
    <div class="card third dark">
      <small>Reversed</small>
      <svg class="lock" viewBox="0 0 300 200" width="240" style="max-width:100%;height:auto" role="img">
        <title>Harrow Creek Drilling, reversed</title>
        <use href="#mark" x="100" y="0" width="100" height="100" style="color:#fff"/>
        <text x="10" y="144" font-size="33" font-weight="800" fill="#fff"
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              textLength="280" lengthAdjust="spacing">HARROW CREEK</text>
        <text x="10" y="180" font-size="19" font-weight="700" fill="#fff"
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              textLength="280" lengthAdjust="spacing">DRILLING</text>
      </svg>
    </div>

    <!-- Symbol + small sizes -->
    <div class="card half">
      <small>Symbol alone</small>
      <svg width="130" height="130" role="img" style="color:var(--ink)"><title>Harrow Creek mark</title><use href="#mark" width="130" height="130"/></svg>
    </div>

    <div class="card half">
      <small>Icon sizes · simplified small drawing</small>
      <div class="sizes">
        <div class="tile" style="width:96px;height:96px"><svg width="64" height="64" aria-hidden="true"><use href="#mark-sm" width="64" height="64"/></svg></div>
        <div class="tile" style="width:48px;height:48px"><svg width="32" height="32" aria-hidden="true"><use href="#mark-sm" width="32" height="32"/></svg></div>
        <div class="tile" style="width:24px;height:24px;border-radius:4px"><svg width="16" height="16" aria-hidden="true"><use href="#mark-sm" width="16" height="16"/></svg></div>
        <svg width="16" height="16" aria-hidden="true" style="color:var(--ink)"><use href="#mark-sm" width="16" height="16"/></svg>
      </div>
    </div>

    <!-- Truck door surface -->
    <div class="card wide truck">
      <small>On the truck door</small>
      <div class="door">
        <svg class="lock" viewBox="0 0 420 110" width="100%" style="height:auto" role="img">
          <title>Harrow Creek Drilling</title>
          <use href="#mark" x="0" y="5" width="100" height="100" style="color:var(--ink)"/>
          <text x="118" y="60" font-size="40" font-weight="800" fill="#16424f"
                font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
                textLength="290" lengthAdjust="spacing">HARROW CREEK</text>
          <rect x="118" y="72" width="290" height="3" fill="var(--accent)"/>
          <text x="118" y="102" font-size="21" font-weight="700" fill="var(--accent)"
                font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
                textLength="290" lengthAdjust="spacing">DRILLING</text>
        </svg>
      </div>
    </div>

  </div>
</main>
</body>
</html>
