<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling — Logo</title>
<style>
  :root {
    --earth: #3b2a1c;
    --clay: #b5622b;
    --cream: #f4ead8;
    --water: #2f6f8f;
    --deep: #1d4659;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 32px;
    background: #e9e1d0;
    font-family: "Rockwell", "Georgia", "Times New Roman", serif;
    padding: 24px;
  }
  .logo { width: min(92vw, 520px); height: auto; display: block; filter: drop-shadow(0 6px 14px rgba(59,42,28,.25)); }
  .row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: center; }
  .chip { border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center; }
  .chip svg { width: 150px; height: auto; display: block; }
  .dark { background: var(--earth); }
  .light { background: #fff; }
  .water { background: var(--water); }
</style>
</head>
<body>

<svg class="logo" viewBox="0 0 520 520" role="img" aria-labelledby="t1 d1" xmlns="http://www.w3.org/2000/svg">
  <title id="t1">Harrow Creek Drilling logo</title>
  <desc id="d1">A round badge with a drill derrick over rolling fields and a creek, with the company name around it.</desc>
  <defs>
    <clipPath id="disc"><circle cx="260" cy="236" r="150"/></clipPath>
    <path id="arcTop" d="M 76 236 A 184 184 0 0 1 444 236"/>
    <path id="arcBot" d="M 62 236 A 198 198 0 0 0 458 236"/>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c98a"/>
      <stop offset="1" stop-color="#f4ead8"/>
    </linearGradient>
  </defs>

  <!-- outer rings -->
  <circle cx="260" cy="236" r="226" fill="#3b2a1c"/>
  <circle cx="260" cy="236" r="216" fill="none" stroke="#f4ead8" stroke-width="2"/>
  <circle cx="260" cy="236" r="160" fill="#f4ead8"/>
  <circle cx="260" cy="236" r="154" fill="#3b2a1c"/>

  <!-- name on top -->
  <text font-family="Rockwell, Georgia, 'Times New Roman', serif" font-weight="700" font-size="38" letter-spacing="6" fill="#f4ead8" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%" side="left" transform="translate(0,0)">HARROW CREEK</textPath>
  </text>

  <!-- scene -->
  <g clip-path="url(#disc)">
    <rect x="100" y="86" width="320" height="300" fill="url(#sky)"/>
    <!-- sun -->
    <circle cx="340" cy="196" r="26" fill="#e8913a"/>
    <!-- far hills -->
    <path d="M100 262 Q170 222 240 252 T420 240 L420 390 L100 390 Z" fill="#8a9a5b"/>
    <!-- near field -->
    <path d="M100 292 Q190 256 280 286 T420 276 L420 390 L100 390 Z" fill="#b5622b"/>
    <!-- furrows -->
    <g stroke="#8c4619" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7">
      <path d="M110 318 Q200 288 300 312 T420 306"/>
      <path d="M110 340 Q210 312 310 336 T420 330"/>
    </g>
    <!-- creek -->
    <path d="M232 390 C240 360 280 350 270 320 C262 298 236 296 246 284 L262 284 C256 298 288 306 296 324 C306 352 272 366 282 390 Z" fill="#2f6f8f"/>
    <path d="M246 384 C254 364 288 352 280 326" stroke="#a9d3e3" stroke-width="2" fill="none" opacity=".8"/>

    <!-- derrick -->
    <g fill="none" stroke="#3b2a1c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M190 292 L226 118 L262 292"/>
      <path d="M200 244 L252 244"/>
      <path d="M206 208 L246 208"/>
      <path d="M212 176 L240 176"/>
      <path d="M200 244 L246 208 M252 244 L206 208 M206 208 L240 176 M246 208 L212 176" stroke-width="3"/>
      <path d="M200 292 L252 244 M252 292 L200 244" stroke-width="3"/>
    </g>
    <!-- crown -->
    <rect x="216" y="108" width="20" height="14" rx="2" fill="#3b2a1c"/>
    <!-- drill pipe -->
    <rect x="223" y="122" width="6" height="190" fill="#3b2a1c"/>
    <!-- base -->
    <rect x="176" y="290" width="100" height="10" rx="2" fill="#3b2a1c"/>
    <!-- water drop -->
    <path d="M226 322 C226 322 212 340 212 350 A14 14 0 0 0 240 350 C240 340 226 322 226 322 Z" fill="#2f6f8f" stroke="#f4ead8" stroke-width="3"/>
  </g>

  <!-- banner -->
  <path d="M60 372 L100 362 L420 362 L460 372 L440 396 L460 420 L420 430 L100 430 L60 420 L80 396 Z" fill="#b5622b" stroke="#f4ead8" stroke-width="3" stroke-linejoin="round"/>
  <text x="260" y="408" font-family="Rockwell, Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" letter-spacing="8" fill="#f4ead8" text-anchor="middle">DRILLING</text>

  <!-- tagline -->
  <text x="260" y="472" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#3b2a1c" text-anchor="middle" letter-spacing="2">Clean water from deep down</text>
  <g stroke="#3b2a1c" stroke-width="2" stroke-linecap="round">
    <path d="M70 466 L120 466"/>
    <path d="M400 466 L450 466"/>
  </g>
</svg>

<div class="row">
  <div class="chip light">
    <svg viewBox="0 0 120 120" aria-label="Harrow Creek icon">
      <circle cx="60" cy="60" r="56" fill="#3b2a1c"/>
      <path d="M36 92 L60 24 L84 92" fill="none" stroke="#f4ead8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M44 70 L76 70 M50 50 L70 50" stroke="#f4ead8" stroke-width="4" stroke-linecap="round"/>
      <rect x="57.5" y="24" width="5" height="62" fill="#f4ead8"/>
      <path d="M60 84 C60 84 48 98 48 104 A12 12 0 0 0 72 104 C72 98 60 84 60 84 Z" fill="#2f6f8f" transform="translate(0,-8) scale(1)"/>
    </svg>
  </div>
  <div class="chip dark">
    <svg viewBox="0 0 120 120" aria-label="Harrow Creek icon, reversed">
      <circle cx="60" cy="60" r="56" fill="#f4ead8"/>
      <path d="M36 92 L60 24 L84 92" fill="none" stroke="#3b2a1c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M44 70 L76 70 M50 50 L70 50" stroke="#3b2a1c" stroke-width="4" stroke-linecap="round"/>
      <rect x="57.5" y="24" width="5" height="62" fill="#3b2a1c"/>
      <path d="M60 84 C60 84 48 98 48 104 A12 12 0 0 0 72 104 C72 98 60 84 60 84 Z" fill="#b5622b" transform="translate(0,-8)"/>
    </svg>
  </div>
  <div class="chip water">
    <svg viewBox="0 0 120 120" aria-label="Harrow Creek icon on blue">
      <circle cx="60" cy="60" r="56" fill="#1d4659"/>
      <path d="M36 92 L60 24 L84 92" fill="none" stroke="#f4ead8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M44 70 L76 70 M50 50 L70 50" stroke="#f4ead8" stroke-width="4" stroke-linecap="round"/>
      <rect x="57.5" y="24" width="5" height="62" fill="#f4ead8"/>
      <path d="M60 84 C60 84 48 98 48 104 A12 12 0 0 0 72 104 C72 98 60 84 60 84 Z" fill="#f6c98a" transform="translate(0,-8)"/>
    </svg>
  </div>
</div>

</body>
</html>
