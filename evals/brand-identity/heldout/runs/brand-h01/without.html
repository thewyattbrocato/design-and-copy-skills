<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling – Logo</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ece5d6;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .stage {
    display: flex;
    flex-direction: column;
    gap: 28px;
    align-items: center;
    padding: 32px;
  }
  .logo { width: min(560px, 90vw); height: auto; display: block; }
  .small-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .chip {
    padding: 16px 20px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chip svg { width: 120px; height: auto; display: block; }
</style>
</head>
<body>
<div class="stage">

  <!-- Primary logo -->
  <svg class="logo" viewBox="0 0 560 560" role="img" aria-labelledby="t1 d1" xmlns="http://www.w3.org/2000/svg">
    <title id="t1">Harrow Creek Drilling logo</title>
    <desc id="d1">A circular badge with a drilling derrick over rolling hills, a creek, and an underground water drop, with the company name around it.</desc>
    <defs>
      <path id="topArc" d="M 80 280 A 200 200 0 0 1 480 280"/>
      <path id="botArc" d="M 62 280 A 218 218 0 0 0 498 280"/>
      <clipPath id="inner"><circle cx="280" cy="280" r="165"/></clipPath>
    </defs>

    <!-- outer badge -->
    <circle cx="280" cy="280" r="268" fill="#1f3a2e"/>
    <circle cx="280" cy="280" r="256" fill="none" stroke="#e8b04a" stroke-width="4"/>
    <circle cx="280" cy="280" r="178" fill="none" stroke="#e8b04a" stroke-width="3"/>

    <!-- ring text -->
    <text font-size="50" font-weight="800" letter-spacing="7" fill="#f4ecd8" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif">
      <textPath href="#topArc" startOffset="50%">HARROW CREEK</textPath>
    </text>
    <text font-size="38" font-weight="800" letter-spacing="14" fill="#e8b04a" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif">
      <textPath href="#botArc" startOffset="50%" dominant-baseline="hanging">DRILLING</textPath>
    </text>

    <!-- side stars -->
    <polygon points="44,280 50,292 63,293 53,301 56,314 44,307 32,314 35,301 25,293 38,292" fill="#e8b04a" transform="translate(6,-14) scale(.9)"/>
    <polygon points="44,280 50,292 63,293 53,301 56,314 44,307 32,314 35,301 25,293 38,292" fill="#e8b04a" transform="translate(468,-14) scale(.9)"/>

    <!-- scene -->
    <g clip-path="url(#inner)">
      <!-- sky -->
      <rect x="110" y="110" width="340" height="340" fill="#f1dfb3"/>
      <circle cx="368" cy="215" r="34" fill="#e8b04a"/>
      <!-- far hills -->
      <path d="M115 330 Q 180 270 250 315 T 395 300 T 450 320 L 450 450 L 115 450 Z" fill="#7d9a6a"/>
      <!-- near hills -->
      <path d="M115 360 Q 190 315 270 352 T 450 345 L 450 450 L 115 450 Z" fill="#4f7a55"/>
      <!-- creek -->
      <path d="M232 450 C 250 420 300 410 290 385 C 282 365 255 362 262 350 L 288 350 C 282 362 312 368 322 388 C 334 415 290 428 285 450 Z" fill="#6fb3c9"/>
      <!-- underground -->
      <rect x="110" y="392" width="340" height="60" fill="#5a3d2b"/>
      <path d="M110 392 Q 200 380 280 394 T 450 390 L 450 396 L 110 396 Z" fill="#3f2a1d"/>
      <!-- bore line -->
      <rect x="276" y="318" width="8" height="90" fill="#2b1c12" opacity=".0"/>
      <line x1="280" y1="345" x2="280" y2="415" stroke="#c9c1ad" stroke-width="4" stroke-dasharray="2 0"/>
      <!-- water drop -->
      <path d="M280 398 C 280 398 264 416 264 427 A 16 16 0 0 0 296 427 C 296 416 280 398 280 398 Z" fill="#6fb3c9" stroke="#f4ecd8" stroke-width="2"/>
      <path d="M273 427 A 8 8 0 0 0 281 435" fill="none" stroke="#f4ecd8" stroke-width="2" stroke-linecap="round"/>
      <!-- derrick -->
      <g fill="none" stroke="#1f3a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M280 168 L 238 350 M280 168 L 322 350"/>
        <path d="M229 350 L 331 350" stroke-width="7"/>
        <path d="M269 214 L 291 214 M261 250 L 299 250 M253 286 L 307 286 M245 320 L 315 320" stroke-width="4"/>
        <path d="M269 214 L 299 250 M291 214 L 261 250 M261 250 L 307 286 M299 250 L 253 286 M253 286 L 315 320 M307 286 L 245 320" stroke-width="3"/>
      </g>
      <!-- crown block -->
      <rect x="268" y="156" width="24" height="16" rx="3" fill="#1f3a2e"/>
      <rect x="276" y="140" width="8" height="18" fill="#1f3a2e"/>
      <path d="M284 142 L 304 149 L 284 156 Z" fill="#c8553d"/>
    </g>
  </svg>

  <!-- Small variants -->
  <div class="small-row">
    <div class="chip" style="background:#1f3a2e">
      <svg viewBox="0 0 300 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harrow Creek Drilling horizontal wordmark, light">
        <g transform="translate(6,6)">
          <circle cx="29" cy="29" r="28" fill="none" stroke="#e8b04a" stroke-width="3"/>
          <path d="M29 10 L 20 46 M29 10 L 38 46 M17 46 L 41 46 M24 28 L 34 28 M22 37 L 36 37" stroke="#f4ecd8" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M29 50 C 29 50 25 55 25 57 A 4 4 0 0 0 33 57 C 33 55 29 50 29 50 Z" fill="#6fb3c9" transform="translate(0,-4)"/>
        </g>
        <text x="74" y="36" font-size="25" font-weight="800" letter-spacing="2" fill="#f4ecd8" font-family="Impact, 'Arial Black', Arial, sans-serif">HARROW CREEK</text>
        <text x="75" y="58" font-size="15" font-weight="700" letter-spacing="9" fill="#e8b04a" font-family="Impact, 'Arial Black', Arial, sans-serif">DRILLING</text>
      </svg>
    </div>
    <div class="chip" style="background:#f4ecd8">
      <svg viewBox="0 0 300 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harrow Creek Drilling horizontal wordmark, dark">
        <g transform="translate(6,6)">
          <circle cx="29" cy="29" r="28" fill="none" stroke="#1f3a2e" stroke-width="3"/>
          <path d="M29 10 L 20 46 M29 10 L 38 46 M17 46 L 41 46 M24 28 L 34 28 M22 37 L 36 37" stroke="#1f3a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M29 50 C 29 50 25 55 25 57 A 4 4 0 0 0 33 57 C 33 55 29 50 29 50 Z" fill="#3b8aa3" transform="translate(0,-4)"/>
        </g>
        <text x="74" y="36" font-size="25" font-weight="800" letter-spacing="2" fill="#1f3a2e" font-family="Impact, 'Arial Black', Arial, sans-serif">HARROW CREEK</text>
        <text x="75" y="58" font-size="15" font-weight="700" letter-spacing="9" fill="#c8553d" font-family="Impact, 'Arial Black', Arial, sans-serif">DRILLING</text>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
