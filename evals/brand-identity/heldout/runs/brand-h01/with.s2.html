<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling — Logo</title>
<style>
  :root{--ink:#16282c;--water:#1b6f80;--earth:#c4742a;--paper:#f6f2ea;--night:#12201f}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e5dc;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;padding:32px 20px 48px}
  main{max-width:960px;margin:0 auto;display:grid;gap:20px}
  h1{font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;font-weight:700}
  p.note{margin:0;font-size:14px;color:#4a5a5c;line-height:1.5}
  .panel{border-radius:10px;padding:36px;display:flex;align-items:center;justify-content:center;position:relative}
  .panel small{position:absolute;left:14px;top:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
  .light{background:#fff}
  .dark{background:var(--night);color:#f6f2ea}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .lockup{width:100%;max-width:520px;height:auto}
  .sizes{display:flex;align-items:flex-end;gap:28px}
  .sizes span{display:block;font-size:11px;text-align:center;margin-top:8px;opacity:.7}
  .truck{background:#dcd6c8;padding:28px 20px}
  .door{background:#f6f2ea;border-radius:8px 8px 4px 4px;width:100%;max-width:440px;padding:26px 22px;box-shadow:inset 0 0 0 2px #cfc7b4}
  .bar{height:6px;background:var(--earth);margin-top:16px;border-radius:2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Mark: a disc with a borehole opening at the surface and a drop of water below it. -->
    <symbol id="mark" viewBox="0 0 100 100">
      <mask id="cut">
        <rect width="100" height="100" fill="#fff"/>
        <rect x="44" y="0" width="12" height="38" fill="#000"/>
        <path d="M50 47C50 47 35 61 35 70a15 15 0 0 0 30 0C65 61 50 47 50 47Z" fill="#000"/>
      </mask>
      <circle cx="50" cy="50" r="46" fill="currentColor" mask="url(#cut)"/>
    </symbol>
    <!-- Small-size redraw: wider shaft, bigger drop, no fine gaps. -->
    <symbol id="mark-s" viewBox="0 0 100 100">
      <mask id="cut-s">
        <rect width="100" height="100" fill="#fff"/>
        <rect x="41" y="0" width="18" height="36" fill="#000"/>
        <path d="M50 44C50 44 30 60 30 71a20 20 0 0 0 40 0C70 60 50 44 50 44Z" fill="#000"/>
      </mask>
      <circle cx="50" cy="50" r="48" fill="currentColor" mask="url(#cut-s)"/>
    </symbol>
    <!-- Lockup. Live text, stack: Arial Narrow / Helvetica Neue / Arial. -->
    <symbol id="lockup" viewBox="0 0 440 110">
      <use href="#mark" width="104" height="104" x="0" y="3"/>
      <text x="126" y="60" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="52" textLength="310" lengthAdjust="spacingAndGlyphs" fill="currentColor">HARROW CREEK</text>
      <rect x="126" y="70" width="310" height="3" fill="currentColor"/>
      <text x="126" y="102" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="22" textLength="310" lengthAdjust="spacing" fill="currentColor">DRILLING</text>
    </symbol>
  </defs>
</svg>

<main>
  <div>
    <h1>Harrow Creek Drilling</h1>
    <p class="note">The idea: a borehole that reaches water. Assumed brief — rural well drilling, dependable / practical / local, must read on a truck door and as a small icon.</p>
  </div>

  <div class="panel light" style="padding:56px 36px">
    <small>Primary lockup</small>
    <svg class="lockup" viewBox="0 0 440 110" role="img" aria-label="Harrow Creek Drilling">
      <title>Harrow Creek Drilling</title>
      <g style="color:var(--ink)"><use href="#lockup" width="440" height="110"/></g>
      <use href="#mark" width="104" height="104" x="0" y="3" style="color:var(--water)"/>
    </svg>
  </div>

  <div class="grid">
    <div class="panel light">
      <small>One color</small>
      <svg class="lockup" viewBox="0 0 440 110" role="img" aria-label="Harrow Creek Drilling, one color" style="color:#000"><title>Harrow Creek Drilling</title><use href="#lockup" width="440" height="110"/></svg>
    </div>
    <div class="panel dark">
      <small>Reversed</small>
      <svg class="lockup" viewBox="0 0 440 110" role="img" aria-label="Harrow Creek Drilling, reversed" style="color:#f6f2ea"><title>Harrow Creek Drilling</title><use href="#lockup" width="440" height="110"/></svg>
    </div>
  </div>

  <div class="grid">
    <div class="panel light" style="gap:24px">
      <small>Symbol</small>
      <svg width="140" height="140" viewBox="0 0 100 100" role="img" aria-label="Harrow Creek mark" style="color:var(--water)"><title>Harrow Creek mark</title><use href="#mark" width="100" height="100"/></svg>
      <svg width="140" height="140" viewBox="0 0 100 100" aria-hidden="true" style="color:var(--earth)"><use href="#mark" width="100" height="100"/></svg>
    </div>
    <div class="panel dark">
      <small>Icon sizes (redrawn small version)</small>
      <div class="sizes">
        <div><svg width="64" height="64" viewBox="0 0 100 100" style="color:#6fc0d0"><use href="#mark-s" width="100" height="100"/></svg><span>64</span></div>
        <div><svg width="32" height="32" viewBox="0 0 100 100" style="color:#6fc0d0"><use href="#mark-s" width="100" height="100"/></svg><span>32</span></div>
        <div><svg width="16" height="16" viewBox="0 0 100 100" style="color:#6fc0d0"><use href="#mark-s" width="100" height="100"/></svg><span>16</span></div>
        <div>
          <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1b6f80"/><use href="#mark-s" x="14" y="14" width="72" height="72" style="color:#f6f2ea"/></svg><span>app icon</span>
        </div>
      </div>
    </div>
  </div>

  <div class="panel truck">
    <small>Truck door</small>
    <div class="door">
      <svg viewBox="0 0 440 110" role="img" aria-label="Harrow Creek Drilling" style="width:100%;height:auto;color:var(--ink)"><title>Harrow Creek Drilling</title><use href="#lockup" width="440" height="110"/><use href="#mark" width="104" height="104" x="0" y="3" style="color:var(--water)"/></svg>
      <div class="bar"></div>
    </div>
  </div>
</main>
</body>
</html>
