<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harrow Creek Drilling — Logo</title>
<style>
  :root {
    --ink: #1F4E5F;
    --ground: #C8862A;
    --paper: #F6F3EC;
    --night: #14303B;
    --font: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px;
    font-family: var(--font);
    background: #E4E0D6;
    color: var(--ink);
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 24px;
    text-align: center;
    color: #555;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    max-width: 960px;
    margin: 0 auto;
  }
  .panel {
    border-radius: 6px;
    padding: 36px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 220px;
  }
  .light { background: var(--paper); }
  .dark { background: var(--night); }
  .dark .wm-main { fill: var(--paper); }
  .dark .wm-sub { fill: var(--ground); }
  .label {
    font-size: 12px;
    color: #777;
    letter-spacing: 0.04em;
  }
  .dark + .label, .label.on-dark { color: #9FB7BF; }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 28px;
    justify-content: center;
  }
  .sign {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 4px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .sign .wordmark { font-size: 0; }
</style>
</head>
<body>

<h1>Harrow Creek Drilling — Logo Proposal</h1>

<!-- Shared mark: a water drop with a ground line cut through its base -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 120 120">
      <!-- Water drop -->
      <path fill="currentColor"
            d="M60 6 C60 6 18 58 18 82 A42 42 0 0 0 102 82 C102 58 60 6 60 6 Z"/>
      <!-- Ground line: a band cut through the drop, reading as the surface -->
      <rect x="0" y="80" width="120" height="7" fill="var(--bg, #F6F3EC)"/>
      <!-- Well line in the ground -->
      <rect x="54" y="87" width="12" height="26" fill="var(--ground)"/>
      <rect x="22" y="110" width="76" height="6" fill="var(--ground)"/>
    </symbol>
  </defs>
</svg>

<div class="grid">

  <!-- 1. Primary horizontal lockup, light ground -->
  <div class="panel light" style="--bg:#F6F3EC">
    <div class="row" style="align-items:center">
      <svg width="88" height="88" style="color:var(--ink)"><use href="#mark"/></svg>
      <div>
        <div style="font-family:var(--font);font-weight:800;font-size:30px;letter-spacing:0.01em;line-height:1;color:var(--ink)">HARROW CREEK</div>
        <div style="font-family:var(--font);font-weight:600;font-size:14px;letter-spacing:0.42em;margin-top:6px;color:var(--ground)">DRILLING</div>
      </div>
    </div>
    <div class="label">Horizontal lockup · solid on light</div>
  </div>

  <!-- 2. Reversed on dark -->
  <div class="panel dark" style="--bg:#14303B">
    <div class="row" style="align-items:center">
      <svg width="88" height="88" style="color:var(--paper)"><use href="#mark"/></svg>
      <div>
        <div style="font-family:var(--font);font-weight:800;font-size:30px;letter-spacing:0.01em;line-height:1;color:var(--paper)">HARROW CREEK</div>
        <div style="font-family:var(--font);font-weight:600;font-size:14px;letter-spacing:0.42em;margin-top:6px;color:var(--ground)">DRILLING</div>
      </div>
    </div>
    <div class="label on-dark">Reversed · on dark ground</div>
  </div>

  <!-- 3. Stacked lockup -->
  <div class="panel light" style="--bg:#F6F3EC">
    <svg width="96" height="96" style="color:var(--ink)"><use href="#mark"/></svg>
    <div style="text-align:center">
      <div style="font-family:var(--font);font-weight:800;font-size:24px;letter-spacing:0.01em;line-height:1.05;color:var(--ink)">HARROW CREEK</div>
      <div style="font-family:var(--font);font-weight:600;font-size:12px;letter-spacing:0.42em;margin-top:6px;color:var(--ground)">DRILLING</div>
    </div>
    <div class="label">Stacked lockup</div>
  </div>

  <!-- 4. Small-size test -->
  <div class="panel light" style="--bg:#F6F3EC">
    <div class="row">
      <svg width="32" height="32" style="color:var(--ink)"><use href="#mark"/></svg>
      <svg width="24" height="24" style="color:var(--ink)"><use href="#mark"/></svg>
      <svg width="16" height="16" style="color:var(--ink)"><use href="#mark"/></svg>
    </div>
    <div class="label">Small-size test · 32, 24, 16 px</div>
  </div>

  <!-- 5. Solid one-color black -->
  <div class="panel light" style="--bg:#F6F3EC">
    <div class="row" style="align-items:center">
      <svg width="72" height="72" style="color:#111"><use href="#mark"/></svg>
    </div>
    <div class="label">One-color black · the mark judged first</div>
  </div>

  <!-- 6. On a truck door / sign -->
  <div class="panel light" style="--bg:#F6F3EC">
    <div class="sign" style="--bg:#F6F3EC">
      <svg width="56" height="56" style="color:var(--ink)"><use href="#mark"/></svg>
      <div>
        <div style="font-family:var(--font);font-weight:800;font-size:19px;letter-spacing:0.01em;line-height:1;color:var(--ink)">HARROW CREEK</div>
        <div style="font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:0.42em;margin-top:5px;color:var(--ground)">DRILLING</div>
      </div>
    </div>
    <div class="label">Truck door mock-up</div>
  </div>

</div>

</body>
</html>
