<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling: Logo</title>
<style>
  :root {
    --ink: #1d2b36;
    --water: #2b7bb9;
    --paper: #f5f2ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    color: var(--ink);
    background: #e4e0d6;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }
  h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 24px;
  }
  .panel {
    border-radius: 6px;
    padding: 40px 32px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .light { background: var(--paper); }
  .dark  { background: var(--ink); color: var(--paper); }
  .mono  { background: #ffffff; color: #000000; border: 1px solid #c9c4b8; }
  .panel svg { width: 100%; max-width: 520px; height: auto; display: block; }
  .row {
    display: flex;
    gap: 24px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .row .cell {
    background: var(--paper);
    border-radius: 6px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row .cell.dark { background: var(--ink); }
  .row .cell svg { display: block; }
  .label {
    font-size: 12px;
    color: #5a6470;
    margin-top: 8px;
    text-align: center;
  }
  .stack { display: flex; flex-direction: column; align-items: center; }
  .note {
    font-size: 13px;
    color: #5a6470;
    line-height: 1.5;
    margin: 8px 0 0;
  }
</style>
</head>
<body>
<main>
  <h1>Harrow Creek Drilling: logo</h1>

  <!-- Primary horizontal lockup, full color -->
  <section class="panel light" aria-label="Primary horizontal logo">
    <svg viewBox="0 0 520 160" role="img" aria-labelledby="t1">
      <title id="t1">Harrow Creek Drilling logo</title>
      <!-- Water drop with a level cut. One shape, flat, no effects. -->
      <g fill="var(--water)">
        <path d="M80 14 C92 40 126 72 126 106 A46 46 0 0 1 34 106 C34 72 68 40 80 14 Z"/>
      </g>
      <rect x="22" y="96" width="116" height="9" fill="var(--paper)"/>
      <!-- Wordmark -->
      <g fill="var(--ink)" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif">
        <text x="158" y="92" font-size="50" font-weight="900" letter-spacing="-0.5">HARROW CREEK</text>
        <text x="160" y="130" font-size="26" font-weight="700" letter-spacing="7">DRILLING</text>
      </g>
    </svg>
  </section>

  <!-- One-color black on white -->
  <section class="panel mono" aria-label="One-color version">
    <svg viewBox="0 0 520 160" role="img" aria-labelledby="t2">
      <title id="t2">Harrow Creek Drilling logo, one color</title>
      <g fill="#000">
        <path d="M80 14 C92 40 126 72 126 106 A46 46 0 0 1 34 106 C34 72 68 40 80 14 Z"/>
      </g>
      <rect x="22" y="96" width="116" height="9" fill="#fff"/>
      <g fill="#000" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif">
        <text x="158" y="92" font-size="50" font-weight="900" letter-spacing="-0.5">HARROW CREEK</text>
        <text x="160" y="130" font-size="26" font-weight="700" letter-spacing="7">DRILLING</text>
      </g>
    </svg>
  </section>

  <!-- Reversed on dark -->
  <section class="panel dark" aria-label="Reversed logo">
    <svg viewBox="0 0 520 160" role="img" aria-labelledby="t3">
      <title id="t3">Harrow Creek Drilling logo, reversed</title>
      <g fill="#ffffff">
        <path d="M80 14 C92 40 126 72 126 106 A46 46 0 0 1 34 106 C34 72 68 40 80 14 Z"/>
      </g>
      <rect x="22" y="96" width="116" height="9" fill="var(--ink)"/>
      <g fill="#f5f2ea" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif">
        <text x="158" y="92" font-size="50" font-weight="900" letter-spacing="-0.5">HARROW CREEK</text>
        <text x="160" y="130" font-size="26" font-weight="700" letter-spacing="7">DRILLING</text>
      </g>
    </svg>
  </section>

  <!-- Symbol at small sizes -->
  <section aria-label="Symbol at small sizes">
    <div class="row">
      <div class="stack">
        <div class="cell">
          <svg width="128" height="128" viewBox="0 0 160 160" role="img" aria-label="Symbol, large">
            <path fill="var(--water)" d="M80 14 C92 40 126 72 126 106 A46 46 0 0 1 34 106 C34 72 68 40 80 14 Z"/>
            <rect x="22" y="96" width="116" height="9" fill="var(--paper)"/>
          </svg>
        </div>
        <div class="label">Symbol, 128 px</div>
      </div>
      <div class="stack">
        <div class="cell">
          <svg width="32" height="32" viewBox="0 0 160 160" role="img" aria-label="Symbol, 32 px">
            <path fill="var(--water)" d="M80 14 C92 40 126 72 126 106 A46 46 0 0 1 34 106 C34 72 68 40 80 14 Z"/>
            <rect x="22" y="96" width="116" height="9" fill="var(--paper)"/>
          </svg>
        </div>
        <div class="label">32 px</div>
      </div>
      <div class="stack">
        <div class="cell">
          <svg width="16" height="16" viewBox="0 0 160 160" role="img" aria-label="Symbol, 16 px">
            <path fill="var(--water)" d="M80 14 C92 40 126 72 126 106 A46 46 0 0 1 34 106 C34 72 68 40 80 14 Z"/>
            <rect x="22" y="96" width="116" height="9" fill="var(--paper)"/>
          </svg>
        </div>
        <div class="label">16 px</div>
      </div>
    </div>
    <p class="note">The symbol is one solid shape with one cut, so it stays legible at truck-door distance and at 16 px. Hairlines are removed for small sizes.</p>
  </section>
</main>
</body>
</html>
