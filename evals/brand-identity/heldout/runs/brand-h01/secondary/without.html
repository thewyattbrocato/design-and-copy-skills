<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harrow Creek Drilling: Logo</title>
<style>
  :root {
    --forest: #1f3a2e;
    --cream: #f4efe3;
    --ochre: #e0a32e;
    --rust: #c4622d;
    --water: #5fb3d9;
    --ink: #1c1c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 40px 20px;
    background: #e9e4d6;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 40px 48px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  }
  .panel.dark {
    background: var(--forest);
    color: var(--cream);
  }
  .logo {
    width: 240px;
    height: 240px;
  }
  .wordmark {
    text-align: center;
    line-height: 1;
  }
  .wordmark .top {
    display: block;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .wordmark .bottom {
    display: block;
    margin-top: 8px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--rust);
  }
  .panel.dark .wordmark .bottom {
    color: var(--ochre);
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .lockup svg {
    width: 64px;
    height: 64px;
  }
  .lockup .name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .lockup .name small {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.35em;
    color: var(--rust);
  }
  .label {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #6b6b6b;
  }
</style>
</head>
<body>

<!-- Primary mark: badge with A-frame derrick, drill-bit drop, and ground line -->
<div class="panel">
  <span class="label">Primary Mark</span>
  <svg class="logo" viewBox="0 0 240 240" role="img" aria-label="Harrow Creek Drilling logo">
    <circle cx="120" cy="120" r="116" fill="#1f3a2e"/>
    <circle cx="120" cy="120" r="104" fill="none" stroke="#e0a32e" stroke-width="3"/>
    <!-- Ground line -->
    <line x1="60" y1="172" x2="180" y2="172" stroke="#c4622d" stroke-width="6" stroke-linecap="round"/>
    <!-- A-frame derrick -->
    <path d="M120 54 L88 172 M120 54 L152 172" fill="none" stroke="#f4efe3" stroke-width="7" stroke-linecap="round"/>
    <!-- Cross braces -->
    <path d="M104 96 L136 96 M98 124 L142 124 M92 150 L148 150" fill="none" stroke="#f4efe3" stroke-width="5" stroke-linecap="round"/>
    <!-- Crown sheave -->
    <circle cx="120" cy="54" r="7" fill="#e0a32e"/>
    <!-- Water drop beneath the derrick -->
    <path d="M120 182 C120 182 104 200 104 210 A16 16 0 0 0 136 210 C136 200 120 182 120 182 Z" fill="#5fb3d9"/>
  </svg>
  <div class="wordmark">
    <span class="top">Harrow Creek</span>
    <span class="bottom">Drilling</span>
  </div>
</div>

<!-- Horizontal lockup for lettering on truck doors and signage -->
<div class="panel dark">
  <span class="label" style="color:#b9c4bb">Horizontal Lockup</span>
  <div class="lockup">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <circle cx="120" cy="120" r="116" fill="#e0a32e"/>
      <line x1="60" y1="172" x2="180" y2="172" stroke="#1f3a2e" stroke-width="8" stroke-linecap="round"/>
      <path d="M120 54 L88 172 M120 54 L152 172" fill="none" stroke="#1f3a2e" stroke-width="9" stroke-linecap="round"/>
      <path d="M104 96 L136 96 M98 124 L142 124 M92 150 L148 150" fill="none" stroke="#1f3a2e" stroke-width="6" stroke-linecap="round"/>
      <circle cx="120" cy="54" r="8" fill="#1f3a2e"/>
      <path d="M120 182 C120 182 104 200 104 210 A16 16 0 0 0 136 210 C136 200 120 182 120 182 Z" fill="#5fb3d9"/>
    </svg>
    <div class="name">
      Harrow Creek
      <small>DRILLING</small>
    </div>
  </div>
</div>

</body>
</html>
