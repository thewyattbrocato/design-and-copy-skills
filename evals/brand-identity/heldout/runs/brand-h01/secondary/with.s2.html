<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling: Logo</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f2f2ee;
    color: #1b2a36;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .note {
    font-size: 14px;
    color: #5a6670;
    margin: 0 0 32px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .panel {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    border-radius: 6px;
    padding: 24px;
    box-sizing: border-box;
  }
  .light { background: #ffffff; border: 1px solid #d8dcd6; }
  .dark { background: #1b2a36; }
  .mono { background: #ffffff; border: 1px solid #d8dcd6; }
  .wide { grid-column: 1 / -1; min-height: 160px; }
  .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #5a6670;
    margin: 24px 0 8px;
  }
  .sizes {
    display: flex;
    align-items: flex-end;
    gap: 24px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>Harrow Creek Drilling</h1>
  <p class="note">Proposed logo. A water drop with a creek line cut through it, over a ground line. Shown in one color, reversed, solid black, and at small sizes.</p>

  <div class="grid">
    <div class="panel light" style="grid-column: 1 / -1; min-height: 240px;">
      <svg viewBox="0 0 520 150" width="520" height="150" role="img" aria-label="Harrow Creek Drilling logo">
        <g transform="translate(10,10)">
          <path d="M50 6 C50 6 18 46 18 66 A32 32 0 0 0 82 66 C82 46 50 6 50 6 Z" fill="#1d5c7a"/>
          <path d="M22 66 Q36 58 50 66 T78 66" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
          <rect x="0" y="100" width="100" height="5" rx="2" fill="#1b2a36"/>
        </g>
        <text x="132" y="78" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="40" fill="#1b2a36" letter-spacing="0.5">HARROW CREEK</text>
        <text x="134" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#1d5c7a" letter-spacing="9">DRILLING</text>
      </svg>
    </div>

    <div class="panel dark">
      <svg viewBox="0 0 110 110" width="180" height="180" role="img" aria-label="Harrow Creek Drilling mark, reversed">
        <path d="M50 6 C50 6 18 46 18 66 A32 32 0 0 0 82 66 C82 46 50 6 50 6 Z" fill="#ffffff"/>
        <path d="M22 66 Q36 58 50 66 T78 66" fill="none" stroke="#1b2a36" stroke-width="5" stroke-linecap="round"/>
        <rect x="0" y="100" width="100" height="5" rx="2" fill="#ffffff"/>
      </svg>
    </div>

    <div class="panel mono">
      <svg viewBox="0 0 110 110" width="180" height="180" role="img" aria-label="Harrow Creek Drilling mark, solid black">
        <path d="M50 6 C50 6 18 46 18 66 A32 32 0 0 0 82 66 C82 46 50 6 50 6 Z" fill="#000000"/>
        <path d="M22 66 Q36 58 50 66 T78 66" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <rect x="0" y="100" width="100" height="5" rx="2" fill="#000000"/>
      </svg>
    </div>

    <div class="panel wide light" style="flex-direction: column; align-items: flex-start; gap: 16px;">
      <p class="label" style="margin: 0;">Small sizes (mark only, heavier stroke for legibility)</p>
      <div class="sizes">
        <svg viewBox="0 0 110 110" width="64" height="64" aria-label="64 pixel mark">
          <path d="M50 6 C50 6 18 46 18 66 A32 32 0 0 0 82 66 C82 46 50 6 50 6 Z" fill="#1d5c7a"/>
          <path d="M22 66 Q36 58 50 66 T78 66" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
          <rect x="0" y="100" width="100" height="7" rx="2" fill="#1b2a36"/>
        </svg>
        <svg viewBox="0 0 110 110" width="32" height="32" aria-label="32 pixel mark">
          <path d="M50 6 C50 6 18 46 18 66 A32 32 0 0 0 82 66 C82 46 50 6 50 6 Z" fill="#1d5c7a"/>
          <path d="M22 66 Q36 58 50 66 T78 66" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
          <rect x="0" y="100" width="100" height="9" rx="2" fill="#1b2a36"/>
        </svg>
        <svg viewBox="0 0 110 110" width="16" height="16" aria-label="16 pixel mark">
          <path d="M50 6 C50 6 18 46 18 66 A32 32 0 0 0 82 66 C82 46 50 6 50 6 Z" fill="#1d5c7a"/>
          <path d="M22 66 Q36 58 50 66 T78 66" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
          <rect x="0" y="100" width="100" height="12" rx="2" fill="#1b2a36"/>
        </svg>
      </div>
    </div>
  </div>
</main>
</body>
</html>
