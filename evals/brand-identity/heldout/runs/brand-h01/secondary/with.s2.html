<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling: Logo</title>
<style>
  :root {
    --navy: #1d3b52;
    --paper: #f4efe4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #e6e2d8;
    color: var(--navy);
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 24px;
  }
  .grid {
    display: grid;
    gap: 24px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  }
  .panel {
    border-radius: 8px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    min-height: 220px;
  }
  .panel.light { background: var(--paper); }
  .panel.dark  { background: var(--navy); color: var(--paper); }
  .panel.wide  { grid-column: 1 / -1; }
  .panel svg.lockup { width: 100%; max-width: 560px; height: auto; }
  .caption {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .sizes {
    display: flex;
    align-items: flex-end;
    gap: 24px;
  }
  .sizes svg { display: block; }
</style>
</head>
<body>

<h1>Harrow Creek Drilling: logo</h1>

<!-- Shared mark. Solid, flat, one color plus paper. Uses currentColor so it reverses with its panel. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="50" fill="currentColor"/>
      <!-- drill bit: shaft and tapered point -->
      <rect x="43" y="16" width="14" height="40" fill="var(--paper, #f4efe4)"/>
      <polygon points="43,56 57,56 50,74" fill="var(--paper, #f4efe4)"/>
      <!-- creek line -->
      <path d="M20 80 Q30 72 40 80 T60 80 T80 80" fill="none" stroke="var(--paper, #f4efe4)" stroke-width="6" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="grid">

  <!-- Horizontal lockup, reversed on dark -->
  <div class="panel dark wide" style="--paper:#f4efe4">
    <svg class="lockup" viewBox="0 0 640 200" role="img" aria-label="Harrow Creek Drilling">
      <use href="#mark" x="20" y="30" width="140" height="140" style="color:#f4efe4"/>
      <text x="190" y="110" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="62" fill="#f4efe4" textLength="430" lengthAdjust="spacingAndGlyphs">HARROW CREEK</text>
      <text x="192" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="34" fill="#f4efe4" textLength="426" lengthAdjust="spacing">DRILLING</text>
    </svg>
    <span class="caption">Horizontal lockup, reversed</span>
  </div>

  <!-- Horizontal lockup, solid navy on paper -->
  <div class="panel light wide" style="--paper:#f4efe4">
    <svg class="lockup" viewBox="0 0 640 200" role="img" aria-label="Harrow Creek Drilling">
      <use href="#mark" x="20" y="30" width="140" height="140" style="color:#1d3b52"/>
      <text x="190" y="110" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="62" fill="#1d3b52" textLength="430" lengthAdjust="spacingAndGlyphs">HARROW CREEK</text>
      <text x="192" y="160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="34" fill="#1d3b52" textLength="426" lengthAdjust="spacing">DRILLING</text>
    </svg>
    <span class="caption">Horizontal lockup, one color</span>
  </div>

  <!-- Symbol at real sizes -->
  <div class="panel light" style="--paper:#f4efe4">
    <div class="sizes">
      <svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="Mark at 96 px" style="color:#1d3b52"><use href="#mark"/></svg>
      <svg width="32" height="32" viewBox="0 0 100 100" role="img" aria-label="Mark at 32 px" style="color:#1d3b52"><use href="#mark"/></svg>
      <svg width="16" height="16" viewBox="0 0 100 100" role="img" aria-label="Mark at 16 px" style="color:#1d3b52"><use href="#mark"/></svg>
    </div>
    <span class="caption">Symbol: 96, 32, 16 px</span>
  </div>

  <!-- Symbol on dark -->
  <div class="panel dark" style="--paper:#f4efe4">
    <div class="sizes">
      <svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="Reversed mark at 96 px" style="color:#f4efe4"><use href="#mark"/></svg>
    </div>
    <span class="caption">Symbol, reversed</span>
  </div>

</div>

</body>
</html>
