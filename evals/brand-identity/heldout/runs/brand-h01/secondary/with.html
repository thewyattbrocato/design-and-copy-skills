<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling: Logo</title>
<style>
  :root {
    --ink: #17465f;
    --night: #0f2a38;
    --paper: #ffffff;
    --sand: #f3f1ec;
    --face: "Franklin Gothic Demi Cond", "Franklin Gothic Demi", "Arial Narrow Bold", "Arial Narrow", Impact, "Helvetica Neue", Arial, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--body);
    background: var(--sand);
    color: #222;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #666;
    margin: 0 0 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .panel {
    background: var(--paper);
    border-radius: 6px;
    padding: 40px 28px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--ink);
  }
  .panel.dark {
    background: var(--night);
    color: #f4efe4;
  }
  .panel.wide { grid-column: 1 / -1; }
  .caption {
    font-size: 12px;
    color: #777;
    letter-spacing: .04em;
  }
  .panel.dark .caption { color: #9fb6c2; }

  /* Mark */
  .mark { display: block; }

  /* Horizontal lockup */
  .lockup {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .lockup .mark { width: 88px; height: 88px; flex: none; }
  .word {
    font-family: var(--face);
    line-height: 1;
    text-transform: uppercase;
  }
  .word .name {
    display: block;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .word .trade {
    display: block;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .34em;
    margin-top: 6px;
    padding-left: 2px;
  }

  /* Stacked lockup */
  .stacked {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .stacked .mark { width: 110px; height: 110px; }
  .stacked .word { text-align: center; }
  .stacked .word .name { font-size: 34px; }
  .stacked .word .trade { font-size: 13px; }

  /* Small sizes */
  .sizes {
    display: flex;
    align-items: flex-end;
    gap: 22px;
    color: var(--ink);
  }
  .sizes figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .sizes .mark { display: block; }
  .panel.dark .sizes { color: #f4efe4; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Waterline: the mark is a solid drop with a wave cut out of it -->
    <mask id="hc-waterline" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <path fill="#000" d="M0 66 Q12 58 24 66 T48 66 T72 66 T96 66 T120 66 L120 76 Q108 84 96 76 T72 76 T48 76 T24 76 T0 76 Z"/>
    </mask>
    <symbol id="hc-mark" viewBox="0 0 120 120">
      <path mask="url(#hc-waterline)" fill="currentColor"
            d="M60 6 C60 6 24 50 24 76 A36 36 0 0 0 96 76 C96 50 60 6 60 6 Z"/>
    </symbol>
  </defs>
</svg>

<main>
  <h1>Harrow Creek Drilling: logo concept</h1>

  <div class="grid">

    <section class="panel wide">
      <div class="lockup" style="color: var(--ink)">
        <svg class="mark" viewBox="0 0 120 120" role="img" aria-label="Harrow Creek Drilling mark"><use href="#hc-mark"/></svg>
        <div class="word" aria-hidden="true">
          <span class="name">Harrow Creek</span>
          <span class="trade">DRILLING</span>
        </div>
      </div>
      <div class="caption">Horizontal lockup, full color</div>
    </section>

    <section class="panel">
      <div class="stacked" style="color: var(--ink)">
        <svg class="mark" viewBox="0 0 120 120" role="img" aria-label="Harrow Creek Drilling mark"><use href="#hc-mark"/></svg>
        <div class="word" aria-hidden="true">
          <span class="name">Harrow Creek</span>
          <span class="trade">DRILLING</span>
        </div>
      </div>
      <div class="caption">Stacked lockup</div>
    </section>

    <section class="panel dark">
      <div class="stacked">
        <svg class="mark" viewBox="0 0 120 120" role="img" aria-label="Harrow Creek Drilling mark, reversed"><use href="#hc-mark"/></svg>
        <div class="word" aria-hidden="true">
          <span class="name">Harrow Creek</span>
          <span class="trade">DRILLING</span>
        </div>
      </div>
      <div class="caption">Reversed on dark</div>
    </section>

    <section class="panel">
      <div class="sizes" style="color: var(--ink)">
        <figure>
          <svg class="mark" width="16" height="16" viewBox="0 0 120 120" role="img" aria-label="16 px"><use href="#hc-mark"/></svg>
          <span class="caption">16 px</span>
        </figure>
        <figure>
          <svg class="mark" width="24" height="24" viewBox="0 0 120 120" role="img" aria-label="24 px"><use href="#hc-mark"/></svg>
          <span class="caption">24 px</span>
        </figure>
        <figure>
          <svg class="mark" width="32" height="32" viewBox="0 0 120 120" role="img" aria-label="32 px"><use href="#hc-mark"/></svg>
          <span class="caption">32 px</span>
        </figure>
        <figure>
          <svg class="mark" width="48" height="48" viewBox="0 0 120 120" role="img" aria-label="48 px"><use href="#hc-mark"/></svg>
          <span class="caption">48 px</span>
        </figure>
      </div>
      <div class="caption">Mark at small sizes</div>
    </section>

    <section class="panel dark">
      <div class="sizes">
        <figure>
          <svg class="mark" width="16" height="16" viewBox="0 0 120 120" role="img" aria-label="16 px reversed"><use href="#hc-mark"/></svg>
          <span class="caption">16 px</span>
        </figure>
        <figure>
          <svg class="mark" width="24" height="24" viewBox="0 0 120 120" role="img" aria-label="24 px reversed"><use href="#hc-mark"/></svg>
          <span class="caption">24 px</span>
        </figure>
        <figure>
          <svg class="mark" width="32" height="32" viewBox="0 0 120 120" role="img" aria-label="32 px reversed"><use href="#hc-mark"/></svg>
          <span class="caption">32 px</span>
        </figure>
        <figure>
          <svg class="mark" width="48" height="48" viewBox="0 0 120 120" role="img" aria-label="48 px reversed"><use href="#hc-mark"/></svg>
          <span class="caption">48 px</span>
        </figure>
      </div>
      <div class="caption">Reversed at small sizes</div>
    </section>

  </div>
</main>
</body>
</html>
