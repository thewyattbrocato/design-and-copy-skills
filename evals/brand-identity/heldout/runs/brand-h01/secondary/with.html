<!DOCTYPE html>
<!--
Harrow Creek Drilling: logo concept.
Assumptions: rural water well drilling; known for dependable, straightforward work.
Idea: a single water drop, the thing a well is for. Flat, one color, no effects.
Shown: primary lockup on white, reversed on dark, and a 32px icon check.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harrow Creek Drilling: Logo</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f2f2ee;
    color: #1d3b4f;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 24px;
    color: #5b6b75;
  }
  .panel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 56px 24px;
    border-radius: 8px;
    margin-bottom: 24px;
    background: #ffffff;
  }
  .panel.dark {
    background: #1d3b4f;
    color: #ffffff;
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .wordmark {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }
  .wordmark .name {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .wordmark .trade {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    margin-top: 8px;
  }
  .icon-row {
    display: flex;
    align-items: flex-end;
    gap: 24px;
    padding: 24px;
    background: #ffffff;
    border-radius: 8px;
  }
  .icon-row span {
    font-size: 12px;
    color: #5b6b75;
  }
</style>
</head>
<body>
<main>
  <h1>Harrow Creek Drilling: Logo</h1>

  <!-- Primary lockup, on white -->
  <section class="panel">
    <div class="lockup">
      <svg width="120" height="120" viewBox="0 0 200 200" role="img" aria-label="Harrow Creek Drilling mark">
        <circle cx="100" cy="100" r="96" fill="#1d3b4f"/>
        <path d="M100 38 C100 38 56 96 56 124 A44 44 0 0 0 144 124 C144 96 100 38 100 38 Z" fill="#ffffff"/>
      </svg>
      <div class="wordmark">
        <span class="name">Harrow Creek</span>
        <span class="trade">Drilling</span>
      </div>
    </div>
  </section>

  <!-- Reversed lockup, on dark -->
  <section class="panel dark">
    <div class="lockup">
      <svg width="120" height="120" viewBox="0 0 200 200" role="img" aria-label="Harrow Creek Drilling mark, reversed">
        <circle cx="100" cy="100" r="96" fill="#ffffff"/>
        <path d="M100 38 C100 38 56 96 56 124 A44 44 0 0 0 144 124 C144 96 100 38 100 38 Z" fill="#1d3b4f"/>
      </svg>
      <div class="wordmark">
        <span class="name">Harrow Creek</span>
        <span class="trade">Drilling</span>
      </div>
    </div>
  </section>

  <!-- Small-size check -->
  <section class="icon-row">
    <svg width="32" height="32" viewBox="0 0 200 200" role="img" aria-label="Mark at 32 pixels">
      <circle cx="100" cy="100" r="96" fill="#1d3b4f"/>
      <path d="M100 38 C100 38 56 96 56 124 A44 44 0 0 0 144 124 C144 96 100 38 100 38 Z" fill="#ffffff"/>
    </svg>
    <svg width="16" height="16" viewBox="0 0 200 200" role="img" aria-label="Mark at 16 pixels">
      <circle cx="100" cy="100" r="96" fill="#1d3b4f"/>
      <path d="M100 38 C100 38 56 96 56 124 A44 44 0 0 0 144 124 C144 96 100 38 100 38 Z" fill="#ffffff"/>
    </svg>
    <span>Mark at 32px and 16px</span>
  </section>
</main>
</body>
</html>
