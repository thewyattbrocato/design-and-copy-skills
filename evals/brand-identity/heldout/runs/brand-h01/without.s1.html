<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harrow Creek Drilling — Logo</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #efe8d8;
    font-family: Georgia, "Times New Roman", serif;
  }
  .logo { width: min(92vw, 640px); height: auto; display: block; }
  .logo text { font-family: "Rockwell", "Roboto Slab", Georgia, "Times New Roman", serif; }
</style>
</head>
<body>
<svg class="logo" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Harrow Creek Drilling logo</title>
  <desc id="d">A circular badge showing a drilling derrick over rolling fields and a creek, with the words Harrow Creek Drilling.</desc>
  <defs>
    <clipPath id="disc"><circle cx="300" cy="270" r="170"/></clipPath>
    <path id="arcTop" d="M 90 270 A 210 210 0 0 1 510 270"/>
  </defs>

  <!-- outer badge -->
  <circle cx="300" cy="270" r="240" fill="#2f3b2a"/>
  <circle cx="300" cy="270" r="230" fill="none" stroke="#e9b44c" stroke-width="3"/>
  <circle cx="300" cy="270" r="180" fill="none" stroke="#e9b44c" stroke-width="3"/>

  <!-- ring text -->
  <text font-size="34" font-weight="700" letter-spacing="7" fill="#f3ead2" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">HARROW CREEK</textPath>
  </text>
  <text x="300" y="474" font-size="30" font-weight="700" letter-spacing="10" fill="#f3ead2" text-anchor="middle">DRILLING</text>
  <circle cx="92" cy="270" r="5" fill="#e9b44c"/>
  <circle cx="508" cy="270" r="5" fill="#e9b44c"/>

  <!-- scene -->
  <g clip-path="url(#disc)">
    <rect x="120" y="100" width="360" height="340" fill="#f1c76b"/>
    <circle cx="300" cy="290" r="95" fill="#f6dc95"/>
    <!-- far hills -->
    <path d="M120 320 Q200 270 290 305 T480 295 V440 H120Z" fill="#8a9a5b"/>
    <!-- near field -->
    <path d="M120 360 Q220 320 320 352 T480 340 V440 H120Z" fill="#5d7340"/>
    <!-- field furrows -->
    <g stroke="#4a5d33" stroke-width="3" fill="none" opacity=".8">
      <path d="M120 385 Q230 350 480 372"/>
      <path d="M120 408 Q240 375 480 396"/>
    </g>
    <!-- creek -->
    <path d="M250 440 C265 410 330 400 322 372 C316 355 345 352 352 346 L372 350 C360 358 340 364 346 380 C354 408 290 418 305 440Z" fill="#6fb3c9"/>
    <path d="M262 436 C276 414 334 408 330 380" stroke="#d6eef5" stroke-width="2" fill="none" opacity=".8"/>
  </g>

  <!-- derrick -->
  <g stroke="#2f3b2a" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <path d="M300 160 L262 360 M300 160 L338 360" stroke-width="9"/>
    <path d="M281 260 H319 M273 305 H327 M290 210 H310" stroke-width="6"/>
    <path d="M290 210 L319 260 M310 210 L281 260 M281 260 L327 305 M319 260 L273 305 M273 305 L333 360 M327 305 L267 360" stroke-width="4"/>
    <path d="M254 360 H346" stroke-width="10"/>
  </g>
  <!-- crown block -->
  <rect x="288" y="148" width="24" height="16" fill="#2f3b2a"/>
  <!-- drill pipe & bit -->
  <rect x="296" y="164" width="8" height="196" fill="#b8472a"/>
  <path d="M296 360 H304 V380 L300 392 L296 380Z" fill="#b8472a"/>
  <!-- rig base -->
  <path d="M244 360 H356 L366 372 H234Z" fill="#2f3b2a"/>

  <!-- tagline banner -->
  <rect x="150" y="520" width="300" height="38" rx="3" fill="#e9b44c"/>
  <text x="300" y="545" font-size="17" font-weight="700" letter-spacing="4" fill="#2f3b2a" text-anchor="middle">WATER WELLS · EST. COUNTRY</text>
</svg>
</body>
</html>
