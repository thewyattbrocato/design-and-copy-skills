<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OFF GRID — 14–16 March, Mill Street Warehouse, Rotterdam</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#151515;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}

  .poster{
    --ink:#111; --paper:#ece8dc; --hot:#ff4a1c; --acid:#d7ff3a;
    position:relative;
    height:min(100vh,140vw);
    aspect-ratio:5/7;
    container-type:size;
    overflow:hidden;
    background:var(--paper);
    color:var(--ink);
    font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;
  }

  /* the grid that everything escapes from */
  .grid{
    position:absolute;inset:0;
    background:
      linear-gradient(to right,rgba(17,17,17,.28) 0.15cqw,transparent 0.15cqw) 0 0/10cqw 10cqw,
      linear-gradient(to bottom,rgba(17,17,17,.28) 0.15cqw,transparent 0.15cqw) 0 0/10cqw 10cqw;
  }
  .grid::after{ /* a crooked second grid, rotated off-axis */
    content:"";position:absolute;inset:-30%;
    transform:rotate(-7deg);
    background:
      linear-gradient(to right,rgba(255,74,28,.35) 0.12cqw,transparent 0.12cqw) 0 0/10cqw 10cqw;
    -webkit-mask-image:linear-gradient(to bottom,transparent 35%,#000 75%);
            mask-image:linear-gradient(to bottom,transparent 35%,#000 75%);
  }

  .abs{position:absolute;line-height:.8;white-space:nowrap}

  .off{
    left:3cqw;top:4cqw;
    font-size:56cqw;letter-spacing:-.01em;
  }
  .slash{ /* slash cutting through OFF */
    position:absolute;left:-5cqw;top:25cqw;width:80cqw;height:7cqw;
    background:var(--hot);
    transform:rotate(-14deg);
    mix-blend-mode:multiply;
  }

  .g{left:-3cqw;top:48cqw;font-size:52cqw;color:var(--ink)}
  .r{left:25cqw;top:55cqw;font-size:52cqw;transform:rotate(9deg);color:transparent;-webkit-text-stroke:.7cqw var(--ink)}
  .i{left:51cqw;top:46cqw;font-size:52cqw;color:var(--hot);transform:scaleY(2.3) skewX(-8deg);transform-origin:50% 0}
  .d{left:62cqw;top:60cqw;font-size:52cqw;transform:rotate(-11deg);color:var(--ink)}

  .dates{
    right:3cqw;top:4cqw;
    writing-mode:vertical-rl;
    font-size:15cqw;line-height:.85;
    color:var(--hot);
    letter-spacing:.01em;
  }
  .dates b{font-weight:400;color:var(--ink)}

  .block{
    position:absolute;
    background:var(--acid);
    left:6cqw;top:103cqw;width:46cqw;height:7cqw;
    transform:rotate(2deg);
  }
  .tag{
    left:7cqw;top:104.2cqw;
    font-family:"Courier New",Courier,monospace;font-weight:700;
    font-size:3.1cqw;line-height:1.1;letter-spacing:.04em;
    transform:rotate(2deg);
  }

  .info{
    position:absolute;left:5cqw;bottom:5cqw;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-weight:900;text-transform:uppercase;
    font-size:7.2cqw;line-height:.92;letter-spacing:-.03em;
  }
  .info small{
    display:block;margin-top:2.4cqw;
    font-family:"Courier New",Courier,monospace;font-weight:700;
    font-size:2.6cqw;letter-spacing:.06em;line-height:1.35;
  }

  .stamp{
    position:absolute;right:5cqw;bottom:5cqw;
    width:26cqw;height:26cqw;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;text-align:center;
    transform:rotate(14deg);
    font-family:"Courier New",Courier,monospace;font-weight:700;
    font-size:2.6cqw;line-height:1.25;letter-spacing:.08em;
    outline:.6cqw dashed var(--ink);outline-offset:1cqw;
  }
  .stamp em{display:block;font-style:normal;font-family:Impact,sans-serif;font-size:9cqw;letter-spacing:0;color:var(--acid);line-height:.9}

  .reg{position:absolute;font-family:"Courier New",monospace;font-size:2.2cqw;font-weight:700;letter-spacing:.1em}
  .reg.a{left:3cqw;top:1.2cqw}
  .reg.b{right:3cqw;top:1.2cqw}
</style>
</head>
<body>
<main class="poster" aria-label="OFF GRID festival poster">
  <div class="grid"></div>

  <div class="reg a">N°01 / ROTTERDAM</div>
  <div class="reg b">DESIGN FESTIVAL</div>

  <div class="abs off">OFF</div>
  <div class="slash"></div>

  <div class="abs dates">14<b>–</b>16 MAR</div>

  <div class="abs g">G</div>
  <div class="abs r">R</div>
  <div class="abs i">I</div>
  <div class="abs d">D</div>

  <div class="block"></div>
  <div class="abs tag">STEP OFF THE GRID.<br>NO RULES. THREE DAYS.</div>

  <div class="info">
    Mill Street<br>Warehouse
    <small>ROTTERDAM, NL<br>FRI 14 — SUN 16 MARCH</small>
  </div>

  <div class="stamp"><div>OFF<em>14–16</em>MARCH</div></div>
</main>
</body>
</html>
