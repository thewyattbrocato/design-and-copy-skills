<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OFF GRID — 14–16 March, Mill Street Warehouse, Rotterdam</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1a1a1a;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}

  .poster{
    --w:min(100vw, calc(100vh * 5 / 7));
    --u:calc(var(--w) / 100);
    --ink:#111;--paper:#ece7da;--red:#ff4122;--blue:#2b3cff;
    position:relative;width:var(--w);height:calc(var(--u) * 140);
    background-color:var(--paper);
    background-image:
      linear-gradient(to right, rgba(17,17,17,.16) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(17,17,17,.16) 1px, transparent 1px);
    background-size:calc(var(--u)*10) calc(var(--u)*10);
    overflow:hidden;
    font-family:"Arial Black","Helvetica Neue",Impact,Arial,sans-serif;
    color:var(--ink);
  }
  .poster *{position:absolute}

  /* OFF — built from blocks so it can't reflow */
  .o{left:calc(var(--u)*3.5);top:calc(var(--u)*7);width:calc(var(--u)*42);height:calc(var(--u)*42);
     border-radius:50%;border:calc(var(--u)*11) solid var(--red);mix-blend-mode:multiply}
  .f{mix-blend-mode:multiply;background:var(--ink)}
  .f1s{left:calc(var(--u)*50);top:calc(var(--u)*6);width:calc(var(--u)*9);height:calc(var(--u)*44)}
  .f1a{left:calc(var(--u)*50);top:calc(var(--u)*6);width:calc(var(--u)*25);height:calc(var(--u)*9)}
  .f1b{left:calc(var(--u)*50);top:calc(var(--u)*23);width:calc(var(--u)*17);height:calc(var(--u)*8)}
  .f2{left:0;top:0;width:100%;height:100%;transform-origin:85% 40%;transform:rotate(7deg) translate(calc(var(--u)*13),calc(var(--u)*4))}
  .f2 .f1s{left:calc(var(--u)*60)}
  .f2 .f1a{left:calc(var(--u)*60);width:calc(var(--u)*34)}
  .f2 .f1b{left:calc(var(--u)*60);width:calc(var(--u)*22)}

  /* GRID — each letter placed individually, none on the grid */
  .l{font-size:calc(var(--u)*46);line-height:.75;letter-spacing:-.04em;white-space:nowrap}
  .g{left:calc(var(--u)*-2.5);top:calc(var(--u)*66);transform:rotate(-4deg)}
  .r{left:calc(var(--u)*33);top:calc(var(--u)*72.5);color:var(--ink);transform:rotate(5deg)}
  .i{left:calc(var(--u)*63);top:calc(var(--u)*70);color:var(--blue);transform-origin:50% 0;transform:scaleY(2.1) skewX(-8deg)}
  .d{left:calc(var(--u)*72);top:calc(var(--u)*96);color:var(--red);transform:rotate(-12deg);mix-blend-mode:multiply}
  .ghost{left:calc(var(--u)*-2.5);top:calc(var(--u)*66);color:transparent;-webkit-text-stroke:1px var(--ink);transform:translate(calc(var(--u)*2),calc(var(--u)*2)) rotate(-4deg)}

  /* misc marks */
  .bar{left:0;top:calc(var(--u)*57);width:100%;height:calc(var(--u)*2.2);background:var(--ink);transform:rotate(-1.6deg)}
  .cross{font-family:"Courier New",monospace;font-weight:700;font-size:calc(var(--u)*4);color:var(--ink)}
  .stamp{right:calc(var(--u)*6);top:calc(var(--u)*118);width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:50%;
         background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;text-align:center;
         font-size:calc(var(--u)*3.1);line-height:1.05;transform:rotate(14deg);letter-spacing:.02em}
  .stamp span{position:static}
  .side{right:calc(var(--u)*-1);top:calc(var(--u)*52);transform-origin:100% 0;transform:rotate(90deg) translateX(100%);
        font-family:"Courier New",monospace;font-weight:700;font-size:calc(var(--u)*2.1);letter-spacing:.3em;white-space:nowrap}

  .info{left:calc(var(--u)*5);bottom:calc(var(--u)*5);width:calc(var(--u)*62)}
  .info p{position:static;font-family:"Helvetica Neue",Arial,sans-serif}
  .date{font-family:"Arial Black",Impact,sans-serif!important;font-size:calc(var(--u)*9.5);line-height:.9;letter-spacing:-.03em}
  .date em{font-style:normal;color:var(--red)}
  .where{margin-top:calc(var(--u)*2.2);font-size:calc(var(--u)*3);font-weight:800;line-height:1.15;text-transform:uppercase;letter-spacing:.02em}
  .rules{margin-top:calc(var(--u)*2.2);font-family:"Courier New",monospace!important;font-size:calc(var(--u)*2.1);line-height:1.35;font-weight:700}
  .rules b{background:var(--ink);color:var(--paper);padding:0 .3em}

  .err{left:calc(var(--u)*5);top:calc(var(--u)*1.6);font-family:"Courier New",monospace;font-weight:700;font-size:calc(var(--u)*2);letter-spacing:.2em}
</style>
</head>
<body>
<div class="poster">
  <div class="err">ERR_404 / LAYOUT NOT FOUND</div>

  <div class="o"></div>
  <div class="f f1s"></div><div class="f f1a"></div><div class="f f1b"></div>
  <div class="f2">
    <div class="f f1s"></div><div class="f f1a"></div><div class="f f1b"></div>
  </div>

  <div class="bar"></div>

  <div class="l ghost">G</div>
  <div class="l g">G</div>
  <div class="l r">R</div>
  <div class="l i">I</div>
  <div class="l d">D</div>

  <div class="cross" style="left:calc(var(--u)*47);top:calc(var(--u)*51)">+</div>
  <div class="cross" style="left:calc(var(--u)*87);top:calc(var(--u)*3)">+</div>
  <div class="cross" style="left:calc(var(--u)*27);top:calc(var(--u)*112)">+</div>

  <div class="stamp"><span>FREE<br>TO<br>WANDER<br>↯</span></div>
  <div class="side">DESIGN FESTIVAL — ROTTERDAM — OFF GRID —</div>

  <div class="info">
    <p class="date">14<em>—</em>16<br>MARCH</p>
    <p class="where">Mill Street Warehouse<br>Rotterdam</p>
    <p class="rules"><b>NO</b> LANES. <b>NO</b> SAFE MARGINS.<br>A DESIGN FESTIVAL FOR THE<br>OUTSIDE OF THE FRAME.</p>
  </div>
</div>
</body>
</html>
