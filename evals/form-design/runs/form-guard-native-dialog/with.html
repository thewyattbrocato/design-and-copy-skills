<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export Preferences</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ececec;
    --sheet: rgba(246,246,246,.98);
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --sep: rgba(0,0,0,.12);
    --field: #fff;
    --field-border: rgba(0,0,0,.18);
    --btn: #fff;
    --accent: #007aff;
    --shadow: 0 22px 60px rgba(0,0,0,.32), 0 0 0 .5px rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --sheet: rgba(44,44,46,.98);
      --text: #f5f5f7;
      --secondary: #98989f;
      --sep: rgba(255,255,255,.12);
      --field: #3a3a3c;
      --field-border: rgba(255,255,255,.16);
      --btn: #636366;
      --accent: #0a84ff;
      --shadow: 0 22px 60px rgba(0,0,0,.6), 0 0 0 .5px rgba(255,255,255,.18);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 48px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .sheet {
    width: 100%; max-width: 480px;
    background: var(--sheet);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 20px 20px 16px;
  }
  .head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .icon {
    width: 48px; height: 48px; border-radius: 11px; flex: none;
    background: linear-gradient(145deg, #ff9f0a, #ff375f 55%, #5e5ce6);
    position: relative;
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15);
  }
  .icon::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%;
    background: rgba(255,255,255,.92);
    box-shadow: 0 0 0 4px rgba(255,255,255,.35);
  }
  h1 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .head p { margin: 0; color: var(--secondary); font-size: 12px; }

  .row {
    display: grid; grid-template-columns: 110px 1fr; column-gap: 12px;
    align-items: start; margin-bottom: 14px;
  }
  .row > label, .row > .lbl { text-align: right; padding-top: 3px; }
  .hint { color: var(--secondary); font-size: 11px; margin-top: 5px; }

  select {
    font: inherit; color: var(--text);
    min-width: 200px; max-width: 100%;
    height: 24px; padding: 0 6px;
    background-color: var(--field);
    border: .5px solid var(--field-border);
    border-radius: 6px;
    box-shadow: 0 .5px 1px rgba(0,0,0,.12);
  }
  .slider { display: flex; flex-direction: column; }
  input[type=range] { width: 100%; margin: 3px 0 0; accent-color: var(--accent); }
  .ends { display: flex; justify-content: space-between; color: var(--secondary); font-size: 11px; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }

  hr { border: 0; border-top: .5px solid var(--sep); margin: 18px -20px 14px; }
  .buttons { display: flex; justify-content: flex-end; gap: 10px; }
  button {
    font: inherit; min-width: 72px; height: 24px; padding: 0 14px;
    color: var(--text); background: var(--btn);
    border: .5px solid var(--field-border); border-radius: 6px;
    box-shadow: 0 .5px 1px rgba(0,0,0,.15);
  }
  button:active { filter: brightness(.92); }
  button.default {
    color: #fff; background: var(--accent); border-color: transparent; font-weight: 500;
  }

  @media (max-width: 440px) {
    .row { grid-template-columns: 1fr; row-gap: 4px; }
    .row > label, .row > .lbl { text-align: left; padding-top: 0; }
    select { width: 100%; }
  }
</style>
</head>
<body>
  <form class="sheet" role="dialog" aria-labelledby="title" onsubmit="return false">
    <div class="head">
      <div class="icon" aria-hidden="true"></div>
      <div>
        <h1 id="title">Export Preferences</h1>
        <p>Choose how photos are saved when you export them.</p>
      </div>
    </div>

    <div class="row">
      <label for="format">Format:</label>
      <div>
        <select id="format" name="format">
          <option selected>JPEG</option>
          <option>PNG</option>
          <option>TIFF</option>
          <option>HEIC</option>
        </select>
        <div class="hint">Quality applies to JPEG and HEIC only.</div>
      </div>
    </div>

    <div class="row">
      <label for="quality">Quality:</label>
      <div class="slider">
        <input type="range" id="quality" name="quality" min="0" max="100" value="80" aria-describedby="q-hint">
        <div class="ends" aria-hidden="true"><span>Smaller file</span><span>Best quality</span></div>
        <div class="hint" id="q-hint">Higher quality keeps more detail and makes larger files.</div>
      </div>
    </div>

    <div class="row">
      <label for="profile">Color Profile:</label>
      <div>
        <select id="profile" name="profile">
          <option selected>sRGB IEC61966-2.1</option>
          <option>Display P3</option>
          <option>Adobe RGB (1998)</option>
          <option>ProPhoto RGB</option>
          <option>Same as Original</option>
        </select>
        <div class="hint">sRGB looks consistent on most screens and websites.</div>
      </div>
    </div>

    <hr>
    <div class="buttons">
      <button type="button">Cancel</button>
      <button type="submit" class="default">Save</button>
    </div>
  </form>
</body>
</html>
