<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honeycrumb Bakery</title>
<style>
  :root {
    --cream: #fbf5ea;
    --crust: #8a5a2b;
    --dark: #3b2a1c;
    --butter: #f2c66d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--cream);
    color: var(--dark);
  }
  main {
    flex: 1;
    padding: 4rem 1.5rem;
    max-width: 40rem;
    margin: 0 auto;
    text-align: center;
  }
  main h1 { font-size: 2.25rem; margin: 0 0 .5rem; }
  main p { line-height: 1.6; }

  footer {
    background: var(--dark);
    color: var(--cream);
    padding: 2.5rem 1.5rem 1.5rem;
  }
  .footer-inner {
    max-width: 52rem;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    justify-content: space-between;
    align-items: flex-start;
  }
  .footer-info { min-width: 12rem; }
  .footer-info strong { display: block; font-size: 1.15rem; margin-bottom: .4rem; }
  .footer-info span { display: block; font-size: .9rem; line-height: 1.6; opacity: .8; }

  .newsletter { flex: 1 1 20rem; max-width: 26rem; }
  .newsletter h2 { font-size: 1.15rem; margin: 0 0 .25rem; }
  .newsletter p { margin: 0 0 .9rem; font-size: .9rem; opacity: .8; }
  .newsletter form { display: flex; gap: .5rem; flex-wrap: wrap; }
  .newsletter input[type="email"] {
    flex: 1 1 12rem;
    min-width: 0;
    padding: .7rem .9rem;
    font: inherit;
    font-size: 1rem;
    color: var(--dark);
    background: #fff;
    border: 2px solid transparent;
    border-radius: 6px;
  }
  .newsletter input[type="email"]::placeholder { color: #7a6a5c; }
  .newsletter button {
    padding: .7rem 1.2rem;
    font: inherit;
    font-size: 1rem;
    font-weight: bold;
    color: var(--dark);
    background: var(--butter);
    border: 2px solid var(--butter);
    border-radius: 6px;
    cursor: pointer;
  }
  .newsletter button:hover { background: #f7d78f; border-color: #f7d78f; }
  .newsletter input:focus-visible,
  .newsletter button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .copyright {
    max-width: 52rem;
    margin: 2rem auto 0;
    padding-top: 1rem;
    border-top: 1px solid rgba(251, 245, 234, .2);
    font-size: .8rem;
    opacity: .7;
  }
</style>
</head>
<body>
<main>
  <h1>Honeycrumb Bakery</h1>
  <p>Fresh bread, pastries and cakes, baked every morning.</p>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-info">
      <strong>Honeycrumb Bakery</strong>
      <span>12 Maple Street</span>
      <span>Tue–Sun, 7am–3pm</span>
    </div>

    <section class="newsletter" aria-labelledby="nl-heading">
      <h2 id="nl-heading">Get our weekly bake list</h2>
      <p>New treats and seasonal specials, straight to your inbox.</p>
      <form action="#" method="post">
        <label class="visually-hidden" for="nl-email">Email address</label>
        <input type="email" id="nl-email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit">Sign up</button>
      </form>
    </section>
  </div>
  <div class="copyright">&copy; 2026 Honeycrumb Bakery</div>
</footer>
</body>
</html>
