<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Ceramics — Hand-thrown dinnerware & weekend glazing classes</title>
<style>
  :root {
    --clay: #f3ebe0;
    --ink: #2a2622;
    --muted: #5e564d;
    --fern: #3f5a43;
    --fern-dark: #2f4533;
    --terracotta: #b9593a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--clay);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--fern-dark);
    text-decoration: none;
  }
  nav { display: flex; gap: 32px; }
  nav a {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.95rem;
  }
  nav a:hover { color: var(--terracotta); }
  .hero {
    max-width: 1200px;
    margin: 0 auto;
    padding: 72px 48px 120px;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 64px;
    align-items: center;
  }
  .eyebrow {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--terracotta);
    margin-bottom: 24px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(3rem, 6.4vw, 5.6rem);
    line-height: 1.02;
    letter-spacing: -0.025em;
    font-weight: 700;
    max-width: 12ch;
    margin-bottom: 28px;
  }
  h1 em { font-style: italic; color: var(--fern); }
  .lede {
    font-size: 1.25rem;
    line-height: 1.55;
    color: var(--muted);
    max-width: 34em;
    margin-bottom: 40px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; }
  .btn {
    display: inline-block;
    padding: 16px 28px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    border: 2px solid var(--fern);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .btn-primary { background: var(--fern); color: #fff; }
  .btn-primary:hover { background: var(--fern-dark); border-color: var(--fern-dark); }
  .btn-secondary { background: transparent; color: var(--fern-dark); }
  .btn-secondary:hover { background: var(--fern); color: #fff; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--terracotta); outline-offset: 3px; }

  /* Decorative stack of bowls, pure CSS */
  .art {
    aspect-ratio: 1;
    position: relative;
    max-width: 420px;
    justify-self: center;
    width: 100%;
  }
  .art .disc {
    position: absolute;
    border-radius: 50%;
  }
  .d1 { inset: 0; background: var(--fern); }
  .d2 { inset: 12%; background: var(--clay); }
  .d3 { inset: 18%; background: var(--terracotta); }
  .d4 { inset: 34%; background: #d98b68; }
  .d5 { inset: 44%; background: var(--clay); }

  @media (max-width: 860px) {
    header, .hero { padding-left: 24px; padding-right: 24px; }
    .hero { grid-template-columns: 1fr; padding-top: 40px; padding-bottom: 72px; }
    .art { max-width: 240px; justify-self: start; }
    nav { gap: 18px; }
  }
</style>
</head>
<body>
  <header>
    <a class="logo" href="#">Fernwick Ceramics</a>
    <nav aria-label="Main">
      <a href="#">Shop</a>
      <a href="#">Classes</a>
      <a href="#">About</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">Spring collection now open</p>
        <h1>Made by hand, <em>meant for your table.</em></h1>
        <p class="lede">Two potters, one small studio. We throw every plate and bowl on the wheel, and on weekends we open the doors so you can glaze your own.</p>
        <div class="actions">
          <a class="btn btn-primary" href="#">Shop the spring collection</a>
          <a class="btn btn-secondary" href="#">Book a class</a>
        </div>
      </div>
      <div class="art" aria-hidden="true">
        <div class="disc d1"></div>
        <div class="disc d2"></div>
        <div class="disc d3"></div>
        <div class="disc d4"></div>
        <div class="disc d5"></div>
      </div>
    </section>
  </main>
</body>
</html>
