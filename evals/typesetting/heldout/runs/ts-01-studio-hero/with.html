<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Ceramics</title>
<style>
  :root {
    --clay: #f4ede4;
    --ink: #2b2420;
    --muted: #5e5249;
    --terracotta: #b4532f;
    --terracotta-dark: #8f3f22;
    --fern: #4a5d46;
    --serif: Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--clay);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 64px;
    position: relative;
    z-index: 2;
  }
  .brand {
    font-family: var(--serif);
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-decoration: none;
  }
  nav ul { display: flex; gap: 36px; list-style: none; }
  nav a.link {
    color: var(--muted);
    text-decoration: none;
    font-size: 1rem;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
  }
  nav a.link:hover { color: var(--ink); border-bottom-color: var(--terracotta); }

  .content {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 64px 96px;
    position: relative;
    z-index: 2;
  }
  .copy { max-width: 760px; }
  .eyebrow {
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fern);
    margin-bottom: 28px;
  }
  h1 {
    font-family: var(--serif);
    font-size: clamp(3.5rem, 7.2vw, 6.5rem);
    line-height: 1.02;
    letter-spacing: -0.025em;
    font-weight: 700;
    text-wrap: balance;
  }
  h1 em { font-style: italic; color: var(--terracotta); }
  .lede {
    margin-top: 32px;
    font-size: 1.375rem;
    line-height: 1.5;
    color: var(--muted);
    max-width: 34em;
    text-wrap: pretty;
  }
  .actions { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 16px; }
  .btn {
    display: inline-block;
    font-family: var(--sans);
    font-size: 1.0625rem;
    font-weight: 600;
    text-decoration: none;
    padding: 18px 32px;
    border-radius: 999px;
    border: 2px solid var(--terracotta);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn-primary { background: var(--terracotta); color: #fff; }
  .btn-primary:hover { background: var(--terracotta-dark); border-color: var(--terracotta-dark); }
  .btn-secondary { background: transparent; color: var(--terracotta-dark); }
  .btn-secondary:hover { background: var(--ink); border-color: var(--ink); color: var(--clay); }
  .btn:focus-visible, nav a:focus-visible { outline: 3px solid var(--fern); outline-offset: 3px; }

  /* Decorative pottery forms, pure CSS */
  .art { position: absolute; right: -8vw; top: 50%; transform: translateY(-46%); width: 46vw; max-width: 760px; aspect-ratio: 1; z-index: 1; }
  .plate, .rim, .bowl {
    position: absolute; border-radius: 50%;
  }
  .plate {
    inset: 0;
    background: radial-gradient(circle at 38% 32%, #d98a63, var(--terracotta) 60%, #94421f);
    box-shadow: 0 40px 80px rgba(43,36,32,0.18);
  }
  .rim {
    inset: 9%;
    border: 3px solid rgba(244,237,228,0.55);
  }
  .bowl {
    width: 38%; aspect-ratio: 1; left: -6%; bottom: 4%;
    background: radial-gradient(circle at 40% 35%, #7a8c75, var(--fern) 65%, #33432f);
    box-shadow: 0 24px 50px rgba(43,36,32,0.22);
  }
  .bowl::after {
    content: ""; position: absolute; inset: 14%; border-radius: 50%;
    background: radial-gradient(circle at 60% 65%, #33432f, #5d7058);
  }

  @media (max-width: 900px) {
    nav, .content { padding-left: 24px; padding-right: 24px; }
    nav ul { gap: 20px; }
    .art { opacity: 0.25; width: 90vw; right: -30vw; }
  }
</style>
</head>
<body>
  <header class="hero">
    <nav aria-label="Main">
      <a class="brand" href="#">Fernwick Ceramics</a>
      <ul>
        <li><a class="link" href="#">Shop</a></li>
        <li><a class="link" href="#">Classes</a></li>
        <li><a class="link" href="#">Our studio</a></li>
        <li><a class="link" href="#">Contact</a></li>
      </ul>
    </nav>

    <div class="content">
      <div class="copy">
        <p class="eyebrow">Hand-thrown dinnerware</p>
        <h1>Made by hand, meant for <em>every&nbsp;meal.</em></h1>
        <p class="lede">Two potters, one small studio. We throw every plate and bowl on the wheel, and on weekends we teach you to glaze your own.</p>
        <div class="actions">
          <a class="btn btn-primary" href="#">Shop the spring collection</a>
          <a class="btn btn-secondary" href="#">Book a class</a>
        </div>
      </div>
    </div>

    <div class="art" aria-hidden="true">
      <div class="plate"></div>
      <div class="rim"></div>
      <div class="bowl"></div>
    </div>
  </header>
</body>
</html>
