<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village Hall Tea Rota – November</title>
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2a26; --muted:#6b675d; --line:#e3dccb;
    --accent:#a2432b; --accent-ink:#fff; --soft:#f3e3d6; --ok:#2f6b3f;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1c1b18; --card:#262521; --ink:#f1ece0; --muted:#a8a293; --line:#3a382f; --accent:#e08a6d; --accent-ink:#1c1b18; --soft:#3a2a22; --ok:#8fcf9f;}
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-rounded,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:12px;
  }
  main{width:100%; max-width:520px; max-height:100%; display:flex; flex-direction:column}
  header{margin-bottom:10px}
  h1{font-family:Georgia,"Times New Roman",serif; font-size:1.5rem; margin:0; letter-spacing:.2px}
  header p{margin:2px 0 0; color:var(--muted); font-size:.9rem}
  ul{list-style:none; margin:0; padding:0; display:grid; gap:8px}
  li{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; display:flex; align-items:center; gap:12px;
  }
  .date{
    flex:none; width:52px; text-align:center; line-height:1.1;
    border-right:1px solid var(--line); padding-right:12px;
  }
  .date b{display:block; font-size:1.4rem; font-family:Georgia,serif}
  .date span{font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
  .who{flex:1; min-width:0}
  .who strong{display:block; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .who small{color:var(--muted); font-size:.8rem}
  button{
    font:inherit; font-size:.9rem; cursor:pointer; border-radius:999px; padding:7px 14px;
    border:1px solid var(--accent); background:transparent; color:var(--accent); min-height:36px;
  }
  button:hover:not(:disabled){background:var(--soft)}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default; border-color:var(--line); color:var(--muted)}
  li.picked{border-color:var(--accent); background:var(--soft); box-shadow:0 0 0 2px var(--accent) inset}
  li.picked button{background:var(--accent); color:var(--accent-ink)}
  li.past{opacity:.7}
  li.past .who small{color:var(--ok)}
  footer{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; min-height:40px}
  #status{font-size:.88rem; color:var(--muted); flex:1}
  #reset{border-color:var(--line); color:var(--muted); font-size:.8rem; padding:5px 12px; min-height:32px}
  @media (max-height:520px){ li{padding:6px 10px} h1{font-size:1.2rem} }
</style>
</head>
<body>
<main>
  <header>
    <h1>☕ Tea Rota – November</h1>
    <p>Who’s bringing the cake each Sunday</p>
  </header>
  <ul id="list"></ul>
  <footer>
    <div id="status" role="status" aria-live="polite">Tap “Swap” on a slot to begin.</div>
    <button id="reset" type="button">Reset</button>
  </footer>
</main>
<script>
(function(){
  var SUNDAYS=[1,8,15,22,29];
  var DEFAULT=["Margaret","Dev","Hannah","Bill","Joyce"];
  var KEY="teaRota-2026-11";
  var today=new Date(2026,10,4); // rota date reference; replaced by real date below
  var real=new Date(); if(real.getFullYear()===2026&&real.getMonth()===10) today=real;
  var rota=load(), picked=null;
  var list=document.getElementById("list"), status=document.getElementById("status");

  function load(){
    try{var s=JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(s)&&s.length===5) return s;}catch(e){}
    return DEFAULT.slice();
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(rota));}catch(e){}}
  function isPast(i){return new Date(2026,10,SUNDAYS[i]+1)<=today;}
  function isNext(i){for(var j=0;j<5;j++){if(!isPast(j))return j===i;}return false;}

  function render(){
    list.innerHTML="";
    rota.forEach(function(name,i){
      var li=document.createElement("li");
      var past=isPast(i);
      if(past) li.className="past";
      if(picked===i) li.className+=" picked";
      li.innerHTML='<div class="date"><span>Sun</span><b>'+SUNDAYS[i]+'</b></div>'+
        '<div class="who"><strong></strong><small></small></div>';
      li.querySelector("strong").textContent=name;
      li.querySelector("small").textContent=past?"Done ✓":(isNext(i)?"Up next":"Bringing cake");
      var b=document.createElement("button"); b.type="button";
      if(past){b.textContent="Swap"; b.disabled=true;}
      else if(picked===i){b.textContent="Cancel";}
      else if(picked!==null){b.textContent="Swap here";}
      else b.textContent="Swap";
      b.setAttribute("aria-label",(picked===null?"Swap ":picked===i?"Cancel swap for ":"Swap here with ")+name+", Sunday "+SUNDAYS[i]+" November");
      b.onclick=function(){click(i);};
      li.appendChild(b); list.appendChild(li);
    });
  }
  function click(i){
    if(picked===null){
      picked=i; status.textContent="Swapping "+rota[i]+" (Sun "+SUNDAYS[i]+"). Now tap “Swap here” on another Sunday.";
    } else if(picked===i){
      picked=null; status.textContent="Swap cancelled.";
    } else {
      var a=picked,t=rota[a]; rota[a]=rota[i]; rota[i]=t; picked=null; save();
      status.textContent="Swapped: "+rota[a]+" now Sun "+SUNDAYS[a]+", "+rota[i]+" now Sun "+SUNDAYS[i]+".";
    }
    render();
    var f=list.querySelector("button:not(:disabled)"); 
  }
  document.getElementById("reset").onclick=function(){
    rota=DEFAULT.slice(); picked=null; save(); status.textContent="Rota reset to the original."; render();
  };
  render();
})();
</script>
</body>
</html>
