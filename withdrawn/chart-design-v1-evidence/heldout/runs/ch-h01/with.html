<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quillon monthly rainfall</title>
<style>
  :root { --ink:#1f2933; --muted:#667085; --grid:#e4e7ec; --bar:#b7c4d1; --accent:#1f6f8b; --bg:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:#f4f5f2; color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  figure { max-width:760px; margin:0 auto; background:var(--bg); padding:24px 24px 18px; border-radius:8px; }
  .kicker { font-size:13px; color:var(--muted); margin:0 0 4px; letter-spacing:.02em; }
  h1 { font-size:24px; line-height:1.25; margin:0 0 8px; }
  .lede { margin:0 0 16px; font-size:16px; line-height:1.5; }
  svg { display:block; width:100%; height:auto; }
  svg text { font-family: inherit; fill:var(--muted); font-size:13px; }
  .val { fill:var(--ink); font-size:13px; font-weight:600; text-anchor:middle; }
  .val.dim { fill:var(--muted); font-weight:500; }
  .mon { text-anchor:middle; }
  .ytick { text-anchor:end; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:#98a2b3; stroke-width:1; }
  .bar { fill:var(--bar); }
  .bar.wet { fill:var(--accent); }
  .note { font-size:13px; color:var(--muted); margin:10px 0 0; line-height:1.45; }
  details { margin-top:12px; font-size:14px; }
  summary { cursor:pointer; color:var(--accent); }
  table { border-collapse:collapse; margin-top:8px; width:100%; max-width:360px; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--grid); }
  td:last-child, th:last-child { text-align:right; font-variant-numeric: tabular-nums; }
  .key { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:baseline; }
</style>
</head>
<body>
<figure>
  <p class="kicker">Quillon Gardening Club · Rainfall</p>
  <h1>Quillon's rain arrives in autumn: October to December are the wettest months</h1>
  <p class="lede">November is the peak at 112&nbsp;mm. July is the driest at 18&nbsp;mm, so summer beds will need regular watering. The year totals 743&nbsp;mm.</p>

  <svg viewBox="0 0 720 360" role="img" aria-labelledby="t d">
    <title id="t">Monthly rainfall in Quillon, in millimetres</title>
    <desc id="d">Bar chart. Jan 82, Feb 64, Mar 71, Apr 55, May 48, Jun 31, Jul 18, Aug 22, Sep 47, Oct 89, Nov 112, Dec 104 millimetres. October to December are highlighted as the wettest months.</desc>

    <line class="grid" x1="44" x2="704" y1="245" y2="245"/>
    <line class="grid" x1="44" x2="704" y1="170" y2="170"/>
    <line class="grid" x1="44" x2="704" y1="95" y2="95"/>
    <text class="ytick" x="36" y="324">0</text>
    <text class="ytick" x="36" y="249">40</text>
    <text class="ytick" x="36" y="174">80</text>
    <text class="ytick" x="36" y="99">120</text>
    <text x="44" y="14" style="font-size:12px">Rainfall (mm per month)</text>

    <rect class="bar" x="52.5"  y="115"   width="38" height="205"/>
    <rect class="bar" x="107.5" y="160"   width="38" height="160"/>
    <rect class="bar" x="162.5" y="142.5" width="38" height="177.5"/>
    <rect class="bar" x="217.5" y="182.5" width="38" height="137.5"/>
    <rect class="bar" x="272.5" y="200"   width="38" height="120"/>
    <rect class="bar" x="327.5" y="242.5" width="38" height="77.5"/>
    <rect class="bar" x="382.5" y="275"   width="38" height="45"/>
    <rect class="bar" x="437.5" y="265"   width="38" height="55"/>
    <rect class="bar" x="492.5" y="202.5" width="38" height="117.5"/>
    <rect class="bar wet" x="547.5" y="97.5" width="38" height="222.5"/>
    <rect class="bar wet" x="602.5" y="40"   width="38" height="280"/>
    <rect class="bar wet" x="657.5" y="60"   width="38" height="260"/>

    <text class="val dim" x="71.5"  y="109">82</text>
    <text class="val dim" x="126.5" y="154">64</text>
    <text class="val dim" x="181.5" y="136.5">71</text>
    <text class="val dim" x="236.5" y="176.5">55</text>
    <text class="val dim" x="291.5" y="194">48</text>
    <text class="val dim" x="346.5" y="236.5">31</text>
    <text class="val dim" x="401.5" y="269">18</text>
    <text class="val dim" x="456.5" y="259">22</text>
    <text class="val dim" x="511.5" y="196.5">47</text>
    <text class="val" x="566.5" y="91.5">89</text>
    <text class="val" x="621.5" y="34">112</text>
    <text class="val" x="676.5" y="54">104</text>

    <line class="base" x1="44" x2="704" y1="320" y2="320"/>
    <text class="mon" x="71.5"  y="340">Jan</text>
    <text class="mon" x="126.5" y="340">Feb</text>
    <text class="mon" x="181.5" y="340">Mar</text>
    <text class="mon" x="236.5" y="340">Apr</text>
    <text class="mon" x="291.5" y="340">May</text>
    <text class="mon" x="346.5" y="340">Jun</text>
    <text class="mon" x="401.5" y="340">Jul</text>
    <text class="mon" x="456.5" y="340">Aug</text>
    <text class="mon" x="511.5" y="340">Sep</text>
    <text class="mon" x="566.5" y="340">Oct</text>
    <text class="mon" x="621.5" y="340">Nov</text>
    <text class="mon" x="676.5" y="340">Dec</text>
  </svg>

  <p class="note"><span class="key" style="background:var(--accent)"></span>Wettest months (Oct–Dec) &nbsp;
     <span class="key" style="background:var(--bar)"></span>Other months. Values in millimetres.</p>

  <details>
    <summary>View the figures as a table</summary>
    <table>
      <thead><tr><th>Month</th><th>Rainfall (mm)</th></tr></thead>
      <tbody>
        <tr><td>January</td><td>82</td></tr>
        <tr><td>February</td><td>64</td></tr>
        <tr><td>March</td><td>71</td></tr>
        <tr><td>April</td><td>55</td></tr>
        <tr><td>May</td><td>48</td></tr>
        <tr><td>June</td><td>31</td></tr>
        <tr><td>July</td><td>18</td></tr>
        <tr><td>August</td><td>22</td></tr>
        <tr><td>September</td><td>47</td></tr>
        <tr><td>October</td><td>89</td></tr>
        <tr><td>November</td><td>112</td></tr>
        <tr><td>December</td><td>104</td></tr>
      </tbody>
    </table>
  </details>
</figure>
</body>
</html>
