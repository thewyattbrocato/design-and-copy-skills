<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --clay: #b5593a;
    --clay-dark: #94452a;
    --ink: #2e2622;
    --muted: #6f625b;
    --paper: #f6efe7;
    --card: #fffdf9;
    --line: #dccfc2;
    --focus: #1f6f8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 2.5rem 1rem;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  main {
    width: 100%;
    max-width: 30rem;
  }
  header { margin-bottom: 1.5rem; text-align: center; }
  .brand {
    margin: 0 0 .5rem;
    font-size: .8rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--clay);
    font-weight: 700;
  }
  h1 {
    margin: 0 0 .5rem;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2rem;
    line-height: 1.2;
    font-weight: 700;
  }
  .lead { margin: 0; color: var(--muted); font-size: 1.05rem; }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 5px solid var(--clay);
    border-radius: 10px;
    padding: 1.75rem;
    box-shadow: 0 6px 20px rgba(70, 40, 20, .08);
  }
  .field { margin-bottom: 1.25rem; }
  label.title {
    display: block;
    margin-bottom: .35rem;
    font-weight: 600;
    font-size: .95rem;
  }
  input[type="text"],
  input[type="email"],
  input[type="number"],
  select {
    width: 100%;
    padding: .7rem .8rem;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid #bfb0a2;
    border-radius: 6px;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="number"] { max-width: 8rem; }
  input:hover, select:hover { border-color: var(--clay); }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .check {
    display: flex;
    align-items: center;
    gap: .6rem;
    cursor: pointer;
  }
  .check input {
    width: 1.15rem;
    height: 1.15rem;
    accent-color: var(--clay);
    margin: 0;
  }
  button {
    width: 100%;
    padding: .9rem 1rem;
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    background: var(--clay-dark);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  button:hover { background: #7d3a22; }
  button:active { transform: translateY(1px); }
  .policy {
    margin: 1.25rem 0 0;
    text-align: center;
    font-size: .9rem;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    body { padding: 1.5rem .75rem; }
    form { padding: 1.25rem; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">Kilnworks</p>
    <h1>Weekend Classes</h1>
    <p class="lead">Pick a class and save your spot.</p>
  </header>

  <form>
    <div class="field">
      <label class="title" for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name">
    </div>

    <div class="field">
      <label class="title" for="email">Email</label>
      <input type="text" id="email" name="email" autocomplete="email" inputmode="email">
    </div>

    <div class="field">
      <label class="title" for="class">Class</label>
      <select id="class" name="class">
        <option>Wheel basics (Sat 10am)</option>
        <option>Hand-building (Sat 2pm)</option>
        <option>Glazing day (Sun 11am)</option>
      </select>
    </div>

    <div class="field">
      <label class="title" for="guests">Guests</label>
      <input type="number" id="guests" name="guests" value="1">
    </div>

    <div class="field">
      <label class="check">
        <input type="checkbox" name="news">
        <span>Send me studio news</span>
      </label>
    </div>

    <button>Reserve</button>
  </form>

  <p class="policy">Cancel up to 48 hours before class for a full refund.</p>
</main>
</body>
</html>
