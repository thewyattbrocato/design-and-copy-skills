<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #2b2521;
    --muted: #6b615a;
    --line: #d8cfc5;
    --accent: #9a4f2e;
    --accent-ink: #ffffff;
    --focus: #1f5fbf;
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  main {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: 0 1px 2px rgba(43, 37, 33, 0.06);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 1.6rem;
    line-height: 1.2;
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .lede {
    margin: 0 0 24px;
    color: var(--muted);
  }

  form {
    display: grid;
    gap: 16px;
  }

  .field {
    display: grid;
    gap: 6px;
  }

  label,
  .label {
    font-weight: 600;
    font-size: 0.95rem;
  }

  input[type="text"],
  input[type="email"],
  input[type="number"],
  select {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid #9c9089;
    border-radius: 8px;
  }

  select {
    appearance: auto;
  }

  input:focus-visible,
  select:focus-visible,
  button:focus-visible,
  input[type="checkbox"]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 400;
    cursor: pointer;
    min-height: 44px;
  }

  .check input {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: var(--accent);
    flex: none;
  }

  button {
    min-height: 48px;
    padding: 12px 20px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover {
    background: #83401f;
  }

  button:active {
    transform: translateY(1px);
  }

  .policy {
    margin: 24px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.9rem;
  }

  @media (max-width: 360px) {
    main { padding: 24px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Kilnworks Weekend Classes</h1>
  <p class="lede">Pick a class and save your spot.</p>

  <form>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="class">Class</label>
      <select id="class" name="class">
        <option>Wheel basics (Sat 10am)</option>
        <option>Hand-building (Sat 2pm)</option>
        <option>Glazing day (Sun 11am)</option>
      </select>
    </div>

    <div class="field">
      <label for="guests">Guests</label>
      <input type="number" id="guests" name="guests" value="1" min="1" inputmode="numeric">
    </div>

    <label class="check">
      <input type="checkbox" name="news">
      <span>Send me studio news</span>
    </label>

    <button type="submit">Reserve</button>
  </form>

  <p class="policy">Cancel up to 48 hours before class for a full refund.</p>
</main>
</body>
</html>
