<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --ink: #1f1d1a;
    --muted: #5f5a53;
    --paper: #faf7f2;
    --card: #ffffff;
    --line: #d9d2c7;
    --accent: #9a4a2b;
    --accent-ink: #ffffff;
    --focus: #1a5fb4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  main {
    max-width: 520px;
    margin: 32px auto;
    padding: 28px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 1.6rem;
    line-height: 1.2;
  }

  .intro {
    margin: 0 0 24px;
    color: var(--muted);
  }

  form {
    display: grid;
    gap: 16px;
  }

  label {
    display: grid;
    gap: 6px;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 400;
  }

  input[type="text"],
  input[type="email"],
  input[type="number"],
  select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid #8f877b;
    border-radius: 8px;
  }

  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
    flex: none;
  }

  input:focus-visible,
  select:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  input:invalid:not(:placeholder-shown):not(:focus) {
    border-color: #a4262c;
  }

  button {
    justify-self: start;
    padding: 12px 22px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover {
    filter: brightness(1.08);
  }

  .policy {
    margin: 24px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.92rem;
  }

  @media (max-width: 480px) {
    main {
      margin: 16px auto;
      padding: 22px 18px;
    }
    h1 {
      font-size: 1.35rem;
    }
    button {
      justify-self: stretch;
      width: 100%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Kilnworks Weekend Classes</h1>
  <p class="intro">Pick a class and save your spot.</p>

  <form>
    <label>
      Name
      <input type="text" name="name" autocomplete="name" required>
    </label>

    <label>
      Email
      <input type="email" name="email" autocomplete="email" required>
    </label>

    <label>
      Class
      <select name="class" required>
        <option>Wheel basics (Sat 10am)</option>
        <option>Hand-building (Sat 2pm)</option>
        <option>Glazing day (Sun 11am)</option>
      </select>
    </label>

    <label>
      Guests
      <input type="number" name="guests" value="1" min="1" max="10" inputmode="numeric" required>
    </label>

    <label class="check">
      <input type="checkbox" name="news">
      Send me studio news
    </label>

    <button type="submit">Reserve</button>
  </form>

  <p class="policy">Cancel up to 48 hours before class for a full refund.</p>
</main>
</body>
</html>
