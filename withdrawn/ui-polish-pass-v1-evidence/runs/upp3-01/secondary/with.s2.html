<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --bg: #f7f3ee;
    --card: #ffffff;
    --text: #2b2521;
    --muted: #6b5f57;
    --line: #d8cfc6;
    --accent: #8a4b2e;
    --accent-hover: #73391f;
    --focus: #1d5fa8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1rem;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }

  main {
    max-width: 32rem;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 2rem;
    box-shadow: 0 1px 2px rgba(43, 37, 33, 0.06);
  }

  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.6rem;
    line-height: 1.2;
    font-weight: 700;
  }

  .intro {
    margin: 0 0 1.5rem;
    color: var(--muted);
  }

  form {
    display: grid;
    gap: 1rem;
  }

  label,
  .legend {
    display: block;
    font-weight: 600;
    margin-bottom: 0.35rem;
  }

  input[type="text"],
  input[type="email"],
  input[type="number"],
  select {
    display: block;
    width: 100%;
    padding: 0.6rem 0.75rem;
    font: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid #8f837a;
    border-radius: 6px;
  }

  select {
    appearance: auto;
  }

  input:focus-visible,
  select:focus-visible,
  button:focus-visible,
  input[type="checkbox"]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 6rem;
    gap: 1rem;
    align-items: end;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 400;
    cursor: pointer;
  }

  .check input {
    width: 1.1rem;
    height: 1.1rem;
    margin: 0;
    accent-color: var(--accent);
  }

  button {
    justify-self: start;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 0.7rem 1.5rem;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }

  .policy {
    margin: 1.5rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.95rem;
  }

  @media (max-width: 420px) {
    body { padding: 1rem 0.5rem; }
    main { padding: 1.25rem; }
    .row { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Kilnworks Weekend Classes</h1>
  <p class="intro">Pick a class and save your spot.</p>

  <form>
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required>
    </div>

    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>

    <div>
      <label for="class">Class</label>
      <select id="class" name="class">
        <option>Wheel basics (Sat 10am)</option>
        <option>Hand-building (Sat 2pm)</option>
        <option>Glazing day (Sun 11am)</option>
      </select>
    </div>

    <div>
      <label for="guests">Guests</label>
      <input type="number" id="guests" name="guests" value="1" min="1" inputmode="numeric" style="max-width: 6rem;">
    </div>

    <div>
      <label class="check">
        <input type="checkbox" name="news">
        Send me studio news
      </label>
    </div>

    <button type="submit">Reserve</button>
  </form>

  <p class="policy">Cancel up to 48 hours before class for a full refund.</p>
</main>
</body>
</html>
