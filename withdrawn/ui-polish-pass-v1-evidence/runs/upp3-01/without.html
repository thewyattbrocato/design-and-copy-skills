<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnworks Weekend Classes</title>
<style>
  :root {
    --clay: #b5573a;
    --clay-dark: #98462d;
    --ink: #2f2622;
    --muted: #6f625b;
    --line: #dccfc4;
    --paper: #fbf7f2;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px;
    background: var(--paper);
    background-image: radial-gradient(circle at 20% 0%, #f3e4d6 0, transparent 45%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 460px;
    margin: 0 auto;
  }
  .brand {
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--clay);
    font-weight: 600;
    margin: 0 0 6px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2rem;
    line-height: 1.2;
    margin: 0 0 8px;
  }
  .lead { margin: 0 0 24px; color: var(--muted); }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(79, 52, 36, 0.08);
    display: grid;
    gap: 18px;
  }
  label.field { display: grid; gap: 6px; font-weight: 600; font-size: 0.9rem; }
  input[type="text"], input[type="email"], input[type="number"], select {
    width: 100%;
    font: inherit;
    font-weight: 400;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 44px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--clay);
    box-shadow: 0 0 0 3px rgba(181, 87, 58, 0.25);
  }
  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .check input {
    width: 20px;
    height: 20px;
    accent-color: var(--clay);
    margin: 0;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--clay);
    border: 0;
    border-radius: 8px;
    min-height: 48px;
    padding: 12px 20px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: var(--clay-dark); }
  button:active { transform: translateY(1px); }
  button:focus-visible {
    outline: 3px solid rgba(181, 87, 58, 0.45);
    outline-offset: 2px;
  }
  .note {
    margin: 20px 4px 0;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f1e8e1;
      --muted: #b6a79d;
      --line: #4a3d36;
      --paper: #1f1815;
      --card: #2a211d;
      --clay: #d9805f;
      --clay-dark: #e8967a;
    }
    body { background-image: radial-gradient(circle at 20% 0%, #3a2a22 0, transparent 45%); }
    input[type="text"], input[type="email"], input[type="number"], select { background: #1f1815; }
    button { color: #1f1815; }
    form { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
  }
</style>
</head>
<body>
<main>
  <p class="brand">Kilnworks</p>
  <h1>Weekend Classes</h1>
  <p class="lead">Pick a class and save your spot.</p>
  <form>
    <label class="field">Name
      <input type="text" name="name" autocomplete="name">
    </label>
    <label class="field">Email
      <input type="email" name="email" autocomplete="email">
    </label>
    <label class="field">Class
      <select name="class">
        <option>Wheel basics (Sat 10am)</option>
        <option>Hand-building (Sat 2pm)</option>
        <option>Glazing day (Sun 11am)</option>
      </select>
    </label>
    <label class="field">Guests
      <input type="number" name="guests" value="1" min="0" inputmode="numeric">
    </label>
    <label class="check">
      <input type="checkbox" name="news"> Send me studio news
    </label>
    <button type="submit">Reserve</button>
  </form>
  <p class="note">Cancel up to 48 hours before class for a full refund.</p>
</main>
</body>
</html>
