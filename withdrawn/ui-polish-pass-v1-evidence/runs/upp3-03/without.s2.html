<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Plants – Care Tips Newsletter</title>
<style>
  :root {
    --bg: #eef2e8;
    --card: #ffffff;
    --ink: #1f2d22;
    --muted: #5b6b5f;
    --accent: #2f6b45;
    --accent-dark: #245436;
    --border: #cfd8c8;
    --ring: rgba(47, 107, 69, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a14;
      --card: #1b261e;
      --ink: #eaf1e6;
      --muted: #a2b3a5;
      --accent: #6fbf8a;
      --accent-dark: #8fd3a6;
      --border: #2f4034;
      --ring: rgba(111, 191, 138, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(111, 191, 138, 0.25), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(47, 107, 69, 0.18), transparent 45%),
      var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px 32px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(31, 45, 34, .10);
    text-align: center;
  }
  .icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 16px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent);
  }
  .icon svg { width: 28px; height: 28px; }
  h2 {
    margin: 0 0 6px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  p {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 1rem;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  label {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  input {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--muted); opacity: .8; }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ring);
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent-dark);
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;
    cursor: pointer;
    transition: transform .1s, filter .15s, box-shadow .15s;
  }
  @media (prefers-color-scheme: dark) {
    button { color: #0f1a13; background: var(--accent); }
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring); }
  .note {
    margin: 14px 0 0;
    font-size: .8rem;
    color: var(--muted);
  }
  .thanks {
    display: none;
    margin: 0;
    color: var(--accent-dark);
    font-weight: 600;
  }
  .done form, .done .note { display: none; }
  .done .thanks { display: block; }
  @media (min-width: 480px) {
    form { flex-direction: row; }
    button { white-space: nowrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21v-8"/>
      <path d="M12 13c0-4-3-7-8-7 0 5 3 7 8 7z"/>
      <path d="M12 15c0-3.5 2.5-6 7-6 0 4.5-2.5 6-7 6z"/>
    </svg>
  </div>
  <h2>Fernwick Plants</h2>
  <p>Get our care tips</p>
  <form onsubmit="event.preventDefault(); document.getElementById('card').classList.add('done');">
    <label for="email">Email address</label>
    <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
    <button type="submit">Subscribe</button>
  </form>
  <p class="note">Watering, light, and seasonal tips. Unsubscribe anytime.</p>
  <p class="thanks" role="status">Thanks! Check your inbox for your first tip. 🌿</p>
</main>
</body>
</html>
