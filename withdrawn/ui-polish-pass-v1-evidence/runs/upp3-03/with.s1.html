<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Plants – Care tips</title>
<style>
  :root {
    --bg: #f1f4ec;
    --card: #ffffff;
    --ink: #1f2a22;
    --muted: #55645a;
    --line: #8a9a8e;
    --accent: #2f6b45;
    --accent-dark: #245436;
    --error: #a3261c;
    --ok: #1f6b3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 1px 2px rgba(31,42,34,.08), 0 8px 24px rgba(31,42,34,.08);
  }
  .leaf { font-size: 28px; line-height: 1; margin-bottom: 12px; }
  h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
    line-height: 1.2;
    font-family: Georgia, "Times New Roman", serif;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .lede { margin: 0 0 22px; color: var(--muted); }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  .row { display: flex; gap: 10px; }
  input {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    padding: 11px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
  }
  input::placeholder { color: #6b7a70; }
  input[aria-invalid="true"] { border-color: var(--error); }
  button {
    flex: 0 0 auto;
    font: inherit;
    font-weight: 600;
    padding: 11px 20px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button[aria-disabled="true"] { opacity: .7; cursor: progress; }
  input:focus-visible, button:focus-visible {
    outline: 3px solid #1d5fd1;
    outline-offset: 2px;
  }
  .msg { min-height: 1.5em; margin: 10px 0 0; font-size: .9rem; overflow-wrap: anywhere; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .fine { margin: 14px 0 0; font-size: .8rem; color: var(--muted); }
  @media (max-width: 380px) {
    .card { padding: 24px 18px; }
    .row { flex-direction: column; }
    button { width: 100%; }
  }
  @media (prefers-reduced-motion: no-preference) {
    button, input { transition: background-color .15s, border-color .15s; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="leaf" aria-hidden="true">🌿</div>
  <h1>Fernwick Plants</h1>
  <p class="lede" id="lede">Get our care tips, straight to your inbox.</p>
  <form id="form" novalidate>
    <label for="email">Email address</label>
    <div class="row">
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
             placeholder="you@example.com" required aria-describedby="msg">
      <button type="submit" id="btn">Subscribe</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="fine">You can unsubscribe at any time.</p>
</main>
<script>
  const form = document.getElementById('form');
  const email = document.getElementById('email');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  let busy = false;

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + (kind || '');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    const value = email.value.trim();
    if (!value) {
      email.setAttribute('aria-invalid', 'true');
      show('Enter your email address so we know where to send the tips.', 'error');
      email.focus();
      return;
    }
    if (!email.validity.valid || !/.+@.+\..+/.test(value)) {
      email.setAttribute('aria-invalid', 'true');
      show('That doesn\u2019t look like an email address. Check it for typos, like name@example.com.', 'error');
      email.focus();
      return;
    }
    email.removeAttribute('aria-invalid');
    busy = true;
    btn.setAttribute('aria-disabled', 'true');
    btn.textContent = 'Subscribing\u2026';
    show('');
    // Demo only: replace with a real request to your signup endpoint.
    setTimeout(function () {
      busy = false;
      btn.removeAttribute('aria-disabled');
      btn.textContent = 'Subscribe';
      show('Thanks! Care tips will be sent to ' + value + '.', 'ok');
      form.reset();
    }, 600);
  });

  email.addEventListener('input', function () {
    if (email.getAttribute('aria-invalid')) {
      email.removeAttribute('aria-invalid');
      show('');
    }
  });
</script>
</body>
</html>
