<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Ceramics</title>
<style>
  :root {
    --clay: #f3ece2;
    --ink: #2b2622;
    --moss: #4a5a43;
    --moss-dark: #3a4834;
    --terracotta: #b8603e;
    --muted: #6b6259;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--clay);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 48px;
  }
  .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    font-weight: 600;
  }
  nav a {
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    margin-left: 32px;
  }
  nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .hero {
    max-width: 1200px;
    margin: 0 auto;
    padding: 96px 48px 128px;
  }
  .eyebrow {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--terracotta);
    font-weight: 600;
    margin-bottom: 28px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(48px, 7.4vw, 104px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    max-width: 12ch;
  }
  h1 em {
    font-style: italic;
    color: var(--moss);
  }
  .sub {
    margin-top: 32px;
    max-width: 540px;
    font-size: 20px;
    line-height: 1.55;
    color: var(--muted);
  }
  .actions {
    margin-top: 44px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-block;
    padding: 18px 32px;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    border: 2px solid var(--moss);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .btn-primary { background: var(--moss); color: #fff; }
  .btn-primary:hover { background: var(--moss-dark); border-color: var(--moss-dark); }
  .btn-secondary { background: transparent; color: var(--moss); }
  .btn-secondary:hover { background: var(--moss); color: #fff; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--terracotta); outline-offset: 3px; }
  @media (max-width: 640px) {
    header.nav, .hero { padding-left: 24px; padding-right: 24px; }
    .hero { padding-top: 56px; padding-bottom: 72px; }
    nav a { margin-left: 18px; }
    .sub { font-size: 18px; }
  }
</style>
</head>
<body>
  <header class="nav">
    <div class="brand">Fernwick Ceramics</div>
    <nav>
      <a href="#">Shop</a>
      <a href="#">Classes</a>
      <a href="#">About</a>
    </nav>
  </header>

  <main class="hero">
    <span class="eyebrow">Hand-thrown dinnerware</span>
    <h1>Made by hand, <em>meant for your table.</em></h1>
    <p class="sub">Two potters, one small studio. Every bowl and plate is thrown, glazed, and fired by us, and on weekends you can come glaze your own.</p>
    <div class="actions">
      <a class="btn btn-primary" href="#">Shop the spring collection</a>
      <a class="btn btn-secondary" href="#">Book a class</a>
    </div>
  </main>
</body>
</html>
