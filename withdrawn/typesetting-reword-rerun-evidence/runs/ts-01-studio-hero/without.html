<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Ceramics — Hand-thrown dinnerware & weekend glazing classes</title>
<style>
  :root {
    --clay: #f3ece2;
    --clay-deep: #e6d9c6;
    --ink: #2a2622;
    --muted: #5d544b;
    --fern: #3f5a43;
    --fern-dark: #2f4533;
    --terracotta: #b4573a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    background: var(--clay);
    color: var(--ink);
    line-height: 1.5;
  }
  .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  header.nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 48px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .brand {
    font-family: ui-serif, Georgia, serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-decoration: none;
  }
  nav a {
    margin-left: 32px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
  }
  nav a:hover, nav a:focus-visible { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

  .hero {
    position: relative;
    overflow: hidden;
    max-width: 1280px;
    margin: 0 auto;
    padding: 88px 48px 120px;
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr);
    gap: 48px;
    align-items: center;
  }
  .eyebrow {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--terracotta);
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(3.25rem, 7vw, 6rem);
    line-height: 1.02;
    letter-spacing: -0.025em;
    font-weight: 700;
    max-width: 12ch;
  }
  h1 em { font-style: italic; color: var(--fern); font-weight: 600; }
  .lede {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.3rem;
    color: var(--muted);
    max-width: 34em;
    margin-top: 28px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 44px; }
  .btn {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: inline-block;
    padding: 17px 30px;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 600;
    text-decoration: none;
    border: 2px solid var(--fern);
    transition: background .15s, color .15s, transform .15s;
  }
  .btn-primary { background: var(--fern); color: #fff; }
  .btn-primary:hover { background: var(--fern-dark); border-color: var(--fern-dark); }
  .btn-secondary { background: transparent; color: var(--fern-dark); }
  .btn-secondary:hover { background: var(--fern); color: #fff; }
  .btn:focus-visible { outline: 3px solid var(--terracotta); outline-offset: 3px; }
  .btn:active { transform: translateY(1px); }

  /* Decorative CSS-only vessel */
  .art { display: flex; justify-content: center; }
  .art svg { width: 100%; max-width: 380px; height: auto; }

  @media (max-width: 900px) {
    header.nav { padding: 20px 24px; }
    .hero { grid-template-columns: 1fr; padding: 48px 24px 72px; }
    .art { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="#">Fernwick Ceramics</a>
    <nav aria-label="Primary">
      <a href="#">Shop</a>
      <a href="#">Classes</a>
      <a href="#">Our studio</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">Hand-thrown in a two-person studio</p>
        <h1>Plates made to be <em>used</em>, every day.</h1>
        <p class="lede">Fernwick makes small-batch dinnerware shaped on the wheel and glazed by hand, and on weekends we'll teach you to glaze your own.</p>
        <div class="actions">
          <a class="btn btn-primary" href="#shop">Shop the spring collection</a>
          <a class="btn btn-secondary" href="#classes">Book a class</a>
        </div>
      </div>
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 380 440" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="190" cy="410" rx="150" ry="14" fill="#e6d9c6"/>
          <path d="M120 60 Q110 60 112 80 Q60 160 80 280 Q95 380 190 390 Q285 380 300 280 Q320 160 268 80 Q270 60 260 60 Z" fill="#3f5a43"/>
          <path d="M120 60 Q190 82 260 60 Q190 48 120 60 Z" fill="#2f4533"/>
          <path d="M92 190 Q190 230 288 190 L296 232 Q190 276 84 232 Z" fill="#f3ece2" opacity=".9"/>
          <path d="M100 300 Q190 335 280 300" stroke="#b4573a" stroke-width="8" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </section>
  </main>
</body>
</html>
