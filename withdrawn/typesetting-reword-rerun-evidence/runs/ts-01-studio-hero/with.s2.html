<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Ceramics — Hand-thrown dinnerware</title>
<style>
  :root {
    --clay: #f3ede4;
    --ink: #2b2620;
    --muted: #5e554a;
    --fern: #3f5a43;
    --fern-dark: #2e4332;
    --glaze: #c46a43;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    background: var(--clay);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  header.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 48px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .brand {
    font-family: ui-serif, Georgia, serif;
    font-size: 1.375rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-decoration: none;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9375rem;
    margin-left: 32px;
  }
  nav a:hover, nav a:focus-visible { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

  .hero {
    max-width: 1280px;
    margin: 0 auto;
    padding: 72px 48px 120px;
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr);
    gap: 64px;
    align-items: center;
  }
  .eyebrow {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--glaze);
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(3.25rem, 6.4vw, 5.75rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    font-weight: 600;
    max-width: 12ch;
    text-wrap: balance;
  }
  h1 em { font-style: italic; color: var(--fern); font-weight: 500; }
  .lede {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.25rem;
    line-height: 1.55;
    color: var(--muted);
    max-width: 34em;
    margin-top: 28px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 40px; }
  .btn {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    padding: 16px 28px;
    border-radius: 999px;
    border: 2px solid var(--fern);
    transition: background-color .15s, color .15s;
  }
  .btn.primary { background: var(--fern); color: #fff; }
  .btn.primary:hover { background: var(--fern-dark); border-color: var(--fern-dark); }
  .btn.secondary { color: var(--fern-dark); background: transparent; }
  .btn.secondary:hover { background: var(--fern); color: #fff; }
  .btn:focus-visible { outline: 3px solid var(--glaze); outline-offset: 3px; }

  /* Decorative CSS-only bowl */
  .art { display: flex; justify-content: center; }
  .plate {
    position: relative;
    width: min(100%, 400px);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #f7f1e8 0 30%, transparent 30.5%),
      radial-gradient(circle at 50% 50%, var(--glaze) 0 33%, transparent 33.5%),
      radial-gradient(circle at 35% 30%, #fff8ee, #e4d7c3 70%);
    box-shadow: 0 30px 50px -20px rgba(43,38,32,.35), inset 0 0 0 10px rgba(255,255,255,.35);
  }
  .plate::after {
    content: "";
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    border: 2px solid rgba(63,90,67,.35);
  }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; padding: 40px 24px 72px; }
    header.nav { padding: 20px 24px; }
    .art { display: none; }
  }
</style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="#">Fernwick Ceramics</a>
    <nav>
      <a href="#">Shop</a>
      <a href="#">Classes</a>
      <a href="#">Studio</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">Hand-thrown in a two-person studio</p>
        <h1>Dinnerware made to be <em>used</em>.</h1>
        <p class="lede">Every bowl, plate and mug is thrown by hand and glazed in small batches. Take a set home, or spend a weekend at the wheel and make your own.</p>
        <div class="actions">
          <a class="btn primary" href="#">Shop the spring collection</a>
          <a class="btn secondary" href="#">Book a class</a>
        </div>
      </div>
      <div class="art" aria-hidden="true">
        <div class="plate"></div>
      </div>
    </section>
  </main>
</body>
</html>
