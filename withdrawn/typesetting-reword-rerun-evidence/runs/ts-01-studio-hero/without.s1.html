<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwick Ceramics — Hand-thrown dinnerware</title>
<style>
  :root {
    --clay: #b5593a;
    --clay-dark: #8f4329;
    --cream: #f6efe4;
    --ink: #2b221c;
    --moss: #5d6b4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  nav { display: flex; gap: 32px; font-size: 0.95rem; }
  nav a { color: var(--ink); text-decoration: none; }
  nav a:hover { text-decoration: underline; text-underline-offset: 4px; }

  .hero {
    max-width: 1280px;
    margin: 0 auto;
    padding: 72px 48px 120px;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 64px;
    align-items: center;
  }
  .eyebrow {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--moss);
    margin-bottom: 24px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(3rem, 6.4vw, 5.6rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    font-weight: 700;
    margin-bottom: 28px;
  }
  h1 em { font-style: italic; color: var(--clay); }
  .lede {
    font-size: 1.3rem;
    max-width: 34em;
    color: #4a3d34;
    margin-bottom: 40px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; }
  .btn {
    display: inline-block;
    padding: 16px 30px;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 600;
    text-decoration: none;
    border: 2px solid var(--clay);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .btn-primary { background: var(--clay); color: #fff; }
  .btn-primary:hover { background: var(--clay-dark); border-color: var(--clay-dark); }
  .btn-secondary { background: transparent; color: var(--clay-dark); }
  .btn-secondary:hover { background: var(--clay); color: #fff; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Pure-CSS stack of bowls */
  .art {
    position: relative;
    aspect-ratio: 1;
    max-width: 440px;
    width: 100%;
    justify-self: center;
  }
  .art .disc {
    position: absolute;
    border-radius: 50%;
  }
  .d1 { inset: 0; background: var(--clay); }
  .d2 { inset: 9%; background: var(--cream); }
  .d3 { inset: 14%; background: var(--moss); }
  .d4 { inset: 30%; background: #e8d9c0; box-shadow: inset 0 6px 18px rgba(43,34,28,0.25); }
  .d5 { inset: 44%; background: var(--clay-dark); opacity: 0.85; }

  @media (max-width: 900px) {
    header, .hero { padding-left: 24px; padding-right: 24px; }
    .hero { grid-template-columns: 1fr; padding-top: 40px; padding-bottom: 72px; gap: 48px; }
    nav { gap: 18px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">Fernwick Ceramics</div>
    <nav aria-label="Main">
      <a href="#">Shop</a>
      <a href="#">Classes</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <span class="eyebrow">Two potters · One small studio</span>
        <h1>Dinnerware made by hand, <em>meant for daily use.</em></h1>
        <p class="lede">Every bowl, plate, and mug is thrown on the wheel in our studio, then glazed in colors that look better the more you eat off them.</p>
        <div class="actions">
          <a class="btn btn-primary" href="#">Shop the spring collection</a>
          <a class="btn btn-secondary" href="#">Book a class</a>
        </div>
      </div>
      <div class="art" role="img" aria-label="Illustration of a glazed ceramic bowl seen from above">
        <div class="disc d1"></div>
        <div class="disc d2"></div>
        <div class="disc d3"></div>
        <div class="disc d4"></div>
        <div class="disc d5"></div>
      </div>
    </section>
  </main>
</body>
</html>
