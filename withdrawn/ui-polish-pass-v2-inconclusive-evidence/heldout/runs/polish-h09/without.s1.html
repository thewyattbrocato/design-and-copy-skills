<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage Queue</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7; --panel: #ffffff; --line: #e2e5ea; --text: #1b1f27; --muted: #667085;
  --sel: #e8f0fe; --sel-line: #2f6fed; --accent: #2f6fed; --accent-text: #fff;
  --urgent: #c4261d; --urgent-bg: #fde8e6; --high: #a4570a; --high-bg: #fdf0dc;
  --norm: #3b4a66; --norm-bg: #e8ecf3; --low: #2b6b45; --low-bg: #e1f3e8;
  --kbd: #eef0f3; --shadow: 0 6px 24px rgba(16,24,40,.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151a; --panel: #1b1f26; --line: #2c323c; --text: #e8ebf0; --muted: #98a2b3;
    --sel: #1e2c47; --sel-line: #6b9bff; --accent: #6b9bff; --accent-text: #0c1424;
    --urgent: #ff8f86; --urgent-bg: #3a1c1a; --high: #f2b866; --high-bg: #38280f;
    --norm: #b6c2da; --norm-bg: #29303d; --low: #7fd3a0; --low-bg: #17302280;
    --kbd: #2a303a; --shadow: 0 6px 24px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 16px; padding: 14px 20px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.stats { display: flex; gap: 8px; margin-left: auto; font-variant-numeric: tabular-nums; }
.stat { padding: 3px 10px; border-radius: 999px; background: var(--norm-bg); color: var(--norm); font-size: 12px; font-weight: 600; }
.stat b { font-weight: 700; color: var(--text); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 1.25fr); gap: 16px; padding: 16px 20px; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.card > h2 { margin: 0; padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--line); font-weight: 650; }
#list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; outline: none; }
.row {
  display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center;
  padding: 10px 14px 10px 11px; border-left: 3px solid transparent; border-bottom: 1px solid var(--line);
  cursor: pointer; max-height: 80px; overflow: hidden;
  transition: max-height .22s ease, opacity .18s ease, padding .22s ease, transform .22s ease, background .1s;
}
.row:hover { background: color-mix(in srgb, var(--sel) 45%, transparent); }
.row.sel { background: var(--sel); border-left-color: var(--sel-line); }
#list:focus-visible .row.sel { outline: 2px solid var(--sel-line); outline-offset: -2px; }
.row.leaving { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; border-bottom-width: 0; pointer-events: none; }
.row.leaving.to-me { transform: translateX(24px); }
.row.leaving.dismissed { transform: translateX(-24px); }
.row.entering { max-height: 0; opacity: 0; }
.id { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; grid-row: 1; grid-column: 2; }
.subject { grid-column: 2; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { grid-column: 2; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pri { grid-row: 1 / span 3; grid-column: 1; align-self: center; width: 8px; height: 8px; border-radius: 50%; }
.age { grid-row: 1 / span 3; grid-column: 3; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.age.late { color: var(--urgent); font-weight: 650; }
.p-urgent { background: var(--urgent); } .p-high { background: var(--high); } .p-normal { background: var(--norm); } .p-low { background: var(--low); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.b-urgent { color: var(--urgent); background: var(--urgent-bg); } .b-high { color: var(--high); background: var(--high-bg); }
.b-normal { color: var(--norm); background: var(--norm-bg); } .b-low { color: var(--low); background: var(--low-bg); }
#detail { padding: 18px 20px; overflow-y: auto; flex: 1; }
#detail h3 { margin: 8px 0 4px; font-size: 18px; letter-spacing: -.01em; line-height: 1.3; }
#detail .sub { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
#detail p { margin: 16px 0; white-space: pre-wrap; max-width: 62ch; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; padding: 14px 0 0; border-top: 1px solid var(--line); font-size: 13px; }
dt { color: var(--muted); } dd { margin: 0; }
.actions { display: flex; gap: 8px; margin-top: 20px; }
button {
  font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); display: inline-flex; align-items: center; gap: 8px;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--sel-line); outline-offset: 2px; }
kbd { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--kbd); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); min-width: 18px; text-align: center; display: inline-block; }
button.primary kbd { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.3); color: inherit; }
.empty { margin: auto; text-align: center; color: var(--muted); padding: 40px 20px; }
.empty .big { font-size: 34px; margin-bottom: 6px; }
.empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
footer { display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 20px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; }
footer span { display: inline-flex; align-items: center; gap: 6px; }
#toast {
  position: fixed; left: 50%; bottom: 56px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow);
  font-weight: 550; transition: opacity .18s, transform .18s; display: flex; gap: 10px; align-items: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast kbd { background: rgba(127,127,127,.3); border-color: transparent; color: inherit; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Support triage</h1>
  <div class="stats" aria-label="Session totals">
    <span class="stat"><b id="sQueue">0</b> in queue</span>
    <span class="stat"><b id="sMine">0</b> mine</span>
    <span class="stat"><b id="sDone">0</b> dismissed</span>
  </div>
</header>

<main>
  <section class="card" aria-label="Incoming tickets">
    <h2>Incoming</h2>
    <ul id="list" role="listbox" aria-label="Ticket queue" tabindex="0"></ul>
    <div id="empty" class="empty" hidden>
      <div class="big" aria-hidden="true">✓</div>
      <strong>Queue is clear</strong>
      Nice work. Press <kbd>Z</kbd> to undo your last action.
    </div>
  </section>
  <section class="card" aria-label="Ticket detail">
    <h2>Details</h2>
    <div id="detail"></div>
  </section>
</main>

<footer>
  <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
  <span><kbd>A</kbd> assign to me</span>
  <span><kbd>D</kbd> dismiss</span>
  <span><kbd>Z</kbd> undo</span>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var now = Date.now(), MIN = 60000;
  function mk(id, pri, mins, subject, customer, city, bike, body) {
    return { id: id, pri: pri, created: now - mins * MIN, subject: subject, customer: customer, city: city, bike: bike, body: body };
  }
  var queue = [
    mk("T-4821", "urgent", 38, "Locked out mid-ride, dock won't release", "Priya Raman", "Portland, OR", "Bike #2207 (e-bike)",
       "I'm at the Pearl District station and my bike won't unlock the dock. The app says the ride ended but I'm still being charged per minute. I have to be at work in 20 minutes."),
    mk("T-4822", "urgent", 21, "Brakes feel soft on e-bike", "Marcus Webb", "Austin, TX", "Bike #1184 (e-bike)",
       "Rear brake lever goes almost to the grip. I stopped riding and parked it on Congress Ave. Please pull it from service before someone else rents it."),
    mk("T-4823", "high", 74, "Charged twice for a single day pass", "Elena Rossi", "Chicago, IL", "Day pass",
       "Two charges of $12.00 on my card on Tuesday, one day pass purchased. Screenshot of both receipts attached."),
    mk("T-4824", "high", 52, "Helmet code from app doesn't open lockbox", "Tomasz Nowak", "Denver, CO", "Bike #3310",
       "The lockbox code 4-1-7-2 isn't working. Tried five times. Ride is already started so the meter is running."),
    mk("T-4825", "normal", 128, "Request refund for cancelled group tour", "Aisha Bello", "Seattle, WA", "Waterfront Tour (6 riders)",
       "Rain forced the tour to be cancelled Saturday morning. Group of six, booking ref WT-90318. We'd like a refund rather than a credit."),
    mk("T-4826", "normal", 95, "Can't reset my password", "Daniel Okafor", "Boston, MA", "Account",
       "Reset email never arrives. I checked spam. Account email is the one I'm writing from."),
    mk("T-4827", "low", 210, "Suggestion: add a bell to rental bikes", "Grace Lindqvist", "Minneapolis, MN", "General feedback",
       "Love the service. A bell on the handlebars would help on the lakeside path where it gets crowded with walkers."),
    mk("T-4828", "low", 305, "Receipt needed for expense report", "Hiro Tanaka", "San Diego, CA", "Monthly member",
       "Could you send itemized PDF receipts for last month's rides? Need them for reimbursement by Friday.")
  ];
  var sel = 0, mine = 0, done = 0, history = [], toastTimer;
  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), detail = $("detail"), toast = $("toast");
  var LABEL = { urgent: "Urgent", high: "High", normal: "Normal", low: "Low" };
  var SLA = { urgent: 30, high: 60, normal: 120, low: 240 };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function ageText(t) {
    var m = Math.max(1, Math.round((Date.now() - t.created) / MIN));
    return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60 ? m % 60 + "m" : "");
  }
  function isLate(t) { return (Date.now() - t.created) / MIN > SLA[t.pri]; }

  function rowFor(t) {
    var li = document.createElement("li");
    li.className = "row"; li.id = "row-" + t.id; li.dataset.id = t.id; li.setAttribute("role", "option");
    li.innerHTML = '<span class="pri p-' + t.pri + '" title="' + LABEL[t.pri] + '"></span>' +
      '<span class="id">' + t.id + " · " + LABEL[t.pri] + '</span>' +
      '<span class="age"></span>' +
      '<span class="subject">' + esc(t.subject) + '</span>' +
      '<span class="meta">' + esc(t.customer) + " · " + esc(t.city) + '</span>';
    return li;
  }
  function rowEl(t) { return t && document.getElementById("row-" + t.id); }
  function refreshAges() {
    queue.forEach(function (t) {
      var a = rowEl(t).querySelector(".age");
      a.textContent = ageText(t); a.classList.toggle("late", isLate(t));
    });
    renderDetail();
  }

  function renderDetail() {
    var t = queue[sel];
    if (!t) { detail.innerHTML = '<p style="color:var(--muted)">Nothing selected.</p>'; return; }
    detail.innerHTML =
      '<div class="sub"><span class="badge b-' + t.pri + '">' + LABEL[t.pri] + '</span><span>' + t.id +
      '</span><span>Waiting ' + ageText(t) + (isLate(t) ? " · past SLA" : "") + '</span></div>' +
      '<h3>' + esc(t.subject) + '</h3><p>' + esc(t.body) + '</p>' +
      '<dl><dt>Customer</dt><dd>' + esc(t.customer) + '</dd><dt>Location</dt><dd>' + esc(t.city) +
      '</dd><dt>Item</dt><dd>' + esc(t.bike) + '</dd><dt>Target response</dt><dd>' + SLA[t.pri] + ' min</dd></dl>' +
      '<div class="actions"><button class="primary" data-act="assign">Assign to me <kbd>A</kbd></button>' +
      '<button data-act="dismiss">Dismiss <kbd>D</kbd></button></div>';
  }

  function select(i, scroll) {
    if (!queue.length) { sel = 0; list.removeAttribute("aria-activedescendant"); renderDetail(); return; }
    sel = Math.max(0, Math.min(queue.length - 1, i));
    queue.forEach(function (t, n) {
      var el = rowEl(t), on = n === sel;
      el.classList.toggle("sel", on); el.setAttribute("aria-selected", on);
      if (on) { list.setAttribute("aria-activedescendant", el.id); if (scroll !== false) el.scrollIntoView({ block: "nearest" }); }
    });
    renderDetail();
  }
  function updateStats() {
    $("sQueue").textContent = queue.length; $("sMine").textContent = mine; $("sDone").textContent = done;
    $("empty").hidden = queue.length > 0; list.hidden = queue.length === 0;
  }
  function say(msg, undo) {
    toast.innerHTML = esc(msg) + (undo ? ' <kbd>Z</kbd> undo' : "");
    toast.classList.add("show"); clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 3500);
  }

  function act(kind) {
    var t = queue[sel]; if (!t) return;
    var el = rowEl(t), idx = sel;
    queue.splice(idx, 1);
    history.push({ t: t, idx: idx, kind: kind });
    if (kind === "assign") mine++; else done++;
    el.classList.add("leaving", kind === "assign" ? "to-me" : "dismissed");
    el.removeAttribute("id"); el.setAttribute("aria-hidden", "true");
    setTimeout(function () { el.remove(); }, 260);
    updateStats();
    select(Math.min(idx, queue.length - 1));
    say(kind === "assign" ? t.id + " assigned to you" : t.id + " dismissed", true);
  }
  function undo() {
    var h = history.pop();
    if (!h) { say("Nothing to undo"); return; }
    if (h.kind === "assign") mine--; else done--;
    queue.splice(h.idx, 0, h.t);
    var el = rowFor(h.t), next = rowEl(queue[h.idx + 1]);
    el.classList.add("entering");
    list.insertBefore(el, next || null);
    void el.offsetHeight; el.classList.remove("entering");
    el.querySelector(".age").textContent = ageText(h.t);
    updateStats(); select(h.idx);
    say(h.t.id + " restored to queue");
  }

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === "arrowdown" || k === "j") { select(sel + 1); }
    else if (k === "arrowup" || k === "k") { select(sel - 1); }
    else if (k === "home") { select(0); }
    else if (k === "end") { select(queue.length - 1); }
    else if (k === "a") { act("assign"); }
    else if (k === "d") { act("dismiss"); }
    else if (k === "z") { undo(); }
    else return;
    e.preventDefault();
  });
  list.addEventListener("click", function (e) {
    var r = e.target.closest(".row"); if (!r) return;
    select(queue.findIndex(function (t) { return t.id === r.dataset.id; }), false);
  });
  detail.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) act(b.dataset.act);
  });

  queue.forEach(function (t) { list.appendChild(rowFor(t)); });
  refreshAges(); updateStats(); select(0);
  list.focus({ preventScroll: true });
  setInterval(refreshAges, 30000);
})();
</script>
</body>
</html>
