<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage Queue</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7;
  --panel: #ffffff;
  --line: #e2e5ea;
  --text: #1b1f27;
  --muted: #667085;
  --accent: #2563eb;
  --accent-soft: #e8efff;
  --urgent: #d92d20;
  --high: #d97706;
  --normal: #2563eb;
  --low: #8a93a3;
  --good: #16803c;
  --kbd-bg: #f0f2f5;
  --shadow: 0 8px 24px rgba(16, 24, 40, .16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141a;
    --panel: #1a1d25;
    --line: #2a2e39;
    --text: #e8eaf0;
    --muted: #98a2b3;
    --accent: #6b9bff;
    --accent-soft: #212c47;
    --urgent: #ff6b5e;
    --high: #f5a524;
    --normal: #6b9bff;
    --low: #7d8798;
    --good: #4ade80;
    --kbd-bg: #262a35;
    --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 14px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.stats { display: flex; gap: 20px; margin-left: auto; }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.stat b { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(320px, 440px) 1fr;
  gap: 16px;
  padding: 16px 24px;
}
.pane {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.pane-head {
  padding: 10px 16px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  font-weight: 600;
}
#list {
  list-style: none;
  margin: 0;
  padding: 6px;
  overflow-y: auto;
  flex: 1;
  outline: none;
}
.ticket {
  position: relative;
  display: grid;
  grid-template-columns: 4px 1fr auto;
  gap: 12px;
  padding: 10px 12px 10px 8px;
  border-radius: 8px;
  cursor: pointer;
  max-height: 90px;
  overflow: hidden;
  transition: background .12s, max-height .22s ease, opacity .18s ease, transform .22s ease, padding .22s ease, margin .22s ease;
}
.ticket:hover { background: var(--bg); }
.ticket.selected { background: var(--accent-soft); }
#list:focus-visible .ticket.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
.ticket.leaving { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; transform: translateX(24px); pointer-events: none; }
.bar { border-radius: 2px; background: var(--low); }
.p-urgent .bar { background: var(--urgent); }
.p-high .bar { background: var(--high); }
.p-normal .bar { background: var(--normal); }
.t-main { min-width: 0; }
.t-subject { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-meta { text-align: right; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.t-meta .age { font-variant-numeric: tabular-nums; }
.t-meta .age.late { color: var(--urgent); font-weight: 600; }
.badge {
  font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em;
  padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor;
}
.badge.urgent { color: var(--urgent); }
.badge.high { color: var(--high); }
.badge.normal { color: var(--normal); }
.badge.low { color: var(--low); }

#detail { padding: 24px 28px; overflow-y: auto; flex: 1; }
#detail h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.015em; line-height: 1.25; }
.d-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; margin-bottom: 18px; align-items: center; }
.d-body { font-size: 15px; line-height: 1.6; max-width: 62ch; white-space: pre-line; }
.d-actions { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; }
button {
  font: inherit; font-weight: 600; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  padding: 8px 14px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px;
  transition: background .12s, transform .06s;
}
button:hover { background: var(--bg); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); background: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd {
  font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--kbd-bg); border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 5px; padding: 1px 6px; color: var(--text);
}
button.primary kbd { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.35); color: #fff; }

.empty { margin: auto; text-align: center; color: var(--muted); padding: 40px; }
.empty .big { font-size: 40px; margin-bottom: 8px; }
.empty h2 { color: var(--text); margin: 0 0 4px; font-size: 18px; }

footer {
  display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
  padding: 10px 24px 14px; color: var(--muted); font-size: 12.5px;
}
footer span { display: inline-flex; align-items: center; gap: 6px; }

#toast {
  position: fixed; left: 50%; bottom: 56px;
  transform: translate(-50%, 20px);
  background: #1b1f27; color: #fff;
  padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  display: flex; gap: 12px; align-items: center; max-width: 90vw;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast kbd { background: #343a48; border-color: #4a5163; color: #fff; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; padding: 12px; }
  #detail { padding: 16px; }
  header { padding: 12px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<header>
  <h1>🚲 Support Triage</h1>
  <div class="stats" aria-label="Queue statistics">
    <div class="stat"><b id="sQueue">0</b><span>In queue</span></div>
    <div class="stat"><b id="sMine">0</b><span>Assigned to me</span></div>
    <div class="stat"><b id="sDone">0</b><span>Dismissed</span></div>
  </div>
</header>

<main>
  <section class="pane" aria-label="Incoming tickets">
    <div class="pane-head">Incoming</div>
    <ul id="list" role="listbox" tabindex="0" aria-label="Ticket queue" aria-activedescendant=""></ul>
  </section>
  <section class="pane" aria-label="Ticket detail">
    <div class="pane-head">Details</div>
    <div id="detail"></div>
  </section>
</main>

<footer>
  <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
  <span><kbd>A</kbd> assign to me</span>
  <span><kbd>D</kbd> dismiss</span>
  <span><kbd>Z</kbd> undo</span>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var tickets = [
    { id: 4821, priority: 'urgent', age: 4, customer: 'Maya Okafor', channel: 'Phone', topic: 'Safety',
      subject: 'Brake failed mid-ride on Harbor Trail',
      body: "I was coming down the hill by the harbor and the front brake lever went all the way to the grip. I managed to stop with my feet and I'm okay, but bike #E-2207 is not safe to ride.\n\nPlease pull it from service and let me know what happens next. I'm still at the Pier 9 dock." },
    { id: 4820, priority: 'urgent', age: 17, customer: 'Daniel Reyes', channel: 'App', topic: 'Billing',
      subject: 'Charged $186 for a 20-minute rental',
      body: "My ride yesterday was 20 minutes but my card shows a $186 charge. The receipt says I didn't return the bike to a dock, but the app showed the lock as green when I walked away.\n\nCan someone reverse this today? My bank is already asking questions." },
    { id: 4819, priority: 'high', age: 26, customer: 'Priya Natarajan', channel: 'Email', topic: 'Access',
      subject: "Unlock code never arrives by SMS",
      body: "I've requested the unlock code five times at the Central Station rack and nothing comes through. My phone number is verified and I get other texts fine.\n\nI have a train to catch in 15 minutes, so a manual unlock would be wonderful." },
    { id: 4818, priority: 'high', age: 48, customer: 'Tom Lindqvist', channel: 'Chat', topic: 'Reservation',
      subject: 'Group booking of 12 e-bikes for Saturday not confirmed',
      body: "We booked 12 e-bikes for a team outing on Saturday at 10:00. The confirmation email lists only 8.\n\nWe've paid for all 12. Can you confirm the full reservation, or tell us what's possible before Friday?" },
    { id: 4817, priority: 'normal', age: 73, customer: 'Aiko Tanaka', channel: 'App', topic: 'Account',
      subject: 'Monthly pass still showing as expired',
      body: "I renewed my monthly pass on the 1st and was charged, but the app still says it expired. Rides are being billed at the pay-as-you-go rate.\n\nI've tried logging out and reinstalling the app." },
    { id: 4816, priority: 'normal', age: 112, customer: 'Chris Abara', channel: 'Email', topic: 'Equipment',
      subject: 'Helmet in basket was missing its strap',
      body: "The rental came with a helmet whose chin strap was cut halfway through. I didn't wear it and rode carefully.\n\nJust flagging so someone can check the helmets at the Elm Street station." },
    { id: 4815, priority: 'low', age: 185, customer: 'Sofia Marchetti', channel: 'Email', topic: 'Feedback',
      subject: 'Please add a dock near Riverside Park',
      body: "Love the service. The nearest dock to Riverside Park is a 10-minute walk. A dock by the north gate would get a lot of use on weekends.\n\nNo reply needed, just passing it along." },
    { id: 4814, priority: 'low', age: 240, customer: 'Ben Whitaker', channel: 'Chat', topic: 'Billing',
      subject: 'Request for itemized receipts for last quarter',
      body: "I need itemized receipts for all rides from July through September for expense reporting.\n\nA CSV or PDF export is fine." }
  ];
  var total = tickets.length;
  var mine = 0, dismissed = 0;
  var selectedId = tickets[0].id;
  var undoStack = [];
  var toastTimer;

  var $list = document.getElementById('list');
  var $detail = document.getElementById('detail');
  var $toast = document.getElementById('toast');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmtAge(m) {
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h ' + (m % 60 ? (m % 60) + 'm' : '').trim();
  }
  function isLate(t) {
    return (t.priority === 'urgent' && t.age >= 15) || (t.priority === 'high' && t.age >= 45) || t.age >= 180;
  }
  function indexOfId(id) {
    for (var i = 0; i < tickets.length; i++) if (tickets[i].id === id) return i;
    return -1;
  }

  function renderList() {
    $list.textContent = '';
    tickets.forEach(function (t) {
      var li = el('li', 'ticket p-' + t.priority);
      li.id = 't' + t.id;
      li.dataset.id = t.id;
      li.setAttribute('role', 'option');
      li.appendChild(el('div', 'bar'));
      var main = el('div', 't-main');
      main.appendChild(el('div', 't-subject', t.subject));
      main.appendChild(el('div', 't-sub', '#' + t.id + ' · ' + t.customer + ' · ' + t.topic));
      li.appendChild(main);
      var meta = el('div', 't-meta');
      meta.appendChild(el('span', 'badge ' + t.priority, t.priority));
      meta.appendChild(el('span', 'age' + (isLate(t) ? ' late' : ''), fmtAge(t.age)));
      li.appendChild(meta);
      li.addEventListener('click', function () {
        selectedId = t.id; updateSelection(); renderDetail(); $list.focus();
      });
      $list.appendChild(li);
    });
    updateSelection();
  }

  function updateSelection() {
    var found = false;
    Array.prototype.forEach.call($list.children, function (li) {
      var on = !li.classList.contains('leaving') && Number(li.dataset.id) === selectedId;
      li.classList.toggle('selected', on);
      li.setAttribute('aria-selected', on ? 'true' : 'false');
      if (on) {
        found = true;
        $list.setAttribute('aria-activedescendant', li.id);
        li.scrollIntoView({ block: 'nearest' });
      }
    });
    if (!found) $list.setAttribute('aria-activedescendant', '');
  }

  function renderDetail() {
    $detail.textContent = '';
    var i = indexOfId(selectedId);
    if (i < 0) {
      var box = el('div', 'empty');
      box.appendChild(el('div', 'big', '🎉'));
      box.appendChild(el('h2', null, 'Queue clear'));
      box.appendChild(el('div', null, mine + ' assigned to you, ' + dismissed + ' dismissed. Nice work.'));
      if (undoStack.length) box.appendChild(el('div', null, 'Press Z to undo the last action.'));
      $detail.appendChild(box);
      return;
    }
    var t = tickets[i];
    $detail.appendChild(el('h2', null, t.subject));
    var meta = el('div', 'd-meta');
    meta.appendChild(el('span', 'badge ' + t.priority, t.priority));
    meta.appendChild(el('span', null, '#' + t.id));
    meta.appendChild(el('span', null, t.customer));
    meta.appendChild(el('span', null, 'via ' + t.channel));
    meta.appendChild(el('span', null, t.topic));
    meta.appendChild(el('span', null, 'waiting ' + fmtAge(t.age)));
    $detail.appendChild(meta);
    $detail.appendChild(el('div', 'd-body', t.body));
    var act = el('div', 'd-actions');
    var a = el('button', 'primary'); a.type = 'button';
    a.appendChild(document.createTextNode('Assign to me ')); a.appendChild(el('kbd', null, 'A'));
    a.addEventListener('click', function () { act_('assign'); });
    var d = el('button'); d.type = 'button';
    d.appendChild(document.createTextNode('Dismiss ')); d.appendChild(el('kbd', null, 'D'));
    d.addEventListener('click', function () { act_('dismiss'); });
    act.appendChild(a); act.appendChild(d);
    $detail.appendChild(act);
  }

  function renderStats() {
    document.getElementById('sQueue').textContent = tickets.length;
    document.getElementById('sMine').textContent = mine;
    document.getElementById('sDone').textContent = dismissed;
  }

  function move(delta) {
    if (!tickets.length) return;
    var i = indexOfId(selectedId);
    var n = Math.max(0, Math.min(tickets.length - 1, (i < 0 ? 0 : i) + delta));
    selectedId = tickets[n].id;
    updateSelection(); renderDetail();
  }
  function jump(n) {
    if (!tickets.length) return;
    selectedId = tickets[n < 0 ? tickets.length - 1 : 0].id;
    updateSelection(); renderDetail();
  }

  function act_(kind) {
    var i = indexOfId(selectedId);
    if (i < 0) return;
    var t = tickets[i];
    var li = document.getElementById('t' + t.id);
    tickets.splice(i, 1);
    undoStack.push({ ticket: t, index: i, kind: kind });
    if (kind === 'assign') mine++; else dismissed++;
    var next = tickets[i] || tickets[i - 1];
    selectedId = next ? next.id : null;
    if (li) {
      li.classList.add('leaving');
      li.setAttribute('aria-hidden', 'true');
      setTimeout(function () { if (li.parentNode) li.parentNode.removeChild(li); }, 260);
    }
    updateSelection(); renderDetail(); renderStats();
    toast((kind === 'assign' ? 'Assigned #' : 'Dismissed #') + t.id + (kind === 'assign' ? ' to you' : ''), true);
  }

  function undo() {
    var u = undoStack.pop();
    if (!u) { toast('Nothing to undo', false); return; }
    tickets.splice(Math.min(u.index, tickets.length), 0, u.ticket);
    if (u.kind === 'assign') mine--; else dismissed--;
    selectedId = u.ticket.id;
    renderList(); renderDetail(); renderStats();
    toast('Restored #' + u.ticket.id, false);
  }

  function toast(msg, withUndo) {
    $toast.textContent = msg;
    if (withUndo) {
      var k = el('span'); k.appendChild(document.createTextNode('Undo ')); k.appendChild(el('kbd', null, 'Z'));
      k.style.opacity = '.8';
      $toast.appendChild(k);
    }
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $toast.classList.remove('show'); }, 3500);
  }

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    var k = e.key;
    if (k === 'ArrowDown' || k === 'j') { e.preventDefault(); move(1); }
    else if (k === 'ArrowUp' || k === 'k') { e.preventDefault(); move(-1); }
    else if (k === 'Home') { e.preventDefault(); jump(0); }
    else if (k === 'End') { e.preventDefault(); jump(-1); }
    else if (k === 'a' || k === 'A') { e.preventDefault(); act_('assign'); }
    else if (k === 'd' || k === 'D') { e.preventDefault(); act_('dismiss'); }
    else if (k === 'z' || k === 'Z') { e.preventDefault(); undo(); }
  });

  renderList(); renderDetail(); renderStats();
  $list.focus();
})();
</script>
</body>
</html>
