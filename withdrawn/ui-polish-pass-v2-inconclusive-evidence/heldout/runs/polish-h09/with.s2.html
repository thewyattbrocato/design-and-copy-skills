<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage queue · Spoke &amp; Pedal Support</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f2;
    --panel: #ffffff;
    --ink: #1c211d;
    --muted: #5d665f;
    --line: #dfe3dc;
    --sel-bg: #e9f3ec;
    --sel-bar: #1f7a4d;
    --accent: #1f7a4d;
    --accent-ink: #ffffff;
    --danger: #a3341f;
    --urgent: #b42318; --urgent-bg: #fde8e4;
    --high: #9a5b00;   --high-bg: #fdf0d5;
    --normal: #2c5a8c; --normal-bg: #e4eefa;
    --low: #566057;    --low-bg: #eceee9;
    --focus: #1a5fd0;
    --shadow: 0 1px 2px rgba(20,30,20,.06), 0 4px 16px rgba(20,30,20,.06);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121612;
      --panel: #1a1f1a;
      --ink: #e8ece6;
      --muted: #9aa49b;
      --line: #2b332c;
      --sel-bg: #1f3126;
      --sel-bar: #5fcf93;
      --accent: #5fcf93;
      --accent-ink: #0c1a11;
      --danger: #ff8d79;
      --urgent: #ff9a8b; --urgent-bg: #3d1d19;
      --high: #f2bd6a;   --high-bg: #3a2c12;
      --normal: #8fb9ee; --normal-bg: #1b2a3d;
      --low: #a9b3aa;    --low-bg: #262c27;
      --focus: #7fb0ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 var(--font);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand svg { color: var(--accent); flex: none; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .01em; }
  .brand small { display: block; color: var(--muted); font-size: 12px; }
  .stats { display: flex; gap: 20px; margin: 0; padding: 0; list-style: none; }
  .stats li { text-align: right; }
  .stats b { display: block; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 16px;
    padding: 16px 24px;
  }
  .list-wrap, .detail {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); min-height: 0; overflow: hidden;
  }
  .list-wrap { display: flex; flex-direction: column; }
  .list-head {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    display: flex; justify-content: space-between;
  }
  #list {
    list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; outline: none;
  }
  #list:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); border-radius: 0 0 12px 12px; }
  .row {
    display: grid; grid-template-rows: 1fr; opacity: 1;
    transition: grid-template-rows .18s ease, opacity .16s ease;
    cursor: pointer;
  }
  .row > .inner {
    overflow: hidden; min-height: 0;
    padding: 12px 16px 12px 13px; border-left: 3px solid transparent;
    border-bottom: 1px solid var(--line);
  }
  .row[aria-selected="true"] > .inner { background: var(--sel-bg); border-left-color: var(--sel-bar); }
  .row:hover:not([aria-selected="true"]) > .inner { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  .row.leaving { grid-template-rows: 0fr; opacity: 0; pointer-events: none; }
  .row.leaving > .inner { padding-top: 0; padding-bottom: 0; border-bottom-width: 0; }
  .row-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .row-top .age { margin-left: auto; font-variant-numeric: tabular-nums; }
  .subject { font-weight: 600; margin: 4px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snippet { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name { color: var(--ink); font-weight: 500; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    padding: 1px 8px; border-radius: 99px;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .p-urgent { color: var(--urgent); background: var(--urgent-bg); }
  .p-high   { color: var(--high);   background: var(--high-bg); }
  .p-normal { color: var(--normal); background: var(--normal-bg); }
  .p-low    { color: var(--low);    background: var(--low-bg); }

  .detail { display: flex; flex-direction: column; }
  .detail-body { padding: 24px 28px; overflow-y: auto; flex: 1; }
  .detail h2 { font-size: 22px; margin: 10px 0 6px; line-height: 1.25; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .detail p.msg { font-size: 16px; max-width: 60ch; margin: 0 0 14px; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 20px 0 0; font-size: 14px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  .actions { display: flex; gap: 10px; padding: 14px 28px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--ink) 2%, var(--panel)); }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
  }
  button:hover { border-color: var(--muted); }
  button:active { transform: translateY(1px); }
  button:focus-visible, #list:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.primary:hover { filter: brightness(1.06); }
  button.danger { color: var(--danger); }
  kbd {
    font: 600 11px/1 var(--mono); padding: 3px 6px; border-radius: 5px;
    border: 1px solid var(--line); border-bottom-width: 2px; background: var(--bg); color: var(--muted);
  }
  button.primary kbd { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.35); color: inherit; }

  .empty {
    flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px; gap: 6px; color: var(--muted);
  }
  .empty svg { color: var(--accent); margin-bottom: 8px; }
  .empty h2 { color: var(--ink); margin: 0; font-size: 20px; }
  .empty p { margin: 0; max-width: 36ch; }
  body.is-empty .empty { display: flex; }
  body.is-empty .detail-body, body.is-empty .actions { display: none; }
  body.is-empty #list { display: none; }
  .list-empty { padding: 28px 16px; color: var(--muted); text-align: center; display: none; }
  body.is-empty .list-empty { display: block; }

  footer {
    display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center;
    padding: 10px 24px 14px; color: var(--muted); font-size: 13px;
  }
  footer span { display: inline-flex; align-items: center; gap: 6px; }

  .toast {
    position: fixed; left: 50%; bottom: 56px; transform: translate(-50%, 16px);
    background: var(--ink); color: var(--bg); padding: 10px 12px 10px 16px; border-radius: 10px;
    display: flex; align-items: center; gap: 14px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    max-width: calc(100vw - 32px); box-shadow: 0 8px 28px rgba(0,0,0,.28);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 4px 10px; }
  .toast kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .8; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); padding: 12px; }
    header { padding: 12px 16px; }
    .detail-body { padding: 16px; }
    .actions { padding: 12px 16px; flex-wrap: wrap; }
    footer { display: none; }
    .toast { bottom: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .row, .toast { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9 8h5l4.5 8.5M9 8 12 16.5h-6.5M14 8l-1.5-3H10"/></svg>
    <div><h1>Triage queue</h1><small>Spoke &amp; Pedal Support</small></div>
  </div>
  <ul class="stats" aria-label="Session totals">
    <li><b id="nQueue">0</b><span>In queue</span></li>
    <li><b id="nMine">0</b><span>Assigned to me</span></li>
    <li><b id="nGone">0</b><span>Dismissed</span></li>
  </ul>
</header>

<main>
  <section class="list-wrap" aria-label="Incoming tickets">
    <div class="list-head"><span>Incoming</span><span>Oldest first by priority</span></div>
    <ul id="list" role="listbox" tabindex="0" aria-label="Ticket queue. Arrow keys to move, A to assign to me, D to dismiss."></ul>
    <div class="list-empty">Nothing waiting.</div>
  </section>

  <section class="detail" aria-label="Selected ticket">
    <div class="detail-body" id="detail"></div>
    <div class="actions">
      <button class="primary" id="btnAssign" type="button">Assign to me <kbd>A</kbd></button>
      <button class="danger" id="btnDismiss" type="button">Dismiss <kbd>D</kbd></button>
    </div>
    <div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>
      <h2>Queue clear</h2>
      <p id="emptyMsg">Nice work. New tickets will show up here.</p>
      <p style="margin-top:14px"><button type="button" id="btnUndoEmpty">Undo last action <kbd>Z</kbd></button></p>
    </div>
  </section>
</main>

<footer aria-hidden="true">
  <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
  <span><kbd>A</kbd> assign to me</span>
  <span><kbd>D</kbd> dismiss</span>
  <span><kbd>Z</kbd> undo</span>
  <span><kbd>Home</kbd><kbd>End</kbd> jump</span>
</footer>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastUndo">Undo <kbd>Z</kbd></button></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function () {
  var tickets = [
    { id: "SP-4821", pri: "urgent", name: "Marcus Webb", chan: "Phone", mins: 4, loc: "Harbor Street dock",
      subject: "Brake failed mid-ride on e-bike #E-217",
      body: "My front brake stopped responding going down the Pier Hill. I stopped by dragging my feet and I'm fine, but the bike is still with me. Please send someone and tell me what happens with the rental charge.",
      plan: "Day pass", bike: "E-217 (Cargo e-bike)" },
    { id: "SP-4819", pri: "urgent", name: "Priya Raman", chan: "Chat", mins: 11, loc: "Central Station",
      subject: "Dock won't release the bike I already paid for",
      body: "I paid for a 3-day rental an hour ago and the dock at Central Station keeps blinking red. There's a line behind me and the app says the bike is unlocked. Can you release it remotely?",
      plan: "3-day rental", bike: "C-102 (City cruiser)" },
    { id: "SP-4815", pri: "high", name: "Tomás Herrera", chan: "Email", mins: 38, loc: "Riverside Park",
      subject: "Charged twice for the same weekend rental",
      body: "I see two charges of $64.00 on my card from Saturday, both labeled Spoke & Pedal. I only rented one bike. Could you refund the duplicate? Booking reference is in the app.",
      plan: "Weekend rental", bike: "M-340 (Mountain)" },
    { id: "SP-4812", pri: "high", name: "Hannah Lindqvist", chan: "App", mins: 52, loc: "University Ave",
      subject: "Locked out of my account after password reset",
      body: "The reset email arrived but the link says it has expired the moment I click it. I've tried three times. I need to get into my account to extend my rental before tonight.",
      plan: "Monthly member", bike: "None active" },
    { id: "SP-4808", pri: "normal", name: "Declan O'Rourke", chan: "Email", mins: 94, loc: "Lakeside Trail",
      subject: "Return a bike at a different location?",
      body: "I'm riding the Lakeside Trail one-way and would like to drop the bike at the north dock instead of where I picked it up. Is there a fee, and is the north dock open after 8pm?",
      plan: "Day pass", bike: "R-058 (Road)" },
    { id: "SP-4803", pri: "normal", name: "Aiko Tanaka", chan: "Chat", mins: 140, loc: "Old Town Market",
      subject: "Child seat missing from my reservation",
      body: "I reserved a bike with a child seat for Saturday morning but the confirmation only lists the bike. Can you confirm the seat is attached, and add a helmet in size XS?",
      plan: "Half-day rental", bike: "C-077 (City cruiser)" },
    { id: "SP-4797", pri: "low", name: "Gabriel Osei", chan: "App", mins: 215, loc: "Harbor Street dock",
      subject: "Feedback: the app should show battery percentage",
      body: "Love the e-bikes. It would help a lot to see the battery percentage before choosing one at the dock, instead of only a green or red icon. Just a suggestion!",
      plan: "Annual member", bike: "None active" },
    { id: "SP-4790", pri: "low", name: "Sofia Marchetti", chan: "Email", mins: 330, loc: "Central Station",
      subject: "Receipt needed for expense report",
      body: "Could you send an itemized receipt for my rentals from the 3rd to the 9th? My company needs the tax breakdown and the booking references on one PDF.",
      plan: "Day pass x4", bike: "None active" }
  ];
  var order = { urgent: 0, high: 1, normal: 2, low: 3 };
  var label = { urgent: "Urgent", high: "High", normal: "Normal", low: "Low" };

  var queue = tickets.slice();
  var selId = queue[0] ? queue[0].id : null;
  var counts = { mine: 0, gone: 0 };
  var history = [];
  var pendingTimer = null, toastTimer = null;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), detail = $("detail");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function age(m) {
    if (m < 1) return "just now";
    if (m < 60) return m + "m";
    var h = Math.floor(m / 60), r = m % 60;
    return h + "h" + (r ? " " + r + "m" : "");
  }
  function sortQueue() {
    queue.sort(function (a, b) { return order[a.pri] - order[b.pri] || b.mins - a.mins; });
  }
  function idx(id) { for (var i = 0; i < queue.length; i++) if (queue[i].id === id) return i; return -1; }
  function announce(t) { $("live").textContent = ""; setTimeout(function () { $("live").textContent = t; }, 30); }

  function renderList() {
    list.innerHTML = queue.map(function (t) {
      return '<li class="row" role="option" id="opt-' + t.id + '" data-id="' + t.id + '" aria-selected="' + (t.id === selId) + '">' +
        '<div class="inner">' +
        '<div class="row-top"><span class="badge p-' + t.pri + '">' + label[t.pri] + '</span><span>' + t.id + '</span><span class="age">' + age(t.mins) + '</span></div>' +
        '<div class="subject">' + esc(t.subject) + '</div>' +
        '<div class="snippet"><span class="name">' + esc(t.name) + '</span> · ' + esc(t.body) + '</div>' +
        '</div></li>';
    }).join("");
    syncSelection();
  }
  function syncSelection() {
    var rows = list.children, active = null;
    for (var i = 0; i < rows.length; i++) {
      var on = rows[i].dataset.id === selId && !rows[i].classList.contains("leaving");
      rows[i].setAttribute("aria-selected", on);
      if (on) active = rows[i];
    }
    if (active) {
      list.setAttribute("aria-activedescendant", active.id);
      active.scrollIntoView({ block: "nearest" });
    } else list.removeAttribute("aria-activedescendant");
    renderDetail();
  }
  function renderDetail() {
    var t = queue[idx(selId)];
    document.body.classList.toggle("is-empty", !queue.length);
    if (!t) { detail.innerHTML = ""; return; }
    detail.innerHTML =
      '<span class="badge p-' + t.pri + '">' + label[t.pri] + '</span>' +
      '<h2>' + esc(t.subject) + '</h2>' +
      '<p class="meta"><span>' + esc(t.name) + '</span><span>' + t.id + '</span><span>via ' + t.chan + '</span><span>waiting ' + age(t.mins) + '</span></p>' +
      '<p class="msg">' + esc(t.body) + '</p>' +
      '<dl class="facts"><dt>Location</dt><dd>' + esc(t.loc) + '</dd><dt>Plan</dt><dd>' + esc(t.plan) + '</dd><dt>Bike</dt><dd>' + esc(t.bike) + '</dd></dl>';
  }
  function renderStats() {
    $("nQueue").textContent = queue.length;
    $("nMine").textContent = counts.mine;
    $("nGone").textContent = counts.gone;
    $("emptyMsg").textContent = counts.mine || counts.gone
      ? counts.mine + " assigned to you, " + counts.gone + " dismissed. New tickets will show up here."
      : "New tickets will show up here.";
    $("btnUndoEmpty").style.display = history.length ? "" : "none";
  }

  function move(delta, absolute) {
    if (!queue.length) return;
    var i = idx(selId);
    i = absolute != null ? absolute : Math.max(0, Math.min(queue.length - 1, i + delta));
    selId = queue[i].id;
    syncSelection();
  }

  function flush() {
    if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; renderList(); }
  }

  function act(kind) {
    var i = idx(selId);
    if (i < 0) return;
    flush();
    var t = queue[i];
    queue.splice(i, 1);
    history.push({ t: t, i: i, kind: kind });
    counts[kind === "assign" ? "mine" : "gone"]++;
    var next = queue[Math.min(i, queue.length - 1)];
    var row = list.querySelector('[data-id="' + t.id + '"]');
    selId = next ? next.id : null;
    if (row) row.classList.add("leaving");
    syncSelection();
    renderStats();
    var msg = kind === "assign" ? t.id + " assigned to you" : t.id + " dismissed";
    toast(msg);
    announce(msg + ". " + (next ? "Now on " + next.subject + "." : "Queue is clear."));
    pendingTimer = setTimeout(function () { pendingTimer = null; renderList(); }, reduce ? 0 : 200);
  }

  function undo() {
    var h = history.pop();
    if (!h) return;
    flush();
    queue.splice(Math.min(h.i, queue.length), 0, h.t);
    counts[h.kind === "assign" ? "mine" : "gone"]--;
    selId = h.t.id;
    renderList(); renderStats();
    var msg = h.t.id + " back in queue";
    toast(msg, true); announce(msg);
  }

  function toast(msg, noUndo) {
    $("toastMsg").textContent = msg;
    $("toastUndo").style.display = noUndo || !history.length ? "none" : "";
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").classList.remove("show"); }, 5000);
  }

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = e.target.tagName;
    var onButton = tag === "BUTTON" && (e.key === "Enter" || e.key === " ");
    if (onButton) return;
    var k = e.key.toLowerCase();
    if (k === "arrowdown" || k === "j") { e.preventDefault(); move(1); }
    else if (k === "arrowup" || k === "k") { e.preventDefault(); move(-1); }
    else if (k === "home") { e.preventDefault(); move(0, 0); }
    else if (k === "end") { e.preventDefault(); move(0, queue.length - 1); }
    else if (k === "a") { e.preventDefault(); act("assign"); }
    else if (k === "d") { e.preventDefault(); act("dismiss"); }
    else if (k === "z") { e.preventDefault(); undo(); }
  });

  list.addEventListener("click", function (e) {
    var row = e.target.closest(".row");
    if (!row || row.classList.contains("leaving")) return;
    selId = row.dataset.id; syncSelection(); list.focus({ preventScroll: true });
  });
  $("btnAssign").addEventListener("click", function () { act("assign"); list.focus({ preventScroll: true }); });
  $("btnDismiss").addEventListener("click", function () { act("dismiss"); list.focus({ preventScroll: true }); });
  $("toastUndo").addEventListener("click", function () { undo(); list.focus({ preventScroll: true }); });
  $("btnUndoEmpty").addEventListener("click", undo);

  // keep wait times honest through the day
  setInterval(function () {
    tickets.forEach(function (t) { t.mins++; });
    if (!pendingTimer) renderList();
  }, 60000);

  sortQueue();
  selId = queue[0] ? queue[0].id : null;
  renderList(); renderStats();
  list.focus();
})();
</script>
</body>
</html>
