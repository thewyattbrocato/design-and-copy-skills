<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign the waiver</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #cbd5e1;
    --accent: #d9480f;
    --accent-dark: #b53c0a;
    --error: #b91c1c;
    --ok: #15803d;
    --focus: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #4b5563;
      --accent: #f97316;
      --accent-dark: #fb923c;
      --error: #fca5a5;
      --ok: #86efac;
      --focus: #93c5fd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.4;
  }
  main {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 14px;
    padding: 28px 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; line-height: 1.2; }
  .intro { margin: 0 0 24px; color: var(--muted); font-size: .95rem; }
  .field { margin-bottom: 18px; }
  label.lbl { display: block; margin-bottom: 6px; font-weight: 600; font-size: .95rem; }
  .hint { display: block; margin-top: 4px; color: var(--muted); font-size: .85rem; }
  input[type="text"], input[type="email"], input[type="date"] {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  input[aria-invalid="true"] { border-color: var(--error); }
  .error {
    display: none;
    margin-top: 6px;
    color: var(--error);
    font-size: .88rem;
    font-weight: 600;
  }
  .invalid .error { display: block; }
  .check {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  .invalid .check { border-color: var(--error); }
  .check input {
    flex: none;
    width: 26px;
    height: 26px;
    margin: 0;
    accent-color: var(--accent);
  }
  .check span { padding-top: 1px; }
  #guardianField[hidden] { display: none; }
  button.primary {
    width: 100%;
    min-height: 52px;
    margin-top: 6px;
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button.primary { color: #111827; } }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { opacity: .6; cursor: default; }
  #done { text-align: center; padding: 12px 0; }
  #done[hidden] { display: none; }
  #done .tick {
    width: 64px; height: 64px; margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 3px solid var(--ok);
    color: var(--ok);
    font-size: 34px;
    font-weight: 700;
  }
  #done h2 { margin: 0 0 6px; }
  #done p { margin: 0 0 20px; color: var(--muted); }
  @media (max-width: 400px) { main { padding: 22px 16px; } }
  @media (prefers-reduced-motion: no-preference) {
    input, button { transition: border-color .15s, background-color .15s; }
  }
</style>
</head>
<body>
<main>
  <form id="f" novalidate>
    <h1>Sign the waiver</h1>
    <p class="intro">Takes about a minute. All fields are required.</p>

    <div class="field" id="g-name">
      <label class="lbl" for="name">Full name</label>
      <input type="text" id="name" name="name" autocomplete="name" aria-describedby="e-name" required>
      <div class="error" id="e-name" role="alert"></div>
    </div>

    <div class="field" id="g-email">
      <label class="lbl" for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" inputmode="email"
             autocapitalize="off" spellcheck="false" aria-describedby="e-email" required>
      <div class="error" id="e-email" role="alert"></div>
    </div>

    <div class="field" id="g-dob">
      <label class="lbl" for="dob">Date of birth</label>
      <input type="date" id="dob" name="dob" autocomplete="bday" aria-describedby="h-dob e-dob" required>
      <span class="hint" id="h-dob">Month / day / year</span>
      <div class="error" id="e-dob" role="alert"></div>
    </div>

    <div class="field" id="g-guardian" hidden-wrap>
      <div id="guardianField" hidden>
        <label class="lbl" for="guardian">Parent or legal guardian name</label>
        <input type="text" id="guardian" name="guardian" autocomplete="off" aria-describedby="h-guardian e-guardian">
        <span class="hint" id="h-guardian">Required for climbers under 18.</span>
        <div class="error" id="e-guardian" role="alert"></div>
      </div>
    </div>

    <div class="field" id="g-agree">
      <label class="check" for="agree">
        <input type="checkbox" id="agree" name="agree" aria-describedby="e-agree" required>
        <span>I have read and agree to the waiver</span>
      </label>
      <div class="error" id="e-agree" role="alert"></div>
    </div>

    <button type="submit" class="primary" id="submit">Submit</button>
  </form>

  <section id="done" hidden aria-live="polite" tabindex="-1">
    <div class="tick" aria-hidden="true">&#10003;</div>
    <h2>You're all set<span id="doneName"></span>!</h2>
    <p>Your waiver has been signed. Have a great climb.</p>
    <button type="button" class="primary" id="again">Sign another waiver</button>
  </section>
</main>

<script>
(function () {
  var form = document.getElementById('f');
  var done = document.getElementById('done');
  var submitBtn = document.getElementById('submit');
  var guardianField = document.getElementById('guardianField');

  var $ = function (id) { return document.getElementById(id); };

  // Max date = today (local), so future birthdates can't be picked.
  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  $('dob').max = todayStr();
  $('dob').min = '1900-01-01';

  function ageFrom(str) {
    var p = str.split('-');
    if (p.length !== 3) return null;
    var y = +p[0], m = +p[1] - 1, d = +p[2];
    var now = new Date();
    var age = now.getFullYear() - y;
    if (now.getMonth() < m || (now.getMonth() === m && now.getDate() < d)) age--;
    return age;
  }

  function isMinor() {
    var v = $('dob').value;
    if (!v || v > todayStr() || v < '1900-01-01') return false;
    var a = ageFrom(v);
    return a !== null && a < 18;
  }

  // Each rule returns an error message, or '' if valid.
  var rules = {
    name: function () {
      var v = $('name').value.trim();
      if (!v) return 'Please enter your name.';
      if (v.length < 2) return 'Please enter your full name.';
      return '';
    },
    email: function () {
      var v = $('email').value.trim();
      if (!v) return 'Please enter your email.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'That email doesn\u2019t look right. Example: you@example.com';
      return '';
    },
    dob: function () {
      var v = $('dob').value;
      if (!v) return 'Please enter your date of birth.';
      if (v > todayStr()) return 'Date of birth can\u2019t be in the future.';
      if (v < '1900-01-01') return 'Please check the year.';
      return '';
    },
    guardian: function () {
      if (!isMinor()) return '';
      if ($('guardian').value.trim().length < 2) return 'A parent or guardian name is required for under 18.';
      return '';
    },
    agree: function () {
      return $('agree').checked ? '' : 'You need to check this box to continue.';
    }
  };

  function groupFor(key) {
    return key === 'guardian' ? guardianField : $('g-' + key);
  }

  function check(key) {
    var msg = rules[key]();
    var input = $(key);
    var group = groupFor(key);
    $('e-' + key).textContent = msg;
    group.classList.toggle('invalid', !!msg);
    if (msg) input.setAttribute('aria-invalid', 'true');
    else input.removeAttribute('aria-invalid');
    return !msg;
  }

  function syncGuardian() {
    var minor = isMinor();
    guardianField.hidden = !minor;
    $('guardian').required = minor;
    if (!minor) {
      $('guardian').value = '';
      check('guardian');
    }
  }

  // Validate a field when leaving it; re-validate live once it has been flagged.
  ['name', 'email', 'dob', 'guardian'].forEach(function (key) {
    var el = $(key);
    el.addEventListener('blur', function () {
      if (el.value !== '' || groupFor(key).classList.contains('invalid')) check(key);
    });
    el.addEventListener('input', function () {
      if (groupFor(key).classList.contains('invalid')) check(key);
    });
  });
  $('dob').addEventListener('change', function () {
    syncGuardian();
    check('dob');
  });
  $('dob').addEventListener('input', syncGuardian);
  $('agree').addEventListener('change', function () { check('agree'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (submitBtn.disabled) return;

    syncGuardian();
    var order = ['name', 'email', 'dob', 'guardian', 'agree'];
    var firstBad = null;
    order.forEach(function (key) {
      if (!check(key) && !firstBad) firstBad = key;
    });
    if (firstBad) {
      $(firstBad).focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting\u2026';

    var data = {
      name: $('name').value.trim(),
      email: $('email').value.trim(),
      dob: $('dob').value,
      guardian: $('guardian').value.trim(),
      agreed: true,
      signedAt: new Date().toISOString()
    };

    // Hook for saving the waiver goes here (the original form didn't send data anywhere either).
    // Keep this self-contained: no network calls are made by this file.
    void data;

    var first = data.name.split(/\s+/)[0];
    $('doneName').textContent = first ? ', ' + first : '';
    form.hidden = true;
    done.hidden = false;
    done.focus();
  });

  $('again').addEventListener('click', function () {
    form.reset();
    ['name', 'email', 'dob', 'guardian', 'agree'].forEach(function (key) {
      groupFor(key).classList.remove('invalid');
      $('e-' + key).textContent = '';
      $(key).removeAttribute('aria-invalid');
    });
    syncGuardian();
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit';
    done.hidden = true;
    form.hidden = false;
    $('name').focus();
  });
})();
</script>
</body>
</html>
