<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide lookup</title>
<style>
body{font-family:sans-serif;margin:20px;max-width:40rem;line-height:1.4;color:#222}
h1{margin-top:0}
label{display:block;font-weight:600;margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,button{font-size:16px;padding:6px;font-family:inherit}
input{flex:1 1 12rem;min-width:0;border:1px solid #767676;border-radius:3px}
button{cursor:pointer;border:1px solid #767676;border-radius:3px;background:#f4f4f4;color:#222}
button:hover{background:#e8e8e8}
button.primary{background:#1d4f7a;border-color:#1d4f7a;color:#fff}
button.primary:hover{background:#163d5f}
:focus-visible{outline:3px solid #1d4f7a;outline-offset:2px}
.hint{color:#555;margin:8px 0 0}
#out{margin-top:16px}
.ports{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0;padding:0;list-style:none}
.ports button{padding:4px 10px}
.msg{border-left:4px solid #b3261e;padding:4px 12px;background:#fdf1f0}
.msg strong{color:#8c1d18}
.scroll{overflow-x:auto}
table{border-collapse:collapse;margin-top:8px;min-width:18rem}
caption{text-align:left;font-weight:600;padding-bottom:4px}
td,th{border:1px solid #ccc;padding:4px 10px;text-align:left}
th{background:#f4f4f4}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<h1>Tide lookup</h1>
<form id="f" novalidate>
  <label for="port">Port name</label>
  <div class="row">
    <input id="port" name="port" list="portlist" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Kellmouth" aria-describedby="hint">
    <button type="submit" class="primary">Search</button>
  </div>
  <datalist id="portlist"></datalist>
  <p class="hint" id="hint">Type a port and press Enter, or pick one below.</p>
</form>
<div id="out" role="status" aria-live="polite"></div>
<script>
const DATA={"Kellmouth":[["04:12","High","4.1 m"],["10:30","Low","0.6 m"],["16:44","High","4.3 m"],["22:51","Low","0.5 m"]],"Port Arnley":[["05:02","High","3.2 m"],["11:19","Low","0.9 m"]]};
const input=document.getElementById('port');
const out=document.getElementById('out');
const names=Object.keys(DATA);

function el(tag,text,cls){
  const e=document.createElement(tag);
  if(text!=null)e.textContent=text;
  if(cls)e.className=cls;
  return e;
}
function norm(s){return s.trim().replace(/\s+/g,' ').toLowerCase()}

function portButtons(){
  const ul=el('ul',null,'ports');
  names.forEach(n=>{
    const li=document.createElement('li');
    const b=el('button',n);
    b.type='button';
    b.addEventListener('click',()=>{input.value=n;go();input.focus()});
    li.appendChild(b);
    ul.appendChild(li);
  });
  return ul;
}

function show(){
  out.replaceChildren(...arguments);
}

function go(){
  const q=norm(input.value);
  if(!q){
    input.setAttribute('aria-invalid','true');
    const m=el('div',null,'msg');
    m.append(el('strong','Enter a port name. '),document.createTextNode('Type one above, or choose an available port:'));
    show(m,portButtons());
    input.focus();
    return;
  }
  const key=names.find(n=>norm(n)===q);
  if(!key){
    input.setAttribute('aria-invalid','true');
    const m=el('div',null,'msg');
    m.append(el('strong','No tide times found for \u201C'+input.value.trim()+'\u201D. '),document.createTextNode('Check the spelling, or choose an available port:'));
    show(m,portButtons());
    input.focus();
    return;
  }
  input.removeAttribute('aria-invalid');
  input.value=key;
  const wrap=el('div',null,'scroll');
  const t=document.createElement('table');
  t.appendChild(el('caption','Tide times for '+key));
  const head=t.createTHead().insertRow();
  [['Time',''],['Tide',''],['Height','num']].forEach(([h,c])=>{
    const th=el('th',h,c);th.scope='col';head.appendChild(th);
  });
  const body=t.createTBody();
  DATA[key].forEach(r=>{
    const tr=body.insertRow();
    tr.appendChild(el('td',r[0]));
    tr.appendChild(el('td',r[1]));
    tr.appendChild(el('td',r[2],'num'));
  });
  wrap.appendChild(t);
  show(wrap);
}

document.getElementById('portlist').append(...names.map(n=>{const o=document.createElement('option');o.value=n;return o}));
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go()});
input.addEventListener('input',()=>input.removeAttribute('aria-invalid'));

// First-use state: say what the page does and offer the available ports
show(el('p','Available ports:','hint'),portButtons());
</script>
</body>
</html>
