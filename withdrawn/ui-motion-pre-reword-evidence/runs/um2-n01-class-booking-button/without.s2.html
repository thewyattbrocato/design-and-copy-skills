<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnhouse – Saturday Wheel-Throwing</title>
<style>
  :root {
    --bg: #f3ede4;
    --card: #fffdf9;
    --ink: #2b2420;
    --muted: #6f6258;
    --line: #e4d9cb;
    --clay: #b4532a;
    --clay-dark: #8f3f1d;
    --ok: #2f6b4a;
    --warn: #a3411b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1815;
      --card: #272220;
      --ink: #f3ebe1;
      --muted: #b2a496;
      --line: #3b3430;
      --clay: #d9784a;
      --clay-dark: #e88e62;
      --ok: #7fcf9f;
      --warn: #f0a07a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 32px rgba(60,35,20,.10);
  }
  .brand {
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--clay);
    font-weight: 700;
    margin: 0 0 10px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 26px;
    line-height: 1.2;
    margin: 0 0 18px;
    font-weight: 600;
  }
  dl { margin: 0 0 20px; display: grid; gap: 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  dt { color: var(--muted); font-size: 14px; }
  dd { margin: 0; font-weight: 600; text-align: right; font-size: 15px; }
  .price { font-size: 20px; }
  .price small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .seats { margin: 0 0 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .seats-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; }
  .seats-head strong { font-variant-numeric: tabular-nums; }
  .seats-head .low { color: var(--warn); font-weight: 600; }
  .dots { display: flex; gap: 6px; }
  .dot {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: var(--line);
    transition: background-color .25s ease, transform .25s ease;
  }
  .dot.taken { background: var(--muted); opacity: .55; }
  .dot.mine { background: var(--clay); transform: scaleY(1.5); }
  button {
    width: 100%;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--clay);
    border: 0;
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 50px;
    transition: background-color .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) { button { color: #1c1815; } }
  button:hover { background: var(--clay-dark); }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button[aria-disabled="true"] { cursor: default; }
  button[aria-disabled="true"]:active { transform: none; }
  button.loading { background: var(--clay-dark); }
  button.done { background: var(--ok); }
  button.soldout { background: var(--line); color: var(--muted); }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  button:not(.loading) .spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { min-height: 20px; margin: 12px 0 0; font-size: 14px; text-align: center; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--warn); }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .spinner { animation-duration: 1.6s; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="brand">Kilnhouse Pottery</p>
    <h1>Saturday Wheel-Throwing</h1>

    <dl>
      <div class="row"><dt>When</dt><dd>Sat, Oct 10 · 10:00 am – 12:30 pm</dd></div>
      <div class="row"><dt>Price</dt><dd class="price">$65 <small>per person</small></dd></div>
    </dl>

    <div class="seats">
      <div class="seats-head">
        <span>Seats left</span>
        <span id="seatsText"></span>
      </div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>

    <button id="reserve" type="button">
      <span class="spinner" aria-hidden="true"></span>
      <span id="label">Reserve a seat</span>
    </button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
  const TOTAL = 8;
  let taken = 4;          // seats already booked by others
  let mine = false;       // optimistic or confirmed hold for this visitor
  let busy = false;

  const btn = document.getElementById('reserve');
  const label = document.getElementById('label');
  const status = document.getElementById('status');
  const dots = document.getElementById('dots');
  const seatsText = document.getElementById('seatsText');

  for (let i = 0; i < TOTAL; i++) dots.appendChild(Object.assign(document.createElement('span'), { className: 'dot' }));

  function render() {
    const left = TOTAL - taken - (mine ? 1 : 0);
    [...dots.children].forEach((d, i) => {
      d.className = 'dot' + (i < taken ? ' taken' : i === taken && mine ? ' mine' : '');
    });
    seatsText.innerHTML = '<strong' + (left <= 2 ? ' class="low"' : '') + '>' + left + '</strong> of ' + TOTAL;
    if (left === 0 && !mine) {
      btn.className = 'soldout';
      btn.setAttribute('aria-disabled', 'true');
      label.textContent = 'Class is full';
    }
  }

  function fakeRequest() {
    return new Promise((resolve) => setTimeout(resolve, 1000 + Math.random() * 1000));
  }

  btn.addEventListener('click', async () => {
    if (busy || mine || btn.getAttribute('aria-disabled') === 'true') return;
    busy = true;

    // Instant feedback: show progress and hold the seat before the server answers.
    btn.classList.add('loading');
    btn.setAttribute('aria-disabled', 'true');
    btn.setAttribute('aria-busy', 'true');
    label.textContent = 'Saving your seat…';
    status.className = 'status';
    status.textContent = 'Holding a seat for you…';
    mine = true;
    render();

    try {
      await fakeRequest();
      btn.classList.remove('loading');
      btn.classList.add('done');
      label.textContent = '✓ Seat reserved';
      status.className = 'status ok';
      status.textContent = 'You’re in! See you Saturday at 10:00 am.';
    } catch (e) {
      // Roll back the optimistic hold if the request fails.
      mine = false;
      btn.classList.remove('loading');
      btn.removeAttribute('aria-disabled');
      label.textContent = 'Reserve a seat';
      status.className = 'status err';
      status.textContent = 'Something went wrong. Please try again.';
      render();
    } finally {
      btn.removeAttribute('aria-busy');
      busy = false;
    }
  });

  render();
</script>
</body>
</html>
