<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillwater – 21-day streak</title>
<style>
  :root {
    --bg: #0b1220;
    --ink: #f4f1ea;
    --muted: #b9c2d3;
    --gold: #f6c969;
    --teal: #6fd3c6;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }

  .celebration {
    position: fixed; inset: 0; overflow: hidden;
    display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 40%, #16233d 0%, var(--bg) 70%);
    transition: opacity .6s ease, visibility .6s;
  }
  .celebration.closed { opacity: 0; visibility: hidden; }

  /* Gentle glow "breath": ~0.2 Hz, low contrast, never a flash */
  .glow {
    position: absolute; left: 50%; top: 42%;
    width: min(90vw, 760px); aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(246,201,105,.22), rgba(111,211,198,.08) 50%, transparent 70%);
    animation: breathe 5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: .55; scale: .94; }
    50% { opacity: 1; scale: 1.04; }
  }

  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .content { position: relative; z-index: 2; padding: 24px; max-width: 560px; }
  .badge {
    width: 132px; height: 132px; margin: 0 auto 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fbe3a6, var(--gold) 55%, #c9953a);
    color: #3a2a08; box-shadow: 0 0 60px rgba(246,201,105,.35), inset 0 -6px 14px rgba(0,0,0,.15);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  .badge b { font: 700 64px/1 var(--serif); letter-spacing: -.02em; }
  .eyebrow {
    margin: 0 0 10px; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--teal);
    animation: rise .9s .15s cubic-bezier(.2,.8,.2,1) both;
  }
  h1 {
    margin: 0 0 14px; font: 600 clamp(34px, 7vw, 56px)/1.1 var(--serif);
    animation: rise .9s .25s cubic-bezier(.2,.8,.2,1) both;
  }
  p.lead {
    margin: 0 auto 32px; font-size: clamp(16px, 2.4vw, 19px); line-height: 1.55; color: var(--muted); max-width: 440px;
    animation: rise .9s .35s cubic-bezier(.2,.8,.2,1) both;
  }
  button {
    font: 600 16px var(--font); color: #1c1606; background: var(--gold);
    border: 0; border-radius: 999px; padding: 15px 34px; cursor: pointer; min-height: 48px;
    transition: transform .15s ease, background .15s ease;
    animation: rise .9s .45s cubic-bezier(.2,.8,.2,1) both;
  }
  button:hover { background: #ffd886; }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(.98); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .badge, .eyebrow, h1, p.lead, button { animation: none; }
    .celebration { transition: none; }
  }
</style>
</head>
<body>
<main class="celebration" id="screen" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="desc">
  <div class="glow" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="content">
    <div class="badge" aria-hidden="true"><b>21</b></div>
    <p class="eyebrow">Streak unlocked</p>
    <h1 id="title">21 days of writing</h1>
    <p class="lead" id="desc">Three weeks, one page at a time. You showed up for yourself every single day, and that's how a habit becomes part of who you are.</p>
    <button id="go" type="button">Keep going</button>
  </div>
</main>

<script>
(function () {
  var screen = document.getElementById('screen');
  var btn = document.getElementById('go');
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var colors = [[246,201,105],[111,211,198],[244,241,234],[242,140,130],[157,170,245]];
  var dpr, W, H, rockets = [], sparks = [], raf = 0, last = 0, nextLaunch = 0, running = false;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduced.matches) drawStatic();
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function launch() {
    var c = colors[(Math.random() * colors.length) | 0];
    rockets.push({ x: rand(W * .15, W * .85), y: H + 10, vy: -rand(H * .75, H * 1.0), ty: rand(H * .15, H * .5), c: c });
  }

  function burst(x, y, c) {
    var n = 46;
    var speed = rand(120, 190);
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + rand(-.05, .05);
      var s = speed * rand(.7, 1);
      sparks.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: rand(.45, .7), c: c });
    }
  }

  function frame(t) {
    raf = requestAnimationFrame(frame);
    var dt = Math.min((t - last) / 1000, .05); last = t;

    // Fade previous frame to leave soft trails
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // At most one burst every ~1.1s, well under 3 flashes per second
    if (t > nextLaunch && rockets.length < 1) { launch(); nextLaunch = t + rand(1100, 1900); }

    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.y += r.vy * dt; r.vy *= (1 - .6 * dt);
      ctx.fillStyle = 'rgba(' + r.c + ',.8)';
      ctx.beginPath(); ctx.arc(r.x, r.y, 2, 0, 6.283); ctx.fill();
      if (r.y <= r.ty || r.vy > -60) { burst(r.x, r.y, r.c); rockets.splice(i, 1); }
    }

    for (var j = sparks.length - 1; j >= 0; j--) {
      var p = sparks[j];
      p.vx *= (1 - 1.4 * dt); p.vy = p.vy * (1 - 1.4 * dt) + 70 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
      if (p.life <= 0) { sparks.splice(j, 1); continue; }
      ctx.fillStyle = 'rgba(' + p.c + ',' + (p.life * .85).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.2 + p.life * 1.4, 0, 6.283); ctx.fill();
    }
  }

  // Reduced motion: a single still starburst, no animation
  function drawStatic() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    var spots = [[.2,.25,0],[.8,.3,1],[.5,.14,2],[.12,.7,3],[.88,.72,4]];
    spots.forEach(function (s) {
      var c = colors[s[2]], x = W * s[0], y = H * s[1];
      for (var i = 0; i < 28; i++) {
        var a = i / 28 * Math.PI * 2, d1 = 14, d2 = 44 + (i % 2) * 18;
        ctx.strokeStyle = 'rgba(' + c + ',.5)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * d1, y + Math.sin(a) * d1);
        ctx.lineTo(x + Math.cos(a) * d2, y + Math.sin(a) * d2);
        ctx.stroke();
      }
    });
  }

  function start() {
    if (running) return;
    running = true;
    if (reduced.matches) { drawStatic(); return; }
    last = performance.now(); nextLaunch = last + 400;
    raf = requestAnimationFrame(frame);
  }
  function stop() { running = false; cancelAnimationFrame(raf); }

  function close() {
    screen.classList.add('closed');
    screen.setAttribute('aria-hidden', 'true');
    stop();
    // In the app, navigate to the journal here.
  }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else if (!screen.classList.contains('closed')) start();
  });
  reduced.addEventListener('change', function () { stop(); ctx.clearRect(0, 0, W, H); start(); });
  btn.addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  resize();
  start();
  btn.focus({ preventScroll: true });
})();
</script>
</body>
</html>
