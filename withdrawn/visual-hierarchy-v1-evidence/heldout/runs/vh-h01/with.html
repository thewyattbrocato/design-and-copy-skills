<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewrack — Snacks from the cold Atlantic</title>
<style>
  :root {
    --ink: #10262b;
    --ink-soft: #3d555a;
    --bg: #f3efe6;
    --panel: #fbf9f3;
    --line: #d5cfbf;
    --sea: #0e4a52;
    --sea-dark: #093a41;
    --rust: #b4492a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--rust); outline-offset: 3px; }

  .hero {
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 24px 72px;
  }
  .brand {
    font-weight: 700;
    letter-spacing: .02em;
    font-size: 1.125rem;
    color: var(--sea);
    margin-bottom: 72px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 5rem);
    line-height: 1.04;
    letter-spacing: -.02em;
    max-width: 12ch;
  }
  .sub {
    margin-top: 24px;
    font-size: 1.25rem;
    color: var(--ink-soft);
    max-width: 34ch;
  }
  .cta-row {
    margin-top: 36px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 28px;
  }
  .btn {
    display: inline-block;
    background: var(--sea);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.125rem;
    padding: 16px 32px;
    border-radius: 8px;
  }
  .btn:hover { background: var(--sea-dark); }
  .peek {
    font-size: .9375rem;
    color: var(--ink-soft);
  }
  .peek:hover { color: var(--ink); }

  .plans {
    margin-top: 64px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    align-items: stretch;
  }
  .plan {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
  }
  .plan h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .price {
    font-size: 2.25rem;
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1.2;
  }
  .price span {
    font-size: 1rem;
    font-weight: 400;
    color: var(--ink-soft);
  }
  .plan.pick {
    border: 2px solid var(--sea);
    background: #fff;
  }
  .tag {
    margin-top: 8px;
    font-size: .8125rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--rust);
  }

  @media (max-width: 680px) {
    .brand { margin-bottom: 44px; }
    .plans { grid-template-columns: 1fr; margin-top: 48px; }
    .btn { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
<main class="hero">
  <div class="brand">Tidewrack</div>

  <h1>Snacks from the cold Atlantic</h1>
  <p class="sub">Dulse crisps, kelp jerky and nori clusters, shipped monthly.</p>

  <div class="cta-row">
    <a class="btn" href="#start">Start your subscription</a>
    <a class="peek" href="#this-month">See what's in this month's box</a>
  </div>

  <section class="plans" aria-label="Plans">
    <div class="plan">
      <h2>Sampler</h2>
      <p class="price">$14<span>/mo</span></p>
    </div>
    <div class="plan pick">
      <h2>Regular</h2>
      <p class="price">$26<span>/mo</span></p>
      <p class="tag">Most people pick this</p>
    </div>
    <div class="plan">
      <h2>Family</h2>
      <p class="price">$48<span>/mo</span></p>
    </div>
  </section>
</main>
</body>
</html>
