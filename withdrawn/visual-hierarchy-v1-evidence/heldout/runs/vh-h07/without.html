<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order #4471 · Spoke &amp; Wrench</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1d2a24;
    --muted: #5f6b64;
    --line: #e4dfd3;
    --accent: #1f6b4a;
    --accent-ink: #ffffff;
    --accent-soft: #e2f1e8;
    --warn: #8a4b00;
    --warn-soft: #fdf0dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17;
      --card: #1e2622;
      --ink: #eef2ee;
      --muted: #a2aea6;
      --line: #2e3933;
      --accent: #5fd08f;
      --accent-ink: #0c1f15;
      --accent-soft: #1c3a2a;
      --warn: #f3c37a;
      --warn-soft: #3a2d14;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  .screen {
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .brand { font-weight: 700; font-size: 1rem; letter-spacing: .01em; }
  .order { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .status {
    background: var(--accent-soft);
    border-radius: 18px;
    padding: 20px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: .8125rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .badge svg { width: 18px; height: 18px; }
  h1 { font-size: 1.875rem; line-height: 1.15; margin-top: 8px; letter-spacing: -.01em; }
  .closing {
    margin-top: 14px;
    display: inline-block;
    background: var(--warn-soft);
    color: var(--warn);
    font-size: .875rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 6px 20px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    font-size: 1rem;
  }
  .row:last-child { border-bottom: 0; }
  .row .label { color: var(--muted); }
  .row .value { text-align: right; }
  .total .value { font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .total small { display: block; color: var(--muted); font-weight: 400; font-size: .8125rem; margin-top: 2px; }

  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  .addr { text-align: center; color: var(--muted); font-size: .9375rem; margin-bottom: 4px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 52px;
    border-radius: 14px;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .btn svg { width: 20px; height: 20px; }
  .primary { background: var(--accent); color: var(--accent-ink); font-size: 1.0625rem; border: 0; }
  .quiet { background: transparent; color: var(--muted); font-size: .9375rem; font-weight: 500; border: 0; min-height: 48px; }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .primary:active { filter: brightness(.92); }
  .quiet:active { color: var(--ink); }
</style>
</head>
<body>
<main class="screen">
  <header>
    <span class="brand">Spoke &amp; Wrench</span>
    <span class="order">Order #4471</span>
  </header>

  <section class="status" aria-labelledby="status-title">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-7"/></svg>
      Repair complete
    </div>
    <h1 id="status-title">Ready for pickup</h1>
    <span class="closing">Shop closes at 6pm today</span>
  </section>

  <section class="card" aria-label="Order details">
    <div class="row">
      <span class="label">Work done</span>
      <span class="value">Front tire replaced<br>Chain cleaned</span>
    </div>
    <div class="row total">
      <span class="label">Total</span>
      <span class="value">$68.50<small>Due at pickup</small></span>
    </div>
  </section>

  <div class="actions">
    <p class="addr">14 Alder Lane</p>
    <a class="btn primary" href="https://maps.google.com/?q=14+Alder+Lane">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
      Get directions
    </a>
    <a class="btn quiet" href="tel:">Call the shop</a>
  </div>
</main>
</body>
</html>
