<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order #4471 · Spoke &amp; Wrench</title>
<style>
  :root {
    --bg: #f6f4ef;
    --ink: #1d231f;
    --muted: #5b645e;
    --line: #dcd8cd;
    --accent: #1f5e45;
    --accent-ink: #ffffff;
    --ready-bg: #e3f0e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141815;
      --ink: #f1f0ea;
      --muted: #a4aca6;
      --line: #2e352f;
      --accent: #6fd0a0;
      --accent-ink: #0e1a13;
      --ready-bg: #1d2b23;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  main {
    min-height: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    color: var(--muted);
  }
  header strong { color: var(--ink); font-weight: 650; letter-spacing: .01em; }

  .status { margin-top: 36px; }
  .pill {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--ready-bg);
    color: var(--accent);
    font-size: 13px;
    font-weight: 650;
  }
  h1 {
    margin-top: 14px;
    font-size: 40px;
    line-height: 1.1;
    font-weight: 750;
    letter-spacing: -.02em;
  }
  .closing {
    margin-top: 10px;
    font-size: 17px;
    color: var(--muted);
  }
  .closing b { color: var(--ink); font-weight: 650; }

  .details {
    margin-top: 32px;
    border-top: 1px solid var(--line);
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .label { font-size: 14px; color: var(--muted); }
  .work { list-style: none; padding: 0; text-align: right; font-size: 16px; }
  .work li + li { margin-top: 2px; }
  .total { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .total small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); text-align: right; }

  .address { margin-top: 20px; font-size: 15px; color: var(--muted); }
  .address b { color: var(--ink); font-weight: 600; }

  .actions { margin-top: auto; padding-top: 28px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    border-radius: 14px;
    font: inherit;
    font-size: 17px;
    font-weight: 650;
    text-decoration: none;
  }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .quiet {
    margin-top: 6px;
    min-height: 48px;
    color: var(--muted);
    font-weight: 550;
    font-size: 16px;
  }
  .quiet:hover { color: var(--ink); text-decoration: underline; }
</style>
</head>
<body>
<main>
  <header>
    <strong>Spoke &amp; Wrench</strong>
    <span>Order #4471</span>
  </header>

  <section class="status" aria-labelledby="state">
    <span class="pill">Done</span>
    <h1 id="state">Ready for pickup</h1>
    <p class="closing">Shop closes at <b>6 pm today</b></p>
  </section>

  <section class="details" aria-label="Order details">
    <div class="row">
      <span class="label">Work done</span>
      <ul class="work">
        <li>Front tire replaced</li>
        <li>Chain cleaned</li>
      </ul>
    </div>
    <div class="row">
      <span class="label">Total</span>
      <div class="total">$68.50<small>Due at pickup</small></div>
    </div>
  </section>

  <p class="address">Pick up at <b>14 Alder Lane</b></p>

  <div class="actions">
    <a class="btn primary" href="https://maps.google.com/?q=14+Alder+Lane">Get directions</a>
    <a class="btn quiet" href="tel:">Call the shop</a>
  </div>
</main>
</body>
</html>
