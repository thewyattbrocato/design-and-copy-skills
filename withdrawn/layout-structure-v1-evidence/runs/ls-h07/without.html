<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stillwater</title>
<style>
  :root{
    --bg:#0f1b22;
    --bg2:#16272f;
    --card:#1b2f38;
    --ink:#e8f1f2;
    --muted:#8fa7ad;
    --accent:#7fd1c7;
    --accent-ink:#06211f;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#06100f;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    width:100%;max-width:400px;min-height:100vh;
    background:radial-gradient(120% 60% at 50% 0%,var(--bg2) 0%,var(--bg) 60%);
    padding:max(28px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
  }
  @media(min-width:500px){
    .phone{min-height:0;height:820px;border-radius:40px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  }
  header{display:flex;justify-content:space-between;align-items:center}
  .brand{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .streak{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;color:var(--ink);
    background:var(--card);border:1px solid var(--line);
    padding:7px 12px;border-radius:999px;
  }
  .streak .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(127,209,199,.18)}
  .streak b{font-weight:650}
  h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin-top:26px;line-height:1.2}
  h1 span{color:var(--muted);display:block;font-size:15px;font-weight:400;margin-top:6px;letter-spacing:0}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px 0}
  .start{
    position:relative;width:168px;height:168px;border-radius:50%;border:0;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#a6e7de,var(--accent) 60%,#4fb3a8);
    color:var(--accent-ink);font:inherit;font-size:20px;font-weight:650;letter-spacing:.02em;
    box-shadow:0 14px 40px rgba(127,209,199,.28);
    transition:transform .2s ease;
  }
  .start::before,.start::after{
    content:"";position:absolute;inset:-14px;border-radius:50%;
    border:1px solid rgba(127,209,199,.3);
    animation:ripple 4.5s ease-out infinite;
  }
  .start::after{animation-delay:2.25s}
  @keyframes ripple{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  .start:active{transform:scale(.97)}
  .start:focus-visible,.dur button:focus-visible{outline:3px solid #fff;outline-offset:4px}
  .start small{display:block;font-size:12px;font-weight:500;opacity:.7;margin-top:2px}
  @media(prefers-reduced-motion:reduce){.start::before,.start::after{animation:none;opacity:.4}}

  .dur{display:flex;gap:10px;background:var(--card);padding:5px;border-radius:999px;border:1px solid var(--line)}
  .dur button{
    font:inherit;font-size:15px;color:var(--muted);background:none;border:0;
    padding:10px 20px;border-radius:999px;cursor:pointer;min-width:74px;
  }
  .dur button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:650}

  .recent h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
  .recent ul{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:20px}
  .recent li{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  .recent li+li{border-top:1px solid var(--line)}
  .recent .when{font-size:15px}
  .recent .when small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .recent .len{font-size:15px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main class="phone">
  <header>
    <div class="brand">Stillwater</div>
    <div class="streak" aria-label="Today's streak"><span class="dot"></span><span><b>Day 6</b> · 1 session today</span></div>
  </header>

  <h1>Good evening<span>Take a quiet moment to settle.</span></h1>

  <section class="stage" aria-label="Start a session">
    <button class="start" id="start" type="button">Begin<small id="startLabel">10 minutes</small></button>
    <div class="dur" role="group" aria-label="Duration">
      <button type="button" aria-pressed="false" data-m="5">5 min</button>
      <button type="button" aria-pressed="true" data-m="10">10 min</button>
      <button type="button" aria-pressed="false" data-m="20">20 min</button>
    </div>
  </section>

  <section class="recent" aria-labelledby="rh">
    <h2 id="rh">Recent sessions</h2>
    <ul>
      <li><span class="when">Today<small>7:42 AM</small></span><span class="len">10 min</span></li>
      <li><span class="when">Yesterday<small>9:15 PM</small></span><span class="len">20 min</span></li>
      <li><span class="when">Sunday<small>6:50 AM</small></span><span class="len">5 min</span></li>
    </ul>
  </section>
</main>
<script>
  const btns=document.querySelectorAll('.dur button'),label=document.getElementById('startLabel');
  btns.forEach(b=>b.addEventListener('click',()=>{
    btns.forEach(x=>x.setAttribute('aria-pressed',x===b));
    label.textContent=b.dataset.m+' minutes';
  }));
</script>
</body>
</html>
