<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NORTHBOUND</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper: #f1eee6;
    --ink: #1c2b24;
    --rust: #c4501f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Helvetica Neue", "Arial Nova", Arial, "Liberation Sans", sans-serif;
  }
  .lockup {
    text-align: center;
    padding: 0 4vw;
  }
  .wordmark {
    font-size: clamp(48px, 9.4vw, 128px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.07em;
    margin-right: -0.07em; /* offset trailing tracking so it centers optically */
    white-space: nowrap;
    text-transform: uppercase;
  }
  .o {
    display: inline-block;
    position: relative;
    width: 0.74em;
    height: 0.72em;
    border: 0.135em solid currentColor;
    border-radius: 50%;
    vertical-align: baseline;
    margin: 0 0.03em;
  }
  .o.needle::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0.2em;
    height: 0.4em;
    transform: translate(-50%, -52%);
    background: var(--rust);
    clip-path: polygon(50% 0, 100% 100%, 50% 74%, 0 100%);
  }
  .rule {
    width: 0.9em;
    height: 3px;
    background: var(--rust);
    margin: 4.2vh auto 3vh;
    font-size: clamp(48px, 9.4vw, 128px);
    width: 1.1em;
    height: 0.03em;
    min-height: 3px;
  }
  .tagline {
    font-size: clamp(12px, 1.35vw, 17px);
    letter-spacing: 0.42em;
    margin-right: -0.42em;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <main class="lockup">
    <h1 class="wordmark" aria-label="Northbound">N<span class="o needle" aria-hidden="true"></span>RTHB<span class="o" aria-hidden="true"></span>UND</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">Gear for the long way out</p>
  </main>
</body>
</html>
