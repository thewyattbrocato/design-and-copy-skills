<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestwell – Q3 summary</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --line: #262d38;
    --text: #e8ebf0;
    --muted: #9aa4b2;
    --accent: #5fd4a0;
    --out: #f0b27a;
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    letter-spacing: 0.005em;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 24rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    padding: 1.75rem;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 20px 40px rgba(0,0,0,0.4);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    font-size: 0.875rem;
    margin: 0 0 0.25rem;
  }
  .dot {
    width: 0.625rem;
    height: 0.625rem;
    border-radius: 50%;
    background: var(--accent);
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: 1.5rem;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .hero {
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--line);
  }
  .label {
    margin: 0;
    font-size: 0.875rem;
    color: var(--muted);
  }
  .hero .label { margin-bottom: 0.25rem; }
  .interest {
    margin: 0;
    font-size: 2.25rem;
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--accent);
    font-variant-numeric: tabular-nums lining-nums;
  }
  dl { margin: 0; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 0.875rem 0;
    border-bottom: 1px solid var(--line);
  }
  dt { color: var(--muted); font-size: 1rem; }
  dd {
    margin: 0;
    text-align: right;
    font-size: 1rem;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .row.total { border-bottom: 0; padding-bottom: 0; padding-top: 1.125rem; }
  .row.total dt { color: var(--text); font-weight: 600; }
  .row.total dd { font-size: 1.5rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
  .plus { color: var(--accent); }
  .minus { color: var(--out); }
  .note {
    margin: 1.5rem 0 0;
    padding-top: 1rem;
    border-top: 1px dashed var(--line);
    font-size: 0.875rem;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <p class="brand"><span class="dot" aria-hidden="true"></span>Nestwell</p>
    <h1 id="title">Q3 summary</h1>

    <div class="hero">
      <p class="label">Interest earned</p>
      <p class="interest">$182.47</p>
    </div>

    <dl>
      <div class="row">
        <dt>Deposits</dt>
        <dd class="plus">$2,400.00</dd>
      </div>
      <div class="row">
        <dt>Withdrawals</dt>
        <dd class="minus">$310.00</dd>
      </div>
      <div class="row total">
        <dt>Ending balance</dt>
        <dd>$14,962.18</dd>
      </div>
    </dl>

    <p class="note">Rates may change. See terms.</p>
  </main>
</body>
</html>
