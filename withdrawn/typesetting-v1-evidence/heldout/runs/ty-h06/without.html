<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestwell – Q3 summary</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #131a22;
    --card-edge: #222d39;
    --text: #e8eef4;
    --muted: #9aa8b6;
    --accent: #5ee0a8;
    --out: #f2b27a;
    --in: #7cc4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(1000px 500px at 50% -10%, #16212c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(180deg, #161f29 0%, var(--card) 100%);
    border: 1px solid var(--card-edge);
    border-radius: 20px;
    padding: 28px 24px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: .01em;
  }
  .brand {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .balance { margin-bottom: 24px; }
  .label {
    font-size: 13px;
    color: var(--muted);
  }
  .balance .value {
    margin-top: 6px;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  dl { margin: 0; border-top: 1px solid var(--card-edge); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 0;
    border-bottom: 1px solid var(--card-edge);
  }
  dt {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    color: var(--muted);
  }
  dt::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--c);
  }
  dd {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .interest { --c: var(--accent); }
  .interest dd { color: var(--accent); }
  .deposits { --c: var(--in); }
  .withdrawals { --c: var(--out); }
  .note {
    margin: 18px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.4;
  }
</style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <header>
      <h1 id="title">Q3 summary</h1>
      <span class="brand">Nestwell</span>
    </header>

    <section class="balance">
      <div class="label">Ending balance</div>
      <div class="value">$14,962.18</div>
    </section>

    <dl>
      <div class="row interest">
        <dt>Interest earned</dt>
        <dd>$182.47</dd>
      </div>
      <div class="row deposits">
        <dt>Deposits</dt>
        <dd>$2,400.00</dd>
      </div>
      <div class="row withdrawals">
        <dt>Withdrawals</dt>
        <dd>$310.00</dd>
      </div>
    </dl>

    <p class="note">Rates may change. See terms.</p>
  </main>
</body>
</html>
