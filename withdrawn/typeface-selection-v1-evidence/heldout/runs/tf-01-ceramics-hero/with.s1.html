<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln &amp; Fern — Ceramics Studio in Asheville</title>
<meta name="description" content="Kiln & Fern is a small ceramics studio in Asheville, North Carolina. Handmade pottery, classes, and studio visits.">
<style>
  :root {
    --cream: #f7f0e6;
    --sand: #ecdfcc;
    --clay: #b9552f;
    --clay-dark: #8f3f20;
    --fern: #3f5a3a;
    --fern-soft: #dfe6d2;
    --ink: #2b211b;
    --ink-soft: #5e5046;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--cream);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    overflow: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 6vw, 5rem) clamp(1.25rem, 6vw, 5rem);
    background:
      radial-gradient(60rem 40rem at 85% -10%, #f3d3b4 0%, transparent 60%),
      radial-gradient(45rem 35rem at -10% 110%, var(--fern-soft) 0%, transparent 60%),
      var(--cream);
  }

  /* decorative glaze-like shapes */
  .blob {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .blob.one {
    width: clamp(14rem, 32vw, 28rem);
    aspect-ratio: 1;
    right: -6rem;
    top: 12%;
    background: var(--clay);
    opacity: .9;
    border-radius: 48% 52% 55% 45% / 55% 45% 55% 45%;
  }
  .blob.two {
    width: clamp(8rem, 18vw, 15rem);
    aspect-ratio: 1;
    right: clamp(4rem, 16vw, 16rem);
    top: 46%;
    background: var(--fern);
    border-radius: 60% 40% 50% 50% / 45% 55% 45% 55%;
  }
  .blob.three {
    width: clamp(5rem, 9vw, 8rem);
    aspect-ratio: 1;
    right: clamp(1rem, 5vw, 5rem);
    top: 64%;
    background: var(--sand);
    border: 2px solid var(--ink);
  }

  .inner {
    position: relative;
    z-index: 1;
    max-width: 68rem;
    width: 100%;
    margin: 0 auto;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    font-size: .8rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--fern);
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .eyebrow::before {
    content: "";
    width: 2rem;
    height: 2px;
    background: var(--fern);
  }

  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(3rem, 9vw, 6.5rem);
    line-height: .98;
    letter-spacing: -.025em;
    max-width: 11ch;
  }
  h1 em {
    font-style: italic;
    color: var(--clay);
  }

  .tagline {
    margin-top: 1.5rem;
    max-width: 34rem;
    font-size: clamp(1.1rem, 2.2vw, 1.35rem);
    color: var(--ink-soft);
  }

  .cta {
    display: inline-block;
    margin-top: 2.25rem;
    padding: 1rem 1.9rem;
    background: var(--clay);
    color: #fff8f0;
    font-weight: 600;
    font-size: 1.05rem;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--clay-dark);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .cta:hover { transform: translateY(2px); box-shadow: 0 4px 0 var(--clay-dark); }
  .cta:active { transform: translateY(6px); box-shadow: 0 0 0 var(--clay-dark); }
  .cta:focus-visible, .card:focus-visible {
    outline: 3px solid var(--fern);
    outline-offset: 4px;
  }

  .cards {
    margin-top: clamp(3rem, 8vw, 5.5rem);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1rem;
    max-width: 44rem;
  }

  .card {
    display: block;
    padding: 1.1rem 1.2rem 1.2rem;
    background: rgba(255, 252, 246, .85);
    border: 1.5px solid rgba(43, 33, 27, .14);
    border-radius: 1.25rem;
    text-decoration: none;
    color: inherit;
    backdrop-filter: blur(6px);
    transition: transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--fern);
    background: #fffdf8;
  }
  .card h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.35rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .card h2 span {
    color: var(--clay);
    transition: transform .2s ease;
  }
  .card:hover h2 span { transform: translateX(4px); }
  .card p {
    margin-top: .3rem;
    font-size: .9rem;
    color: var(--ink-soft);
  }

  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; }
    .blob.one { top: 4%; opacity: .55; }
    .blob.two, .blob.three { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="blob one" aria-hidden="true"></div>
    <div class="blob two" aria-hidden="true"></div>
    <div class="blob three" aria-hidden="true"></div>

    <div class="inner">
      <p class="eyebrow">Ceramics studio · Asheville, NC</p>
      <h1>Kiln <em>&amp;</em> Fern</h1>
      <p class="tagline">Handmade pottery for everyday rituals, made and taught in the heart of the Blue Ridge.</p>

      <a class="cta" href="#book">Book a studio visit</a>

      <nav class="cards" aria-label="Explore">
        <a class="card" href="#classes">
          <h2>Classes <span aria-hidden="true">→</span></h2>
          <p>Learn to throw and glaze.</p>
        </a>
        <a class="card" href="#shop">
          <h2>Shop <span aria-hidden="true">→</span></h2>
          <p>Mugs, bowls, and vases.</p>
        </a>
        <a class="card" href="#visit">
          <h2>Visit <span aria-hidden="true">→</span></h2>
          <p>Hours and directions.</p>
        </a>
      </nav>
    </div>
  </main>
</body>
</html>
