<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln &amp; Fern — Ceramics Studio in Asheville</title>
<meta name="description" content="Kiln & Fern is a small ceramics studio in Asheville, North Carolina.">
<style>
  :root {
    --clay: #b85c38;
    --clay-dark: #8f431f;
    --cream: #faf3e8;
    --sand: #f0e3d0;
    --fern: #4a5d3a;
    --fern-dark: #33422a;
    --ink: #2b211a;
    --muted: #6b5b4e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--cream);
    line-height: 1.5;
    min-height: 100vh;
  }

  .hero {
    position: relative;
    overflow: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 6vw, 5rem) clamp(1.25rem, 6vw, 5rem);
    background:
      radial-gradient(circle at 85% 15%, rgba(184, 92, 56, 0.18), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(74, 93, 58, 0.16), transparent 50%),
      var(--cream);
  }

  /* Decorative organic shapes, pure CSS */
  .blob {
    position: absolute;
    border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%;
    pointer-events: none;
    z-index: 0;
  }
  .blob.one {
    width: clamp(220px, 34vw, 460px);
    height: clamp(220px, 34vw, 460px);
    right: -6%;
    top: -8%;
    background: var(--clay);
    opacity: 0.14;
  }
  .blob.two {
    width: clamp(160px, 22vw, 300px);
    height: clamp(160px, 22vw, 300px);
    left: -5%;
    bottom: -6%;
    background: var(--fern);
    opacity: 0.14;
    transform: rotate(40deg);
  }

  .inner {
    position: relative;
    z-index: 1;
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
  }

  .eyebrow {
    display: inline-block;
    font-size: 0.8rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fern);
    background: rgba(74, 93, 58, 0.1);
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    margin-bottom: 1.5rem;
    font-weight: 600;
  }

  h1 {
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-size: clamp(3rem, 9vw, 6.5rem);
    line-height: 0.98;
    letter-spacing: -0.03em;
    font-weight: 700;
    color: var(--ink);
  }
  h1 .amp {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-style: italic;
    font-weight: 400;
    color: var(--clay);
    padding: 0 0.05em;
  }

  .tagline {
    margin-top: 1.5rem;
    max-width: 34rem;
    font-size: clamp(1.1rem, 2.2vw, 1.4rem);
    color: var(--muted);
  }

  .cta {
    display: inline-block;
    margin-top: 2.25rem;
    padding: 1rem 2rem;
    background: var(--clay);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 8px 20px -8px rgba(143, 67, 31, 0.6);
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .cta:hover { background: var(--clay-dark); transform: translateY(-2px); }
  .cta:focus-visible, .card:focus-visible {
    outline: 3px solid var(--fern);
    outline-offset: 3px;
  }

  .cards {
    margin-top: clamp(2.5rem, 7vw, 4.5rem);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(255, 255, 255, 0.65);
    border: 1px solid rgba(43, 33, 26, 0.08);
    border-radius: 22px;
    padding: 1.25rem 1.4rem 1.35rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    background: #fff;
    box-shadow: 0 14px 28px -14px rgba(43, 33, 26, 0.3);
  }
  .dot {
    display: block;
    width: 2.25rem;
    height: 2.25rem;
    margin-bottom: 0.9rem;
    background: var(--sand);
    border: 2px solid var(--clay);
    border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%;
  }
  .card:nth-child(2) .dot { border-color: var(--fern); border-radius: 45% 55% 40% 60% / 55% 45% 55% 45%; }
  .card:nth-child(3) .dot { border-color: var(--ink); border-radius: 50%; }

  .card h2 {
    font-size: 1.2rem;
    letter-spacing: -0.01em;
    margin-bottom: 0.25rem;
  }
  .card p {
    font-size: 0.95rem;
    color: var(--muted);
  }
  .card .arrow {
    display: inline-block;
    margin-left: 0.25rem;
    color: var(--clay);
    transition: transform 0.2s ease;
  }
  .card:hover .arrow { transform: translateX(4px); }

  @media (max-width: 700px) {
    .cards { grid-template-columns: 1fr; }
    .hero { justify-content: flex-start; padding-top: 3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="blob one" aria-hidden="true"></div>
    <div class="blob two" aria-hidden="true"></div>

    <div class="inner">
      <span class="eyebrow">Ceramics Studio · Asheville, NC</span>
      <h1>Kiln <span class="amp">&amp;</span> Fern</h1>
      <p class="tagline">Handmade pottery and open-door classes, fired in the heart of Asheville.</p>
      <a class="cta" href="#visit">Book a studio visit</a>

      <nav class="cards" aria-label="Explore">
        <a class="card" href="#classes">
          <span class="dot" aria-hidden="true"></span>
          <h2>Classes <span class="arrow" aria-hidden="true">→</span></h2>
          <p>Learn to throw, hand-build, and glaze.</p>
        </a>
        <a class="card" href="#shop">
          <span class="dot" aria-hidden="true"></span>
          <h2>Shop <span class="arrow" aria-hidden="true">→</span></h2>
          <p>Mugs, bowls, and vases made in-house.</p>
        </a>
        <a class="card" href="#visit">
          <span class="dot" aria-hidden="true"></span>
          <h2>Visit <span class="arrow" aria-hidden="true">→</span></h2>
          <p>Come see the studio and meet the makers.</p>
        </a>
      </nav>
    </div>
  </header>
</body>
</html>
