<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market – Saturdays October 18 &amp; 25</title>
<!-- NOTE FOR THE TEAM: October 18 falls on a Saturday in 2025 but on a Sunday in 2026. Check the weekday and the dates against your calendar before printing. -->
<style>
  :root {
    --night: #0d0911;
    --night-2: #17101c;
    --cream: #f7ead3;
    --cream-dim: #cdbfa6;
    --amber: #ffb54a;
    --ember: #ee5a33;
    --line: rgba(255, 181, 74, 0.28);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--night); }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--cream);
    line-height: 1.5;
    background:
      radial-gradient(60% 40% at 50% 8%, rgba(238, 90, 51, 0.22), transparent 70%),
      radial-gradient(80% 50% at 50% 100%, rgba(255, 181, 74, 0.10), transparent 70%),
      linear-gradient(180deg, var(--night-2), var(--night) 60%);
    -webkit-font-smoothing: antialiased;
  }
  .poster {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 56px) clamp(28px, 5vw, 56px);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Lantern string */
  .lights { margin: 0 calc(-1 * clamp(20px, 5vw, 56px)); line-height: 0; }
  .lights svg { width: 100%; height: auto; display: block; }
  .sway { transform-box: fill-box; transform-origin: 50% 0; animation: sway 6s ease-in-out infinite alternate; }
  .sway:nth-of-type(2n) { animation-duration: 7.5s; animation-delay: -2s; }
  .sway:nth-of-type(3n) { animation-duration: 5.2s; animation-delay: -4s; }
  @keyframes sway { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }

  /* Headline */
  header { text-align: center; padding-top: clamp(8px, 2vw, 20px); }
  .eyebrow {
    font-size: clamp(0.85rem, 1.9vw, 1.05rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 600;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -0.02em;
    margin-top: clamp(12px, 2.5vw, 24px);
    text-wrap: balance;
  }
  h1 .big {
    display: block;
    font-size: clamp(3.6rem, 15.5vw, 9.5rem);
    color: var(--cream);
    text-shadow: 0 0 40px rgba(255, 181, 74, 0.35);
  }
  h1 .small {
    display: block;
    font-size: clamp(2rem, 8.2vw, 5rem);
    font-style: italic;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin-top: 0.12em;
    background: linear-gradient(90deg, var(--amber), var(--ember));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rule {
    display: flex; align-items: center; gap: 16px;
    margin: clamp(22px, 4vw, 40px) auto;
    max-width: 560px; color: var(--amber);
  }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .rule span { font-size: 1.1rem; }

  /* Dates */
  .dates {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: clamp(10px, 3vw, 28px);
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .date {
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: clamp(14px, 3vw, 26px) 10px;
    background: linear-gradient(180deg, rgba(255, 181, 74, 0.08), rgba(255, 181, 74, 0.02));
  }
  .date .dow, .date .mon {
    display: block;
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--cream-dim);
    font-weight: 600;
  }
  .date .num {
    display: block;
    font-family: var(--serif);
    font-size: clamp(3.4rem, 12vw, 6.5rem);
    line-height: 1;
    font-weight: 700;
    color: var(--amber);
    font-variant-numeric: lining-nums tabular-nums;
    margin: 0.06em 0;
  }
  .amp { font-family: var(--serif); font-style: italic; font-size: clamp(1.6rem, 5vw, 2.8rem); color: var(--ember); }

  .time {
    text-align: center;
    margin-top: clamp(18px, 3.5vw, 32px);
    font-family: var(--serif);
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .time em { font-weight: 400; color: var(--amber); padding: 0 0.15em; }

  /* Facts */
  .facts {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    max-width: 720px;
    margin: clamp(24px, 4.5vw, 44px) auto 0;
    width: 100%;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .facts li { text-align: center; padding: clamp(14px, 2.6vw, 24px) 8px; }
  .facts li + li { border-left: 1px solid var(--line); }
  .facts b {
    display: block;
    font-family: var(--serif);
    font-size: clamp(2rem, 6.5vw, 3.4rem);
    line-height: 1.05;
    color: var(--cream);
    font-variant-numeric: lining-nums;
  }
  .facts span {
    display: block;
    margin-top: 4px;
    font-size: clamp(0.8rem, 2vw, 1rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream-dim);
    font-weight: 600;
  }

  /* Place */
  footer { text-align: center; margin-top: auto; padding-top: clamp(26px, 5vw, 48px); }
  .where-label { font-size: clamp(0.85rem, 2vw, 1rem); letter-spacing: 0.28em; text-transform: uppercase; color: var(--amber); font-weight: 600; }
  .where {
    font-family: var(--serif);
    font-size: clamp(1.7rem, 6vw, 3rem);
    font-weight: 700;
    line-height: 1.15;
    margin-top: 6px;
    text-wrap: balance;
  }
  .where small { display: block; font-family: var(--sans); font-size: clamp(1rem, 2.6vw, 1.25rem); font-weight: 400; color: var(--cream-dim); margin-top: 6px; }
  .tag { margin-top: clamp(18px, 3vw, 28px); font-family: var(--serif); font-style: italic; font-size: clamp(1.1rem, 3vw, 1.5rem); color: var(--amber); }

  @media (max-width: 480px) {
    .dates { grid-template-columns: 1fr 1fr; }
    .amp { display: none; }
    .facts li { padding-left: 4px; padding-right: 4px; }
  }
  @media (prefers-reduced-motion: reduce) { .sway { animation: none; } }
  @media print {
    html, body { background: var(--night); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sway { animation: none; }
  }
</style>
</head>
<body>
<main class="poster">

  <div class="lights" aria-hidden="true">
    <svg viewBox="0 0 1200 270" preserveAspectRatio="xMidYMin meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffb54a" stop-opacity="0.55"/>
          <stop offset="1" stop-color="#ee5a33" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#c23a1f"/>
          <stop offset="0.45" stop-color="#ff9a3c"/>
          <stop offset="1" stop-color="#b8321b"/>
        </linearGradient>
        <g id="lantern">
          <circle cx="0" cy="48" r="62" fill="url(#glow)"/>
          <line x1="0" y1="0" x2="0" y2="12" stroke="#3a2a22" stroke-width="2"/>
          <rect x="-11" y="12" width="22" height="7" rx="2" fill="#2a1d18"/>
          <path d="M-11 19 C-34 30 -34 70 -11 82 L11 82 C34 70 34 30 11 19 Z" fill="url(#body)"/>
          <path d="M-5 19 C-17 32 -17 68 -5 82 M5 19 C17 32 17 68 5 82" fill="none" stroke="#7d2412" stroke-opacity="0.45" stroke-width="1.5"/>
          <rect x="-11" y="82" width="22" height="7" rx="2" fill="#2a1d18"/>
          <line x1="0" y1="89" x2="0" y2="108" stroke="#ffb54a" stroke-width="2"/>
          <path d="M-4 108 L4 108 L2 124 L-2 124 Z" fill="#ffb54a"/>
        </g>
      </defs>

      <path d="M-10 36 Q 300 118 600 60 T 1210 40" fill="none" stroke="#3a2a22" stroke-width="3"/>

      <g class="sway" transform="translate(70 62) scale(0.85)"><use href="#lantern"/></g>
      <g class="sway" transform="translate(220 86) scale(1.0)"><use href="#lantern"/></g>
      <g class="sway" transform="translate(380 96) scale(0.8)"><use href="#lantern"/></g>
      <g class="sway" transform="translate(520 80) scale(1.15)"><use href="#lantern"/></g>
      <g class="sway" transform="translate(690 64) scale(0.9)"><use href="#lantern"/></g>
      <g class="sway" transform="translate(840 62) scale(1.05)"><use href="#lantern"/></g>
      <g class="sway" transform="translate(990 52) scale(0.82)"><use href="#lantern"/></g>
      <g class="sway" transform="translate(1130 44) scale(0.95)"><use href="#lantern"/></g>
    </svg>
  </div>

  <header>
    <p class="eyebrow">Street food &middot; Live music &middot; After dark</p>
    <h1>
      <span class="big">Lantern Row</span>
      <span class="small">Night Market</span>
    </h1>
  </header>

  <div class="rule" aria-hidden="true"><span>&#9670;</span></div>

  <section aria-label="When">
    <div class="dates">
      <div class="date">
        <span class="dow">Saturday</span>
        <span class="num">18</span>
        <span class="mon">October</span>
      </div>
      <div class="amp" aria-hidden="true">&amp;</div>
      <div class="date">
        <span class="dow">Saturday</span>
        <span class="num">25</span>
        <span class="mon">October</span>
      </div>
    </div>
    <p class="time">6pm <em>&ndash;</em> midnight</p>
  </section>

  <ul class="facts">
    <li><b>40</b><span>Food stalls</span></li>
    <li><b>8pm</b><span>Live music</span></li>
    <li><b>Free</b><span>Entry</span></li>
  </ul>

  <footer>
    <p class="where-label">Find us at</p>
    <p class="where">The old Ropewalk Yard<small>Carter Street</small></p>
    <p class="tag">Come hungry. Stay late.</p>
  </footer>

</main>
</body>
</html>
