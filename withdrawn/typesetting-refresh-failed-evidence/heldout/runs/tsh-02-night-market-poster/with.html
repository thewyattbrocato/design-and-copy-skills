<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market · Saturdays October 18 &amp; 25 · Ropewalk Yard</title>
<!-- Note: dates are used exactly as supplied ("Saturdays October 18 and 25"). In 2026 those dates fall on Sundays (they were Saturdays in 2025), so please confirm the weekday/year before printing. -->
<style>
  :root {
    --bg: #130e0b;
    --bg-2: #1d140f;
    --cream: #f7ebd5;
    --muted: #cdb99b;
    --amber: #ffb54a;
    --amber-soft: rgba(255, 181, 74, 0.38);
    --red: #e4492f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: var(--sans);
    color: var(--cream);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse 70% 38% at 50% 0%, rgba(255, 150, 50, 0.28), transparent 70%),
      radial-gradient(ellipse 80% 50% at 50% 105%, rgba(228, 73, 47, 0.2), transparent 70%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 60%, var(--bg) 100%);
  }

  /* thin inset frame, like a printed border */
  .poster::after {
    content: "";
    position: absolute;
    inset: clamp(10px, 1.6vw, 22px);
    border: 1px solid var(--amber-soft);
    pointer-events: none;
  }

  /* ---------- lanterns ---------- */
  .lanterns {
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 clamp(28px, 6vw, 90px);
    position: relative;
    z-index: 1;
  }
  .lanterns li {
    --w: clamp(30px, 5.6vw, 62px);
    position: relative;
    width: var(--w);
    padding-top: var(--h);
    transform-origin: 50% 0;
    animation: sway 6s ease-in-out infinite alternate;
    animation-delay: var(--d, 0s);
  }
  .lanterns li::before { /* string */
    content: "";
    position: absolute;
    top: 0; left: 50%;
    width: 1px; height: var(--h);
    background: rgba(247, 235, 213, 0.45);
  }
  .lanterns .body {
    position: relative;
    display: block;
    width: 100%;
    height: calc(var(--w) * 1.25);
    border-radius: 48% 48% 46% 46% / 42% 42% 58% 58%;
    background:
      radial-gradient(ellipse at 50% 55%, #ffe3a8 0%, var(--c) 52%, var(--c2) 100%);
    box-shadow:
      0 0 28px 6px var(--glow),
      0 0 90px 20px var(--glow);
  }
  .lanterns .body::before { /* ribs */
    content: "";
    position: absolute;
    top: 6%; bottom: 6%; left: 25%; right: 25%;
    border-left: 1px solid rgba(60, 15, 5, 0.35);
    border-right: 1px solid rgba(60, 15, 5, 0.35);
    border-radius: 50%;
  }
  .lanterns .body::after { /* cap + tassel */
    content: "";
    position: absolute;
    top: -5px; left: 28%; right: 28%;
    height: 7px;
    background: #2a1a10;
    border-radius: 2px;
    box-shadow: 0 calc(var(--w) * 1.25 + 3px) 0 -1px #2a1a10;
  }
  .lanterns li:nth-child(odd)  { --c: #f0662f; --c2: #b52a18; --glow: rgba(240, 102, 47, 0.34); }
  .lanterns li:nth-child(even) { --c: #ffb54a; --c2: #d9791c; --glow: rgba(255, 181, 74, 0.34); }

  @keyframes sway {
    from { transform: rotate(-2.2deg); }
    to   { transform: rotate(2.2deg); }
  }

  /* ---------- content ---------- */
  .content {
    position: relative;
    z-index: 2;
    flex: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(36px, 7vw, 90px) clamp(28px, 6vw, 72px) clamp(52px, 8vw, 100px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .eyebrow {
    font-size: clamp(0.78rem, 1.5vw, 0.98rem);
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--amber);
  }

  h1 {
    margin-top: clamp(14px, 2.4vw, 28px);
    font-weight: 400;
  }
  h1 .big {
    display: block;
    font-family: var(--serif);
    font-weight: 800;
    font-size: clamp(3.6rem, 15.5vw, 11.5rem);
    line-height: 0.88;
    letter-spacing: -0.025em;
    color: var(--cream);
    text-shadow: 0 0 40px rgba(255, 160, 60, 0.38), 0 2px 0 rgba(0, 0, 0, 0.4);
  }
  h1 .small {
    display: block;
    margin-top: clamp(14px, 2.4vw, 28px);
    font-family: var(--sans);
    font-weight: 600;
    font-size: clamp(1rem, 3.8vw, 2.2rem);
    letter-spacing: 0.4em;
    padding-left: 0.4em; /* optically recentre tracked caps */
    text-transform: uppercase;
    color: var(--amber);
  }

  .rule {
    width: min(100%, 520px);
    height: 1px;
    margin: clamp(30px, 5vw, 56px) 0;
    background: linear-gradient(90deg, transparent, var(--amber-soft) 20%, var(--amber-soft) 80%, transparent);
  }

  /* dates */
  .dates {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(12px, 2.4vw, 28px);
    width: min(100%, 700px);
    list-style: none;
  }
  .dates li {
    padding: clamp(16px, 3vw, 30px) 12px clamp(14px, 2.6vw, 26px);
    border: 1px solid var(--amber-soft);
    background: linear-gradient(180deg, rgba(255, 181, 74, 0.1), rgba(255, 181, 74, 0.02));
    border-radius: 4px;
  }
  .dates .day {
    display: block;
    font-size: clamp(0.72rem, 1.6vw, 0.95rem);
    font-weight: 600;
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dates .num {
    display: block;
    font-family: var(--serif);
    font-weight: 800;
    font-size: clamp(3.4rem, 12vw, 7.4rem);
    line-height: 1;
    font-variant-numeric: lining-nums tabular-nums;
    color: var(--amber);
    text-shadow: 0 0 30px rgba(255, 150, 50, 0.4);
  }
  .dates .month {
    display: block;
    font-size: clamp(0.8rem, 1.8vw, 1.05rem);
    font-weight: 600;
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    text-transform: uppercase;
    color: var(--cream);
  }

  .time {
    margin-top: clamp(24px, 4vw, 44px);
    font-family: var(--serif);
    font-size: clamp(1.7rem, 5.6vw, 3.4rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0.01em;
  }
  .time span { color: var(--amber); padding: 0 0.15em; }

  /* facts */
  .facts {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    width: min(100%, 860px);
    margin-top: clamp(30px, 5vw, 56px);
  }
  .facts li {
    padding: 6px clamp(8px, 2vw, 24px);
  }
  .facts li + li { border-left: 1px solid var(--amber-soft); }
  .facts .fig {
    display: block;
    font-family: var(--serif);
    font-weight: 800;
    font-size: clamp(1.9rem, 6.4vw, 4rem);
    line-height: 1.05;
    font-variant-numeric: lining-nums;
    color: var(--cream);
  }
  .facts .lab {
    display: block;
    margin-top: 6px;
    font-size: clamp(0.68rem, 1.5vw, 0.9rem);
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* place */
  .place { margin-top: clamp(34px, 6vw, 68px); }
  .place .where {
    font-size: clamp(0.74rem, 1.5vw, 0.92rem);
    font-weight: 600;
    letter-spacing: 0.32em;
    padding-left: 0.32em;
    text-transform: uppercase;
    color: var(--amber);
  }
  .place address {
    font-style: normal;
    margin-top: 10px;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(1.8rem, 6vw, 3.6rem);
    line-height: 1.1;
  }
  .place address small {
    display: block;
    margin-top: 6px;
    font-family: var(--sans);
    font-weight: 500;
    font-size: clamp(1rem, 2.6vw, 1.5rem);
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  @media (max-width: 520px) {
    .lanterns li:nth-child(n+6) { display: none; }
    .facts { grid-template-columns: 1fr; gap: 14px; }
    .facts li + li { border-left: 0; border-top: 1px solid var(--amber-soft); padding-top: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .lanterns li { animation: none; }
  }

  @media print {
    @page { margin: 0; }
    .poster { min-height: 100vh; }
    .lanterns li { animation: none; }
  }
</style>
</head>
<body>
  <main class="poster">
    <ul class="lanterns" aria-hidden="true">
      <li style="--h: 34px; --d: -1s"><span class="body"></span></li>
      <li style="--h: 96px; --d: -3s"><span class="body"></span></li>
      <li style="--h: 18px; --d: -2s"><span class="body"></span></li>
      <li style="--h: 70px; --d: -4.5s"><span class="body"></span></li>
      <li style="--h: 28px; --d: -0.5s"><span class="body"></span></li>
      <li style="--h: 104px; --d: -3.5s"><span class="body"></span></li>
      <li style="--h: 48px; --d: -2.5s"><span class="body"></span></li>
    </ul>

    <div class="content">
      <p class="eyebrow">Street food after dark</p>

      <h1>
        <span class="big">Lantern Row</span>
        <span class="small">Night Market</span>
      </h1>

      <div class="rule" role="presentation"></div>

      <ul class="dates" aria-label="Dates">
        <li>
          <span class="day">Saturday</span>
          <span class="num">18</span>
          <span class="month">October</span>
        </li>
        <li>
          <span class="day">Saturday</span>
          <span class="num">25</span>
          <span class="month">October</span>
        </li>
      </ul>

      <p class="time">6pm <span>–</span> midnight</p>

      <ul class="facts">
        <li><span class="fig">Free</span><span class="lab">Entry</span></li>
        <li><span class="fig">40</span><span class="lab">Street food stalls</span></li>
        <li><span class="fig">8pm</span><span class="lab">Live music from</span></li>
      </ul>

      <div class="place">
        <p class="where">Find us at</p>
        <address>
          The old Ropewalk Yard
          <small>Carter Street</small>
        </address>
      </div>
    </div>
  </main>
</body>
</html>
