<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market · Saturdays Oct 18 &amp; 25 · Ropewalk Yard</title>
<!-- Note: Oct 18 and Oct 25 fall on Saturdays in 2025. No year is printed on the poster; check the year before it goes up. -->
<style>
  :root {
    --bg: #0c0914;
    --ink: #f7ecd9;
    --muted: #cdbba2;
    --amber: #ffb347;
    --ember: #ff7a3d;
    --rose: #e8475f;
    --line: rgba(255, 179, 71, .35);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 45% at 50% 0%, rgba(255, 140, 60, .22), transparent 70%),
      radial-gradient(ellipse 70% 40% at 50% 100%, rgba(232, 71, 95, .16), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
  }
  .poster {
    width: 100%;
    max-width: 920px;
    min-height: 100vh;
    padding: clamp(14px, 3vw, 36px);
    display: flex;
    flex-direction: column;
  }
  .frame {
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    outline: 1px solid rgba(255, 179, 71, .15);
    outline-offset: 6px;
    padding: clamp(18px, 4vw, 48px) clamp(18px, 4vw, 52px) clamp(22px, 3.5vw, 40px);
  }

  /* lanterns */
  .lanterns { width: calc(100% + 2 * clamp(18px, 4vw, 52px)); margin: calc(-1 * clamp(18px, 4vw, 48px)) calc(-1 * clamp(18px, 4vw, 52px)) 0; display: block; overflow: hidden; }
  .lanterns svg { display: block; width: 100%; height: auto; }
  .sway { transform-box: fill-box; transform-origin: 50% 0; animation: sway 5s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg); } }
  @media (prefers-reduced-motion: reduce) { .sway { animation: none; } }

  /* headline */
  .eyebrow {
    text-align: center;
    margin-top: clamp(6px, 2vw, 20px);
    font-size: clamp(.72rem, 1.9vw, .95rem);
    letter-spacing: .38em;
    text-transform: uppercase;
    color: var(--amber);
  }
  h1 { text-align: center; margin-top: clamp(10px, 2vw, 22px); font-family: var(--serif); font-weight: 700; line-height: .92; }
  h1 .big {
    display: block;
    font-size: clamp(3.2rem, 15.5vw, 9.5rem);
    letter-spacing: .02em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffe3a3 0%, var(--amber) 45%, var(--ember) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 28px rgba(255, 140, 60, .35));
  }
  h1 .small {
    display: block;
    margin-top: .12em;
    font-size: clamp(1.7rem, 8vw, 5rem);
    font-style: italic;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: .04em;
  }
  .rule { display: flex; align-items: center; gap: 14px; margin: clamp(22px, 4vw, 40px) auto; width: 100%; max-width: 560px; color: var(--amber); }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
  .rule::after { transform: scaleX(-1); }
  .rule i { width: 9px; height: 9px; background: currentColor; transform: rotate(45deg); }

  /* dates */
  .dates { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px, 2.5vw, 24px); }
  .date {
    text-align: center;
    padding: clamp(14px, 3vw, 28px) 10px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255, 179, 71, .1), rgba(255, 179, 71, .02));
  }
  .date .dow { font-size: clamp(.7rem, 1.8vw, .9rem); letter-spacing: .35em; text-transform: uppercase; color: var(--muted); }
  .date .num { display: block; font-family: var(--serif); font-weight: 700; font-size: clamp(3.4rem, 14vw, 8rem); line-height: 1; margin: .05em 0; color: var(--ink); }
  .date .mon { font-size: clamp(.85rem, 2.4vw, 1.2rem); letter-spacing: .4em; text-transform: uppercase; color: var(--amber); font-weight: 600; }
  .time {
    text-align: center;
    margin-top: clamp(16px, 3vw, 28px);
    font-family: var(--serif);
    font-size: clamp(1.5rem, 6.5vw, 3.4rem);
    font-style: italic;
  }
  .time b { font-style: normal; font-weight: 700; color: var(--amber); }

  /* facts */
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 2vw, 20px); margin-top: clamp(22px, 4vw, 40px); }
  .fact { text-align: center; padding: clamp(10px, 2vw, 18px) 6px; border-top: 2px solid var(--rose); }
  .fact strong { display: block; font-family: var(--serif); font-size: clamp(1.4rem, 5vw, 2.6rem); line-height: 1.05; color: var(--ink); }
  .fact span { display: block; margin-top: .4em; font-size: clamp(.68rem, 1.7vw, .88rem); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  /* place */
  .place { margin-top: auto; padding-top: clamp(26px, 5vw, 56px); text-align: center; }
  .place .label { font-size: clamp(.7rem, 1.8vw, .85rem); letter-spacing: .35em; text-transform: uppercase; color: var(--amber); }
  .place .where { margin-top: .4em; font-family: var(--serif); font-size: clamp(1.6rem, 6.5vw, 3.4rem); line-height: 1.1; }
  .place .where em { color: var(--muted); font-size: .62em; display: block; margin-top: .25em; letter-spacing: .04em; }
  .tag { margin-top: clamp(16px, 3vw, 28px); font-size: clamp(.68rem, 1.6vw, .82rem); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 520px) {
    .facts { grid-template-columns: 1fr; }
    .fact { border-top-width: 1px; padding: 12px 6px; }
    .frame { outline: none; }
  }
  @media print {
    .poster { min-height: 100vh; }
    .sway { animation: none; }
  }
</style>
</head>
<body>
<main class="poster">
  <div class="frame">

    <div class="lanterns" aria-hidden="true">
      <svg viewBox="0 0 1000 205" preserveAspectRatio="xMidYMin meet">
        <defs>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffb347" stop-opacity=".5"/>
            <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="core" cx="50%" cy="55%" r="55%">
            <stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/>
            <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
          </radialGradient>
          <symbol id="lantern" viewBox="0 0 100 150">
            <rect x="32" y="0" width="36" height="9" rx="2" fill="#2a1a12"/>
            <path d="M20 9H80C99 42 99 98 80 129H20C1 98 1 42 20 9Z" fill="currentColor"/>
            <path d="M20 9H80C99 42 99 98 80 129H20C1 98 1 42 20 9Z" fill="url(#core)"/>
            <path d="M50 9C30 48 30 90 50 129M50 9C70 48 70 90 50 129M35 9C16 48 16 90 35 129M65 9C84 48 84 90 65 129" fill="none" stroke="#3a1608" stroke-opacity=".35" stroke-width="1.6"/>
            <rect x="30" y="129" width="40" height="8" rx="2" fill="#2a1a12"/>
            <path d="M50 137V149" stroke="#ffb347" stroke-width="3" stroke-linecap="round"/>
          </symbol>
        </defs>

        <!-- halos -->
        <g>
          <circle cx="92" cy="95" r="70" fill="url(#halo)"/>
          <circle cx="245" cy="110" r="78" fill="url(#halo)"/>
          <circle cx="398" cy="115" r="70" fill="url(#halo)"/>
          <circle cx="500" cy="125" r="85" fill="url(#halo)"/>
          <circle cx="602" cy="115" r="70" fill="url(#halo)"/>
          <circle cx="755" cy="110" r="78" fill="url(#halo)"/>
          <circle cx="908" cy="95" r="70" fill="url(#halo)"/>
        </g>

        <!-- string -->
        <path d="M-10 20Q500 110 1010 20" fill="none" stroke="#6b4a33" stroke-width="2"/>

        <!-- lanterns -->
        <g class="sway" style="animation-delay:-1s"><line x1="92" y1="36" x2="92" y2="50" stroke="#6b4a33" stroke-width="2"/><use href="#lantern" x="68" y="50" width="48" height="72" style="color:#ff8a3d"/></g>
        <g class="sway" style="animation-delay:-3s"><line x1="245" y1="54" x2="245" y2="76" stroke="#6b4a33" stroke-width="2"/><use href="#lantern" x="214" y="76" width="62" height="93" style="color:#e8475f"/></g>
        <g class="sway" style="animation-delay:-2s"><line x1="398" y1="63" x2="398" y2="78" stroke="#6b4a33" stroke-width="2"/><use href="#lantern" x="372" y="78" width="52" height="78" style="color:#ffb347"/></g>
        <g class="sway" style="animation-delay:-4s"><line x1="500" y1="65" x2="500" y2="90" stroke="#6b4a33" stroke-width="2"/><use href="#lantern" x="465" y="90" width="70" height="105" style="color:#ff7a3d"/></g>
        <g class="sway" style="animation-delay:-.5s"><line x1="602" y1="63" x2="602" y2="78" stroke="#6b4a33" stroke-width="2"/><use href="#lantern" x="576" y="78" width="52" height="78" style="color:#e8475f"/></g>
        <g class="sway" style="animation-delay:-2.5s"><line x1="755" y1="54" x2="755" y2="76" stroke="#6b4a33" stroke-width="2"/><use href="#lantern" x="724" y="76" width="62" height="93" style="color:#ffb347"/></g>
        <g class="sway" style="animation-delay:-3.5s"><line x1="908" y1="36" x2="908" y2="50" stroke="#6b4a33" stroke-width="2"/><use href="#lantern" x="884" y="50" width="48" height="72" style="color:#ff7a3d"/></g>
      </svg>
    </div>

    <p class="eyebrow">Street food after dark</p>
    <h1>
      <span class="big">Lantern Row</span>
      <span class="small">Night Market</span>
    </h1>

    <div class="rule" aria-hidden="true"><i></i></div>

    <section class="dates" aria-label="Dates">
      <div class="date">
        <span class="dow">Saturday</span>
        <span class="num">18</span>
        <span class="mon">October</span>
      </div>
      <div class="date">
        <span class="dow">Saturday</span>
        <span class="num">25</span>
        <span class="mon">October</span>
      </div>
    </section>

    <p class="time"><b>6pm</b> till <b>midnight</b></p>

    <section class="facts" aria-label="Highlights">
      <div class="fact"><strong>40</strong><span>Food stalls</span></div>
      <div class="fact"><strong>Free</strong><span>Entry</span></div>
      <div class="fact"><strong>From 8pm</strong><span>Live music</span></div>
    </section>

    <footer class="place">
      <p class="label">Find us at</p>
      <p class="where">The old Ropewalk Yard<em>Carter Street</em></p>
      <p class="tag">Come hungry · Stay late</p>
    </footer>

  </div>
</main>
</body>
</html>
