<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market – Saturdays Oct 18 &amp; 25, Ropewalk Yard</title>
<meta name="description" content="Street food night market. Saturdays October 18 and 25, 6pm to midnight, at the old Ropewalk Yard on Carter Street. Free entry, 40 stalls, live music from 8.">
<!--
  Note for the organiser: October 18 and 25 fall on Saturdays in 2025 but on Sundays in 2026.
  No year is printed on the poster. Please check the weekday and dates before printing.
-->
<style>
  :root {
    --ink: #0d0a14;
    --ink-2: #171024;
    --cream: #f7e9d0;
    --muted: #cdb8a0;
    --amber: #ffb347;
    --ember: #ff6a3d;
    --rose: #ff4f6d;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--ink); }
  body {
    min-height: 100vh;
    color: var(--cream);
    font-family: var(--sans);
    background:
      radial-gradient(60rem 28rem at 50% -4rem, rgba(255,140,60,.28), transparent 70%),
      radial-gradient(40rem 30rem at 12% 70%, rgba(255,79,109,.10), transparent 70%),
      radial-gradient(40rem 30rem at 90% 55%, rgba(255,179,71,.09), transparent 70%),
      linear-gradient(180deg, var(--ink-2) 0%, var(--ink) 55%);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .poster {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Lantern string */
  .string { width: 100%; height: clamp(8rem, 22vw, 15rem); display: block; }
  .string .wire { fill: none; stroke: #5b4a45; stroke-width: 2; }
  .string use { filter: drop-shadow(0 0 16px rgba(255,150,60,.55)); animation: flicker 5s ease-in-out infinite; }
  .string use:nth-of-type(2n) { animation-duration: 6.3s; animation-delay: -1.2s; }
  .string use:nth-of-type(3n) { animation-duration: 4.4s; animation-delay: -2.6s; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    45% { opacity: .86; }
    60% { opacity: 1; }
    80% { opacity: .92; }
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 66rem;
    margin: 0 auto;
    padding: 0 clamp(1.25rem, 5vw, 3rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(1.5rem, 4vw, 2.75rem);
  }

  .eyebrow {
    font-size: clamp(.75rem, 1.8vw, 1rem);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 600;
  }
  h1 { line-height: .9; }
  h1 .big {
    display: block;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(3.6rem, 15vw, 10.5rem);
    letter-spacing: -.02em;
    color: var(--amber);
    background: linear-gradient(180deg, #ffe3a8 0%, #ffb347 45%, #ff6a3d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 28px rgba(255,120,50,.35));
  }
  h1 .small {
    display: block;
    margin-top: clamp(.6rem, 1.5vw, 1.1rem);
    font-family: var(--sans);
    font-weight: 300;
    font-size: clamp(1.3rem, 5.4vw, 3.6rem);
    letter-spacing: .5em;
    text-transform: uppercase;
    padding-left: .5em; /* balances trailing tracking */
    color: var(--cream);
  }

  /* Dates */
  .dates {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(.9rem, 3vw, 2rem);
    flex-wrap: wrap;
  }
  .date {
    min-width: clamp(8.5rem, 24vw, 12.5rem);
    padding: clamp(.9rem, 2vw, 1.4rem) 1.2rem;
    border: 1.5px solid rgba(255,179,71,.55);
    border-radius: 1.1rem;
    background: linear-gradient(180deg, rgba(255,179,71,.12), rgba(255,106,61,.04));
    box-shadow: 0 0 40px rgba(255,120,50,.12), inset 0 0 24px rgba(255,179,71,.06);
  }
  .date .day, .date .month {
    display: block;
    font-size: clamp(.75rem, 1.8vw, .95rem);
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 600;
  }
  .date .num {
    display: block;
    font-family: var(--serif);
    font-size: clamp(3.6rem, 11vw, 6.5rem);
    line-height: 1;
    font-weight: 700;
    margin: .1em 0 .05em;
  }
  .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--rose); box-shadow: 0 0 18px 4px rgba(255,79,109,.6); }

  .hours {
    font-family: var(--serif);
    font-size: clamp(1.8rem, 6vw, 3.4rem);
    line-height: 1.1;
  }
  .hours span { color: var(--amber); font-style: italic; padding: 0 .15em; }

  /* Key facts */
  .facts {
    list-style: none;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid rgba(247,233,208,.18);
    border-bottom: 1px solid rgba(247,233,208,.18);
  }
  .facts li { padding: clamp(1rem, 3vw, 1.8rem) .5rem; }
  .facts li + li { border-left: 1px solid rgba(247,233,208,.18); }
  .facts strong {
    display: block;
    font-family: var(--serif);
    font-size: clamp(2.2rem, 8vw, 4.6rem);
    line-height: 1;
    color: var(--cream);
  }
  .facts span {
    display: block;
    margin-top: .5em;
    font-size: clamp(.7rem, 1.8vw, 1rem);
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .where .label {
    font-size: clamp(.7rem, 1.8vw, .9rem);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 600;
  }
  .where address {
    font-style: normal;
    margin-top: .5rem;
    font-family: var(--serif);
    font-size: clamp(1.7rem, 5.6vw, 3.2rem);
    line-height: 1.15;
  }
  .where address small {
    display: block;
    font-family: var(--sans);
    font-size: clamp(1rem, 2.8vw, 1.6rem);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: .35rem;
  }
  .tag {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: var(--muted);
    padding-bottom: clamp(1.5rem, 4vw, 2.5rem);
  }

  /* Awning strip */
  .awning {
    height: 2.6rem;
    background: repeating-linear-gradient(90deg, var(--ember) 0 20px, var(--cream) 20px 40px);
    -webkit-mask:
      linear-gradient(#000 0 0) top / 100% calc(100% - 10px) no-repeat,
      radial-gradient(circle at 10px 0, #000 9.5px, transparent 10.5px) bottom / 20px 10px repeat-x;
    mask:
      linear-gradient(#000 0 0) top / 100% calc(100% - 10px) no-repeat,
      radial-gradient(circle at 10px 0, #000 9.5px, transparent 10.5px) bottom / 20px 10px repeat-x;
    opacity: .95;
  }

  @media (max-width: 30rem) {
    h1 .small { letter-spacing: .32em; padding-left: .32em; }
    .dot { display: none; }
    .date { min-width: 9rem; }
    .facts span { letter-spacing: .14em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .string use { animation: none; }
  }
  @page { size: A3 portrait; margin: 0; }
  @media print {
    html, body { background: var(--ink); }
    .poster { min-height: 100vh; }
    .string use { animation: none; }
  }
</style>
</head>
<body>
<div class="poster">

  <svg class="string" viewBox="0 0 1200 230" preserveAspectRatio="xMidYMin slice" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="glow" cx="50%" cy="55%" r="55%">
        <stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/>
        <stop offset=".55" stop-color="#ffd27a" stop-opacity=".35"/>
        <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
      </radialGradient>
      <symbol id="lantern" viewBox="-30 0 60 120" overflow="visible">
        <line x1="0" y1="0" x2="0" y2="16" stroke="#5b4a45" stroke-width="2"/>
        <path d="M-22 22 C-32 40 -32 70 -22 88 L22 88 C32 70 32 40 22 22 Z" fill="currentColor"/>
        <path d="M-22 22 C-32 40 -32 70 -22 88 L22 88 C32 70 32 40 22 22 Z" fill="url(#glow)"/>
        <path d="M-10 22 C-17 40 -17 70 -10 88 M10 22 C17 40 17 70 10 88 M0 22 V88" fill="none" stroke="#2a120c" stroke-opacity=".35" stroke-width="1.5"/>
        <rect x="-14" y="16" width="28" height="7" rx="2" fill="#2a1a14"/>
        <rect x="-14" y="87" width="28" height="7" rx="2" fill="#2a1a14"/>
        <path d="M0 94 V110 M-4 110 H4 M-3 110 L-4 120 M0 110 V121 M3 110 L4 120" stroke="#e9b765" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </symbol>
    </defs>
    <path class="wire" d="M-10 20 Q600 90 1210 20"/>
    <use href="#lantern" x="66"   y="28" width="60" height="120" style="color:#ff6a3d"/>
    <use href="#lantern" x="210"  y="40" width="60" height="120" style="color:#ffb347"/>
    <use href="#lantern" x="354"  y="48" width="60" height="120" style="color:#ff4f6d"/>
    <use href="#lantern" x="498"  y="52" width="60" height="120" style="color:#ffa53d"/>
    <use href="#lantern" x="642"  y="52" width="60" height="120" style="color:#ff6a3d"/>
    <use href="#lantern" x="786"  y="48" width="60" height="120" style="color:#ffb347"/>
    <use href="#lantern" x="930"  y="40" width="60" height="120" style="color:#ff4f6d"/>
    <use href="#lantern" x="1074" y="28" width="60" height="120" style="color:#ffa53d"/>
  </svg>

  <main>
    <p class="eyebrow">Street food &middot; Live music &middot; Free entry</p>

    <h1>
      <span class="big">Lantern Row</span>
      <span class="small">Night Market</span>
    </h1>

    <div class="dates" role="group" aria-label="Dates">
      <div class="date">
        <span class="day">Saturday</span>
        <time class="num" datetime="10-18">18</time>
        <span class="month">October</span>
      </div>
      <span class="dot" aria-hidden="true"></span>
      <div class="date">
        <span class="day">Saturday</span>
        <time class="num" datetime="10-25">25</time>
        <span class="month">October</span>
      </div>
    </div>

    <p class="hours">6pm <span>to</span> midnight</p>

    <ul class="facts">
      <li><strong>40</strong><span>Food stalls</span></li>
      <li><strong>Free</strong><span>Entry</span></li>
      <li><strong>8pm</strong><span>Live music</span></li>
    </ul>

    <div class="where">
      <p class="label">Find us at</p>
      <address>
        The old Ropewalk Yard
        <small>Carter Street</small>
      </address>
    </div>

    <p class="tag">Come hungry. Stay for the lights.</p>
  </main>

  <div class="awning" aria-hidden="true"></div>
</div>
</body>
</html>
