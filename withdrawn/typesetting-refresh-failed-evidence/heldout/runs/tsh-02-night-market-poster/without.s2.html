<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Row Night Market – Saturdays Oct 18 &amp; 25</title>
<!-- Note: Oct 18 and 25 fall on Saturdays in 2025. Check the year before printing. -->
<style>
  :root {
    --ink: #130b15;
    --plum: #2a1230;
    --amber: #ffb347;
    --ember: #f2603a;
    --red: #d6342c;
    --cream: #fff1d8;
    --muted: #d9c3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--ink); }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: var(--ink);
    color: var(--cream);
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .poster {
    position: relative;
    width: 100%;
    max-width: 960px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 40% at 50% 8%, rgba(255,179,71,.28), transparent 70%),
      radial-gradient(ellipse 60% 35% at 50% 100%, rgba(242,96,58,.22), transparent 70%),
      linear-gradient(180deg, var(--plum) 0%, var(--ink) 55%, #0d070f 100%);
  }
  .lanterns { display: block; width: 100%; height: auto; margin-top: -4px; }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: clamp(8px, 2vw, 24px) clamp(20px, 6vw, 64px) clamp(28px, 5vw, 56px);
  }
  .eyebrow {
    font-size: clamp(.75rem, 1.8vw, 1rem);
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 600;
    padding-left: .42em;
  }
  h1 {
    margin-top: clamp(10px, 2vw, 22px);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 700;
    line-height: .88;
    letter-spacing: -.02em;
    text-transform: uppercase;
  }
  h1 .l1 {
    display: block;
    font-size: clamp(3.6rem, 15.5vw, 9.6rem);
    color: var(--cream);
    text-shadow: 0 0 40px rgba(255,179,71,.45), 0 0 90px rgba(242,96,58,.3);
  }
  h1 .l2 {
    display: block;
    margin-top: .1em;
    font-size: clamp(1.6rem, 7.2vw, 4.5rem);
    font-style: italic;
    letter-spacing: .06em;
    background: linear-gradient(90deg, var(--amber), var(--ember));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tag {
    margin-top: clamp(14px, 3vw, 28px);
    font-family: Georgia, serif;
    font-style: italic;
    font-size: clamp(1rem, 2.6vw, 1.45rem);
    color: var(--muted);
  }
  .rule {
    width: min(360px, 60%);
    height: 1px;
    margin: clamp(22px, 4vw, 40px) auto;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
  }
  .dates {
    display: flex;
    gap: clamp(12px, 3vw, 28px);
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
  }
  .date {
    flex: 1 1 220px;
    max-width: 330px;
    padding: clamp(16px, 3vw, 26px) 16px;
    border: 1.5px solid rgba(255,179,71,.6);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,179,71,.12), rgba(255,179,71,.03));
    box-shadow: 0 0 36px rgba(255,179,71,.12) inset;
  }
  .date .day {
    font-size: clamp(.75rem, 1.8vw, .95rem);
    letter-spacing: .35em;
    padding-left: .35em;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 700;
  }
  .date .num {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: clamp(3rem, 9vw, 5.5rem);
    line-height: 1;
    font-weight: 700;
    margin: 6px 0 2px;
  }
  .date .mon {
    font-size: clamp(.9rem, 2.2vw, 1.15rem);
    letter-spacing: .3em;
    padding-left: .3em;
    text-transform: uppercase;
    color: var(--cream);
  }
  .hours {
    margin-top: clamp(18px, 3vw, 30px);
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: clamp(1.5rem, 5vw, 2.7rem);
    font-weight: 700;
  }
  .hours span { color: var(--amber); font-style: italic; padding: 0 .15em; }

  .facts {
    margin-top: clamp(22px, 4vw, 38px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 2vw, 20px);
    width: 100%;
    max-width: 760px;
  }
  .fact {
    padding: clamp(12px, 2.4vw, 20px) 8px;
    border-top: 2px solid var(--ember);
    background: rgba(255,241,216,.05);
    border-radius: 0 0 12px 12px;
  }
  .fact b {
    display: block;
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: clamp(1.4rem, 4.6vw, 2.5rem);
    line-height: 1.05;
    color: var(--amber);
  }
  .fact span {
    display: block;
    margin-top: 6px;
    font-size: clamp(.68rem, 1.7vw, .9rem);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--cream);
  }
  .where {
    margin-top: clamp(26px, 5vw, 48px);
    font-size: clamp(.7rem, 1.7vw, .9rem);
    letter-spacing: .35em;
    padding-left: .35em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .place {
    margin-top: 8px;
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: clamp(1.5rem, 5.4vw, 3rem);
    font-weight: 700;
    line-height: 1.1;
  }
  .street {
    margin-top: 4px;
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    color: var(--amber);
    letter-spacing: .08em;
  }
  .awning {
    height: clamp(26px, 5vw, 44px);
    background:
      radial-gradient(circle at 50% 0, transparent 0 0),
      repeating-linear-gradient(90deg, var(--red) 0 36px, var(--cream) 36px 72px);
    -webkit-mask: radial-gradient(circle at 18px 0, #000 0 17px, transparent 18px) 0 100% / 36px 100% repeat-x,
                  linear-gradient(#000, #000) 0 0 / 100% 55% no-repeat;
    mask: linear-gradient(#000, #000) 0 0 / 100% 55% no-repeat;
    box-shadow: 0 -10px 40px rgba(242,96,58,.35);
  }
  .awning-wrap { position: relative; }
  .awning-wrap::after {
    content: "";
    display: block;
    height: clamp(14px, 3vw, 26px);
    margin-top: -1px;
    background:
      radial-gradient(circle at 18px 0, var(--red) 0 17px, transparent 18px) 0 0 / 72px 100% repeat-x,
      radial-gradient(circle at 54px 0, var(--cream) 0 17px, transparent 18px) 0 0 / 72px 100% repeat-x;
  }
  .awning-wrap .awning { -webkit-mask: none; mask: none; height: clamp(12px, 2.4vw, 20px); box-shadow: none; }

  @media (max-width: 460px) {
    .facts { grid-template-columns: 1fr; }
    .fact { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
    .fact span { margin-top: 0; }
  }
  @media print {
    html, body { background: var(--ink); }
    .poster { max-width: none; min-height: 100vh; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<main class="poster">

  <svg class="lanterns" viewBox="0 0 1000 250" role="img" aria-label="A string of glowing paper lanterns">
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffb347" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#f2603a" stop-opacity=".55"/>
        <stop offset="1" stop-color="#f2603a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="bodyA" cx="50%" cy="45%" r="60%">
        <stop offset="0" stop-color="#fff1b8"/>
        <stop offset=".5" stop-color="#ffb347"/>
        <stop offset="1" stop-color="#d9741c"/>
      </radialGradient>
      <radialGradient id="bodyR" cx="50%" cy="45%" r="60%">
        <stop offset="0" stop-color="#ffb08a"/>
        <stop offset=".5" stop-color="#f2603a"/>
        <stop offset="1" stop-color="#a81f22"/>
      </radialGradient>

      <g id="lanternA">
        <circle cx="0" cy="58" r="85" fill="url(#glow)"/>
        <line x1="0" y1="0" x2="0" y2="22" stroke="#6b4a2a" stroke-width="1.5"/>
        <rect x="-12" y="20" width="24" height="9" rx="2" fill="#3a1f12"/>
        <ellipse cx="0" cy="58" rx="30" ry="32" fill="url(#bodyA)"/>
        <path d="M0 26 Q-14 58 0 90 M0 26 Q14 58 0 90 M0 26 Q-28 58 0 90 M0 26 Q28 58 0 90" fill="none" stroke="#a8500f" stroke-opacity=".55" stroke-width="1.2"/>
        <rect x="-12" y="87" width="24" height="9" rx="2" fill="#3a1f12"/>
        <line x1="0" y1="96" x2="0" y2="116" stroke="#ffb347" stroke-width="2"/>
        <path d="M-5 114 L0 134 L5 114 Z" fill="#ffb347"/>
      </g>
      <g id="lanternR">
        <circle cx="0" cy="58" r="85" fill="url(#glowR)"/>
        <line x1="0" y1="0" x2="0" y2="22" stroke="#6b4a2a" stroke-width="1.5"/>
        <rect x="-12" y="20" width="24" height="9" rx="2" fill="#3a1f12"/>
        <ellipse cx="0" cy="58" rx="30" ry="32" fill="url(#bodyR)"/>
        <path d="M0 26 Q-14 58 0 90 M0 26 Q14 58 0 90 M0 26 Q-28 58 0 90 M0 26 Q28 58 0 90" fill="none" stroke="#6e1216" stroke-opacity=".55" stroke-width="1.2"/>
        <rect x="-12" y="87" width="24" height="9" rx="2" fill="#3a1f12"/>
        <line x1="0" y1="96" x2="0" y2="116" stroke="#ffb347" stroke-width="2"/>
        <path d="M-5 114 L0 134 L5 114 Z" fill="#ffb347"/>
      </g>
    </defs>

    <path d="M-10 20 Q500 80 1010 20" fill="none" stroke="#7a5a3a" stroke-width="2.5"/>

    <use href="#lanternR" transform="translate(100 31) scale(.9)"/>
    <use href="#lanternA" transform="translate(250 42) scale(1.1)"/>
    <use href="#lanternR" transform="translate(400 49) scale(.8)"/>
    <use href="#lanternA" transform="translate(550 50) scale(1.25)"/>
    <use href="#lanternR" transform="translate(700 45) scale(.95)"/>
    <use href="#lanternA" transform="translate(850 35) scale(1.05)"/>
    <use href="#lanternR" transform="translate(955 26) scale(.7)"/>
    <use href="#lanternA" transform="translate(40 24) scale(.7)"/>
  </svg>

  <div class="content">
    <p class="eyebrow">Street food after dark</p>

    <h1>
      <span class="l1">Lantern Row</span>
      <span class="l2">Night Market</span>
    </h1>

    <p class="tag">Forty stalls, one glowing lane, and a whole lot of dinner.</p>

    <div class="rule" aria-hidden="true"></div>

    <div class="dates">
      <div class="date">
        <div class="day">Saturday</div>
        <div class="num">18</div>
        <div class="mon">October</div>
      </div>
      <div class="date">
        <div class="day">Saturday</div>
        <div class="num">25</div>
        <div class="mon">October</div>
      </div>
    </div>

    <p class="hours">6pm <span>to</span> midnight</p>

    <div class="facts">
      <div class="fact"><b>Free</b><span>Entry</span></div>
      <div class="fact"><b>40</b><span>Food stalls</span></div>
      <div class="fact"><b>8pm</b><span>Live music</span></div>
    </div>

    <p class="where">Find us at</p>
    <p class="place">The old Ropewalk Yard</p>
    <p class="street">Carter Street</p>
  </div>

  <div class="awning-wrap" aria-hidden="true">
    <div class="awning"></div>
  </div>
</main>
</body>
</html>
