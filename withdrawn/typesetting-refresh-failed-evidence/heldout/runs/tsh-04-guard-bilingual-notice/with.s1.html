<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Thursday Market Reopens | سوق الخميس يفتح أبوابه من جديد</title>
<style>
  :root {
    --paper: #f6f1e7;
    --card: #fffdf8;
    --ink: #22302a;
    --muted: #4d5b54;
    --accent: #2f6b4f;
    --accent-2: #c8782a;
    --line: #e2d9c6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17201b;
      --card: #1f2b24;
      --ink: #f1ebdc;
      --muted: #b9c4bb;
      --accent: #8fcfaa;
      --accent-2: #e8a35d;
      --line: #34443a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: clamp(1rem, 4vw, 3rem);
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    width: min(100%, 62rem);
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 6px solid var(--accent);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  section {
    padding: clamp(1.75rem, 5vw, 3.5rem) clamp(1.5rem, 4vw, 3rem);
  }
  section + section { border-inline-start: 1px solid var(--line); }
  .tag {
    display: inline-block;
    width: 2.75rem;
    height: 4px;
    margin-bottom: 1.5rem;
    background: var(--accent-2);
    border-radius: 2px;
  }
  h1 {
    margin: 0 0 1rem;
    font-size: clamp(1.75rem, 3.6vw, 2.5rem);
    line-height: 1.15;
    color: var(--accent);
    text-wrap: balance;
  }
  p {
    margin: 0;
    max-width: 34ch;
    font-size: 1.1875rem;
    line-height: 1.65;
    color: var(--ink);
  }
  .en h1 { font-family: Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }
  .ar {
    font-family: "Geeza Pro", "Segoe UI", Tahoma, "Noto Naskh Arabic", "Noto Sans Arabic", system-ui, sans-serif;
  }
  .ar h1 { line-height: 1.5; letter-spacing: 0; }
  .ar p { line-height: 1.95; font-size: 1.25rem; letter-spacing: 0; }
  @media (max-width: 680px) {
    .grid { grid-template-columns: 1fr; }
    section + section { border-inline-start: 0; border-top: 1px solid var(--line); }
    p { max-width: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="grid">
      <section class="en" lang="en" dir="ltr">
        <span class="tag" aria-hidden="true"></span>
        <h1>The Thursday Market Reopens</h1>
        <p>The market returns on the first Thursday of next month, from 4pm to 8pm, in the old schoolyard.</p>
      </section>
      <section class="ar" lang="ar" dir="rtl">
        <span class="tag" aria-hidden="true"></span>
        <h1>سوق الخميس يفتح أبوابه من جديد</h1>
        <p>يعود السوق يوم الخميس الأول من الشهر القادم، من الساعة الرابعة عصرا حتى الثامنة مساء، في ساحة المدرسة القديمة.</p>
      </section>
    </div>
  </main>
</body>
</html>
