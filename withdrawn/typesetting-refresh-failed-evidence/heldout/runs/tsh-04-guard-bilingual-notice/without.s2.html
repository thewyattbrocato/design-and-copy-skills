<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Thursday Market Reopens | سوق الخميس يفتح أبوابه من جديد</title>
<style>
  :root {
    --bg: #f6efe2;
    --paper: #fffaf0;
    --ink: #2b2a26;
    --muted: #5d584d;
    --accent: #b5502b;
    --accent-2: #3f6b4f;
    --line: #e2d6bd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Noto Naskh Arabic", "Geeza Pro", Tahoma, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .notice {
    width: 100%;
    max-width: 960px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(60, 40, 10, 0.12);
    overflow: hidden;
  }
  .stripe {
    height: 14px;
    background: repeating-linear-gradient(
      90deg,
      var(--accent) 0 40px,
      var(--paper) 40px 80px,
      var(--accent-2) 80px 120px,
      var(--paper) 120px 160px
    );
  }
  .banner {
    text-align: center;
    padding: 20px 24px 0;
    color: var(--accent);
    font-size: 0.85rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .banner span { margin: 0 10px; }
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  section {
    padding: 36px 40px 48px;
  }
  section.ar {
    border-inline-start: 0;
    border-left: 1px solid var(--line);
    text-align: right;
  }
  section.en { text-align: left; }
  h1 {
    margin: 0 0 16px;
    font-size: clamp(1.7rem, 3.4vw, 2.3rem);
    line-height: 1.25;
    color: var(--ink);
  }
  section.ar h1 { line-height: 1.5; }
  .rule {
    width: 56px;
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
    margin-bottom: 20px;
  }
  section.ar .rule { margin-left: auto; }
  p {
    margin: 0;
    font-size: 1.15rem;
    color: var(--muted);
  }
  section.ar p { font-size: 1.25rem; line-height: 1.95; }
  @media (max-width: 720px) {
    .columns { grid-template-columns: 1fr; }
    section { padding: 28px 24px 34px; }
    section.ar {
      border-left: 0;
      border-bottom: 1px solid var(--line);
    }
  }
</style>
</head>
<body>
  <main class="notice">
    <div class="stripe"></div>
    <div class="banner" aria-hidden="true">
      <span>Community Market</span>·<span>سوق المجتمع</span>
    </div>
    <div class="columns">
      <section class="en" lang="en" dir="ltr">
        <h1>The Thursday Market Reopens</h1>
        <div class="rule"></div>
        <p>The market returns on the first Thursday of next month, from 4pm to 8pm, in the old schoolyard.</p>
      </section>
      <section class="ar" lang="ar" dir="rtl">
        <h1>سوق الخميس يفتح أبوابه من جديد</h1>
        <div class="rule"></div>
        <p>يعود السوق يوم الخميس الأول من الشهر القادم، من الساعة الرابعة عصرا حتى الثامنة مساء، في ساحة المدرسة القديمة.</p>
      </section>
    </div>
    <div class="stripe"></div>
  </main>
</body>
</html>
