<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Thursday Market Reopens · سوق الخميس يفتح أبوابه من جديد</title>
<style>
  :root {
    --ink: #2a2118;
    --muted: #6b5b4b;
    --paper: #fffaf1;
    --bg: #f1e6d2;
    --accent: #b5471f;
    --line: #d9c7a8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: clamp(16px, 4vw, 48px);
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .notice {
    width: 100%;
    max-width: 62rem;
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 8px solid var(--accent);
    border-radius: 6px;
    box-shadow: 0 1px 0 #fff inset, 0 12px 30px rgba(60, 40, 15, .15);
    overflow: hidden;
  }
  .banner {
    padding: 14px 24px;
    background: var(--accent);
    color: #fff7ea;
    text-align: center;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .banner span { margin: 0 .6em; opacity: .7; }
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .col {
    padding: clamp(28px, 5vw, 56px) clamp(24px, 4vw, 48px);
  }
  .col + .col { border-inline-start: 1px solid var(--line); }
  .rule {
    width: 48px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 22px;
  }
  h1 {
    margin: 0 0 .6em;
    font-weight: 700;
    text-wrap: balance;
  }
  p {
    margin: 0;
    color: var(--muted);
    max-width: 34em;
  }

  .en { direction: ltr; text-align: left; }
  .en h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.9rem, 3.6vw, 2.6rem);
    line-height: 1.15;
    letter-spacing: -.01em;
  }
  .en p { font-size: 1.125rem; line-height: 1.65; }

  .ar { direction: rtl; text-align: right; }
  .ar h1, .ar p {
    font-family: "Geeza Pro", "Segoe UI", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, Arial, sans-serif;
    letter-spacing: 0;
  }
  .ar h1 { font-size: clamp(2rem, 3.8vw, 2.8rem); line-height: 1.4; }
  .ar p { font-size: 1.25rem; line-height: 1.9; }

  @media (max-width: 720px) {
    .columns { grid-template-columns: 1fr; }
    .col + .col {
      border-inline-start: 0;
      border-top: 1px solid var(--line);
    }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .notice { box-shadow: none; }
  }
</style>
</head>
<body>
  <main class="notice">
    <div class="banner">Community Market <span>•</span> سوق الحي</div>
    <div class="columns">
      <section class="col en" lang="en" dir="ltr">
        <div class="rule"></div>
        <h1>The Thursday Market Reopens</h1>
        <p>The market returns on the first Thursday of next month, from 4pm to 8pm, in the old schoolyard.</p>
      </section>
      <section class="col ar" lang="ar" dir="rtl">
        <div class="rule"></div>
        <h1>سوق الخميس يفتح أبوابه من جديد</h1>
        <p>يعود السوق يوم الخميس الأول من الشهر القادم، من الساعة الرابعة عصرا حتى الثامنة مساء، في ساحة المدرسة القديمة.</p>
      </section>
    </div>
  </main>
</body>
</html>
