<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Thursday Market Reopens | سوق الخميس يفتح أبوابه من جديد</title>
<style>
  :root {
    --bg: #f6efe2;
    --paper: #fffaf0;
    --ink: #2b2a26;
    --muted: #5e5a4f;
    --accent: #b5481f;
    --accent-2: #2f6b4f;
    --line: #e2d6bd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background:
      radial-gradient(circle at 15% 10%, rgba(181,72,31,.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(47,107,79,.10), transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
    line-height: 1.7;
  }
  .notice {
    width: 100%;
    max-width: 960px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(60,40,10,.12);
    overflow: hidden;
  }
  .banner {
    height: 12px;
    background: repeating-linear-gradient(
      90deg,
      var(--accent) 0 28px,
      var(--paper) 28px 38px,
      var(--accent-2) 38px 66px,
      var(--paper) 66px 76px
    );
  }
  .tag {
    text-align: center;
    padding: 28px 16px 0;
    font-size: .8rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    padding: 20px 0 36px;
  }
  .panel { padding: 20px 40px; }
  .panel + .panel { border-inline-start: 1px solid var(--line); }
  h1 {
    margin: 0 0 14px;
    font-size: 2rem;
    line-height: 1.3;
    color: var(--ink);
  }
  p {
    margin: 0;
    font-size: 1.1rem;
    color: var(--muted);
  }
  .ar { direction: rtl; text-align: right; }
  .ar h1 { font-size: 2.15rem; line-height: 1.5; }
  .ar p { font-size: 1.2rem; line-height: 1.9; }
  .en { direction: ltr; text-align: left; }
  .rule {
    width: 48px;
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
    margin: 0 0 18px;
  }
  .ar .rule { background: var(--accent-2); }
  @media (max-width: 720px) {
    .panels { grid-template-columns: 1fr; padding-bottom: 24px; }
    .panel { padding: 20px 26px; }
    .panel + .panel {
      border-inline-start: 0;
      border-top: 1px solid var(--line);
    }
    h1 { font-size: 1.6rem; }
    .ar h1 { font-size: 1.75rem; }
  }
</style>
</head>
<body>
  <main class="notice">
    <div class="banner" aria-hidden="true"></div>
    <div class="tag">Community Market &nbsp;·&nbsp; سوق الحي</div>
    <div class="panels">
      <section class="panel ar" lang="ar" dir="rtl">
        <div class="rule"></div>
        <h1>سوق الخميس يفتح أبوابه من جديد</h1>
        <p>يعود السوق يوم الخميس الأول من الشهر القادم، من الساعة الرابعة عصرا حتى الثامنة مساء، في ساحة المدرسة القديمة.</p>
      </section>
      <section class="panel en" lang="en" dir="ltr">
        <div class="rule"></div>
        <h1>The Thursday Market Reopens</h1>
        <p>The market returns on the first Thursday of next month, from 4pm to 8pm, in the old schoolyard.</p>
      </section>
    </div>
    <div class="banner" aria-hidden="true"></div>
  </main>
</body>
</html>
