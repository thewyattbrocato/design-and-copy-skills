<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samples · Water Quality Lab Portal</title>
<style>
  :root {
    --bg: #f5f7f8; --card: #fff; --ink: #14232b; --muted: #5a6b74; --line: #dbe3e7;
    --accent: #0b6e8a; --accent-ink: #fff; --ok: #1b6b3a; --ok-bg: #e6f4ec; --warn: #8a5a00; --warn-bg: #fff4dc;
    --bad: #9b2226; --bad-bg: #fde8e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a20; --card: #16252d; --ink: #e6eef2; --muted: #9bb0ba; --line: #2a3d47;
      --accent: #5ac0de; --accent-ink: #06222c; --ok: #7fd6a0; --ok-bg: #153325; --warn: #f0c36a; --warn-bg: #3a2e12;
      --bad: #f19a9d; --bad-bg: #3d1c1e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 24px;
    display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  header strong { font-size: 16px; }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; }
  nav a[aria-current="page"] { color: var(--ink); background: var(--bg); font-weight: 600; }
  nav a:hover { color: var(--ink); }
  main { max-width: 920px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; }
  .export-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .export-row h2 { margin: 0; font-size: 16px; }
  .export-row p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 10px; align-items: center; }
  button, .btn { font: inherit; cursor: pointer; border-radius: 8px; padding: 9px 16px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button[aria-disabled="true"] { cursor: progress; opacity: .85; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
    animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { margin-top: 16px; border-radius: 8px; padding: 12px 14px; display: none; }
  .status.show { display: block; }
  .status.run { background: var(--bg); border: 1px solid var(--line); }
  .status.done { background: var(--ok-bg); color: var(--ok); }
  .status.cancel { background: var(--warn-bg); color: var(--warn); }
  .status .line { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
  .status .title { font-weight: 600; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s linear; }
  .hint { color: var(--muted); font-size: 13px; }
  .linkbtn { background: none; border: 0; padding: 2px 4px; color: var(--accent); text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  caption { text-align: left; font-weight: 600; font-size: 16px; padding-bottom: 10px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tablewrap { overflow-x: auto; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.5s; } .bar > i { transition: none; } }
</style>
</head>
<body>
<header>
  <strong>Water Quality Lab Portal</strong>
  <nav aria-label="Primary">
    <a href="#" aria-current="page">Samples</a>
    <a href="#">Sites</a>
    <a href="#">Reports</a>
    <a href="#">Account</a>
  </nav>
</header>

<main>
  <h1>Samples</h1>
  <p class="sub">Recent results from field and lab intake.</p>

  <section class="card" aria-labelledby="exp-h">
    <div class="export-row">
      <div>
        <h2 id="exp-h">Season report</h2>
        <p>All samples for the current season, as a CSV file. Usually takes about 25 seconds.</p>
      </div>
      <div class="actions">
        <button type="button" id="exportBtn" class="primary">Export season report</button>
      </div>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <div class="tablewrap">
      <table>
        <caption>Recent samples</caption>
        <thead>
          <tr><th>Sample ID</th><th>Site</th><th>Collected</th><th class="num">pH</th><th class="num">Turbidity (NTU)</th><th>Status</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
(function () {
  var DURATION = 25000; // simulated server time
  var samples = [
    ["WQ-24081", "Cedar Creek, upstream", "Oct 13, 08:40", 7.4, 1.2, "Passed"],
    ["WQ-24080", "Cedar Creek, outfall", "Oct 13, 09:15", 6.9, 4.8, "Review"],
    ["WQ-24079", "Lake Marren, dock 2", "Oct 12, 14:05", 8.1, 0.9, "Passed"],
    ["WQ-24078", "Well 7", "Oct 12, 10:30", 7.0, 0.4, "Passed"],
    ["WQ-24077", "Harlow Reservoir", "Oct 11, 16:20", 9.2, 6.3, "Failed"],
    ["WQ-24076", "Well 3", "Oct 11, 09:00", 7.2, 0.6, "Pending"]
  ];
  var cls = { Passed: "ok", Review: "warn", Pending: "warn", Failed: "bad" };
  var tb = document.getElementById("rows");
  samples.forEach(function (s) {
    var tr = document.createElement("tr");
    tr.innerHTML = "<td>" + s[0] + "</td><td>" + s[1] + "</td><td>" + s[2] + "</td>" +
      '<td class="num">' + s[3].toFixed(1) + '</td><td class="num">' + s[4].toFixed(1) + "</td>" +
      '<td><span class="tag ' + cls[s[5]] + '">' + s[5] + "</span></td>";
    tb.appendChild(tr);
  });

  var btn = document.getElementById("exportBtn");
  var box = document.getElementById("status");
  var baseTitle = document.title;
  var timer = null, start = 0, running = false, fileUrl = null, announced = {};

  function idleLabel() { btn.textContent = "Export season report"; btn.removeAttribute("aria-disabled"); }

  function render(html) { box.innerHTML = html; box.classList.add("show"); }

  function begin() {
    if (running) return;
    running = true; start = Date.now(); announced = {};
    if (fileUrl) { URL.revokeObjectURL(fileUrl); fileUrl = null; }
    btn.setAttribute("aria-disabled", "true");
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Exporting…';
    box.className = "status show run";
    render(
      '<div class="line"><span class="title">Export started. Building your report…</span>' +
      '<button type="button" class="linkbtn" id="cancelBtn">Cancel</button></div>' +
      '<div class="bar" aria-hidden="true"><i id="fill"></i></div>' +
      '<div class="hint"><span id="elapsed">0 s elapsed</span> · usually about 25 s. You can keep using this page.</div>'
    );
    document.getElementById("cancelBtn").addEventListener("click", cancel);
    timer = setInterval(tick, 250);
    tick();
  }

  function tick() {
    var ms = Date.now() - start;
    if (ms >= DURATION) return finish();
    var s = Math.floor(ms / 1000);
    var fill = document.getElementById("fill"), el = document.getElementById("elapsed");
    if (fill) fill.style.width = Math.min(95, ms / DURATION * 100) + "%";
    if (el) el.textContent = s + " s elapsed";
    document.title = "Exporting… " + s + " s · " + baseTitle;
    // sparse announcements for screen readers, not every tick
    if (s === 12 && !announced[s]) { announced[s] = 1; box.setAttribute("aria-label", "Still exporting"); }
  }

  function stop() {
    clearInterval(timer); timer = null; running = false;
    document.title = baseTitle; idleLabel();
  }

  function finish() {
    stop();
    var csv = "sample_id,site,collected,ph,turbidity_ntu,status\n" +
      samples.map(function (s) { return [s[0], '"' + s[1] + '"', '"' + s[2] + '"', s[3], s[4], s[5]].join(","); }).join("\n") + "\n";
    fileUrl = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    var t = new Date();
    var name = "season-report-" + t.toISOString().slice(0, 10) + ".csv";
    box.className = "status show done";
    render(
      '<div class="line"><span class="title">Report ready: ' + name + '</span>' +
      '<a class="btn primary" id="dl" href="' + fileUrl + '" download="' + name + '">Download</a></div>'
    );
    document.getElementById("dl").focus();
  }

  function cancel() {
    stop();
    box.className = "status show cancel";
    render('<div class="line"><span class="title">Export canceled. Nothing was downloaded.</span>' +
      '<button type="button" class="linkbtn" id="retry">Start again</button></div>');
    document.getElementById("retry").addEventListener("click", begin);
    btn.focus();
  }

  btn.addEventListener("click", function () {
    if (running) { document.getElementById("cancelBtn").focus(); return; }
    begin();
  });
})();
</script>
</body>
</html>
