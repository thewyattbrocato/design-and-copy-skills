<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilnside Ceramics — Pottery classes</title>
<style>
  :root {
    --clay: #b5522f;
    --clay-deep: #7e2f16;
    --cream: #f6ecdd;
    --ink: #2a1710;
    --glaze: #2f6b6a;
    --sand: #e3b77f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(7rem, 22vw, 38rem);
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  .headline {
    grid-column: 1 / -1;
    grid-row: 1;
    position: relative;
    z-index: 2;
    padding: clamp(1.25rem, 3vw, 4rem) clamp(1.25rem, 4vw, 6rem) 0;
  }
  .eyebrow {
    font-size: clamp(0.75rem, 1.1vw, 1.5rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--clay-deep);
    margin-bottom: clamp(0.5rem, 1vw, 1.5rem);
  }
  h1 {
    font-family: Impact, "Arial Narrow Bold", "Helvetica Neue", Arial, sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 0.86;
    letter-spacing: -0.02em;
    color: var(--clay);
    font-size: clamp(3.5rem, 17vw, 30rem);
    overflow-wrap: anywhere;
  }
  h1 span { display: block; }
  h1 .second { color: var(--ink); }
  .content {
    grid-column: 1;
    grid-row: 2;
    align-self: end;
    padding: clamp(1.5rem, 3vw, 4rem) clamp(1.25rem, 4vw, 6rem) clamp(1.5rem, 4vw, 6rem);
    max-width: 60rem;
  }
  .tagline {
    font-size: clamp(1.25rem, 2.6vw, 3.5rem);
    line-height: 1.2;
    font-weight: 500;
    max-width: 22ch;
  }
  .btn {
    display: inline-block;
    margin-top: clamp(1.25rem, 2vw, 3rem);
    padding: 0.9em 1.8em;
    min-height: 44px;
    background: var(--ink);
    color: var(--cream);
    text-decoration: none;
    font-weight: 700;
    font-size: clamp(1rem, 1.5vw, 2.25rem);
    letter-spacing: 0.04em;
    border-radius: 999px;
    border: 3px solid var(--ink);
    transition: background .2s, color .2s, transform .2s;
  }
  .btn:hover { background: var(--clay); border-color: var(--clay); transform: translateY(-2px); }
  .btn:focus-visible { outline: 4px solid var(--glaze); outline-offset: 4px; }
  .art {
    grid-column: 2;
    grid-row: 2;
    position: relative;
    margin-top: clamp(1rem, 2vw, 3rem);
    background:
      radial-gradient(circle at 50% 22%, var(--sand) 0 22%, transparent 22.5%),
      radial-gradient(circle at 50% 22%, transparent 0 30%, var(--glaze) 30.5% 36%, transparent 36.5%),
      linear-gradient(180deg, var(--clay-deep) 0 55%, var(--glaze) 55% 100%);
    border-radius: clamp(3rem, 12vw, 20rem) clamp(3rem, 12vw, 20rem) 0 0;
    min-height: 14rem;
  }
  .art::after {
    content: "";
    position: absolute;
    left: 14%; right: 14%; bottom: 0; height: 32%;
    background: repeating-linear-gradient(0deg, var(--sand) 0 6px, transparent 6px 22px);
    opacity: .55;
    border-radius: 999px 999px 0 0;
  }

  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    .content { grid-row: 2; align-self: start; padding-bottom: 1.5rem; }
    .art {
      grid-column: 1; grid-row: 3;
      margin: 0 1.25rem;
      min-height: 11rem;
      border-radius: 6rem 6rem 0 0;
    }
    h1 { font-size: clamp(3rem, 19vw, 6rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <main class="hero">
    <header class="headline">
      <p class="eyebrow">Pottery studio &amp; classes</p>
      <h1><span>Kilnside</span><span class="second">Ceramics</span></h1>
    </header>

    <section class="content">
      <p class="tagline">Get your hands in the clay. Leave with something you made.</p>
      <a class="btn" href="#book">Book a class</a>
    </section>

    <div class="art" aria-hidden="true"></div>
  </main>
</body>
</html>
