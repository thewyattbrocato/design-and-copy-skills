<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbour Street Family Clinic – Welcome</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; cursor: none;
    background: #0b2e3f; color: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .board {
    width: 1920px; height: 1080px;
    margin: 0 auto;
    padding: 72px 110px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: 48px;
    background: linear-gradient(160deg, #0f3d54 0%, #0b2e3f 70%);
  }
  header { border-bottom: 6px solid #4fd1c5; padding-bottom: 36px; }
  .welcome { font-size: 44px; letter-spacing: 0.12em; text-transform: uppercase; color: #8fe3da; font-weight: 600; }
  h1 { font-size: 132px; line-height: 1.05; font-weight: 800; margin-top: 12px; }

  main { display: grid; grid-template-columns: 1.1fr 1fr; column-gap: 64px; align-items: stretch; }
  .card { background: #ffffff; color: #0b2e3f; border-radius: 28px; padding: 52px 60px; }
  .card h2 { font-size: 56px; font-weight: 800; margin-bottom: 36px; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 26px 28px; border-radius: 18px;
    font-size: 64px; font-weight: 700;
  }
  .row + .row { margin-top: 14px; }
  .row .time { font-variant-numeric: tabular-nums; }
  .row.today { background: #0f7a6e; color: #ffffff; }
  .row .tag { font-size: 34px; font-weight: 600; margin-left: 20px; letter-spacing: 0.04em; text-transform: uppercase; }
  .row:not(.today) .tag { display: none; }

  .flu {
    background: #ffd166; color: #1d1a0f; border-radius: 28px; padding: 52px 60px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .flu .label { font-size: 44px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .flu .big { font-size: 112px; line-height: 1.05; font-weight: 800; margin-top: 18px; }
  .flu .sub { font-size: 52px; font-weight: 600; margin-top: 24px; }

  footer {
    background: #4fd1c5; color: #072330; border-radius: 28px;
    text-align: center; padding: 38px 40px;
    font-size: 88px; font-weight: 800;
  }
</style>
</head>
<body>
  <div class="board">
    <header>
      <div class="welcome">Welcome to</div>
      <h1>Harbour Street Family Clinic</h1>
    </header>

    <main>
      <section class="card">
        <h2>Walk-in Hours</h2>
        <div class="row" data-days="1,2,3,4,5">
          <span>Mon – Fri<span class="tag">Today</span></span>
          <span class="time">8:00 – 18:00</span>
        </div>
        <div class="row" data-days="6">
          <span>Saturday<span class="tag">Today</span></span>
          <span class="time">9:00 – 13:00</span>
        </div>
      </section>

      <section class="flu">
        <div class="label">Flu Clinic</div>
        <div class="big">Level 2</div>
        <div class="sub">Please take the stairs or elevator to Level 2</div>
      </section>
    </main>

    <footer>Please check in at the desk</footer>
  </div>

  <script>
    (function () {
      var day = new Date().getDay();
      document.querySelectorAll('.row').forEach(function (r) {
        if (r.getAttribute('data-days').split(',').indexOf(String(day)) !== -1) {
          r.classList.add('today');
        }
      });
    })();
  </script>
</body>
</html>
