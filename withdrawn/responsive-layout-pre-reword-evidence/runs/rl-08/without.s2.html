<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour Street Family Clinic – Welcome</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: none;
    background: #0b3a4a;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .board {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 6vh 5vw 5vh;
    gap: 4vh;
    background: linear-gradient(160deg, #0b3a4a 0%, #0d4f5f 100%);
  }
  header { text-align: center; }
  .welcome {
    font-size: 4vh;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #9fe3e8;
    margin-bottom: 1.5vh;
  }
  h1 {
    font-size: 11vh;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  main {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 3vw;
    min-height: 0;
  }
  .card {
    background: #ffffff;
    color: #0b2f3b;
    border-radius: 2.5vh;
    padding: 4vh 3vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card h2 {
    font-size: 4.2vh;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #0a6577;
    margin-bottom: 3vh;
  }
  .hours-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 2.4vh 0;
    border-top: 0.3vh solid #cfe6ea;
    font-size: 6.4vh;
    font-weight: 700;
  }
  .hours-row .time { font-weight: 800; }
  .hours-row.today {
    background: #fff3c4;
    margin: 0 -1.5vw;
    padding-left: 1.5vw;
    padding-right: 1.5vw;
    border-radius: 1.5vh;
    border-top-color: transparent;
  }
  .today-tag {
    display: none;
    font-size: 3.2vh;
    font-weight: 700;
    color: #8a5a00;
    margin-left: 1.2vw;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .hours-row.today .today-tag { display: inline; }
  .flu {
    background: #ffd54a;
    color: #2b2100;
    align-items: center;
    text-align: center;
  }
  .flu h2 { color: #5c4500; margin-bottom: 2vh; }
  .flu .big {
    font-size: 11vh;
    font-weight: 900;
    line-height: 1.05;
  }
  .flu .sub {
    font-size: 5.2vh;
    font-weight: 700;
    margin-top: 2.5vh;
  }
  footer {
    background: #0a2a36;
    border: 0.5vh solid #9fe3e8;
    border-radius: 2.5vh;
    text-align: center;
    padding: 3.5vh 2vw;
    font-size: 8vh;
    font-weight: 800;
    animation: gentle 6s ease-in-out infinite;
  }
  @keyframes gentle {
    0%, 100% { background: #0a2a36; }
    50% { background: #0f3d4d; }
  }
  @media (prefers-reduced-motion: reduce) {
    footer { animation: none; }
  }
</style>
</head>
<body>
  <div class="board">
    <header>
      <div class="welcome">Welcome to</div>
      <h1>Harbour Street Family Clinic</h1>
    </header>

    <main>
      <section class="card">
        <h2>Walk-in Hours</h2>
        <div class="hours-row" data-days="1,2,3,4,5">
          <span>Mon – Fri<span class="today-tag">Today</span></span>
          <span class="time">8:00 – 18:00</span>
        </div>
        <div class="hours-row" data-days="6">
          <span>Saturday<span class="today-tag">Today</span></span>
          <span class="time">9:00 – 13:00</span>
        </div>
      </section>

      <section class="card flu">
        <h2>Flu Clinic</h2>
        <div class="big">Level 2</div>
        <div class="sub">Please take the stairs or elevator to Level 2</div>
      </section>
    </main>

    <footer>Please check in at the desk</footer>
  </div>

  <script>
    (function () {
      var d = new Date().getDay();
      var rows = document.querySelectorAll('.hours-row');
      for (var i = 0; i < rows.length; i++) {
        var days = rows[i].getAttribute('data-days').split(',');
        if (days.indexOf(String(d)) !== -1) rows[i].classList.add('today');
      }
    })();
  </script>
</body>
</html>
