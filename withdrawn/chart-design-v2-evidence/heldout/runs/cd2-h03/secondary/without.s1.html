<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025 Orders and Revenue by Month</title>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5b6660;
    --grid: #e3e7e4;
    --axis: #9aa39e;
    --surface: #ffffff;
  }
  body {
    margin: 0;
    padding: 24px;
    background: #f6f7f6;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 820px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 8px;
    padding: 20px 24px 24px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .chart { position: relative; }
  svg { width: 100%; height: auto; display: block; }
  .ptitle { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .tick { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .tip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: #ffffff;
    font-size: 13px;
    line-height: 1.4;
    padding: 8px 10px;
    border-radius: 6px;
    opacity: 0;
    transform: translate(-50%, -100%);
    margin-top: -8px;
    white-space: nowrap;
    transition: opacity 0.1s;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 20px;
    font-variant-numeric: tabular-nums;
  }
  caption { text-align: left; font-weight: 600; margin-bottom: 6px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  tfoot td { font-weight: 600; border-bottom: none; }
</style>
</head>
<body>
<div class="card">
  <h1>2025 Orders and Revenue by Month</h1>
  <p class="sub">Orders (top) and revenue (bottom) share one month axis. Each panel has its own scale, so bar heights compare within a panel only.</p>

  <div class="legend">
    <span><span class="swatch" style="background:#2f5d8a"></span>Orders</span>
    <span><span class="swatch" style="background:#2e7d4f"></span>Revenue (USD)</span>
  </div>

  <div class="chart" id="chart">
    <svg id="plot" viewBox="0 0 720 400" role="img" aria-label="Monthly orders and revenue for 2025"></svg>
    <div class="tip" id="tip"></div>
  </div>

  <table>
    <caption>2025 data</caption>
    <thead>
      <tr><th>Month</th><th>Orders</th><th>Revenue</th></tr>
    </thead>
    <tbody id="rows"></tbody>
    <tfoot>
      <tr><td>Total</td><td id="total-orders"></td><td id="total-revenue"></td></tr>
    </tfoot>
  </table>
</div>

<script>
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const orders = [310, 280, 420, 690, 880, 760, 540, 500, 610, 470, 390, 520];
  const revenue = [9800, 8900, 15200, 31400, 44900, 36100, 21500, 19800, 24700, 18200, 14600, 29300];

  const NS = 'http://www.w3.org/2000/svg';
  const L = 64, R = 712;
  const slot = (R - L) / 12;
  const svg = document.getElementById('plot');
  const tip = document.getElementById('tip');
  const chart = document.getElementById('chart');

  const fmtInt = v => v.toLocaleString('en-US');
  const fmtUsd = v => '$' + v.toLocaleString('en-US');

  const panels = [
    {
      title: 'Orders', values: orders, max: 1000, step: 200, top: 24, base: 174,
      color: '#2f5d8a', tick: v => String(v)
    },
    {
      title: 'Revenue (USD)', values: revenue, max: 50000, step: 10000, top: 224, base: 374,
      color: '#2e7d4f', tick: v => v === 0 ? '$0' : '$' + (v / 1000) + 'k'
    }
  ];

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n);
    return n;
  }

  function txt(x, y, str, attrs, parent) {
    const n = el('text', Object.assign({ x, y }, attrs), parent);
    n.textContent = str;
    return n;
  }

  for (const p of panels) {
    const yOf = v => p.base - (v / p.max) * (p.base - p.top);
    txt(L, p.top - 10, p.title, { class: 'ptitle' }, svg);

    for (let t = 0; t <= p.max; t += p.step) {
      el('line', { x1: L, x2: R, y1: yOf(t), y2: yOf(t), class: t === 0 ? 'axis' : 'grid' }, svg);
      txt(L - 8, yOf(t) + 4, p.tick(t), { 'text-anchor': 'end', class: 'tick' }, svg);
    }

    p.values.forEach((v, i) => {
      const w = slot * 0.6;
      const x = L + i * slot + (slot - w) / 2;
      const top = yOf(v);
      const r = 4;
      el('path', {
        d: `M${x},${p.base} V${top + r} Q${x},${top} ${x + r},${top} H${x + w - r} Q${x + w},${top} ${x + w},${top + r} V${p.base} Z`,
        fill: p.color
      }, svg);
    });
  }

  months.forEach((m, i) => {
    txt(L + i * slot + slot / 2, 392, m, { 'text-anchor': 'middle', class: 'tick' }, svg);
  });

  function showTip(i, hit) {
    tip.innerHTML = `<strong>${months[i]} 2025</strong><br>Orders: ${fmtInt(orders[i])}<br>Revenue: ${fmtUsd(revenue[i])}`;
    const r = hit.getBoundingClientRect();
    const c = chart.getBoundingClientRect();
    tip.style.left = (r.left + r.width / 2 - c.left) + 'px';
    tip.style.top = (r.top - c.top) + 'px';
    tip.style.opacity = 1;
  }

  months.forEach((m, i) => {
    const hit = el('rect', {
      x: L + i * slot, y: 12, width: slot, height: 380, fill: 'transparent'
    }, svg);
    hit.addEventListener('mouseenter', () => showTip(i, hit));
    hit.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
  });

  const rows = document.getElementById('rows');
  months.forEach((m, i) => {
    rows.insertAdjacentHTML('beforeend',
      `<tr><td>${m}</td><td>${fmtInt(orders[i])}</td><td>${fmtUsd(revenue[i])}</td></tr>`);
  });

  const sum = a => a.reduce((s, v) => s + v, 0);
  document.getElementById('total-orders').textContent = fmtInt(sum(orders));
  document.getElementById('total-revenue').textContent = fmtUsd(sum(revenue));
</script>
</body>
</html>
