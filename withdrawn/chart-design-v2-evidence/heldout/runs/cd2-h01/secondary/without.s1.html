<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bird Species Counted at Six Trail Sites, Spring</title>
<style>
  :root {
    --surface: #ffffff;
    --ink: #1d2328;
    --ink-2: #4a545c;
    --ink-muted: #6b757d;
    --grid: #e3e7ea;
    --axis: #aab2b9;
    --bar: #1f6f5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #161b1f;
      --ink: #eef2f4;
      --ink-2: #c2cad0;
      --ink-muted: #95a0a8;
      --grid: #2a3238;
      --axis: #5b666e;
      --bar: #5fb8a0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--surface);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  figure {
    margin: 0 auto;
    max-width: 680px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 0.9rem;
    color: var(--ink-2);
    margin: 0 0 16px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--ink-muted); font-size: 12px; }
  .value { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .label { fill: var(--ink-2); font-size: 13px; }
  .bar { fill: var(--bar); }
  .bar:hover { opacity: 0.85; }
  figcaption {
    font-size: 0.8rem;
    color: var(--ink-muted);
    margin-top: 12px;
  }
  details {
    margin-top: 16px;
    font-size: 0.9rem;
  }
  summary {
    cursor: pointer;
    color: var(--ink-2);
  }
  table {
    border-collapse: collapse;
    margin-top: 8px;
    width: 100%;
    max-width: 320px;
  }
  th, td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--grid);
  }
  th { color: var(--ink-2); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<figure>
  <h1>Bird Species Counted at Six Trail Sites</h1>
  <p class="subtitle">Species count per trail site, spring survey, sorted highest to lowest</p>

  <svg viewBox="0 0 640 350" role="img" aria-labelledby="chart-title chart-desc">
    <title id="chart-title">Bird species counted at six trail sites</title>
    <desc id="chart-desc">Willow Flats 74, Heron Point 67, North Ridge 52, Alder Run 41, Millpond 38, Quarry Loop 29.</desc>

    <!-- Gridlines and y-axis ticks (0 to 80) -->
    <line class="grid" x1="60" y1="20" x2="620" y2="20"/>
    <line class="grid" x1="60" y1="90" x2="620" y2="90"/>
    <line class="grid" x1="60" y1="160" x2="620" y2="160"/>
    <line class="grid" x1="60" y1="230" x2="620" y2="230"/>
    <line class="axis" x1="60" y1="300" x2="620" y2="300"/>
    <text class="tick" x="48" y="24" text-anchor="end">80</text>
    <text class="tick" x="48" y="94" text-anchor="end">60</text>
    <text class="tick" x="48" y="164" text-anchor="end">40</text>
    <text class="tick" x="48" y="234" text-anchor="end">20</text>
    <text class="tick" x="48" y="304" text-anchor="end">0</text>

    <!-- Bars: Willow Flats 74, Heron Point 67, North Ridge 52, Alder Run 41, Millpond 38, Quarry Loop 29 -->
    <path class="bar" d="M78.7,300 V45 Q78.7,41 82.7,41 H130.7 Q134.7,41 134.7,45 V300 Z"/>
    <path class="bar" d="M172,300 V69.5 Q172,65.5 176,65.5 H224 Q228,65.5 228,69.5 V300 Z"/>
    <path class="bar" d="M265.3,300 V122 Q265.3,118 269.3,118 H317.3 Q321.3,118 321.3,122 V300 Z"/>
    <path class="bar" d="M358.7,300 V160.5 Q358.7,156.5 362.7,156.5 H410.7 Q414.7,156.5 414.7,160.5 V300 Z"/>
    <path class="bar" d="M452,300 V171 Q452,167 456,167 H504 Q508,167 508,171 V300 Z"/>
    <path class="bar" d="M545.3,300 V202.5 Q545.3,198.5 549.3,198.5 H597.3 Q601.3,198.5 601.3,202.5 V300 Z"/>

    <!-- Value labels -->
    <text class="value" x="106.7" y="35" text-anchor="middle">74</text>
    <text class="value" x="200" y="59.5" text-anchor="middle">67</text>
    <text class="value" x="293.3" y="112" text-anchor="middle">52</text>
    <text class="value" x="386.7" y="150.5" text-anchor="middle">41</text>
    <text class="value" x="480" y="161" text-anchor="middle">38</text>
    <text class="value" x="573.3" y="192.5" text-anchor="middle">29</text>

    <!-- Category labels -->
    <text class="label" x="106.7" y="322" text-anchor="middle">Willow Flats</text>
    <text class="label" x="200" y="322" text-anchor="middle">Heron Point</text>
    <text class="label" x="293.3" y="322" text-anchor="middle">North Ridge</text>
    <text class="label" x="386.7" y="322" text-anchor="middle">Alder Run</text>
    <text class="label" x="480" y="322" text-anchor="middle">Millpond</text>
    <text class="label" x="573.3" y="322" text-anchor="middle">Quarry Loop</text>
  </svg>

  <figcaption>Total bird species recorded at each site during last spring's count.</figcaption>

  <details>
    <summary>View as table</summary>
    <table>
      <thead>
        <tr><th>Trail site</th><th class="num">Species</th></tr>
      </thead>
      <tbody>
        <tr><td>Willow Flats</td><td class="num">74</td></tr>
        <tr><td>Heron Point</td><td class="num">67</td></tr>
        <tr><td>North Ridge</td><td class="num">52</td></tr>
        <tr><td>Alder Run</td><td class="num">41</td></tr>
        <tr><td>Millpond</td><td class="num">38</td></tr>
        <tr><td>Quarry Loop</td><td class="num">29</td></tr>
      </tbody>
    </table>
  </details>
</figure>
</body>
</html>
