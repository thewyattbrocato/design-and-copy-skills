<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bird species by trail site, last spring</title>
<style>
  body {
    margin: 0;
    background: #ffffff;
    color: #1f2328;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .chart {
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 0.25rem;
  }
  .sub {
    margin: 0 0 1.25rem;
    color: #57606a;
    font-size: 0.9rem;
  }
  ol {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: grid;
    grid-template-columns: 8.5rem 1fr 2.5rem;
    align-items: center;
    gap: 0.6rem;
    margin: 0.45rem 0;
    font-size: 0.95rem;
  }
  .name {
    text-align: right;
  }
  .track {
    border-left: 1px solid #1f2328;
  }
  .bar {
    display: block;
    height: 1.1rem;
    background: #8c959f;
  }
  li.top .bar {
    background: #0969da;
  }
  li.top .name,
  li.top .val {
    font-weight: 600;
  }
  .val {
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  footer {
    margin-top: 1.25rem;
    font-size: 0.8rem;
    color: #57606a;
  }
</style>
</head>
<body>
<figure class="chart" role="group" aria-labelledby="chart-title">
  <h1 id="chart-title">Willow Flats recorded the most bird species last spring</h1>
  <p class="sub">Bird species counted at six trail sites, spring survey. Sorted from highest to lowest.</p>

  <ol>
    <li class="top">
      <span class="name">Willow Flats</span>
      <span class="track"><span class="bar" style="width: 100%"></span></span>
      <span class="val">74</span>
    </li>
    <li>
      <span class="name">Heron Point</span>
      <span class="track"><span class="bar" style="width: 90.5%"></span></span>
      <span class="val">67</span>
    </li>
    <li>
      <span class="name">North Ridge</span>
      <span class="track"><span class="bar" style="width: 70.3%"></span></span>
      <span class="val">52</span>
    </li>
    <li>
      <span class="name">Alder Run</span>
      <span class="track"><span class="bar" style="width: 55.4%"></span></span>
      <span class="val">41</span>
    </li>
    <li>
      <span class="name">Millpond</span>
      <span class="track"><span class="bar" style="width: 51.4%"></span></span>
      <span class="val">38</span>
    </li>
    <li>
      <span class="name">Quarry Loop</span>
      <span class="track"><span class="bar" style="width: 39.2%"></span></span>
      <span class="val">29</span>
    </li>
  </ol>

  <footer>
    Bars start at zero. Each value is the number of bird species counted at that site during last spring's survey.
  </footer>
</figure>
</body>
</html>
