<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenwick Falls rent vs. regional prices, 2016–2025</title>
<style>
  :root { --rent:#b8430e; --ref:#6b7280; --ink:#1f2937; --mute:#6b7280; --grid:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:#fff; color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  figure { margin:0 auto; max-width:880px; }
  h1 { font-size:28px; line-height:1.2; margin:0 0 6px; }
  .sub { font-size:16px; color:var(--mute); margin:0 0 12px; }
  svg { width:100%; height:auto; display:block; }
  svg text { font-family:inherit; }
  .note { font-size:13px; color:var(--mute); margin:8px 0 0; line-height:1.4; }
  details { margin-top:12px; font-size:13px; color:var(--mute); }
  table { border-collapse:collapse; margin-top:8px; }
  th, td { padding:3px 14px 3px 0; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  @media print { details { display:none; } }
</style>
</head>
<body>
<figure>
  <h1>Fenwick Falls rent is up 48% since 2016, well ahead of regional prices (+33%)</h1>
  <p class="sub">Average monthly rent rose from $1,180 to $1,745. Both lines are shown as an index, 2016 = 100.</p>

  <svg viewBox="0 0 840 490" role="img" aria-labelledby="t d">
    <title id="t">Rent index versus regional price index, 2016 to 2025</title>
    <desc id="d">Average monthly rent in Fenwick Falls rose from $1,180 in 2016 to $1,745 in 2025, an index of 148 against 132.5 for regional prices. Rent pulled away from prices after 2021.</desc>

    <!-- gridlines and y labels -->
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="64" x2="650" y1="430" y2="430" stroke="#9ca3af"/>
      <line x1="64" x2="650" y1="366" y2="366"/>
      <line x1="64" x2="650" y1="302" y2="302"/>
      <line x1="64" x2="650" y1="238" y2="238"/>
      <line x1="64" x2="650" y1="174" y2="174"/>
      <line x1="64" x2="650" y1="110" y2="110"/>
    </g>
    <g font-size="14" fill="#6b7280" text-anchor="end">
      <text x="56" y="435">100</text>
      <text x="56" y="371">110</text>
      <text x="56" y="307">120</text>
      <text x="56" y="243">130</text>
      <text x="56" y="179">140</text>
      <text x="56" y="115">150</text>
    </g>
    <text x="64" y="86" font-size="13" fill="#6b7280">Index, 2016 = 100 (axis starts at 100)</text>

    <!-- x labels -->
    <g font-size="14" fill="#6b7280" text-anchor="middle">
      <text x="64" y="454">2016</text><text x="129.1" y="454">’17</text><text x="194.2" y="454">’18</text>
      <text x="259.3" y="454">’19</text><text x="324.4" y="454">’20</text><text x="389.6" y="454">’21</text>
      <text x="454.7" y="454">’22</text><text x="519.8" y="454">’23</text><text x="584.9" y="454">’24</text>
      <text x="650" y="454">2025</text>
    </g>

    <!-- regional price index (reference) -->
    <polyline fill="none" stroke="#6b7280" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
      points="64,430 129.1,416.6 194.2,400.6 259.3,388.4 324.4,380.1 389.6,347.4 454.7,290.5 519.8,260.4 584.9,238 650,222"/>
    <circle cx="650" cy="222" r="5" fill="#6b7280"/>

    <!-- rent index -->
    <polyline fill="none" stroke="#b8430e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
      points="64,430 129.1,411 194.2,386.6 259.3,359.5 324.4,351.4 389.6,316.1 454.7,240.2 519.8,180.5 584.9,148 650,123.6"/>
    <circle cx="64" cy="430" r="5" fill="#b8430e"/>
    <circle cx="650" cy="123.6" r="5" fill="#b8430e"/>

    <!-- start value -->
    <text x="72" y="418" font-size="15" font-weight="600" fill="#b8430e">$1,180 / month</text>

    <!-- annotation -->
    <text x="436" y="196" font-size="14" fill="#1f2937" text-anchor="end">2021 → 2023: rent up</text>
    <text x="436" y="214" font-size="14" fill="#1f2937" text-anchor="end">$250 a month in two years</text>

    <!-- direct end labels -->
    <g font-size="16" font-weight="700" fill="#b8430e">
      <text x="664" y="118">Rent: +48%</text>
    </g>
    <text x="664" y="138" font-size="14" fill="#b8430e">$1,745 / month</text>
    <text x="664" y="217" font-size="16" font-weight="700" fill="#6b7280">Regional prices:</text>
    <text x="664" y="236" font-size="16" font-weight="700" fill="#6b7280">+33%</text>
    <text x="664" y="254" font-size="14" fill="#6b7280">(index 132.5)</text>
  </svg>

  <p class="note">Rent: average monthly rent in Fenwick Falls, in current (not inflation-adjusted) dollars, shown as an index with 2016 = 100. Prices: regional price index, 2016 = 100. Both lines are on the same scale.</p>

  <details>
    <summary>View the data as a table</summary>
    <table>
      <thead><tr><th>Year</th><th>Avg. monthly rent</th><th>Rent index</th><th>Regional price index</th></tr></thead>
      <tbody>
        <tr><td>2016</td><td>$1,180</td><td>100.0</td><td>100.0</td></tr>
        <tr><td>2017</td><td>$1,215</td><td>103.0</td><td>102.1</td></tr>
        <tr><td>2018</td><td>$1,260</td><td>106.8</td><td>104.6</td></tr>
        <tr><td>2019</td><td>$1,310</td><td>111.0</td><td>106.5</td></tr>
        <tr><td>2020</td><td>$1,325</td><td>112.3</td><td>107.8</td></tr>
        <tr><td>2021</td><td>$1,390</td><td>117.8</td><td>112.9</td></tr>
        <tr><td>2022</td><td>$1,530</td><td>129.7</td><td>121.8</td></tr>
        <tr><td>2023</td><td>$1,640</td><td>139.0</td><td>126.5</td></tr>
        <tr><td>2024</td><td>$1,700</td><td>144.1</td><td>130.0</td></tr>
        <tr><td>2025</td><td>$1,745</td><td>147.9</td><td>132.5</td></tr>
      </tbody>
    </table>
  </details>
</figure>
</body>
</html>
