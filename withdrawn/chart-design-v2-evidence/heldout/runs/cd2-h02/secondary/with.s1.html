<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenwick Falls rent vs. regional prices, 2016–2025</title>
<style>
  :root {
    --ink: #1d2328;
    --muted: #5d656d;
    --rule: #d9dde1;
    --accent: #1f4e79;
    --context: #8a9097;
  }
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  figure {
    margin: 0 auto;
    max-width: 900px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .subtitle {
    font-size: 0.95rem;
    color: var(--muted);
    margin: 0 0 16px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .grid {
    stroke: var(--rule);
    stroke-width: 1;
  }
  .axis {
    stroke: var(--muted);
    stroke-width: 1;
  }
  .tick {
    font-size: 13px;
    fill: var(--muted);
  }
  .axis-title {
    font-size: 13px;
    fill: var(--muted);
  }
  .rent-line {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .index-line {
    fill: none;
    stroke: var(--context);
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    stroke-linejoin: round;
  }
  .rent-dot {
    fill: var(--accent);
  }
  .index-dot {
    fill: var(--context);
  }
  .label-name {
    font-size: 14px;
    font-weight: 700;
  }
  .label-value {
    font-size: 13px;
  }
  .rent-label {
    fill: var(--accent);
  }
  .index-label {
    fill: #5d656d;
  }
  .takeaway {
    font-size: 0.95rem;
    line-height: 1.5;
    margin: 16px 0 0;
  }
  .source {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 12px 0 0;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<figure>
  <h1>Rent rose 48% in Fenwick Falls since 2016, well ahead of regional prices</h1>
  <p class="subtitle">Average monthly rent vs. the regional price index, both indexed to 2016 = 100, 2016–2025</p>

  <svg viewBox="0 0 900 430" role="img" aria-labelledby="chart-title chart-desc">
    <title id="chart-title">Average monthly rent vs. regional price index, indexed to 2016 = 100</title>
    <desc id="chart-desc">Rent index rose from 100 in 2016 to 147.9 in 2025, a 48% increase, which is $1,180 to $1,745 per month. The regional price index rose from 100 to 132.5, a 33% increase.</desc>

    <!-- Gridlines and y-axis ticks -->
    <line class="grid" x1="70" y1="60" x2="700" y2="60"/>
    <line class="grid" x1="70" y1="124" x2="700" y2="124"/>
    <line class="grid" x1="70" y1="188" x2="700" y2="188"/>
    <line class="grid" x1="70" y1="252" x2="700" y2="252"/>
    <line class="grid" x1="70" y1="316" x2="700" y2="316"/>
    <line class="axis" x1="70" y1="380" x2="700" y2="380"/>

    <text class="tick" x="58" y="65" text-anchor="end">150</text>
    <text class="tick" x="58" y="129" text-anchor="end">140</text>
    <text class="tick" x="58" y="193" text-anchor="end">130</text>
    <text class="tick" x="58" y="257" text-anchor="end">120</text>
    <text class="tick" x="58" y="321" text-anchor="end">110</text>
    <text class="tick" x="58" y="385" text-anchor="end">100</text>

    <text class="axis-title" x="70" y="30">Index (2016 = 100)</text>

    <!-- X-axis year labels -->
    <text class="tick" x="70"  y="402" text-anchor="middle">2016</text>
    <text class="tick" x="140" y="402" text-anchor="middle">2017</text>
    <text class="tick" x="210" y="402" text-anchor="middle">2018</text>
    <text class="tick" x="280" y="402" text-anchor="middle">2019</text>
    <text class="tick" x="350" y="402" text-anchor="middle">2020</text>
    <text class="tick" x="420" y="402" text-anchor="middle">2021</text>
    <text class="tick" x="490" y="402" text-anchor="middle">2022</text>
    <text class="tick" x="560" y="402" text-anchor="middle">2023</text>
    <text class="tick" x="630" y="402" text-anchor="middle">2024</text>
    <text class="tick" x="700" y="402" text-anchor="middle">2025</text>

    <!-- Regional price index (context, muted, dashed) -->
    <polyline class="index-line" points="70,380 140,366.6 210,350.6 280,338.4 350,330.1 420,297.4 490,240.5 560,210.4 630,188 700,172"/>
    <g class="index-dot">
      <circle cx="70" cy="380" r="4"/>
      <circle cx="140" cy="366.6" r="4"/>
      <circle cx="210" cy="350.6" r="4"/>
      <circle cx="280" cy="338.4" r="4"/>
      <circle cx="350" cy="330.1" r="4"/>
      <circle cx="420" cy="297.4" r="4"/>
      <circle cx="490" cy="240.5" r="4"/>
      <circle cx="560" cy="210.4" r="4"/>
      <circle cx="630" cy="188" r="4"/>
      <circle cx="700" cy="172" r="4"/>
    </g>

    <!-- Average rent, indexed (focus, solid accent) -->
    <polyline class="rent-line" points="70,380 140,361 210,336.6 280,309.5 350,301.4 420,266.1 490,190.2 560,130.5 630,98 700,73.6"/>
    <g class="rent-dot">
      <circle cx="70" cy="380" r="4.5"/>
      <circle cx="140" cy="361" r="4.5"/>
      <circle cx="210" cy="336.6" r="4.5"/>
      <circle cx="280" cy="309.5" r="4.5"/>
      <circle cx="350" cy="301.4" r="4.5"/>
      <circle cx="420" cy="266.1" r="4.5"/>
      <circle cx="490" cy="190.2" r="4.5"/>
      <circle cx="560" cy="130.5" r="4.5"/>
      <circle cx="630" cy="98" r="4.5"/>
      <circle cx="700" cy="73.6" r="4.5"/>
    </g>

    <!-- Direct end labels -->
    <text class="label-name rent-label" x="716" y="68">Average rent: +48%</text>
    <text class="label-value rent-label" x="716" y="88">$1,180 → $1,745 per month</text>

    <text class="label-name index-label" x="716" y="167">Regional prices: +33%</text>
    <text class="label-value index-label" x="716" y="187">Price index 100 → 132.5</text>
  </svg>

  <p class="takeaway">Average rent in Fenwick Falls went from $1,180 a month in 2016 to $1,745 in 2025. Regional prices rose 33% over the same years, so rent grew about 15 percentage points faster than prices in general.</p>
  <p class="source">Source: Fenwick Falls average monthly rent by year, 2016–2025; regional price index (2016 = 100). Rent is shown as an index with 2016 = 100 so it can be compared directly with the price index.</p>

  <table class="sr-only">
    <caption>Average monthly rent and regional price index, 2016–2025</caption>
    <thead>
      <tr><th scope="col">Year</th><th scope="col">Average monthly rent (USD)</th><th scope="col">Rent index (2016 = 100)</th><th scope="col">Regional price index (2016 = 100)</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">2016</th><td>$1,180</td><td>100.0</td><td>100.0</td></tr>
      <tr><th scope="row">2017</th><td>$1,215</td><td>103.0</td><td>102.1</td></tr>
      <tr><th scope="row">2018</th><td>$1,260</td><td>106.8</td><td>104.6</td></tr>
      <tr><th scope="row">2019</th><td>$1,310</td><td>111.0</td><td>106.5</td></tr>
      <tr><th scope="row">2020</th><td>$1,325</td><td>112.3</td><td>107.8</td></tr>
      <tr><th scope="row">2021</th><td>$1,390</td><td>117.8</td><td>112.9</td></tr>
      <tr><th scope="row">2022</th><td>$1,530</td><td>129.7</td><td>121.8</td></tr>
      <tr><th scope="row">2023</th><td>$1,640</td><td>139.0</td><td>126.5</td></tr>
      <tr><th scope="row">2024</th><td>$1,700</td><td>144.1</td><td>130.0</td></tr>
      <tr><th scope="row">2025</th><td>$1,745</td><td>147.9</td><td>132.5</td></tr>
    </tbody>
  </table>
</figure>
</body>
</html>
