<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Average monthly rent in Fenwick Falls, 2016–2025</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    color: #1d2330;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  figure {
    margin: 0 auto;
    max-width: 780px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 14px;
    color: #4a5263;
    margin: 0 0 16px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .axis-label, .year-label, .grid-label {
    font-size: 13px;
    fill: #4a5263;
  }
  .value-label {
    font-size: 14px;
    font-weight: 700;
  }
  .legend {
    font-size: 14px;
    margin: 0 0 8px;
    color: #1d2330;
  }
  .swatch {
    display: inline-block;
    width: 22px;
    height: 0;
    vertical-align: middle;
    margin-right: 6px;
    border-top: 3px solid;
  }
  .takeaway {
    font-size: 15px;
    margin: 16px 0 0;
  }
  .source {
    font-size: 12px;
    color: #4a5263;
    margin: 12px 0 0;
  }
  details {
    margin-top: 12px;
    font-size: 13px;
    color: #4a5263;
  }
  table {
    border-collapse: collapse;
    margin-top: 8px;
  }
  th, td {
    padding: 3px 12px 3px 0;
    text-align: right;
  }
  th:first-child, td:first-child {
    text-align: left;
  }
</style>
</head>
<body>
<figure>
  <h1>Average monthly rent in Fenwick Falls rose 48% in ten years</h1>
  <p class="subtitle">Average monthly rent by year, 2016–2025, compared with what rent would have been if it had only kept pace with regional prices</p>

  <p class="legend">
    <span class="swatch" style="border-color:#1f5f8b"></span>Average monthly rent
    &nbsp;&nbsp;&nbsp;
    <span class="swatch" style="border-color:#8a8f98; border-top-style:dashed"></span>Rent if it had only tracked regional prices
  </p>

  <svg viewBox="0 0 780 420" role="img" aria-labelledby="chart-title chart-desc">
    <title id="chart-title">Average monthly rent, Fenwick Falls, 2016 to 2025</title>
    <desc id="chart-desc">Average monthly rent rose from $1,180 in 2016 to $1,745 in 2025, a 48% increase. Regional prices rose 32.5% over the same years, so rent if it had only tracked prices would be $1,564 in 2025. The vertical axis starts at $0.</desc>

    <!-- Gridlines and y-axis labels, starting at $0 -->
    <g stroke="#e3e6ec" stroke-width="1">
      <line x1="70" y1="360" x2="680" y2="360" stroke="#9aa1ae"/>
      <line x1="70" y1="280" x2="680" y2="280"/>
      <line x1="70" y1="200" x2="680" y2="200"/>
      <line x1="70" y1="120" x2="680" y2="120"/>
      <line x1="70" y1="40" x2="680" y2="40"/>
    </g>
    <g class="grid-label" text-anchor="end">
      <text x="60" y="364">$0</text>
      <text x="60" y="284">$500</text>
      <text x="60" y="204">$1,000</text>
      <text x="60" y="124">$1,500</text>
      <text x="60" y="44">$2,000</text>
    </g>

    <!-- Comparison line: rent if it had only tracked the regional price index -->
    <polyline fill="none" stroke="#8a8f98" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round"
      points="70,171.2 137.8,167.2 205.6,162.5 273.3,158.9 341.1,156.6 408.9,146.9 476.7,130.0 544.4,121.2 612.2,114.6 680,109.9"/>

    <!-- Average monthly rent -->
    <polyline fill="none" stroke="#1f5f8b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
      points="70,171.2 137.8,165.6 205.6,158.4 273.3,150.4 341.1,148.0 408.9,137.6 476.7,115.2 544.4,97.6 612.2,88.0 680,80.8"/>

    <g fill="#1f5f8b">
      <circle cx="70" cy="171.2" r="4"/>
      <circle cx="137.8" cy="165.6" r="4"/>
      <circle cx="205.6" cy="158.4" r="4"/>
      <circle cx="273.3" cy="150.4" r="4"/>
      <circle cx="341.1" cy="148.0" r="4"/>
      <circle cx="408.9" cy="137.6" r="4"/>
      <circle cx="476.7" cy="115.2" r="4"/>
      <circle cx="544.4" cy="97.6" r="4"/>
      <circle cx="612.2" cy="88.0" r="4"/>
      <circle cx="680" cy="80.8" r="4"/>
    </g>

    <!-- Direct value labels at the start and end -->
    <text class="value-label" x="70" y="156" text-anchor="middle" fill="#1f5f8b">$1,180</text>
    <text class="value-label" x="692" y="76" text-anchor="start" fill="#1f5f8b">$1,745</text>
    <text class="value-label" x="692" y="114" text-anchor="start" fill="#5c626e">$1,564</text>

    <!-- X-axis year labels -->
    <g class="year-label" text-anchor="middle">
      <text x="70" y="382">2016</text>
      <text x="137.8" y="382">2017</text>
      <text x="205.6" y="382">2018</text>
      <text x="273.3" y="382">2019</text>
      <text x="341.1" y="382">2020</text>
      <text x="408.9" y="382">2021</text>
      <text x="476.7" y="382">2022</text>
      <text x="544.4" y="382">2023</text>
      <text x="612.2" y="382">2024</text>
      <text x="680" y="382">2025</text>
    </g>
  </svg>

  <p class="takeaway">Rent went from $1,180 to $1,745 a month, up $565 (48%). Regional prices rose 32.5% over the same period, so rent climbed faster than prices in general.</p>
  <p class="source">Average monthly rent by year, Fenwick Falls. Regional price index (2016 = 100): 100, 102.1, 104.6, 106.5, 107.8, 112.9, 121.8, 126.5, 130.0, 132.5. The dashed line applies that index to 2016 rent of $1,180. Vertical axis starts at $0.</p>

  <details>
    <summary>Show the data</summary>
    <table>
      <thead>
        <tr><th>Year</th><th>Average monthly rent</th><th>Regional price index (2016 = 100)</th><th>Rent if tracking prices</th></tr>
      </thead>
      <tbody>
        <tr><td>2016</td><td>$1,180</td><td>100.0</td><td>$1,180</td></tr>
        <tr><td>2017</td><td>$1,215</td><td>102.1</td><td>$1,205</td></tr>
        <tr><td>2018</td><td>$1,260</td><td>104.6</td><td>$1,234</td></tr>
        <tr><td>2019</td><td>$1,310</td><td>106.5</td><td>$1,257</td></tr>
        <tr><td>2020</td><td>$1,325</td><td>107.8</td><td>$1,272</td></tr>
        <tr><td>2021</td><td>$1,390</td><td>112.9</td><td>$1,332</td></tr>
        <tr><td>2022</td><td>$1,530</td><td>121.8</td><td>$1,437</td></tr>
        <tr><td>2023</td><td>$1,640</td><td>126.5</td><td>$1,493</td></tr>
        <tr><td>2024</td><td>$1,700</td><td>130.0</td><td>$1,534</td></tr>
        <tr><td>2025</td><td>$1,745</td><td>132.5</td><td>$1,564</td></tr>
      </tbody>
    </table>
  </details>
</figure>
</body>
</html>
