<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent in Fenwick Falls, 2016–2025</title>
<style>
  :root { --ink:#1f2328; --muted:#5b636d; --grid:#e3e6ea; --rent:#c2410c; --prices:#6b7280; --bg:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  figure { margin:0 auto; padding:24px 20px 20px; max-width:880px; }
  h1 { font-size:clamp(22px,4vw,32px); line-height:1.15; margin:0 0 8px; letter-spacing:-0.01em; }
  .sub { margin:0 0 16px; font-size:clamp(15px,2.2vw,18px); color:var(--muted); line-height:1.4; }
  .sub b { color:var(--ink); }
  svg { display:block; width:100%; height:auto; }
  svg text { font-family: inherit; }
  .note { font-size:13px; color:var(--muted); line-height:1.45; margin:10px 0 0; }
  details { margin-top:12px; font-size:13px; color:var(--muted); }
  summary { cursor:pointer; }
  table { border-collapse:collapse; margin-top:8px; width:100%; max-width:520px; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:4px 10px; border-bottom:1px solid var(--grid); }
  th:first-child, td:first-child { text-align:left; }
  @media print { details { display:none; } }
</style>
</head>
<body>
<figure>
  <h1>Rent in Fenwick Falls is up 48% since 2016, outpacing regional prices by 15 points</h1>
  <p class="sub">Average monthly rent rose from <b>$1,180</b> to <b>$1,745</b>. Regional prices overall rose 32.5%.</p>

  <svg id="chart" viewBox="0 0 800 440" role="img"
    aria-label="Line chart, 2016 to 2025, both series indexed to 2016 equals 100. Average rent rises to 148, from $1,180 to $1,745 a month. The regional price index rises to 132.5. The two lines are close until 2020, then rent pulls ahead."></svg>

  <p class="note">Both lines are indexed so 2016 = 100, which puts rent and the regional price index on one scale. Rent is the average monthly rent in dollars (not adjusted for inflation); the gray line is the regional price index.</p>

  <details>
    <summary>View the data as a table</summary>
    <table>
      <thead><tr><th>Year</th><th>Avg. monthly rent</th><th>Rent index</th><th>Regional price index</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </details>
</figure>

<script>
(function () {
  var years = [2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];
  var rent  = [1180,1215,1260,1310,1325,1390,1530,1640,1700,1745];
  var cpi   = [100,102.1,104.6,106.5,107.8,112.9,121.8,126.5,130.0,132.5];
  var rentIdx = rent.map(function (r) { return r / rent[0] * 100; });

  var W = 800, L = 48, R = 200, T = 20, B = 36, H = 440;
  var pw = W - L - R, ph = H - T - B, lo = 100, hi = 150;
  function x(i) { return L + i * pw / (years.length - 1); }
  function y(v) { return T + ph - (v - lo) / (hi - lo) * ph; }
  function el(tag, attrs, text) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  var svg = document.getElementById("chart");

  // y grid + labels
  for (var v = 100; v <= 150; v += 10) {
    svg.appendChild(el("line", { x1:L, x2:L+pw, y1:y(v), y2:y(v), stroke: v === 100 ? "#9aa1a9" : "#e3e6ea", "stroke-width":1 }));
    svg.appendChild(el("text", { x:L-8, y:y(v)+4, "text-anchor":"end", "font-size":13, fill:"#5b636d" }, v));
  }
  svg.appendChild(el("text", { x:L, y:T-6, "font-size":12, fill:"#5b636d" }, "Index, 2016 = 100"));

  // x labels
  years.forEach(function (yr, i) {
    if (i % 1 === 0) svg.appendChild(el("text", { x:x(i), y:H-12, "text-anchor":"middle", "font-size":13, fill:"#5b636d" }, yr));
  });

  function path(vals) {
    return vals.map(function (val, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(val).toFixed(1); }).join(" ");
  }
  // prices (context) first, rent on top
  svg.appendChild(el("path", { d:path(cpi), fill:"none", stroke:"#6b7280", "stroke-width":2.5, "stroke-linejoin":"round", "stroke-linecap":"round" }));
  svg.appendChild(el("path", { d:path(rentIdx), fill:"none", stroke:"#c2410c", "stroke-width":3.5, "stroke-linejoin":"round", "stroke-linecap":"round" }));

  var n = years.length - 1;
  svg.appendChild(el("circle", { cx:x(n), cy:y(rentIdx[n]), r:5, fill:"#c2410c", stroke:"#fff", "stroke-width":2 }));
  svg.appendChild(el("circle", { cx:x(n), cy:y(cpi[n]), r:5, fill:"#6b7280", stroke:"#fff", "stroke-width":2 }));
  svg.appendChild(el("circle", { cx:x(0), cy:y(100), r:5, fill:"#c2410c", stroke:"#fff", "stroke-width":2 }));

  // direct labels at line ends
  var lx = x(n) + 14;
  var t1 = el("text", { x:lx, y:y(rentIdx[n])-4, "font-size":16, "font-weight":700, fill:"#1f2328" });
  t1.appendChild(el("tspan", { x:lx }, "Rent: $1,745"));
  t1.appendChild(el("tspan", { x:lx, dy:19, "font-size":13, "font-weight":400, fill:"#5b636d" }, "up 48% (index 148)"));
  svg.appendChild(t1);
  var t2 = el("text", { x:lx, y:y(cpi[n])-4, "font-size":16, "font-weight":700, fill:"#1f2328" });
  t2.appendChild(el("tspan", { x:lx }, "Regional prices"));
  t2.appendChild(el("tspan", { x:lx, dy:19, "font-size":13, "font-weight":400, fill:"#5b636d" }, "up 32.5% (index 132.5)"));
  svg.appendChild(t2);

  // start annotation
  svg.appendChild(el("text", { x:x(0)+10, y:y(100)-12, "font-size":13, fill:"#5b636d" }, "2016: rent $1,180"));

  // table
  var rows = document.getElementById("rows");
  years.forEach(function (yr, i) {
    var tr = document.createElement("tr");
    [yr, "$" + rent[i].toLocaleString("en-US"), rentIdx[i].toFixed(1), cpi[i].toFixed(1)].forEach(function (c) {
      var td = document.createElement("td"); td.textContent = c; tr.appendChild(td);
    });
    rows.appendChild(tr);
  });
})();
</script>
</body>
</html>
