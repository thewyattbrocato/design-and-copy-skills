<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Orchard FM</title>
<style>
  :root {
    --bg: #f6f1e7;
    --card: #fffdf8;
    --ink: #2a2620;
    --muted: #6b6457;
    --line: #e5dccb;
    --accent: #3f7d3a;
    --accent-ink: #ffffff;
    --danger: #b3321f;
    --focus: #1d5fd1;
    --size: 1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17150f;
      --card: #211e16;
      --ink: #f3ede0;
      --muted: #a9a090;
      --line: #36301f;
      --accent: #7fc474;
      --accent-ink: #11200e;
      --danger: #ff8f7c;
      --focus: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  html { font-size: calc(16px * var(--size)); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 1rem 1rem 3rem; }
  header { display: flex; align-items: center; gap: .75rem; padding: .75rem 0 1rem; }
  .logo {
    width: 2.5rem; height: 2.5rem; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700; flex: none;
  }
  h1 { font-size: 1.5rem; margin: 0; line-height: 1.1; }
  .sub { color: var(--muted); font-size: .875rem; margin: 0; }
  h2 {
    font-size: .8125rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 1.5rem .25rem .5rem; font-weight: 600;
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 1rem; overflow: hidden;
  }
  .row {
    padding: .875rem 1rem; display: flex; align-items: center; gap: 1rem;
    border-top: 1px solid var(--line); min-height: 3.5rem;
  }
  .row:first-child { border-top: 0; }
  .row.stack { flex-direction: column; align-items: stretch; gap: .625rem; }
  .txt { flex: 1; min-width: 0; }
  .label { font-weight: 600; display: block; }
  .hint { color: var(--muted); font-size: .875rem; display: block; margin-top: .125rem; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .val { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9375rem; }

  /* Toggle rows are fully tappable */
  button.row {
    width: 100%; text-align: left; font: inherit; color: inherit;
    background: none; border-width: 1px 0 0; border-style: solid; border-color: var(--line);
    cursor: pointer;
  }
  button.row:first-child { border-top: 0; }
  button.row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .switch {
    flex: none; width: 3rem; height: 1.75rem; border-radius: 1rem;
    background: var(--line); position: relative; transition: background .15s;
    border: 1px solid color-mix(in srgb, var(--muted) 50%, transparent);
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: calc(1.75rem - 8px); height: calc(1.75rem - 8px); border-radius: 50%;
    background: var(--card); border: 1px solid var(--muted);
    transition: transform .15s;
  }
  [aria-checked="true"] .switch { background: var(--accent); border-color: var(--accent); }
  [aria-checked="true"] .switch::after { transform: translateX(1.25rem); border-color: var(--card); }

  /* Segmented control */
  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    border: 1px solid var(--line); border-radius: .75rem; padding: .1875rem;
    background: var(--bg); gap: .1875rem;
  }
  .seg button {
    font: inherit; color: inherit; background: none; border: 0; border-radius: .5625rem;
    padding: .5rem .25rem; min-height: 2.5rem; cursor: pointer;
  }
  .seg button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .seg button[aria-checked="true"] {
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .seg.sizes button:nth-child(1) { font-size: .875rem; }
  .seg.sizes button:nth-child(3) { font-size: 1.125rem; }
  .seg.sizes button:nth-child(4) { font-size: 1.25rem; }

  select, input[type=range] { font: inherit; color: inherit; }
  select {
    background: var(--bg); border: 1px solid var(--line); border-radius: .625rem;
    padding: .5rem .625rem; min-height: 2.5rem; max-width: 50%;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 2rem; margin: 0; }

  .preview {
    padding: .75rem 1rem; border-top: 1px solid var(--line);
    background: var(--bg);
  }
  .preview b { display: block; }
  .preview span { color: var(--muted); }

  .reset {
    width: 100%; margin-top: 1.5rem; font: inherit; font-weight: 600;
    color: var(--danger); background: var(--card);
    border: 1px solid var(--line); border-radius: 1rem;
    padding: .875rem 1rem; min-height: 3rem; cursor: pointer;
  }
  .reset:hover:not(:disabled) { border-color: var(--danger); }
  .reset:disabled { color: var(--muted); cursor: default; opacity: .7; }
  .foot { text-align: center; color: var(--muted); font-size: .8125rem; margin-top: 1rem; }

  .toast {
    position: fixed; left: 50%; bottom: 1.25rem; transform: translate(-50%, 150%);
    background: var(--ink); color: var(--bg); border-radius: .875rem;
    padding: .5rem .5rem .5rem 1rem; display: flex; align-items: center; gap: .75rem;
    transition: transform .2s; max-width: calc(100% - 2rem); box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast button {
    font: inherit; font-weight: 600; background: none; border: 0; color: inherit;
    text-decoration: underline; padding: .5rem .75rem; cursor: pointer; min-height: 2.5rem;
  }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">O</div>
    <div>
      <h1>Settings</h1>
      <p class="sub">Orchard FM · changes save automatically</p>
    </div>
  </header>

  <h2>Listening</h2>
  <div class="card">
    <div class="row stack">
      <div class="txt">
        <span class="label" id="q-l">Streaming quality</span>
        <span class="hint" id="q-h"></span>
      </div>
      <div class="seg" role="radiogroup" aria-labelledby="q-l" data-key="quality">
        <button role="radio" data-v="auto">Auto</button>
        <button role="radio" data-v="low">Low</button>
        <button role="radio" data-v="standard">Standard</button>
        <button role="radio" data-v="high">High</button>
      </div>
    </div>
    <div class="row stack">
      <div class="head">
        <label class="label" for="xfade">Crossfade between songs</label>
        <span class="val" id="xfade-v"></span>
      </div>
      <input type="range" id="xfade" min="0" max="12" step="1" data-key="crossfade">
    </div>
    <div class="row">
      <div class="txt">
        <label class="label" for="sleep">Default sleep timer</label>
        <span class="hint">Used when you tap the moon on the player.</span>
      </div>
      <select id="sleep" data-key="sleep">
        <option value="0">Off</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="45">45 minutes</option>
        <option value="60">1 hour</option>
        <option value="90">1.5 hours</option>
      </select>
    </div>
    <button class="row" role="switch" data-key="lyrics">
      <span class="txt">
        <span class="label">Show lyrics</span>
        <span class="hint">Display lyrics on the player when available.</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </button>
  </div>

  <h2>Data &amp; alerts</h2>
  <div class="card">
    <button class="row" role="switch" data-key="wifiOnly">
      <span class="txt">
        <span class="label">Download only on Wi-Fi</span>
        <span class="hint">Saves your mobile data plan.</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </button>
    <button class="row" role="switch" data-key="notify">
      <span class="txt">
        <span class="label">New-show notifications</span>
        <span class="hint">Get a heads-up when a new show is added.</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </button>
  </div>

  <h2>Display</h2>
  <div class="card">
    <div class="row stack">
      <div class="txt"><span class="label" id="t-l">Text size</span></div>
      <div class="seg sizes" role="radiogroup" aria-labelledby="t-l" data-key="textSize">
        <button role="radio" data-v="small" aria-label="Small">Aa</button>
        <button role="radio" data-v="normal" aria-label="Normal">Aa</button>
        <button role="radio" data-v="large" aria-label="Large">Aa</button>
        <button role="radio" data-v="xlarge" aria-label="Extra large">Aa</button>
      </div>
    </div>
    <div class="preview" aria-hidden="true">
      <b>Morning on the Porch</b>
      <span>Now playing · Orchard FM</span>
    </div>
  </div>

  <button class="reset" id="reset" type="button">Reset all settings to default</button>
  <p class="foot">Orchard FM · Your town, on the air</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-msg"></span>
  <button type="button" id="undo">Undo</button>
</div>

<script>
(function () {
  var DEFAULTS = {
    quality: "auto", wifiOnly: true, sleep: "0", crossfade: 3,
    notify: true, lyrics: true, textSize: "normal"
  };
  var SCALE = { small: .9, normal: 1, large: 1.15, xlarge: 1.3 };
  var QUALITY_HINT = {
    auto: "Adjusts to your connection.",
    low: "About 24 kbps. Best on weak signal.",
    standard: "About 64 kbps. Good for most listening.",
    high: "About 128 kbps. Uses the most data."
  };
  var KEY = "orchardfm.settings";

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s === "object") return Object.assign({}, DEFAULTS, s);
    } catch (e) {}
    return Object.assign({}, DEFAULTS);
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var state = load();
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function isDefault() {
    return Object.keys(DEFAULTS).every(function (k) { return state[k] === DEFAULTS[k]; });
  }

  function render() {
    $$('[role=switch]').forEach(function (b) {
      b.setAttribute("aria-checked", String(!!state[b.dataset.key]));
    });
    $$('.seg').forEach(function (g) {
      var btns = $$('button', g);
      btns.forEach(function (b) {
        var on = b.dataset.v === state[g.dataset.key];
        b.setAttribute("aria-checked", String(on));
        b.tabIndex = on ? 0 : -1;
      });
    });
    $("#sleep").value = state.sleep;
    $("#xfade").value = state.crossfade;
    $("#xfade-v").textContent = state.crossfade === 0 ? "Off" : state.crossfade + " sec";
    $("#q-h").textContent = QUALITY_HINT[state.quality];
    document.documentElement.style.setProperty("--size", SCALE[state.textSize]);
    $("#reset").disabled = isDefault();
  }

  function set(k, v) { state[k] = v; save(); render(); }

  $$('[role=switch]').forEach(function (b) {
    b.addEventListener("click", function () { set(b.dataset.key, !state[b.dataset.key]); });
  });

  $$('.seg').forEach(function (g) {
    var btns = $$('button', g);
    btns.forEach(function (b, i) {
      b.addEventListener("click", function () { set(g.dataset.key, b.dataset.v); });
      b.addEventListener("keydown", function (e) {
        var d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (!d) return;
        e.preventDefault();
        var n = btns[(i + d + btns.length) % btns.length];
        set(g.dataset.key, n.dataset.v);
        n.focus();
      });
    });
  });

  $("#sleep").addEventListener("change", function (e) { set("sleep", e.target.value); });
  $("#xfade").addEventListener("input", function (e) { set("crossfade", +e.target.value); });

  // Reset with undo instead of a confirm dialog
  var toast = $("#toast"), timer, previous = null;
  function showToast(msg) {
    $("#toast-msg").textContent = msg;
    toast.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(hideToast, 8000);
  }
  function hideToast() { toast.classList.remove("show"); previous = null; }

  $("#reset").addEventListener("click", function () {
    previous = Object.assign({}, state);
    state = Object.assign({}, DEFAULTS);
    save(); render();
    showToast("All settings reset to default.");
  });
  $("#undo").addEventListener("click", function () {
    if (previous) { state = previous; save(); render(); }
    hideToast();
  });

  render();
})();
</script>
</body>
</html>
