<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepool – Marrow Vance</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #141a22;
    --card-edge: #232c38;
    --text: #e4e9ef;
    --muted: #9aa6b4;
    --accent: #5fb8b0;
    --accent-ink: #06201e;
    --health: #d9826a;
    --track: #232c38;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 18px;
    padding: 22px 20px 20px;
  }
  .app {
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0; font-weight: 700; }
  .title { color: var(--muted); font-size: 15px; margin: 2px 0 0; }
  .level {
    flex: none;
    text-align: center;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .level b { display: block; font-size: 22px; letter-spacing: 0; line-height: 1.1; color: var(--text); }

  .health { margin: 22px 0 18px; }
  .health-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: var(--muted); }
  .health-row strong { color: var(--text); font-size: 16px; }
  .bar { height: 14px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 70.83%; background: var(--health); border-radius: 999px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 22px; padding: 0; list-style: none; }
  .stats li {
    background: #1b232d;
    border: 1px solid var(--card-edge);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
  }
  .stats .v { display: block; font-size: 22px; font-weight: 700; }
  .stats .k { display: block; font-size: 12px; color: var(--muted); letter-spacing: .04em; }

  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .inv { list-style: none; margin: 0 0 22px; padding: 0; }
  .inv li { padding: 11px 2px; border-top: 1px solid var(--card-edge); font-size: 16px; display: flex; align-items: center; gap: 12px; }
  .inv li:last-child { border-bottom: 1px solid var(--card-edge); }
  .inv li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }

  .actions { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 16px;
    min-height: 48px;
    border-radius: 12px;
    border: 1px solid var(--card-edge);
    background: #1b232d;
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid #a9e3dd; outline-offset: 2px; }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <main class="card" aria-labelledby="name">
    <p class="app">Tidepool</p>
    <header>
      <div>
        <h1 id="name">Marrow Vance</h1>
        <p class="title">Tide Warden</p>
      </div>
      <div class="level" aria-label="Level 7">Level<b>7</b></div>
    </header>

    <section class="health" aria-label="Health">
      <div class="health-row"><span>Health</span><strong>34 / 48</strong></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="48" aria-valuenow="34" aria-label="Health 34 of 48"><span></span></div>
    </section>

    <ul class="stats" aria-label="Stats">
      <li><span class="v">14</span><span class="k">Strength</span></li>
      <li><span class="v">17</span><span class="k">Wits</span></li>
      <li><span class="v">11</span><span class="k">Nerve</span></li>
    </ul>

    <h2>Inventory</h2>
    <ul class="inv">
      <li>Salt-iron blade</li>
      <li>Lantern</li>
      <li>Net of pearls</li>
      <li>Healing draught</li>
    </ul>

    <div class="actions">
      <button class="primary" type="button">Roll</button>
      <button type="button">Rest</button>
      <button type="button">Level up</button>
    </div>
  </main>
</body>
</html>
