<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification settings · Fernlight</title>
<style>
  :root {
    --s1: 4px;
    --s2: 8px;
    --s3: 12px;
    --s4: 16px;
    --s5: 24px;
    --s6: 32px;
    --s7: 48px;
    --s8: 64px;

    --bg: #f4f6f1;
    --text: #1d2a22;
    --muted: #5b6b61;
    --rule: #dde3d9;
    --accent: #2f7a4d;
    --accent-strong: #256240;
    --field: #ffffff;
    --field-border: #b9c4bb;
    --track: #b7c1b9;
    --focus: #1b5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131a15;
      --text: #e8efe9;
      --muted: #9fb0a5;
      --rule: #2a362e;
      --accent: #4fae78;
      --accent-strong: #6cc792;
      --field: #1b241e;
      --field-border: #4a5a4f;
      --track: #4a5a4f;
      --focus: #7fb0ff;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(var(--s5), 6vw, var(--s8)) clamp(var(--s4), 5vw, var(--s5));
  }

  .brand {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-strong);
    margin: 0 0 var(--s2);
  }
  h1 {
    font-size: 28px;
    line-height: 1.2;
    margin: 0 0 var(--s2);
  }
  .lede {
    margin: 0;
    color: var(--muted);
  }

  form {
    display: flex;
    flex-direction: column;
    gap: var(--s7);
    margin-top: var(--s7);
  }

  section h2 {
    font-size: 18px;
    line-height: 1.3;
    margin: 0 0 var(--s1);
  }
  section > .hint {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .rows {
    margin: var(--s3) 0 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--rule);
  }
  .rows > li { border-bottom: 1px solid var(--rule); }

  /* Alert rows */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s5);
    padding: var(--s4) 0;
    min-height: 56px;
    cursor: pointer;
  }
  .row .name {
    display: block;
    font-weight: 600;
  }
  .row .desc {
    display: block;
    margin-top: var(--s1);
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
  }

  /* Switch */
  .switch {
    position: relative;
    flex: none;
    width: 48px;
    height: 28px;
  }
  .switch input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .switch .track {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: var(--track);
    transition: background 0.15s;
    pointer-events: none;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: transform 0.15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* Fields */
  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--s4);
    margin-top: var(--s4);
  }
  .field { display: flex; flex-direction: column; gap: var(--s2); }
  .field.wide { grid-column: 1 / -1; }
  .field label {
    font-weight: 600;
    font-size: 14px;
  }
  .field .note {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  input[type="time"],
  input[type="email"] {
    font: inherit;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 8px;
    padding: var(--s3) var(--s4);
    min-height: 44px;
    width: 100%;
  }
  input[type="time"]:focus-visible,
  input[type="email"]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .summary-field { max-width: calc(50% - var(--s2)); }

  .actions {
    display: flex;
    align-items: center;
    gap: var(--s4);
    margin-top: var(--s5);
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent-strong);
    border: 0;
    border-radius: 8px;
    padding: var(--s3) var(--s5);
    min-height: 44px;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #0e1a12; } }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .status { font-size: 14px; color: var(--muted); }

  @media (max-width: 480px) {
    .fields { grid-template-columns: 1fr; }
    .summary-field { max-width: none; }
    .actions { flex-direction: column; align-items: stretch; }
    .status { text-align: center; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">Fernlight</p>
    <h1>Notification settings</h1>
    <p class="lede">Choose what we tell you about your greenhouse, and when.</p>
  </header>

  <form id="settings" novalidate>
    <section aria-labelledby="alerts-h">
      <h2 id="alerts-h">Alerts</h2>
      <p class="hint">Sent the moment a sensor reports a problem.</p>
      <ul class="rows">
        <li>
          <label class="row">
            <span>
              <span class="name">Frost warning</span>
              <span class="desc">When the temperature inside is forecast to drop near freezing, so you can cover or heat tender plants.</span>
            </span>
            <span class="switch">
              <input type="checkbox" name="frost" checked>
              <span class="track"></span>
            </span>
          </label>
        </li>
        <li>
          <label class="row">
            <span>
              <span class="name">Low soil moisture</span>
              <span class="desc">When a bed dries out below the level you set for its plants.</span>
            </span>
            <span class="switch">
              <input type="checkbox" name="moisture" checked>
              <span class="track"></span>
            </span>
          </label>
        </li>
        <li>
          <label class="row">
            <span>
              <span class="name">Door left open</span>
              <span class="desc">When the greenhouse door stays open for more than ten minutes.</span>
            </span>
            <span class="switch">
              <input type="checkbox" name="door">
              <span class="track"></span>
            </span>
          </label>
        </li>
      </ul>
    </section>

    <section aria-labelledby="schedule-h">
      <h2 id="schedule-h">Schedule</h2>
      <p class="hint">Quiet hours pause alerts. Frost warnings still come through.</p>
      <div class="fields">
        <div class="field">
          <label for="quiet-start">Quiet hours start</label>
          <input type="time" id="quiet-start" name="quiet-start" value="22:00">
        </div>
        <div class="field">
          <label for="quiet-end">Quiet hours end</label>
          <input type="time" id="quiet-end" name="quiet-end" value="07:00">
        </div>
        <div class="field summary-field">
          <label for="summary">Daily summary time</label>
          <input type="time" id="summary" name="summary" value="08:00">
        </div>
      </div>
    </section>

    <section aria-labelledby="account-h">
      <h2 id="account-h">Account</h2>
      <div class="fields">
        <div class="field wide">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" value="">
          <p class="note">Alerts and your daily summary are sent here.</p>
        </div>
      </div>
      <div class="actions">
        <button type="submit">Save changes</button>
        <span class="status" role="status" aria-live="polite" id="status"></span>
      </div>
    </section>
  </form>
</main>

<script>
  document.getElementById('settings').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email');
    var status = document.getElementById('status');
    if (email.value && !email.checkValidity()) {
      status.textContent = 'Please enter a valid email address.';
      email.focus();
      return;
    }
    status.textContent = 'Changes saved.';
  });
</script>
</body>
</html>
