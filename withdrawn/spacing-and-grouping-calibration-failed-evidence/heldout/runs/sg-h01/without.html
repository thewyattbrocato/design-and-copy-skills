<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking summary – Tidewater Kayak Rentals</title>
<style>
  :root {
    --ink: #14303a;
    --muted: #55707a;
    --line: #dce6e8;
    --bg: #eef4f5;
    --card: #ffffff;
    --accent: #0b6e7f;
    --accent-dark: #085866;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(20, 48, 58, 0.08);
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0 0 12px;
    font-size: 1.4rem;
    line-height: 1.25;
  }
  .when {
    margin: 0 0 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.95rem;
  }
  .when strong { color: var(--ink); font-weight: 600; }
  .items {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .items li {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 0;
    font-size: 0.95rem;
  }
  .items .price { font-variant-numeric: tabular-nums; }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 1.15rem;
    font-weight: 700;
  }
  .total span:last-child { font-variant-numeric: tabular-nums; }
  .confirm {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 14px 16px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .confirm:hover { background: var(--accent-dark); }
  .confirm:focus-visible,
  .change:focus-visible {
    outline: 3px solid #f0a73a;
    outline-offset: 2px;
  }
  .change-wrap {
    margin: 14px 0 0;
    text-align: center;
    font-size: 0.8rem;
  }
  .change {
    color: var(--accent-dark);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .change:hover { color: var(--ink); }
</style>
</head>
<body>
  <section class="card" aria-labelledby="trip-title">
    <p class="eyebrow">Your booking</p>
    <h1 id="trip-title">Saturday sunrise paddle</h1>
    <p class="when">
      <strong>Saturday, October 17, 2026</strong><br>
      Meet at 6:15 AM
    </p>

    <ul class="items">
      <li><span>Single kayak</span><span class="price">$45</span></li>
      <li><span>Dry bag</span><span class="price">$8</span></li>
      <li><span>Photo package</span><span class="price">$15</span></li>
    </ul>

    <div class="total">
      <span>Total</span>
      <span>$68</span>
    </div>

    <button type="button" class="confirm">Confirm booking</button>
    <p class="change-wrap"><a class="change" href="#change-dates">Change dates</a></p>
  </section>
</body>
</html>
