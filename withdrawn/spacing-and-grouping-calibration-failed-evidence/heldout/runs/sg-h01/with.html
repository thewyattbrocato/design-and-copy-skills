<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking summary – Tidewater Kayak Rentals</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: #eef3f5;
    color: #14272e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(20, 39, 46, 0.08), 0 8px 24px rgba(20, 39, 46, 0.08);
    overflow: hidden;
  }

  .trip {
    padding: 24px 24px 20px;
    background: #f5f9fa;
    border-bottom: 1px solid #dde7ea;
  }

  .eyebrow {
    margin: 0 0 6px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #4a6670;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 1.375rem;
    line-height: 1.25;
    font-weight: 700;
  }

  .when {
    margin: 0;
    font-size: 0.9375rem;
    color: #2c444d;
  }

  .when span + span::before {
    content: "·";
    margin: 0 8px;
    color: #7f959d;
  }

  .items {
    list-style: none;
    margin: 0;
    padding: 20px 24px 8px;
  }

  .items li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 8px 0;
    font-size: 0.9375rem;
  }

  .price {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 8px 24px 0;
    padding: 16px 0 0;
    border-top: 1px solid #c9d8dd;
    font-weight: 700;
    font-size: 1.125rem;
  }

  .actions {
    padding: 24px;
  }

  .confirm {
    display: block;
    width: 100%;
    padding: 14px 16px;
    border: 0;
    border-radius: 10px;
    background: #0b6e7f;
    color: #ffffff;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .confirm:hover { background: #09596a; }
  .confirm:active { background: #074a58; }

  .confirm:focus-visible,
  .change:focus-visible {
    outline: 3px solid #f2a33a;
    outline-offset: 2px;
  }

  .change-wrap {
    margin: 14px 0 0;
    text-align: center;
    font-size: 0.8125rem;
  }

  .change {
    color: #4a6670;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .change:hover { color: #0b6e7f; }

  @media (prefers-reduced-motion: reduce) {
    .confirm { transition: none; }
  }
</style>
</head>
<body>
  <main class="card" aria-labelledby="trip-name">
    <header class="trip">
      <p class="eyebrow">Your booking</p>
      <h1 id="trip-name">Saturday sunrise paddle</h1>
      <p class="when"><span>Sat, Oct 17</span><span>Meet at 6:30 AM</span></p>
    </header>

    <ul class="items" aria-label="Line items">
      <li><span>Single kayak</span><span class="price">$45</span></li>
      <li><span>Dry bag</span><span class="price">$8</span></li>
      <li><span>Photo package</span><span class="price">$15</span></li>
    </ul>

    <div class="total">
      <span>Total</span>
      <span class="price">$68</span>
    </div>

    <div class="actions">
      <button type="button" class="confirm">Confirm booking</button>
      <p class="change-wrap"><a href="#change-dates" class="change">Change dates</a></p>
    </div>
  </main>
</body>
</html>
