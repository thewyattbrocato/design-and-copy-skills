<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking summary – Tidewater Kayak Rentals</title>
<style>
  :root {
    --ink: #12303a;
    --muted: #55707a;
    --line: #dbe6e9;
    --bg: #eef4f5;
    --card: #ffffff;
    --accent: #0b6e7f;
    --accent-dark: #084f5c;
    --focus: #f2a43a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(18, 48, 58, 0.08);
    padding: 24px;
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0 0 12px;
    font-size: 22px;
    line-height: 1.25;
  }
  .when {
    margin: 0;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 10px;
    font-size: 15px;
  }
  .when div { display: flex; justify-content: space-between; gap: 12px; }
  .when div + div { margin-top: 4px; }
  .when dt { color: var(--muted); }
  .when dd { margin: 0; font-weight: 600; text-align: right; }
  ul.items {
    list-style: none;
    margin: 20px 0 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  ul.items li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .price { font-variant-numeric: tabular-nums; }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 16px 0 20px;
    font-size: 18px;
    font-weight: 700;
  }
  .total .price { font-size: 22px; }
  button.confirm {
    width: 100%;
    padding: 14px 16px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button.confirm:hover { background: var(--accent-dark); }
  button.confirm:focus-visible,
  a.change:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .change-wrap {
    margin: 14px 0 0;
    text-align: center;
    font-size: 13px;
  }
  a.change {
    color: var(--accent-dark);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  a.change:hover { color: var(--ink); }
</style>
</head>
<body>
  <main class="card" aria-labelledby="trip-name">
    <p class="eyebrow">Tidewater Kayak Rentals</p>
    <h1 id="trip-name">Saturday sunrise paddle</h1>

    <dl class="when">
      <div><dt>Date</dt><dd>Saturday, Oct 17, 2026</dd></div>
      <div><dt>Meet at</dt><dd>6:15 AM</dd></div>
    </dl>

    <ul class="items" aria-label="Order items">
      <li><span>Single kayak</span><span class="price">$45.00</span></li>
      <li><span>Dry bag</span><span class="price">$8.00</span></li>
      <li><span>Photo package</span><span class="price">$15.00</span></li>
    </ul>

    <div class="total">
      <span>Total</span>
      <span class="price">$68.00</span>
    </div>

    <button type="button" class="confirm">Confirm booking</button>
    <p class="change-wrap"><a href="#change-dates" class="change">Change dates</a></p>
  </main>
</body>
</html>
