<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking summary – Tidewater Kayak Rentals</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #14272e;
    --muted: #55696f;
    --line: #dbe5e7;
    --surface: #ffffff;
    --page: #eef4f5;
    --accent: #0b6e7f;
    --accent-dark: #085866;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(20, 39, 46, 0.06), 0 8px 24px rgba(20, 39, 46, 0.08);
    padding: 24px;
  }

  .eyebrow {
    margin: 0 0 4px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 {
    margin: 0 0 12px;
    font-size: 1.375rem;
    line-height: 1.25;
  }

  .when {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin: 0 0 20px;
    padding: 12px 14px;
    background: var(--page);
    border-radius: 10px;
    font-size: 0.9375rem;
  }
  .when div { min-width: 0; }
  .when dt {
    font-size: 0.75rem;
    color: var(--muted);
    margin: 0;
  }
  .when dd {
    margin: 2px 0 0;
    font-weight: 600;
  }

  .items {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .items li {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.9375rem;
  }
  .price { font-variant-numeric: tabular-nums; white-space: nowrap; }

  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 16px 0 20px;
    font-size: 1.125rem;
    font-weight: 700;
  }

  .confirm {
    display: block;
    width: 100%;
    padding: 14px 16px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .confirm:hover { background: var(--accent-dark); }
  .confirm:focus-visible,
  .change:focus-visible {
    outline: 3px solid #f2a93b;
    outline-offset: 2px;
  }

  .change-wrap {
    margin: 14px 0 0;
    text-align: center;
    font-size: 0.8125rem;
  }
  .change {
    color: var(--accent-dark);
    text-decoration: underline;
  }
  .change:hover { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .confirm { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="trip-name">
      <p class="eyebrow">Your booking</p>
      <h1 id="trip-name">Saturday sunrise paddle</h1>

      <dl class="when">
        <div>
          <dt>Date</dt>
          <dd>Saturday, Oct 17, 2026</dd>
        </div>
        <div>
          <dt>Meet at</dt>
          <dd>6:15 AM</dd>
        </div>
      </dl>

      <ul class="items">
        <li><span>Single kayak</span><span class="price">$45.00</span></li>
        <li><span>Dry bag</span><span class="price">$8.00</span></li>
        <li><span>Photo package</span><span class="price">$15.00</span></li>
      </ul>

      <div class="total">
        <span>Total</span>
        <span class="price">$68.00</span>
      </div>

      <button type="button" class="confirm">Confirm booking</button>

      <p class="change-wrap"><a href="#change-dates" class="change">Change dates</a></p>
    </section>
  </main>
</body>
</html>
