<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking summary – Tidewater Kayak Rentals</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #eef3f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #14272e;
    line-height: 1.4;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(20, 39, 46, 0.08), 0 8px 24px rgba(20, 39, 46, 0.08);
    overflow: hidden;
  }
  .head {
    padding: 24px 28px 20px;
    border-bottom: 1px solid #dfe8ea;
  }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #35656f;
  }
  h1 {
    margin: 0 0 14px;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 700;
  }
  .when { margin: 0; font-size: 15px; }
  .when span { display: block; }
  .when .time { color: #4a5f66; margin-top: 2px; }
  .lines {
    list-style: none;
    margin: 0;
    padding: 20px 28px 8px;
  }
  .lines li {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 0;
    font-size: 15px;
  }
  .lines .amt { font-variant-numeric: tabular-nums; }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 12px 28px 0;
    padding-top: 16px;
    border-top: 1px solid #dfe8ea;
    font-weight: 700;
  }
  .total .label { font-size: 16px; }
  .total .sum { font-size: 24px; font-variant-numeric: tabular-nums; }
  .actions { padding: 24px 28px 24px; }
  .confirm {
    display: block;
    width: 100%;
    padding: 14px 16px;
    border: 0;
    border-radius: 10px;
    background: #0d6b7a;
    color: #ffffff;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .confirm:hover { background: #0a5a67; }
  .confirm:focus-visible, .change:focus-visible {
    outline: 3px solid #f2a33a;
    outline-offset: 2px;
  }
  .change-wrap { margin: 14px 0 0; text-align: center; font-size: 13px; }
  .change { color: #35656f; text-decoration: underline; text-underline-offset: 2px; }
  .change:hover { color: #14272e; }
</style>
</head>
<body>
  <main class="card" aria-labelledby="trip-name">
    <div class="head">
      <p class="eyebrow">Your booking</p>
      <h1 id="trip-name">Saturday sunrise paddle</h1>
      <p class="when">
        <span>Saturday, October 17, 2026</span>
        <span class="time">Meet at 6:15 AM</span>
      </p>
    </div>

    <ul class="lines">
      <li><span>Single kayak</span><span class="amt">$45.00</span></li>
      <li><span>Dry bag</span><span class="amt">$8.00</span></li>
      <li><span>Photo package</span><span class="amt">$15.00</span></li>
    </ul>

    <div class="total">
      <span class="label">Total</span>
      <span class="sum">$68.00</span>
    </div>

    <div class="actions">
      <button type="button" class="confirm">Confirm booking</button>
      <p class="change-wrap"><a href="#change-dates" class="change">Change dates</a></p>
    </div>
  </main>
</body>
</html>
