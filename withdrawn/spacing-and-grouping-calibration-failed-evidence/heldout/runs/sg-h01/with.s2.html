<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking summary – Tidewater Kayak Rentals</title>
<style>
  :root {
    --ink: #14272e;
    --muted: #54666d;
    --line: #dbe3e6;
    --surface: #ffffff;
    --page: #eef3f4;
    --accent: #0b5e73;
    --accent-dark: #084a5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(20, 39, 46, .06), 0 8px 24px rgba(20, 39, 46, .06);
    padding: 28px;
  }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1.2;
    font-weight: 700;
  }
  .when {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 15px;
  }
  .when strong { color: var(--ink); font-weight: 600; }

  .items {
    list-style: none;
    margin: 24px 0 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  .items li {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .items .price, .total .price {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 16px 0 0;
    font-size: 20px;
    font-weight: 700;
  }

  .confirm {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 14px 16px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .confirm:hover { background: var(--accent-dark); }
  .confirm:focus-visible, .change:focus-visible {
    outline: 3px solid #f2a93b;
    outline-offset: 2px;
  }
  .change-wrap {
    margin: 14px 0 0;
    text-align: center;
    font-size: 13px;
  }
  .change {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .change:hover { color: var(--accent-dark); }

  @media (max-width: 380px) {
    .card { padding: 22px 18px; }
  }
</style>
</head>
<body>
  <main class="card" aria-labelledby="trip-name">
    <p class="eyebrow">Your booking</p>
    <h1 id="trip-name">Saturday sunrise paddle</h1>
    <p class="when"><strong>Sat, Oct 17, 2026</strong> · Meet at 6:15 AM</p>

    <ul class="items" aria-label="Line items">
      <li><span>Single kayak</span><span class="price">$45</span></li>
      <li><span>Dry bag</span><span class="price">$8</span></li>
      <li><span>Photo package</span><span class="price">$15</span></li>
    </ul>

    <p class="total"><span>Total</span><span class="price">$68</span></p>

    <button class="confirm" type="button">Confirm booking</button>
    <p class="change-wrap"><a class="change" href="#change-dates">Change dates</a></p>
  </main>
</body>
</html>
