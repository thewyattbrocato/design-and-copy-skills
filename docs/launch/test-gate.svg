<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">31 skills against the same agent without them: 157 wins, 39 losses, 45 ties</title>
<desc id="d">Dark card. The design-and-copy-skills wordmark with amber hyphens, an italic serif line, then three large numbers over a proportional bar of 241 held-out tasks where the skill loaded: 157 wins with the skill in amber, 39 losses in off-white, 45 ties in grey. Below: a different model judged each pair blind, in both orders. A strip of 31 marks: 17 solid amber for plain passes and 14 outlined for marginal passes. A last line says two more skills did not pass and are not in the library.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{font-weight:800;fill:#f5f3ee}.a{fill:#ffb224}.f{fill:#f5f3ee}.m{fill:#c4c0b6}
.n{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-style:italic;fill:#f5f3ee}</style>
<rect width="1600" height="900" rx="28" fill="#101114"/>
