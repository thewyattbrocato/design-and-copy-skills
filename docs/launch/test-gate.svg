<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">38 skills against the same agent without them: 218 wins, 46 losses, 48 ties</title>
<desc id="d">Dark card. The design-and-copy-skills wordmark with amber hyphens, an italic serif line, then three large numbers over a proportional bar of 312 held-out tasks where the skill loaded: 218 wins with the skill in amber, 46 losses in off-white, 48 ties in grey. Below: a different model judged each pair blind, in both orders. A strip of 38 marks: 26 solid amber for plain passes and 12 outlined for marginal passes. A last line says two more skills did not pass and are not in the library.</desc>
