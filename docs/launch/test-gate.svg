<text class="n" x="80" y="166" font-size="40">Each skill against the same agent without it, on held-out tasks</text>
<text class="w a" x="80" y="366" font-size="150" letter-spacing="-6" style="fill:#ffb224">157</text>
<text class="w" x="1018" y="366" font-size="150" letter-spacing="-6">39</text>
<text class="w" x="1251" y="366" font-size="150" letter-spacing="-6" style="fill:#c4c0b6">45</text>
<text class="f" x="80" y="426" font-size="40">wins with the skill</text>
<text class="f" x="1018" y="426" font-size="40">losses</text>
<text class="m" x="1251" y="426" font-size="40">ties</text>
