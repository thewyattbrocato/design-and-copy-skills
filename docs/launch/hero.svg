<title id="t">design-and-copy-skills: 31 skills for AI coding agents</title>
<desc id="d">The name design-and-copy-skills set very large on two lines in heavy white sans-serif on near-black, with amber hyphens. Beneath it, an amber rule and an italic serif note: 31 skills for AI coding agents. Each tested against the same agent without it. Along the bottom, a strip of 31 small amber marks: 19 squares labelled 19 design, then 12 dashes labelled 12 copywriting.</desc>
