<title id="t">design-and-copy-skills: 38 skills for AI coding agents</title>
<desc id="d">The name design-and-copy-skills set very large on two lines in heavy white sans-serif on near-black, with amber hyphens. Beneath it, an amber rule and an italic serif note: 38 skills for AI coding agents. Each tested against the same agent without it. Along the bottom, a strip of 38 small amber marks: 26 squares labelled 26 design, then 12 dashes labelled 12 copywriting.</desc>
