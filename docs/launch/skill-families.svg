<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">38 skills in 8 families</title>
<desc id="d">Map of the library: 38 skills in 8 families, 26 design and 12 copywriting, each skill marked as a plain or a marginal pass. Look and type (design, 5): brand-identity, color-palette, generated-ui-restyle, typeface-selection, typesetting (marginal). Layout and emphasis (design, 5): layout-structure, responsive-layout (marginal), showing-work, spacing-and-grouping, visual-hierarchy. Charts and tables (design, 2): chart-design, data-tables (marginal). Product behavior (design, 6): agent-interface-design (marginal), design-system-builder, form-design, interface-behavior (marginal), ui-motion, ui-polish-pass. Research and teaching (design, 5): design-critique, journey-and-service-mapping (marginal), practice-and-assessment, teaching-interfaces, user-research-basics (marginal). Selling and presenting (design, 3): presentation-design, pricing-and-packaging (marginal), sales-conversations. Messages and pages (copywriting, 8): campaign-ideas (marginal), content-strategy, email-and-sequences, headlines-and-leads, landing-page-copy, offers-and-value-propositions, positioning-and-messaging (marginal), ux-microcopy. Checking and editing (copywriting, 4): editing-and-cutting (marginal), fair-persuasion, honest-claims, website-copy-audit (marginal).</desc>
