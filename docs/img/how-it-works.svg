<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" width="960" height="296" role="img" aria-labelledby="t d">
<title id="t">How a skill is used</title>
<desc id="d">Four steps left to right: a task arrives; the agent scans the skill names and one-line descriptions that are always in context; a matching skill loads its short instructions; reference notes load only when a step needs them. With no match, nothing loads.</desc>
<style>
:root{--bg:#ffffff;--card:#f6f8fa;--ink:#1f2328;--muted:#59636e;--rule:#d1d9e0;--grid:#d8dee4;--accent:#1b7f79;--on-accent:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--muted:#9198a1;--rule:#3d444d;--grid:#30363d;--accent:#3fb8af;--on-accent:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.panel{fill:var(--bg);stroke:var(--rule);stroke-width:1}
.card{fill:var(--card);stroke:var(--rule);stroke-width:1}
.muted{fill:var(--muted)}
.title{font-size:22px;font-weight:700}
.h{font-size:15px;font-weight:700}
.b{font-size:13px}
.cap{font-size:12px;fill:var(--muted)}
.num{font-size:13px;font-weight:700;fill:var(--on-accent)}
.dot{fill:var(--accent)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}
.head{fill:var(--muted)}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L7 4L1 7" class="arrow"/></marker></defs>
<rect class="panel" x="0.5" y="0.5" width="959" height="335" rx="10"/>
<text class="title" x="24" y="46">A skill loads only when the task calls for it</text>
<rect class="card" x="24" y="84" width="204" height="172" rx="8"/>
<circle class="dot" cx="52" cy="112" r="12"/><text class="num" x="52" y="116.5" text-anchor="middle">1</text>
<text class="h" x="40" y="152">A task arrives</text>
<text class="b" x="40" y="176">A design-shaped request:</text>
<text class="b" x="40" y="195">a chart, a form, a page,</text>
<text class="b" x="40" y="214">a block of copy.</text>
<rect class="card" x="260" y="84" width="204" height="172" rx="8"/>
<circle class="dot" cx="288" cy="112" r="12"/><text class="num" x="288" y="116.5" text-anchor="middle">2</text>
<text class="h" x="276" y="152">Agent scans the list</text>
<text class="b" x="276" y="176">Only each skill’s name and</text>
<text class="b" x="276" y="195">one-line description are</text>
<text class="b" x="276" y="214">in context.</text>
<text class="b" x="276" y="233">No match, no load.</text>
<rect class="card" x="496" y="84" width="204" height="172" rx="8"/>
<circle class="dot" cx="524" cy="112" r="12"/><text class="num" x="524" y="116.5" text-anchor="middle">3</text>
<text class="h" x="512" y="152">A match loads it</text>
<text class="b" x="512" y="176">The short instructions in</text>
<text class="b" x="512" y="195">its SKILL.md are read</text>
<text class="b" x="512" y="214">now, and not before.</text>
<rect class="card" x="732" y="84" width="204" height="172" rx="8"/>
<circle class="dot" cx="760" cy="112" r="12"/><text class="num" x="760" y="116.5" text-anchor="middle">4</text>
<text class="h" x="748" y="152">References on demand</text>
<text class="b" x="748" y="176">Longer notes are opened</text>
<text class="b" x="748" y="195">only when a step needs</text>
<text class="b" x="748" y="214">them.</text>
<line class="arrow" x1="232" y1="170.0" x2="258" y2="170.0" marker-end="url(#ah)"/>
<line class="arrow" x1="468" y1="170.0" x2="494" y2="170.0" marker-end="url(#ah)"/>
<line class="arrow" x1="704" y1="170.0" x2="730" y2="170.0" marker-end="url(#ah)"/>
<text class="cap" x="276" y="282">Always in context</text>
<text class="cap" x="512" y="282">Loaded when the task matches</text>
<text class="cap" x="748" y="282">Loaded when a step needs it</text>

</svg>
