<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 378" width="960" height="378" role="img" aria-labelledby="t d">
<title id="t">How each skill is tested</title>
<desc id="d">Four steps left to right: the task set is written by someone who has not read the skill; the same model gives three answers per side, with and without the skill; a different model judges each pair blind in both orders; only runs where the skill actually loaded are counted. The result is wins, losses and ties plus the rubric difference.</desc>
<style>
:root{--bg:#ffffff;--card:#f6f8fa;--ink:#1f2328;--muted:#59636e;--rule:#d1d9e0;--grid:#d8dee4;--accent:#1b7f79;--on-accent:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--muted:#9198a1;--rule:#3d444d;--grid:#30363d;--accent:#3fb8af;--on-accent:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.panel{fill:var(--bg);stroke:var(--rule);stroke-width:1}
.card{fill:var(--card);stroke:var(--rule);stroke-width:1}
.muted{fill:var(--muted)}
.title{font-size:22px;font-weight:700}
.h{font-size:15px;font-weight:700}
.b{font-size:13px}
.cap{font-size:12px;fill:var(--muted)}
.num{font-size:13px;font-weight:700;fill:var(--on-accent)}
.dot{fill:var(--accent)}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}
.head{fill:var(--muted)}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L7 4L1 7" class="arrow"/></marker></defs>
<rect class="panel" x="0.5" y="0.5" width="959" height="357" rx="10"/>
<text class="title" x="24" y="46">How each skill is tested: blind, with and without</text>
<rect class="card" x="24" y="84" width="204" height="172" rx="8"/>
<circle class="dot" cx="52" cy="112" r="12"/><text class="num" x="52" y="116.5" text-anchor="middle">1</text>
<text class="h" x="40" y="152">Tasks come first</text>
<text class="b" x="40" y="176">Ten realistic requests,</text>
<text class="b" x="40" y="195">written by someone who</text>
<text class="b" x="40" y="214">has not read the skill.</text>
<rect class="card" x="260" y="84" width="204" height="172" rx="8"/>
<circle class="dot" cx="288" cy="112" r="12"/><text class="num" x="288" y="116.5" text-anchor="middle">2</text>
<text class="h" x="276" y="152">Three answers a side</text>
<text class="b" x="276" y="182">Without</text><circle cx="372" cy="178" r="7" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="394" cy="178" r="7" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="416" cy="178" r="7" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
<text class="b" x="276" y="208">With skill</text><circle cx="372" cy="204" r="7" class="dot"/><circle cx="394" cy="204" r="7" class="dot"/><circle cx="416" cy="204" r="7" class="dot"/>
<text class="b" x="276" y="236">Same model, same prompt.</text>
<rect class="card" x="496" y="84" width="204" height="172" rx="8"/>
<circle class="dot" cx="524" cy="112" r="12"/><text class="num" x="524" y="116.5" text-anchor="middle">3</text>
<text class="h" x="512" y="152">A different judge</text>
<text class="b" x="512" y="176">A different model reads</text>
<text class="b" x="512" y="195">each pair blind, in both</text>
<text class="b" x="512" y="214">orders. A win must hold</text>
<text class="b" x="512" y="233">in both.</text>
<rect class="card" x="732" y="84" width="204" height="172" rx="8"/>
<circle class="dot" cx="760" cy="112" r="12"/><text class="num" x="760" y="116.5" text-anchor="middle">4</text>
<text class="h" x="748" y="152">Loaded runs only</text>
<text class="b" x="748" y="176">Runs where the model</text>
<text class="b" x="748" y="195">never loaded the skill</text>
<text class="b" x="748" y="214">are left out of the</text>
<text class="b" x="748" y="233">tally.</text>
<line class="arrow" x1="232" y1="170.0" x2="258" y2="170.0" marker-end="url(#ah)"/>
<line class="arrow" x1="468" y1="170.0" x2="494" y2="170.0" marker-end="url(#ah)"/>
<line class="arrow" x1="704" y1="170.0" x2="730" y2="170.0" marker-end="url(#ah)"/>
<rect class="card" x="24" y="280" width="912" height="74" rx="8"/>
<text class="h" x="40" y="304">Result per skill</text>
<text class="b" x="40" y="323">Wins, losses and ties over the loaded runs, plus the mean rubric difference.</text>
<text class="cap" x="40" y="341">Some earlier runs used one answer per side.</text>

</svg>
