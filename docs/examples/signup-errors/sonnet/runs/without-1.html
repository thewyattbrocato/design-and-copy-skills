<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account · Plateful</title>
<style>
  :root {
    --bg: #faf6ef;
    --card: #ffffff;
    --ink: #2a2622;
    --muted: #6b635a;
    --line: #d9d0c3;
    --brand: #2f7d4f;
    --brand-dark: #246340;
    --error: #b3261e;
    --error-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 440px; }
  .logo {
    display: flex; align-items: center; gap: 10px;
    justify-content: center; margin-bottom: 20px;
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: var(--brand-dark);
  }
  .logo svg { width: 34px; height: 34px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 4px 18px rgba(60, 40, 10, 0.06);
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
  .summary {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--error-bg);
    border: 1px solid #f0b8b3;
    border-left: 4px solid var(--error);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #5f1410;
  }
  .summary svg { flex: none; width: 18px; height: 18px; margin-top: 2px; color: var(--error); }
  .summary strong { display: block; }
  .summary a { color: inherit; font-weight: 600; }
  .field { margin-bottom: 18px; }
  label, .legend { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input[type="text"], input[type="email"], input[type="password"], select {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus {
    outline: 3px solid rgba(47, 125, 79, 0.3);
    border-color: var(--brand);
  }
  .invalid input, .invalid select {
    border-color: var(--error);
    border-width: 2px;
    padding: 10px 11px;
    background: #fffafa;
  }
  .error {
    display: flex; gap: 6px; align-items: center;
    margin: 6px 0 0;
    font-size: 13.5px;
    color: var(--error);
    font-weight: 500;
  }
  .error svg { flex: none; width: 15px; height: 15px; }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--brand); flex: none; }
  .check label { font-weight: 400; margin: 0; }
  .check a { color: var(--brand-dark); }
  .invalid .check input { outline: 2px solid var(--error); outline-offset: 1px; }
  button {
    width: 100%;
    font: inherit; font-size: 16px; font-weight: 600;
    padding: 13px;
    margin-top: 6px;
    background: var(--brand);
    color: #fff;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover { background: var(--brand-dark); }
  button:focus-visible { outline: 3px solid rgba(47, 125, 79, 0.4); outline-offset: 2px; }
  .alt { text-align: center; margin: 20px 0 0; font-size: 14px; color: var(--muted); }
  .alt a { color: var(--brand-dark); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" aria-label="Plateful">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="#2f7d4f"/>
      <circle cx="20" cy="20" r="11" fill="#faf6ef"/>
      <circle cx="20" cy="20" r="6" fill="#e9a23b"/>
    </svg>
    Plateful
  </div>

  <div class="card">
    <h1>Create your account</h1>
    <p class="sub">Plan the week's meals in minutes.</p>

    <div class="summary" role="alert">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5a8.5 8.5 0 100 17 8.5 8.5 0 000-17zM9 5.5h2v6H9v-6zm0 8h2v2H9v-2z"/></svg>
      <div>
        <strong>Please fix 2 things to continue</strong>
        <a href="#email">Email address</a> and <a href="#terms">Terms of Service</a>
      </div>
    </div>

    <form novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" value="Jamie Rivera" autocomplete="name">
      </div>

      <div class="field invalid">
        <label for="email">Email</label>
        <input id="email" type="email" value="jamie.rivera@gmail" autocomplete="email" aria-invalid="true" aria-describedby="email-err">
        <p class="error" id="email-err">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5a8.5 8.5 0 100 17 8.5 8.5 0 000-17zM9 5.5h2v6H9v-6zm0 8h2v2H9v-2z"/></svg>
          Enter a valid email address, like name@example.com.
        </p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" value="supersecret99" autocomplete="new-password" aria-describedby="pw-hint">
        <p class="hint" id="pw-hint">At least 8 characters.</p>
      </div>

      <div class="field">
        <label for="people">How many people do you cook for?</label>
        <select id="people">
          <option>1 person</option>
          <option selected>2 people</option>
          <option>3 people</option>
          <option>4 people</option>
          <option>5 people</option>
          <option>6 or more</option>
        </select>
      </div>

      <div class="field invalid">
        <div class="check">
          <input id="terms" type="checkbox" aria-invalid="true" aria-describedby="terms-err">
          <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
        </div>
        <p class="error" id="terms-err">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5a8.5 8.5 0 100 17 8.5 8.5 0 000-17zM9 5.5h2v6H9v-6zm0 8h2v2H9v-2z"/></svg>
          You need to accept the terms to create an account.
        </p>
      </div>

      <button type="submit">Create account</button>
    </form>

    <p class="alt">Already have an account? <a href="#">Log in</a></p>
  </div>
</div>
</body>
</html>
