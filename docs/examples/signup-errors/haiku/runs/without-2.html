<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateful - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #2d5f2e;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 11px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #2d5f2e;
        }

        input.error {
            border-color: #d32f2f;
            background-color: #ffebee;
        }

        .error-message {
            font-size: 12px;
            color: #d32f2f;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .error-icon {
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 24px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #2d5f2e;
        }

        .checkbox-label {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            margin: 0;
        }

        .checkbox-label a {
            color: #2d5f2e;
            text-decoration: none;
            font-weight: 500;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        .checkbox-group .error-message {
            display: flex;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2d5f2e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #244a25;
        }

        button:active {
            transform: scale(0.98);
        }

        .login-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #666;
        }

        .login-link a {
            color: #2d5f2e;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🥘 Plateful</div>
            <p class="subtitle">Smart meal planning for busy cooks</p>
        </div>

        <form>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Alex Johnson" value="Alex Johnson">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" value="alex@invalid" class="error">
                <div class="error-message">
                    <span class="error-icon">✕</span>
                    <span>Please enter a valid email address</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="pass123" class="error">
                <div class="error-message">
                    <span class="error-icon">✕</span>
                    <span>Password must be at least 8 characters</span>
                </div>
            </div>

            <div class="form-group">
                <label for="people">How many people do you cook for?</label>
                <input type="number" id="people" name="people" placeholder="4" value="2" min="1">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms" class="checkbox-label">
                    I agree to Plateful's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
                <div class="error-message" style="position: absolute; margin-top: 26px;">
                    <span class="error-icon">✕</span>
                    <span>You must agree to the terms</span>
                </div>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p class="login-link">
            Already have an account? <a href="#">Sign in</a>
        </p>
    </div>
</body>
</html>
