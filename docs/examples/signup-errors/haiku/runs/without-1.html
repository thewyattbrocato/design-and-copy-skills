<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateful - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select {
            width: 100%;
            padding: 11px 12px;
            font-size: 14px;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group.error input,
        .form-group.error select {
            border-color: #dc3545;
        }

        .error-message {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #dc3545;
            margin-top: 5px;
            gap: 5px;
        }

        .error-icon {
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .checkbox-label {
            font-size: 14px;
            color: #555;
            line-height: 1.4;
            cursor: pointer;
        }

        .checkbox-label a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        .checkbox-group.error .checkbox-label {
            color: #dc3545;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #5568d3;
        }

        .submit-btn:active {
            background: #4a58b8;
        }

        .login-link {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Plateful</div>
        <div class="subtitle">Start planning delicious meals</div>

        <form>
            <div class="form-group error">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Smith" value="">
                <div class="error-message">
                    <span class="error-icon">✕</span>
                    <span>Please enter your name</span>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" value="john@example">
                <div class="error-message" style="display: none;">
                    <span class="error-icon">✕</span>
                    <span>Please enter a valid email</span>
                </div>
            </div>

            <div class="form-group error">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" value="Pass12">
                <div class="error-message">
                    <span class="error-icon">✕</span>
                    <span>Password must be at least 8 characters</span>
                </div>
            </div>

            <div class="form-group">
                <label for="servings">How many people do you cook for?</label>
                <select id="servings">
                    <option value="">Select an option</option>
                    <option value="1">Just me</option>
                    <option value="2">2 people</option>
                    <option value="3">3 people</option>
                    <option value="4">4 people</option>
                    <option value="5">5+ people</option>
                </select>
            </div>

            <div class="checkbox-group error">
                <input type="checkbox" id="terms">
                <label for="terms" class="checkbox-label">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
                <div class="error-message" style="position: absolute; margin-top: 28px; width: calc(100% - 80px);">
                    <span class="error-icon">✕</span>
                    <span>You must agree to the terms</span>
                </div>
            </div>

            <div style="height: 24px;"></div>

            <button type="submit" class="submit-btn">Create Account</button>

            <div class="login-link">
                Already have an account? <a href="#">Log in</a>
            </div>
        </form>
    </div>
</body>
</html>
