<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateful - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group.error input {
            border-color: #e74c3c;
            background-color: #fde8e8;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .form-group.error .error-message {
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-label {
            font-size: 13px;
            color: #555;
            margin: 0;
            cursor: pointer;
            line-height: 1.4;
        }

        .checkbox-label a {
            color: #667eea;
            text-decoration: none;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        .checkbox-group.error input[type="checkbox"] {
            accent-color: #e74c3c;
        }

        .checkbox-group .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-left: 26px;
            margin-top: 4px;
            display: none;
        }

        .checkbox-group.error .error-message {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #5568d3;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Plateful</div>
            <p class="subtitle">Plan meals, feed your table</p>
        </div>

        <form id="signupForm" novalidate>
            <div class="form-group error">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" value="" placeholder="Jane Doe">
                <div class="error-message">Full name is required</div>
            </div>

            <div class="form-group error">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="notanemail" placeholder="jane@example.com">
                <div class="error-message">Please enter a valid email address</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="pass" placeholder="At least 8 characters">
                <div class="error-message">Password must be at least 8 characters</div>
            </div>

            <div class="form-group">
                <label for="people">How many people do you cook for?</label>
                <input type="number" id="people" name="people" value="" placeholder="e.g., 2">
                <div class="error-message">Please enter the number of people</div>
            </div>

            <div class="checkbox-group error">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms" class="checkbox-label">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
                <div class="error-message">You must agree to the terms to continue</div>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>

            <p class="login-link">Already have an account? <a href="#">Log in</a></p>
        </form>
    </div>
</body>
</html>
