<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernwick - Automatic Invoice Reminders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #f9fafb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        h1 {
            font-size: 56px;
            line-height: 1.2;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.6;
            color: #475569;
            max-width: 480px;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-top: 8px;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background: #2563eb;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: none;
            color: #3b82f6;
            padding: 14px 20px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-secondary:hover {
            color: #2563eb;
        }

        .visual {
            position: relative;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            h1 {
                font-size: 36px;
            }

            .visual {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="hero-content">
                <h1>Get Paid On Time</h1>
                <p class="subtitle">Fernwick sends polite, automatic reminders when invoices go unpaid. No more awkward follow-ups—just reliable payments.</p>
                <div class="cta-group">
                    <button class="btn-primary">Start Free Trial</button>
                    <button class="btn-secondary">Watch Demo</button>
                </div>
            </div>

            <div class="visual">
                <svg viewBox="0 0 400 400" style="width: 100%; height: 100%; max-width: 400px;">
                    <circle cx="200" cy="200" r="180" fill="#f0f9ff" stroke="#dbeafe" stroke-width="2"/>
                    
                    <!-- Invoice document -->
                    <rect x="80" y="100" width="140" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
                    <rect x="100" y="120" width="100" height="8" fill="#e2e8f0" rx="2"/>
                    <rect x="100" y="135" width="80" height="6" fill="#e2e8f0" rx="2"/>
                    <rect x="100" y="150" width="100" height="6" fill="#e2e8f0" rx="2"/>
                    <rect x="100" y="165" width="60" height="6" fill="#e2e8f0" rx="2"/>
                    <line x1="100" y1="185" x2="200" y2="185" stroke="#cbd5e1" stroke-width="1"/>
                    <text x="150" y="235" text-anchor="middle" font-size="28" font-weight="bold" fill="#3b82f6">$1,200</text>
                    
                    <!-- Arrow -->
                    <line x1="230" y1="200" x2="275" y2="200" stroke="#94a3b8" stroke-width="3"/>
                    <polygon points="275,200 265,195 268,200 265,205" fill="#94a3b8"/>
                    
                    <!-- Reminder bell -->
                    <circle cx="320" cy="140" r="45" fill="#fef08a" stroke="#fcd34d" stroke-width="2"/>
                    <path d="M 315 170 L 325 170 M 317 178 L 323 178" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>
                    <ellipse cx="320" cy="145" rx="12" ry="16" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
                    <circle cx="320" cy="128" r="4" fill="#ca8a04"/>
                    <path d="M 310 160 Q 308 165 313 170 Q 327 170 332 160" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>
                    
                    <!-- Checkmark circle -->
                    <circle cx="320" cy="270" r="35" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
                    <path d="M 305 270 L 315 280 L 335 255" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
