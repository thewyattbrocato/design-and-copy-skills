<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernwick - Automated Invoice Reminders for Freelancers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #fafbfc 0%, #f5f7fa 100%);
            color: #1a202c;
            line-height: 1.6;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        .hero-container {
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 24px;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 20px;
            font-weight: 400;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 40px;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            margin-bottom: 80px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-block;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid #3b82f6;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background-color: #2563eb;
            border-color: #2563eb;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        .link-secondary {
            display: inline-block;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 500;
            color: #475569;
            text-decoration: none;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            transition: all 0.2s ease;
            background-color: transparent;
        }

        .link-secondary:hover {
            color: #1a202c;
            border-color: #cbd5e1;
        }

        .product-visual {
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .invoice-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .invoice-title {
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .invoice-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: #dcfce7;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #16a34a;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #16a34a;
            border-radius: 50%;
        }

        .invoice-items {
            margin-bottom: 24px;
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
            padding: 20px 0;
        }

        .invoice-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: #475569;
        }

        .invoice-row:last-child {
            margin-bottom: 0;
        }

        .invoice-row span:first-child {
            font-weight: 500;
        }

        .invoice-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .invoice-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .invoice-amount {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
        }

        .reminder-badge {
            position: absolute;
            margin-top: -40px;
            margin-left: -20px;
            background-color: #fbbf24;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #78350f;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
        }

        .reminder-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        .visual-container {
            position: relative;
            display: inline-block;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 40px;
            }

            .subtitle {
                font-size: 18px;
            }

            .btn-primary,
            .link-secondary {
                width: 100%;
            }

            .cta-group {
                flex-direction: column;
                margin-bottom: 60px;
            }

            .invoice-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-container">
            <h1>Stop chasing unpaid invoices</h1>
            <p class="subtitle">Fernwick sends polite, automatic reminders when invoices go unpaid. Get paid faster without the awkward follow-ups.</p>

            <div class="cta-group">
                <a href="#" class="btn-primary">Start Free Trial</a>
                <a href="#" class="link-secondary">Watch Demo</a>
            </div>

            <div class="product-visual">
                <div class="visual-container">
                    <div class="reminder-badge">
                        <svg class="reminder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        Reminder sent
                    </div>
                    <div class="invoice-card">
                        <div class="invoice-header">
                            <span class="invoice-title">Invoice #2847</span>
                            <div class="invoice-status">
                                <span class="status-dot"></span>
                                Paid
                            </div>
                        </div>

                        <div class="invoice-items">
                            <div class="invoice-row">
                                <span>Design work – 40 hrs</span>
                                <span>$2,000</span>
                            </div>
                            <div class="invoice-row">
                                <span>Revisions – 8 hrs</span>
                                <span>$400</span>
                            </div>
                        </div>

                        <div class="invoice-footer">
                            <span class="invoice-label">Total due</span>
                            <div class="invoice-amount">$2,400</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
