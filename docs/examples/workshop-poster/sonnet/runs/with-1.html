<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro to Bread Baking – Free Community Workshop</title>
<style>
  html, body { margin: 0; padding: 0; background: #e9dcc6; }
  .card {
    position: relative;
    width: 1080px; height: 1080px;
    box-sizing: border-box;
    padding: 80px;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: #fbf1de;
    color: #3b2a1e;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .blob1 { position: absolute; right: -140px; top: -140px; width: 480px; height: 480px; border-radius: 50%; background: #f6dcae; }
  .blob2 { position: absolute; left: -120px; bottom: 120px; width: 300px; height: 300px; border-radius: 50%; background: #f8e6c4; }
  .content { position: relative; display: flex; flex-direction: column; height: 100%; }
  .pill {
    align-self: flex-start;
    background: #3f7a4f; color: #fff;
    font-weight: 700; font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 14px 30px; border-radius: 999px;
  }
  h1 {
    margin: 40px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 116px; line-height: 1.04; font-weight: 700;
    letter-spacing: -0.01em;
    color: #3b2a1e;
  }
  h1 span { color: #b8582a; }
  .loaf { position: absolute; right: -10px; top: 200px; width: 380px; height: 260px; }
  .spacer { flex: 1; }
  .details {
    background: #fff; border-radius: 32px;
    padding: 30px 40px;
    box-shadow: 0 8px 0 #ecd9b5;
  }
  .row { display: flex; align-items: center; gap: 22px; padding: 12px 0; font-size: 38px; line-height: 1.2; }
  .row + .row { border-top: 2px dashed #ecd9b5; }
  .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #b8582a; }
  .row b { font-weight: 700; }
  .signup {
    margin-top: 28px;
    background: #b8582a; color: #fff;
    border-radius: 32px;
    padding: 26px 40px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 34px; font-weight: 600;
  }
  .signup .url { font-size: 44px; font-weight: 800; }
</style>
</head>
<body>
<div class="card">
  <div class="blob1"></div>
  <div class="blob2"></div>

  <svg class="loaf" viewBox="0 0 380 260" role="img" aria-label="A loaf of bread">
    <ellipse cx="190" cy="236" rx="150" ry="14" fill="#e3c99a"/>
    <path d="M30 170 C30 80 110 30 190 30 C270 30 350 80 350 170 C350 215 310 232 190 232 C70 232 30 215 30 170 Z" fill="#d9964b"/>
    <path d="M50 160 C52 95 115 50 190 50 C265 50 328 95 330 160 C300 130 80 130 50 160 Z" fill="#e8ae67" opacity="0.8"/>
    <g fill="none" stroke="#f7dba9" stroke-width="14" stroke-linecap="round">
      <path d="M115 95 C135 120 145 150 150 180"/>
      <path d="M180 82 C198 110 205 145 207 182"/>
      <path d="M248 95 C264 122 270 150 268 180"/>
    </g>
  </svg>

  <div class="content">
    <div class="pill">Free community workshop</div>
    <h1>Intro to<br><span>Bread<br>Baking</span></h1>

    <div class="spacer"></div>

    <div class="details">
      <div class="row"><span class="dot"></span><span><b>Saturday, March 14</b> at 10:00 am</span></div>
      <div class="row"><span class="dot"></span><span><b>Eastmoor Library</b>, Community Room B</span></div>
      <div class="row"><span class="dot"></span><span>Free! Please bring an <b>apron</b></span></div>
    </div>

    <div class="signup">
      <span>Sign up:</span>
      <span class="url">eastmoor.example/bread</span>
    </div>
  </div>
</div>
</body>
</html>
