<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro to Bread Baking – Free Community Workshop</title>
<meta name="viewport" content="width=1080">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: #f6e9d2; }
  body {
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #3b2414;
  }
  .card {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #f6e9d2;
    padding: 84px 88px;
    display: flex;
    flex-direction: column;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
  }
  .blob.a { width: 620px; height: 620px; right: -220px; top: -220px; background: #ecc98f; }
  .blob.b { width: 380px; height: 380px; left: -150px; bottom: -150px; background: #e9b97a; }
  .content { position: relative; display: flex; flex-direction: column; height: 100%; }

  .badge {
    align-self: flex-start;
    background: #3b2414;
    color: #fbefd9;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 14px 30px;
    border-radius: 999px;
  }
  .kicker {
    margin-top: 56px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 44px;
    color: #8a4a1f;
  }
  h1 {
    margin-top: 8px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 164px;
    line-height: 0.95;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #3b2414;
  }
  h1 span { color: #a8521c; }

  .details {
    margin-top: auto;
    background: #fffaf0;
    border: 4px solid #3b2414;
    border-radius: 36px;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .row { display: flex; align-items: baseline; gap: 24px; }
  .label {
    flex: 0 0 150px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a4a1f;
  }
  .value { font-size: 42px; font-weight: 700; line-height: 1.15; }
  .value small { display: block; font-size: 30px; font-weight: 500; color: #5a3b27; margin-top: 4px; }

  .footer {
    margin-top: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }
  .bring { font-size: 32px; line-height: 1.25; font-weight: 500; max-width: 470px; }
  .bring b { color: #a8521c; }
  .cta {
    background: #a8521c;
    color: #fffaf0;
    border-radius: 28px;
    padding: 20px 34px;
    text-align: center;
  }
  .cta .s { font-size: 24px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .cta .u { font-size: 40px; font-weight: 800; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="content">
      <div class="badge">Free community workshop</div>
      <div class="kicker">Come bake with your neighbors!</div>
      <h1>Intro to <span>Bread Baking</span></h1>

      <div class="details">
        <div class="row">
          <div class="label">When</div>
          <div class="value">Saturday, March 14<small>10:00 am</small></div>
        </div>
        <div class="row">
          <div class="label">Where</div>
          <div class="value">Eastmoor Library<small>Community Room B</small></div>
        </div>
      </div>

      <div class="footer">
        <div class="bring"><b>Free to join.</b> Just bring an apron &mdash; we'll bring the dough!</div>
        <div class="cta">
          <div class="s">Sign up</div>
          <div class="u">eastmoor.example/bread</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
