<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro to Bread Baking – Free Community Workshop</title>
<meta name="viewport" content="width=1080">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: #f3e3c3; }
  body { font-family: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #4a2c17; }
  .card {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: #fbefd5;
    padding: 70px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .blob1 { position: absolute; right: -180px; top: -180px; width: 520px; height: 520px; border-radius: 50%; background: #f2c879; }
  .blob2 { position: absolute; left: -140px; bottom: -160px; width: 400px; height: 400px; border-radius: 50%; background: #e9a86a; opacity: .55; }
  .content { position: relative; z-index: 1; }
  .tag {
    display: inline-block; background: #4a2c17; color: #fbefd5;
    font-size: 30px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
    padding: 14px 30px; border-radius: 999px;
  }
  .loaf { position: absolute; right: 70px; top: 70px; font-size: 150px; line-height: 1; z-index: 1; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 138px; line-height: .96; font-weight: 700; margin-top: 50px; color: #3b2010;
  }
  h1 span { color: #b4521f; font-style: italic; }
  .sub { font-size: 38px; margin-top: 28px; line-height: 1.3; max-width: 760px; }
  .details {
    background: #fffaf0; border: 4px solid #4a2c17; border-radius: 32px;
    padding: 34px 44px; display: grid; gap: 14px;
    box-shadow: 10px 10px 0 #b4521f;
  }
  .row { font-size: 40px; font-weight: 700; display: flex; gap: 18px; align-items: baseline; }
  .row small { font-size: 30px; font-weight: 500; }
  .label { font-size: 24px; letter-spacing: 2px; text-transform: uppercase; color: #b4521f; width: 120px; flex: none; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; gap: 24px; }
  .bring { font-size: 30px; line-height: 1.3; max-width: 430px; }
  .cta { background: #b4521f; color: #fff; font-size: 34px; font-weight: 700; padding: 22px 34px; border-radius: 22px; text-align: center; }
  .cta small { display: block; font-size: 22px; font-weight: 500; opacity: .9; letter-spacing: 1px; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="blob1"></div><div class="blob2"></div>
  <div class="loaf" aria-hidden="true">🍞</div>

  <div class="content">
    <div class="tag">Free Community Workshop</div>
    <h1>Intro to<br><span>Bread Baking</span></h1>
    <p class="sub">Come get your hands floury! Everyone's welcome, no experience needed.</p>
  </div>

  <div class="content">
    <div class="details">
      <div class="row"><span class="label">When</span><span>Saturday, March 14 · 10:00 am</span></div>
      <div class="row"><span class="label">Where</span><span>Eastmoor Library<br><small>Community Room B</small></span></div>
      <div class="row"><span class="label">Cost</span><span>Free!</span></div>
    </div>
    <div class="foot">
      <p class="bring"><strong>Please bring an apron.</strong><br>We'll bring the dough.</p>
      <div class="cta"><small>Sign up at</small>eastmoor.example/bread</div>
    </div>
  </div>
</div>
</body>
</html>
