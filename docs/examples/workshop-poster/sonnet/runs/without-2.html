<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro to Bread Baking – Free Community Workshop</title>
<meta name="viewport" content="width=1080">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: #f6e7cc; }
  body { font-family: "Avenir Next", Avenir, "Trebuchet MS", "Segoe UI", Helvetica, Arial, sans-serif; color: #4a2c17; }
  .card {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: #fbefd6;
    background-image: radial-gradient(circle at 85% 12%, #ffd98a 0, #ffd98a 14%, transparent 14.2%),
                      radial-gradient(circle at 8% 95%, #f1cf9a 0, #f1cf9a 20%, transparent 20.2%);
    padding: 72px 80px;
    display: flex; flex-direction: column;
  }
  .badge {
    align-self: flex-start;
    background: #c8501f; color: #fff7e8;
    font-size: 34px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
    padding: 14px 32px; border-radius: 999px;
  }
  .loaf { position: absolute; right: 70px; top: 70px; width: 200px; height: 140px; }
  h1 {
    margin-top: 44px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 148px; line-height: 0.95; font-weight: 700; color: #3d2111;
    letter-spacing: -2px;
  }
  h1 span { color: #c8501f; font-style: italic; }
  .tag { margin-top: 28px; font-size: 38px; line-height: 1.3; color: #6b4428; max-width: 800px; }
  .info {
    margin-top: auto;
    background: #fffaf0; border: 4px solid #4a2c17; border-radius: 28px;
    padding: 34px 40px;
    box-shadow: 10px 10px 0 #e0a64f;
  }
  .row { display: flex; align-items: baseline; gap: 20px; font-size: 40px; line-height: 1.25; }
  .row + .row { margin-top: 12px; }
  .label { flex: none; width: 150px; font-size: 24px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #c8501f; }
  .row b { font-weight: 800; }
  .foot { margin-top: 36px; display: flex; justify-content: space-between; align-items: center; }
  .url { font-size: 40px; font-weight: 800; color: #3d2111; }
  .url small { display: block; font-size: 26px; font-weight: 600; color: #6b4428; margin-bottom: 4px; }
  .free { background: #3f7d4e; color: #fff; font-size: 40px; font-weight: 800; padding: 16px 34px; border-radius: 20px; transform: rotate(-3deg); }
</style>
</head>
<body>
<div class="card">
  <div class="badge">Free Community Workshop</div>
  <svg class="loaf" viewBox="0 0 200 140" aria-hidden="true">
    <ellipse cx="100" cy="125" rx="80" ry="10" fill="#e0a64f" opacity=".5"/>
    <path d="M15 95 C10 40 60 10 100 10 C140 10 190 40 185 95 C185 115 170 120 100 120 C30 120 15 115 15 95Z" fill="#d68a3c" stroke="#4a2c17" stroke-width="5"/>
    <path d="M60 35 L80 75 M95 25 L115 70 M130 35 L148 75" stroke="#f6d9a0" stroke-width="9" stroke-linecap="round" fill="none"/>
  </svg>
  <h1>Intro to<br><span>Bread Baking</span></h1>
  <p class="tag">Come get your hands floury! No experience needed, just bring your curiosity.</p>

  <div class="info">
    <div class="row"><span class="label">When</span><span><b>Saturday, March 14</b> · 10:00 am</span></div>
    <div class="row"><span class="label">Where</span><span><b>Eastmoor Library</b>, Community Room B</span></div>
    <div class="row"><span class="label">Bring</span><span>An apron</span></div>
  </div>

  <div class="foot">
    <div class="url"><small>Sign up at</small>eastmoor.example/bread</div>
    <div class="free">It’s free!</div>
  </div>
</div>
</body>
</html>
