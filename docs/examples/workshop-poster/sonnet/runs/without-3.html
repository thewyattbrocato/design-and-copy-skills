<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro to Bread Baking – Free Community Workshop</title>
<meta name="viewport" content="width=1080">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: #f3e3c3; }
  body {
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #4a2c17;
  }
  .card {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #fbf1dc;
    padding: 72px 84px;
    display: flex;
    flex-direction: column;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
  }
  .b1 { width: 560px; height: 560px; background: #f4d49a; top: -240px; right: -180px; }
  .b2 { width: 380px; height: 380px; background: #e9b872; bottom: -170px; left: -130px; }
  .b3 { width: 200px; height: 200px; background: #f7dfae; bottom: 120px; right: -70px; }
  .content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
  .badge {
    align-self: flex-start;
    background: #4a2c17;
    color: #fbf1dc;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 30px;
    border-radius: 999px;
  }
  .loaf { font-size: 120px; line-height: 1; margin-top: 36px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 124px;
    line-height: 1;
    font-weight: 700;
    margin-top: 16px;
    color: #4a2c17;
  }
  h1 span { color: #b4561f; font-style: italic; }
  .sub {
    font-size: 36px;
    margin-top: 24px;
    color: #6b4428;
  }
  .details {
    margin-top: auto;
    background: #ffffff;
    border: 4px solid #4a2c17;
    border-radius: 28px;
    padding: 34px 40px;
    box-shadow: 10px 10px 0 #b4561f;
  }
  .row { display: flex; align-items: baseline; gap: 20px; font-size: 38px; line-height: 1.3; }
  .row + .row { margin-top: 12px; }
  .label {
    flex: 0 0 150px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b4561f;
  }
  .row strong { font-weight: 700; }
  .footer {
    margin-top: 40px;
    font-size: 34px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .url {
    background: #b4561f;
    color: #fff;
    padding: 14px 30px;
    border-radius: 999px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="card">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="content">
    <div class="badge">Free community workshop</div>
    <div class="loaf" aria-hidden="true">🍞</div>
    <h1>Intro to <span>Bread Baking</span></h1>
    <p class="sub">Come learn, knead, and bake with your neighbors!</p>

    <div class="details">
      <div class="row"><span class="label">When</span><span><strong>Saturday, March 14</strong> · 10:00 am</span></div>
      <div class="row"><span class="label">Where</span><span><strong>Eastmoor Library</strong>, Community Room B</span></div>
      <div class="row"><span class="label">Bring</span><span>An apron. We’ll supply the rest!</span></div>
    </div>

    <div class="footer">
      <span>It’s free. Sign up:</span>
      <span class="url">eastmoor.example/bread</span>
    </div>
  </div>
</div>
</body>
</html>
