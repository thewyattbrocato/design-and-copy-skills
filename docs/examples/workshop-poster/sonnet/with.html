<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro to Bread Baking – Free Community Workshop</title>
<meta name="viewport" content="width=1080">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: #3b2415; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .card {
    position: relative;
    width: 1080px; height: 1080px;
    padding: 76px 80px 80px;
    background: #fbf1df;
    color: #3b2415;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .glow {
    position: absolute; right: -220px; top: -220px;
    width: 720px; height: 720px; border-radius: 50%;
    background: #f6dcae;
  }
  .glow2 {
    position: absolute; left: -160px; bottom: 120px;
    width: 420px; height: 420px; border-radius: 50%;
    background: #f7e5c4;
  }
  .card > * { position: relative; }
  .pill {
    align-self: flex-start;
    background: #3b2415; color: #fbf1df;
    font-size: 30px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 14px 30px; border-radius: 999px;
  }
  h1 {
    margin-top: 40px;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 118px; line-height: 1.02; letter-spacing: -0.01em;
    color: #3b2415;
  }
  h1 em { font-style: italic; color: #b5541c; }
  .tag {
    margin-top: 26px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 36px; line-height: 1.35; color: #5a3a24;
  }
  .badge {
    position: absolute; right: 80px; top: 168px;
    width: 230px; height: 230px; border-radius: 50%;
    background: #b5541c; color: #fff8ec;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: rotate(8deg);
    border: 6px dashed #fbf1df; outline: 6px solid #b5541c;
    text-align: center;
  }
  .badge b { font-family: Georgia, serif; font-size: 78px; line-height: 1; }
  .badge span { font-size: 26px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 6px; }
  .details { margin-top: auto; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: center; gap: 24px; font-size: 42px; font-weight: 600; line-height: 1.2; }
  .dot {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: #d9822b;
  }
  .row small { font-weight: 500; color: #5a3a24; }
  .cta {
    margin-top: 40px;
    background: #3b2415; color: #fbf1df;
    border-radius: 28px;
    padding: 28px 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .cta .l { font-size: 30px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #f6dcae; }
  .cta .u { font-size: 44px; font-weight: 800; color: #fff8ec; }
</style>
</head>
<body>
  <main class="card">
    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="pill">Free community workshop</div>

    <h1>Intro to<br>Bread<br><em>Baking</em></h1>

    <div class="badge" aria-label="Free"><b>Free!</b><span>for everyone</span></div>

    <p class="tag">Come get your hands floury. All are welcome!</p>

    <div class="details">
      <div class="row"><span class="dot"></span><span>Saturday, March 14 at 10:00 am</span></div>
      <div class="row"><span class="dot"></span><span>Eastmoor Library, Community Room B</span></div>
      <div class="row"><span class="dot"></span><span>Please bring an apron</span></div>
    </div>

    <div class="cta">
      <span class="l">Sign up</span>
      <span class="u">eastmoor.example/bread</span>
    </div>
  </main>
</body>
</html>
