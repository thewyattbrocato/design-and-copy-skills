<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro to Bread Baking Workshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1080px;
            height: 1080px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
        }
        
        .card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #F5E6D3 0%, #E8D4B8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            text-align: center;
            gap: 30px;
        }
        
        .emoji {
            font-size: 80px;
            line-height: 1;
        }
        
        h1 {
            font-size: 56px;
            font-weight: 700;
            color: #6B4423;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        
        .event-details {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        
        .detail-row {
            font-size: 24px;
            color: #5C3D2E;
            font-weight: 500;
        }
        
        .detail-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8B6F47;
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }
        
        .highlight {
            font-size: 28px;
            color: #8B4513;
            font-weight: 700;
        }
        
        .info-box {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }
        
        .bring {
            font-size: 18px;
            color: #6B4423;
            font-weight: 600;
        }
        
        .cta-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        
        .cta-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8B6F47;
            font-weight: 600;
        }
        
        .signup-link {
            font-size: 26px;
            font-weight: 700;
            color: #D4755F;
            letter-spacing: 0.5px;
            text-decoration: none;
        }
        
        .free-badge {
            display: inline-block;
            background: #D4755F;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🥖</div>
        
        <h1>Intro to Bread Baking</h1>
        
        <div class="event-details">
            <div>
                <span class="detail-label">Date & Time</span>
                <div class="detail-row">Saturday, March 14</div>
                <div class="highlight">10:00 AM</div>
            </div>
            
            <div>
                <span class="detail-label">Location</span>
                <div class="detail-row">Eastmoor Library<br>Community Room B</div>
            </div>
        </div>
        
        <div class="info-box">
            <div class="bring">👨‍🍳 Bring Your Apron!</div>
        </div>
        
        <div class="free-badge">FREE</div>
        
        <div class="cta-section">
            <div class="cta-label">Sign Up Today</div>
            <div class="signup-link">eastmoor.example/bread</div>
        </div>
    </div>
</body>
</html>
