<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro to Bread Baking Workshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1080px;
            height: 1080px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d4bf 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .card {
            width: 1000px;
            height: 1000px;
            background: linear-gradient(to bottom, #fdf9f3 0%, #f9ede1 100%);
            border-radius: 24px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            border: 3px solid #d4a574;
        }
        
        .header {
            text-align: center;
        }
        
        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }
        
        .title {
            font-size: 56px;
            font-weight: 700;
            color: #5c3d2e;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-size: 24px;
            color: #8b5a3c;
            font-weight: 500;
        }
        
        .details {
            background: rgba(212, 165, 116, 0.12);
            border-left: 6px solid #d4a574;
            padding: 30px 28px;
            border-radius: 12px;
            margin: 20px 0;
        }
        
        .detail-item {
            font-size: 20px;
            color: #3d2817;
            margin-bottom: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        
        .detail-item:last-child {
            margin-bottom: 0;
        }
        
        .detail-label {
            display: inline-block;
            font-weight: 600;
            color: #5c3d2e;
            min-width: 100px;
        }
        
        .detail-value {
            color: #2d1810;
        }
        
        .highlights {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        
        .highlight-badge {
            background: #d4a574;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
        }
        
        .cta-section {
            text-align: center;
        }
        
        .cta-text {
            font-size: 18px;
            color: #5c3d2e;
            margin-bottom: 16px;
            font-weight: 500;
        }
        
        .cta-link {
            display: inline-block;
            background: linear-gradient(135deg, #c9905b 0%, #a87340 100%);
            color: white;
            padding: 16px 40px;
            border-radius: 28px;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(140, 89, 48, 0.3);
            letter-spacing: 0.5px;
        }
        
        .cta-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(140, 89, 48, 0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="emoji">🍞</span>
            <h1 class="title">Intro to Bread Baking</h1>
            <p class="subtitle">Learn the Art of Fresh Bread</p>
        </div>
        
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">📅 When:</span>
                <span class="detail-value">Saturday, March 14 at 10:00 AM</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">📍 Where:</span>
                <span class="detail-value">Eastmoor Library, Community Room B</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">💰 Cost:</span>
                <span class="detail-value">FREE</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">🧥 Bring:</span>
                <span class="detail-value">An apron</span>
            </div>
        </div>
        
        <div class="highlights">
            <span class="highlight-badge">✨ FREE</span>
            <span class="highlight-badge">👨‍🍳 Hands-On</span>
            <span class="highlight-badge">🎉 Fun</span>
        </div>
        
        <div class="cta-section">
            <p class="cta-text">Ready to knead and rise to the occasion?</p>
            <a href="https://eastmoor.example/bread" class="cta-link">Sign Up Now</a>
        </div>
    </div>
</body>
</html>
