<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro to Bread Baking Workshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1080px;
            height: 1080px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(135deg, #faf3eb 0%, #f0e0ce 100%);
        }
        
        .card {
            width: 1080px;
            height: 1080px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, #fdfaf5 0%, #f5ead8 100%);
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #d4a574 0%, #c9956d 50%, #d4a574 100%);
        }
        
        .header {
            text-align: center;
        }
        
        .icon {
            font-size: 72px;
            margin-bottom: 16px;
        }
        
        h1 {
            font-size: 56px;
            font-weight: 700;
            color: #5d3a1a;
            margin-bottom: 12px;
            line-height: 1.2;
        }
        
        .tagline {
            font-size: 22px;
            color: #8b6f47;
            font-weight: 400;
        }
        
        .content {
            text-align: center;
        }
        
        .detail-box {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            border: 2px solid #e8d4b8;
            backdrop-filter: blur(10px);
        }
        
        .detail-label {
            font-size: 13px;
            font-weight: 600;
            color: #8b6f47;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }
        
        .detail-value {
            font-size: 32px;
            font-weight: 700;
            color: #5d3a1a;
            margin-bottom: 4px;
        }
        
        .detail-secondary {
            font-size: 18px;
            color: #7a5c39;
        }
        
        .highlights {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 32px 0;
            flex-wrap: wrap;
        }
        
        .highlight {
            background: rgba(212, 165, 116, 0.12);
            border-radius: 12px;
            padding: 14px 22px;
            font-size: 16px;
            color: #5d3a1a;
            font-weight: 600;
            border: 1px solid rgba(212, 165, 116, 0.3);
        }
        
        .footer {
            text-align: center;
        }
        
        .cta {
            display: inline-block;
            background: linear-gradient(135deg, #d4a574 0%, #c9956d 100%);
            color: white;
            padding: 20px 56px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 24px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
        }
        
        .signup-text {
            font-size: 14px;
            color: #8b6f47;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .signup-url {
            font-size: 20px;
            font-weight: 600;
            color: #d4a574;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="icon">🥖</div>
            <h1>Intro to Bread Baking</h1>
            <p class="tagline">A Free Community Workshop</p>
        </div>
        
        <div class="content">
            <div class="detail-box">
                <div class="detail-label">Date & Time</div>
                <div class="detail-value">Saturday, March 14</div>
                <div class="detail-secondary">10:00 AM</div>
            </div>
            
            <div class="detail-box">
                <div class="detail-label">Location</div>
                <div class="detail-value">Eastmoor Library</div>
                <div class="detail-secondary">Community Room B</div>
            </div>
            
            <div class="highlights">
                <div class="highlight">✓ Free</div>
                <div class="highlight">👕 Bring an Apron</div>
            </div>
        </div>
        
        <div class="footer">
            <a href="https://eastmoor.example/bread" class="cta">Sign Up Now</a>
            <div class="signup-text">Learn more:</div>
            <div class="signup-url">eastmoor.example/bread</div>
        </div>
    </div>
</body>
</html>
