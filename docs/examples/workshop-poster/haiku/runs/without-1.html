<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro to Bread Baking Workshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #D4A574 0%, #E8C5A0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        
        .card {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 50px;
            text-align: center;
            color: #3D2817;
        }
        
        .header {
            flex: 0 1 auto;
        }
        
        .emoji {
            font-size: 120px;
            margin-bottom: 20px;
            display: block;
        }
        
        .title {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            color: #3D2817;
        }
        
        .subtitle {
            font-size: 28px;
            color: #5C4033;
            font-weight: 500;
            margin-bottom: 30px;
        }
        
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 25px;
        }
        
        .detail-block {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .detail-label {
            font-size: 16px;
            font-weight: 600;
            color: #8B6F47;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .detail-value {
            font-size: 28px;
            font-weight: 600;
            color: #3D2817;
        }
        
        .detail-subtext {
            font-size: 18px;
            color: #5C4033;
            margin-top: 6px;
        }
        
        .free-badge {
            background: #F4E4C1;
            border: 3px solid #8B6F47;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 24px;
            font-weight: 700;
            color: #3D2817;
            display: inline-block;
            margin: 0 auto;
        }
        
        .bring-item {
            font-size: 20px;
            color: #5C4033;
            font-style: italic;
        }
        
        .footer {
            flex: 0 1 auto;
        }
        
        .signup-url {
            background: #8B6F47;
            color: #FFF8F0;
            border-radius: 16px;
            padding: 18px 30px;
            font-size: 26px;
            font-weight: 700;
            margin-top: 20px;
            word-break: break-word;
            letter-spacing: 0.5px;
        }
        
        .call-to-action {
            font-size: 18px;
            color: #5C4033;
            margin-bottom: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="emoji">🍞</span>
            <div class="title">Intro to Bread Baking</div>
            <div class="subtitle">Free Community Workshop</div>
        </div>
        
        <div class="content">
            <div class="detail-block">
                <div class="detail-label">📅 Date & Time</div>
                <div class="detail-value">Saturday, March 14</div>
                <div class="detail-subtext">10:00 AM</div>
            </div>
            
            <div class="detail-block">
                <div class="detail-label">📍 Location</div>
                <div class="detail-value">Eastmoor Library</div>
                <div class="detail-subtext">Community Room B</div>
            </div>
            
            <div class="free-badge">✨ FREE ✨</div>
            
            <div class="detail-block">
                <div class="detail-label">👕 Please Bring</div>
                <div class="bring-item">An Apron</div>
            </div>
        </div>
        
        <div class="footer">
            <div class="call-to-action">Sign Up Now!</div>
            <div class="signup-url">eastmoor.example/bread</div>
        </div>
    </div>
</body>
</html>
