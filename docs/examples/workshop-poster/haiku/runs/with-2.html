<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro to Bread Baking Workshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
            background: #fef9f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .card {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #fef9f3 0%, #f5e6d3 100%);
            border-radius: 40px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(210, 180, 140, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .header {
            position: relative;
            z-index: 1;
        }
        
        .tag {
            display: inline-block;
            background: #d2b48c;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .title {
            font-size: 72px;
            font-weight: 800;
            color: #3d2817;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 24px;
            color: #6b5344;
            font-weight: 500;
        }
        
        .middle {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .info-block {
            background: rgba(255, 255, 255, 0.7);
            padding: 24px;
            border-radius: 20px;
            border-left: 6px solid #c9945a;
        }
        
        .info-label {
            font-size: 13px;
            text-transform: uppercase;
            color: #8b7355;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .info-content {
            font-size: 28px;
            color: #3d2817;
            font-weight: 600;
            line-height: 1.3;
        }
        
        .details {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .detail-item {
            background: rgba(255, 255, 255, 0.6);
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 16px;
            color: #3d2817;
            font-weight: 500;
        }
        
        .cta-section {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        
        .free-badge {
            font-size: 32px;
            font-weight: 800;
            color: #c9945a;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .signup-url {
            background: #c9945a;
            color: #fff;
            padding: 18px 40px;
            border-radius: 28px;
            font-size: 22px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="tag">Community Workshop</div>
            <h1 class="title">Intro to Bread Baking</h1>
            <p class="subtitle">Learn to bake artisan bread at home</p>
        </div>
        
        <div class="middle">
            <div class="info-block">
                <div class="info-label">📅 When</div>
                <div class="info-content">Saturday, March 14 at 10:00 AM</div>
            </div>
            
            <div class="info-block">
                <div class="info-label">📍 Where</div>
                <div class="info-content">Eastmoor Library<br>Community Room B</div>
            </div>
        </div>
        
        <div class="details">
            <div class="detail-item">👕 Bring an apron</div>
            <div class="detail-item">🎉 Free to attend</div>
        </div>
        
        <div class="cta-section">
            <div class="free-badge">FREE</div>
            <a href="https://eastmoor.example/bread" class="signup-url">Sign Up Today</a>
        </div>
    </div>
</body>
</html>
